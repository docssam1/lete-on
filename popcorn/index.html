<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>팝콘 실험실</title>
<!-- 팝콘 실험실 입구(2026-10-20 science-lab/popcorn/ 에서 옮김). 과학 탐구 랩·교과 프로그램과는 다른 프로그램이다. 호를 새로 만들면 아래 목록에 한 줄 더한다. -->
<style>
  :root{--bg:#f6f4ee;--ink:#1f2a44;--sub:#5b6577;--card:#fff;--line:#e3ded2;--accent:#237e7a}
  @media (prefers-color-scheme:dark){:root{--bg:#141a22;--ink:#eef2f8;--sub:#a9b4c6;--card:#1d2530;--line:#2c3644;--accent:#5cc7bf}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{max-width:880px;margin:0 auto;padding:48px 16px 64px}
  h1{font-size:clamp(28px,6vw,40px);margin:0 0 8px}
  p.lead{color:var(--sub);margin:0 0 28px;font-size:17px;line-height:1.6}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  a.kit{display:block;height:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
  a.kit:hover,a.kit:focus-visible{transform:translateY(-2px);border-color:var(--accent)}
  a.kit small{color:var(--accent);font-weight:800;letter-spacing:.04em}
  a.kit b{display:block;font-size:21px;margin:6px 0 6px}
  a.kit span{color:var(--sub);font-size:15px;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>팝콘 실험실</h1>
  <p class="lead">실제 키트를 열고, 조립하고, 관찰한 것을 내 생각으로 이어 가는 실험실이에요.</p>
  <ul>
    <li><a class="kit" href="charles-01/current/companion/#home"><small>샤를 1호</small><b>먹이를 먹는 자석 악어</b><span>자석 악어와 보내는 일주일 — 봉투 열기부터 3D 조립·관찰 기록까지</span></a></li>
    <li><a class="kit" href="fabre-09/current/"><small>파브르 9호</small><b>전류 탐험</b><span>전지와 전구를 이어 보며 전류가 흐르는 길을 찾아요</span></a></li>
  </ul>
</main>
</body>
</html>
