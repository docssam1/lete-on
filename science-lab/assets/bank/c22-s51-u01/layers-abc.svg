<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="세 지층의 위치"><rect width="720" height="380" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,sans-serif" fill="#182230"><text x="24" y="37" font-size="28" font-weight="700">세 지층의 위치</text><rect x="75" y="75" width="570" height="62" fill="#eaf0ff" stroke="#566274" stroke-width="3"/><text x="100" y="118.0" font-size="36" font-weight="700">다</text><rect x="75" y="137" width="570" height="94" fill="#d5dbe4" stroke="#566274" stroke-width="3"/><text x="100" y="196.0" font-size="36" font-weight="700">나</text><rect x="75" y="231" width="570" height="62" fill="#f2e8da" stroke="#566274" stroke-width="3"/><text x="100" y="274.0" font-size="36" font-weight="700">가</text><text x="24" y="334" font-size="26" fill="#566274">뒤집히거나 순서가 바뀌지 않은 지층</text><text x="24" y="364" font-size="26" fill="#566274">실제 크기 비율을 나타낸 그림은 아니에요</text></g></svg>