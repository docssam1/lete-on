<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><title>같은 자의 책상 밖 길이 비교 계획</title><desc>고정 방법과 튕기는 정도를 같게 하며 책상 밖 길이를 다르게 하는 설명 그림. 실제 측정값이나 결과가 아님.</desc><rect width="1200" height="600" fill="white"/><g font-family="Pretendard, sans-serif" fill="#182230"><text x="50" y="48" font-size="30" font-weight="700">같은 자 · 고정 방법과 튕기는 정도는 같게</text><g stroke="#566274" stroke-width="3"><path d="M80 170H760V245H80Z" fill="#f5f6f8"/><path d="M80 420H760V495H80Z" fill="#f5f6f8"/><path d="M760 100V540" stroke-dasharray="8 8"/></g><g fill="#eaf0ff" stroke="#2456c4" stroke-width="4"><rect x="280" y="147" width="700" height="22" rx="4"/><rect x="410" y="397" width="700" height="22" rx="4"/></g><g fill="#566274"><rect x="665" y="119" width="70" height="28" rx="4"/><rect x="665" y="369" width="70" height="28" rx="4"/></g><text x="100" y="130" font-size="25">비교 가</text><text x="100" y="380" font-size="25">비교 나</text><text x="790" y="225" font-size="24">책상 밖 길이</text><text x="790" y="475" font-size="24">책상 밖 길이</text><text x="550" y="290" font-size="22">선생님과 고정을 확인해요.</text><text x="50" y="570" font-size="22" fill="#566274">설명용 계획 그림 · 비율과 길이는 실제 측정값이 아니에요.</text></g></svg>
