<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><title>길이 다른 관 피리의 조립 계획</title><desc>같은 재료와 굵기의 관을 길이만 다르게 준비하고 한쪽 끝을 막아 조립하는 계획. 교사가 자르고 다듬은 개인 도구를 사용함.</desc><rect width="1200" height="600" fill="white"/><g font-family="Pretendard, sans-serif" fill="#182230"><text x="50" y="50" font-size="30" font-weight="700">길이는 다르게 · 재료와 굵기는 같게</text><g fill="#eaf0ff" stroke="#2456c4" stroke-width="4"><rect x="150" y="150" width="58" height="310" rx="4"/><rect x="235" y="150" width="58" height="270" rx="4"/><rect x="320" y="150" width="58" height="230" rx="4"/><rect x="405" y="150" width="58" height="190" rx="4"/><rect x="490" y="150" width="58" height="150" rx="4"/></g><g fill="white" stroke="#566274" stroke-width="3"><ellipse cx="179" cy="150" rx="29" ry="9"/><ellipse cx="264" cy="150" rx="29" ry="9"/><ellipse cx="349" cy="150" rx="29" ry="9"/><ellipse cx="434" cy="150" rx="29" ry="9"/><ellipse cx="519" cy="150" rx="29" ry="9"/></g><path d="M135 210H565V245H135Z" fill="#566274"/><g stroke="#2456c4" stroke-width="9"><path d="M152 458H206M237 418H291M322 378H376M407 338H461M492 298H546"/></g><g font-size="25"><text x="650" y="165">선생님이 절단·끝 다듬기</text><text x="650" y="225">개인용 관으로 조립하기</text><text x="650" y="285">같은 막음 조건 확인하기</text><text x="650" y="345">같은 방법으로 부드럽게 불기</text><text x="650" y="405">실제 높낮이와 수정 기록하기</text></g><text x="50" y="565" font-size="22" fill="#566274">설명용 계획 그림 · 길이·비율·배열은 실제 제작 결과가 아니에요.</text></g></svg>
