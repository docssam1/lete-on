<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img"><rect width="640" height="580" fill="white"/><style>text{font-family:Pretendard,Apple SD Gothic Neo,sans-serif;fill:#182230;font-size:27px} .title{font-size:31px;font-weight:700}.small{font-size:23px}.blue{fill:#2456c4}</style><text x="24" y="46" class="title">조사에서 토의 · 실천 · 수정으로</text><rect x="22" y="78" width="596" height="119" rx="5" fill="#f5f6f8" stroke="#d8dee8"/><text x="42" y="115" class="blue">1. 조사한 문제와 원인 자료</text><text x="42" y="152" class="">직접 확인한 범위와 출처를 밝혀요.</text><text x="42" y="183" class="small">확인되지 않은 원인은 더 알아봐요.</text><rect x="22" y="228" width="596" height="119" rx="5" fill="#f5f6f8" stroke="#d8dee8"/><text x="42" y="265" class="blue">2. 실제 토의와 실행 가능한 계획</text><text x="42" y="302" class="">행동·장소·시기·역할·확인 방법</text><text x="42" y="333" class="small">받은 의견과 미토의를 구별해요.</text><rect x="22" y="378" width="596" height="119" rx="5" fill="#f5f6f8" stroke="#d8dee8"/><text x="42" y="415" class="blue">3. 실제 실행 뒤 확인하고 바꾸기</text><text x="42" y="452" class="">한 일 / 못 한 일 / 확인한 변화</text><text x="42" y="483" class="small">계획·자료 저장과 실제 실천을 나눠요.</text><text x="24" y="555" class="small">지필드 계획 그림 · 실제 학생 수행이 아니에요.</text></svg>