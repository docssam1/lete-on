<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img"><rect width="640" height="580" fill="white"/><style>text{font-family:Pretendard,Apple SD Gothic Neo,sans-serif;fill:#182230;font-size:27px} .title{font-size:31px;font-weight:700}.small{font-size:23px}.blue{fill:#2456c4}</style><text x="24" y="46" class="title">생태계 조사 · 기록 계획 예</text><rect x="22" y="78" width="596" height="119" rx="5" fill="#f5f6f8" stroke="#d8dee8"/><text x="42" y="115" class="blue">1. 어디서 · 언제 · 어떤 방법으로?</text><text x="42" y="152" class="">직접 조사 / 제공 사진 / 앞으로 계획</text><text x="42" y="183" class="small">구역·날짜·조건·미실행을 나눠요.</text><rect x="22" y="228" width="596" height="119" rx="5" fill="#f5f6f8" stroke="#d8dee8"/><text x="42" y="265" class="blue">2. 무엇을 확인했고 어떻게 분류할까?</text><text x="42" y="302" class="">생물 요소 ↔ 물·빛·흙 등 환경</text><text x="42" y="333" class="small">모르는 이름과 안 보인 생물은 미확인.</text><rect x="22" y="378" width="596" height="119" rx="5" fill="#f5f6f8" stroke="#d8dee8"/><text x="42" y="415" class="blue">3. 관계를 설명할 근거가 있는가?</text><text x="42" y="452" class="">관찰한 사실 / 조사한 설명 / 내 추측</text><text x="42" y="483" class="small">먹이·개체 수·오염 원인은 더 확인해요.</text><text x="24" y="555" class="small">지필드 계획 그림 · 실제 현장 결과가 아니에요.</text></svg>