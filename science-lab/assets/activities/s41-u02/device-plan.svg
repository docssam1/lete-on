<title id="t">증발·응결·수집 경로를 생각하는 장치 설계 계획</title><desc id="d">원래 물이 든 큰 그릇 가운데 빈 컵을 세우고, 투명 덮개 가운데를 낮추어 컵 위로 물방울을 이끌 계획이다. 컵 입구는 원래 물보다 높다. 실제 제작 결과나 수집량을 표시하지 않았다.</desc>
