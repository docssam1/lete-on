<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-labelledby="t d"><title id="t">관찰 기록을 나누는 계획</title><desc id="d">직접 보인 사실, 출처 있는 자료 설명, 아직 미확인인 추측을 구별하는 기록 계획</desc><rect width="640" height="570" fill="white"/><g font-family="Pretendard, sans-serif" fill="#182230"><text x="28" y="44" font-size="30" font-weight="700">본 것·자료 설명·미확인을 나눠요</text><rect x="28" y="76" width="584" height="142" rx="6" fill="white" stroke="#566274"/><text x="48" y="112" font-size="29" font-weight="700">① 직접 보인 사실</text><text x="48" y="157" font-size="27">대상·날짜·위치·도구·배율</text><text x="48" y="195" font-size="27">사진 / 영상 / 준비 표본 구별</text><rect x="28" y="238" width="584" height="142" rx="6" fill="white" stroke="#566274"/><text x="48" y="274" font-size="29" font-weight="700">② 자료의 설명</text><text x="48" y="319" font-size="27">제목·기관·주소·확인 날짜</text><text x="48" y="357" font-size="27">사는 곳·생활 영향과 그 조건</text><rect x="28" y="400" width="584" height="142" rx="6" fill="white" stroke="#566274"/><text x="48" y="436" font-size="29" font-weight="700">③ 아직 미확인</text><text x="48" y="481" font-size="27">보이지 않은 부분·추측·한계</text><text x="48" y="519" font-size="27">다음에 더 확인할 근거</text></g></svg>
