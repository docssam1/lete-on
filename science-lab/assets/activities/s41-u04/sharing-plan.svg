<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="t d"><title id="t">소개 자료 제작과 공유 계획</title><desc id="d">실제 자료의 초안, 실제 공유, 실제 의견, 근거를 확인한 수정을 나누는 계획</desc><rect width="640" height="470" fill="white"/><g font-family="Pretendard, sans-serif" fill="#182230"><text x="28" y="42" font-size="30" font-weight="700">자료를 만들고 실제로 공유해요</text><text x="28" y="82" font-size="28">저장·전달·의견·수정을 구별해요</text><rect x="28" y="112" width="280" height="154" rx="6" fill="white" stroke="#566274"/><text x="44" y="151" font-size="28" font-weight="700">① 실제 자료</text><text x="44" y="198" font-size="26">본문·그림·출처</text><text x="44" y="238" font-size="26">초안과 수정판</text><rect x="332" y="112" width="280" height="154" rx="6" fill="white" stroke="#566274"/><text x="348" y="151" font-size="28" font-weight="700">② 실제 공유</text><text x="348" y="198" font-size="26">날짜·대상·방법</text><text x="348" y="238" font-size="26">보여 준 내용</text><rect x="28" y="292" width="280" height="154" rx="6" fill="white" stroke="#566274"/><text x="44" y="331" font-size="28" font-weight="700">③ 실제 의견</text><text x="44" y="378" font-size="26">질문·답·미수신</text><text x="44" y="418" font-size="26">예상 의견과 구별</text><rect x="332" y="292" width="280" height="154" rx="6" fill="white" stroke="#566274"/><text x="348" y="331" font-size="28" font-weight="700">④ 근거로 수정</text><text x="348" y="378" font-size="26">수정 전과 후</text><text x="348" y="418" font-size="26">재공유 / 다음 계획</text></g></svg>
