<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img"><title>공기 인형 · 구조와 목표를 연결하는 설계 예</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2456c4"/></marker></defs><rect width="1000" height="540" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,sans-serif" fill="#182230"><text x="35" y="44" font-size="27" font-weight="700">공기 인형 · 구조와 목표를 연결하는 설계 예</text><g stroke="#566274" stroke-width="4" fill="none"><rect x="75" y="275" width="150" height="90" rx="25"/><path d="M225 315H390Q440 315 440 280H560"/><path d="M565 230Q645 190 760 230L800 355Q650 395 540 355Z"/><path d="M620 225L620 130H710V225M625 155H705"/></g><circle cx="665" cy="104" r="24" fill="#eaf0ff" stroke="#566274" stroke-width="3"/><path d="M265 295H385" stroke="#2456c4" stroke-width="4" marker-end="url(#arrow)"/><text x="55" y="420" font-size="23">손 펌프</text><text x="285" y="260" font-size="23">관 · 공기 이동</text><text x="560" y="420" font-size="23">얇은 주머니</text><text x="765" y="130" font-size="23">가벼운 종이 인형</text><path d="M762 137L710 165" stroke="#566274" stroke-width="2"/><text x="50" y="468" font-size="21">입구 밀봉·관 막힘·인형 무게 확인 / 천천히 작동 / 팽팽해지기 전 멈춤</text><text x="35" y="516" font-size="17" fill="#566274">GFIELD · 지필드 작성 계획도 · 눈금/크기는 실측값·실제 학생 결과가 아님</text></g></svg>