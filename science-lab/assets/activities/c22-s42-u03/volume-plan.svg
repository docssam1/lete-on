<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img"><title>부피 비교 · 바꾼 조건과 같은 조건을 나누기</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2456c4"/></marker></defs><rect width="1000" height="540" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,sans-serif" fill="#182230"><text x="35" y="44" font-size="27" font-weight="700">부피 비교 · 바꾼 조건과 같은 조건을 나누기</text><path d="M500 90V465" stroke="#d8dee8" stroke-width="3"/><text x="35" y="102" font-size="24" font-weight="700">압력 비교</text><g fill="none" stroke="#566274" stroke-width="4"><rect x="90" y="170" width="280" height="90"/><path d="M150 170V260M150 215H50M50 190V240M370 215H410M410 195V235"/></g><path d="M40 305H165" stroke="#2456c4" stroke-width="4" marker-end="url(#arrow)"/><text x="190" y="312" font-size="22">천천히 누르고 놓기</text><text x="35" y="371" font-size="22">같은 공기 양·비슷한 온도</text><text x="35" y="410" font-size="22">끝 막기·누출/마찰 확인</text><text x="535" y="102" font-size="24" font-weight="700">온도 비교</text><g fill="none" stroke="#566274" stroke-width="4"><path d="M570 210V330H920V210"/><rect x="700" y="175" width="100" height="140" rx="10"/><path d="M720 175V150H780V175"/><path d="M720 150C680 115 800 115 780 150"/></g><path d="M575 280H695M805 280H915" stroke="#2456c4" stroke-width="3"/><text x="535" y="371" font-size="22">같은 공기 양·바깥 압력</text><text x="535" y="410" font-size="22">움직이는 주머니·온도/시간 확인</text><text x="35" y="516" font-size="17" fill="#566274">GFIELD · 지필드 작성 계획도 · 눈금/크기는 실측값·실제 학생 결과가 아님</text></g></svg>