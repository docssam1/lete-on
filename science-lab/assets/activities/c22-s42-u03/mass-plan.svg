<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img"><title>공기 전후 비교 · 바깥 부피와 부품을 같게</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2456c4"/></marker></defs><rect width="1000" height="540" fill="white"/><g font-family="Pretendard,Apple SD Gothic Neo,sans-serif" fill="#182230"><text x="35" y="44" font-size="27" font-weight="700">공기 전후 비교 · 바깥 부피와 부품을 같게</text><g fill="none" stroke="#566274" stroke-width="4"><rect x="115" y="350" width="290" height="70" rx="8"/><rect x="595" y="350" width="290" height="70" rx="8"/><rect x="195" y="170" width="130" height="175" rx="12"/><rect x="675" y="170" width="130" height="175" rx="12"/><path d="M220 170V150H300V170M700 170V150H780V170"/></g><text x="130" y="111" font-size="23">주변 압력의 공기 · 전</text><text x="610" y="111" font-size="23">교사가 공기 넣기/빼기 · 후</text><path d="M405 235H580" stroke="#2456c4" stroke-width="4" marker-end="url(#arrow)"/><text x="420" y="215" font-size="18">펌프는 떼고 재기</text><text x="155" y="393" font-size="22">전 읽기값: ______</text><text x="635" y="393" font-size="22">후 읽기값: ______</text><text x="100" y="465" font-size="22">같은 용기·마개/밸브·마른 표면·저울 / 실제 값·표시 단위·누출 확인</text><text x="35" y="516" font-size="17" fill="#566274">GFIELD · 지필드 작성 계획도 · 눈금/크기는 실측값·실제 학생 결과가 아님</text></g></svg>