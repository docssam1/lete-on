<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">흙 언덕 기울기 비교 계획</title><desc id="desc">처음 언덕을 각각 준비하고 받침 기울기만 다르게 한다. 흙 종류/양·처음 모양·물 양·붓는 위치/시간을 맞춘다. 실제 결과 그림이 아니다.</desc><style>text{font-family:Arial,sans-serif;fill:#182230;font-size:28px}.small{font-size:25px}.line{stroke:#566274;stroke-width:3;fill:none}</style><rect width="640" height="400" fill="white"/><text x="20" y="40">기울기 비교 · 결과가 아닌 계획</text><g transform="translate(25 215) rotate(-8) scale(.75)"><path d="M0 0 L350 0 L350 45 L0 45 Z" fill="#eaf0ff" stroke="#566274" stroke-width="3"/><path d="M20 0 Q60 -125 105 -65 Q155 -10 270 0Z" fill="#c9bdab" stroke="#566274" stroke-width="3"/><path d="M45 -135 L95 -135 L90 -95 L50 -95Z" fill="#eaf0ff" stroke="#2456c4" stroke-width="3"/></g><g transform="translate(350 215) rotate(-20) scale(.75)"><path d="M0 0 L350 0 L350 45 L0 45 Z" fill="#eaf0ff" stroke="#566274" stroke-width="3"/><path d="M20 0 Q60 -125 105 -65 Q155 -10 270 0Z" fill="#c9bdab" stroke="#566274" stroke-width="3"/><path d="M45 -135 L95 -135 L90 -95 L50 -95Z" fill="#eaf0ff" stroke="#2456c4" stroke-width="3"/></g><text x="45" y="290">A · 낮은 받침</text><text x="365" y="290">B · 높은 받침</text><text class="small" x="20" y="340">같게: 흙 · 처음 모양 · 물 양 · 붓는 위치/시간</text><text class="small" x="20" y="380">반복마다 처음 언덕을 따로 준비해요</text></svg>