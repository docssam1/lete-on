<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">실온 물 화산 모형 계획</title><desc id="desc">안정된 점토 산의 위쪽 열린 홈에 작은 숟가락으로 실온 물을 넣는다. 흘러나오는 모습만 표현하며 실제 용암의 재료/온도/분출 원인을 재현하지 못한다.</desc><style>text{font-family:Arial,sans-serif;fill:#182230;font-size:28px}.small{font-size:25px}.line{stroke:#566274;stroke-width:3;fill:none}</style><rect width="640" height="440" fill="white"/><text x="20" y="40">실온 물 · 흘러나오는 모습만 표현</text><path d="M30 330 L430 330 L430 355 L30 355Z" fill="#eaf0ff" stroke="#566274" stroke-width="3"/><path d="M65 330 L190 165 Q210 150 230 165 L385 330Z" fill="#c9bdab" stroke="#566274" stroke-width="3"/><path d="M187 165 Q210 195 233 165" fill="#eaf0ff" stroke="#2456c4" stroke-width="4"/><path d="M180 105 Q210 95 240 105 L320 80" class="line"/><path d="M211 122 L211 144" stroke="#2456c4" stroke-width="4"/><text class="small" x="335" y="90">실온 물 · 숟가락</text><path d="M240 173 L355 173" class="line"/><text x="370" y="181">열린 홈</text><path d="M330 285 L420 265" class="line"/><text x="435" y="270">점토 산</text><text x="35" y="390">받침 쟁반 · 마시거나 가열하지 않아요</text><text class="small" x="20" y="430">실제 용암의 물질·온도·원리와 달라요</text></svg>