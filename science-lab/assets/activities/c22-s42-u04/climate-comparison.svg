<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#142c4b;font-size:23px}.small{font-size:19px}.title{font-size:30px;font-weight:700}.label{font-weight:700}</style><rect width="900" height="440" rx="18" fill="#f4f7fc"/><text x="34" y="48" class="title">같은 전국 연평균기온을 비교해요</text><text x="34" y="83" class="small">기상청 2025-01-09 발표 · 평년 1991~2020년 · 단위 ℃</text><line x1="170" y1="300" x2="810" y2="300" stroke="#7487a3" stroke-width="2"/><line x1="170" y1="125" x2="170" y2="300" stroke="#7487a3" stroke-width="2"/><text x="34" y="174">평년</text><text x="34" y="254">2024년</text><rect x="170" y="138" width="500" height="45" fill="#a2b7de"/><rect x="170" y="218" width="580" height="45" fill="#2456c4"/><text x="685" y="171" class="label">12.5℃</text><text x="763" y="251" class="label">14.5℃</text><text x="165" y="332" class="small">0</text><text x="363" y="332" class="small">5</text><text x="558" y="332" class="small">10</text><text x="758" y="332" class="small">15</text><text x="34" y="382">평년보다 2.0℃ 높아요 · 전국의 한 해 평균이에요</text><text x="34" y="414" class="small">우리 학교 하루 기온·내 실측·현재 최신 순위를 뜻하지 않아요.</text></svg>