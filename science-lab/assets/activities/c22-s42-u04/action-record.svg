<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#142c4b;font-size:23px}.small{font-size:19px}.title{font-size:30px;font-weight:700}.label{font-weight:700}</style><rect width="900" height="440" rx="18" fill="#f4f7fc"/><text x="34" y="48" class="title">날짜별 실천과 의견으로 다음 행동을 고쳐요</text><text x="34" y="83" class="small">지필드 기록 계획 · 실제 학생 실천/받은 의견 예시가 아니에요</text><rect x="35" y="123" width="245" height="160" rx="12" fill="#fff" stroke="#9db4dc" stroke-width="2"/><rect x="325" y="123" width="245" height="160" rx="12" fill="#fff" stroke="#9db4dc" stroke-width="2"/><rect x="615" y="123" width="245" height="160" rx="12" fill="#fff" stroke="#9db4dc" stroke-width="2"/><text x="60" y="163" class="label">날짜·실제 행동</text><text x="60" y="209">함 / 일부 / 못 함</text><text x="60" y="251" class="small">횟수·시간·근거</text><text x="350" y="163" class="label">어려움·공동 도움</text><text x="350" y="209">받은 의견 / 미수신</text><text x="350" y="251" class="small">실제 수정 전·후</text><text x="640" y="163" class="label">다음 날짜에 다시</text><text x="640" y="209">새 실천 / 아직 계획</text><text x="640" y="251" class="small">새 기록으로 보관</text><path d="M286 202H314M306 194L314 202L306 210M576 202H605M597 194L605 202L597 210" stroke="#2456c4" stroke-width="4" fill="none"/><text x="34" y="350">건강·안전·여건을 지키고 함께 할 역할을 정해요.</text><text x="34" y="392" class="small">행동 횟수 ≠ 지구 기온이나 탄소 감소를 직접 측정한 값</text></svg>