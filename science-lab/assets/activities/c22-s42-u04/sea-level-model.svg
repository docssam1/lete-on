<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#142c4b;font-size:23px}.small{font-size:19px}.title{font-size:30px;font-weight:700}.label{font-weight:700}</style><rect width="900" height="440" rx="18" fill="#f4f7fc"/><text x="34" y="48" class="title">같은 육지·집에서 물높이만 바꾸어요</text><text x="34" y="82" class="small">지필드 피해 모형 계획 · 실제 실험값/축척이 아니에요</text><path d="M60 118V333H833V118" fill="white" stroke="#7487a3" stroke-width="5"/><path d="M85 320L410 320L505 240L620 240L690 155H810V320Z" fill="#d9c5a5" stroke="#8b795b" stroke-width="3"/><rect x="520" y="193" width="48" height="47" fill="#f7da6a" stroke="#805e27" stroke-width="2"/><path d="M514 193L544 166L575 193Z" fill="#ce755e"/><rect x="725" y="108" width="48" height="47" fill="#f7da6a" stroke="#805e27" stroke-width="2"/><path d="M720 108L749 83L778 108Z" fill="#ce755e"/><path d="M62 273H465V320H62Z" fill="#a5d8f4" opacity=".65"/><line x1="65" y1="273" x2="470" y2="273" stroke="#2456c4" stroke-width="4"/><line x1="65" y1="218" x2="610" y2="218" stroke="#2456c4" stroke-width="4" stroke-dasharray="12 9"/><text x="95" y="254" class="small">처음</text><text x="95" y="202" class="small">높인 뒤 · 계획선</text><text x="584" y="182">집 A</text><text x="785" y="130">B</text><line x1="380" y1="140" x2="380" y2="320" stroke="#4b5361" stroke-width="5"/><text x="230" y="126" class="small">같은 자·바닥 기준</text><text x="34" y="380">지형·집 위치를 고정하고 젖는 범위를 비교해요.</text><text x="34" y="414" class="small">실제 바다의 모든 원인·파도·침수 연도를 재현한 모형은 아니에요.</text></svg>