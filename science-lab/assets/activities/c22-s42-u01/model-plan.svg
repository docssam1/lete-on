<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" font-family="sans-serif" fill="#182230"><rect width="640" height="530" fill="white"/><text x="20" y="40" font-size="30" font-weight="bold">이름과 가까운 순서를 나타내는 설계 예</text><circle cx="104" cy="91" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="104" y="145" text-anchor="middle" font-size="30">태양</text><circle cx="316" cy="91" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="316" y="145" text-anchor="middle" font-size="30">1 수성</text><circle cx="528" cy="91" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="528" y="145" text-anchor="middle" font-size="30">2 금성</text><circle cx="104" cy="191" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="104" y="245" text-anchor="middle" font-size="30">3 지구</text><circle cx="316" cy="191" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="316" y="245" text-anchor="middle" font-size="30">4 화성</text><circle cx="528" cy="191" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="528" y="245" text-anchor="middle" font-size="30">5 목성</text><circle cx="104" cy="291" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="104" y="345" text-anchor="middle" font-size="30">6 토성</text><circle cx="316" cy="291" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="316" y="345" text-anchor="middle" font-size="30">7 천왕성</text><circle cx="528" cy="291" r="19" fill="#EAF0FF" stroke="#2456C4" stroke-width="2"/><text x="528" y="345" text-anchor="middle" font-size="30">8 해왕성</text><text x="20" y="398" font-size="29">같은 크기·같은 간격은 설계의 편의예요.</text><text x="20" y="444" font-size="29">실제 크기·거리·한 시각의 위치와 달라요.</text><text x="20" y="500" font-size="29">계획 예시 · 실제 제작 결과가 아니에요.</text></svg>