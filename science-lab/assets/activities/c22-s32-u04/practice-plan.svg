<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">실천 기회를 돌아보는 기록 계획</title><desc id="desc">실천할 기회와 실제로 한 행동, 어려웠던 점, 다음 행동을 차례로 기록한다. 계획, 미기록, 미실천, 실제 수행은 구별하며 실제 학생의 결과는 적혀 있지 않다.</desc><style>text{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#182230;font-size:34px}.box{fill:white;stroke:#566274;stroke-width:2}.a{fill:#eaf0ff;stroke:#2456c4;stroke-width:2}.note{font-size:27px;fill:#566274}</style><rect width="760" height="430" fill="white"/><text x="24" y="44">세 기회를 실제 기록으로 돌아봐요</text><rect class="a" x="24" y="70" width="320" height="100" rx="5"/><text x="45" y="113">언제·어떤 기회?</text><text class="note" x="45" y="149">날짜와 상황</text><text x="360" y="133">→</text><rect class="box" x="414" y="70" width="320" height="100" rx="5"/><text x="435" y="113">실제로 무엇을?</text><text class="note" x="435" y="149">수행·미실천·미기록</text><path d="M574 181V217H184V244" fill="none" stroke="#2456c4" stroke-width="3"/><path d="M175 235L184 246L193 235" fill="none" stroke="#2456c4" stroke-width="3"/><rect class="box" x="24" y="257" width="320" height="100" rx="5"/><text x="45" y="300">어려웠던 점은?</text><text class="note" x="45" y="336">없으면 없음으로</text><text x="360" y="320">→</text><rect class="a" x="414" y="257" width="320" height="100" rx="5"/><text x="435" y="300">다음에 어떻게?</text><text class="note" x="435" y="336">도움과 개선 행동</text><text class="note" x="24" y="412">아직 하지 않은 일은 계획 · 실제 건강 판정 아님</text></svg>
