<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">여섯 카드와 세 차례의 연결 계획</title><desc id="desc">시작에는 A 카드에만 동그라미 표식을 놓는다. 1차는 A와 B, C와 D, E와 F. 2차는 B와 C, D와 E, F와 A. 3차는 C와 D, E와 F, A와 B를 연결한다. 결과 값은 표시하지 않았다.</desc><style>text{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#182230;font-size:34px}.card{fill:white;stroke:#566274;stroke-width:2}.note{font-size:27px;fill:#566274}.pair{fill:#eaf0ff;stroke:#2456c4;stroke-width:2}</style><rect width="760" height="430" fill="white"/><text x="24" y="44">시작: A에만 ●</text><g text-anchor="middle"><rect class="card" x="24" y="62" width="104" height="62" rx="4"/><text x="76" y="106">A ●</text><rect class="card" x="145" y="62" width="104" height="62" rx="4"/><text x="197" y="106">B</text><rect class="card" x="266" y="62" width="104" height="62" rx="4"/><text x="318" y="106">C</text><rect class="card" x="387" y="62" width="104" height="62" rx="4"/><text x="439" y="106">D</text><rect class="card" x="508" y="62" width="104" height="62" rx="4"/><text x="560" y="106">E</text><rect class="card" x="629" y="62" width="104" height="62" rx="4"/><text x="681" y="106">F</text></g><g><text x="24" y="183">1차</text><rect class="pair" x="124" y="142" width="610" height="58" rx="4"/><text x="151" y="183">A — B　 C — D　 E — F</text><text x="24" y="258">2차</text><rect class="pair" x="124" y="217" width="610" height="58" rx="4"/><text x="151" y="258">B — C　 D — E　 F — A</text><text x="24" y="333">3차</text><rect class="pair" x="124" y="292" width="610" height="58" rx="4"/><text x="151" y="333">C — D　 E — F　 A — B</text></g><text class="note" x="24" y="390">같은 연결 순서 · 표식 보관 규칙만 다르게</text><text class="note" x="24" y="422">학습용 표식 ≠ 실제 병원체·감염자</text></svg>
