import{chapter,art}from'../../../data/book/c22-s51-u04.book.js';import{renderChapter}from'../../../v2/book.js';
const params=new URLSearchParams(location.search),teacher=params.get('mode')==='teacher',all=params.get('all')==='1',host=document.querySelector('#book');host.innerHTML=renderChapter(chapter,art,[],{teacher}).replaceAll('src="../assets/','src="../../../assets/');
