<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>교구 찾기</title>
<!-- 학습지 종이 교구 지면의 "A 구매하여 사용하기" QR 이 오는 곳 (2026-09-08, 원장 "구매하여 사용하기 QR 코드 해야지").
     왜 바로 쇼핑 주소로 안 보내고 여기를 거치는가 —
     ① QR 크기. 네이버 검색 주소는 한글이 퍼센트 인코딩돼 90자가 넘고, 18~24mm QR 에 넣으면 모듈이 너무 촘촘해
        300dpi 인쇄본에서 폰이 못 읽는다(실측: 600dpi 에서만 디코딩됐다). 여기 주소는 ASCII 40자 안쪽이라
        모듈이 굵어져 인쇄본에서 읽힌다.
     ② 이미 나간 학습지. 종이는 회수가 안 되므로 목적지가 바뀔 때(쇼핑몰 변경·제휴 링크 도입 등)
        이 표만 고치면 옛 학습지의 QR 도 계속 맞는다.
     형식: /g/?key   (key = data/paper-tools.js 의 buy.key)
     제휴 링크를 쓰게 되면 대가성 표시를 이 페이지에 함께 띄워야 한다. -->
<style>body{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;padding:28px;color:#333;line-height:1.7}
a{color:#0E2C57}b{display:block;font-size:19px;margin-bottom:6px}small{color:#777}</style>
</head><body>
<p id="m">교구를 찾는 중…</p>
<script>
(function(){
  /* 검색어만 둔다. 특정 상품 번호·가격은 두지 않는다 — 가격은 매일 바뀌고 상품 페이지는 사라진다.
     학부모가 오늘 가격으로 직접 고르는 것이 우리 기준(원장 "질과 낮은 가격, 가성비"). */
  var TOOLS = {
    cubes:   { name: '멀티큐브 100개',     q: '멀티큐브',
               tip: '100개 이상, 한 손에 잡히는 2cm 안팎, 색이 여러 가지인 것.' },
    baseten: { name: '십진 블록 세트',    q: '십진블록',
               tip: '낱개 100개, 십 막대 20개 이상. 백 판이 들어 있으면 더 좋습니다.' },
    tape:    { name: '천 줄자 2m',        q: '천 줄자',
               tip: '숫자가 큼직한 것. 쇠 줄자보다 천 줄자가 아이에게 안전합니다.' },
    tiles:   { name: '투명 색타일 100개', q: '투명 색타일 교구',
               tip: '같은 크기 정사각형 100개. 2.5cm 안팎이면 배열이 눈에 잘 들어옵니다.' },
    balance: { name: '양팔 저울',         q: '양팔저울 학습교구',
               tip: '접시가 크고 추가 함께 오는 것. 플라스틱이면 충분합니다.' },
    fracdisc:{ name: '분수 원판 세트',    q: '분수 원판 교구',
               tip: '1, 1/2, 1/3, 1/4, 1/6, 1/8 이 다 들어 있는 것. 분모마다 색이 다르면 좋습니다.' },
    scale:   { name: '주방 저울',         q: '주방저울 0.1g',
               tip: '0.1g 또는 1g 단위로 읽히는 것. 화면 숫자가 큰 것이 좋습니다.' },
    pentomino:{name: '펜토미노 세트',     q: '펜토미노 교구',
               tip: '12조각이 다 있는 것. 판이 함께 오면 더 좋습니다.' },
    thermo:  { name: '실내 온도계',       q: '실내 온도계',
               tip: '영하 20도까지 읽히고 눈금이 큼직한 것. 알코올식이면 충분합니다.' },
    algtile: { name: '대수 타일 세트',    q: '대수타일',
               tip: 'x², x, 1 세 종류가 다 있고 앞뒤 색이 다른 것.' },
    graphpad:{ name: '모눈 공책 (5mm)',   q: '모눈 공책 5mm',
               tip: '5mm 모눈, 줄이 옅은 것. 진하면 그린 선이 안 보입니다.' },
    protractor:{name:'각도기와 컴퍼스 세트', q: '각도기 컴퍼스 세트',
               tip: '반투명 각도기(밑에 선이 비치는 것)와 나사로 고정되는 컴퍼스.' }
  };
  var key = (location.search || '').replace(/^\?/, '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  var t = TOOLS[key], el = document.getElementById('m');
  if(!t){
    el.innerHTML = '<b>주소가 올바르지 않아요.</b><small>학습지의 QR 을 다시 찍어 주세요.</small>';
    return;
  }
  var url = 'https://search.shopping.naver.com/search/all?query=' + encodeURIComponent(t.q);
  /* 가성비 안내(2026-09-08) — 원장이 보내 준 교재 교구 목록표(WHY·PreWHY·IG)를 보면 구입처가
     대부분 학원 교구 전문몰이다. 같은 물건이 대형 쇼핑몰보다 싼 경우가 많아 한 줄로 알린다.
     제휴가 아니라 안내이고, 특정 상품·가격은 적지 않는다. */
  el.innerHTML = '<b>' + t.name + '</b><small>살 때 보는 것 — ' + t.tip + '</small>' +
    '<p>검색 결과로 넘어갑니다. 열리지 않으면 <a href="' + url + '">여기</a>를 눌러 주세요.</p>' +
    '<p><small>같은 교구가 <b>학원 교구 전문몰</b>에서 더 싼 경우가 많습니다. ' +
    '&ldquo;' + t.q + '&rdquo; 로 교구몰도 함께 비교해 보세요.</small></p>';
  setTimeout(function(){ location.replace(url); }, 1400);
})();
</script>
</body></html>
