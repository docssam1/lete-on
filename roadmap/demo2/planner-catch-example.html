<body class="roadmap-studio catch-example-page"><header class="catch-example-header"><span>GFIELD · 진도 비교</span><a href="planner.html">로드맵 열기</a></header><main><section class="catch-example-intro"><p class="catch-example-eyebrow">계산을 확인하는 가정 사례</p><h1>따라잡은 뒤에는,<br>같은 속도로 이어집니다.</h1><p>학년과 완료 범위를 가정해 기존 진도표의 일정과 비교합니다. 이 예시에서 보이는 과정은 학생에게 배정하는 목표가 아닙니다.</p><div class="catch-example-options" role="group" aria-label="비교할 예시"><button type="button" data-catch-case="aligned">같은 속도로 이어지는 예시</button><button type="button" data-catch-case="review">복습 구간이 다른 초4 예시</button></div><p id="catchExampleDescription"></p><div class="catch-example-options" role="group" aria-label="목표 추가 회차"><button type="button" data-catch-load="twiceWeekly">주 2회 추가</button><button type="button" data-catch-load="weekly">주 1회 추가</button></div><p>기존 복습·심화·연산은 유지하고, 목표 추가 회차를 시작 0% → 2개월 50% → 4개월 80% → 6개월 100%로 늘립니다. 그 뒤에는 목표 회차를 더 늘리지 않고 합류까지 유지합니다. 추가 회차의 절반을 진도에 반영한다는 비교 가정입니다.</p><p id="catchExampleOutcome" role="status"></p></section><div id="catchExampleGraph"></div></main>
