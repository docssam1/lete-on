<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로드맵 독쌤 · 캐릭터와 대사 준비</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#182230;font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}button{font:inherit;color:inherit;background:#fff;border:1px solid #9ca9bd;border-radius:6px;min-height:44px;padding:10px 14px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #2456c4;outline-offset:3px}button[aria-pressed=true]{background:#eaf0ff;border-color:#2456c4;color:#2456c4}a{color:#2456c4;text-underline-offset:4px}header,main{max-width:1200px;margin:auto;padding:24px 32px}header{border-bottom:1px solid #d8dee8;display:flex;align-items:start;justify-content:space-between;gap:24px}h1{font-size:28px;line-height:1.4;letter-spacing:-.04em;margin:8px 0}h2{font-size:18px;line-height:1.6;margin:0 0 16px}p{margin:8px 0}.eyebrow{color:#2456c4;font-size:13px;font-weight:600;letter-spacing:.04em}.muted,small{color:#566274}.badge{font-size:13px;border:1px solid #d8dee8;border-radius:4px;padding:6px 10px;white-space:nowrap}main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:40px;padding-top:32px}.portrait{margin:0;text-align:center}.portrait img{display:block;width:210px;height:315px;object-fit:contain;margin:0 auto}.portrait figcaption{font-size:14px;color:#566274;margin-top:8px}.pose-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.pose-grid button{font-size:13px;padding:8px}.face-row{display:flex;align-items:center;gap:16px;border-top:1px solid #d8dee8;margin-top:24px;padding-top:24px}.face-row p{font-size:13px;margin:0}.face{position:relative;overflow:hidden;border:1px solid #d8dee8;background:#f5f6f8;border-radius:50%;width:80px;height:80px;flex:none}.face img{position:absolute;width:164px;height:246px;max-width:none;left:-42px;top:-15px;object-fit:contain}.audience{font-size:14px;color:#566274;margin:0 0 16px}.bubble{border:1px solid #d8dee8;border-radius:12px;padding:28px 32px;box-shadow:0 8px 24px #18223008;background:#fff;min-height:190px}.bubble .speaker{font-size:13px;color:#2456c4;font-weight:600}.bubble h2{font-size:15px;color:#566274;margin:8px 0}.bubble-text{font-size:21px;line-height:1.8;max-width:32ch;letter-spacing:-.025em}.context{font-size:13px;color:#566274;margin:14px 0 24px}.groups{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid #d8dee8;padding-top:24px;margin:32px 0 20px}.groups button{font-size:14px}.count{font-size:14px;color:#566274;margin:16px 0}.cue-list{display:grid;gap:0;border-top:1px solid #d8dee8;max-height:660px;overflow:auto;scroll-padding:12px}.cue-list button{display:block;text-align:left;border:0;border-bottom:1px solid #d8dee8;border-radius:0;padding:18px 16px;min-width:0}.cue-list button strong{display:block;font-size:15px;font-weight:500;margin-bottom:6px}.cue-list button span{display:block;font-size:14px;color:#566274;line-height:1.8}.cue-list button[aria-current=true]{background:#eaf0ff;border-left:3px solid #2456c4}.note{margin:24px 0;font-size:13px;color:#566274}.asset-note{margin:24px 0;font-size:13px;color:#566274}.asset-note summary{cursor:pointer;min-height:44px}.asset-note ul{padding-left:20px}footer{max-width:1200px;margin:16px auto 32px;padding:24px 32px;border-top:1px solid #d8dee8;font-size:13px;color:#566274}.error{padding:24px;color:#b42332}
@media(max-width:800px){header,main{padding:20px}header{display:block}header .badge{display:inline-block;margin-top:12px}h1{font-size:25px}main{grid-template-columns:1fr;gap:32px}.character{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}.portrait img{width:120px;height:180px}.portrait figcaption{font-size:12px}.pose-grid{margin-top:0;gap:8px}.pose-grid button{font-size:12px;padding:6px}.face-row{grid-column:1/-1;margin-top:0;padding-top:16px}.bubble{padding:20px;min-height:180px}.bubble-text{font-size:19px}.groups{margin-top:24px}.groups button{font-size:13px;padding:8px 10px}.cue-list{max-height:none;overflow:visible}footer{padding:20px}}
</style>
<header><div><div class="eyebrow">GFIELD · 로드맵 준비자료</div><h1>독쌤 캐릭터와 말풍선</h1><p class="muted">아이의 현재 학습과 선택의 근거를 함께 살피는 학부모 상담 안내입니다.</p></div><span class="badge">준비안 · 화면 연결 전</span></header>
<main id="preview"><p>준비자료를 불러오는 중입니다.</p></main>
<footer>기존 수학 독쌤 이미지를 그대로 사용합니다. 음성·입 움직임·자동 접기·실제 로드맵 연결은 아직 붙이지 않았습니다. <a href="docssam-prep.json">전체 대사와 자산 목록</a></footer>
<script type="module">
const host=document.getElementById('preview'),root=new URL('../../',location.href);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{
 const res=await fetch('./docssam-prep.json');if(!res.ok)throw Error('missing');const pack=await res.json();
 let group='start',cue=pack.cues[0],pose=pack.character.defaultPose;
 const image=id=>new URL(pack.character.frames.find(f=>f.id===id).path,root).href;
 const caption=()=>pack.character.frames.find(f=>f.id===pose).label;
 host.innerHTML=`<aside class="character" aria-label="기존 독쌤 이미지"><figure class="portrait"><img id="portrait" src="${esc(image(pose))}" alt="수학 독쌤 · 기본 안내" width="1024" height="1536"><figcaption id="poseCaption">${esc(caption())}</figcaption></figure><div class="pose-grid" role="group" aria-label="표정 보기">${pack.character.frames.filter(f=>f.role==='body').map(f=>`<button type="button" data-pose="${esc(f.id)}" aria-pressed="${f.id===pose}">${esc(f.label)}</button>`).join('')}</div><div class="face-row"><div class="face"><img id="face" src="${esc(image('listen'))}" alt="같은 전신에서 얼굴 부분을 보여주는 구도 참고"></div><p>접힌 얼굴의 구도 참고<br>같은 전신을 잘라 보여줍니다.<br>접기 동작은 아직 연결 전입니다.</p></div><details class="asset-note"><summary>발화용 프레임 준비</summary><ul>${pack.character.frames.filter(f=>f.role!=='body').map(f=>`<li>${esc(f.label)} · 기존 전신 이미지</li>`).join('')}</ul><p>과학 독쌤의 얼굴 조각을 수학 독쌤에 겹치지 않습니다.</p></details></aside><section aria-label="로드맵 말풍선 대사"><p class="audience">학부모 상담 안내 · 현재 학습 → 선택의 차이 → 다음 판단</p><article class="bubble"><div class="speaker">독쌤</div><h2 id="cueLabel"></h2><p id="cueText" class="bubble-text" role="status" aria-live="polite"></p></article><p id="cueWhen" class="context"></p><nav class="groups" aria-label="대사 단계">${pack.groups.map(g=>`<button type="button" data-group="${esc(g.id)}" aria-pressed="${g.id===group}">${esc(g.label)}</button>`).join('')}</nav><p id="cueCount" class="count"></p><div id="cueList" class="cue-list"></div><p class="note">말풍선의 칭찬·미소는 선택을 정리하는 표현입니다. 실력이나 진학 준비가 끝났다는 뜻으로 사용하지 않습니다.</p></section>`;
 function draw(resetList=false){
  const portrait=document.getElementById('portrait');portrait.src=image(pose);portrait.alt='수학 독쌤 · '+caption();document.getElementById('poseCaption').textContent=caption();
  document.getElementById('cueLabel').textContent=cue.label;document.getElementById('cueText').textContent=cue.variants.parents.text;document.getElementById('cueWhen').textContent=cue.when;
  for(const b of host.querySelectorAll('[data-pose]'))b.setAttribute('aria-pressed',String(b.dataset.pose===pose));
  for(const b of host.querySelectorAll('[data-group]'))b.setAttribute('aria-pressed',String(b.dataset.group===group));
  const rows=pack.cues.filter(c=>c.group===group);document.getElementById('cueCount').textContent=pack.groups.find(g=>g.id===group).label+' · '+rows.length+'개 / 전체 '+pack.cues.length+'개';
  const list=document.getElementById('cueList'),scroll=list.scrollTop;list.innerHTML=rows.map(c=>`<button type="button" data-cue="${esc(c.id)}" aria-current="${c.id===cue.id}"><strong>${esc(c.label)}</strong><span>${esc(c.variants.parents.text)}</span></button>`).join('');list.scrollTop=resetList?0:scroll;
 }
 host.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pose)pose=b.dataset.pose;else if(b.dataset.group){group=b.dataset.group;cue=pack.cues.find(c=>c.group===group);pose=cue.pose;}else if(b.dataset.cue){cue=pack.cues.find(c=>c.id===b.dataset.cue);pose=cue.pose;}else return;draw(!!b.dataset.group);if(b.dataset.cue)host.querySelector('[data-cue="'+b.dataset.cue+'"]')?.focus({preventScroll:true});});draw();
}catch{host.innerHTML='<p class="error">준비자료를 불러오지 못했습니다. 로컬 미리보기에서 이 화면을 새로고침해 주세요.</p>';}
</script>
</html>
