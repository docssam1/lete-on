<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580" role="img" aria-labelledby="title desc"><title id="title">서울과학고 합격 학생의 초등 시기 로드맵</title><desc id="desc">초3 7월부터 초5 1월까지 교과·심화와 사고력·경시·탐구를 병행한 공개 사례를 시간순으로 정리한 그림입니다.</desc><rect width="1160" height="580" rx="18" fill="#f5faf7"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" fill="#244c43"><text x="36" y="48" font-size="26" font-weight="700">서울과학고 합격 학생의 로드맵</text><text x="36" y="79" font-size="17">교과·심화와 사고력·경시를 함께 이어간 초등 시기의 한 사례</text><path d="M170 141H1010" fill="none" stroke="#559580" stroke-width="5"/><text x="30" y="255" font-size="18" font-weight="700">교과</text><text x="30" y="281" font-size="18" font-weight="700">심화</text><text x="30" y="410" font-size="18" font-weight="700">사고력</text><text x="30" y="436" font-size="18" font-weight="700">경시·탐구</text><circle cx="236" cy="141" r="9" fill="#376d5a"/><text x="236" y="122" font-size="22" text-anchor="middle" font-weight="700">초3 7월</text><rect x="126" y="183" width="228" height="132" rx="12" fill="#e6edf8"/><text x="141" y="226" font-size="19" font-weight="700">초등 6-2 최상위</text><text x="141" y="261" font-size="19" font-weight="500">중1-1 원리해설·최상위</text><rect x="126" y="342" width="228" height="132" rx="12" fill="#dff1e7"/><text x="141" y="385" font-size="19" font-weight="700">1031 중급 A</text><text x="141" y="420" font-size="19" font-weight="500">3% 1과정 병행</text><circle cx="490" cy="141" r="9" fill="#376d5a"/><text x="490" y="122" font-size="22" text-anchor="middle" font-weight="700">초3 11월</text><rect x="380" y="183" width="228" height="132" rx="12" fill="#e6edf8"/><text x="395" y="226" font-size="19" font-weight="700">중1-1 완료</text><text x="395" y="261" font-size="19" font-weight="500">중1-2 준비</text><rect x="380" y="342" width="228" height="132" rx="12" fill="#dff1e7"/><text x="395" y="385" font-size="19" font-weight="700">3% 1과정 병행</text><text x="395" y="420" font-size="19" font-weight="500">조건 읽기·풀이 설명</text><circle cx="744" cy="141" r="9" fill="#376d5a"/><text x="744" y="122" font-size="22" text-anchor="middle" font-weight="700">초4 8월</text><rect x="634" y="183" width="228" height="132" rx="12" fill="#e6edf8"/><text x="649" y="226" font-size="19" font-weight="700">중3-1 점검</text><text x="649" y="261" font-size="19" font-weight="500">중3-2 준비·A급 심화</text><rect x="634" y="342" width="228" height="132" rx="12" fill="#dff1e7"/><text x="649" y="385" font-size="19" font-weight="700">3% 과정 병행</text><text x="649" y="420" font-size="19" font-weight="500">메르센 소수 앱 탐구</text><circle cx="998" cy="141" r="9" fill="#376d5a"/><text x="998" y="122" font-size="22" text-anchor="middle" font-weight="700">초5 1월</text><rect x="888" y="183" width="228" height="132" rx="12" fill="#e6edf8"/><text x="903" y="226" font-size="19" font-weight="700">고등 일부 단원</text><text x="903" y="261" font-size="19" font-weight="500">등차·등비수열과 수열의 합</text><rect x="888" y="342" width="228" height="132" rx="12" fill="#dff1e7"/><text x="903" y="385" font-size="19" font-weight="700">KMO 기출·변형</text><text x="903" y="420" font-size="19" font-weight="500">정수·대수·평면기하</text><text x="36" y="521" font-size="18" font-weight="700">어려운 원리는 다시 설명받고, 스스로 풀이를 재구성하며 보완했습니다.</text><text x="36" y="550" font-size="16">이 사례의 학년·속도를 목표로 고정하지 않고, 아이의 현재 진도와 완료 범위에서 계획합니다.</text></g></svg>