<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>로드맵 회원·지식 관리 · GFIELD</title><link rel="stylesheet" href="membership.css?v=20261030-member1"><link rel="stylesheet" href="membership-admin.css?v=20261114-counsel1"></head><body class="member-page"><header class="member-header"><a href="planner.html" class="member-brand">GFIELD</a><span>로드맵 회원 관리</span><a class="member-quiet" href="../admin.html">기존 승인번호 관리</a><button class="member-link" id="adminLogout" hidden>로그아웃</button></header><main class="member-admin"><section id="adminLogin" class="member-card"><h1>관리자 로그인</h1><p class="member-lead">기존 GFIELD 관리자 계정으로 확인합니다.</p><form id="adminLoginForm"><label class="member-field">관리자 아이디<input name="name" value="DOCSSAM" autocomplete="username" required></label><label class="member-field">관리자 승인번호<input name="code" type="password" autocomplete="current-password" required></label><button class="member-primary">로그인</button></form></section><section id="adminMembers" hidden><h1>로드맵 회원</h1><p>이메일 인증 후 바로 이용하는 무료 회원입니다. 로그인 번호 원문은 저장하거나 표시하지 않습니다.</p><form id="adminSearch" class="member-admin-search"><label class="member-field">학생·이메일·전화번호 검색<input name="query" type="search" maxlength="60"></label><button class="member-secondary">검색</button></form><p id="adminCount" role="status"></p><div class="member-admin-scroll" tabindex="0" role="region" aria-label="회원 목록"><table><thead><tr><th>학생</th><th>학년·나이</th><th>보호자 이메일</th><th>보호자 연락처</th><th>이메일 인증</th><th>이메일 광고</th><th>문자 광고</th><th>가입일</th><th>상세</th></tr></thead><tbody id="adminRows"></tbody></table></div><div class="member-admin-pages"><button id="adminPrev" class="member-secondary">이전 30명</button><button id="adminNext" class="member-secondary">다음 30명</button></div></section><section id="adminKnowledge" class="k-admin" hidden aria-labelledby="kHeading"><div class="k-head"><div><h1 id="kHeading">상담 지식</h1><p>고객 상담은 승인된 항목만 참고합니다. 새 자료와 수정본은 승인 대기에서 확인해 주세요. 학생 이름·연락처·성적은 적지 마세요.</p></div><button type="button" id="kNew" class="member-secondary">새 노하우 쓰기</button></div><div class="k-tabs" role="group" aria-label="지식 상태"><button type="button" data-tab="candidate" aria-pressed="true">승인 대기</button><button type="button" data-tab="approved" aria-pressed="false">승인됨</button><button type="button" data-tab="archived" aria-pressed="false">보관함</button></div><ul id="kList" class="k-list"></ul><p id="kStatus" role="status" aria-live="polite"></p></section><p id="adminStatus" role="status" aria-live="polite"></p></main><dialog id="kDialog" aria-labelledby="kFormTitle"><form id="kForm"><h2 id="kFormTitle">새 노하우 쓰기</h2><input type="hidden" name="id"><div class="k-row"><label class="member-field">종류<select name="kind"><option value="knowhow">원장님 노하우</option><option value="site">로드맵 안내</option><option value="news">입시·교육 소식</option><option value="drive">Drive 자료</option></select></label><label class="member-field">학년<select name="stage"><option value="all">전체</option><option value="preschool">유아</option><option value="elementary">초등</option><option value="middle">중등</option><option value="high">고등</option></select></label><label class="member-field">확인한 날<input type="date" name="checkedOn"></label></div><label class="member-field">제목<input name="title" maxlength="120" required></label><label class="member-field">내용<textarea name="body" rows="9" maxlength="4000" required></textarea></label><label class="member-field">출처 (선택)<input name="source" maxlength="500" placeholder="예: 2026-11 학부모 설명회, 학원 공식 사이트 주소"></label><div class="k-form-actions"><button type="button" id="kCancel" class="member-secondary">취소</button><button class="member-secondary member-primary">저장</button></div></form></dialog><dialog id="adminDetail" aria-labelledby="detailTitle"><header><h2 id="detailTitle">회원 정보와 동의 이력</h2><button id="detailClose" aria-label="회원 상세 닫기">닫기</button></header><div id="adminDetailBody"></div></dialog><script src="../../fields-classic/admin-auth.js?v=20261030-member1"></script><script src="membership-admin.js?v=20261114-counsel1"></script><script src="knowledge-admin.js?v=20261114-counsel1"></script></body></html>
