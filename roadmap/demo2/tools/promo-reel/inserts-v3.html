<!doctype html><html lang="ko"><meta charset="utf-8"><title>성장 로드맵 장면</title>
<style>
@font-face{font-family:Plan;src:url('../../assets/fonts/pretendard-var.woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#32223e;font-family:Plan,sans-serif}main{position:relative;width:720px;height:1280px;overflow:hidden}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 55%}.options{position:absolute;inset:auto 26px 40px;display:flex;gap:13px;align-items:center}.option{width:calc((100% - 26px)/3);padding:18px 7px 20px;text-align:center;font-size:25px;line-height:1.4;font-weight:600;background:linear-gradient(160deg,#fffdf9,#eee7de);border:2px solid #d9c7a7;border-radius:19px;box-shadow:0 6px 0 #bda78d,0 12px 20px #35233c28;transform:perspective(700px) rotateX(7deg);white-space:nowrap}.option.active{background:linear-gradient(155deg,#ede0fa,#ceb3e5);border-color:#9b74b8;box-shadow:0 6px 0 #9672ad,0 12px 24px #79519540;color:#4c2963}.option small{display:block;font-size:16px;font-weight:450;color:#786a7b;margin-bottom:5px}.glimmer{position:absolute;left:calc(50% - 14px);width:28px;height:28px;transform:translate(-50%,-50%);border:4px solid #fff8df;border-radius:50%;background:#b287da;box-shadow:0 0 12px 8px #bd96e47d;opacity:0}.progress{position:absolute;left:36px;right:36px;bottom:40px;height:91px;padding:20px 28px;border:2px solid #d7c6a9;border-radius:22px;background:#fffcf5e8;box-shadow:0 6px 0 #c1aa8f,0 12px 24px #32223e20;display:flex;align-items:center;justify-content:space-between;font-size:26px;font-weight:650}.progress span{padding:10px 17px;border-radius:15px;color:#94829e}.progress span.active{background:#e4d2f1;color:#604075;box-shadow:inset 0 0 0 1px #bd9ad2}.progress i{font-style:normal;color:#a18ba9;font-size:30px}.progress[data-step="1"] i:nth-child(2),.progress[data-step="2"] i{color:#78558e}.progress,.options{visibility:hidden}body.fork .options,body.growth .progress{visibility:visible}
</style><main><img class="art" alt=""><div class="glimmer"></div><div class="options"><div class="option"><small>교과</small>진도 유지</div><div class="option"><small>병행</small>심화 보강</div><div class="option"><small>시간</small>학습량 조정</div></div><div class="progress"><span>초등</span><i>→</i><span>중등</span><i>→</i><span>고등</span></div></main>
<script>
const type=new URLSearchParams(location.search).get('scene')==='growth'?'growth':'fork';document.body.className=type;document.querySelector('.art').src=type==='fork'?'../../assets/roadmap-crossroads-20261101.webp':'../../assets/roadmap-growing-route-20261101.webp';
window.renderFrame=t=>{document.querySelector('.art').style.transform=`${type==='growth'?'translateY(64px) ':''}scale(${1.01+Math.min(t,3.5)*.006})`;if(type==='fork'){document.querySelectorAll('.option').forEach((el,i)=>el.classList.toggle('active',i===1&&t>.8));const dot=document.querySelector('.glimmer');dot.style.opacity=t>.8&&t<3.3?'1':'0';dot.style.top=`${755-Math.max(0,Math.min(1,(t-.8)/2.4))*360}px`;}else{const step=Math.min(2,Math.floor(t/1.02)),progress=document.querySelector('.progress');progress.dataset.step=String(step);progress.querySelectorAll('span').forEach((el,i)=>el.classList.toggle('active',i<=step));}};renderFrame(0);
</script></html>
