<!doctype html><html lang="ko"><meta charset="utf-8"><title>실제 프로그램 소개</title><style>
@font-face{font-family:Plan;src:url('../../assets/fonts/pretendard-var.woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#32223e;font-family:Plan,sans-serif}main{width:720px;height:1280px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 90% 70%,#eadff1 0,transparent 58%),#faf8f4}.content{position:absolute;top:265px;left:30px;right:30px}small{font-size:18px;color:#85788a}h1{font-size:40px;letter-spacing:-1.6px;margin:18px 0 25px;line-height:1.35}.tabs{display:flex;gap:10px;margin-bottom:20px}.tabs span{flex:1;text-align:center;border:1px solid #d4c6dc;border-radius:15px;padding:16px 3px;background:#fff;font-size:22px;color:#89748f;box-shadow:0 4px 0 #ddd0e3}.tabs .active{background:linear-gradient(145deg,#ede1f6,#d5bee7);border-color:#a786ba;color:#573566;box-shadow:0 4px 0 #aa8abb}.screen{height:470px;padding:16px;border:1px solid #d7cbdf;border-radius:25px;background:#fff;box-shadow:0 16px 40px #523a6320;display:flex;align-items:center;overflow:hidden}.screen img{width:100%;max-height:100%;object-fit:contain;border-radius:12px}.note{display:flex;align-items:center;gap:15px;margin-top:25px;padding:20px;border:1px solid #e5d9ca;border-radius:18px;background:#fffcf8;min-height:95px;font-size:23px;line-height:1.5}.note b{font-weight:600}.number{display:grid;place-items:center;flex:0 0 44px;height:44px;border-radius:50%;background:#e8d9f1;color:#724d85;font-size:24px}.foot{margin-top:24px;text-align:center;font-size:20px;color:#7b6b83}.scene{display:none}.scene.active{display:block}
</style><main><div class="content"><small>GFIELD · 실제 프로그램 화면 · 계획 예시</small><h1>현재 공부에서 출발해<br>우리 아이의 계획을 만듭니다.</h1><div class="tabs"><span>학습 로드맵</span><span>월별 계획</span><span>진도 비교</span></div><div class="screen"><img alt="실제 학습 계획 화면"></div><div class="note"><span class="number"></span><b></b></div><div class="foot">교과 · 사고력 · 심화 · 연산 · 국어 · 과학</div></div></main><script>
const frames=[{id:'map',note:'선택한 교재와 공부 순서를\n로드맵으로 살펴보고'},{id:'table',note:'같은 달에 병행할 공부를\n교재와 기간으로 확인합니다.'},{id:'graph',note:'진도와 심화의 흐름을 비교하고\n다음 계획을 조정합니다.'}];
window.renderFrame=t=>{const i=t<2.8?0:t<5.6?1:2,f=frames[i];document.querySelector('.screen img').src='../../assets/roadmap-program-'+f.id+'-20261101.png';document.querySelectorAll('.tabs span').forEach((e,j)=>e.classList.toggle('active',i===j));document.querySelector('.number').textContent=i+1;document.querySelector('.note b').innerText=f.note;};renderFrame(0);
</script></html>
