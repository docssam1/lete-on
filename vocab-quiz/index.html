<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gfield 보캡 테스트</title>
<style>
  :root{
    --cream:#faf6ee; --paper:#fffdf8; --ink:#2d3a2e; --sub:#6b7a6c;
    --green:#3e7a4e; --green-soft:#e3efe5; --accent:#e8a13c; --accent-soft:#fdf1dd;
    --bad:#c05248; --bad-soft:#f9e6e4; --line:#e4ddcd;
    --radius:18px; --shadow:0 4px 18px rgba(61,72,52,.10);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:var(--cream); color:var(--ink);
    min-height:100vh; display:flex; justify-content:center;
  }
  #app{width:100%; max-width:520px; padding:18px 16px 40px;}
  h1{font-size:22px; letter-spacing:-.3px;}
  .top{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .top .logo{font-size:26px;}
  .top .sub{font-size:12px; color:var(--sub);}
  .card{
    background:var(--paper); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px; margin-bottom:14px;
  }
  .sec-title{font-size:13px; font-weight:700; color:var(--sub); margin-bottom:10px; letter-spacing:.5px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; border-radius:999px;
    padding:9px 14px; font-size:14px; cursor:pointer; color:var(--ink);
    transition:all .15s;
  }
  .chip.on{border-color:var(--green); background:var(--green-soft); font-weight:700;}
  .chip .d{font-size:11px; color:var(--sub); display:block;}
  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .mode{
    border:1.5px solid var(--line); background:#fff; border-radius:14px;
    padding:11px 9px; cursor:pointer; text-align:left; transition:all .15s;
  }
  .mode.on{border-color:var(--green); background:var(--green-soft);}
  .mode .mi{font-size:20px;}
  .mode .mt{font-weight:700; font-size:12.5px; margin-top:6px; line-height:1.35;}
  .mode .md{font-size:11px; color:var(--sub); margin-top:3px; line-height:1.45;}
  .btn{
    display:block; width:100%; border:none; border-radius:14px;
    padding:15px; font-size:16px; font-weight:800; cursor:pointer;
    background:var(--green); color:#fff; box-shadow:var(--shadow);
    transition:transform .1s;
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line); box-shadow:none; font-weight:600;}
  .btn.warn{background:var(--accent);}
  .btn[disabled]{opacity:.45; cursor:default;}
  .row{display:flex; gap:10px;}
  .row .btn{flex:1;}

  /* quiz */
  .qtop{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .qtop .prog{font-size:13px; font-weight:700; color:var(--sub);}
  .qtop .stars{font-size:14px; color:var(--accent); font-weight:800;}
  .pbar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:16px;}
  .pbar i{display:block; height:100%; background:var(--green); border-radius:99px; transition:width .3s;}
  .ask{
    text-align:center; padding:22px 10px 18px;
  }
  .ask .what{font-size:13px; color:var(--sub); margin-bottom:12px;}
  .speak-big{
    width:92px; height:92px; border-radius:50%; border:none; cursor:pointer;
    background:var(--green-soft); border:2px solid var(--green);
    font-size:38px; transition:transform .1s; margin-bottom:8px;
  }
  .speak-big:active{transform:scale(.94);}
  .speak-big.playing{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(62,122,78,.35);}50%{box-shadow:0 0 0 14px rgba(62,122,78,0);}}
  .ask .again{font-size:12px; color:var(--sub);}
  .qtext{
    font-size:17px; line-height:1.55; margin-top:10px; min-height:26px;
    font-weight:600;
  }
  .qtext.hidden-q{color:transparent; user-select:none;}
  .peek{font-size:12px; color:var(--sub); background:none; border:none; cursor:pointer; text-decoration:underline; margin-top:4px;}

  .hintbox{
    background:var(--accent-soft); border:1.5px dashed var(--accent);
    border-radius:12px; padding:10px 12px; margin:12px 0 4px;
    font-size:15px; text-align:center; letter-spacing:2px; font-weight:700;
    display:none;
  }
  .hintbox.show{display:block;}

  .mic-area{text-align:center; padding:8px 0 4px;}
  .mic{
    width:78px; height:78px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:32px;
    box-shadow:var(--shadow); transition:transform .1s;
  }
  .mic:active{transform:scale(.94);}
  .mic.listening{background:var(--bad); animation:pulse2 .9s infinite;}
  @keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(192,82,72,.4);}50%{box-shadow:0 0 0 16px rgba(192,82,72,0);}}
  .mic-label{font-size:12px; color:var(--sub); margin-top:6px;}
  .heard{
    min-height:22px; font-size:14px; color:var(--sub); margin-top:8px; font-style:italic;
  }
  .typebox{display:none; gap:8px; margin-top:10px;}
  .typebox.show{display:flex;}
  .typebox input{
    flex:1; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:16px; background:#fff; outline:none;
  }
  .typebox input:focus{border-color:var(--green);}
  .typebox button{
    border:none; border-radius:12px; padding:0 18px; background:var(--green);
    color:#fff; font-weight:800; font-size:15px; cursor:pointer;
  }
  .choices2{display:grid; gap:9px; margin-top:6px;}
  .choice{
    border:1.5px solid var(--line); background:#fff; border-radius:13px;
    padding:13px 14px; font-size:16px; font-weight:700; cursor:pointer;
    text-align:left; color:var(--ink); transition:all .12s;
  }
  .choice:active{transform:scale(.985);}
  .toolrow{display:flex; gap:8px; margin-top:14px;}
  .tool{
    flex:1; border:1.5px solid var(--line); background:#fff; border-radius:12px;
    padding:10px; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink);
  }
  .tool:active{background:var(--cream);}

  /* feedback */
  .fb{text-align:center; padding:26px 12px;}
  .fb .big{font-size:52px;}
  .fb .msg{font-size:20px; font-weight:800; margin-top:8px;}
  .fb .ans{margin-top:14px; font-size:15px; line-height:1.6;}
  .fb .ans b{font-size:19px;}
  .fb.good .msg{color:var(--green);}
  .fb.bad .msg{color:var(--bad);}
  .fb .said{font-size:13px; color:var(--sub); margin-top:6px;}

  /* result */
  .score-ring{
    width:130px; height:130px; border-radius:50%; margin:8px auto 14px;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--green) calc(var(--pct)*1%), var(--line) 0);
  }
  .score-ring>div{
    width:104px; height:104px; border-radius:50%; background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .score-ring .n{font-size:30px; font-weight:900;}
  .score-ring .t{font-size:12px; color:var(--sub);}
  .wrong-list{margin-top:12px;}
  .wrong-item{
    display:flex; justify-content:space-between; align-items:center;
    border-top:1px solid var(--line); padding:10px 2px; font-size:14px;
  }
  .wrong-item:first-child{border-top:none;}
  .wrong-item .w{font-weight:800;}
  .wrong-item .k{color:var(--sub);}
  .best{font-size:12px; color:var(--sub); text-align:center; margin-top:8px;}
  .note{font-size:12px; color:var(--sub); line-height:1.6; margin-top:10px;}

  /* game FX */
  .fx-p{
    position:fixed; width:9px; height:9px; border-radius:2px; z-index:999;
    pointer-events:none; animation:fxfly .7s cubic-bezier(.15,.8,.4,1) forwards;
  }
  @keyframes fxfly{to{transform:translate(var(--dx),var(--dy)) rotate(520deg); opacity:0;}}
  .fx-ko{
    position:fixed; z-index:999; pointer-events:none; font-weight:900; font-size:22px;
    color:var(--green); text-shadow:0 2px 0 #fff; animation:fxko .9s ease-out forwards;
  }
  @keyframes fxko{0%{opacity:0; transform:translateY(6px) scale(.6);}25%{opacity:1; transform:scale(1.15);}100%{opacity:0; transform:translateY(-46px) scale(1);}}
  .shake{animation:shake .4s;}
  @keyframes shake{20%{transform:translateX(-7px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}

  /* rush mode */
  .rush-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:800;}
  .rush-top .lives{font-size:16px; letter-spacing:2px;}
  .rush-top .rscore{font-size:15px;}
  .rush-top .combo{font-size:13px; color:var(--accent);}
  .combo.big{animation:comboPop .3s;}
  @keyframes comboPop{50%{transform:scale(1.5);}}
  .fall-zone{
    position:relative; height:200px; overflow:hidden; border-radius:14px;
    border:1.5px dashed var(--line);
    background:linear-gradient(180deg, #f2fbf4 0%, var(--accent-soft) 100%);
    margin-bottom:12px;
  }
  .fall-zone .ground{position:absolute; left:0; right:0; bottom:0; height:5px; background:var(--bad); opacity:.35;}
  .falling{
    position:absolute; top:-70px; left:6%; right:6%; text-align:center;
    font-size:16px; font-weight:700; line-height:1.45;
    background:var(--paper); border:1.5px solid var(--line); border-radius:12px;
    padding:10px 12px; box-shadow:var(--shadow);
    animation:fallDown var(--dur) linear forwards;
  }
  @keyframes fallDown{from{transform:translateY(0);}to{transform:translateY(275px);}}
  .falling.paused{animation-play-state:paused;}
  .choice.good{border-color:var(--green); background:var(--green-soft);}
  .choice.badc{border-color:var(--bad); background:var(--bad-soft);}
  .rush-over{text-align:center; padding:20px 10px;}
  .rush-over .big-score{font-size:44px; font-weight:900; color:var(--green);}
  .hide{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>

<script src="vocab-data.js"></script>
<script>
(function(){
  'use strict';
  const $app = document.getElementById('app');
  const DAYS = window.VOCAB_DAYS || [];
  const LS_KEY = 'gfield_vocab_quiz_v1';

  // ── 상태 ──────────────────────────────────────────────
  let sel = { dayId: DAYS[0] && DAYS[0].id, mode: 'ko' };  // ko: 단어→한글뜻, en: 뜻→영어단어
  let quiz = null;   // {words, i, right:[], wrong:[], stars, hintLevel, heard}
  let recog = null, listening = false;

  const store = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; } };
  const save  = (s) => { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} };

  const dayById = id => DAYS.find(d => d.id === id) || DAYS[0];
  const koMain = w => w.koShow.split(',')[0].replace(/\([^)]*\)/g,'').trim();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ── 게임 효과 (펑! 파티클 · 한글 뜻 팝업) ─────────────
  const FX_COLORS = ['#e8a13c','#3e7a4e','#c05248','#7db8e8','#e87dc4','#f2d34c'];
  function burst(x, y, n){
    for (let i = 0; i < (n || 20); i++){
      const el = document.createElement('i');
      el.className = 'fx-p';
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.background = FX_COLORS[i % FX_COLORS.length];
      const a = Math.random() * Math.PI * 2, d = 45 + Math.random() * 85;
      el.style.setProperty('--dx', Math.cos(a) * d + 'px');
      el.style.setProperty('--dy', (Math.sin(a) * d - 30) + 'px');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 750);
    }
  }
  function popKo(x, y, text){
    const el = document.createElement('span');
    el.className = 'fx-ko'; el.textContent = text;
    document.body.appendChild(el);
    el.style.left = Math.max(8, x - el.offsetWidth / 2) + 'px';
    el.style.top = (y - 30) + 'px';
    setTimeout(() => el.remove(), 950);
  }
  function buzz(pattern){
    try{ if (navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
  }
  function centerOf(el){
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }

  // ── 음성 합성 (문제 읽어주기) ──────────────────────────
  function speak(text, lang, cb){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = 0.92;
      const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.indexOf('en') === 0);
      if (lang.indexOf('en') === 0 && vs.length) u.voice = vs.find(v => /US|Google US/i.test(v.name)) || vs[0];
      u.onend = () => { markPlaying(false); if (cb) cb(); };
      u.onerror = () => markPlaying(false);
      markPlaying(true);
      speechSynthesis.speak(u);
    }catch(e){ markPlaying(false); }
  }
  function markPlaying(on){
    const b = document.querySelector('.speak-big');
    if (b) b.classList.toggle('playing', on);
  }

  // ── 음성 인식 (답 듣기) ────────────────────────────────
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function startListen(){
    if (!SR){ toggleType(true); return; }
    if (listening){ stopListen(); return; }
    recog = new SR();
    recog.lang = (sel.mode === 'ko' || sel.mode === 'endefko') ? 'ko-KR' : 'en-US';
    if (sel.mode === 'endef') recog.maxAlternatives = 1;
    recog.interimResults = false;
    recog.maxAlternatives = 4;
    listening = true; updateMicUI();
    recog.onresult = (ev) => {
      const alts = [];
      for (const r of ev.results[0]) alts.push(r.transcript);
      listening = false; updateMicUI();
      handleAnswer(alts);
    };
    recog.onerror = () => {
      listening = false; updateMicUI();
      const h = document.querySelector('.heard');
      if (h) h.textContent = '잘 안 들렸어요. 마이크를 다시 눌러 보세요. (또는 아래 "직접 입력")';
    };
    recog.onend = () => { listening = false; updateMicUI(); };
    try{ recog.start(); }catch(e){ listening = false; updateMicUI(); }
  }
  function stopListen(){ try{ recog && recog.stop(); }catch(e){} listening = false; updateMicUI(); }
  function updateMicUI(){
    const m = document.querySelector('.mic');
    const l = document.querySelector('.mic-label');
    if (m) m.classList.toggle('listening', listening);
    if (l) l.textContent = listening ? '듣고 있어요… 답을 말하세요!' : '마이크를 누르고 답을 말하세요';
  }

  // ── 정답 판정 ──────────────────────────────────────────
  const normKo = s => String(s).replace(/\s+/g,'').replace(/[.,!?~]/g,'');
  const normEn = s => String(s).toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();

  function isCorrect(word, saidList){
    if (sel.mode === 'ko' || sel.mode === 'endefko'){
      const accepted = word.ko.map(normKo);
      return saidList.some(said => {
        const t = normKo(said);
        return accepted.some(a => a && (t === a || t.indexOf(a) >= 0));
      });
    } else if (sel.mode === 'endef'){
      // 말로 하는 뜻 설명은 문장이 저마다 달라서, 핵심 키워드가
      // kwNeed개 이상 들어 있으면 정답으로 본다.
      const kws = (word.kw || []).map(normEn);
      const need = word.kwNeed || 1;
      return saidList.some(said => {
        const t = ' ' + normEn(said) + ' ';
        return kws.filter(a => a && t.indexOf(' '+a+' ') >= 0 || (a.indexOf(' ')>=0 && t.indexOf(a)>=0)).length >= need;
      });
    } else {
      const accepted = [word.en].concat(word.enAlt || []).map(normEn).filter(Boolean);
      return saidList.some(said => {
        const t = normEn(said);
        return accepted.some(a => t === a || (' '+t+' ').indexOf(' '+a+' ') >= 0);
      });
    }
  }

  // ── 힌트 (아주 조금씩 3단계) ──────────────────────────
  function hintText(word, level){
    if (sel.mode === 'pick') return '🇰🇷 ' + word.koShow;
    if (sel.mode === 'endef'){
      const ws = word.def.split(' ');
      if (level === 1) return ws[0] + ' …';
      if (level === 2) return ws.slice(0,3).join(' ') + ' …';
      return ws.slice(0, Math.ceil(ws.length/2)).join(' ') + ' …';
    }
    if (sel.mode === 'ko' || sel.mode === 'endefko'){
      const ans = koMain(word);
      const chars = [...ans];
      if (level === 1) return '●'.repeat(chars.length) + `  (${chars.length}글자)`;
      if (level === 2) return chars.map((c,i)=> i===0 ? c : (c===' ' ? ' ' : '●')).join('');
      return chars.map((c,i)=> (i===0 || i===chars.length-1) ? c : (c===' ' ? ' ' : '●')).join('');
    } else {
      const ans = word.en;
      const chars = [...ans];
      const mask = (keep) => chars.map((c,i)=> c===' ' ? ' ' : (c==='-' ? '-' : (keep(i,c) ? c : '_'))).join(' ');
      if (level === 1) return `${word.pos} · ${chars.filter(c=>c!==' '&&c!=='-').length} letters`;
      if (level === 2) return mask((i)=> i===0 || chars[i-1]===' ');
      return mask((i)=> i===0 || i===chars.length-1 || chars[i-1]===' ');
    }
  }

  // ── 화면들 ─────────────────────────────────────────────
  function home(){
    stopListen(); speechSynthesis.cancel();
    const s = store();
    const dayChips = DAYS.map(d => `
      <button class="chip ${d.id===sel.dayId?'on':''}" data-day="${d.id}">
        ${esc(d.date)} <span class="d">${esc(d.label)} · ${d.words.length}단어</span>
      </button>`).join('');
    const bestKey = sel.dayId + '_' + sel.mode;
    const best = s[bestKey];
    $app.innerHTML = `
      <div class="top"><span class="logo">🎙️</span>
        <div><h1>보캡 테스트</h1><div class="sub">Gfield Reading Town · 음성 단어 시험</div></div>
      </div>
      <div class="card">
        <div class="sec-title">📅 어느 날 단어로 볼까요?</div>
        <div class="chips">${dayChips || '<span class="note">아직 등록된 날이 없어요.</span>'}</div>
      </div>
      <div class="card">
        <div class="sec-title">🎯 어떤 방식으로 물어볼까요?</div>
        <div class="mode-grid">
          <button class="mode ${sel.mode==='ko'?'on':''}" data-mode="ko">
            <div class="mi">🔊→🇰🇷</div><div class="mt">영어 단어 듣고<br>한글 뜻 말하기</div>
            <div class="md">"population" 을 들으면<br>"인구!" 라고 답해요</div>
          </button>
          <button class="mode ${sel.mode==='en'?'on':''}" data-mode="en">
            <div class="mi">🔊→🇺🇸</div><div class="mt">영어 뜻 듣고<br>영어 단어 말하기</div>
            <div class="md">뜻 설명을 들으면<br>"population!" 이라고 답해요</div>
          </button>
          <button class="mode ${sel.mode==='endefko'?'on':''}" data-mode="endefko">
            <div class="mi">🔊🇺🇸→🇰🇷</div><div class="mt">영어 뜻 듣고<br>한글 뜻 말하기</div>
            <div class="md">뜻 설명을 들으면<br>"인구!" 라고 한국말로 답해요</div>
          </button>
          <button class="mode ${sel.mode==='koq'?'on':''}" data-mode="koq">
            <div class="mi">🔊🇰🇷→🇺🇸</div><div class="mt">한글 뜻 듣고<br>영어 단어 말하기</div>
            <div class="md">"인구" 를 들으면<br>"population!" 이라고 답해요</div>
          </button>
          <button class="mode ${sel.mode==='endef'?'on':''}" data-mode="endef">
            <div class="mi">🔊→💬</div><div class="mt">영어 단어 듣고<br>영어로 뜻 말하기</div>
            <div class="md">"population" 을 들으면<br>영어 문장으로 뜻을 설명해요</div>
          </button>
          <button class="mode ${sel.mode==='pick'?'on':''}" data-mode="pick">
            <div class="mi">📖→👆</div><div class="mt">영어 뜻 읽고<br>단어 고르기 게임</div>
            <div class="md">뜻을 읽고 4개 중에서<br>알맞은 단어를 골라요</div>
          </button>
          <button class="mode ${sel.mode==='rush'?'on':''}" data-mode="rush">
            <div class="mi">🌠⚡</div><div class="mt">떨어지는 뜻 잡기<br>(타임어택)</div>
            <div class="md">뜻이 바닥에 닿기 전에<br>단어를 골라요! 점점 빨라져요</div>
          </button>
        </div>
        ${best ? `<div class="best">🏆 이 조합 최고 기록: ${best.right}/${best.total}</div>` : ''}
      </div>
      <button class="btn" id="start">시험 시작! 🚀</button>
      <div class="note">💡 새 단어 사진을 Claude에게 올리면 날짜별로 계속 추가돼요.<br>
      🎤 마이크는 크롬(Chrome)에서 가장 잘 돼요. 마이크가 없으면 "직접 입력"으로 풀 수 있어요.</div>`;

    $app.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { sel.dayId = b.dataset.day; home(); });
    $app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { sel.mode = b.dataset.mode; home(); });
    $app.querySelector('#start').onclick = startQuiz;
  }

  function startQuiz(retryWords){
    if (sel.mode === 'rush'){ rushStart(); return; }
    const day = dayById(sel.dayId);
    const words = (retryWords && retryWords.length ? retryWords : day.words.slice())
      .slice().sort(() => Math.random() - .5);
    quiz = { words, i: 0, right: [], wrong: [], stars: words.length, hintLevel: 0 };
    question();
  }

  function askText(w){ return (sel.mode === 'en' || sel.mode === 'endefko' || sel.mode === 'pick') ? w.def : sel.mode === 'koq' ? koMain(w) : w.en; }
  function askLang(){ return sel.mode === 'koq' ? 'ko-KR' : 'en-US'; }

  function question(auto){
    stopListen();
    const w = quiz.words[quiz.i];
    quiz.hintLevel = 0;
    const isPick = sel.mode === 'pick';
    const pct = Math.round(quiz.i / quiz.words.length * 100);
    let choices = [];
    if (isPick){
      const day = dayById(sel.dayId);
      choices = day.words.filter(x => x.en !== w.en).sort(() => Math.random() - .5).slice(0,3).concat([w])
        .sort(() => Math.random() - .5);
    }
    $app.innerHTML = `
      <div class="card">
        <div class="qtop">
          <span class="prog">${quiz.i+1} / ${quiz.words.length}</span>
          <span class="stars">⭐ ${quiz.stars}</span>
        </div>
        <div class="pbar"><i style="width:${pct}%"></i></div>
        <div class="ask">
          <div class="what">${sel.mode==='ko' ? '🔊 영어 단어를 듣고 <b>한글 뜻</b>을 말하세요' : sel.mode==='en' ? '🔊 영어 설명을 듣고 <b>영어 단어</b>를 말하세요' : sel.mode==='endefko' ? '🔊 영어 설명을 듣고 <b>한글 뜻</b>을 말하세요' : sel.mode==='koq' ? '🔊 한글 뜻을 듣고 <b>영어 단어</b>를 말하세요' : '🔊 영어 단어를 듣고 <b>영어 문장으로 뜻</b>을 말하세요'}</div>
          <button class="speak-big" id="play">🔊</button>
          <div class="again">눌러서 다시 듣기</div>
          <div class="qtext${isPick ? '' : ' hidden-q'}" id="qtext">${esc(askText(w))}</div>
          ${isPick ? '' : '<button class="peek" id="peek">👀 글자로 보기</button>'}
        </div>
        <div class="hintbox" id="hintbox"></div>
        ${isPick ? `
        <div class="choices2">
          ${choices.map(c => `<button class="choice" data-pick="${esc(c.en)}">${esc(c.en)} <span style="color:var(--sub);font-weight:400">(${esc(c.pos)})</span></button>`).join('')}
        </div>
        <div class="toolrow">
          <button class="tool" id="hint">💡 힌트: 한글 뜻 (⭐-1)</button>
          <button class="tool" id="skip">건너뛰기 →</button>
        </div>` : `
        <div class="mic-area">
          <button class="mic" id="mic">🎤</button>
          <div class="mic-label">마이크를 누르고 답을 말하세요</div>
          <div class="heard"></div>
          <div class="typebox" id="typebox">
            <input id="typein" placeholder="${(sel.mode==='ko'||sel.mode==='endefko') ? '한글 뜻 입력' : sel.mode==='endef' ? 'type the meaning in English' : 'type the English word'}" autocomplete="off">
            <button id="typego">확인</button>
          </div>
        </div>
        <div class="toolrow">
          <button class="tool" id="hint">💡 힌트 (⭐-1)</button>
          <button class="tool" id="typetoggle">⌨️ 직접 입력</button>
          <button class="tool" id="skip">건너뛰기 →</button>
        </div>`}
      </div>
      <button class="btn ghost" id="quit">그만하고 처음으로</button>`;

    const $ = sel2 => $app.querySelector(sel2);
    $('#play').onclick = () => speak(askText(w), askLang());
    if ($('#peek')) $('#peek').onclick = (e) => {
      $('#qtext').classList.remove('hidden-q');
      e.target.classList.add('hide');
    };
    if ($('#mic')) $('#mic').onclick = startListen;
    const maxHint = isPick ? 1 : 3;
    $('#hint').onclick = () => {
      if (quiz.hintLevel >= maxHint) return;
      quiz.hintLevel++;
      if (quiz.stars > 0) quiz.stars--;
      $('.stars').textContent = '⭐ ' + quiz.stars;
      const hb = $('#hintbox');
      hb.textContent = hintText(w, quiz.hintLevel);
      hb.classList.add('show');
      if (quiz.hintLevel >= maxHint) $('#hint').disabled = true;
    };
    if ($('#typetoggle')) $('#typetoggle').onclick = () => toggleType();
    if ($('#typego')) $('#typego').onclick = submitTyped;
    if ($('#typein')) $('#typein').onkeydown = (e) => { if (e.key === 'Enter') submitTyped(); };
    $app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => finishOne(b.dataset.pick === w.en, b.dataset.pick));
    $('#skip').onclick = () => finishOne(false, '(건너뜀)');
    $('#quit').onclick = home;

    if (auto !== false && !isPick) setTimeout(() => speak(askText(w), askLang()), 350);
  }

  function toggleType(force){
    const tb = document.querySelector('#typebox');
    if (!tb) return;
    const show = force === true ? true : !tb.classList.contains('show');
    tb.classList.toggle('show', show);
    if (show){ const i = tb.querySelector('input'); i && i.focus(); }
  }
  function submitTyped(){
    const i = document.querySelector('#typein');
    if (!i || !i.value.trim()) return;
    handleAnswer([i.value.trim()]);
  }

  function handleAnswer(saidList){
    const w = quiz.words[quiz.i];
    const ok = isCorrect(w, saidList);
    finishOne(ok, saidList[0] || '');
  }

  function finishOne(ok, said){
    stopListen(); speechSynthesis.cancel();
    const w = quiz.words[quiz.i];
    (ok ? quiz.right : quiz.wrong).push(w);
    const answerLine = `<b>${esc(w.en)}</b> <span style="color:var(--sub)">(${esc(w.pos)})</span><br>= ${esc(w.koShow)}<br><span style="font-size:13px;color:var(--sub)">${esc(w.def)}</span>`;
    $app.innerHTML = `
      <div class="card fb ${ok?'good':'bad'}">
        <div class="big">${ok ? '🎉' : '🤔'}</div>
        <div class="msg">${ok ? '정답이에요!' : '아까워요!'}</div>
        <div class="ans">${answerLine}</div>
        ${said ? `<div class="said">내가 말한 것: “${esc(said)}”</div>` : ''}
      </div>
      <button class="btn" id="next">${quiz.i+1 >= quiz.words.length ? '결과 보기 🏁' : '다음 문제 →'}</button>`;
    if (ok){
      const [cx, cy] = centerOf($app.querySelector('.fb .big'));
      burst(cx, cy, 26);
      popKo(cx, cy - 20, koMain(w) + '!');
      buzz(60);
    } else {
      $app.querySelector('.fb').classList.add('shake');
      buzz([40, 60, 40]);
    }
    speak(w.en, 'en-US');
    $app.querySelector('#next').onclick = () => {
      quiz.i++;
      if (quiz.i >= quiz.words.length) result(); else question();
    };
  }

  function result(){
    const total = quiz.words.length, right = quiz.right.length;
    const pct = Math.round(right / total * 100);
    const s = store();
    const key = sel.dayId + '_' + sel.mode;
    if (!s[key] || right > s[key].right){ s[key] = { right, total }; save(s); }
    const wrongRows = quiz.wrong.map(w => `
      <div class="wrong-item">
        <span class="w">${esc(w.en)}</span><span class="k">${esc(w.koShow)}</span>
      </div>`).join('');
    $app.innerHTML = `
      <div class="card" style="text-align:center">
        <div class="sec-title">오늘의 결과</div>
        <div class="score-ring" style="--pct:${pct}"><div>
          <span class="n">${right}/${total}</span><span class="t">${pct}점 · ⭐${quiz.stars}</span>
        </div></div>
        <div style="font-weight:800; font-size:18px">${pct===100 ? '완벽해요! 🏆' : pct>=70 ? '잘했어요! 💪' : '한 번 더 해볼까요? 🌱'}</div>
        <div class="best">🏆 최고 기록: ${s[key].right}/${s[key].total}</div>
      </div>
      ${quiz.wrong.length ? `
      <div class="card">
        <div class="sec-title">✏️ 틀린 단어 (${quiz.wrong.length}개)</div>
        <div class="wrong-list">${wrongRows}</div>
      </div>
      <button class="btn warn" id="retry">틀린 것만 다시! 🔁</button>` : ''}
      <div class="row" style="margin-top:10px">
        <button class="btn ghost" id="again">전체 다시</button>
        <button class="btn ghost" id="home">처음으로</button>
      </div>`;
    if (pct >= 80){
      [200, 500, 800].forEach((t, i) => setTimeout(() =>
        burst(60 + Math.random() * (window.innerWidth - 120), 90 + i * 40, 22), t));
    }
    if (pct === 100){
      buzz([80, 60, 80, 60, 160]);
    }
    const r = $app.querySelector('#retry');
    if (r) r.onclick = () => startQuiz(quiz.wrong);
    $app.querySelector('#again').onclick = () => startQuiz();
    $app.querySelector('#home').onclick = home;
  }

  // ── 떨어지는 뜻 잡기 (타임어택) ────────────────────────
  let rush = null;
  function rushStart(){
    stopListen(); speechSynthesis.cancel();
    rush = { queue: [], lives: 3, score: 0, combo: 0, dur: 8, over: false, answered: false };
    rushRound();
  }
  function rushDraw(){
    const day = dayById(sel.dayId);
    if (!rush.queue.length) rush.queue = day.words.slice().sort(() => Math.random() - .5);
    return rush.queue.pop();
  }
  function rushRound(){
    const day = dayById(sel.dayId);
    const w = rushDraw();
    rush.answered = false;
    const choices = day.words.filter(x => x.en !== w.en).sort(() => Math.random() - .5).slice(0,3)
      .concat([w]).sort(() => Math.random() - .5);
    $app.innerHTML = `
      <div class="card">
        <div class="rush-top">
          <span class="lives">${'❤️'.repeat(rush.lives)}${'🖤'.repeat(3 - rush.lives)}</span>
          <span class="combo${rush.combo >= 3 ? ' big' : ''}">${rush.combo > 1 ? '🔥 콤보 x' + rush.combo : ''}</span>
          <span class="rscore">🏆 ${rush.score}</span>
        </div>
        <div class="fall-zone">
          <div class="falling" id="fall" style="--dur:${rush.dur}s">${esc(w.def)}</div>
          <div class="ground"></div>
        </div>
        <div class="choices2">
          ${choices.map(c => `<button class="choice" data-pick="${esc(c.en)}">${esc(c.en)}</button>`).join('')}
        </div>
      </div>
      <button class="btn ghost" id="quit">그만하기</button>`;
    const fall = $app.querySelector('#fall');
    fall.addEventListener('animationend', () => rushMiss(w, null));
    $app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      if (rush.answered) return;
      if (b.dataset.pick === w.en) rushHit(w, b); else rushMiss(w, b);
    });
    $app.querySelector('#quit').onclick = () => { rush.over = true; home(); };
  }
  function rushHit(w, btn){
    rush.answered = true;
    $app.querySelector('#fall').classList.add('paused');
    btn.classList.add('good');
    const [cx, cy] = centerOf(btn);
    burst(cx, cy, 24);
    popKo(cx, cy, koMain(w) + '!');
    buzz(rush.combo >= 5 ? [30, 30, 30, 30, 60] : 50);
    rush.combo++;
    rush.score += 10 + Math.min(rush.combo - 1, 10) * 2;
    rush.dur = Math.max(4.5, rush.dur - 0.25);
    setTimeout(() => { if (!rush.over) rushRound(); }, 750);
  }
  function rushMiss(w, btn){
    if (rush.answered) return;
    rush.answered = true;
    const fall = $app.querySelector('#fall');
    if (fall) fall.classList.add('paused');
    if (btn) btn.classList.add('badc');
    const good = $app.querySelector(`[data-pick="${(w.en || '').replace(/"/g,'\\"')}"]`);
    if (good){
      good.classList.add('good');
      const [cx, cy] = centerOf(good);
      popKo(cx, cy, koMain(w));
    }
    const card = $app.querySelector('.card');
    if (card) card.classList.add('shake');
    buzz([40, 60, 40]);
    rush.combo = 0;
    rush.lives--;
    setTimeout(() => {
      if (rush.over) return;
      if (rush.lives <= 0) rushOver(); else rushRound();
    }, 1300);
  }
  function rushOver(){
    rush.over = true;
    const st2 = store();
    const key = 'rush_' + sel.dayId;
    const prev = st2[key] || 0;
    const isBest = rush.score > prev;
    if (isBest){ st2[key] = rush.score; save(st2); }
    $app.innerHTML = `
      <div class="card rush-over">
        <div style="font-size:46px">${isBest ? '👑' : '💥'}</div>
        <div style="font-weight:800; font-size:18px; margin-top:6px">${isBest ? '신기록!' : '게임 오버!'}</div>
        <div class="big-score">${rush.score}점</div>
        <div class="best">🏆 최고 기록: ${Math.max(rush.score, prev)}점</div>
      </div>
      <button class="btn warn" id="again">한 번 더! ⚡</button>
      <button class="btn ghost" style="margin-top:10px" id="home2">처음으로</button>`;
    if (isBest){
      [150, 450, 750].forEach((t, i) => setTimeout(() =>
        burst(60 + Math.random() * (window.innerWidth - 120), 100 + i * 50, 24), t));
    }
    $app.querySelector('#again').onclick = rushStart;
    $app.querySelector('#home2').onclick = home;
  }

  // 음성 목록이 늦게 로드되는 브라우저 대응
  if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = () => {};
  home();
})();
</script>
</body>
</html>
