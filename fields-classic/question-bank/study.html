<body class="sd">

  <div class="sd-world" aria-hidden="true">
    <div class="sd-pan" id="pan"><img class="sd-map" src="./assets/study/world-map.webp" width="1672" height="941" alt="" decoding="async" /></div>
  </div>

  <header class="sd-top">
    <a class="sd-pill sd-brand" id="backLink" href="./start.html" aria-label="단원 고르기로"><b class="gm-mark"><span class="gm-word" aria-label="Gifted Math"><b>G</b><small>ifted</small> <b>M</b><small>ath</small></span></b><span id="eyebrow">1권 1단원 · 1차시</span><strong id="unitTitle">단원 공부</strong></a>
    <nav class="sd-pill sd-steps" id="signs" aria-label="공부 순서"></nav>
    <div class="sd-pill sd-student" id="studentName">DEMO</div>
    <!-- 강사용 교안(?as=class)에서만: 수업 차례 접기 · 이 차시 교재 인쇄 · 전체 화면 -->
    <div class="sd-tools" id="classTools" hidden>
      <button type="button" id="outlineBtn" aria-pressed="true" aria-controls="outline">수업 차례</button>
      <a id="classPrint" href="./start.html" target="_blank" rel="noopener">이 차시 교재 인쇄</a>
      <button type="button" id="fullBtn" aria-pressed="false">전체 화면</button>
    </div>
  </header>
  <!-- 강사용 교안: 왼쪽에 그 차시의 모든 장을 수업 차례대로(원장 2026-11-10 「학생용과는 디자인과 구성이 달라야지」). 누르면 그 장으로 -->
  <aside class="sd-outline" id="outline" aria-label="수업 차례" hidden>
    <h2>수업 차례</h2>
    <ol id="outlineList"></ol>
  </aside>

  <main class="sd-main">
    <section class="sd-card" id="stage">
      <header class="sd-slide-head" id="slideHead"></header>
      <div class="sd-slide-body" id="slideBody"></div>
      <div class="sd-frame" id="frameWrap" hidden><iframe id="bellFrame" title="워밍업 학습"></iframe></div>
      <div class="sd-sheet" id="sheet" hidden>
        <header class="sd-sheet-head"><button type="button" class="sd-btn" id="sheetClose">‹ 본책 문제 번호</button><strong id="sheetTitle">유사문제</strong></header>
        <iframe id="sheetFrame" title="유사문제"></iframe>
      </div>
    </section>
  </main>

  <footer class="sd-bar">
    <div class="sd-guide">
      <img class="sd-guide-img" id="walkerImg" src="./docssam-guide.webp" alt="" width="683" height="1024" />
      <span class="sd-guide-face" aria-hidden="true"><img id="walkerFace" src="./assets/docssam-math/A1-mouth-closed.webp" alt="" width="475" height="720" /></span>
      <div class="sd-talk" id="talk" data-mood="talk">
        <p id="guideSay" role="status" aria-live="polite"></p>
        <div class="sd-talk-ctl">
          <button type="button" id="voiceBtn" aria-pressed="true" title="독쌤 음성 켜기/끄기" aria-label="독쌤 음성"><svg class="ui-icon" viewBox="0 0 24 24" width="24" height="24" style="width:16px;height:16px;vertical-align:-0.2em;flex:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.6 7.6 0 0 1 0 11"/></svg></button>
          <button type="button" id="againBtn" title="다시 듣기" aria-label="다시 듣기">↺</button>
          <button type="button" id="pauseBtn" aria-pressed="false" title="저절로 넘어가기 멈추기" aria-label="저절로 넘어가기 멈추기"><svg class="ui-icon" viewBox="0 0 24 24" width="24" height="24" style="width:16px;height:16px;vertical-align:-0.2em;flex:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8.5 5.5v13M15.5 5.5v13" stroke-width="3"/></svg></button>
        </div>
      </div>
    </div>
    <span class="sd-pill sd-count" id="count"></span>
    <button type="button" class="sd-btn sd-first" id="firstBtn" title="이 차시 첫 장으로" aria-label="처음으로"><svg class="ui-icon" viewBox="0 0 24 24" width="24" height="24" style="width:1.1em;height:1.1em;vertical-align:-0.2em;flex:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 5.5v13" stroke-width="2.4"/><path d="M18.5 5.5L9 12l9.5 6.5z" fill="currentColor"/></svg><span class="sd-btn-word">&nbsp;처음으로</span></button>
    <button type="button" class="sd-btn sd-prev" id="prevBtn">‹ 뒤로</button>
    <button type="button" class="sd-btn primary sd-next" id="nextBtn"><span class="sd-fill" aria-hidden="true"></span><span class="sd-next-text">다음 →</span></button>
  </footer>
  <script src="./vendor/motion-12.43.0/motion.min.js" defer></script>
  <script type="module" src="./study.js?v=20261111p"></script>

</html>
