<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fdfbf5" />
  <title>GM 모르는 문제 유사문제</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./start.css?v=20261110f" />
</head>
<body class="sm">
  <!-- 모르는 문제 유사문제(원장 2026-11-10 「문제은행은 모르는 문제 유사문제 만들기로 학생 모드에 있어야 돼」):
       권 · 단원 → 본책 번호(활동 · 확인 · 연습 · 도전)를 누름 → 번호마다 같은 유형의 새 문제(문제은행 학생 화면 index.html?as=student&picks=…) -->
  <header class="st-header">
    <a class="st-brand" id="introLink" href="./home.html"><span>GIFTED MATH BANK · 1과정</span><strong>사고력 문제은행</strong></a>
    <nav class="st-links" aria-label="다른 화면"><a id="startLink" href="./start.html">스스로 공부</a><a id="myStudyLink" class="st-my" href="./my-study.html">내 학습 상황</a></nav>
    <div class="st-student" id="studentName">DEMO</div>
  </header>

  <main class="st-main">
    <div id="accessBanner" class="st-access" hidden></div>
    <section class="sm-sheet" aria-labelledby="smHeading">
      <h1 id="smHeading">모르는 문제를 골라요</h1>
      <p class="sm-lead">본책에서 막힌 번호를 누르면 같은 유형의 새 문제가 나와요. 새 문제를 풀어 보고 본책 문제를 다시 풀어요.</p>

      <div class="sm-row">
        <h2 id="smBookLabel">권</h2>
        <div class="sm-tabs" id="bookTabs" role="radiogroup" aria-labelledby="smBookLabel"></div>
      </div>
      <div class="sm-row">
        <h2 id="smUnitLabel">단원</h2>
        <div class="sm-tabs" id="unitTabs" role="radiogroup" aria-labelledby="smUnitLabel"></div>
      </div>

      <div id="numberList" class="sm-numbers" aria-live="polite"></div>
    </section>
  </main>

  <div class="sm-dock" id="dock">
    <p id="pickSummary" role="status">모르는 번호를 눌러요</p>
    <button type="button" class="st-btn" id="clearPicks" hidden>다시 고르기</button>
    <a class="st-btn primary" id="makeLink" href="./index.html" aria-disabled="true">유사문제 만들기</a>
  </div>
  <script type="module" src="./similar.js?v=20261110f"></script>
</body>
</html>
