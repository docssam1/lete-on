<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <script src="./guard.js?v=20261111q"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Gifted Math 사고력 문제은행</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./start.css?v=20261117b" />
  <link rel="stylesheet" href="./course2.css?v=20261115c" />
</head>
<body class="sm">
  <!-- 모르는 문제 유사문제(원장 2026-11-10 「문제은행은 모르는 문제 유사문제 만들기로 학생 모드에 있어야 돼」):
       권 · 단원 → 본책 번호(활동 · 확인 · 연습 · 도전)를 누름 → 번호마다 같은 유형의 새 문제(문제은행 학생 화면 index.html?as=student&picks=…) -->
  <header class="st-header">
    <a class="st-brand" id="introLink" href="./home.html"><span id="brandCourse">GIFTED MATH BANK · 1과정</span><strong>사고력 문제은행</strong></a>
    <nav class="st-links" aria-label="다른 화면"><a id="startLink" href="./start.html">스스로 공부</a><a id="myStudyLink" class="st-my" href="./my-study.html">내 학습 상황</a></nav>
    <div class="st-student" id="studentName">DEMO</div>
  </header>

  <main class="st-main">
    <div id="accessBanner" class="st-access" hidden></div>
    <section class="sm-sheet" aria-labelledby="smHeading">
      <!-- 과정 고르기(원장 2026-11-15 「사고력 문제은행 안에 들어가면 1과정 2과정 3과정 이렇게 나와야지」) — ?course=1|2|3 -->
      <div class="sm-row sm-course">
        <h2 id="smCourseLabel">과정</h2>
        <div class="sm-tabs" id="courseTabs" role="radiogroup" aria-labelledby="smCourseLabel"></div>
      </div>
      <h1 id="smHeading">틀렸거나 모르는 번호를 골라요</h1>
      <p class="sm-lead" id="smLead">본책에서 틀렸거나 막힌 번호를 누르면 같은 유형의 새 문제가 나와요. 새 문제를 풀어 보고 본책 문제를 다시 풀어요.</p>

      <div class="sm-row" id="smBookRow">
        <h2 id="smBookLabel">권</h2>
        <div class="sm-tabs" id="bookTabs" role="radiogroup" aria-labelledby="smBookLabel"></div>
      </div>
      <div class="sm-row" id="smUnitRow">
        <h2 id="smUnitLabel">단원</h2>
        <div class="sm-tabs" id="unitTabs" role="radiogroup" aria-labelledby="smUnitLabel"></div>
      </div>

      <div id="numberList" class="sm-numbers" aria-live="polite"></div>
      <div id="coursePanel" class="sm-course-panel c2-books" hidden></div>
    </section>
    <!-- 고른 번호로 시험지 짜기(원장 2026-11-17 「원래 있는 문제은행처럼 미리보기도 되고 … 난이도 조절도 하고 문항수도 조절하여 출제」) -->
    <section class="sm-preview" id="previewPanel" hidden aria-label="미리보기">
      <div class="sm-preview-head"><strong>미리보기</strong><span>고른 번호마다 만들어질 문제예요. 시험지를 만들 때마다 숫자가 새로 바뀌어요.</span><button type="button" class="st-btn" id="previewClose">닫기</button></div>
      <iframe id="previewFrame" title="유사문제 미리보기"></iframe>
    </section>
  </main>

  <div class="sm-dock" id="dock">
    <p id="pickSummary" role="status">틀렸거나 모르는 번호를 눌러요</p>
    <div class="sm-opts" id="pickOptions" hidden>
      <div class="sm-opt" role="radiogroup" aria-label="번호마다 문제 수"><span>번호마다</span><button type="button" data-each="1" aria-pressed="true">1문제</button><button type="button" data-each="2" aria-pressed="false">2문제</button><button type="button" data-each="3" aria-pressed="false">3문제</button></div>
      <div class="sm-opt" role="radiogroup" aria-label="난이도"><span>난이도</span><button type="button" data-level="basic" aria-pressed="false">더 쉽게</button><button type="button" data-level="actual" aria-pressed="true">본책과 같게</button><button type="button" data-level="advanced" aria-pressed="false">더 어렵게</button></div>
    </div>
    <div class="sm-dock-actions">
      <button type="button" class="st-btn" id="clearPicks" hidden>다시 고르기</button>
      <button type="button" class="st-btn" id="previewBtn" hidden>미리보기</button>
      <a class="st-btn" id="solveLink" href="./index.html" hidden>화면에서 풀기</a>
      <a class="st-btn primary" id="makeLink" href="./index.html" aria-disabled="true" target="_blank" rel="noopener">시험지 만들기</a>
    </div>
  </div>
  <script type="module" src="./similar.js?v=20261117b"></script>
</body>
</html>
