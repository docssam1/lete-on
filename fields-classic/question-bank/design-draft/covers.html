<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>디자인 시안 — 교재 표지 모음</title>
  <link rel="stylesheet" href="./design.css?v=20261023b" />
  <link rel="stylesheet" href="../print-templates.css?v=20261024a" />
  <link rel="stylesheet" href="../cover-designs.css?v=20261024a" />
  <style>
    .cover-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px 22px; max-width: 1200px; margin: 0 auto; padding: 26px 16px 60px; }
    .cover-gallery h2 { grid-column: 1 / -1; margin: 10px 0 -10px; font-size: 15px; font-weight: 700; color: var(--accent-ink); }
    .cover-gallery h2 small { margin-left: 8px; color: var(--muted); font-weight: 400; font-size: 12px; }
    .cover-gallery figure { display: grid; gap: 8px; margin: 0; }
    .cover-gallery figcaption { font-size: 12.5px; color: var(--muted); }
    .cover-gallery figcaption b { display: block; color: var(--ink); font-size: 13.5px; }
    .gb-plain { position: relative; aspect-ratio: 210 / 297; border: 1px solid var(--line-strong); background: #fff center / cover no-repeat; box-shadow: 0 2px 4px rgba(70, 55, 25, .12); }
  </style>
</head>
<body>
  <nav class="draft-nav" aria-label="시안 이동"><b>디자인 시안</b><a href="./index.html">① 문제은행 화면</a><a href="./exam.html">② A4 시험지</a><a href="./covers.html" aria-current="page">③ 교재 표지</a><a href="./unit.html">④ 단원 내지</a><span style="margin-left:auto;color:var(--muted)">인쇄할 때 이 가운데서 고릅니다 — 문제은행 「인쇄 양식」 · 워밍업 「교재 인쇄 → 표지」</span></nav>
  <main class="cover-gallery" id="gallery"></main>
  <script type="module">
    // 그림은 실제 인쇄와 같은 함수(cover-designs.js)로 그린다 — 시안과 인쇄물이 따로 놀지 않게.
    import { COVER_DESIGNS, coverDesignPage } from "../cover-designs.js?v=20261028w";
    const info = { title: "도형 움직이기와 마방진", subtitle: "1과정 · 사고력 수학의 첫걸음", volume: "1", eyebrow: "GFIELD CLASSIC · 1과정", stats: "단원 4 · 워밍업 학습 12\n직접 해 보기 게임 7" };
    const notes = {
      a: "흰 바탕에 광택 도형 묶음, 뒤에 옅은 큰 권 번호.", b: "딥 그린 바탕 위 금선 하나. 바탕은 초록·와인·먹 중 고름.", c: "위는 여백과 제목, 아래 먹색 띠에 도형 여섯.",
      "r2-cubes": "쌓기나무 계단탑과 윤곽선 권 번호.", "r2-paper": "초록 언덕 위 마방진 패·쌓기나무·열기구. (당시 「촌스럽다」 의견)", "r2-motif": "시계·별·거울·주사위 무늬 바탕 + 가운데 패. (당시 「촌스럽다」 의견)",
      "r1-shape": "큰 제목과 도형 하나, 넓은 여백.", "r1-grid": "가는 모눈과 큰 권 번호. 가장 절제된 안.", "r1-band": "아래 1/3 초록 띠에 책 구성 정보."
    };
    const groups = [...new Set(COVER_DESIGNS.map((design) => design.group))];
    document.getElementById("gallery").innerHTML = groups.map((group) => `<h2>${group}<small>${COVER_DESIGNS.filter((d) => d.group === group).length}가지</small></h2>${COVER_DESIGNS.filter((d) => d.group === group).map((design) =>
      `<figure>${coverDesignPage(design.id, info)}<figcaption><b>${design.label}</b>${notes[design.id] || ""}</figcaption></figure>`).join("")}`).join("")
      + `<h2>워밍업 표지<small>2가지 · 워밍업 교재 인쇄에서만</small></h2>
      <figure><div class="gb-plain" style="background-image:url('../assets/fc-cover-shapes.svg')"></div><figcaption><b>도형 배경</b>배경 위에 학습 범위·유형과 핵심 개념·게임 QR을 한 장에.</figcaption></figure>
      <figure><div class="gb-plain" style="background-image:url('../assets/fc-cover-grid.svg')"></div><figcaption><b>모눈 배경</b>같은 내용, 모눈 배경.</figcaption></figure>`;
  </script>
</body>
</html>
