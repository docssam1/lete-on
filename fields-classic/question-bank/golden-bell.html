<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f4" />
  <title>필즈 골든벨 학습</title>
  <link rel="stylesheet" href="./golden-bell.css?v=20260828h" />
</head>
<body>
  <header class="gold-header">
    <a id="backLink" class="back-link" href="./">문제은행</a>
    <div class="brand"><span>GFIELD GOLDEN BELL</span><strong>개념을 말하고 익혀요</strong></div>
    <div id="studentName" class="student-name">DEMO</div>
  </header>

  <main class="gold-shell">
    <section class="gold-intro">
      <div><span>COURSE 1 · CONCEPT MASTERY</span><h1>골든벨 학습</h1><p>개념을 알아보고 이야기로 익힙니다.</p></div>
      <dl><div><dt>현재 권</dt><dd id="currentBookLabel">1권</dd></div><div><dt>완료</dt><dd id="completedCount">0 / 4</dd></div><div><dt>진행</dt><dd id="levelState">도전 중</dd></div></dl>
    </section>

    <nav id="bookTabs" class="book-tabs" aria-label="골든벨 교재 권 선택"></nav>

    <section class="gold-layout">
      <aside class="lesson-pane">
        <div class="pane-title"><span>이 권의 골든벨</span><strong id="bookTitle"></strong></div>
        <div id="lessonList" class="lesson-list"></div>
        <div id="bookSource" class="source-note"></div>
      </aside>

      <section class="lesson-stage" aria-live="polite">
        <div id="stageSteps" class="stage-steps"></div>
        <article id="lessonContent" class="lesson-content"></article>
      </section>
    </section>
  </main>

  <script type="module" src="./golden-bell.js?v=20260828h"></script>
</body>
</html>
