  <!-- 차시 교재 인쇄 창(?sessionbook=1)은 교재를 다 짤 때까지 워밍업 학습 첫 화면을 감추고 안내 한 줄만 보인다
       (원장 2026-11-17 「인쇄할 때 베이지색 문제은행 같은 화면이 잠깐 나왔다 사라져」 — 3초쯤 비쳤다). golden-bell.js showSessionBookDone이 걷는다 -->
  <script>(function(){try{var q=new URLSearchParams(location.search),h=document.documentElement;if(q.get("sessionbook")==="1"){h.classList.add("sb-booting");setTimeout(function(){h.classList.remove("sb-booting")},30000)}
  /* 덱 안 창(&embed=1)도 덱 모양(applyEmbed)이 입혀질 때까지 감춘다 — 느린 인터넷에서 워밍업 첫 화면이 몇 초 비쳤다(원장 2026-11-17 「스스로 공부하기에서도 그래」) */
  if(q.get("embed")==="1"&&window.parent!==window){h.classList.add("gb-booting");setTimeout(function(){h.classList.remove("gb-booting")},20000)}}catch(e){}})();</script>
  <style>html.sb-booting body{visibility:hidden}html.sb-booting::after{content:"교재를 만들고 있어요…";position:fixed;inset:0;display:grid;place-items:center;background:#f2f6fd;color:#1b2340;font:600 18px/1.5 "Pretendard","Noto Sans KR",system-ui,sans-serif;z-index:2147483647}@media print{html.sb-booting::after{display:none}html.sb-booting body{visibility:visible}}html.gb-booting body{visibility:hidden}html.gb-booting,html.gb-booting body{background:transparent!important}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f4" />
  <title>워밍업 학습</title>
  <link rel="stylesheet" href="./math-markup.css?v=20261027n" />
  <link rel="stylesheet" href="./golden-bell.css?v=20261117b" />
  <link rel="stylesheet" href="./golden-bell-book02.css?v=20261023h" />
  <link rel="stylesheet" href="./golden-bell-book03.css?v=20261023h" />
  <link rel="stylesheet" href="./golden-bell-book04.css?v=20261023h" />
  <link rel="stylesheet" href="./golden-bell-book05.css?v=20261023h" />
  <link rel="stylesheet" href="./golden-bell-source-animations.css?v=20260906b" />
  <link rel="stylesheet" href="./golden-bell-book10-animation.css?v=20260918a" />
  <link rel="stylesheet" href="./golden-bell-print-layout.css?v=20261118h" />
  <link rel="stylesheet" href="./golden-bell-game-print.css?v=20261003f" />
  <link rel="stylesheet" href="./print-templates.css?v=20261110w" />
  <link rel="stylesheet" href="./cover-designs.css?v=20261024a" />
  <link rel="stylesheet" href="./golden-bell-cover-picker.css?v=20261024a" />
  <link rel="stylesheet" href="./golden-bell-course-concepts.css?v=20261028z" />
  <link rel="stylesheet" href="./golden-bell-hands-on.css?v=20261028y" />
  <link rel="stylesheet" href="./golden-bell-clock-game.css?v=20261118b" />
  <link rel="stylesheet" href="./golden-bell-level-game.css?v=20261028y" />

</head>
<body>
  <header class="gold-header">
    <a id="backLink" class="back-link" href="./start.html"><span aria-hidden="true">←</span> 처음 화면</a>
    <div class="brand"><span id="courseBrand">1과정</span><strong>워밍업 학습</strong></div>
    <div class="student-name"><span>학습자</span><strong id="studentName">DEMO</strong></div>
  </header>

  <main class="gold-shell">
    <section class="gold-intro">
      <div class="intro-copy"><span>WARM-UP · LEARNING INDEX</span><h1>개념을 말하고,<br />문제로 확인해요.</h1><p>교재의 대표 개념을 짚고 워밍업과 추가 학습으로 이어가요.</p></div>
      <dl aria-label="학습 진행 정보"><div><dt>현재 권</dt><dd id="currentBookLabel">1권</dd></div><div><dt>완료</dt><dd id="completedCount">0 / 4</dd></div><div><dt>진행</dt><dd id="levelState">학습 중</dd></div></dl>
    </section>

    <section class="book-index">
      <label class="course-picker"><span>과정</span><select id="courseSelect" aria-label="학습 과정"></select></label>
      <div class="book-index-label"><span>BOOK INDEX</span><strong>교재 선택</strong></div>
      <nav id="bookTabs" class="book-tabs" aria-label="워밍업 교재 권 선택"></nav>
      <div class="print-actions"><label id="coursePrintModeWrap" class="course-print-mode" hidden><span>인쇄</span><select id="coursePrintMode" aria-label="인쇄 내용"><option value="study">학습지</option><option value="answers">답안과 풀이</option><option value="both">학습지와 풀이</option><option value="quick">빠른 정답</option></select></label><button id="printCoverButton" type="button">표지 · 도형 배경</button><button id="printSelectedButton" type="button">선택 학습 인쇄</button><button id="printLessonButton" type="button">현재 학습 인쇄</button><button id="printBookButton" type="button">이 권 전체 인쇄</button></div>
      <p id="printStatus" class="gold-print-status" role="status"></p>
      <label class="game-print-toggle"><input id="printGameQR" type="checkbox" checked /><span>게임 QR 포함</span></label>
    </section>

    <section class="gold-layout">
      <aside class="lesson-pane">
        <div class="pane-title"><span>이 권의 워밍업</span><strong id="bookTitle"></strong></div>
        <div id="lessonList" class="lesson-list"></div>
        <div id="bookSource" class="source-note"></div>
      </aside>

      <section class="lesson-stage" aria-live="polite">
        <div id="stageSteps" class="stage-steps"></div>
        <article id="lessonContent" class="lesson-content"></article>
      </section>
    </section>
  </main>

  <div id="goldPrintRoot" class="gold-print-root" aria-hidden="true"></div>

  <dialog id="coverDialog" class="gold-cover-dialog" aria-labelledby="coverDialogTitle">
    <header><h2 id="coverDialogTitle">교재 인쇄</h2><button id="coverDialogClose" type="button">닫기</button></header>
    <div class="cover-picker-layout">
      <div class="print-settings">
      <fieldset id="printUnitFieldset" hidden><legend>단원·학습 선택</legend><div class="print-unit-actions"><button id="printUnitsAll" type="button">전체 선택</button><button id="printUnitsNone" type="button">선택 해제</button></div><div id="printUnitList" class="print-unit-list"></div></fieldset>
      <fieldset id="printSectionFieldset" hidden><legend>인쇄할 부분</legend><div class="print-section-list"><label class="print-answer-toggle"><input type="checkbox" data-print-section="concept" checked /><span>개념 설명</span></label><label class="print-answer-toggle"><input type="checkbox" data-print-section="original" checked /><span>워밍업 문항</span></label><label class="print-answer-toggle"><input type="checkbox" data-print-section="story" checked /><span>추가 학습</span></label></div></fieldset>
      <fieldset id="printAnswerFieldset" hidden><legend>답안</legend><label class="print-answer-toggle"><input id="printIncludeAnswers" type="checkbox" /><span>답안과 풀이 포함</span></label></fieldset>
      <fieldset id="printCoverFieldset"><legend>표지</legend><div class="cover-options">
        <label><input type="radio" name="coverStyle" value="concept" checked /><span class="cover-swatch concept" aria-hidden="true"><i></i><i></i><i></i></span><strong>도형 배경</strong></label>
        <label><input type="radio" name="coverStyle" value="simple" /><span class="cover-swatch simple" aria-hidden="true"><i></i><i></i><i></i></span><strong>모눈 배경</strong></label>
        <label><input type="radio" name="coverStyle" value="none" /><span class="cover-swatch none" aria-hidden="true"></span><strong>표지 없음</strong></label>
      </div></fieldset>
      </div>
      <div id="coverPreview" class="gold-cover-preview" aria-label="선택한 교재 표지 미리보기"></div>
    </div>
    <footer><p id="printSelectionStatus" role="status"></p><button id="coverDialogApply" type="button">표지 적용</button><button id="printSelectionApply" type="button" hidden>선택 학습 인쇄</button></footer>
  </dialog>

  <script src="../../geometry/shared/question-bank.js?v=20260829g"></script>
  <script src="../../geometry/worksheet/generators.js?v=20261101n"></script>
  <script src="../../geometry/worksheet/render.js?v=20260904a"></script>
  <script src="./vendor/qrcode.js?v=2.0.4"></script>
  <script type="module" src="./golden-bell.js?v=20261118h"></script>
</body>
</html>
