<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fdfbf5" />
  <title>학습 진도표</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./my-study.css?v=20261029r" />
</head>
<body>
  <header class="ms-header">
    <a class="ms-back" id="backLink" href="./my-study.html"><span aria-hidden="true">←</span> 내 학습 상황</a>
    <div class="ms-title"><span>GIFTED MATH BANK · 스스로 공부</span><strong>학습 진도표</strong></div>
    <button type="button" class="ms-btn pl-print" id="printBtn">🖨 인쇄</button>
    <div class="ms-student" id="studentName">DEMO</div>
  </header>
  <main class="ms-main">
    <section class="pl-setup" aria-labelledby="setupHeading">
      <h2 id="setupHeading">계획 정하기</h2>
      <div class="pl-fields">
        <label class="pl-field"><span>시작하는 날</span><input type="date" id="startDate" /></label>
        <div class="pl-field"><span>수업 요일</span><div class="pl-days" id="days" role="group" aria-label="수업 요일"></div></div>
        <label class="pl-field"><span>시작 진도</span><span class="pl-row"><select id="fromBook" aria-label="시작 권"></select><select id="fromUnit" aria-label="시작 단원"></select><select id="fromPart" aria-label="시작 차시"></select></span></label>
        <label class="pl-field"><span>끝 권</span><select id="toBook"></select></label>
        <label class="pl-check"><input type="checkbox" id="holidays" /> 명절(설·추석 연휴)은 빼기</label>
      </div>
      <div class="pl-adds">
        <form class="pl-add" id="offForm"><label><span>쉬는 날 더하기</span><input type="date" id="offDate" required /></label><button type="submit" class="ms-btn">더하기</button></form>
        <form class="pl-add" id="makeupForm"><label><span>보강하기</span><input type="date" id="makeupDate" required /></label><button type="submit" class="ms-btn primary">보강 날 더하기</button><small class="pl-msg" id="makeupMsg" role="status"></small></form>
      </div>
    </section>
    <section class="ms-summary" id="summary" aria-label="진도 요약"></section>
    <section class="pl-table-wrap" aria-labelledby="tableHeading">
      <h2 id="tableHeading">진도표 <small id="tableNote"></small></h2>
      <div id="table"></div>
    </section>
    <p class="ms-note" id="note"></p>
  </main>
  <script type="module" src="./plan.js?v=20261029z"></script>
</body>
</html>
