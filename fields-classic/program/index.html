<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>필즈 더 클래식 대비 과정 | 지필드 영재교육</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#02050b;--surface:#080d14;--gold:#d4af37;--gold2:#f8dd83;--gold-glow:rgba(212,175,55,.2);--white:#f0ece2;--muted:#7a8a9a;--border:rgba(212,175,55,.15);--border2:rgba(255,255,255,.07);--navy:#0d1b2a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--white);overflow-x:hidden}
body.in-viewer{overflow:hidden}
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 20%,rgba(212,175,55,.1),transparent 40%),var(--bg)}
#gate.hidden{display:none}
.gate-card{width:min(420px,95vw);background:rgba(8,13,20,.97);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.7)}
.gate-bar{height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
.gate-body{padding:32px 28px 24px;text-align:center}
.gate-logo{width:56px;border-radius:10px;margin:0 auto 14px;display:block;filter:drop-shadow(0 0 12px var(--gold-glow))}
.gate-tag{font-size:10px;font-weight:900;letter-spacing:3px;color:var(--gold);margin-bottom:6px}
.gate-title{font-family:'DM Serif Display',serif;font-size:24px;color:var(--white);margin-bottom:6px}
.gate-desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.gate-input{width:100%;height:46px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:11px;color:var(--white);font-size:14px;font-weight:700;font-family:'Noto Sans KR',sans-serif;padding:0 14px;text-align:center;outline:none;margin-bottom:8px;transition:border-color .2s}
.gate-input:focus{border-color:var(--gold)}
.gate-input::placeholder{color:rgba(255,255,255,.2);font-weight:400;font-size:12px}
.gate-btn{width:100%;height:46px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-size:14px;font-weight:900;font-family:'Noto Sans KR',sans-serif;border:none;border-radius:11px;cursor:pointer;margin-top:4px}
.gate-btn:active{transform:scale(.97)}
.gate-error{min-height:18px;color:#e74c3c;font-size:12px;font-weight:700;margin-top:6px}
.gate-note{font-size:10px;color:rgba(255,255,255,.25);margin-top:12px;line-height:1.6}
#app{display:none;width:100%;height:100dvh;min-height:100vh;overflow:hidden;flex-direction:column}
#app.show{display:flex}
.app-header{position:sticky;top:0;z-index:100;padding:10px 20px;background:rgba(2,5,11,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:90px;filter:brightness(0) invert(1);opacity:.9}
.header-sep{width:1px;height:22px;background:var(--border)}
.header-badge{font-size:10px;font-weight:900;color:var(--gold);background:rgba(212,175,55,.08);border:1px solid var(--border);padding:3px 10px;border-radius:20px;letter-spacing:.05em}
.header-right{display:flex;align-items:center;gap:8px}
.header-student{font-size:12px;color:var(--muted)}
.header-student b{color:var(--gold)}
.header-logout{background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.header-logout:hover{border-color:var(--gold);color:var(--gold)}
#dashboard{flex:1;overflow-y:auto;padding:0 20px 60px}
.dash-hero{padding:36px 0 28px;text-align:center;position:relative}
.dash-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(212,175,55,.05),transparent 70%);pointer-events:none}
.dash-eyebrow{font-size:10px;font-weight:900;letter-spacing:3px;color:var(--gold);margin-bottom:10px}
.dash-title{font-family:'DM Serif Display',serif;font-size:clamp(22px,4vw,38px);color:var(--white);line-height:1.25;margin-bottom:6px}
.dash-title em{font-style:italic;color:var(--gold)}
.dash-sub{font-size:13px;color:var(--muted)}
.products-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.program-shelf{grid-column:1/-1;width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.program-menu{display:flex;flex-direction:column;gap:9px;position:sticky;top:74px}
.program-menu-card{width:100%;min-height:74px;border:1px solid var(--border2);border-radius:14px;background:rgba(8,13,20,.9);color:var(--white);font-family:'Noto Sans KR',sans-serif;text-align:left;padding:13px 14px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;cursor:pointer;transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}
.program-menu-card:hover{transform:translateX(3px);border-color:rgba(212,175,55,.32);background:rgba(212,175,55,.05)}
.program-menu-card.active{border-color:rgba(212,175,55,.62);background:linear-gradient(135deg,rgba(212,175,55,.16),rgba(255,255,255,.035));box-shadow:0 16px 36px rgba(0,0,0,.32),inset 0 0 0 1px rgba(212,175,55,.08)}
.program-menu-card.locked{opacity:.45;cursor:not-allowed}
.pm-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.055);font-size:18px}
.pm-title{font-size:13px;font-weight:900;line-height:1.3}
.pm-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}
.program-detail{min-height:430px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(8,13,20,.84) 42%,rgba(2,5,11,.96));box-shadow:0 28px 70px rgba(0,0,0,.38);overflow:hidden}
.program-panel{padding:22px 22px 24px;animation:panelSlide .24s cubic-bezier(.22,1,.36,1)}
@keyframes panelSlide{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.program-panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;border-bottom:1px solid var(--border2);padding-bottom:16px}
.program-panel-kicker{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--gold);margin-bottom:6px}
.program-panel-title{font-family:'DM Serif Display',serif;font-size:clamp(22px,3vw,32px);line-height:1.12;color:var(--white)}
.program-panel-title em{color:var(--gold);font-style:italic}
.program-panel-desc{font-size:12px;color:var(--muted);line-height:1.65;max-width:420px;text-align:right}
.program-book-row{display:flex;gap:clamp(14px,2.4vw,28px);align-items:flex-end;flex-wrap:wrap;justify-content:center;padding:8px 6px 18px}
.concept-showcase-host:empty{display:none}
.concept-showcase{display:grid;grid-template-columns:minmax(190px,260px) minmax(0,1fr);gap:28px;align-items:center;margin:-6px -22px 24px;padding:28px 30px 30px;border-bottom:1px solid var(--border);background:linear-gradient(105deg,rgba(212,175,55,.09),rgba(255,255,255,.025) 45%,rgba(0,0,0,.16));animation:conceptSlide .52s cubic-bezier(.22,1,.36,1)}
@keyframes conceptSlide{from{opacity:0;transform:translateY(-24px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0)}}
.concept-book-stage{height:230px;display:grid;place-items:center;perspective:950px}
.concept-book-3d{--w:136px;--h:190px;--d:34px;width:var(--w);height:var(--h);position:relative;transform-style:preserve-3d;animation:bookTurn 7s linear infinite;filter:drop-shadow(0 28px 34px rgba(0,0,0,.68))}
@keyframes bookTurn{0%{transform:rotateX(4deg) rotateY(-24deg)}45%{transform:rotateX(4deg) rotateY(150deg)}55%{transform:rotateX(4deg) rotateY(210deg)}100%{transform:rotateX(4deg) rotateY(336deg)}}
.concept-book-face{position:absolute;backface-visibility:hidden}
.concept-book-front,.concept-book-back{inset:0;border-radius:2px 8px 8px 2px}
.concept-book-front{transform:translateZ(calc(var(--d)/2));overflow:hidden;background:#0b2135;box-shadow:inset 10px 0 14px rgba(255,255,255,.06),inset -6px 0 10px rgba(0,0,0,.35)}
.concept-book-front img{width:100%;height:100%;object-fit:cover;display:block}
.concept-book-back{transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:linear-gradient(145deg,#102b43,#071421);border:1px solid rgba(212,175,55,.3)}
.concept-book-back::after{content:'G-FIELD';position:absolute;inset:0;display:grid;place-items:center;color:rgba(212,175,55,.7);font:800 13px 'Noto Sans KR',sans-serif;letter-spacing:.16em}
.concept-book-spine{top:0;left:0;width:var(--d);height:100%;transform-origin:left center;transform:rotateY(-90deg) translateX(calc(var(--d)/-2));background:linear-gradient(90deg,#02070d,#173c5a 48%,#06111d);border-left:1px solid rgba(212,175,55,.28);box-shadow:inset -4px 0 7px rgba(255,255,255,.1),inset 5px 0 8px rgba(0,0,0,.45)}
.concept-book-pages{top:4px;right:0;width:var(--d);height:calc(100% - 8px);transform-origin:right center;transform:rotateY(90deg) translateX(calc(var(--d)/2));background:repeating-linear-gradient(to bottom,#fffaf0 0 2px,#d7cdb9 2px 3px);box-shadow:inset 0 0 7px rgba(0,0,0,.35)}
.concept-book-top,.concept-book-bottom{left:3px;width:calc(100% - 6px);height:var(--d);background:repeating-linear-gradient(to right,#fffaf0 0 3px,#d9cfbc 3px 4px);box-shadow:inset 0 0 5px rgba(0,0,0,.24)}
.concept-book-top{top:0;transform-origin:top center;transform:rotateX(90deg) translateY(calc(var(--d)/-2))}
.concept-book-bottom{bottom:0;transform-origin:bottom center;transform:rotateX(-90deg) translateY(calc(var(--d)/2))}
.concept-detail-kicker{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--gold);margin-bottom:7px}
.concept-detail-title{font-family:'DM Serif Display','Noto Sans KR',sans-serif;font-size:clamp(24px,3vw,34px);line-height:1.15;color:var(--white);margin-bottom:12px}
.concept-topic-list{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px;padding:0;list-style:none}
.concept-topic-list li{font-size:11px;font-weight:800;color:#d7e5f3;border:1px solid rgba(147,197,253,.2);background:rgba(147,197,253,.07);border-radius:6px;padding:6px 9px}
.concept-detail-copy{font-size:11px;color:var(--muted);line-height:1.75;margin-bottom:16px;max-width:620px}
.concept-start{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:7px;padding:10px 16px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:900;cursor:pointer}
.concept-start:disabled{background:rgba(255,255,255,.06);color:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.1);cursor:not-allowed}
.program-run-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.program-run-card{min-height:132px;border:1px solid var(--border2);border-radius:14px;background:rgba(255,255,255,.035);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .16s,border-color .16s,background .16s}
.program-run-card:hover{transform:translateY(-3px);border-color:rgba(212,175,55,.36);background:rgba(212,175,55,.055)}
.program-run-card.locked{opacity:.45;cursor:not-allowed}
.program-run-book{--run-depth:14px;width:54px;height:74px;position:relative;transform-style:preserve-3d;transform:rotateY(-24deg) rotateX(5deg);filter:drop-shadow(0 12px 17px rgba(0,0,0,.58));margin-bottom:4px}
.program-run-cover{position:absolute;inset:0;border-radius:2px 7px 7px 2px;background:linear-gradient(160deg,#173555,#0d1b2a);display:grid;place-items:center;font-size:20px;transform:translateZ(calc(var(--run-depth)/2));backface-visibility:hidden;box-shadow:inset 8px 0 10px rgba(255,255,255,.06),inset -7px 0 10px rgba(0,0,0,.28)}
.program-run-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 28%,rgba(0,0,0,.2)),repeating-linear-gradient(105deg,rgba(255,255,255,.06) 0 1px,transparent 1px 6px);border-radius:inherit}
.program-run-cover::after{content:'';position:absolute;right:0;top:0;width:7px;height:100%;background:linear-gradient(to right,rgba(255,255,255,.38),rgba(0,0,0,.24));border-radius:0 7px 7px 0}
.program-run-back{position:absolute;inset:0;border-radius:2px 7px 7px 2px;background:#091624;transform:rotateY(180deg) translateZ(calc(var(--run-depth)/2));backface-visibility:hidden}
.program-run-spine{position:absolute;top:0;left:0;width:var(--run-depth);height:100%;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#040a12,#15304a,#07111e);transform:rotateY(-90deg) translateX(calc(var(--run-depth)/-2));transform-origin:left center;box-shadow:inset -2px 0 3px rgba(255,255,255,.16)}
.program-run-pages{position:absolute;top:2px;right:0;width:var(--run-depth);height:calc(100% - 4px);transform:rotateY(90deg) translateX(calc(var(--run-depth)/2));transform-origin:right center;background:repeating-linear-gradient(to bottom,#fffaf0 0 1px,#d4cab8 1px 2px)}
.program-run-top,.program-run-bottom{position:absolute;left:2px;width:calc(100% - 4px);height:var(--run-depth);background:repeating-linear-gradient(to right,#fffaf0 0 2px,#d4cab8 2px 3px)}
.program-run-top{top:0;transform-origin:top center;transform:rotateX(90deg) translateY(calc(var(--run-depth)/-2))}
.program-run-bottom{bottom:0;transform-origin:bottom center;transform:rotateX(-90deg) translateY(calc(var(--run-depth)/2))}
.program-run-card.theme-killer .program-run-cover{background:linear-gradient(160deg,#4a1a1a,#200909)}
.program-run-card.theme-mock .program-run-cover{background:linear-gradient(160deg,#2a1a4a,#160925)}
.program-run-card.theme-final .program-run-cover{background:linear-gradient(160deg,#173819,#091b10)}
.program-run-card.theme-archive .program-run-cover{background:linear-gradient(160deg,#332b10,#111108)}
.program-run-name{font-size:13px;font-weight:900;color:var(--white);line-height:1.35}
.program-run-desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:auto}
.program-lock{display:inline-flex;align-items:center;gap:4px;width:max-content;font-size:10px;font-weight:900;color:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px 8px;background:rgba(255,255,255,.035)}
.program-empty{min-height:240px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:820px){.program-shelf{grid-template-columns:1fr}.program-menu{position:relative;top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.program-panel-head{display:block}.program-panel-desc{text-align:left;margin-top:8px}.program-menu-card{min-height:68px}.concept-showcase{grid-template-columns:210px minmax(0,1fr)}}
@media(max-width:600px){.concept-showcase{grid-template-columns:1fr;margin:-4px -14px 22px;padding:22px 18px}.concept-book-stage{height:205px}.concept-book-3d{--w:118px;--h:166px}.concept-detail{text-align:center}.concept-topic-list{justify-content:center}.concept-detail-copy{text-align:left}}
@media(max-width:500px){.program-menu{grid-template-columns:1fr}.program-detail{border-radius:14px}.program-panel{padding:18px 14px}.program-book-row{gap:12px}.program-run-grid{grid-template-columns:1fr 1fr}}
@media(max-width:900px) and (orientation:landscape){
  #dashboard{padding:0 10px 24px}.dash-hero{padding:14px 0 12px}.dash-eyebrow{margin-bottom:4px}.dash-title{font-size:21px;margin-bottom:2px}.dash-sub{font-size:10px}
  .program-shelf{grid-template-columns:minmax(150px,24vw) minmax(0,1fr);gap:10px;align-items:start}
  .program-menu{position:sticky;top:52px;display:flex;flex-direction:column;gap:6px;max-height:calc(100dvh - 64px);overflow-y:auto}
  .program-menu-card{min-height:48px;padding:7px 8px;border-radius:10px;grid-template-columns:28px minmax(0,1fr);gap:7px}
  .pm-icon{width:28px;height:28px;border-radius:8px;font-size:15px}.pm-title{font-size:11px}.pm-sub{font-size:8px;margin-top:1px}
  .program-detail{min-height:calc(100dvh - 126px);border-radius:12px}.program-panel{padding:12px 10px 16px}.program-panel-head{display:flex;align-items:flex-end;margin-bottom:12px;padding-bottom:10px}.program-panel-title{font-size:20px}.program-panel-desc{font-size:9px;text-align:right;margin-top:0}
  .program-book-row{justify-content:flex-start;flex-wrap:nowrap;gap:9px;padding:4px 6px 12px;overflow-x:auto;scrollbar-width:thin}
  .program-book-row .shelf-book-3d{--shelf-depth:18px;width:74px;height:106px}.program-book-row .shelf-label{width:74px}.program-book-row .shelf-title-text{font-size:10px}.program-book-row .shelf-videos{font-size:8px}
  .concept-showcase{grid-template-columns:150px minmax(0,1fr);gap:14px;margin:-2px -10px 16px;padding:16px}.concept-book-stage{height:170px}.concept-book-3d{--w:92px;--h:130px;--d:24px}.concept-detail{text-align:left}.concept-topic-list{justify-content:flex-start}.concept-detail-copy{text-align:left}
}
.product-card{position:relative;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:20px 16px 16px;display:flex;flex-direction:column;gap:14px;transition:all .3s cubic-bezier(.22,1,.36,1);overflow:hidden;cursor:pointer}
.product-card.unlocked{border-color:rgba(212,175,55,.2)}
.product-card.unlocked:hover{transform:translateY(-5px);box-shadow:0 24px 48px rgba(0,0,0,.5),0 0 0 1px rgba(212,175,55,.25);border-color:rgba(212,175,55,.35)}
.product-card.locked{opacity:.45;cursor:not-allowed}
.lock-icon{position:absolute;top:12px;right:12px;font-size:14px;opacity:.6}
.book-wrap{perspective:700px;height:150px;display:flex;align-items:center;justify-content:center}
.book-3d{--book-depth:22px;width:90px;height:128px;position:relative;transform-style:preserve-3d;transform:rotateY(-22deg) rotateX(4deg);transition:transform .5s cubic-bezier(.22,1,.36,1);filter:drop-shadow(0 16px 22px rgba(0,0,0,.58))}
.product-card.unlocked:hover .book-3d{transform:rotateY(-26deg) rotateX(7deg) translateY(-4px)}
.book-front{position:absolute;inset:0;border-radius:2px 7px 7px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;transform:translateZ(calc(var(--book-depth)/2));backface-visibility:hidden;box-shadow:4px 8px 24px rgba(0,0,0,.6)}
.book-front::before,.shelf-book-front::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.16),transparent 18%,transparent 74%,rgba(0,0,0,.24)),repeating-linear-gradient(105deg,rgba(255,255,255,.055) 0 1px,transparent 1px 7px);mix-blend-mode:screen;pointer-events:none}
.book-front::after,.shelf-book-front::after{content:'';position:absolute;top:0;right:0;width:9px;height:100%;background:linear-gradient(to right,rgba(255,255,255,.42),rgba(255,255,255,.08),rgba(0,0,0,.26));opacity:.75;pointer-events:none}
.book-back{position:absolute;inset:0;border-radius:2px 7px 7px 2px;background:#091523;transform:rotateY(180deg) translateZ(calc(var(--book-depth)/2));backface-visibility:hidden}
.book-spine{position:absolute;top:0;left:0;width:var(--book-depth);height:100%;border-radius:2px 0 0 2px;transform:rotateY(-90deg) translateX(calc(var(--book-depth)/-2));transform-origin:left center;box-shadow:inset -3px 0 5px rgba(255,255,255,.14)}
.book-pages{position:absolute;top:3px;right:0;width:var(--book-depth);height:calc(100% - 6px);transform:rotateY(90deg) translateX(calc(var(--book-depth)/2));transform-origin:right center;background:repeating-linear-gradient(to bottom,#fffaf0 0 2px,#d4cab8 2px 3px)}
.book-top,.book-bottom{position:absolute;left:3px;width:calc(100% - 6px);height:var(--book-depth);background:repeating-linear-gradient(to right,#fffaf0 0 3px,#d4cab8 3px 4px)}
.book-top{top:0;transform-origin:top center;transform:rotateX(90deg) translateY(calc(var(--book-depth)/-2))}
.book-bottom{bottom:0;transform-origin:bottom center;transform:rotateX(-90deg) translateY(calc(var(--book-depth)/2))}
.book-shadow{position:absolute;bottom:-10px;left:5%;right:5%;height:10px;background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%);filter:blur(3px)}
.book-icon{font-size:26px}
.book-label{font-size:8px;font-weight:900;text-align:center;line-height:1.3;letter-spacing:.05em}
.theme-concept .book-front{background:linear-gradient(160deg,#1a3a5c,#0d2040)}.theme-concept .book-spine{background:#0f2535}.theme-concept .book-label{color:#93c5fd}
.theme-killer .book-front{background:linear-gradient(160deg,#4a1a1a,#2d0a0a)}.theme-killer .book-spine{background:#380f0f}.theme-killer .book-label{color:#fca5a5}
.theme-final .book-front{background:linear-gradient(160deg,#1a3a1a,#0a2010)}.theme-final .book-spine{background:#102510}.theme-final .book-label{color:#86efac}
.theme-mock .book-front{background:linear-gradient(160deg,#2a1a4a,#170a30)}.theme-mock .book-spine{background:#1a1030}.theme-mock .book-label{color:#d8b4fe}
.theme-archive .book-front{background:linear-gradient(160deg,#1a1a0a,#0f0f05)}.theme-archive .book-spine{background:#111108}.theme-archive .book-label{color:var(--gold)}
.product-badge{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--gold);background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.18);padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:6px}
.product-name{font-size:13px;font-weight:900;color:var(--white);line-height:1.35;margin-bottom:4px}
.product-desc{font-size:11px;color:var(--muted);line-height:1.55}
.product-action{margin-top:auto;padding-top:10px;border-top:1px solid var(--border2)}
.product-btn{width:100%;padding:9px;border-radius:9px;font-size:11px;font-weight:800;font-family:'Noto Sans KR',sans-serif;border:none;cursor:pointer;transition:opacity .15s}
.product-btn.open{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.product-btn.locked{background:rgba(255,255,255,.04);color:rgba(255,255,255,.25);cursor:not-allowed;border:1px solid rgba(255,255,255,.06)}
/* ── 3D 책장 챕터 뷰 ── */
.bookshelf-scene{padding:20px 0 40px;width:100%}
.bookshelf-row{display:flex;gap:clamp(12px,3vw,28px);justify-content:center;flex-wrap:wrap;align-items:flex-end;padding:0 10px}
.shelf-slot{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;flex:0 0 auto;border:0;background:transparent;padding:0;font-family:'Noto Sans KR',sans-serif}
.shelf-slot.locked{opacity:.62;filter:saturate(.62)}
.shelf-slot.selected .shelf-book-3d{transform:rotateY(-5deg) rotateX(1deg) translateY(-10px) scale(1.04);filter:drop-shadow(0 25px 36px rgba(212,175,55,.36))}
.shelf-book-wrap{perspective:800px}
.shelf-book-3d{--shelf-depth:26px;width:104px;height:148px;position:relative;transform-style:preserve-3d;transform:rotateY(-24deg) rotateX(5deg);transition:transform .45s cubic-bezier(.22,1,.36,1),filter .45s ease;filter:drop-shadow(0 20px 30px rgba(0,0,0,.72))}
.shelf-slot:hover .shelf-book-3d{transform:rotateY(-6deg) rotateX(1deg) translateY(-14px) scale(1.06);filter:drop-shadow(0 28px 40px rgba(212,175,55,.35)) drop-shadow(0 0 20px rgba(212,175,55,.15))}
.shelf-slot.is-final:hover .shelf-book-3d{filter:drop-shadow(0 28px 40px rgba(212,175,55,.55)) drop-shadow(0 0 32px rgba(212,175,55,.35))}
.shelf-book-front{position:absolute;inset:0;border-radius:2px 7px 7px 2px;overflow:hidden;transform:translateZ(calc(var(--shelf-depth)/2));backface-visibility:hidden;box-shadow:inset -3px 0 8px rgba(0,0,0,.4),inset 10px 0 10px rgba(255,255,255,.06)}
.shelf-book-front img{width:100%;height:100%;object-fit:cover;display:block}
.shelf-book-back{position:absolute;inset:0;border-radius:2px 7px 7px 2px;transform:rotateY(180deg) translateZ(calc(var(--shelf-depth)/2));background:linear-gradient(145deg,#102b43,#071421);border:1px solid rgba(212,175,55,.18);backface-visibility:hidden}
.shelf-book-spine{position:absolute;top:0;left:0;width:var(--shelf-depth);height:100%;background:linear-gradient(to right,#020408,#0a1628);border-radius:2px 0 0 2px;transform:rotateY(-90deg) translateX(calc(var(--shelf-depth)/-2));transform-origin:left center;box-shadow:inset -2px 0 4px rgba(255,255,255,.16)}
.shelf-book-pages{position:absolute;top:3px;right:0;width:var(--shelf-depth);height:calc(100% - 6px);transform:rotateY(90deg) translateX(calc(var(--shelf-depth)/2));transform-origin:right center;background:repeating-linear-gradient(to bottom,#f4ecd9 0 2px,#d1c7b4 2px 3px);box-shadow:inset 0 0 4px rgba(0,0,0,.3)}
.shelf-book-top,.shelf-book-bottom{position:absolute;left:3px;width:calc(100% - 6px);height:var(--shelf-depth);background:repeating-linear-gradient(to right,#fffaf0 0 3px,#d5cab7 3px 4px);box-shadow:inset 0 0 5px rgba(0,0,0,.25)}
.shelf-book-top{top:0;transform-origin:top center;transform:rotateX(90deg) translateY(calc(var(--shelf-depth)/-2))}
.shelf-book-bottom{bottom:0;transform-origin:bottom center;transform:rotateX(-90deg) translateY(calc(var(--shelf-depth)/2))}
.shelf-book-shadow{position:absolute;bottom:-14px;left:8%;right:8%;height:14px;background:radial-gradient(ellipse,rgba(0,0,0,.7),transparent 70%);filter:blur(6px)}
.shelf-label{text-align:center;width:104px}
.shelf-vol-text{font-size:9px;font-weight:900;color:var(--gold);letter-spacing:.12em;margin-bottom:3px}
.shelf-title-text{font-size:clamp(11px,2vw,13px);font-weight:900;color:var(--white);line-height:1.3}
.shelf-videos{font-size:10px;color:var(--muted);margin-top:3px}
.shelf-rail{width:100%;height:10px;background:linear-gradient(to bottom,#1a2d44,#080f1a);border-radius:5px;margin-top:20px;box-shadow:0 10px 30px rgba(0,0,0,.6),0 -1px 0 rgba(212,175,55,.1)}
.chapter-back-fancy{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:rgba(255,255,255,.6);font-size:12px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;margin-bottom:28px;font-family:'Noto Sans KR',sans-serif;transition:all .2s}
.chapter-back-fancy:hover{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.06)}
.shelf-section-title{font-family:'DM Serif Display',serif;font-size:clamp(18px,3vw,24px);color:var(--white);text-align:center;margin-bottom:6px}
.shelf-section-title em{color:var(--gold);font-style:italic}
.shelf-section-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:32px}
@media(max-width:500px){.bookshelf-row{gap:8px}.shelf-book-3d{width:88px;height:126px}.shelf-label{width:88px}}
#commentModal{display:none;position:fixed;inset:0;z-index:500;padding:20px;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);align-items:center;justify-content:center}
#commentModal.show{display:flex}
.modal-card{width:min(480px,95vw);background:rgba(8,13,20,.98);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.8);animation:modalIn .25s cubic-bezier(.22,1,.36,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:none}}
.modal-bar{height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
.modal-body{padding:24px 22px 20px}
.modal-vol{font-size:10px;font-weight:900;letter-spacing:3px;color:var(--gold);margin-bottom:6px}
.modal-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--white);margin-bottom:14px}
.modal-topics{background:rgba(255,255,255,.03);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.modal-topics-head{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
.modal-topics ul{list-style:none}
.modal-topics li{font-size:12px;color:var(--white);line-height:1.8;padding-left:14px;position:relative}
.modal-topics li::before{content:'▸';position:absolute;left:0;color:var(--gold);font-size:10px}
.modal-comment{background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.2);border-radius:10px;padding:12px 14px;margin-bottom:18px}
.modal-comment-head{font-size:10px;font-weight:900;color:var(--gold);margin-bottom:6px}
.modal-comment p{font-size:12px;color:rgba(255,255,255,.75);line-height:1.75}
.modal-actions{display:flex;gap:10px}
.modal-close{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.modal-go{flex:2;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-size:14px;font-weight:900;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.modal-go:active{transform:scale(.97)}
#rotateHint{display:none;position:fixed;inset:0;z-index:9998;background:linear-gradient(135deg,#02050b,#0d1b2a);flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}
#rotateHint.show{display:flex}
.rotate-icon{font-size:64px;animation:rotateAnim 1.5s ease-in-out infinite}
@keyframes rotateAnim{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
.rotate-title{font-size:18px;font-weight:900;color:var(--gold2)}
.rotate-desc{font-size:13px;color:var(--muted);line-height:1.7}
#viewer{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column}
#viewer.show{display:flex}
.viewer-header{padding:8px 12px;background:rgba(2,5,11,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.viewer-back{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid var(--border2);color:rgba(255,255,255,.65);font-size:11px;font-weight:700;font-family:'Noto Sans KR',sans-serif;padding:5px 10px;border-radius:7px;cursor:pointer}
.viewer-back:hover{border-color:var(--gold);color:var(--gold)}
.viewer-title{font-size:12px;font-weight:900;color:var(--gold2);flex:1;text-align:center}
.viewer-acts{display:flex;gap:6px}
.v-btn{background:rgba(255,255,255,.05);border:1px solid var(--border2);color:rgba(255,255,255,.65);font-size:11px;font-weight:700;font-family:'Noto Sans KR',sans-serif;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.v-btn:hover{border-color:var(--gold);color:var(--gold)}
.v-btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);border:none}
.viewer-tabs{padding:5px 8px;background:rgba(8,13,20,.92);border-bottom:1px solid var(--border);display:flex;gap:4px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.viewer-tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:5px 13px;border-radius:8px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:rgba(255,255,255,.55);font-size:11px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap;transition:all .14s}
.tab-btn:hover{border-color:rgba(212,175,55,.3);color:var(--gold2)}
.tab-btn.active{color:var(--navy);border-color:transparent;font-weight:900}
.tab-btn[data-type="check"].active{background:linear-gradient(135deg,#f093fb,#f5576c)}
.tab-btn[data-type="concept"].active{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.tab-btn[data-type="practice"].active{background:linear-gradient(135deg,#43e97b,#38f9d7)}
.tab-btn[data-type="final"].active{background:linear-gradient(135deg,var(--gold),var(--gold2))}
.tab-btn:not(.active)[data-type="check"]{color:rgba(245,87,108,.7)}
.tab-btn:not(.active)[data-type="concept"]{color:rgba(79,172,254,.7)}
.tab-btn:not(.active)[data-type="practice"]{color:rgba(67,233,123,.7)}
.tab-btn:not(.active)[data-type="final"]{color:var(--gold)}
.viewer-body{flex:1;display:grid;overflow:hidden;min-height:0}
.viewer-body.has-video{grid-template-columns:46% 54%}
.viewer-body.no-video{grid-template-columns:1fr}
.vpanel{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;min-height:0}
.vpanel-head{padding:7px 11px;background:linear-gradient(135deg,var(--navy),#132030);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.vpanel-title{font-size:12px;font-weight:900;color:var(--gold2)}
.vpanel-meta{font-size:10px;color:var(--muted)}
.vframe-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex-shrink:0}
#videoIframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.bpanel{overflow:hidden;min-height:0;display:flex;flex-direction:column;background:#343941}
.book-toolbar{height:36px;display:flex;align-items:center;justify-content:center;gap:8px;background:#202630;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.book-page-label{min-width:72px;text-align:center;color:#d8dee9;font-size:11px;font-weight:800}
.book-nav{height:24px;padding:0 10px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#d8dee9;font-size:11px;font-weight:800;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.book-nav:disabled{opacity:.35;cursor:not-allowed}
.book-stage{position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;padding:12px 8px 28px;scroll-behavior:smooth;scrollbar-gutter:stable both-edges}
.book-pages{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.book-sheet{position:relative;width:min(100%,820px);aspect-ratio:1075/1521;line-height:0;background:#fff;box-shadow:0 12px 34px rgba(0,0,0,.35);flex:none}
.viewer-body.no-video .book-sheet{width:min(100%,920px)}
.book-page-img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.book-watermark{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2;display:none}
.book-watermark span{position:absolute;left:50%;color:rgba(22,34,51,.15);font-size:38pt;font-weight:900;white-space:nowrap;transform:translate(-50%,-50%) rotate(-34deg);letter-spacing:0}
.book-watermark .wm-r1{top:26%}.book-watermark .wm-r2{top:50%}.book-watermark .wm-r3{top:74%}
.book-status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#526070;font-size:13px;font-weight:900;background:#f8fafc;z-index:3;pointer-events:none}
.book-status:empty{display:none}
@media print{
  #gate,#app,#rotateHint,#commentModal,#viewer .viewer-header,#viewer .viewer-tabs,#viewer .vpanel,.sec-toast{display:none!important}
  #viewer{position:relative!important;display:block!important}.viewer-body{display:block!important}
  .bpanel{overflow:visible!important;background:white!important;display:block!important}
  .book-toolbar,.book-status{display:none!important}.book-stage{display:block!important;padding:0!important;overflow:visible!important}
  .book-pages{display:block!important}
  .book-sheet{width:210mm!important;height:297mm!important;aspect-ratio:auto!important;margin:0!important;box-shadow:none!important;break-after:page!important;page-break-after:always!important;overflow:hidden!important}
  .book-watermark{display:block!important}
  .book-page-img{width:210mm!important;height:297mm!important;object-fit:fill!important}
  @page{size:A4;margin:0}
}
@media(max-height:500px) and (orientation:landscape){.viewer-header{padding:5px 10px}.viewer-tabs{padding:3px 8px}.tab-btn{padding:4px 10px;font-size:10px}}
@media(max-width:600px){.products-grid{grid-template-columns:1fr 1fr}#dashboard{padding:0 12px 40px}}
@media(max-width:380px){.products-grid{grid-template-columns:1fr}}
.sec-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99999;display:none;padding:9px 16px;border-radius:999px;background:rgba(2,5,11,.96);color:var(--gold2);font-size:11px;font-weight:800;border:1px solid var(--border)}
.sec-toast.show{display:block}
/* ── 재원생 타임라인 뷰 ── */
.timeline-wrap{max-width:620px;margin:0 auto;padding:10px 0 40px;position:relative}
.tl-item{position:relative;padding-left:64px;padding-bottom:26px}
.tl-item:last-child{padding-bottom:0}
.tl-line{position:absolute;left:26px;top:6px;bottom:-6px;width:2px;background:linear-gradient(to bottom,var(--gold),rgba(212,175,55,.15))}
.tl-item:last-child .tl-line{display:none}
.tl-item.locked .tl-line{background:rgba(255,255,255,.08)}
.tl-node{position:absolute;left:10px;top:2px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;z-index:2;border:2px solid;transition:all .3s}
.tl-item.done .tl-node{background:var(--grad-gold);border-color:var(--gold);color:var(--navy)}
.tl-item.current .tl-node{background:var(--grad-brand);border-color:var(--gold2);color:#fff;box-shadow:0 0 0 5px rgba(212,175,55,.18);animation:pulseNode 2s ease-in-out infinite}
.tl-item.locked .tl-node{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.25)}
@keyframes pulseNode{0%,100%{box-shadow:0 0 0 5px rgba(212,175,55,.18)}50%{box-shadow:0 0 0 9px rgba(212,175,55,.06)}}
.tl-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:15px 17px;transition:all .25s;cursor:pointer}
.tl-item.done .tl-card{border-color:rgba(212,175,55,.22)}
.tl-item.current .tl-card{border-color:rgba(212,175,55,.4);box-shadow:0 12px 32px rgba(0,0,0,.4),0 0 0 1px rgba(212,175,55,.2);background:linear-gradient(160deg,rgba(212,175,55,.06),var(--surface))}
.tl-item.locked .tl-card{opacity:.5;cursor:not-allowed}
.tl-item.done .tl-card:hover,.tl-item.current .tl-card:hover{transform:translateX(4px)}
.tl-step{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--gold);margin-bottom:4px}
.tl-name{font-size:15px;font-weight:900;color:var(--white);margin-bottom:3px}
.tl-desc{font-size:11px;color:var(--muted);line-height:1.5}
.tl-status{display:inline-block;margin-top:8px;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px}
.tl-status.done{background:rgba(212,175,55,.12);color:var(--gold);border:1px solid rgba(212,175,55,.25)}
.tl-status.current{background:var(--grad-brand);color:#fff}
.tl-status.locked{background:rgba(255,255,255,.04);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.08)}
.view-toggle{display:flex;justify-content:center;margin-bottom:20px}
.view-toggle button{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:700;padding:7px 16px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.view-toggle button:first-child{border-radius:8px 0 0 8px}
.view-toggle button:last-child{border-radius:0 8px 8px 0}
.view-toggle button.active{background:var(--grad-gold);color:var(--navy);border-color:var(--gold)}

/* Light library theme: paper-white surfaces, navy type, restrained gold accents. */
#gate,#app,#commentModal{--bg:#e9eff5;--surface:#fff;--gold:#8f6400;--gold2:#d6aa28;--gold-glow:rgba(143,100,0,.14);--white:#14283e;--muted:#627187;--border:rgba(143,100,0,.22);--border2:rgba(20,40,62,.12);--navy:#102b46}
#gate{background:linear-gradient(145deg,#e6edf4,#f8fafc 52%,#edf2f7)}
.gate-card{background:linear-gradient(180deg,#fff,#f5f8fb);border-color:rgba(20,40,62,.13);box-shadow:0 2.8px 2.2px rgba(20,40,62,.025),0 6.7px 5.3px rgba(20,40,62,.035),0 12.5px 10px rgba(20,40,62,.045),0 22.3px 17.9px rgba(20,40,62,.055),0 41.8px 33.4px rgba(20,40,62,.065),0 72px 60px rgba(20,40,62,.08),inset 0 1px 0 #fff}
.gate-logo{filter:drop-shadow(0 8px 12px rgba(20,40,62,.15))}.gate-input{background:#f3f6f9;border-color:rgba(20,40,62,.15);color:var(--white);box-shadow:inset 0 2px 5px rgba(20,40,62,.06),0 1px 0 #fff}.gate-input::placeholder{color:rgba(20,40,62,.35)}.gate-note{color:rgba(20,40,62,.48)}
#app{background:linear-gradient(180deg,#f5f8fb 0,#e7edf4 100%);color:var(--white)}
.app-header{background:rgba(255,255,255,.92);border-bottom-color:rgba(20,40,62,.12);box-shadow:0 2px 3px -1px rgba(20,40,62,.08),0 1px 0 rgba(255,255,255,.9)}
.header-logo{filter:none;opacity:1}.header-badge{background:#fff9e8}.header-logout{background:#f4f7fa;border-color:rgba(20,40,62,.14);color:#627187}.header-logout:hover{background:#fff;border-color:var(--gold)}
#dashboard{background:linear-gradient(180deg,#f5f8fb 0,#e7edf4 100%)}
.dash-hero::before{background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}

function renderBookPages(){
  const pages=document.getElementById("bookPages"),st=document.getElementById("bookStatus");
  const total=S.currentProduct?.pageCount||0,base=S.currentProduct?.pagesBase||"";
  if(!pages||!total||!base)return false;
  const key=base+"|"+total+"|"+(S.name||"");
  if(_bookRenderKey===key&&pages.children.length===total)return true;
  if(st)st.textContent="교재를 불러오는 중...";
  pages.innerHTML="";
  const frag=document.createDocumentFragment();
  for(let page=1;page<=total;page++){
    const sheet=document.createElement("div");
    sheet.className="book-sheet";
    sheet.dataset.page=String(page);
    const img=document.createElement("img");
    img.className="book-page-img";
    img.alt="교재 "+page+"쪽";
    img.decoding="async";
    img.src=bookUrl(page);
    img.addEventListener("load",()=>{if(page===_bookPage&&st)st.textContent="";},{once:true});
    img.addEventListener("error",()=>{sheet.classList.add("load-error");if(page===_bookPage&&st)st.textContent="교재 "+page+"쪽을 불러오지 못했습니다.";},{once:true});

    ch.videos.forEach(v=>{const b=document.createElement("button");b.className="tab-btn";b.textContent=v.label;b.dataset.k=v.key;b.dataset.type=v.type;b.addEventListener("click",()=>GF.selectVideo(ch,v.key));tabs.appendChild(b)});
    if(ch.videos.length)this.selectVideo(ch,ch.videos[0].key);
    document.getElementById("viewer").classList.add("show");document.body.classList.add("in-viewer");checkOrientation();
  },
  selectVideo(ch,key){
    const v=ch.videos.find(x=>x.key===key);S.currentVideo=v;
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.k===key));
    if(!v)return;
    document.getElementById("vPanelTitle").textContent=v.label.replace(/^[^\s]+\s/,"");
    document.getElementById("vPanelMeta").textContent=v.url?"준비됨":"준비 중";
    document.getElementById("videoIframe").src=v.url?embed(v.url):"";
    if(S.currentProduct?.pagesBase&&v.pdfPage)setBookPage(v.pdfPage);else setBookEmpty();
  },
  openMock(p){
    const name=encodeURIComponent(S.name||"");
    location.href=(p.mockUrl||"../mock/")+(name?`?student=${name}`:"");
  },
  openDirectViewer(productKey){
    const p=PRODUCTS.find(x=>x.key===productKey);if(!p)return;
    S.viewerOpen=true;S.currentProduct=p;
    document.getElementById("vTitle").textContent=p.icon+" "+p.name;
    const hasVid=p.hasVideo!==false;
    document.getElementById("vYtBtn").style.display=hasVid?"block":"none";
    document.getElementById("vBody").className="viewer-body "+(hasVid?"has-video":"no-video");
    document.getElementById("vPanel").style.display=hasVid?"flex":"none";
    const tabs=document.getElementById("vTabs");tabs.innerHTML="";
    (p.lessons||[]).forEach(l=>{const b=document.createElement("button");b.className="tab-btn";b.textContent=l.label;b.dataset.k=l.key;b.dataset.type=l.type||"concept";b.addEventListener("click",()=>{document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active",x.dataset.k===l.key));document.getElementById("videoIframe").src=l.url?embed(l.url):"";if(p.pagesBase&&l.pdfPage)setBookPage(l.pdfPage);else setBookEmpty();S.currentVideo={url:l.url}});tabs.appendChild(b)});
    if(p.lessons?.length){const first=p.lessons[0];document.getElementById("videoIframe").src=first.url?embed(first.url):"";if(p.pagesBase&&first.pdfPage)setBookPage(first.pdfPage);else setBookEmpty();tabs.querySelector(".tab-btn")?.classList.add("active")}
    document.getElementById("viewer").classList.add("show");document.body.classList.add("in-viewer");checkOrientation();
  },
  prevBookPage(){if(_bookPage>1)setBookPage(_bookPage-1)},
  nextBookPage(){const total=S.currentProduct?.pageCount||0;if(_bookPage<total)setBookPage(_bookPage+1)},
  openYt(){if(S.currentVideo?.url)window.open(S.currentVideo.url,"_blank","noopener")},
  closeViewer(){
    S.viewerOpen=false;
    document.getElementById("viewer").classList.remove("show");document.getElementById("viewer").style.visibility="";
    document.body.classList.remove("in-viewer");
    document.getElementById("videoIframe").src="";setBookEmpty("");
    S.currentChapter=null;S.currentVideo=null;
    checkOrientation();
  },
  logout(){
    S={name:"",perms:[],viewerOpen:false,currentChapter:null,currentVideo:null,currentProduct:null};
    sessionStorage.clear();
    document.getElementById("gate").classList.remove("hidden");document.getElementById("app").classList.remove("show");
    document.getElementById("viewer").classList.remove("show");document.getElementById("viewer").style.visibility="";
    document.getElementById("rotateHint").classList.remove("show");document.getElementById("commentModal").classList.remove("show");
    document.getElementById("app").style.visibility="";
    document.body.classList.remove("in-viewer");
    document.getElementById("videoIframe").src="";setBookEmpty("");
    document.getElementById("gCode").value="";document.getElementById("gName").value="";document.getElementById("gErr").textContent="";
    exitStudyFullscreen();
  }
};
function h(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function coverMarkup(ch,decorative=false){
  const imgFile=COVER_MAP[ch.key];
  return imgFile
    ? `<img src="${COVER_BASE}${imgFile}" alt="${decorative?"":h(ch.title)}" loading="lazy" onerror="this.hidden=true">`
    : "";
}
function pOk(p){return !!p&&S.perms.includes(p.key)}
function lessonKey(p){return p?.lessons?.[0]?.key||""}
function programGroups(){
  const concept=PRODUCTS.find(p=>p.type==="folder");
  const diagnostic=PRODUCTS.find(p=>p.type==="mock");
  const killer=PRODUCTS.find(p=>lessonKey(p)==="k1")||PRODUCTS.find(p=>p.theme==="theme-killer");
  const practice=PRODUCTS.filter(p=>/^p\d+/.test(lessonKey(p)));
  const finals=PRODUCTS.filter(p=>/^fi\d+/.test(lessonKey(p)));
  const ultimate=PRODUCTS.find(p=>lessonKey(p)==="u1");
  const archive=PRODUCTS.find(p=>lessonKey(p)==="a1");
  return [
    {id:"concept",icon:"📘",title:"TOP SECRET 개념",sub:"개념 교재 Vol.1~Final",kind:"chapters",product:concept,kicker:"TOP SECRET",head:"개념 완성",desc:"개념 책을 고르면 영상과 교재가 함께 열립니다."},
    {id:"killer",icon:"🎯",title:"킬러문항 완전 해제",sub:"최상위 유형 공략",kind:"products",items:[killer],kicker:"KILLER",head:"킬러문항 완전 해제",desc:"문항 유형은 보이지만 구매 권한이 있을 때만 열립니다."},
    {id:"diagnostic",icon:"🔍",title:"진단모의고사",sub:"진단 및 분석",kind:"products",items:[diagnostic],kicker:"DIAGNOSTIC",head:"진단모의고사",desc:"진단지는 선택 후 별도 모의고사 화면으로 이동합니다."},
    {id:"practice",icon:"📝",title:"실전 모의고사",sub:"1회~6회",kind:"products",items:practice,kicker:"PRACTICE",head:"실전 모의고사",desc:"각 회차를 확인하고 권한이 있는 회차만 학습할 수 있습니다."},
    {id:"final",icon:"🏁",title:"파이널 모의고사",sub:"1회~4회",kind:"products",items:finals,kicker:"FINAL",head:"파이널 모의고사",desc:"파이널 회차가 책처럼 펼쳐집니다."},
    {id:"ultimate",icon:"🏆",title:"최종 모의고사",sub:"최종 리허설",kind:"products",items:[ultimate],kicker:"LAST CHECK",head:"최종 모의고사",desc:"마지막 실전 점검용 모의고사입니다."},
    {id:"archive",icon:"📁",title:"자료실",sub:"자료 및 출력",kind:"products",items:[archive],kicker:"ARCHIVE",head:"자료실",desc:"제공 자료 목록은 보이고, 열람은 권한이 있을 때 가능합니다."}
  ].filter(g=>g.product||g.items?.some(Boolean));
}
function sectionUnlocked(g){
  if(g.product)return pOk(g.product);
  return (g.items||[]).some(pOk);
}
function runCard(p){
  if(!p)return "";
  const ok=pOk(p),idx=PRODUCTS.indexOf(p);
  return `<button class="program-run-card ${h(p.theme||"")} ${ok?"":"locked"}" onclick="GF.openProgramProduct(${idx})">
    <div class="program-run-book"><div class="program-run-cover">${h(p.icon||"")}</div><div class="program-run-back"></div><div class="program-run-spine"></div><div class="program-run-pages"></div><div class="program-run-top"></div><div class="program-run-bottom"></div></div>
    <div class="program-run-name">${h(p.name)}</div>
    <div class="program-run-desc">${h(p.desc||"")}</div>
    ${ok?"":'<span class="program-lock">🔒 열람 제한</span>'}
  </button>`;
}
function renderProgramPanel(id){
  const groups=programGroups();
  const g=groups.find(x=>x.id===id)||groups[0];
  const target=document.getElementById("programDetail");if(!target||!g)return;
  let body="";
  if(g.kind==="chapters"){
    const p=g.product,ok=pOk(p);
    body=`<div class="concept-showcase-host" id="conceptShowcase"></div>
    <div class="program-book-row">
      ${(p.chapters||[]).map(ch=>{
        return `<button class="shelf-slot${ch.key==="final"?" is-final":""} ${ok?"":"locked"}" data-chapter-key="${h(ch.key)}" onclick="GF.previewProgramChapter(${PRODUCTS.indexOf(p)},'${h(ch.key)}')">
          <div class="shelf-book-wrap"><div class="shelf-book-3d"><div class="shelf-book-front">${coverMarkup(ch)}</div><div class="shelf-book-back"></div><div class="shelf-book-spine"></div><div class="shelf-book-pages"></div><div class="shelf-book-top"></div><div class="shelf-book-bottom"></div><div class="shelf-book-shadow"></div></div></div>
          <div class="shelf-label"><div class="shelf-vol-text">${h(ch.vol)}</div><div class="shelf-title-text">${h(ch.title)}</div><div class="shelf-videos">${ok?"영상 "+ch.videos.length+"개":"🔒 열람 제한"}</div></div>
        </button>`;
      }).join("")}
    </div><div class="shelf-rail"></div>`;
  }else{
    const cards=(g.items||[]).map(runCard).join("");
    body=cards?`<div class="program-run-grid">${cards}</div>`:`<div class="program-empty">준비 중입니다.</div>`;
  }
  target.innerHTML=`<div class="program-panel">
    <div class="program-panel-head"><div><div class="program-panel-kicker">${h(g.kicker)}</div><div class="program-panel-title"><em>${h(g.head)}</em></div></div><p class="program-panel-desc">${h(g.desc)}</p></div>
    ${body}
  </div>`;
}
Object.assign(GF,{
  showMainGrid(){
    document.getElementById("mainGrid").style.display="";
    document.getElementById("chapterView").style.display="none";
    document.getElementById("timelineView").style.display="none";
    document.getElementById("dashTitle").innerHTML='필즈 더 클래식<br><em>프로그램 서재</em>';
    document.getElementById("dashSub").textContent="";
    document.getElementById("headerBadge").textContent="필즈 프로그램 서재";
    const groups=programGroups(),active=groups[0]?.id||"concept";
    const menu=groups.map(g=>`<button class="program-menu-card ${g.id===active?"active":""}" data-section="${g.id}" onclick="GF.selectProgramSection('${g.id}')"><span class="pm-icon">${h(g.icon)}</span><span><span class="pm-title">${h(g.title)}</span><span class="pm-sub">${h(g.sub)}${sectionUnlocked(g)?"":" · 열람 제한"}</span></span></button>`).join("");
    const grid=document.getElementById("mainGrid");
    grid.innerHTML=`<div class="program-shelf"><nav class="program-menu">${menu}</nav><section class="program-detail" id="programDetail"></section></div>`;
    renderProgramPanel(active);
  },
  selectProgramSection(id){
    document.querySelectorAll(".program-menu-card").forEach(b=>b.classList.toggle("active",b.dataset.section===id));
    renderProgramPanel(id);
  },
  previewProgramChapter(productIndex,chapterKey){
    const p=PRODUCTS[productIndex],ch=p?.chapters?.find(c=>c.key===chapterKey);
    const host=document.getElementById("conceptShowcase");if(!p||!ch||!host)return;
    const ok=pOk(p);
    document.querySelectorAll(".program-book-row .shelf-slot").forEach(b=>b.classList.toggle("selected",b.dataset.chapterKey===chapterKey));
    const topicItems=(ch.topics||[]).map(t=>`<li>${h(t)}</li>`).join("");
    const detailCopy=ch.comment||`${ch.title}에서 꼭 알아야 할 개념과 대표 유형을 차례대로 학습합니다.`;
    host.innerHTML=`<section class="concept-showcase">
      <div class="concept-book-stage" aria-hidden="true">
        <div class="concept-book-3d">
          <div class="concept-book-face concept-book-front">${coverMarkup(ch,true)}</div>
          <div class="concept-book-face concept-book-back"></div>
          <div class="concept-book-face concept-book-spine"></div>
          <div class="concept-book-face concept-book-pages"></div>
          <div class="concept-book-face concept-book-top"></div>
          <div class="concept-book-face concept-book-bottom"></div>
        </div>
      </div>
      <div class="concept-detail">
        <div class="concept-detail-kicker">${h(ch.vol)} · ${h(ch.subtitle)}</div>
        <div class="concept-detail-title">${h(ch.title)}</div>
        <ul class="concept-topic-list">${topicItems}</ul>
        <p class="concept-detail-copy">${h(detailCopy)}</p>
        <button class="concept-start" ${ok?`onclick="GF.launchProgramChapter(${productIndex},'${h(ch.key)}')"`:"disabled"}>${ok?"▶ 학습 시작":"🔒 구매 후 열람 가능"}</button>
      </div>
    </section>`;
  },
  launchProgramChapter(productIndex,chapterKey){
    const p=PRODUCTS[productIndex],ch=p?.chapters?.find(c=>c.key===chapterKey);
    if(!p||!ch||!pOk(p)){toast();return;}
    S.currentProduct=p;S.currentChapter=ch;
    this.openChapterViewer(ch);
  },
  openProgramChapter(productIndex,chapterKey){
    const p=PRODUCTS[productIndex];if(!p||!pOk(p)){toast();return;}
    this.showChapterModal(p.key,chapterKey);
  },
  openProgramProduct(productIndex){
    const p=PRODUCTS[productIndex];if(!p||!pOk(p)){toast();return;}
    if(p.type==="mock")this.openMock(p);else if(p.type==="folder")this.showChapters(p.key);else this.openDirectViewer(p.key);
  }
});
document.addEventListener("DOMContentLoaded",()=>{
  security();
  const ci=document.getElementById("gCode"),ni=document.getElementById("gName");
  ci?.addEventListener("keydown",e=>{if(e.key==="Enter")ni?.focus()});
  ni?.addEventListener("keydown",e=>{if(e.key==="Enter")GF.login()});
  setTimeout(()=>ci?.focus(),60);
  const sc=sessionStorage.getItem("gf_c"),sn=sessionStorage.getItem("gf_n");
  if(sc&&sn)verify(sc).then(r=>{if(r){S.name=r.name||sn;S.perms=r.perms;S.studentType=r.type||"legacy";GF.showApp()}else sessionStorage.clear()});
});
window.GF=GF;
})();
</script>
</body>
</html>
