<!DOCTYPE html>

<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
:root{--b:#16417c;--b2:#0d2b55;--g:#eac996;--ink:#0f172a;--muted:#64748b;--bg:#eef3f8;--line:#dbe4ee;--ok:#16a34a;--no:#dc2626;--wait:#d97706}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;font-family:Pretendard,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,var(--b2),var(--b))}.gate{width:min(430px,94vw);background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 28px 80px #0006}.bar{height:6px;background:linear-gradient(90deg,var(--b),var(--g))}.gate-body{padding:34px 28px;text-align:center}.logo{font-size:21px;font-weight:900;color:var(--b);margin-bottom:7px}.logo i{font-style:normal;background:var(--b);color:var(--g);padding:2px 8px;border-radius:7px}.kicker{font-size:10px;font-weight:900;letter-spacing:2px;color:#a66a12}.gate h1{font-size:24px;margin:10px 0 8px}.gate p{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:18px}.gate input{width:100%;height:50px;border:2px solid var(--line);border-radius:13px;text-align:center;font-size:16px;font-weight:800;outline:none}.gate input:focus{border-color:var(--b)}.primary{border:0;background:linear-gradient(135deg,var(--b),#1e3a6b);color:#fff;font-weight:900;border-radius:13px}.gate button{width:100%;height:51px;margin-top:10px}.error{min-height:20px;color:var(--no);font-size:12px;font-weight:800;margin-top:6px}
header{position:sticky;top:0;z-index:20;background:#fffffff0;backdrop-filter:blur(14px);border-bottom:1px solid #16417c22}.head{max-width:980px;margin:auto;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:var(--b)}.student{font-size:12px;font-weight:900;color:var(--b);background:#16417c12;padding:6px 11px;border-radius:999px}
main{max-width:980px;margin:auto;padding:22px 14px 60px}.hero{background:linear-gradient(145deg,var(--b2),var(--b));color:#fff;border-radius:21px;padding:24px;box-shadow:0 14px 35px #0f172a1c}.hero small{color:var(--g);font-weight:900;letter-spacing:.15em}.hero h2{font-size:clamp(23px,5vw,34px);margin-top:7px}.hero p{font-size:12px;color:#ffffffb3;margin-top:6px}.sec{display:flex;align-items:center;gap:9px;color:var(--b);font-size:11px;font-weight:900;letter-spacing:.1em;margin:22px 0 11px}.sec:after{content:"";height:1px;background:#16417c2b;flex:1}
.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.round{min-height:91px;border:2px solid #e1e8f0;background:#fff;border-radius:14px;padding:10px 6px;text-align:center}.round.active{border-color:var(--b);background:#16417c0c}.round strong{display:block;font-size:22px;color:var(--b)}.round span{font-size:10px;color:var(--muted);font-weight:700}.round em{display:inline-block;font-style:normal;font-size:9px;font-weight:900;margin-top:6px;padding:2px 7px;border-radius:999px;background:#16417c12;color:var(--b)}.round em.pending{background:#d9770617;color:var(--wait)}
.toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:16px 0}.mode,.reset{min-height:47px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--b);font-weight:900;padding:8px}.mode.active{border-color:var(--b);background:#16417c0c}.meta{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:10px;font-weight:800;color:var(--muted);background:#fff;border:1px solid var(--line);padding:5px 9px;border-radius:999px}.chip.warn{color:var(--wait);border-color:#d9770640;background:#d977060d}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.q,.calc{min-height:94px;background:#fff;border:2px solid #e4eaf1;border-radius:12px;padding:9px}.q.ox,.calc.ox{cursor:pointer;user-select:none}.q.ok,.calc.ok{border-color:#16a34a7a;background:#16a34a0d}.q.no,.calc.no{border-color:#dc262673;background:#dc26260b}.q.pending{border-style:dashed;background:#f8fafc;color:#94a3b8}.qno{font-size:11px;font-weight:900;color:var(--b)}.type{font-size:8.5px;font-weight:800;color:var(--muted);margin:4px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inp{width:100%;height:34px;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:12px;font-weight:800;padding:0 4px;outline:none}.inp:focus{border-color:var(--b)}.mark{font-size:24px;font-weight:900;text-align:center;line-height:32px;color:#cbd5e1}.ok .mark{color:var(--ok)}.pending-t{font-size:10px;font-weight:800;text-align:center;margin-top:12px;color:var(--wait)}
.calcbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}.calchead{font-size:12px;font-weight:900;color:var(--b);margin-bottom:8px}.calcgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calc{min-height:68px;text-align:center;padding:7px}.calc label{display:block;font-size:9px;font-weight:900;color:var(--b);margin-bottom:5px}.submit{text-align:center;margin:25px 0}.submit button{width:min(370px,100%);height:55px}.progress{font-size:11px;color:var(--muted);font-weight:700;margin-top:8px}
#result{margin-top:28px}.scorebox{background:linear-gradient(145deg,var(--b2),var(--b));color:#fff;border-radius:21px;padding:27px;text-align:center}.scorebox small{color:#ffffffaa}.score{font-size:70px;line-height:1;font-weight:900;color:var(--g);margin:6px 0}.grade{display:inline-block;margin-top:11px;border:1px solid #eac99677;background:#eac9961c;color:var(--g);font-weight:900;padding:7px 17px;border-radius:999px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:10px}.card h3{display:flex;align-items:center;gap:8px;color:var(--b);font-size:11px;letter-spacing:.1em;margin-bottom:12px}.card h3:after{content:"";height:1px;background:#16417c1f;flex:1}.stat{display:grid;grid-template-columns:85px 1fr 45px;gap:8px;align-items:center;margin:9px 0;font-size:11px;font-weight:800}.track{height:8px;background:#e8edf3;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--b),#3b82f6)}.weak{display:flex;justify-content:space-between;gap:10px;padding:10px;margin-top:7px;border:1px solid #dc262622;background:#dc26260b;border-radius:10px}.weak b{font-size:12px;color:var(--no)}.weak small{display:block;color:var(--muted);margin-top:3px}.detail{overflow-x:auto}table{width:100%;min-width:640px;border-collapse:collapse;font-size:10px}th,td{border:1px solid var(--line);padding:7px 5px;text-align:center}th{background:#16417c12;color:var(--b)}tr.wrong{background:#dc262609}.o{color:var(--ok);font-weight:900}.x{color:var(--no);font-weight:900}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}.actions a,.actions button{min-height:45px;border-radius:11px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900}.actions a{background:var(--b);color:#fff;border:0}.actions button{background:#fff;color:var(--b);border:2px solid var(--line)}
@media(max-width:720px){.rounds{grid-template-columns:repeat(3,1fr)}.qgrid{grid-template-columns:repeat(4,1fr)}.calcgrid{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){.qgrid{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.reset{grid-column:1/-1}.calcgrid{grid-template-columns:repeat(3,1fr)}}@media print{#gate,header,.hero,.rounds,.toolbar,.submit,.actions{display:none!important}main{max-width:none;padding:0}.card,.scorebox{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="gate"><div class="gate"><div class="bar"></div><div class="gate-body"><div class="logo"><i>G</i> G-FIELD</div><div class="kicker">FIELDS THE CLASSIC · PRACTICE TEST</div><h1>실전 모의고사 채점</h1><p>학생 이름을 입력한 뒤 회차를 선택하면<br>채점·결과 분석·약점 확인을 진행합니다.</p><input id="studentInput" autocomplete="off" placeholder="학생 이름"><button class="primary" onclick="enterViewer()">채점 시작 →</button><div class="error" id="gateError"></div></div></div></div>
<header id="header" class="hidden"><div class="head"><div class="brand">G-FIELD · 실전 모의고사</div><div class="student" id="headerName"></div></div></header>
<main id="app" class="hidden"><section class="hero"><small>GFIELD GIFTED EDUCATION</small><h2>실전 모의고사 채점 뷰어</h2><p>1~6회 답안을 채점하고 유형별 결과와 해설 영상을 확인합니다.</p></section><div class="sec">회차 선택</div><div class="rounds" id="roundGrid"></div><section id="examPanel" class="hidden"><div class="toolbar"><button id="modeOx" class="mode active" onclick="setMode('ox')">빠른 OX 채점</button><button id="modeInput" class="mode" onclick="setMode('input')">학생 답안 입력</button><button class="reset" onclick="resetCurrent()">초기화</button></div><div class="meta" id="examMeta"></div><div id="answerArea"></div><div class="submit"><button class="primary" onclick="submitExam()">채점하고 결과 분석하기</button><div class="progress" id="progress"></div></div></section><section id="result" class="hidden"></section></main>
<script>
(()=>{'use strict';
const EXAMS={
1:{answers:['▲검은세모','9,8,6,7','4','3','2등','69','21','14','14','6','17명','14','27','62','4개','49개','13','35','41번째','23'],videoUrl:'https://youtu.be/41mXpws-gng',hasCalc:true,calcA:[8,29,42,24,57,81,102],calcS:[26,4,18,23,33,24,17]},
2:{answers:['5,7,6,8','4','△','3','2등','25','57','11','6','12개','38','19','18명','26','35','64개','4개','13','16','36번째'],videoUrl:'https://youtu.be/S-P096L75ps',hasCalc:true,calcA:[29,42,57,81],calcS:[4,18,33,24],calcM:[28,56,54,4,7,9]},
3:{answers:['23개','15명','6개','5번','16','(1)138(2)420','연수:새,애나:원숭이,재훈:고양이,수현:강아지','36','(1)16,22(2)32,64','14조각','민트2개','12개','5,4,5,7','+,+,-/+,-,+/-,+,-','15,16','16개','20,21,24,27,10,12,14,17','21지우기/10지우기','8개','마방진합45'],videoUrl:'https://youtu.be/6YU0_X5ixEQ',hasCalc:true,calcA:[90,120,120],calcS:[19,62,59]},
4:{answers:['5개','나8다4라3cm','2+9=11,7×2=14,5,6','18','5,3,1,6','8','세윤203현희193도연192','6개','7','10,1','10개','9명','85','흰7개더많음','스페이드9별1하트8','21','10,12,3,26','사과5바나나15포도12','동하최대영혜최소','주연:햄스터,유빈:원숭이,유준:고양이,관호:강아지'],videoUrl:'https://youtu.be/KLQH2Mrjm8c',hasCalc:false},
5:{answers:['11,8','27,47,5,28','','6,7,10,11,4,9,10','꼭짓점3,5,7/나머지6,2,4','A=9,B=1,C=2','검은동그라미2개','17','세모6개','5개','10개','','5명','9개','10개','21개','미나','5','11명',''],videoUrl:'https://youtu.be/kyHuxpZhcTQ',hasCalc:false},
6:{answers:['각조각17씩','15','','4,0,1,2','7','','','','2','5,3,7,1','4,2,4,2,3,2','50명40명','13,10,7,4','11=18-7/15=7+8','','A=16,B=18','5개,6개','','',''],videoUrl:'https://youtu.be/uBSJ_-2IhR8',hasCalc:false}};
// 문항 내용을 확인한 뒤 '회차-문항번호' 형식으로 추가합니다.
const Q_KEYPOINTS={};
let studentName='',currentRound=0,inputMode='ox',QS=[],CALCS=[];const answerState={},oxState={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,'').replace(/[，、]/g,',').replace(/：/g,':').replace(/／/g,'/').replace(/[－−]/g,'-').replace(/[＊xｘ]/g,'×').replace(/㉠|①/g,'(1)').replace(/㉡|②/g,'(2)').replace(/[\.。]/g,'')}
function correct(user,answer){if(!answer)return null;return String(answer).split('||').some(a=>norm(user)===norm(a))}
function infer(a,i){a=String(a||'');if(!a)return'정답 미확정';if(/[도형세모동그라미꼭짓점스페이드하트별cm조각▲△]/i.test(a))return'도형·공간';if(/[연수애나재훈수현세윤현희도연주연유빈유준관호동하영혜미나새원숭이고양이강아지햄스터등명번째최대최소지우기]/.test(a))return'논리·추리';if(/[+\-×=\/]|마방진|A=|B=|C=/.test(a))return'규칙·식';if(a.includes(',')||/\d개|\d번|\d명|\d조각/.test(a))return'수·규칙';return i<5?'기초 사고력':'종합 사고력'}
function build(round){const e=EXAMS[round];QS=e.answers.map((answer,i)=>({id:i+1,answer,confirmed:answer!=='',type:infer(answer,i),keyPoint:Q_KEYPOINTS[`${round}-${i+1}`]||''}));CALCS=[];[['덧셈','calcA'],['뺄셈','calcS'],['곱셈','calcM']].forEach(([label,key])=>(e[key]||[]).forEach((answer,i)=>CALCS.push({id:`${key}-${i}`,group:key,label,no:i+1,answer:String(answer)})))}
const sk=()=>`gfield-exam:${studentName}:${currentRound}`;
function save(){if(!currentRound)return;sessionStorage.setItem(sk(),JSON.stringify({inputMode,answers:answerState[currentRound]||{},ox:oxState[currentRound]||{}}))}
function load(){answerState[currentRound]={};oxState[currentRound]={};try{const x=JSON.parse(sessionStorage.getItem(sk())||'null');if(x){answerState[currentRound]=x.answers||{};oxState[currentRound]=x.ox||{};if(['ox','input'].includes(x.inputMode))inputMode=x.inputMode}}catch(_){}}
function enterViewer(){const v=document.getElementById('studentInput').value.trim();if(!v){gateError.textContent='학생 이름을 입력해 주세요.';return}studentName=v;gate.classList.add('hidden');header.classList.remove('hidden');app.classList.remove('hidden');headerName.textContent=`${v} 학생`;renderRounds();const r=Number(new URLSearchParams(location.search).get('round'));selectRound(r>=1&&r<=6?r:1)}
function renderRounds(){roundGrid.innerHTML=Object.keys(EXAMS).map(k=>{const r=+k,p=EXAMS[r].answers.filter(a=>!a).length;return`<button class="round ${r===currentRound?'active':''}" onclick="selectRound(${r})"><strong>${r}</strong><span>실전 모의고사</span><em class="${p?'pending':''}">${p?`미확정 ${p}문항`:'정답 확정'}</em></button>`}).join('')}
function selectRound(r){if(!EXAMS[r])return;if(currentRound)save();currentRound=r;build(r);load();examPanel.classList.remove('hidden');result.classList.add('hidden');renderRounds();renderExam();history.replaceState(null,'',`${location.pathname}?round=${r}&student=${encodeURIComponent(studentName)}`)}
function setMode(m){inputMode=m;result.classList.add('hidden');renderExam();save()}
function renderExam(){modeOx.classList.toggle('active',inputMode==='ox');modeInput.classList.toggle('active',inputMode==='input');const e=EXAMS[currentRound],pending=QS.filter(q=>!q.confirmed).length;examMeta.innerHTML=`<span class="chip">실전 모의고사 ${currentRound}회</span><span class="chip">사고력 ${QS.length}문항</span><span class="chip">채점 가능 ${QS.length-pending}문항</span>${e.hasCalc?`<span class="chip">연산 ${CALCS.length}문항</span>`:''}${pending?`<span class="chip warn">정답 미확정 ${pending}문항 · 점수 제외</span>`:''}`;answerArea.innerHTML=`<div class="sec">사고력 답안</div><div class="qgrid">${QS.map(renderQ).join('')}</div>${e.hasCalc?renderCalcs():''}`;progressText()}
function renderQ(q){if(!q.confirmed)return`<div class="q pending"><div class="qno">Q${String(q.id).padStart(2,'0')}</div><div class="type">정답 미확정</div><div class="pending-t">채점 제외</div></div>`;const key=`q${q.id}`,v=(answerState[currentRound]||{})[key]||'',on=(oxState[currentRound]||{})[key];if(inputMode==='ox')return`<div class="q ox ${on?'ok':''}" onclick="toggleOx('${key}')"><div class="qno">Q${String(q.id).padStart(2,'0')}</div><div class="type">${esc(q.type)}</div><div class="mark">${on?'○':'탭'}</div></div>`;const state=v===''?'':correct(v,q.answer)?'ok':'no';return`<div class="q ${state}"><div class="qno">Q${String(q.id).padStart(2,'0')}</div><div class="type">${esc(q.type)}</div><input class="inp" value="${esc(v)}" placeholder="답 입력" oninput="setAnswer('${key}',this.value,this)"></div>`}
function renderCalcs(){const groups=[...new Set(CALCS.map(c=>c.group))];return`<div class="sec">연산 답안</div>${groups.map(g=>{const a=CALCS.filter(c=>c.group===g);return`<div class="calcbox"><div class="calchead">${a[0].label} · ${a.length}문항</div><div class="calcgrid">${a.map(renderCalc).join('')}</div></div>`}).join('')}`}
function renderCalc(c){const key=`c-${c.id}`,v=(answerState[currentRound]||{})[key]||'',on=(oxState[currentRound]||{})[key];if(inputMode==='ox')return`<div class="calc ox ${on?'ok':''}" onclick="toggleOx('${key}')"><label>${c.label} ${c.no}</label><div class="mark">${on?'○':'탭'}</div></div>`;const state=v===''?'':correct(v,c.answer)?'ok':'no';return`<div class="calc ${state}"><label>${c.label} ${c.no}</label><input class="inp" value="${esc(v)}" placeholder="답" oninput="setAnswer('${key}',this.value,this)"></div>`}
function toggleOx(key){oxState[currentRound]=oxState[currentRound]||{};oxState[currentRound][key]=!oxState[currentRound][key];renderExam();save()}
function answerFor(key){if(key.startsWith('q'))return QS.find(q=>`q${q.id}`===key)?.answer||'';return CALCS.find(c=>`c-${c.id}`===key)?.answer||''}
function setAnswer(key,v,el){answerState[currentRound]=answerState[currentRound]||{};answerState[currentRound][key]=v;const card=el.closest('.q,.calc'),a=answerFor(key);card.classList.remove('ok','no');if(v.trim()&&a)card.classList.add(correct(v,a)?'ok':'no');progressText();save()}
function progressText(){const total=QS.filter(q=>q.confirmed).length+CALCS.length,entered=inputMode==='ox'?Object.values(oxState[currentRound]||{}).filter(Boolean).length:Object.values(answerState[currentRound]||{}).filter(v=>String(v).trim()).length;progress.textContent=inputMode==='ox'?`맞은 것으로 표시한 문항 ${entered}개 · 표시하지 않은 문항은 오답입니다.`:`${entered} / ${total}문항 입력 · 빈 답안은 오답입니다.`}
function resetCurrent(){if(!confirm(`${currentRound}회 답안을 모두 지울까요?`))return;answerState[currentRound]={};oxState[currentRound]={};sessionStorage.removeItem(sk());result.classList.add('hidden');renderExam()}
function mainResults(){return QS.map(q=>{if(!q.confirmed)return{...q,status:null,user:''};const key=`q${q.id}`;if(inputMode==='ox')return{...q,status:!!(oxState[currentRound]||{})[key],user:''};const user=(answerState[currentRound]||{})[key]||'';return{...q,status:correct(user,q.answer),user}})}
function calcResults(){return CALCS.map(c=>{const key=`c-${c.id}`;if(inputMode==='ox')return{...c,status:!!(oxState[currentRound]||{})[key],user:''};const user=(answerState[currentRound]||{})[key]||'';return{...c,status:correct(user,c.answer),user}})}
function grade(s){return s>=90?'실전 준비 매우 우수':s>=80?'실전 합격권':s>=70?'보완 후 합격권':s>=60?'약점 유형 집중 필요':'기초 유형 재점검 필요'}
function videoUrl(){const e=EXAMS[currentRound];return`../video-viewer/?video=${encodeURIComponent(e.videoUrl)}&title=${encodeURIComponent(`실전 모의고사 ${currentRound}회 해설`)}&student=${encodeURIComponent(studentName)}`}
function submitExam(){const main=mainResults(),calc=calcResults(),graded=main.filter(x=>x.status!==null),all=[...graded,...calc],ok=all.filter(x=>x.status).length,total=all.length,score=total?Math.round(ok/total*100):0,map={};graded.forEach(x=>{map[x.type]??={total:0,ok:0,wrong:[]};map[x.type].total++;if(x.status)map[x.type].ok++;else map[x.type].wrong.push(x.id)});const rows=Object.entries(map).map(([name,d])=>({name,...d,pct:Math.round(d.ok/d.total*100)})).sort((a,b)=>a.pct-b.pct),weak=rows.filter(x=>x.ok<x.total).slice(0,3),calcWrong=calc.filter(x=>!x.status);result.innerHTML=`<div class="scorebox"><small>${esc(studentName)} 학생 · 실전 모의고사 ${currentRound}회</small><div class="score">${score}</div><small>/ 100점 · ${ok}/${total}문항 정답${QS.some(q=>!q.confirmed)?' · 미확정 제외':''}</small><div class="grade">${grade(score)}</div></div><div class="card"><h3>유형별 결과 분석</h3>${rows.map(x=>`<div class="stat"><span>${esc(x.name)}</span><div class="track"><div class="fill" style="width:${x.pct}%"></div></div><b>${x.ok}/${x.total}</b></div>`).join('')}</div><div class="card"><h3>약점 유형</h3>${weak.length?weak.map(x=>`<div class="weak"><div><b>${esc(x.name)}</b><small>오답: ${x.wrong.map(n=>`Q${n}`).join(', ')}</small></div><strong>${x.pct}%</strong></div>`).join(''):'<small>채점 가능한 사고력 문항에서 약점 유형이 확인되지 않았습니다.</small>'}</div>${EXAMS[currentRound].hasCalc?`<div class="card"><h3>연산 분석</h3><div class="stat"><span>연산 전체</span><div class="track"><div class="fill" style="width:${calc.length?Math.round((calc.length-calcWrong.length)/calc.length*100):0}%"></div></div><b>${calc.length-calcWrong.length}/${calc.length}</b></div><small>${calcWrong.length?`틀린 연산: ${calcWrong.map(c=>`${c.label} ${c.no}`).join(', ')}`:'연산 문항을 모두 맞았습니다.'}</small></div>`:''}<div class="card"><h3>문항별 채점 결과</h3><div class="detail"><table><tr><th>번호</th><th>유형</th><th>정답</th>${inputMode==='input'?'<th>학생 답안</th>':''}<th>결과</th></tr>${main.map(x=>x.status===null?`<tr><td>Q${x.id}</td><td>정답 미확정</td><td>—</td>${inputMode==='input'?'<td>—</td>':''}<td>제외</td></tr>`:`<tr class="${x.status?'':'wrong'}"><td>Q${x.id}</td><td>${esc(x.type)}</td><td>${esc(x.answer)}</td>${inputMode==='input'?`<td>${esc(x.user||'—')}</td>`:''}<td class="${x.status?'o':'x'}">${x.status?'○':'✕'}</td></tr>`).join('')}</table></div></div><div class="actions"><a href="${videoUrl()}" target="_blank" rel="noopener">▶ ${currentRound}회 해설 영상</a><button onclick="window.print()">🖨 결과 인쇄</button><button onclick="examPanel.scrollIntoView({behavior:'smooth'})">답안 수정</button></div>`;result.classList.remove('hidden');result.scrollIntoView({behavior:'smooth'});save()}
Object.assign(window,{enterViewer,selectRound,setMode,toggleOx,setAnswer,resetCurrent,submitExam});const params=new URLSearchParams(location.search),preset=(params.get('student')||'').trim();if(preset){studentInput.value=preset;setTimeout(enterViewer,0)}studentInput.addEventListener('keydown',e=>{if(e.key==='Enter')enterViewer()});
})();
</script>
