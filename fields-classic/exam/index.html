<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>필즈 실전 모의고사 채점 | G-FIELD</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
:root{
  --blue:#16417c;--blue2:#0d2b55;--blue3:#1e3a6b;--gold:#eac996;--ink:#0f172a;
  --muted:#64748b;--bg:#eef3f8;--line:#dbe4ee;--ok:#16a34a;--no:#dc2626;--wait:#d97706;
  --shadow:0 12px 34px rgba(15,23,42,.12);--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:Pretendard,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#gate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,var(--blue2),var(--blue) 58%,var(--blue3))}
.gate-card{width:min(440px,94vw);background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.gate-bar{height:6px;background:linear-gradient(90deg,var(--blue),var(--gold))}
.gate-body{padding:34px 30px 28px;text-align:center}
.logo{font-size:21px;font-weight:900;color:var(--blue);letter-spacing:-.7px;margin-bottom:6px}
.logo span{display:inline-grid;place-items:center;background:var(--blue);color:var(--gold);width:31px;height:28px;border-radius:7px;margin-right:5px}
.kicker{font-size:10px;font-weight:900;letter-spacing:2.3px;color:#b7791f;margin-bottom:10px}
.gate-title{font-size:24px;font-weight:900;letter-spacing:-1px;margin-bottom:9px}
.gate-desc{font-size:13px;line-height:1.7;color:var(--muted);word-break:keep-all;margin-bottom:20px}
.gate-input{width:100%;height:50px;border:2px solid var(--line);border-radius:13px;padding:0 15px;text-align:center;font-size:16px;font-weight:800;outline:none}
.gate-input:focus{border-color:var(--blue)}
.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;font-weight:900;border-radius:13px;box-shadow:0 8px 22px rgba(22,65,124,.22)}
.gate-btn{width:100%;height:52px;margin-top:10px}
.gate-error{min-height:20px;margin-top:7px;color:var(--no);font-size:12px;font-weight:800}
.gate-note{font-size:10px;color:#94a3b8;margin-top:7px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(22,65,124,.15);box-shadow:0 3px 16px rgba(15,23,42,.07)}
.header-inner{max-width:980px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-logo{font-weight:900;color:var(--blue)}
.header-logo span{background:var(--blue);color:var(--gold);padding:2px 7px;border-radius:5px;margin-right:4px}
.header-sub{font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
.header-name{font-size:12px;font-weight:900;color:var(--blue);background:rgba(22,65,124,.08);padding:6px 11px;border-radius:999px}
main{max-width:980px;margin:auto;padding:22px 14px 64px}
.hero{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;border-radius:22px;padding:24px;margin-bottom:17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -60px -90px auto;width:240px;height:240px;border-radius:50%;background:rgba(234,201,150,.13)}
.hero-kicker{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--gold);margin-bottom:7px}
.hero-title{font-size:clamp(23px,5vw,34px);font-weight:900;letter-spacing:-1px}
.hero-desc{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px;line-height:1.65}
.section-title{display:flex;align-items:center;gap:9px;margin:22px 0 11px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.12em}
.section-title:after{content:"";height:1px;background:rgba(22,65,124,.18);flex:1}
.round-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.round-card{min-height:92px;border:2px solid #e1e8f0;background:#fff;border-radius:15px;padding:11px 8px;text-align:center;box-shadow:0 3px 12px rgba(15,23,42,.05);transition:.18s}
.round-card:hover{transform:translateY(-2px);border-color:rgba(22,65,124,.45)}
.round-card.active{border-color:var(--blue);background:rgba(22,65,124,.055);box-shadow:0 8px 22px rgba(22,65,124,.13)}
.round-no{font-size:22px;font-weight:900;color:var(--blue)}
.round-label{font-size:10px;color:var(--muted);font-weight:700;margin-top:3px}
.round-status{display:inline-block;font-size:9px;font-weight:900;margin-top:6px;padding:2px 7px;border-radius:999px;background:rgba(22,65,124,.08);color:var(--blue)}
.round-status.pending{background:rgba(217,119,6,.1);color:var(--wait)}
.exam-toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin:16px 0}
.mode-btn,.tool-btn{min-height:48px;border:2px solid var(--line);border-radius:13px;background:#fff;color:var(--blue);font-weight:900;padding:8px 12px}
.mode-btn.active{border-color:var(--blue);background:rgba(22,65,124,.06)}
.tool-btn{white-space:nowrap}
.exam-meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
.meta-chip{font-size:10px;font-weight:800;color:var(--muted);background:#fff;border:1px solid var(--line);padding:5px 9px;border-radius:999px}
.meta-chip.warn{color:var(--wait);border-color:rgba(217,119,6,.28);background:rgba(217,119,6,.06)}
.q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.q-card{position:relative;min-height:95px;background:#fff;border:2px solid #e4eaf1;border-radius:13px;padding:9px;transition:.16s}
.q-card.ox{cursor:pointer;user-select:none}
.q-card.ok{border-color:rgba(22,163,74,.48);background:rgba(22,163,74,.055)}
.q-card.no{border-color:rgba(220,38,38,.45);background:rgba(220,38,38,.045)}
.q-card.pending{border-style:dashed;background:#f8fafc;color:#94a3b8}
.q-num{font-size:11px;font-weight:900;color:var(--blue)}
.q-type{font-size:8.5px;font-weight:800;color:var(--muted);margin:4px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-input{width:100%;height:34px;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:12px;font-weight:800;padding:0 5px;outline:none;background:#fff}
.q-input:focus{border-color:var(--blue)}
.q-card.ok .q-input{border-color:rgba(22,163,74,.5)}
.q-card.no .q-input{border-color:rgba(220,38,38,.5)}
.q-mark{font-size:24px;font-weight:900;text-align:center;line-height:32px;color:#cbd5e1}
.q-card.ok .q-mark{color:var(--ok)}
.pending-text{font-size:10px;font-weight:800;text-align:center;margin-top:11px;color:var(--wait)}
.calc-section{margin-top:14px}
.calc-group{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px}
.calc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.calc-title{font-size:12px;font-weight:900;color:var(--blue)}
.calc-note{font-size:9px;color:var(--muted)}
.calc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calc-card{border:2px solid #e4eaf1;border-radius:10px;padding:7px;background:#fff;text-align:center}
.calc-card.ox{cursor:pointer}
.calc-card.ok{border-color:rgba(22,163,74,.45);background:rgba(22,163,74,.05)}
.calc-card.no{border-color:rgba(220,38,38,.45);background:rgba(220,38,38,.04)}
.calc-label{font-size:9px;font-weight:900;color:var(--blue);margin-bottom:5px}
.calc-input{width:100%;height:31px;border:2px solid var(--line);border-radius:7px;text-align:center;font-size:12px;font-weight:800;outline:none}
.calc-card.ok .calc-input{border-color:rgba(22,163,74,.48)}
.calc-card.no .calc-input{border-color:rgba(220,38,38,.48)}
.submit-area{text-align:center;margin:25px 0 8px}
.submit-btn{min-width:min(360px,100%);height:56px;border:0}
.progress{font-size:11px;color:var(--muted);margin-top:9px;font-weight:700}
#result{margin-top:28px;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.result-hero{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;border-radius:22px;padding:27px;text-align:center;box-shadow:var(--shadow)}
.result-name{font-size:12px;color:rgba(255,255,255,.68)}
.result-score{font-size:72px;line-height:1.05;font-weight:900;color:var(--gold);margin-top:5px}
.result-denom{font-size:11px;color:rgba(255,255,255,.62)}
.result-grade{display:inline-block;margin-top:12px;border:1px solid rgba(234,201,150,.45);background:rgba(234,201,150,.12);color:var(--gold);font-size:14px;font-weight:900;padding:7px 18px;border-radius:999px}
.result-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:11px;box-shadow:0 3px 13px rgba(15,23,42,.05)}
.result-title{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.1em;margin-bottom:13px}
.result-title:after{content:"";height:1px;background:rgba(22,65,124,.13);flex:1}
.stat-row{display:grid;grid-template-columns:82px 1fr 45px;gap:9px;align-items:center;margin:9px 0}
.stat-name{font-size:11px;font-weight:800}
.stat-bg{height:8px;border-radius:999px;background:#e8edf3;overflow:hidden}
.stat-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),#3b82f6)}
.stat-pct{text-align:right;font-size:11px;font-weight:900;color:var(--blue)}
.weak-list{display:grid;gap:8px}
.weak-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px;border-radius:11px;background:rgba(220,38,38,.045);border:1px solid rgba(220,38,38,.13)}
.weak-name{font-size:12px;font-weight:900;color:var(--no)}
.weak-desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5}
.weak-rate{font-size:12px;font-weight:900;white-space:nowrap}
.detail-wrap{overflow-x:auto}
.detail-table{width:100%;border-collapse:collapse;font-size:10px;min-width:670px}
.detail-table th{background:rgba(22,65,124,.08);color:var(--blue);padding:7px 5px;border:1px solid var(--line);font-weight:900}
.detail-table td{padding:7px 5px;border:1px solid var(--line);text-align:center}
.detail-table tr.wrong{background:rgba(220,38,38,.035)}
.detail-table tr.pending{background:#f8fafc;color:#94a3b8}
.answer-cell{text-align:left!important;max-width:250px;word-break:break-all}
.figure-q{grid-column:span 2;min-height:270px}
.figure-answer{width:100%;max-width:270px;margin:7px auto 8px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:10px}
.figure-answer svg{display:block;width:100%;height:auto}
.figure-answer .source-figure{display:grid;gap:7px}
.figure-answer .source-figure img{display:block;width:100%;height:150px;object-fit:cover;object-position:center 76%;border-radius:7px;border:1px solid var(--line);background:#f8fafc}
.figure-choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.figure-choice-row span{display:grid;place-items:center;min-height:39px;border:2px solid var(--blue);border-radius:10px;background:rgba(22,65,124,.07);color:var(--blue);font-size:21px;font-weight:900}
.figure-choice-caption{text-align:center;color:var(--blue);font-size:10px;font-weight:900}
.figure-answer.mini{width:150px;min-width:150px;margin:0 auto;padding:4px}
.figure-note{text-align:center;font-size:10px;line-height:1.45;color:var(--muted);font-weight:700;margin:4px 0 8px}
.manual-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.manual-choice{height:41px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:18px;font-weight:900;color:var(--muted)}
.manual-choice.o.active{border-color:var(--ok);background:rgba(22,163,74,.09);color:var(--ok)}
.manual-choice.x.active{border-color:var(--no);background:rgba(220,38,38,.08);color:var(--no)}
.figure-label{font-size:9px;font-weight:900;color:var(--blue);text-align:center;margin-bottom:3px}
.o{color:var(--ok);font-weight:900}.x{color:var(--no);font-weight:900}.dash{color:#94a3b8;font-weight:900}
.video-actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-top:12px}
.action-link,.action-btn{min-height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:13px;font-weight:900;border:0}
.action-link{background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff}
.action-btn{background:#fff;border:2px solid var(--line);color:var(--blue)}
.empty-note{font-size:12px;color:var(--muted);line-height:1.7}
@media(max-width:720px){
  .round-grid{grid-template-columns:repeat(3,1fr)}
  .q-grid{grid-template-columns:repeat(4,1fr)}
  .calc-grid{grid-template-columns:repeat(4,1fr)}
  .exam-toolbar{grid-template-columns:1fr 1fr}.tool-btn{grid-column:1/-1}
}
@media(max-width:480px){
  .q-grid{grid-template-columns:repeat(2,1fr)}
  .round-grid{grid-template-columns:repeat(3,1fr)}
  .video-actions{grid-template-columns:1fr}
  .hero{padding:20px}
}
@media print{
  #gate,header,.hero,.round-picker,.exam-toolbar,.exam-meta,#answerArea,.submit-area,.video-actions{display:none!important}
  body{background:#fff}main{max-width:none;padding:0}#result{display:block!important;margin:0}
  .result-card,.result-hero{break-inside:avoid;box-shadow:none}
  @page{margin:12mm}
}
</style>
</head>

<div id="gate">

  <section id="result" class="hidden"></section>

  </svg>`,
  '6-6':`<div class="source-figure"><img src="../assets/print/mock-set/page_056.webp" alt="6회 6번 문제의 도형 보기"><div class="figure-choice-row"><span>②</span><span>④</span><span>⑦</span></div><div class="figure-choice-caption">정답 모양 ② · ④ · ⑦</div></div>`,
  '6-20':`<svg viewBox="0 0 240 190" role="img" aria-label="3행 3열에서 왼쪽 열과 오른쪽 열을 모두 색칠한 모양">
    <rect x="30" y="16" width="180" height="162" rx="3" fill="#fff" stroke="#111827" stroke-width="4"/>
    <rect x="30" y="16" width="60" height="162" fill="#60a5fa"/>
    <rect x="150" y="16" width="60" height="162" fill="#60a5fa"/>
    <path d="M90 16V178M150 16V178M30 70H210M30 124H210" fill="none" stroke="#334155" stroke-width="3"/>
  </svg>`
};
function figureAnswer(round,id){return FIGURE_ANSWERS[`${round}-${id}`]||'';}
function hasOwn(obj,key){return Object.prototype.hasOwnProperty.call(obj||{},key);}

let studentName = '';
let currentRound = 0;
let inputMode = 'ox';
let QS = [];
let CALCS = [];
const answerState = {};
const oxState = {};

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function normalize(value){
  return String(value ?? '')
    .trim().toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[，、]/g,',')
    .replace(/[：]/g,':')
    .replace(/[／]/g,'/')
    .replace(/[－−]/g,'-')
    .replace(/[＊xｘ]/g,'×')
    .replace(/[㉠①]/g,'(1)')
    .replace(/[㉡②]/g,'(2)')
    .replace(/[\.。]/g,'');
}
function isCorrect(user, answer){
  if(!answer)return null;
  const choices=String(answer).split('||');
  return choices.some(choice => normalize(user) === normalize(choice));
}
function inferType(answer, index){
  const a=String(answer||'');
  if(!a)return '정답 미확정';
  if(/[도형세모동그라미꼭짓점스페이드하트별cm조각▲△]/i.test(a))return '도형·공간';
  if(/[연수애나재훈수현세윤현희도연주연유빈유준관호동하영혜미나유리소이송이예린여울새원숭이고양이강아지햄스터등명번째최대최소지우기]/.test(a))return '논리·추리';
  if(/[+\-×=\/]|마방진|A=|B=|C=/.test(a))return '규칙·식';
  if(a.includes(',') || /\d개|\d번|\d명|\d조각/.test(a))return '수·규칙';
  return index < 5 ? '기초 사고력' : '종합 사고력';
}
function buildQS(round){
  const exam=EXAMS[round];
  QS=exam.answers.map((answer,index)=>({
    id:index+1,
    answer,
    confirmed:answer !== '',
    type:figureAnswer(round,index+1)?'도형·공간':inferType(answer,index),
    keyPoint:Q_KEYPOINTS[`${round}-${index+1}`]||''
  }));
  CALCS=[];
  const groups=[['덧셈','calcA'],['뺄셈','calcS'],['곱셈','calcM']];
  groups.forEach(([label,key])=>{
    (exam[key]||[]).forEach((answer,index)=>CALCS.push({
      id:`${key}-${index}`,
      group:key,
      groupLabel:label,
      no:index+1,
      answer:String(answer)
    }));
  });
}
function storageKey(){return `gfield-exam:${studentName}:${currentRound}`;}
function saveState(){
  if(!currentRound)return;
  const data={inputMode,answers:answerState[currentRound]||{},ox:oxState[currentRound]||{}};
  sessionStorage.setItem(storageKey(),JSON.stringify(data));
}
function loadState(){
  answerState[currentRound]={};
  oxState[currentRound]={};
  try{
    const saved=JSON.parse(sessionStorage.getItem(storageKey())||'null');
    if(saved){
      answerState[currentRound]=saved.answers||{};
      oxState[currentRound]=saved.ox||{};
      if(saved.inputMode==='input'||saved.inputMode==='ox')inputMode=saved.inputMode;
    }
  }catch(_){}
}
function enterViewer(){
  const value=document.getElementById('studentInput').value.trim();
  if(!value){document.getElementById('gateError').textContent='학생 이름을 입력해 주세요.';return;}
  studentName=value;
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('header').classList.remove('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerName').textContent=`${studentName} 학생`;
  renderRounds();
  const requested=Number(new URLSearchParams(location.search).get('round'));
  selectRound(requested>=1&&requested<=6?requested:1);
}
function renderRounds(){
  const grid=document.getElementById('roundGrid');
  grid.innerHTML=Object.keys(EXAMS).map(key=>{
    const round=Number(key),pending=EXAMS[round].answers.filter(a=>!a).length;
    return `<button class="round-card ${round===currentRound?'active':''}" onclick="selectRound(${round})">
      <div class="round-no">${round}</div><div class="round-label">실전 모의고사</div>
      <span class="round-status ${pending?'pending':''}">${pending?`미확정 ${pending}문항`:'정답 확정'}</span>
    </button>`;
  }).join('');
}
function selectRound(round){
  if(!EXAMS[round])return;
  if(currentRound)saveState();
  currentRound=round;
  buildQS(round);
  loadState();
  document.getElementById('examPanel').classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');
  renderRounds();
  renderExam();
  history.replaceState(null,'',`${location.pathname}?round=${round}&student=${encodeURIComponent(studentName)}`);
}
function setMode(mode){
  inputMode=mode;
  document.getElementById('result').classList.add('hidden');
  renderExam();
  saveState();
}
function renderExam(){
  document.getElementById('modeOx').classList.toggle('active',inputMode==='ox');
  document.getElementById('modeInput').classList.toggle('active',inputMode==='input');
  const exam=EXAMS[currentRound],pending=QS.filter(q=>!q.confirmed).length,confirmed=QS.length-pending;
  document.getElementById('examMeta').innerHTML=`
    <span class="meta-chip">실전 모의고사 ${currentRound}회</span>
    <span class="meta-chip">사고력 ${QS.length}문항</span>
    <span class="meta-chip">채점 가능 ${confirmed}문항</span>
    ${exam.hasCalc?`<span class="meta-chip">연산 ${CALCS.length}문항</span>`:''}
    ${pending?`<span class="meta-chip warn">정답 미확정 ${pending}문항 · 점수 제외</span>`:''}`;
  const mainHtml=`<div class="section-title">사고력 답안</div><div class="q-grid">${QS.map(renderQuestion).join('')}</div>`;
  const calcHtml=exam.hasCalc?renderCalculations():'';
  document.getElementById('answerArea').innerHTML=mainHtml+calcHtml;
  updateProgress();
}
function renderQuestion(q){
  if(!q.confirmed)return `<div class="q-card pending"><div class="q-num">Q${String(q.id).padStart(2,'0')}</div><div class="q-type">정답 미확정</div><div class="pending-text">채점 제외</div></div>`;
  const key=`q${q.id}`,value=(answerState[currentRound]||{})[key]||'',stateMap=oxState[currentRound]||{};
  const figure=figureAnswer(currentRound,q.id);
  if(figure){
    const chosen=hasOwn(stateMap,key),selected=stateMap[key];
    return `<div class="q-card figure-q ${chosen?(selected?'ok':'no'):''}"><div class="q-num">Q${String(q.id).padStart(2,'0')}</div><div class="q-type">${escapeHtml(q.type)} · 그림 판정</div><div class="figure-label">정답 그림</div><div class="figure-answer">${figure}</div><div class="figure-note">학생이 그린 답과 비교하여 맞으면 O, 틀리면 X를 선택하세요.</div><div class="manual-choices"><button type="button" class="manual-choice o ${chosen&&selected?'active':''}" onclick="setOxChoice('${key}',true)">O</button><button type="button" class="manual-choice x ${chosen&&!selected?'active':''}" onclick="setOxChoice('${key}',false)">X</button></div></div>`;
  }
  const selected=stateMap[key]===true;
  if(inputMode==='ox'){
    return `<div class="q-card ox ${selected?'ok':''}" onclick="toggleOx('${key}')"><div class="q-num">Q${String(q.id).padStart(2,'0')}</div><div class="q-type">${escapeHtml(q.type)}</div><div class="q-mark">${selected?'○':'탭'}</div></div>`;
  }
  const state=value===''?'':(isCorrect(value,q.answer)?'ok':'no');
  return `<div class="q-card ${state}"><div class="q-num">Q${String(q.id).padStart(2,'0')}</div><div class="q-type">${escapeHtml(q.type)}</div><input class="q-input" id="${key}" value="${escapeHtml(value)}" placeholder="답 입력" oninput="setAnswer('${key}',this.value)"></div>`;
}
function renderCalculations(){
  const groups=[...new Set(CALCS.map(c=>c.group))];
  return `<div class="section-title">연산 답안</div><div class="calc-section">${groups.map(group=>{
    const items=CALCS.filter(c=>c.group===group);
    return `<div class="calc-group"><div class="calc-head"><div class="calc-title">${items[0].groupLabel}</div><div class="calc-note">${items.length}문항</div></div><div class="calc-grid">${items.map(renderCalc).join('')}</div></div>`;
  }).join('')}</div>`;
}
function renderCalc(calc){
  const key=`c-${calc.id}`,value=(answerState[currentRound]||{})[key]||'',selected=(oxState[currentRound]||{})[key];
  if(inputMode==='ox'){
    return `<div class="calc-card ox ${selected?'ok':''}" onclick="toggleOx('${key}')"><div class="calc-label">${calc.groupLabel} ${calc.no}</div><div class="q-mark">${selected?'○':'탭'}</div></div>`;
  }
  const state=value===''?'':(isCorrect(value,calc.answer)?'ok':'no');
  return `<div class="calc-card ${state}"><div class="calc-label">${calc.groupLabel} ${calc.no}</div><input class="calc-input" value="${escapeHtml(value)}" placeholder="답" oninput="setAnswer('${key}',this.value)"></div>`;
}
function toggleOx(key){
  oxState[currentRound]=oxState[currentRound]||{};
  if(oxState[currentRound][key]===true)delete oxState[currentRound][key];
  else oxState[currentRound][key]=true;
  document.getElementById('result').classList.add('hidden');
  renderExam();saveState();
}
function setOxChoice(key,value){
  oxState[currentRound]=oxState[currentRound]||{};
  oxState[currentRound][key]=value;
  document.getElementById('result').classList.add('hidden');
  renderExam();saveState();
}
function setAnswer(key,value){
  answerState[currentRound]=answerState[currentRound]||{};
  answerState[currentRound][key]=value;
  renderExam();saveState();
}
function updateProgress(){
  const confirmed=QS.filter(q=>q.confirmed).length+CALCS.length;
  const ox=oxState[currentRound]||{};
  let entered=0;
  if(inputMode==='ox')entered=Object.keys(ox).length;
  else entered=Object.values(answerState[currentRound]||{}).filter(v=>String(v).trim()).length+QS.filter(q=>figureAnswer(currentRound,q.id)&&hasOwn(ox,`q${q.id}`)).length;
  document.getElementById('progress').textContent=inputMode==='ox'
    ? `채점 표시한 문항 ${entered}개 · 표시하지 않은 일반 문항은 오답으로 채점됩니다.`
    : `${entered} / ${confirmed}문항 입력 · 그림 문항은 정답 그림과 비교해 O/X를 선택하세요.`;
}
function resetCurrent(){
  if(!confirm(`${currentRound}회 답안 입력을 모두 지울까요?`))return;
  answerState[currentRound]={};oxState[currentRound]={};
  sessionStorage.removeItem(storageKey());
  document.getElementById('result').classList.add('hidden');
  renderExam();
}
function getMainResults(){
  return QS.map(q=>{
    if(!q.confirmed)return {...q,status:null,user:''};
    const key=`q${q.id}`,ox=oxState[currentRound]||{};
    if(figureAnswer(currentRound,q.id)){
      const chosen=hasOwn(ox,key);
      return {...q,status:chosen?ox[key]:false,user:chosen?(ox[key]?'O':'X'):'미선택'};
    }
    if(inputMode==='ox')return {...q,status:ox[key]===true,user:''};
    const user=(answerState[currentRound]||{})[key]||'';
    return {...q,status:isCorrect(user,q.answer),user};
  });
}
function getCalcResults(){
  return CALCS.map(calc=>{
    const key=`c-${calc.id}`;
    if(inputMode==='ox')return {...calc,status:!!(oxState[currentRound]||{})[key],user:''};
    const user=(answerState[currentRound]||{})[key]||'';
    return {...calc,status:isCorrect(user,calc.answer),user};
  });
}
function gradeLabel(score){
  if(score>=90)return '실전 준비 매우 우수';
  if(score>=80)return '실전 합격권';
  if(score>=70)return '보완 후 합격권';
  if(score>=60)return '약점 유형 집중 필요';
  return '기초 유형 재점검 필요';
}
function videoViewerUrl(){
  const exam=EXAMS[currentRound];
  return `../video-viewer/?video=${encodeURIComponent(exam.videoUrl)}&title=${encodeURIComponent(`실전 모의고사 ${currentRound}회 해설`)}&student=${encodeURIComponent(studentName||'학생')}`;
}
function renderCorrectAnswer(result){
  const figure=figureAnswer(currentRound,result.id);
  return figure?`<div class="figure-answer mini">${figure}</div>`:escapeHtml(result.answer);
}
function submitExam(){
  const main=getMainResults(),calc=getCalcResults();
  const gradedMain=main.filter(r=>r.status!==null);
  const all=[...gradedMain,...calc];
  const ok=all.filter(r=>r.status===true).length;
  const total=all.length;
  const score=total?Math.round(ok/total*100):0;
  const typeMap={};
  gradedMain.forEach(r=>{
    typeMap[r.type]=typeMap[r.type]||{total:0,ok:0,wrong:[]};
    typeMap[r.type].total++;
    if(r.status)typeMap[r.type].ok++;else typeMap[r.type].wrong.push(r.id);
  });
  const typeRows=Object.entries(typeMap).map(([name,data])=>({
    name,...data,pct:data.total?Math.round(data.ok/data.total*100):0
  })).sort((a,b)=>a.pct-b.pct||b.total-a.total);
  const weaknesses=typeRows.filter(x=>x.ok<x.total).slice(0,3);
  const mainWrong=gradedMain.filter(r=>!r.status);
  const calcWrong=calc.filter(r=>!r.status);
  const result=document.getElementById('result');
  result.innerHTML=`
    <div class="result-hero">
      <div class="result-name">${escapeHtml(studentName)} 학생 · 실전 모의고사 ${currentRound}회</div>
      <div class="result-score">${score}</div>
      <div class="result-denom">/ 100점 · ${ok}/${total}문항 정답${QS.some(q=>!q.confirmed)?' · 미확정 문항 제외':''}</div>
      <div class="result-grade">${gradeLabel(score)}</div>
    </div>
    <div class="result-card"><div class="result-title">유형별 결과 분석</div>
      ${typeRows.map(x=>`<div class="stat-row"><div class="stat-name">${escapeHtml(x.name)}</div><div class="stat-bg"><div class="stat-fill" style="width:${x.pct}%"></div></div><div class="stat-pct">${x.ok}/${x.total}</div></div>`).join('')}
    </div>
    <div class="result-card"><div class="result-title">약점 유형</div>
      ${weaknesses.length?`<div class="weak-list">${weaknesses.map(x=>`<div class="weak-item"><div><div class="weak-name">${escapeHtml(x.name)}</div><div class="weak-desc">오답 문항: ${x.wrong.map(n=>`Q${n}`).join(', ')}</div></div><div class="weak-rate">${x.pct}%</div></div>`).join('')}</div>`:'<div class="empty-note">현재 채점 가능한 사고력 문항에서 약점 유형이 확인되지 않았습니다.</div>'}
    </div>
    ${EXAMS[currentRound].hasCalc?`<div class="result-card"><div class="result-title">연산 분석</div>
      <div class="stat-row"><div class="stat-name">연산 전체</div><div class="stat-bg"><div class="stat-fill" style="width:${calc.length?Math.round((calc.length-calcWrong.length)/calc.length*100):0}%"></div></div><div class="stat-pct">${calc.length-calcWrong.length}/${calc.length}</div></div>
      <div class="empty-note">${calcWrong.length?`틀린 연산: ${calcWrong.map(c=>`${c.groupLabel} ${c.no}`).join(', ')}`:'연산 문항을 모두 맞았습니다.'}</div>
    </div>`:''}
    <div class="result-card"><div class="result-title">문항별 채점 결과</div><div class="detail-wrap"><table class="detail-table">
      <tr><th>번호</th><th>유형</th><th>정답</th>${inputMode==='input'?'<th>학생 답안</th>':''}<th>결과</th></tr>
      ${main.map(r=>{
        if(r.status===null)return `<tr class="pending"><td>Q${r.id}</td><td>정답 미확정</td><td>—</td>${inputMode==='input'?'<td>—</td>':''}<td class="dash">제외</td></tr>`;
        return `<tr class="${r.status?'':'wrong'}"><td>Q${r.id}</td><td>${escapeHtml(r.type)}</td><td class="answer-cell">${renderCorrectAnswer(r)}</td>${inputMode==='input'?`<td class="answer-cell">${escapeHtml(r.user||'—')}</td>`:''}<td class="${r.status?'o':'x'}">${r.status?'○':'✕'}</td></tr>`;
      }).join('')}
    </table></div></div>
    <div class="video-actions">
      <a class="action-link" href="${videoViewerUrl()}" target="_blank" rel="noopener">▶ ${currentRound}회 해설 영상 보기</a>
      <button class="action-btn" onclick="window.print()">🖨 결과 인쇄</button>
      <button class="action-btn" onclick="scrollToAnswers()">답안 수정</button>
    </div>`;
  result.classList.remove('hidden');
  result.scrollIntoView({behavior:'smooth',block:'start'});
  saveState();
}
function scrollToAnswers(){
  document.getElementById('examPanel').scrollIntoView({behavior:'smooth',block:'start'});
}
window.enterViewer=enterViewer;
window.selectRound=selectRound;
window.setMode=setMode;
window.toggleOx=toggleOx;
window.setOxChoice=setOxChoice;
window.setAnswer=setAnswer;
window.resetCurrent=resetCurrent;
window.submitExam=submitExam;
window.scrollToAnswers=scrollToAnswers;

const params=new URLSearchParams(location.search);
const preset=(params.get('student')||'').trim();
if(preset){
  document.getElementById('studentInput').value=preset;
  setTimeout(enterViewer,0);
}
document.getElementById('studentInput').addEventListener('keydown',e=>{if(e.key==='Enter')enterViewer();});
})();
</script>
</body>
