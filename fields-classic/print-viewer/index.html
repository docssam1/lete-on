<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFIELD 인쇄 뷰어</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,sans-serif;background:#e7edf3;color:#0f172a}
.toolbar{position:sticky;top:0;z-index:20;min-height:64px;padding:10px max(18px,calc((100vw - 1280px)/2));background:#fff;border-bottom:1px solid #cbd5e1;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 4px 18px rgba(15,23,42,.09)}
.title{font-size:16px;font-weight:900;color:#16417c}.meta{font-size:11px;font-weight:700;color:#64748b;margin-top:3px}
.actions{display:flex;gap:8px}.btn{min-height:40px;padding:0 15px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;color:#334155;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer}
.btn.primary{background:#16417c;border-color:#16417c;color:#fff}.btn:disabled{opacity:.45;cursor:wait}
.document-head{width:min(1180px,100%);margin:18px auto 0;padding:0 12px}.document-head-inner{padding:18px 20px;background:#fff;border:1px solid #cbd5e1;border-left:5px solid #16417c;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.document-kicker{font-size:10px;letter-spacing:.12em;font-weight:900;color:#a26a18}.document-name{margin-top:4px;font-size:19px;font-weight:900;color:#0f274b;letter-spacing:0}.document-caption{margin-top:7px;font-size:12px;font-weight:700;color:#64748b}.course-summary{width:min(1180px,100%);margin:12px auto 0;padding:0 12px;background:transparent;border:0;box-shadow:none}.course-summary-inner{padding:14px 16px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.course-summary-title{font-size:13px;font-weight:900;color:#16417c}.course-topics{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0;padding:0;list-style:none}.course-topics li{padding:5px 8px;border-radius:5px;background:#edf3f8;color:#334155;font-size:11px;font-weight:800}
.status{padding:22px;text-align:center;color:#64748b;font-size:13px;font-weight:800}
.viewer-layout{width:min(1380px,100%);margin:0 auto;padding:18px 12px 50px;display:grid;grid-template-columns:156px minmax(0,1fr);align-items:start;gap:18px}.page-rail{position:sticky;top:82px;padding:12px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.page-rail-title{font-size:11px;font-weight:900;color:#64748b;margin:1px 2px 10px}.page-jumps{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.page-jump{height:32px;border:1px solid #d6e0ea;border-radius:5px;background:#f8fafc;color:#475569;font:800 11px Pretendard,sans-serif;cursor:pointer}.page-jump:hover,.page-jump.is-current{border-color:#16417c;background:#16417c;color:#fff}.pages{position:relative;min-width:0;margin:0;padding:12px;background:#c8d1dc;box-shadow:0 12px 34px rgba(15,23,42,.17);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;perspective:2200px;overflow:hidden;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.page{position:relative;display:none;width:100%;background:#fff;box-shadow:0 4px 16px rgba(15,23,42,.22);overflow:hidden;backface-visibility:hidden}.page.is-open{display:block}
.exam-cover{aspect-ratio:210/297;background:#f7f3e9;color:#13253f;isolation:isolate}.cover-shell{position:absolute;inset:0;padding:8.5% 8%;display:flex;flex-direction:column;border:10px solid #13253f;background:linear-gradient(90deg,var(--cover-accent) 0 9px,transparent 9px),#f7f3e9}.cover-shell::before,.cover-shell::after{content:"";position:absolute;width:18%;height:11%;pointer-events:none}.cover-shell::before{top:5.2%;right:5.2%;border-top:3px solid var(--cover-accent);border-right:3px solid var(--cover-accent)}.cover-shell::after{left:5.2%;bottom:5.2%;border-left:3px solid var(--cover-accent);border-bottom:3px solid var(--cover-accent)}.cover-kicker{font-size:13px;font-weight:900;color:var(--cover-accent)}.cover-brand{margin-top:4%;font-size:24px;font-weight:900;color:#13253f}.cover-rule{width:100%;height:1px;margin:5% 0;background:#b8b2a6}.cover-title{font-size:48px;font-weight:900;line-height:1.08;color:#13253f}.cover-title strong{display:block;margin-top:2%;color:var(--cover-accent);font-size:.48em}.cover-round{margin:auto 0 2%;display:flex;align-items:flex-end;gap:4%;font-weight:900;color:#13253f}.cover-round-number{font-family:Georgia,serif;font-size:150px;line-height:.72;color:var(--cover-accent)}.cover-round-number.is-word{font-size:82px;font-family:Pretendard,sans-serif}.cover-round-unit{padding-bottom:1.5%;font-size:40px}.cover-meta{padding:4% 0;border-top:1px solid #b8b2a6;border-bottom:1px solid #b8b2a6;display:flex;justify-content:space-between;gap:4%;font-size:12px;font-weight:800}.cover-student{margin-top:5%;display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4%;font-size:14px;font-weight:900}.cover-student-name{min-height:1.8em;padding:0 2% .4%;border-bottom:2px solid #13253f;text-align:center}.exam-page::after{content:"";position:absolute;z-index:1;inset:7px;border:1px solid rgba(19,37,63,.36);box-shadow:inset 4px 0 0 var(--cover-accent,rgba(22,65,124,.65));pointer-events:none}.exam-page .page-corner{position:absolute;z-index:1;width:20px;height:20px;right:12px;bottom:12px;border-right:2px solid var(--cover-accent,rgba(22,65,124,.65));border-bottom:2px solid var(--cover-accent,rgba(22,65,124,.65));pointer-events:none}
.page-turn-layer{position:absolute;z-index:12;top:12px;bottom:12px;width:calc(50% - 13px);pointer-events:none;perspective:2200px;overflow:visible}.page-turn-layer.forward{right:12px}.page-turn-layer.back{left:12px}.page-turn-sheet{position:absolute;inset:0;background:#fff;transform-style:preserve-3d;backface-visibility:hidden;overflow:hidden;box-shadow:-10px 5px 24px rgba(15,23,42,.22)}.page-turn-sheet>.page{display:block!important;width:100%;height:100%;box-shadow:none}.page-turn-sheet>.page>img{width:100%;height:100%;object-fit:cover}.page-turn-layer.forward .page-turn-sheet{transform-origin:left center;animation:page-curl-forward 1.15s cubic-bezier(.2,.72,.18,1) forwards}.page-turn-layer.back .page-turn-sheet{transform-origin:right center;animation:page-curl-back 1.15s cubic-bezier(.2,.72,.18,1) forwards}.page-turn-fold{position:absolute;z-index:2;width:86%;height:88%;filter:drop-shadow(-16px 14px 13px rgba(15,23,42,.32));opacity:0}.page-turn-layer.forward .page-turn-fold{right:-2%;bottom:-2%;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(137deg,#fff 0 43%,#eef0f3 56%,#b8bdc5 73%,#fff 94%);transform-origin:right bottom;animation:page-fold-forward 1.15s cubic-bezier(.2,.72,.18,1) forwards}.page-turn-layer.back .page-turn-fold{left:-2%;bottom:-2%;clip-path:polygon(0 0,100% 100%,0 100%);background:linear-gradient(43deg,#fff 0 43%,#eef0f3 56%,#b8bdc5 73%,#fff 94%);transform-origin:left bottom;animation:page-fold-back 1.15s cubic-bezier(.2,.72,.18,1) forwards}
@keyframes page-curl-forward{0%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:rotateY(0)}45%{clip-path:polygon(0 0,100% 0,72% 100%,0 100%);transform:rotateY(-24deg) skewY(-1deg);filter:brightness(.9)}100%{clip-path:polygon(0 0,0 0,0 100%,0 100%);transform:rotateY(-172deg);opacity:.08}}@keyframes page-curl-back{0%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:rotateY(0)}45%{clip-path:polygon(0 0,100% 0,100% 100%,28% 100%);transform:rotateY(24deg) skewY(1deg);filter:brightness(.9)}100%{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);transform:rotateY(172deg);opacity:.08}}@keyframes page-fold-forward{0%{opacity:0;transform:translate(40%,40%) scale(.05) rotate(-3deg)}42%{opacity:1;transform:translate(2%,2%) scale(.98) rotate(-1deg)}100%{opacity:0;transform:translate(-88%,-4%) scale(.16) rotate(-8deg)}}@keyframes page-fold-back{0%{opacity:0;transform:translate(-40%,40%) scale(.05) rotate(3deg)}42%{opacity:1;transform:translate(-2%,2%) scale(.98) rotate(1deg)}100%{opacity:0;transform:translate(88%,-4%) scale(.16) rotate(8deg)}}
.page canvas,.page img{display:block;width:100%;height:auto}
.watermark{display:block;position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.watermark span{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-32deg);font-size:34pt;font-weight:900;color:rgba(22,65,124,.14);white-space:nowrap;letter-spacing:0}
.watermark span:nth-child(1){top:25%}.watermark span:nth-child(2){top:50%}.watermark span:nth-child(3){top:75%}
@media(max-width:760px){.toolbar{align-items:flex-start;padding:10px 12px}.title{font-size:14px}.actions{gap:5px}.btn{padding:0 10px}.document-head{margin-top:10px;padding:0 8px}.document-head-inner{padding:14px 15px}.document-name{font-size:16px}.course-summary{padding:0 8px}.viewer-layout{display:block;padding:10px 5px 30px}.page-rail{position:sticky;top:64px;z-index:10;margin:0 3px 9px;padding:9px 10px;display:flex;align-items:center;gap:10px;overflow:hidden}.page-rail-title{margin:0;white-space:nowrap}.page-jumps{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.page-jump{min-width:64px;flex:0 0 64px}.pages{display:block;padding:7px}.page{box-shadow:none}.page.is-open+.page.is-open{display:none}.page-turn-layer{top:7px;bottom:7px;left:7px!important;right:7px!important;width:auto}.cover-shell{border-width:7px}.cover-kicker{font-size:9px}.cover-brand{font-size:17px}.cover-title{font-size:34px}.cover-round-number{font-size:104px}.cover-round-unit{font-size:28px}.cover-meta{font-size:9px}.cover-student{font-size:11px}}
@media(prefers-reduced-motion:reduce){.page-turn-layer{display:none!important}}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .toolbar,.status,.document-head,.course-summary,.page-rail,.page-turn-layer{display:none!important}
  .pages{display:block;width:auto;margin:0;padding:0;box-shadow:none}
  .page,.page.is-open{display:block;width:210mm;margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .watermark{display:block!important}
}
</style>
</head>
<body>
<header class="toolbar">
  <div><div class="title" id="title">인쇄 자료</div><div class="meta" id="meta">문서를 준비하고 있습니다.</div></div>
  <div class="actions">
    <button class="btn" type="button" onclick="history.back()">돌아가기</button>
    <button class="btn" id="prevBtn" type="button" disabled aria-label="이전 두 쪽">◀</button>
    <button class="btn" id="nextBtn" type="button" disabled aria-label="다음 두 쪽">▶</button>
    <button class="btn" id="videoBtn" type="button" style="display:none" onclick="openLessonVideo()">▶ 학습영상</button>
    <button class="btn" id="answerBtn" type="button" style="display:none" onclick="openAnswerGuide()">☑ 유형별 풀이</button>
    <button class="btn primary" id="printBtn" type="button" onclick="window.print()" disabled>인쇄</button>
  </div>
</header>
<section class="document-head" id="documentHead">
  <div class="document-head-inner">
    <div class="document-kicker">GFIELD · ORIGINAL MOCK EXAM</div>
    <div class="document-name" id="documentName">원본 모의고사</div>
    <div class="document-caption" id="documentCaption">원본 시험지와 화면·인쇄 워터마크가 적용됩니다.</div>
  </div>
</section>
<section class="course-summary" id="courseSummary" style="display:none"><div class="course-summary-inner"><div class="course-summary-title">집중 유형</div><ul class="course-topics" id="courseTopics"></ul></div></section>
<div class="viewer-layout">
  <aside class="page-rail" id="pageRail" style="display:none" aria-label="쪽 이동"><div class="page-rail-title">쪽 이동</div><div class="page-jumps" id="pageJumps"></div></aside>
  <div><div class="status" id="status">PDF를 불러오는 중입니다.</div><main class="pages" id="pages"></main></div>
</div>

<script src="./documents.js"></script>
<script>
const params=new URLSearchParams(location.search);
const documentKey=params.get("doc")||"";
const source=window.GFIELD_PRINT_DOCUMENTS?.[documentKey];
// 원본 답안 스캔은 채점·분석 자료가 아니다. 대본과 원본을 대조해 확정한 회차만
// 문항별 정답·유형·지도 메모 화면으로 연결한다.
const answerAnalysisByDocument={"mock-set-4":"mock-4"};
const answerAnalysis=answerAnalysisByDocument[documentKey]||"";
const title=(source?.title||"인쇄 자료").slice(0,80);
const student=(params.get("student")||"학생").trim().slice(0,30);
const lessonVideo=params.get("video")||source?.videoUrl||"";
const topics=(params.get("topics")||"").split("|").map(v=>v.trim()).filter(Boolean);
const status=document.getElementById("status");
const pages=document.getElementById("pages");
const printBtn=document.getElementById("printBtn");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const coverOffset=source?.cover?1:0;
let spreadStart=1;
let isTurning=false;
document.getElementById("title").textContent=title;
document.getElementById("documentName").textContent=title;
document.title=title+" | GFIELD";
if(lessonVideo)document.getElementById("videoBtn").style.display="";
if(documentKey==="killer")document.getElementById("answerBtn").style.display="";
if(answerAnalysis){
  const answerBtn=document.getElementById("answerBtn");
  answerBtn.textContent="✅ 정답·분석";
  answerBtn.style.display="";
}
if(topics.length){
  document.getElementById("courseSummary").style.display="";
  const topicList=document.getElementById("courseTopics");
  topics.forEach(topic=>{const item=document.createElement("li");item.textContent=topic;topicList.appendChild(item);});
}
function openLessonVideo(){
  const url=`../video-viewer/?video=${encodeURIComponent(lessonVideo)}&title=${encodeURIComponent(title+" 학습영상")}&student=${encodeURIComponent(student)}`;
  window.open(url,"_blank","noopener");
}
function openAnswerGuide(){
  const url=documentKey==="killer"
    ? `../killer-answer/?student=${encodeURIComponent(student)}`
    : answerAnalysis
      ? `../mock/answer.html?exam=${encodeURIComponent(answerAnalysis)}&student=${encodeURIComponent(student)}`
      : "";
  if(!url)return;
  window.open(url,"_blank","noopener");
}

function watermark(){
  const layer=document.createElement("div");
  layer.className="watermark";
  layer.setAttribute("aria-hidden","true");
  for(let row=0;row<3;row++){
    const text=document.createElement("span");
    text.textContent=`${student} 학생 · GFIELD`;
    layer.appendChild(text);
  }
  return layer;
}

function totalPageCount(){return (source?.pageCount||0)+coverOffset;}
function pageLabel(number){
  if(coverOffset&&number===1)return "표지";
  return `${number-coverOffset}쪽`;
}
function spreadLabel(start){
  if(isMobileBook())return pageLabel(start);
  const second=start+1<=totalPageCount()?` · ${pageLabel(start+1)}`:"";
  return pageLabel(start)+second;
}
function createCover(){
  const cover=source.cover;
  const sheet=document.createElement("section");
  sheet.className="page exam-cover";
  sheet.dataset.page="1";
  sheet.style.setProperty("--cover-accent",cover.accent);
  const shell=document.createElement("div");
  shell.className="cover-shell";
  shell.innerHTML=`
    <div class="cover-kicker">GFIELD ACADEMY · SELECTION SERIES</div>
    <div class="cover-brand">FIELDS THE CLASSIC</div>
    <div class="cover-rule"></div>
    <div class="cover-title">필즈 더 클래식<strong>${cover.title}</strong></div>
    <div class="cover-round"><span class="cover-round-number${cover.mark.length>2?" is-word":""}">${cover.mark}</span><span class="cover-round-unit">${cover.unit||""}</span></div>
    <div class="cover-meta"><span>${cover.subtitle}</span><span>${cover.meta}</span></div>
    <div class="cover-student"><span>이름</span><span class="cover-student-name"></span></div>`;
  shell.querySelector(".cover-student-name").textContent=student;
  sheet.append(shell,watermark());
  return sheet;
}

function selectPage(number){
  const target=isMobileBook()?number:(number%2===0?number-1:number);
  turnToSpread(target,target>spreadStart?"forward":"back");
}

function isMobileBook(){return matchMedia("(max-width:760px)").matches;}
function pageStep(){return isMobileBook()?1:2;}
function lastSpreadStart(){const total=totalPageCount();return isMobileBook()?total:(total%2===0?total-1:total);}

function updatePageJump(number){
  document.querySelectorAll(".page-jump").forEach(button=>{
    button.classList.toggle("is-current",Number(button.dataset.page)===number);
  });
}

function showSpread(start){
  const lastStart=lastSpreadStart();
  spreadStart=Math.max(1,Math.min(start,lastStart));
  pages.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("is-open");
    const number=Number(page.dataset.page);
    if(number===spreadStart||(!isMobileBook()&&number===spreadStart+1))page.classList.add("is-open");
  });
  updatePageJump(spreadStart);
  prevBtn.disabled=spreadStart<=1;
  nextBtn.disabled=spreadStart>=lastStart;
  document.getElementById("meta").textContent=`${student} 학생 · ${spreadLabel(spreadStart)} / 총 ${totalPageCount()}면 · 화면 및 인쇄 워터마크 적용`;
}

function turnToSpread(start,direction){
  const lastStart=lastSpreadStart();
  const target=Math.max(1,Math.min(start,lastStart));
  if(target===spreadStart||isTurning)return;
  const oldPageNumber=isMobileBook()?spreadStart:(direction==="back"?spreadStart:Math.min(spreadStart+1,totalPageCount()));
  const oldPage=pages.querySelector(`.page[data-page="${oldPageNumber}"]`);
  showSpread(target);
  if(!oldPage||matchMedia("(prefers-reduced-motion: reduce)").matches)return;

  isTurning=true;
  prevBtn.disabled=true;nextBtn.disabled=true;
  const layer=document.createElement("div");
  layer.className=`page-turn-layer ${direction}`;
  const sheet=document.createElement("div");sheet.className="page-turn-sheet";
  const pageCopy=oldPage.cloneNode(true);pageCopy.classList.add("is-open");
  const fold=document.createElement("div");fold.className="page-turn-fold";
  sheet.appendChild(pageCopy);layer.append(sheet,fold);pages.appendChild(layer);
  layer.addEventListener("animationend",event=>{
    if(event.target!==sheet)return;
    layer.remove();isTurning=false;
    prevBtn.disabled=spreadStart<=1;nextBtn.disabled=spreadStart>=lastStart;
  });
}

function setupPageRail(){
  const rail=document.getElementById("pageRail");
  const jumps=document.getElementById("pageJumps");
  rail.style.display="";
  jumps.innerHTML="";
  const step=pageStep();
  for(let number=1;number<=totalPageCount();number+=step){
    const button=document.createElement("button");
    button.type="button";button.className="page-jump";button.dataset.page=String(number);
    const second=step===2&&number+1<=totalPageCount()?` · ${pageLabel(number+1)}`:"";
    button.textContent=pageLabel(number)+second;button.setAttribute("aria-label",pageLabel(number)+"부터 펼쳐 보기");
    button.addEventListener("click",()=>selectPage(number));
    jumps.appendChild(button);
  }
  showSpread(1);
  prevBtn.addEventListener("click",()=>turnToSpread(spreadStart-pageStep(),"back"));
  nextBtn.addEventListener("click",()=>turnToSpread(spreadStart+pageStep(),"forward"));
  document.addEventListener("keydown",event=>{
    if(event.key==="ArrowLeft")prevBtn.click();
    if(event.key==="ArrowRight")nextBtn.click();
  });

  let pointerStart=null;
  pages.addEventListener("pointerdown",event=>{
    if(event.button!==0)return;
    pointerStart={x:event.clientX,y:event.clientY,id:event.pointerId};
    pages.setPointerCapture?.(event.pointerId);
  });
  pages.addEventListener("pointerup",event=>{
    if(!pointerStart||pointerStart.id!==event.pointerId)return;
    const dx=event.clientX-pointerStart.x;
    const dy=event.clientY-pointerStart.y;
    pointerStart=null;
    if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)){
      if(dx<0)nextBtn.click();else prevBtn.click();
      return;
    }
    if(Math.abs(dx)>8||Math.abs(dy)>8)return;
    const rect=pages.getBoundingClientRect();
    if(event.clientX<rect.left+rect.width/2)prevBtn.click();else nextBtn.click();
  });
  pages.addEventListener("pointercancel",()=>{pointerStart=null;});
}

async function render(){
  if(!source)throw new Error("인쇄할 자료를 찾을 수 없습니다.");
  document.getElementById("meta").textContent=`${student} 학생 · 총 ${totalPageCount()}면 · 화면 및 인쇄 워터마크 적용`;
  document.getElementById("documentCaption").textContent=coverOffset
    ? `표지 포함 ${totalPageCount()}면 · 원본 시험지 ${source.pageCount}쪽 · ${student} 학생 워터마크 적용`
    : `${source.pageCount}쪽 원본 시험지 · ${student} 학생 워터마크 적용`;
  const images=[];
  if(coverOffset)pages.appendChild(createCover());
  for(let number=1;number<=source.pageCount;number++){
    const sourcePage=(source.startPage||1)+number-1;
    status.textContent=`${number} / ${source.pageCount}쪽을 준비하고 있습니다.`;
    const sheet=document.createElement("section");
    sheet.className=coverOffset?"page exam-page":"page";sheet.dataset.page=String(number+coverOffset);
    if(source.cover?.accent)sheet.style.setProperty("--cover-accent",source.cover.accent);
    const image=document.createElement("img");
    image.src=`${source.pagesBase}${source.pagePrefix??""}${String(sourcePage).padStart(3,"0")}.${source.pageExt||"webp"}`;
    image.alt=`${title} ${number}쪽`;
    image.decoding="async";
    image.loading="eager";
    const corner=document.createElement("span");corner.className="page-corner";corner.setAttribute("aria-hidden","true");
    if(coverOffset)sheet.append(image,corner,watermark());else sheet.append(image,watermark());
    pages.appendChild(sheet);
    images.push(image);
  }
  await Promise.all(images.map(image=>new Promise((resolve,reject)=>{
    if(image.complete&&image.naturalWidth){resolve();return;}
    image.addEventListener("load",resolve,{once:true});
    image.addEventListener("error",()=>reject(new Error("페이지 이미지를 불러오지 못했습니다.")),{once:true});
  })));
  status.style.display="none";
  setupPageRail();
  printBtn.disabled=false;
  if(params.get("autoprint")==="1"){
    setTimeout(()=>{try{window.print();}catch(e){}},400);
  }
}

render().catch(error=>{
  status.textContent="문서를 불러오지 못했습니다. "+error.message;
  status.style.color="#b91c1c";
});
</script>
</body>
</html>
