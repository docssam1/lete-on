<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFIELD 인쇄 뷰어</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,sans-serif;background:#e7edf3;color:#0f172a}
.toolbar{position:sticky;top:0;z-index:20;min-height:64px;padding:10px max(18px,calc((100vw - 1280px)/2));background:#fff;border-bottom:1px solid #cbd5e1;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 4px 18px rgba(15,23,42,.09)}
.title{font-size:16px;font-weight:900;color:#16417c}.meta{font-size:11px;font-weight:700;color:#64748b;margin-top:3px}
.actions{display:flex;gap:8px}.btn{min-height:40px;padding:0 15px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;color:#334155;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer}
.btn.primary{background:#16417c;border-color:#16417c;color:#fff}.btn:disabled{opacity:.45;cursor:wait}
.document-head{width:min(1180px,100%);margin:18px auto 0;padding:0 12px}.document-head-inner{padding:18px 20px;background:#fff;border:1px solid #cbd5e1;border-left:5px solid #16417c;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.document-kicker{font-size:10px;letter-spacing:.12em;font-weight:900;color:#a26a18}.document-name{margin-top:4px;font-size:19px;font-weight:900;color:#0f274b;letter-spacing:0}.document-caption{margin-top:7px;font-size:12px;font-weight:700;color:#64748b}.course-summary{width:min(1180px,100%);margin:12px auto 0;padding:0 12px;background:transparent;border:0;box-shadow:none}.course-summary-inner{padding:14px 16px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.course-summary-title{font-size:13px;font-weight:900;color:#16417c}.course-topics{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0;padding:0;list-style:none}.course-topics li{padding:5px 8px;border-radius:5px;background:#edf3f8;color:#334155;font-size:11px;font-weight:800}
.status{padding:22px;text-align:center;color:#64748b;font-size:13px;font-weight:800}
.viewer-layout{width:min(1180px,100%);margin:0 auto;padding:18px 12px 50px;display:grid;grid-template-columns:156px minmax(0,1fr);align-items:start;gap:18px}.page-rail{position:sticky;top:82px;padding:12px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.page-rail-title{font-size:11px;font-weight:900;color:#64748b;margin:1px 2px 10px}.page-jumps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.page-jump{height:32px;border:1px solid #d6e0ea;border-radius:5px;background:#f8fafc;color:#475569;font:800 11px Pretendard,sans-serif;cursor:pointer}.page-jump:hover,.page-jump.is-current{border-color:#16417c;background:#16417c;color:#fff}.pages{min-width:0;margin:0;padding:0;display:grid;gap:18px}
.page{position:relative;width:100%;background:#fff;box-shadow:0 8px 28px rgba(15,23,42,.16);overflow:hidden}
.page canvas,.page img{display:block;width:100%;height:auto}
.watermark{display:block;position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.watermark span{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-32deg);font-size:34pt;font-weight:900;color:rgba(22,65,124,.14);white-space:nowrap;letter-spacing:0}
.watermark span:nth-child(1){top:25%}.watermark span:nth-child(2){top:50%}.watermark span:nth-child(3){top:75%}
@media(max-width:760px){.toolbar{align-items:flex-start;padding:10px 12px}.title{font-size:14px}.actions{gap:5px}.btn{padding:0 10px}.document-head{margin-top:10px;padding:0 8px}.document-head-inner{padding:14px 15px}.document-name{font-size:16px}.course-summary{padding:0 8px}.viewer-layout{display:block;padding:10px 5px 30px}.page-rail{position:sticky;top:64px;z-index:10;margin:0 3px 9px;padding:9px 10px;display:flex;align-items:center;gap:10px;overflow:hidden}.page-rail-title{margin:0;white-space:nowrap}.page-jumps{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.page-jump{min-width:32px;flex:0 0 32px}.pages{gap:8px}}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .toolbar,.status,.document-head,.course-summary,.page-rail{display:none!important}
  .pages{display:block;width:auto;margin:0;padding:0}
  .page{width:210mm;margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .watermark{display:block!important}
}
</style>
</head>
<body>
<header class="toolbar">
  <div><div class="title" id="title">인쇄 자료</div><div class="meta" id="meta">문서를 준비하고 있습니다.</div></div>
  <div class="actions">
    <button class="btn" type="button" onclick="history.back()">돌아가기</button>
    <button class="btn" id="videoBtn" type="button" style="display:none" onclick="openLessonVideo()">▶ 학습영상</button>
    <button class="btn" id="answerBtn" type="button" style="display:none" onclick="openAnswerGuide()">☑ 유형별 풀이</button>
    <button class="btn primary" id="printBtn" type="button" onclick="window.print()" disabled>인쇄</button>
  </div>
</header>
<section class="document-head" id="documentHead">
  <div class="document-head-inner">
    <div class="document-kicker">GFIELD · ORIGINAL MOCK EXAM</div>
    <div class="document-name" id="documentName">원본 모의고사</div>
    <div class="document-caption" id="documentCaption">원본 시험지와 화면·인쇄 워터마크가 적용됩니다.</div>
  </div>
</section>
<section class="course-summary" id="courseSummary" style="display:none"><div class="course-summary-inner"><div class="course-summary-title">집중 유형</div><ul class="course-topics" id="courseTopics"></ul></div></section>
<div class="viewer-layout">
  <aside class="page-rail" id="pageRail" style="display:none" aria-label="쪽 이동"><div class="page-rail-title">쪽 이동</div><div class="page-jumps" id="pageJumps"></div></aside>
  <div><div class="status" id="status">PDF를 불러오는 중입니다.</div><main class="pages" id="pages"></main></div>
</div>

<script src="./documents.js"></script>
<script>
const params=new URLSearchParams(location.search);
const documentKey=params.get("doc")||"";
const source=window.GFIELD_PRINT_DOCUMENTS?.[documentKey];
const title=(source?.title||"인쇄 자료").slice(0,80);
const student=(params.get("student")||"학생").trim().slice(0,30);
const lessonVideo=params.get("video")||"";
const topics=(params.get("topics")||"").split("|").map(v=>v.trim()).filter(Boolean);
const status=document.getElementById("status");
const pages=document.getElementById("pages");
const printBtn=document.getElementById("printBtn");
document.getElementById("title").textContent=title;
document.getElementById("documentName").textContent=title;
document.title=title+" | GFIELD";
if(lessonVideo)document.getElementById("videoBtn").style.display="";
if(documentKey==="killer"||documentKey.startsWith("mock-set")||documentKey==="diagnostic")document.getElementById("answerBtn").style.display="";
if(topics.length){
  document.getElementById("courseSummary").style.display="";
  const topicList=document.getElementById("courseTopics");
  topics.forEach(topic=>{const item=document.createElement("li");item.textContent=topic;topicList.appendChild(item);});
}
function openLessonVideo(){
  const url=`../video-viewer/?video=${encodeURIComponent(lessonVideo)}&title=${encodeURIComponent(title+" 학습영상")}&student=${encodeURIComponent(student)}`;
  window.open(url,"_blank","noopener");
}
function openAnswerGuide(){
  const url=documentKey==="killer"
    ? `../killer-answer/?student=${encodeURIComponent(student)}`
    : `./?doc=answer&student=${encodeURIComponent(student)}`;
  window.open(url,"_blank","noopener");
}

function watermark(){
  const layer=document.createElement("div");
  layer.className="watermark";
  layer.setAttribute("aria-hidden","true");
  for(let row=0;row<3;row++){
    const text=document.createElement("span");
    text.textContent=`${student} 학생 · GFIELD`;
    layer.appendChild(text);
  }
  return layer;
}

function selectPage(number){
  const current=pages.querySelector(`.page[data-page="${number}"]`);
  if(current)current.scrollIntoView({behavior:"smooth",block:"start"});
}

function updatePageJump(number){
  document.querySelectorAll(".page-jump").forEach(button=>{
    button.classList.toggle("is-current",Number(button.dataset.page)===number);
  });
}

function setupPageRail(){
  const rail=document.getElementById("pageRail");
  const jumps=document.getElementById("pageJumps");
  rail.style.display="";
  jumps.innerHTML="";
  for(let number=1;number<=source.pageCount;number++){
    const button=document.createElement("button");
    button.type="button";button.className="page-jump";button.dataset.page=String(number);
    button.textContent=number+"쪽";button.setAttribute("aria-label",number+"쪽으로 이동");
    button.addEventListener("click",()=>selectPage(number));
    jumps.appendChild(button);
  }
  const observer=new IntersectionObserver(entries=>{
    const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(visible)updatePageJump(Number(visible.target.dataset.page));
  },{root:null,rootMargin:"-16% 0px -68% 0px",threshold:[0,.1,.5]});
  pages.querySelectorAll(".page").forEach(page=>observer.observe(page));
  updatePageJump(1);
}

async function render(){
  if(!source)throw new Error("인쇄할 자료를 찾을 수 없습니다.");
  document.getElementById("meta").textContent=`${student} 학생 · ${source.pageCount}쪽 · 화면 및 인쇄 워터마크 적용`;
  document.getElementById("documentCaption").textContent=`${source.pageCount}쪽 원본 시험지 · ${student} 학생 워터마크 적용`;
  const images=[];
  for(let number=1;number<=source.pageCount;number++){
    const sourcePage=(source.startPage||1)+number-1;
    status.textContent=`${number} / ${source.pageCount}쪽을 준비하고 있습니다.`;
    const sheet=document.createElement("section");
    sheet.className="page";sheet.dataset.page=String(number);
    const image=document.createElement("img");
    image.src=`${source.pagesBase}${source.pagePrefix??""}${String(sourcePage).padStart(3,"0")}.${source.pageExt||"webp"}`;
    image.alt=`${title} ${number}쪽`;
    image.decoding="async";
    image.loading="eager";
    sheet.append(image,watermark());
    pages.appendChild(sheet);
    images.push(image);
  }
  await Promise.all(images.map(image=>new Promise((resolve,reject)=>{
    if(image.complete&&image.naturalWidth){resolve();return;}
    image.addEventListener("load",resolve,{once:true});
    image.addEventListener("error",()=>reject(new Error("페이지 이미지를 불러오지 못했습니다.")),{once:true});
  })));
  status.style.display="none";
  setupPageRail();
  printBtn.disabled=false;
  if(params.get("autoprint")==="1"){
    setTimeout(()=>{try{window.print();}catch(e){}},400);
  }
}

render().catch(error=>{
  status.textContent="문서를 불러오지 못했습니다. "+error.message;
  status.style.color="#b91c1c";
});
</script>
</body>
</html>
