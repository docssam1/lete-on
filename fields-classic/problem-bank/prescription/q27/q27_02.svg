    .fruit{fill:#f5c75b;stroke:#173d6d;stroke-width:3}
    .piece{fill:#fff1b8;stroke:#173d6d;stroke-width:2.5}
    .eat{stroke:#d7263d;stroke-width:4;stroke-linecap:round}
