<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">자르고 남은 조각 수 3</title>
  <desc id="desc">8개의 과일을 반으로 자르고, 7조각을 먹은 뒤, 남은 조각을 다시 반으로 자르는 과정</desc>
