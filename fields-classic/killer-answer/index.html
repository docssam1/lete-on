<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>탑시크릿 킬러문항 해제 유형별 풀이</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef3f7;color:#172033;font-family:Pretendard,sans-serif}.toolbar{position:sticky;top:0;z-index:10;min-height:60px;padding:10px 18px;background:#fff;border-bottom:1px solid #cbd5e1;display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:16px;font-weight:900;color:#16417c}.meta{margin-top:3px;color:#64748b;font-size:11px;font-weight:700}.back{height:38px;padding:0 13px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#334155;font:900 12px Pretendard,sans-serif;cursor:pointer}.guide{width:min(940px,100%);margin:0 auto;padding:22px 14px 46px}.intro{padding:18px 20px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.intro h1{margin:0;color:#16417c;font-size:22px}.intro p{margin:8px 0 0;color:#475569;font-size:13px;font-weight:700;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}.card{position:relative;overflow:hidden;padding:18px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.07)}.card h2{margin:0;color:#16417c;font-size:16px}.rule{margin:10px 0 12px;color:#334155;font-size:13px;font-weight:800;line-height:1.7}.steps{margin:0;padding-left:18px;color:#64748b;font-size:12px;font-weight:700;line-height:1.7}.watch{display:inline-flex;margin-top:14px;padding:8px 10px;border-radius:7px;background:#16417c;color:#fff;text-decoration:none;font-size:11px;font-weight:900}.watermark{position:fixed;inset:60px 0 0;z-index:3;pointer-events:none;overflow:hidden}.watermark span{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-32deg);color:rgba(22,65,124,.10);font-size:clamp(24px,3vw,42px);font-weight:900;white-space:nowrap}.watermark span:nth-child(1){top:24%}.watermark span:nth-child(2){top:50%}.watermark span:nth-child(3){top:76%}@media(max-width:600px){.toolbar{padding:9px 12px}.title{font-size:14px}.guide{padding:14px 10px 30px}.intro h1{font-size:19px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="toolbar"><div><div class="title">탑시크릿 킬러문항 해제 유형별 풀이</div><div class="meta" id="meta"></div></div><button class="back" type="button" onclick="history.back()">돌아가기</button></header>
<div class="watermark" id="watermark" aria-hidden="true"></div>
<main class="guide"><section class="intro"><h1>유형별 풀이 원리</h1><p>각 유형을 푸는 데 필요한 규칙과 순서를 확인하세요. 영상 버튼을 누르면 해당 풀이 구간부터 재생됩니다.</p></section><section class="grid" id="cards"></section></main>
<script>
const params=new URLSearchParams(location.search);
const student=(params.get('student')||'학생').trim().slice(0,30);
const video='https://www.youtube.com/watch?v=_x-NIjvBxMQ';
const guides=[
  {name:'복면산',start:1,rule:'일의 자리부터 계산하고, 받아올림 수를 반드시 다음 자리로 옮깁니다.',steps:['같은 모양은 같은 숫자로 둡니다.','일의 자리가 맞는지 먼저 확인합니다.','받아올림이 있으면 십의 자리에 1을 더합니다.']},
  {name:'수직선에서의 길이·단위길이',start:194,rule:'전체 길이와 부분 길이의 관계를 선분 그림으로 정리합니다.',steps:['한 칸의 단위길이를 먼저 찾습니다.','겹치는 구간은 한 번만 셉니다.','전체 길이는 부분 길이의 합으로 확인합니다.']},
  {name:'도형수',start:395,rule:'색칠한 칸의 위치와 개수를 함께 규칙으로 봅니다.',steps:['각 도형에서 바뀌는 칸을 표시합니다.','가로·세로·대칭 규칙을 비교합니다.','다음 모양에 같은 규칙을 적용합니다.']},
  {name:'마방진·삼각진',start:787,rule:'모든 가로·세로 또는 한 줄의 합이 같은지 이용합니다.',steps:['주어진 한 줄의 합을 기준값으로 정합니다.','빈칸 하나씩 식으로 구합니다.','사용한 수가 겹치지 않는지 마지막에 확인합니다.']},
  {name:'도형이 나타내는 수',start:1109,rule:'각 모양의 값 또는 자리값을 먼저 정한 뒤 전체를 계산합니다.',steps:['반복되는 모양을 같은 값으로 둡니다.','주어진 예시로 모양 하나의 값을 찾습니다.','구하려는 줄에 대입해 계산합니다.']},
  {name:'주고받기',start:1239,rule:'주고받은 뒤의 차이와 전체 수를 분리해 생각합니다.',steps:['처음 전체 수를 식으로 둡니다.','누가 몇 개를 주었는지 반영합니다.','같아지는 조건 또는 차이 조건으로 답을 확인합니다.']},
  {name:'양팔저울',start:1431,rule:'양쪽 무게가 같다는 식을 세워 모양 하나의 무게를 구합니다.',steps:['가벼운 쪽에 필요한 무게를 확인합니다.','같은 모양끼리 묶어 비교합니다.','양쪽 합이 같은지 검산합니다.']},
  {name:'수·도형 규칙',start:1496,rule:'모양의 증가와 수의 증가를 따로 관찰한 다음 연결합니다.',steps:['한 단계에서 늘거나 줄어드는 양을 찾습니다.','반복 단위가 있으면 묶어서 계산합니다.','문항이 묻는 순서에 맞춰 최종값을 구합니다.']},
  {name:'약속·암호',start:1953,rule:'주어진 약속을 연산식으로 바꾸고, 같은 방식으로 빈칸에 적용합니다.',steps:['예시의 입력과 결과를 짝지어 봅니다.','어떤 연산이 반복되는지 찾습니다.','새 수에도 같은 약속을 적용해 확인합니다.']}
];
function videoUrl(start,name){return `../video-viewer/?video=${encodeURIComponent(video)}&start=${start}&title=${encodeURIComponent(name+' 해설')}&student=${encodeURIComponent(student)}`;}
document.getElementById('meta').textContent=`${student} 학생 전용 · 화면 워터마크 적용`;
document.getElementById('cards').innerHTML=guides.map(g=>`<article class="card"><h2>${g.name}</h2><p class="rule">${g.rule}</p><ol class="steps">${g.steps.map(step=>`<li>${step}</li>`).join('')}</ol><a class="watch" href="${videoUrl(g.start,g.name)}" target="_blank" rel="noopener">▶ 해당 유형 해설 보기</a></article>`).join('');
const watermark=document.getElementById('watermark');for(let row=0;row<3;row++){const label=document.createElement('span');label.textContent=`${student} 학생 · GFIELD`;watermark.appendChild(label);}
</script>
</body>
</html>
