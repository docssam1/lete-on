<style>

 small{color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}.chip{border:1px solid #e2d4c8;background:#fff;border-radius:999px;padding:9px 14px;font-weight:750;color:#67564d;cursor:pointer}.chip.active{background:#34231b;color:#fff;border-color:#34231b}.cabinet{position:relative;padding:14px 14px 22px;border-radius:24px;background:linear-gradient(90deg,#58331e 0 11px,#a96d43 11px 20px,#d69c6c 20px calc(100% - 20px),#a96d43 calc(100% - 20px) calc(100% - 11px),#58331e calc(100% - 11px));box-shadow:0 28px 70px rgba(69,37,20,.28),inset 0 0 0 2px rgba(255,255,255,.2)}.cabinet:after{content:'';position:absolute;left:7%;right:7%;bottom:-12px;height:20px;background:#6c4027;border-radius:0 0 18px 18px;box-shadow:0 12px 20px #4f2e1c55}.floor{position:relative;margin:0 8px;background:linear-gradient(180deg,#fffdf9,#fff9f0);border-left:1px solid #d6b18c;border-right:1px solid #d6b18c;padding:14px 14px 20px;min-height:152px}.floor:first-child{border-radius:13px 13px 0 0}.floor:last-child{border-radius:0 0 10px 10px}.floor:after{content:'';position:absolute;left:-9px;right:-9px;bottom:0;height:13px;background:linear-gradient(#d89c67,#9b613a 55%,#684027);box-shadow:0 7px 9px #5d351e44;z-index:1}.floorhead{display:flex;align-items:center;gap:8px;margin-bottom:11px}.floorbadge{background:#36241c;color:#fff;border-radius:11px;padding:5px 9px;font-weight:900;font-size:13px}.floorname{font-size:12px;color:#8b786d}.count{margin-left:auto;font-size:12px;color:#8b786d}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px}.card{position:relative;min-height:124px;padding:13px;border-radius:17px;border:1px solid #e9ded5;background:linear-gradient(145deg,#fff,#faf5ef);box-shadow:0 8px 18px rgba(76,47,31,.09),inset 0 1px #fff;transition:.18s transform,.18s box-shadow;overflow:hidden}.card:hover{transform:translateY(-3px);box-shadow:0 14px 25px rgba(76,47,31,.14)}.card:before{content:'';position:absolute;right:-25px;top:-25px;width:75px;height:75px;border-radius:50%;background:var(--cat,#eee);opacity:.14}.row{display:flex;gap:10px;align-items:flex-start}.ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--cat,#ddd) 15%,white)}.name{font-weight:850;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:11px;color:var(--muted);margin-top:3px}.details{display:flex;align-items:end;justify-content:space-between;margin-top:12px;gap:8px}.date{font-size:11px;color:#6b5a51}.qty{font-weight:900;font-size:13px}.bar{height:5px;background:#eee5df;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:var(--remain);background:linear-gradient(90deg,#7357ff,#9b82ff);border-radius:9px}.tag{position:absolute;right:8px;top:8px;padding:3px 7px;border-radius:99px;font-size:9px;font-weight:900;background:#fff0d0;color:#a36408}.tag.open{background:#ffebee;color:#c53a49}.empty{padding:30px;text-align:center;color:#9c8d84;border:1px dashed #dcc9b8;border-radius:16px}.modal{border:0;border-radius:24px;padding:0;width:min(92vw,520px);box-shadow:0 35px 90px #2e1c1470}.modal::backdrop{background:#25171199;backdrop-filter:blur(5px)}.modalin{padding:22px}.modal h3{margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{font-size:12px;font-weight:750;color:#65564d}.grid input,.grid select,.grid textarea{width:100%;margin-top:6px;padding:11px;border:1px solid #dfd1c5;border-radius:12px;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:850;cursor:pointer}.btn.primary{background:#6f52f5;color:#fff}.btn.light{background:#eee8e3}.footer-note{text-align:center;color:#9a8c84;font-size:12px;margin-top:25px}@media(max-width:760px){.topin{flex-wrap:wrap}.search{order:3;flex-basis:100%}.hero{grid-template-columns:1fr}.welcome h2{font-size:24px}.stats{padding:6px}.stat{padding:10px}.stat b{font-size:20px}.wrap{padding:16px 8px 60px}.cabinet{padding-left:8px;padding-right:8px}.floor{margin:0 5px;padding:11px 9px 18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{min-height:132px;padding:10px}.ico{width:32px;height:32px;flex-basis:32px;font-size:18px}.name{font-size:12px}.details{display:block}.qty{display:block;margin-top:5px}.grid{grid-template-columns:1fr}}
</style>

<body>
<header class="top"><div class="topin"><div class="brand"><div class="logo">🍪</div><div><h1>유빈유준 편의점</h1><p>맨 아래 1층 · 맨 위 5층</p></div></div><div class="search"><input id="search" placeholder="과자 이름, 종류 검색"></div></div></header>
<main class="wrap"><section class="hero"><div class="welcome"><span class="eyebrow">HOME SNACK CABINET</span><h2>우리 집 과자를 한눈에</h2><p>개수 말이 없으면 1개, 남은 양 표시가 없으면 새 상품으로 기록했습니다.</p></div><div class="stats"><div class="stat"><b id="totalKinds">0</b><small>전체 종류</small></div><div class="stat"><b id="totalUnits">0</b><small>총 수량</small></div><div class="stat"><b id="soonCount">0</b><small>90일 이내</small></div></div></section><nav class="toolbar" id="filters"><button class="chip active" data-cat="전체">전체</button><button class="chip" data-cat="스낵">스낵</button><button class="chip" data-cat="초콜릿">초콜릿</button><button class="chip" data-cat="건과일">건과일</button><button class="chip" data-cat="사탕">사탕·젤리</button><button class="chip" data-cat="기타">기타</button></nav><section class="cabinet" id="cabinet"></section><p class="footer-note">카드를 누르면 수량·남은 양·층을 수정할 수 있습니다.</p></main>
<dialog class="modal" id="dialog"><form class="modalin" id="form"><h3>재고 수정</h3><input type="hidden" id="editId"><div class="grid"><label class="wide">제품명<input id="editName" required></label><label>층<select id="editFloor"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>종류<input id="editCat"></label><label>수량<input id="editQty" type="number" min="0"></label><label>단위<input id="editUnit"></label><label>유통기한<input id="editExpiry" type="date"></label><label>남은 양<select id="editRemain"><option value="1">새 상품</option><option value=".8">4/5</option><option value=".67">2/3</option><option value=".5">절반</option><option value=".33">1/3</option><option value=".2">1/5</option></select></label><label class="wide">메모<textarea id="editNote" rows="2"></textarea></label></div><div class="actions"><button class="btn light" type="button" id="cancel">취소</button><button class="btn primary">저장</button></div></form></dialog>
<script>
const VERSION='confirmed-2026-07-24-v1',KEY='yubinYujunStore.confirmed.v1',VER='yubinYujunStore.confirmed.version';
const raw=[
[3,'건과일','KingKong Mart Soft & Juicy Mango (500g)',1,'개','2027-02-06',1],[3,'건과일','Soft Dried Mango (주황색 포장)',1,'개','2027-04-12',1],[3,'초콜릿',"See's Candies Toffee-ettes (142g)",1,'상자','2026-09-20',1],[4,'스낵','건빵',12,'개','2027-02-23',1],[3,'젤리','TOP FRU FUDGE 망고 젤리',1,'개','2026-12-01',1],[3,'건과일','MANGO STRIPS',1,'개','2027-01-20',.33],[2,'스낵','오리온 꼬북칩 초코맛',1,'봉','2026-10-21',1],[2,'스낵','오리온 도도한 나쵸 치즈맛',1,'봉','2026-11-30',1],[2,'스낵','크라운 참쌀선과',6,'개','2026-08-24',.5,'개봉 · 6개 남음'],[2,'스낵','치킨팝 닭강정맛',1,'봉','2026-10-29',1],[3,'젤리','Okio Strawberry Gummy',1,'봉','2027-05-04',1],[3,'건과일','Delight Project 상큼한 딸기칩',1,'봉','2026-12-05',1],[2,'스낵','농심 쫄병 안성탕면맛',1,'봉','2026-12-26',1],[1,'기타','마루짱 아카이 키츠네 우동',3,'개','2026-12-11',1],[1,'쿠키','리츠 초코 샌드',1,'상자','2027-03-31',1,'포장 표기 2027년 3월'],[1,'기타','포핀쿠킨 아이스크림 만들기',1,'상자','2028-06-30',1,'포장 표기 2028년 6월'],[1,'기타','포핀쿠킨 피자 만들기',1,'상자','2027-10-31',1,'포장 표기 2027년 10월'],[1,'기타','포핀쿠킨 초밥 만들기',1,'상자','2027-11-30',1,'포장 표기 2027년 11월'],[1,'초콜릿','부르봉 키코리노 키리카부 초코 스낵',1,'상자','2027-03-31',1,'포장 표기 2027년 3월'],[2,'스낵','오뚜기 콘크림 스프팝콘',1,'봉','2026-10-14',1],[3,'스낵','올리브영 레인보우 치즈 베이글칩',1,'봉','2026-11-11',1],[3,'초콜릿','MUJI 포도 구미 초콜릿',1,'봉','2027-04-08',1],[3,'기타','MUJI 캐러멜 푸딩 만들기 키트',1,'개','2027-01-21',1],[3,'사탕','MUJI 유자&금귤 캔디',1,'봉','2026-11-24',1],[2,'스낵','강냉이',1,'봉','2027-04-14',.8],[2,'스낵','HBAF 메가사이즈 버터솔트 팝콘',1,'봉','',.2,'유통기한 확인 필요'],[1,'쿠키','오레오 초콜릿 샌드위치 쿠키',1,'상자','2027-05-08',1],[1,'스낵','오리온 고래밥 볶음양념맛',1,'봉','2026-11-18',1],[3,'사탕','카멜레온 캔디 (KIKKO)',1,'봉','2027-07-24',.67,'개봉'],[3,'사탕',"Cand'Art 체리맛 롤리팝",4,'개','2027-05-14',1],[3,'육포','세븐셀렉트 진화육포',1,'봉','2027-04-20',1],[2,'초콜릿','MUJI 초코과자',1,'봉','2026-12-04',.8,'개봉'],[2,'스낵','두부과자',1,'봉','2026-10-08',1],[4,'건과일','구운 바나나칩',1,'봉','2027-02-20',.33,'개봉'],[3,'초콜릿','Crunky Devil 코코몬드 (코코넛 & 아몬드 초콜릿)',1,'개','2026-12-21',1],[1,'쿠키','KUNNA 코코넛 크리스피 롤(초코)',1,'상자','2027-12-02',1],[5,'음료','매일 추억의 자판기 우유맛 분말스틱',8,'개','2027-07-19',1],[5,'기타','크리스피 카다이프 (프리미엄 레시피)',1,'봉','2027-03-31',1],[3,'젤리','유니버설 스튜디오 싱가포르 젤리(별 모양)',1,'통','2026-12-31',1],[2,'스낵','우마이봉 14종 모둠팩',1,'봉','2026-09-30',1],[2,'기타','짱구 나리키리 드링크 레몬콜라맛',1,'봉','2027-03-18',1],[2,'스낵','7종 해산물 믹스 크래커',1,'봉','2026-11-04',1],[2,'기타','글리코 쵸콧토 푸칭푸딩 커스터드',3,'팩','2026-11-08',1]
];
const seed=raw.map((r,i)=>({id:'c'+(i+1),floor:r[0],category:r[1],name:r[2],qty:r[3],unit:r[4],expiry:r[5],remain:r[6],note:r[7]||''}));
if(localStorage.getItem(VER)!==VERSION){localStorage.setItem(KEY,JSON.stringify(seed));localStorage.setItem(VER,VERSION)}
let items=JSON.parse(localStorage.getItem(KEY)||'[]'),cat='전체',query='';
const icons={건과일:'🥭',초콜릿:'🍫',젤리:'🍬',사탕:'🍭',스낵:'🥨',쿠키:'🍪',육포:'🥩',음료:'🥛',기타:'📦'};const colors={건과일:'#f0a23b',초콜릿:'#7a4c36',젤리:'#ed6c8d',사탕:'#d85283',스낵:'#ee8b2d',쿠키:'#bc7b45',육포:'#a83c37',음료:'#4b95e9',기타:'#7464cf'};
function days(d){if(!d)return 9999;return Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000)}function dateText(x){if(!x.expiry)return '유통기한 확인 필요';let d=days(x.expiry);return x.expiry.replaceAll('-','.')+(d<0?' · 지남':d<=90?' · D-'+d:'')}function remainText(x){if(x.remain>=1)return '새 상품';const map={'.8':'4/5 남음','.67':'2/3 남음','.5':'절반 남음','.33':'1/3 남음','.2':'1/5 남음'};return map[String(x.remain)]||Math.round(x.remain*100)+'% 남음'}
function render(){const shown=items.filter(x=>(cat==='전체'||x.category===cat||(cat==='사탕'&&x.category==='젤리'))&&(!query||(x.name+' '+x.category).toLowerCase().includes(query)));document.getElementById('totalKinds').textContent=items.length;document.getElementById('totalUnits').textContent=items.reduce((a,x)=>a+Number(x.qty),0);document.getElementById('soonCount').textContent=items.filter(x=>days(x.expiry)<=90).length;document.getElementById('cabinet').innerHTML=[5,4,3,2,1].map(f=>{const list=shown.filter(x=>x.floor===f);return `<section class="floor"><div class="floorhead"><span class="floorbadge">${f}층</span><span class="floorname">${f===5?'맨 위':f===1?'맨 아래':''}</span><span class="count">${list.length}종</span></div><div class="cards">${list.length?list.map(card).join(''):'<div class="empty">이 층에 표시할 품목이 없습니다.</div>'}</div></section>`}).join('');document.querySelectorAll('.card').forEach(el=>el.onclick=()=>openEdit(el.dataset.id))}
function card(x){return `<article class="card" data-id="${x.id}" style="--cat:${colors[x.category]||'#777'};--remain:${x.remain*100}%"><div class="row"><span class="ico">${icons[x.category]||'📦'}</span><div><div class="name">${x.name}</div><div class="meta">${x.category}</div></div></div><div class="details"><span class="date">${dateText(x)}</span><span class="qty">${x.qty}${x.unit}</span></div><div class="bar"><i></i></div>${x.remain<1?`<span class="tag open">${remainText(x)}</span>`:''}</article>`}
document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};document.getElementById('filters').onclick=e=>{if(!e.target.dataset.cat)return;cat=e.target.dataset.cat;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b===e.target));render()};
const dlg=document.getElementById('dialog');function openEdit(id){const x=items.find(v=>v.id===id);editId.value=x.id;editName.value=x.name;editFloor.value=x.floor;editCat.value=x.category;editQty.value=x.qty;editUnit.value=x.unit;editExpiry.value=x.expiry;editRemain.value=String(x.remain);editNote.value=x.note;dlg.showModal()}cancel.onclick=()=>dlg.close();form.onsubmit=e=>{e.preventDefault();const x=items.find(v=>v.id===editId.value);Object.assign(x,{name:editName.value,floor:+editFloor.value,category:editCat.value,qty:+editQty.value,unit:editUnit.value,expiry:editExpiry.value,remain:+editRemain.value,note:editNote.value});localStorage.setItem(KEY,JSON.stringify(items));dlg.close();render()};render();
</script>
</body></html>
