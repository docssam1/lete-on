<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b2f21">
<meta name="robots" content="noindex,nofollow">
<title>유빈유준 편의점</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles-v2.css?v=1">
<script src="inventory-v2.js?v=1" defer></script>
<script src="inventory-floor4-fix-v1.js?v=1" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><div class="logo">🍪</div><div><h1>유빈유준 편의점</h1><p>맨 아래 1층 · 맨 위 5층</p></div></div>
    <label class="search"><input id="searchInput" type="search" placeholder="제품명이나 종류 검색"></label>
    <button class="primary" id="addBtn" type="button">＋ 새 상품</button>
  </div>
</header>

<main class="shell">
  <section class="hero">
    <div class="hero-card">
      <div class="eyebrow">HOME SNACK CABINET</div>
      <h2>한눈에 보고, 먼저 먹을 것을 바로 찾기</h2>
      <p>수량을 말하지 않은 제품은 1개, 남은 양을 말하지 않은 제품은 새 상품으로 등록했습니다.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="kindCount">0</b><small>전체 종류</small></div>
      <div class="stat"><b id="unitCount">0</b><small>등록 수량 합계</small></div>
      <div class="stat"><b id="urgentCount">0</b><small>90일 이내</small></div>
      <div class="stat"><b id="openedCount">0</b><small>개봉 상품</small></div>
    </div>
  </section>

  <section class="quick-row" id="floorJumps"></section>

  <section class="controls">
    <button class="chip active" data-category="전체">전체</button>
    <button class="chip" data-category="스낵">스낵</button>
    <button class="chip" data-category="쿠키">쿠키</button>
    <button class="chip" data-category="초콜릿">초콜릿</button>
    <button class="chip" data-category="건과일">건과일</button>
    <button class="chip" data-category="사탕·젤리">사탕·젤리</button>
    <button class="chip" data-category="기타">기타</button>
    <span class="control-spacer"></span>
    <button class="secondary" id="openedFilter" type="button">개봉만 보기</button>
    <button class="secondary" id="exportBtn" type="button">백업</button>
    <label class="secondary">불러오기<input id="importInput" type="file" accept="application/json" hidden></label>
  </section>

  <section class="priority">
    <div class="section-title"><div><div class="eyebrow">EAT FIRST</div><h3>먼저 먹기</h3></div><small>유통기한이 빠른 순</small></div>
    <div class="priority-list" id="priorityList"></div>
  </section>

  <section class="cabinet" id="cabinet"></section>
</main>

<dialog class="modal" id="itemDialog">
<form class="modal-inner" id="itemForm">
  <div class="modal-head"><h3 id="dialogTitle">상품 수정</h3><button class="close" id="closeBtn" type="button">×</button></div>
  <input id="itemId" type="hidden">
  <div class="form-grid">
    <label class="wide">제품명<input id="nameInput" required maxlength="100"></label>
    <label>층<select id="floorInput"><option value="1">1층 (맨 아래)</option><option value="2">2층</option><option value="3">3층</option><option value="4">4층</option><option value="5">5층 (맨 위)</option></select></label>
    <label>종류<select id="categoryInput"><option>스낵</option><option>쿠키</option><option>초콜릿</option><option>건과일</option><option>사탕</option><option>젤리</option><option>육포</option><option>음료</option><option>기타</option></select></label>
    <label>수량<input id="qtyInput" type="number" min="0" step="1"></label>
    <label>단위<input id="unitInput" maxlength="10"></label>
    <label>유통기한<input id="expiryInput" type="date"></label>
    <label>표시용 날짜<input id="expiryLabelInput" placeholder="예: 2027년 3월"></label>
    <label>남은 양<select id="remainInput"><option value="">양 미확인</option><option value="1">가득</option><option value="0.8">4/5</option><option value="0.67">2/3</option><option value="0.5">절반</option><option value="0.33">1/3</option><option value="0.2">1/5</option></select></label>
    <label class="check"><input id="openedInput" type="checkbox"> 개봉함</label>
    <label class="wide">메모<textarea id="noteInput" rows="3"></textarea></label>
  </div>
  <div class="modal-actions"><button class="danger" id="deleteBtn" type="button">삭제</button><button class="light" id="cancelBtn" type="button">취소</button><button class="primary" type="submit">저장</button></div>
</form>
</dialog>
<div class="toast" id="toast"></div>
</body>
</html>
