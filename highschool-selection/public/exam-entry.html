<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://fgahqumaldheqettmvqg.supabase.co; connect-src 'self' https://fgahqumaldheqettmvqg.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"><title>모의고사 | LETE-ON</title><link rel="stylesheet" href="./exams/app.css?v=launch-20261102"></head><body>
<header><a class="brand" href="./promo/">LETE-ON</a><span>모의고사</span><button id="logout" hidden>나가기</button></header>
<main>
<section id="login-view" class="login-panel"><h1>모의고사 입장</h1><div class="login-tabs" role="group" aria-label="입장 구분"><button id="student-tab" aria-pressed="true">학생</button><button id="teacher-tab" aria-pressed="false">선생님</button></div>
<form id="student-login"><label>이름<input id="student-name" autocomplete="username" maxlength="80" required></label><label>승인번호<input id="student-code" type="password" autocomplete="current-password" minlength="8" maxlength="80" required></label><button class="primary" type="submit">시험 입장</button></form>
<form id="teacher-login" hidden><label>선생님 이메일<input id="teacher-email" type="email" autocomplete="username" required></label><label>비밀번호<input id="teacher-password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">선생님 입장</button></form>
<p class="help">승인번호는 담당 선생님께 받으세요.</p></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="library-view" hidden><h1 id="welcome">내 모의고사</h1><div id="exam-list"></div><h2>응시 결과</h2><div id="past-results"></div></section>
<section id="exam-view" hidden><div class="exam-toolbar"><div><span id="exam-mode" class="mode"></span><h1 id="exam-title"></h1><p id="exam-spec"></p></div><div class="toolbar-actions"><button id="mobile-answers" aria-pressed="false" aria-controls="response-form">답안 입력</button><button id="print-paper" disabled>시험지 인쇄</button><button id="back-library">시험 목록</button></div></div><p id="pilot-note" class="pilot-note" hidden>시범 응시입니다. 결과와 풀이 시간을 수업 검토에 사용합니다.</p>
<div class="exam-workspace"><div id="paper-pages" class="paper-pages" aria-label="시험지"></div><aside class="response-panel"><h2>답안 입력</h2><p class="help">분수는 1/2, 근호는 sqrt(2), 여러 답은 쉼표로 구분하세요.</p><form id="response-form"><div id="response-fields"></div><button class="primary" id="submit-responses" type="submit">답안 제출</button></form></aside></div></section>
<section id="report-view" hidden><div class="report-top"><h1>응시 결과</h1><button id="report-library">시험 목록</button></div><div id="report-content"></div></section>
<section id="admin-view" hidden><h1>모의고사 학생 승인</h1><form id="grant-form" class="grant-form"><label>학생 이름<input id="grant-name" maxlength="80" required></label><label>이용 마지막 날<input id="grant-until" type="date" required></label><fieldset><legend>응시할 시험</legend><div id="grant-exams"></div></fieldset><button type="submit" class="primary">승인번호 발급</button></form><div id="issued-code" role="status"></div><h2>제출 내역</h2><div id="teacher-attempts"></div><div id="teacher-review"></div><h2>승인 학생</h2><div id="student-grants"></div></section>
</main><script src="./exams/app.js?v=launch-20261102"></script></body></html>
