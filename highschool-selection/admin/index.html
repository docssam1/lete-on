<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시험별 승인 관리 · 선발·누적 진단</title><link rel="stylesheet" href="../shared/app.css?v=20260824"></head>
<body>
  <a class="skip-link" href="#main">본문으로</a>
  <header class="site-header"><nav class="shell nav"><a class="brand" href="../"><span class="brand-mark">SL</span><span>승인 관리<small>ADMIN CONSOLE</small></span></a><div class="nav-links"><a class="button ghost" href="./exam-builder.html">시험지 편집</a><a class="button ghost" href="./review.html">문항 검수</a><a class="button accent" href="../library.html">학생 서재</a></div></nav></header>
  <main id="main" class="shell app-main"><div class="page-title"><div><p class="eyebrow">Per-exam Access</p><h1>학생별 시험 승인</h1><p>이메일을 사용하지 않습니다. 이름과 승인번호를 확인하고 학생마다 열어 줄 시험을 선택합니다.</p></div><span class="badge review" id="mode-badge">서버 확인 중</span></div>
    <div class="notice" id="admin-notice">운영에서는 관리자 세션과 서버 권한 검사를 거칩니다. 정적 코드에는 승인번호 원문을 저장하지 않습니다.</div>
    <section class="admin-grid" style="margin-top:16px"><form class="panel stack" id="grant-form"><div class="field"><label for="student-name">학생 이름</label><input id="student-name" required></div><div class="field"><label for="approval-code">승인번호</label><input id="approval-code" required autocomplete="off"></div><div class="field"><label for="expires-at">만료일(선택)</label><input id="expires-at" type="date"></div><div><p class="eyebrow">허용 시험</p><div class="check-list" id="exam-choices"></div></div><button class="accent" id="save-grant" type="submit">신규 승인 저장</button><button class="ghost" type="button" id="cancel-edit" hidden>수정 취소</button><button class="ghost" type="button" id="make-code">승인번호 만들기</button><p class="status" id="form-status" aria-live="polite"></p></form>
      <section class="panel"><div class="section-head" style="margin-bottom:10px"><div><p class="eyebrow">Access Grants</p><h2 style="margin:0">승인 목록</h2></div><button class="ghost" id="reload">새로고침</button></div><div style="overflow:auto"><table class="data-table"><thead><tr><th>학생</th><th>승인번호</th><th>허용 시험</th><th>만료</th><th></th></tr></thead><tbody id="grant-rows"></tbody></table></div><div class="empty" id="empty" hidden>저장된 승인이 없습니다.</div></section>
    </section>
  </main>
  <footer class="footer"><div class="shell"><span>GFIELD 운영자 전용</span><span>시험별 승인 · 원문 코드 비저장</span></div></footer>
