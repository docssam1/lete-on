<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">쌓기나무를 위, 앞, 오른쪽 옆에서 본 모양 유사문제 2</title>
  <desc id="desc">위에서 본 바닥 칸, 앞에서 본 기둥 높이, 오른쪽 옆에서 본 기둥 높이를 비교해 가장 적은 쌓기나무 개수를 구하는 문제입니다.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#333333" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="760" height="430" rx="24" fill="#ffffff"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#1a1a2e">세 방향에서 본 모양을 함께 살펴보세요</text>
  <text x="380" y="72" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#4f5965">가장 적게 필요한 쌓기나무는 몇 개일까요?</text>

  <rect x="28" y="94" width="220" height="280" rx="18" fill="#fafafa" stroke="#dedede" stroke-width="2" filter="url(#shadow)"/>
  <rect x="270" y="94" width="220" height="280" rx="18" fill="#fafafa" stroke="#dedede" stroke-width="2" filter="url(#shadow)"/>
  <rect x="512" y="94" width="220" height="280" rx="18" fill="#fafafa" stroke="#dedede" stroke-width="2" filter="url(#shadow)"/>

  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" font-weight="900" fill="#333333">
    <rect x="85" y="108" width="106" height="36" rx="18" fill="#ededed"/><text x="138" y="132" text-anchor="middle">위</text>
    <rect x="327" y="108" width="106" height="36" rx="18" fill="#ededed"/><text x="380" y="132" text-anchor="middle">앞</text>
    <rect x="557" y="108" width="130" height="36" rx="18" fill="#ededed"/><text x="622" y="132" text-anchor="middle">오른쪽 옆</text>
  </g>

  <g id="q09-top-view" fill="#f1f1f1" stroke="#565656" stroke-width="1.8">
      <rect data-view="top" data-x="0" data-y="0" x="75" y="273" width="42" height="42"/>
      <rect data-view="top" data-x="2" data-y="0" x="159" y="273" width="42" height="42"/>
      <rect data-view="top" data-x="0" data-y="1" x="75" y="231" width="42" height="42"/>
      <rect data-view="top" data-x="1" data-y="1" x="117" y="231" width="42" height="42"/>
  </g>
  <g id="q09-front-view" fill="#e4e4e4" stroke="#565656" stroke-width="1.8">
      <rect data-view="front" data-index="0" data-z="1" x="317" y="273" width="42" height="42"/>
      <rect data-view="front" data-index="0" data-z="2" x="317" y="231" width="42" height="42"/>
      <rect data-view="front" data-index="0" data-z="3" x="317" y="189" width="42" height="42"/>
      <rect data-view="front" data-index="1" data-z="1" x="359" y="273" width="42" height="42"/>
      <rect data-view="front" data-index="2" data-z="1" x="401" y="273" width="42" height="42"/>
      <rect data-view="front" data-index="2" data-z="2" x="401" y="231" width="42" height="42"/>
  </g>
  <g id="q09-right-view" fill="#d7d7d7" stroke="#565656" stroke-width="1.8">
      <rect data-view="right" data-index="0" data-z="1" x="580" y="273" width="42" height="42"/>
      <rect data-view="right" data-index="1" data-z="1" x="622" y="273" width="42" height="42"/>
      <rect data-view="right" data-index="1" data-z="2" x="622" y="231" width="42" height="42"/>
      <rect data-view="right" data-index="1" data-z="3" x="622" y="189" width="42" height="42"/>
  </g>

  <g stroke="#888888" stroke-width="2" stroke-linecap="round">
    <path d="M70 330H206"/>
    <path d="M312 330H448"/>
    <path d="M554 330H690"/>
  </g>
  <g transform="translate(138 326)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="800" fill="#666666">
    <path d="M0 0v18" stroke="#999999" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0 18l-5-8m5 8 5-8" fill="none" stroke="#666666" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="36" text-anchor="middle">앞쪽</text>
  </g>

  <rect x="178" y="394" width="404" height="26" rx="13" fill="#eeeeee"/>
  <text x="380" y="412" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#444444">위의 칸마다 앞과 옆의 높이를 함께 맞춰 보세요.</text>
</svg>
