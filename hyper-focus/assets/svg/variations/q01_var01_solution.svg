<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">q01_var01 위에서 본 답안</title>
  <desc id="desc">위에서 본 평면 모양의 각 칸에 그 자리에 쌓인 쌓기나무 수만 적은 답안입니다.</desc>
  <rect width="760" height="430" rx="24" fill="#fbfaf7"/>
  <text x="380" y="64" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="25" font-weight="900" fill="#25364a">위에서 본 모양</text>

  <!-- 뒤쪽 줄: y=2 -->
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="34" font-weight="900" text-anchor="middle" dominant-baseline="middle">
    <rect x="260" y="105" width="80" height="80" rx="5" fill="#fff" stroke="#31465d" stroke-width="2"/>
    <text x="300" y="145" fill="#17283a">1</text>
    <rect x="340" y="105" width="80" height="80" rx="5" fill="#fff" stroke="#31465d" stroke-width="2"/>
    <text x="380" y="145" fill="#17283a">1</text>

    <!-- 가운데 줄: y=1 -->
    <rect x="260" y="185" width="80" height="80" rx="5" fill="#fff" stroke="#31465d" stroke-width="2"/>
    <text x="300" y="225" fill="#17283a">2</text>
    <rect x="340" y="185" width="80" height="80" rx="5" fill="#fff" stroke="#31465d" stroke-width="2"/>
    <text x="380" y="225" fill="#17283a">1</text>
    <rect x="420" y="185" width="80" height="80" rx="5" fill="#fff" stroke="#31465d" stroke-width="2"/>
    <text x="460" y="225" fill="#17283a">1</text>

    <!-- 앞쪽 줄: y=0 -->
    <rect x="260" y="265" width="80" height="80" rx="5" fill="#fff" stroke="#31465d" stroke-width="2"/>
    <text x="300" y="305" fill="#17283a">1</text>
    <rect x="340" y="265" width="80" height="80" rx="5" fill="#fff" stroke="#31465d" stroke-width="2"/>
