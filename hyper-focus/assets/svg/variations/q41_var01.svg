<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
  <title id="title">도형 변환 버튼 규칙</title><desc id="desc">가 버튼은 네모와 별을 바꾸고, 나 버튼은 파랑과 주황을 바꾸며, 다 버튼은 삼각형 방향을 바꾼다</desc>
  <rect width="760" height="410" rx="18" fill="#fff" stroke="#cfd7e3" stroke-width="3"/>
  <text x="35" y="42" font-family="sans-serif" font-weight="700" font-size="22" fill="#18304d">버튼 규칙</text>
  <g font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="80" cy="105" r="28" fill="#e64d4d"/><text x="80" y="112" fill="#fff">가</text>
    <rect x="140" y="70" width="70" height="70" rx="8" fill="#4f7ee8" stroke="#26384d" stroke-width="3"/>
    <text x="245" y="112" fill="#53647a">↔</text>
    <polygon points="315,70 326,95 353,97 332,115 339,142 315,127 291,142 298,115 277,97 304,95" fill="#4f7ee8" stroke="#26384d" stroke-width="3"/>
    <text x="460" y="112" fill="#53647a">바깥 모양만 바뀜</text>

    <circle cx="80" cy="190" r="28" fill="#3b78c8"/><text x="80" y="197" fill="#fff">나</text>
    <rect x="140" y="155" width="70" height="70" rx="8" fill="#4f7ee8" stroke="#26384d" stroke-width="3"/>
    <text x="245" y="197" fill="#53647a">↔</text>
    <rect x="280" y="155" width="70" height="70" rx="8" fill="#ee9955" stroke="#26384d" stroke-width="3"/>
    <text x="460" y="197" fill="#53647a">바깥 색만 바뀜</text>

    <circle cx="80" cy="275" r="28" fill="#52ad72"/><text x="80" y="282" fill="#fff">다</text>
    <polygon points="175,240 205,300 145,300" fill="#f2cd45" stroke="#26384d" stroke-width="3"/>
    <text x="245" y="282" fill="#53647a">↔</text>
    <polygon points="315,310 345,250 285,250" fill="#f2cd45" stroke="#26384d" stroke-width="3"/>
    <text x="460" y="282" fill="#53647a">안쪽 방향만 바뀜</text>
  </g>
  <g transform="translate(70 325)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#4f7ee8" stroke="#26384d" stroke-width="3"/>
    <polygon points="30,10 48,48 12,48" fill="#f2cd45" stroke="#26384d" stroke-width="2"/>
    <text x="90" y="38" font-family="sans-serif" font-size="20" fill="#53647a">→ 가 → 나 →</text>
    <rect x="245" y="0" width="85" height="60" rx="6" fill="#fff" stroke="#8994a3" stroke-width="4"/>
    <text x="375" y="38" font-family="sans-serif" font-size="17" fill="#53647a">빈칸에 그리기</text>
  </g>
</svg>
