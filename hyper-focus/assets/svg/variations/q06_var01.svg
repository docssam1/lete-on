  <text x="380" y="40" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">여러 방향에서 볼 때 나타날 수 없는 모습을 고르세요</text>
