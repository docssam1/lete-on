  <title id="title">색 블록을 여러 방향에서 본 모습 유사문제 1</title>
  <desc id="desc">빨강 두 개, 노랑, 파랑, 보라 블록으로 된 한 층 입체와 다섯 보기입니다.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".14"/></filter></defs>
