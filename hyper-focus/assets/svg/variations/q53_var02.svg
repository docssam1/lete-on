<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">지우개와 클립으로 비교한 같은 길이</title>
  <desc id="desc">지우개 4개와 클립 7개를 합한 길이는 지우개 6개와 클립 3개를 합한 길이와 같습니다. 책상 가로 길이는 지우개 8개와 클립 6개를 합한 길이입니다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <g id="eraser">
      <rect x="2" y="5" width="46" height="28" rx="8" fill="#ffb49b" stroke="#9b3b2d" stroke-width="2"/>
      <path d="M34 6v26" stroke="#9b3b2d" stroke-width="2"/>
      <rect x="35" y="7" width="11" height="24" rx="5" fill="#ffe2d7"/>
    </g>
    <g id="clip">
      <path d="M18 7h15c9 0 14 5 14 13s-5 13-14 13H16C8 33 3 29 3 22s5-11 13-11h15c5 0 8 3 8 8s-3 8-8 8H17c-3 0-5-2-5-5s2-5 5-5h13" fill="none" stroke="#3178c6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="760" height="430" rx="24" fill="#f3f8ff"/>
  <circle cx="52" cy="48" r="24" fill="#dcecff"/>
  <path d="M42 48l7 7 15-16" fill="none" stroke="#245b9e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="56" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="25" font-weight="700" fill="#19375b">두 길이가 서로 같아요</text>

  <rect x="28" y="88" width="704" height="152" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <text x="205" y="116" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#55708f">왼쪽 길이</text>
  <text x="555" y="116" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#55708f">오른쪽 길이</text>

  <g transform="translate(55 142)">
    <use href="#eraser"/>
    <text x="58" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#19375b">× 4</text>
    <text x="119" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#7590ad">+</text>
    <g transform="translate(153 0)"><use href="#clip"/></g>
    <text x="210" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#19375b">× 7</text>
  </g>
  <circle cx="380" cy="162" r="25" fill="#245b9e"/>
  <text x="380" y="171" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">=</text>
  <g transform="translate(428 142)">
    <use href="#eraser"/>
    <text x="58" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#19375b">× 6</text>
    <text x="119" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#7590ad">+</text>
    <g transform="translate(153 0)"><use href="#clip"/></g>
    <text x="210" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#19375b">× 3</text>
  </g>
  <line x1="57" y1="205" x2="703" y2="205" stroke="#b9d1eb" stroke-width="4" stroke-linecap="round"/>
  <circle cx="57" cy="205" r="6" fill="#6fa4da"/>
  <circle cx="703" cy="205" r="6" fill="#6fa4da"/>

  <rect x="28" y="264" width="704" height="136" rx="20" fill="#e8f3ff" stroke="#b8d5f2" stroke-width="2"/>
  <text x="56" y="302" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="800" fill="#245b9e">책상 가로 길이</text>
  <g transform="translate(243 278)">
    <use href="#eraser"/>
    <text x="58" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#19375b">× 8</text>
    <text x="119" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#7590ad">+</text>
    <g transform="translate(153 0)"><use href="#clip"/></g>
    <text x="210" y="29" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#19375b">× 6</text>
  </g>
  <rect x="172" y="327" width="416" height="50" rx="25" fill="#ffffff"/>
  <text x="380" y="359" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="21" font-weight="800" fill="#19375b">지우개 몇 개의 길이일까요?</text>
</svg>
