  <title id="title">같은 쌓기나무를 앞과 뒤에서 본 모양</title>
  <desc id="desc">같은 쌓기나무 구조를 원본 문제와 같은 입체 시점으로 앞과 뒤에서 본 두 그림입니다.</desc>
