  <text x="380" y="72" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#697686">두 그림은 같은 모양입니다. 보이지 않는 곳까지 생각해 보세요.</text>
