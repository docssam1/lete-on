<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 330" role="img" aria-labelledby="title desc">
  <title id="title">이웃하지 않게 세 칸을 고르는 8칸 도형</title>
  <desc id="desc">가로 두 칸, 세로 네 칸인 직사각형 격자</desc>
  <rect width="260" height="330" fill="#fff"/>
  <g transform="translate(70 24)" fill="#fff" stroke="#26384d" stroke-width="3">
    <rect x="0" y="0" width="60" height="60"/><rect x="60" y="0" width="60" height="60"/>
    <rect x="0" y="60" width="60" height="60"/><rect x="60" y="60" width="60" height="60"/>
    <rect x="0" y="120" width="60" height="60"/><rect x="60" y="120" width="60" height="60"/>
    <rect x="0" y="180" width="60" height="60"/><rect x="60" y="180" width="60" height="60"/>
  </g>
  <text x="130" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#53647a">한 변이 붙으면 이웃한 칸</text>
</svg>
