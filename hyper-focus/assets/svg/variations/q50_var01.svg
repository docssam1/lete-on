    <g transform="translate(120 105)"><rect width="120" height="38" rx="8" fill="#edc27c" stroke="#7a5a35"/><rect x="120" width="120" height="38" rx="8" fill="#edc27c" stroke="#7a5a35"/><rect x="240" width="120" height="38" rx="8" fill="#edc27c" stroke="#7a5a35"/><rect x="360" width="120" height="38" rx="8" fill="#edc27c" stroke="#7a5a35"/><text x="60" y="25">연필</text><text x="180" y="25">연필</text><text x="300" y="25">연필</text><text x="420" y="25">연필</text></g>
    <g transform="translate(120 175)"><rect width="120" height="38" rx="8" fill="#edc27c" stroke="#7a5a35"/><rect x="120" width="120" height="38" rx="8" fill="#edc27c" stroke="#7a5a35"/><rect x="240" width="120" height="38" rx="8" fill="#edc27c" stroke="#7a5a35"/><rect x="360" width="60" height="38" rx="5" fill="#f29a65" stroke="#7a5a35"/><rect x="420" width="60" height="38" rx="5" fill="#f29a65" stroke="#7a5a35"/><text x="60" y="25">연필</text><text x="180" y="25">연필</text><text x="300" y="25">연필</text><text x="390" y="25">지우개</text><text x="450" y="25">지우개</text></g>
    <g transform="translate(120 245)"><rect width="160" height="45" rx="20" fill="#ef9f4f" stroke="#7a5a35"/><rect x="160" width="80" height="32" y="6" rx="16" fill="none" stroke="#64748b" stroke-width="5"/><rect x="240" width="80" height="32" y="6" rx="16" fill="none" stroke="#64748b" stroke-width="5"/><rect x="320" width="80" height="32" y="6" rx="16" fill="none" stroke="#64748b" stroke-width="5"/><rect x="400" width="80" height="32" y="6" rx="16" fill="none" stroke="#64748b" stroke-width="5"/><text x="80" y="28">크레파스</text></g>
