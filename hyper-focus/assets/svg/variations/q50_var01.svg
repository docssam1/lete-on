  <title id="title">같은 전체 길이의 네 줄</title><desc id="desc">크레파스 세 개, 연필 네 개, 연필 세 개와 지우개 두 개, 크레파스 한 개와 클립 네 개가 각각 같은 길이</desc>
  <rect width="720" height="360" fill="#fff"/><g font-family="sans-serif" font-size="15" text-anchor="middle">
