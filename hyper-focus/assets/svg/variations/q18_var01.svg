<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">쌓기나무 세 개로 만들 수 있는 서로 다른 입체 세기</title><desc id="desc">서로 떨어진 쌓기나무 세 개가 있으며 모두 사용해 면끼리 붙이는 문제입니다.</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/><text x="380" y="43" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">쌓기나무 3개로 만들 수 있는 서로 다른 모양은?</text><text x="380" y="73" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">세 개를 모두 면끼리 붙이고, 돌려서 겹치면 같은 모양입니다.</text>
  <g stroke="#796446" stroke-width="2"><g transform="translate(180 155)"><path d="M0 38L58 5 116 38 58 71Z" fill="#efd09a"/><path d="M0 38L58 71V132L0 99Z" fill="#c99b5b"/><path d="M116 38L58 71V132L116 99Z" fill="#b47d3e"/></g><g transform="translate(322 155)"><path d="M0 38L58 5 116 38 58 71Z" fill="#efd09a"/><path d="M0 38L58 71V132L0 99Z" fill="#c99b5b"/><path d="M116 38L58 71V132L116 99Z" fill="#b47d3e"/></g><g transform="translate(464 155)"><path d="M0 38L58 5 116 38 58 71Z" fill="#efd09a"/><path d="M0 38L58 71V132L0 99Z" fill="#c99b5b"/><path d="M116 38L58 71V132L116 99Z" fill="#b47d3e"/></g></g>
  <rect x="195" y="355" width="370" height="34" rx="17" fill="#f5efe5"/><text x="380" y="378" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="800" fill="#5a4935">일자로 붙이기와 꺾어 붙이기부터 생각해 보세요.</text>
</svg>
