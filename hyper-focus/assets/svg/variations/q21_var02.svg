<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">자리 조건을 만족하는 네 자리 수 유사문제 2</title>
  <desc id="desc">천의 자리와 일의 자리를 고정하고 백의 자리와 십의 자리의 차와 전체 숫자 합을 알려 주는 네 조건입니다.</desc>
  <rect width="760" height="440" rx="24" fill="#fff"/>
  <text x="380" y="46" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="25" font-weight="800" fill="#20272b">조건을 모두 만족하는 네 자리 수를 완성하세요</text>
  <g transform="translate(78 80)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <rect width="604" height="300" rx="16" fill="#f8fafc" stroke="#9aa8b8" stroke-width="2"/>
    <circle cx="40" cy="48" r="7" fill="#173657"/><text x="64" y="57" font-size="24" font-weight="750" fill="#283640">천의 자리 숫자는 2입니다.</text>
    <circle cx="40" cy="110" r="7" fill="#173657"/><text x="64" y="119" font-size="24" font-weight="750" fill="#283640">일의 자리 숫자는 8입니다.</text>
    <circle cx="40" cy="172" r="7" fill="#173657"/><text x="64" y="181" font-size="24" font-weight="750" fill="#283640">백의 자리 숫자는 십의 자리보다 3 큽니다.</text>
    <circle cx="40" cy="234" r="7" fill="#173657"/><text x="64" y="243" font-size="24" font-weight="750" fill="#283640">네 자리 숫자의 합은 21입니다.</text>
  </g>
  <rect x="208" y="397" width="344" height="30" rx="15" fill="#fff8e8" stroke="#dfc47c"/>
  <text x="380" y="418" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="800" fill="#725718">먼저 알 수 있는 두 자리를 적어 보세요.</text>
</svg>
