<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">과녁을 세 번 맞혀 서로 다른 총점 세기 유사문제 1</title>
  <desc id="desc">바깥부터 1점, 2점, 3점, 4점인 네 구역 과녁입니다.</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/>
  <text x="380" y="43" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">과녁을 3번 모두 맞혔을 때 나오는 총점을 세어 보세요</text>
  <text x="380" y="73" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">서로 다른 총점은 모두 몇 가지일까요?</text>
  <g transform="translate(380 222)" stroke="#4b5358" stroke-width="2"><circle r="135" fill="#f4efe8"/><circle r="102" fill="#dbe8ed"/><circle r="69" fill="#f4d6bd"/><circle r="36" fill="#d9b5c6"/></g>
  <g text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="900" fill="#263238"><text x="380" y="229">4</text><text x="380" y="176">3</text><text x="380" y="143">2</text><text x="380" y="110">1</text></g>
  <rect x="226" y="380" width="308" height="28" rx="14" fill="#f0eeeb"/><text x="380" y="400" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#4d555a">맞힌 순서가 달라도 총점이 같으면 한 가지입니다.</text>
</svg>
