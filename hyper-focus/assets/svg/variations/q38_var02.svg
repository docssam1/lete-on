<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">원형 배열에서 바라보는 방향 유사문제 2</title>
  <desc id="desc">도윤을 포함한 12명이 원의 가운데를 보고 앉아 있습니다. 도윤의 왼쪽과 오른쪽 방향을 서로 다른 화살표로 표시했습니다.</desc>
  <defs>
    <marker id="leftArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#c38d16"/></marker>
    <marker id="rightArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2c6fa3"/></marker>
  </defs>
  <rect width="760" height="510" rx="24" fill="#fff"/>
  <text x="380" y="38" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="800" fill="#20272b">12명이 모두 원의 가운데를 보고 앉아 있습니다</text>
  <text x="380" y="67" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">도윤의 오른쪽 3번째 사람과 마주 보는 자리를 찾으세요.</text>
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="850" text-anchor="middle">
    <path d="M400 105 H475" fill="none" stroke="#c38d16" stroke-width="5" marker-end="url(#leftArrow)"/><text x="535" y="111" font-size="15" fill="#725718">도윤의 왼쪽</text>
    <path d="M360 105 H285" fill="none" stroke="#2c6fa3" stroke-width="5" marker-end="url(#rightArrow)"/><text x="220" y="111" font-size="15" fill="#24557c">도윤의 오른쪽</text>
    <circle cx="380" cy="305" r="112" fill="#f1f3f4" stroke="#59656e" stroke-width="3"/><text x="380" y="312" font-size="18" fill="#66717a">가운데</text>
    <g fill="#fff" stroke="#68747d" stroke-width="2"><circle cx="462" cy="162" r="19"/><circle cx="523" cy="223" r="19"/><circle cx="545" cy="305" r="19"/><circle cx="523" cy="387" r="19"/><circle cx="462" cy="448" r="19"/><circle cx="380" cy="470" r="19"/><circle cx="298" cy="448" r="19"/><circle cx="237" cy="387" r="19"/><circle cx="215" cy="305" r="19"/><circle cx="237" cy="223" r="19"/><circle cx="298" cy="162" r="19"/></g>
    <circle cx="380" cy="140" r="30" fill="#173657"/><text x="380" y="147" font-size="19" fill="#fff">도윤</text>
  </g>
  <text x="380" y="502" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#725718">맞은편은 전체 자리 수의 절반만큼 떨어진 자리입니다.</text>
</svg>
