<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">시계 종이 울리는 횟수 구하기 유사문제 1</title>
  <desc id="desc">2시부터 5시까지, 시작 시각의 종은 제외하고 정각과 30분 종을 세는 문제입니다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#65736d"/></marker></defs>
  <rect width="760" height="430" rx="24" fill="#fff"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">2시부터 5시까지 시계 종은 몇 번 울릴까요?</text>
  <text x="380" y="72" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">시작인 2시 종은 세지 않고, 30분에는 한 번씩 울립니다.</text>
  <g transform="translate(98 116)"><circle cx="80" cy="80" r="72" fill="#fffaf0" stroke="#56635e" stroke-width="3"/><g stroke="#56635e" stroke-width="3" stroke-linecap="round"><path d="M80 18V29M80 131V142M18 80H29M131 80H142"/><path d="M80 80V38M80 80L116 59" stroke-width="5"/></g><circle cx="80" cy="80" r="6" fill="#56635e"/><text x="80" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="900">2:00 시작</text><text x="80" y="202" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#a6534b">시작 종 제외</text></g>
  <path d="M282 196H477" stroke="#65736d" stroke-width="4" marker-end="url(#a)"/>
  <g transform="translate(502 116)"><circle cx="80" cy="80" r="72" fill="#f0f7f4" stroke="#56635e" stroke-width="3"/><g stroke="#56635e" stroke-width="3" stroke-linecap="round"><path d="M80 18V29M80 131V142M18 80H29M131 80H142"/><path d="M80 80V38M80 80L46 101" stroke-width="5"/></g><circle cx="80" cy="80" r="6" fill="#56635e"/><text x="80" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="900">5:00 끝</text><text x="80" y="202" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#3d7664">끝 종 포함</text></g>
  <g transform="translate(245 285)" font-family="Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle"><path d="M0 28H270" stroke="#aeb7b3" stroke-width="3"/><g fill="#fff" stroke="#65736d" stroke-width="2"><circle cx="0" cy="28" r="7"/><circle cx="54" cy="28" r="5"/><circle cx="108" cy="28" r="7"/><circle cx="162" cy="28" r="5"/><circle cx="216" cy="28" r="7"/><circle cx="270" cy="28" r="5"/></g><g fill="#3d4743"><text x="0" y="60">2시</text><text x="54" y="12">2:30</text><text x="108" y="60">3시</text><text x="162" y="12">3:30</text><text x="216" y="60">4시</text><text x="270" y="12">4:30</text></g></g>
  <rect x="190" y="382" width="380" height="29" rx="15" fill="#f0eeeb"/><text x="380" y="402" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#4d555a">정각 종과 30분 종을 따로 센 다음 더하세요.</text>
</svg>
