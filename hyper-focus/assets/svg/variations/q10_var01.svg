<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">겹친 색종이 영역의 수 구하기 유사문제 1</title><desc id="desc">3이 적힌 왼쪽 직사각형과 5가 적힌 오른쪽 직사각형이 겹치며 겹친 곳에 별표가 있습니다.</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/><text x="380" y="43" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">겹친 부분에는 어떤 수가 들어갈까요?</text><text x="380" y="73" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">겹친 부분의 수는 양쪽에 적힌 수를 더한 값입니다.</text>
  <g transform="translate(145 125)" font-family="Arial,sans-serif" font-weight="900" text-anchor="middle"><rect width="310" height="210" rx="10" fill="#f4c9c1" fill-opacity=".72" stroke="#b96d60" stroke-width="3"/><rect x="160" width="310" height="210" rx="10" fill="#bbd8ec" fill-opacity=".72" stroke="#5c91b5" stroke-width="3"/><text x="78" y="120" font-size="42" fill="#813e35">3</text><text x="392" y="120" font-size="42" fill="#346a8e">5</text><text x="235" y="125" font-size="54" fill="#333">★</text></g>
  <rect x="210" y="375" width="340" height="30" rx="15" fill="#f0eeeb"/><text x="380" y="396" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#4d555a">왼쪽 수와 오른쪽 수를 더하세요.</text>
</svg>
