<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">보이지 않는 쌓기나무 개수 유사문제 2</title>
  <desc id="desc">전체 쌓기나무 14개 중 그림에 보이는 쌓기나무를 세어 숨은 개수를 구하는 문제입니다.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#333333" flood-opacity="0.12"/>
    </filter>
    <g id="cube" stroke="#5b5b5b" stroke-width="1.25" stroke-linejoin="round">
      <polygon points="0,-18 32,0 0,18 -32,0" fill="#f6f6f6"/>
      <polygon points="-32,0 0,18 0,54 -32,36" fill="#dddddd"/>
      <polygon points="32,0 0,18 0,54 32,36" fill="#c4c4c4"/>
    </g>
  </defs>

  <rect width="760" height="430" rx="24" fill="#ffffff"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#1a1a2e">그림 뒤에 숨어 있는 쌓기나무를 찾아요</text>
  <text x="380" y="72" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#4f5965">그림에서 보이지 않는 쌓기나무는 몇 개일까요?</text>

  <rect x="78" y="91" width="604" height="286" rx="20" fill="#fafafa" stroke="#dedede" stroke-width="2" filter="url(#shadow)"/>

  <g id="q05-visible-cubes">
    <use href="#cube" data-x="1" data-y="2" data-z="1" transform="translate(346 232)"/>
    <use href="#cube" data-x="3" data-y="1" data-z="1" transform="translate(378 286)"/>
    <use href="#cube" data-x="0" data-y="0" data-z="1" transform="translate(250 250)"/>
    <use href="#cube" data-x="0" data-y="0" data-z="2" transform="translate(250 214)"/>
    <use href="#cube" data-x="0" data-y="0" data-z="3" transform="translate(250 178)"/>
    <use href="#cube" data-x="1" data-y="0" data-z="1" transform="translate(282 268)"/>
    <use href="#cube" data-x="1" data-y="0" data-z="2" transform="translate(282 232)"/>
    <use href="#cube" data-x="1" data-y="0" data-z="3" transform="translate(282 196)"/>
    <use href="#cube" data-x="2" data-y="0" data-z="1" transform="translate(314 286)"/>
    <use href="#cube" data-x="2" data-y="0" data-z="2" transform="translate(314 250)"/>
    <use href="#cube" data-x="3" data-y="0" data-z="1" transform="translate(346 304)"/>
  </g>

  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <rect x="523" y="125" width="128" height="50" rx="25" fill="#eeeeee" stroke="#d3d3d3"/>
    <text x="587" y="157" text-anchor="middle" font-size="21" font-weight="900" fill="#262626">전체 14개</text>

    <rect x="523" y="194" width="128" height="92" rx="16" fill="#ffffff" stroke="#c8c8c8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="587" y="232" text-anchor="middle" font-size="32" font-weight="900" fill="#9a9a9a">?</text>
    <text x="587" y="261" text-anchor="middle" font-size="14" font-weight="800" fill="#686868">숨어 있는 개수</text>
  </g>

  <g transform="translate(151 335)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <path d="M0 0h90" stroke="#8e8e8e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 0l13-7m-13 7 13 7" fill="none" stroke="#555555" stroke-width="2.5" stroke-linecap="round"/>
    <text x="45" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#555555">앞쪽</text>
  </g>

  <rect x="191" y="394" width="378" height="26" rx="13" fill="#eeeeee"/>
  <text x="380" y="412" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#444444">전체 개수에서 그림에 보이는 개수를 빼 보세요.</text>
</svg>
