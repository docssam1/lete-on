<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">보이지 않는 쌓기나무 개수 유사문제 2</title>
  <desc id="desc">전체 쌓기나무 14개 중 앞쪽에서 실제로 보이는 11개만 그려 숨은 개수를 구하는 문제입니다.</desc>
  <defs>
    <g id="cube" stroke="#6f6559" stroke-width="1.3" stroke-linejoin="round">
      <polygon points="0,-33.12 23,-22.08 0,-11.04 -23,-22.08" fill="#eee2cf"/>
      <polygon points="-23,-22.08 0,-11.04 0,22.08 -23,11.04" fill="#d9c6aa"/>
      <polygon points="23,-22.08 0,-11.04 0,22.08 23,11.04" fill="#c5aa84"/>
    </g>
  </defs>
  <rect width="760" height="430" rx="24" fill="#fff"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#1a1a2e">그림 뒤에 숨어 있는 쌓기나무를 찾아요</text>
  <text x="380" y="72" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#4f5965">그림에서 보이지 않는 쌓기나무는 몇 개일까요?</text>
  <rect x="78" y="91" width="604" height="286" rx="20" fill="#fafafa" stroke="#dedede" stroke-width="2"/>
  <g id="q05-visible-cubes">
    <use href="#cube" transform="translate(361 344.16)"/><use href="#cube" transform="translate(384 333.12)"/><use href="#cube" transform="translate(292 333.12)"/>
    <use href="#cube" transform="translate(361 322.08)"/><use href="#cube" transform="translate(361 288.96)"/>
    <use href="#cube" transform="translate(338 311.04)"/><use href="#cube" transform="translate(338 277.92)"/><use href="#cube" transform="translate(338 244.8)"/>
    <use href="#cube" transform="translate(315 300)"/><use href="#cube" transform="translate(315 266.88)"/><use href="#cube" transform="translate(315 233.76)"/>
  </g>
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <rect x="523" y="125" width="128" height="50" rx="25" fill="#eee" stroke="#d3d3d3"/><text x="587" y="157" text-anchor="middle" font-size="21" font-weight="900" fill="#262626">전체 14개</text>
    <rect x="523" y="194" width="128" height="92" rx="16" fill="#fff" stroke="#c8c8c8" stroke-width="2" stroke-dasharray="7 5"/><text x="587" y="232" text-anchor="middle" font-size="32" font-weight="900" fill="#9a9a9a">?</text><text x="587" y="261" text-anchor="middle" font-size="14" font-weight="800" fill="#686868">숨어 있는 개수</text>
  </g>
  <g transform="translate(151 335)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif"><path d="M0 0h90" stroke="#8e8e8e" stroke-width="2.5" stroke-linecap="round"/><path d="M0 0l13-7m-13 7 13 7" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/><text x="45" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#555">앞쪽</text></g>
  <rect x="191" y="394" width="378" height="26" rx="13" fill="#eee"/><text x="380" y="412" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#444">전체 개수에서 그림에 보이는 개수를 빼 보세요.</text>
</svg>