<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">기울어진 정사각형까지 모두 세기 유사문제 2</title><desc id="desc">3칸 곱하기 2칸 격자의 왼쪽 두 칸 영역에 기울어진 정사각형이 그려져 있습니다.</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/><text x="380" y="43" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">크고 작은 정사각형을 모두 찾아보세요</text><text x="380" y="73" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">오른쪽의 큰 정사각형과 왼쪽의 기울어진 정사각형도 확인하세요.</text>
  <g transform="translate(170 120)" fill="none" stroke="#434d52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect width="420" height="280"/><path d="M140 0V280M280 0V280M0 140H420" stroke="#8a9498" stroke-width="2"/><path d="M140 0L280 140 140 280 0 140Z" stroke="#4f7f93" stroke-width="3.5"/></g>
  <rect x="205" y="400" width="350" height="24" rx="12" fill="#f0eeeb"/><text x="380" y="418" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="800" fill="#4d555a">한 칸짜리 → 큰 것 → 기울어진 것 순서로 세어 보세요.</text>
</svg>
