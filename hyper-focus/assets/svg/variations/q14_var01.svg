<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">복합 도형을 최소 정사각형으로 나누기 유사문제 1</title>
  <desc id="desc">위쪽 너비 네 칸, 아래쪽 너비 여섯 칸인 ㄱ자형 격자 도형입니다.</desc>
  <defs><clipPath id="c"><path d="M0 0H176V176H264V264H0Z"/></clipPath><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".12"/></filter></defs>
  <rect width="760" height="430" rx="24" fill="#fff"/>
  <text x="380" y="43" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">가장 적은 수의 정사각형으로 나누세요</text>
  <text x="380" y="73" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">정사각형은 서로 같은 크기가 아니어도 됩니다.</text>
  <g transform="translate(248 103)" filter="url(#s)"><path d="M0 0H176V176H264V264H0Z" fill="#fffdf8" stroke="#39444a" stroke-width="3"/><g clip-path="url(#c)" stroke="#aeb5b8" stroke-width="1.3" stroke-dasharray="4 4"><path d="M44 0V264M88 0V264M132 0V264M176 0V264M220 0V264M0 44H264M0 88H264M0 132H264M0 176H264M0 220H264"/></g></g>
  <rect x="191" y="388" width="378" height="27" rx="14" fill="#f0eeeb"/>
  <text x="380" y="407" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#4d555a">가장 큰 정사각형을 먼저 찾고 남은 부분을 살펴보세요.</text>
</svg>
