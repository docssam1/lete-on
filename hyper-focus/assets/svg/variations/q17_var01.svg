<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">기울어진 정사각형까지 모두 세기 유사문제 1</title><desc id="desc">2칸 곱하기 2칸 격자 안에 마름모처럼 기울어진 정사각형이 그려져 있습니다.</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/><text x="380" y="43" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">크고 작은 정사각형을 모두 찾아보세요</text><text x="380" y="73" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">비스듬하게 기울어진 정사각형도 빠뜨리지 마세요.</text>
  <g transform="translate(240 100)" fill="none" stroke="#434d52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect width="280" height="280"/><path d="M140 0V280M0 140H280" stroke="#8a9498" stroke-width="2"/><path d="M140 0L280 140 140 280 0 140Z" stroke="#4f7f93" stroke-width="3.5"/></g>
  <rect x="205" y="393" width="350" height="26" rx="13" fill="#f0eeeb"/><text x="380" y="412" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#4d555a">크기와 방향별로 나누어 세면 빠뜨리지 않습니다.</text>
</svg>
