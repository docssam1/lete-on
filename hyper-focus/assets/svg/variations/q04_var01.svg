  <rect x="205" y="394" width="350" height="26" rx="13" fill="#fff1f1"/>
  <text x="380" y="412" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#a33b3b">겹치는 구멍은 한 번만 세어요.</text>
