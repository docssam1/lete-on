<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">반대편까지 구멍이 뚫린 쌓기나무 유사문제 1</title>
  <desc id="desc">앞면과 윗면의 검은 칸에서 반대편까지 관통하도록 쌓기나무를 뺀 직육면체입니다.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#333333" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="760" height="430" rx="24" fill="#ffffff"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#1a1a2e">검은 칸에서 반대편까지 구멍을 뚫었어요</text>
  <text x="380" y="72" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#4f5965">남아 있는 쌓기나무는 모두 몇 개일까요?</text>

  <rect x="74" y="88" width="612" height="292" rx="20" fill="#fafafa" stroke="#dedede" stroke-width="2" filter="url(#shadow)"/>

  <g id="q04-prism-faces">
    <polygon points="180,158 370,158 442,94 252,94" fill="#f5f5f5"/>
    <rect x="180" y="158" width="190" height="190" fill="#ffffff"/>
    <polygon points="370,158 442,94 442,284 370,348" fill="#e9e9e9"/>
  </g>

  <g id="q04-top-holes">
    <polygon data-x="2" data-y="2" points="236,142 274,142 292,126 254,126" fill="#202020" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 3"/>
    <polygon data-x="4" data-y="3" points="330,126 368,126 386,110 348,110" fill="#202020" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <g id="q04-front-holes">
