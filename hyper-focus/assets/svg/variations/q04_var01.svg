    <rect data-x="2" data-z="4" x="218" y="272" width="38" height="38" fill="#202020" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 3"/>
    <rect data-x="4" data-z="2" x="294" y="196" width="38" height="38" fill="#202020" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 3"/>
    <rect data-x="4" data-z="4" x="294" y="272" width="38" height="38" fill="#202020" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 3"/>
  </g>

