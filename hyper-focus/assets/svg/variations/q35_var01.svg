<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">달리기 순서 추론 유사문제 1</title>
  <desc id="desc">윤아, 도윤, 서준, 하린, 민재의 앞뒤와 바로 뒤 조건 세 가지가 적혀 있고 1등부터 5등까지 빈자리가 있습니다.</desc>
  <rect width="760" height="470" rx="24" fill="#fff"/>
  <text x="380" y="42" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">조건을 보고 달리기 순서를 정하세요</text>
  <text x="380" y="71" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#59636a">4등으로 달리고 있는 사람은 누구일까요?</text>
  <g transform="translate(90 98)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <rect width="580" height="205" rx="18" fill="#f8fafc" stroke="#9aa8b8" stroke-width="2"/>
    <circle cx="35" cy="47" r="7" fill="#173657"/><text x="57" y="55" font-size="21" font-weight="750" fill="#283640">하린은 윤아보다 뒤, 민재보다 앞입니다.</text>
    <circle cx="35" cy="103" r="7" fill="#173657"/><text x="57" y="111" font-size="21" font-weight="750" fill="#283640">민재의 앞과 뒤에는 같은 수의 사람이 있습니다.</text>
    <circle cx="35" cy="159" r="7" fill="#173657"/><text x="57" y="167" font-size="21" font-weight="750" fill="#283640">서준 바로 뒤에는 도윤이 달리고 있습니다.</text>
  </g>
  <g transform="translate(95 350)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" text-anchor="middle">
    <path d="M20 40 H550" stroke="#aab3bc" stroke-width="4"/><path d="M550 40 l-16 -9 v18 z" fill="#173657"/>
    <text x="18" y="15" font-size="15" font-weight="800" fill="#173657">앞</text><text x="552" y="15" font-size="15" font-weight="800" fill="#173657">뒤</text>
    <g font-size="17" font-weight="800" fill="#263238">
      <circle cx="60" cy="40" r="27" fill="#fff" stroke="#67747e" stroke-width="2"/><text x="60" y="46">1등</text>
      <circle cx="165" cy="40" r="27" fill="#fff" stroke="#67747e" stroke-width="2"/><text x="165" y="46">2등</text>
      <circle cx="270" cy="40" r="27" fill="#fff" stroke="#67747e" stroke-width="2"/><text x="270" y="46">3등</text>
      <circle cx="375" cy="40" r="27" fill="#fff8e8" stroke="#c9a227" stroke-width="3"/><text x="375" y="46">4등</text>
      <circle cx="480" cy="40" r="27" fill="#fff" stroke="#67747e" stroke-width="2"/><text x="480" y="46">5등</text>
    </g>
  </g>
  <text x="380" y="450" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#725718">앞뒤 사람 수가 같은 사람부터 가운데에 놓아 보세요.</text>
</svg>
