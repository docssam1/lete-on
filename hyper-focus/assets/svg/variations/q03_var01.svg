<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">흑백이 교차로 쌓인 쌓기나무 유사문제 1</title>
  <desc id="desc">같은 색의 면이 맞닿지 않도록 흰색과 검은색 쌓기나무 16개가 아래부터 빈틈없이 쌓여 있습니다.</desc>
  <defs>
    <g id="cube-white" stroke="#555" stroke-width="1.3" stroke-linejoin="round">
      <polygon points="0,-33.12 23,-22.08 0,-11.04 -23,-22.08" fill="#fff"/>
      <polygon points="-23,-22.08 0,-11.04 0,22.08 -23,11.04" fill="#f1f1f1"/>
      <polygon points="23,-22.08 0,-11.04 0,22.08 23,11.04" fill="#dedede"/>
    </g>
    <g id="cube-black" stroke="#444" stroke-width="1.3" stroke-linejoin="round">
      <polygon points="0,-33.12 23,-22.08 0,-11.04 -23,-22.08" fill="#666"/>
      <polygon points="-23,-22.08 0,-11.04 0,22.08 -23,11.04" fill="#505050"/>
      <polygon points="23,-22.08 0,-11.04 0,22.08 23,11.04" fill="#383838"/>
    </g>
  </defs>
  <rect width="760" height="430" rx="24" fill="#fff"/>
  <text x="380" y="43" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="800" fill="#1a1a2e">같은 색끼리 만나지 않게 쌓았어요</text>
  <text x="380" y="73" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#4f5965">흰색과 검은색 쌓기나무는 각각 몇 개일까요?</text>
  <rect x="84" y="96" width="592" height="284" rx="20" fill="#fafafa" stroke="#dedede" stroke-width="2"/>
  <g id="q03-checker-cubes">
    <use href="#cube-black" transform="translate(383 333.12)"/><use href="#cube-black" transform="translate(337 333.12)"/>
    <use href="#cube-white" transform="translate(406 322.08)"/><use href="#cube-white" transform="translate(360 322.08)"/><use href="#cube-white" transform="translate(314 322.08)"/>
    <use href="#cube-black" transform="translate(406 288.96)"/><use href="#cube-black" transform="translate(360 288.96)"/>
    <use href="#cube-black" transform="translate(383 311.04)"/><use href="#cube-black" transform="translate(337 311.04)"/>
    <use href="#cube-white" transform="translate(383 277.92)"/><use href="#cube-white" transform="translate(337 277.92)"/>
    <use href="#cube-black" transform="translate(383 244.8)"/><use href="#cube-black" transform="translate(337 244.8)"/>
    <use href="#cube-white" transform="translate(360 300)"/><use href="#cube-black" transform="translate(360 266.88)"/><use href="#cube-white" transform="translate(360 233.76)"/>
  </g>
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="800" fill="#343434">
    <rect x="548" y="128" width="26" height="26" rx="4" fill="#fff" stroke="#555"/><text x="586" y="147">흰색</text>
    <rect x="548" y="168" width="26" height="26" rx="4" fill="#555" stroke="#444"/><text x="586" y="187">검은색</text>
  </g>
  <rect x="207" y="394" width="346" height="26" rx="13" fill="#eee"/>
  <text x="380" y="412" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#444">한 기둥씩 아래에서 위로 색을 번갈아 살펴보세요.</text>
</svg>