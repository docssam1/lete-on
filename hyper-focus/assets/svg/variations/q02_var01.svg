<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">상자를 채우고 있는 쌓기나무</title>
  <desc id="desc">가로 3칸, 세로 3칸, 높이 3칸인 점선 상자 안에 아홉 개의 쌓기나무가 아래부터 연속으로 쌓여 있습니다.</desc>
  <defs>
    <g id="cube" stroke="#6d6d6d" stroke-width="1" stroke-linejoin="round">
      <polygon points="0,-20 17.4,-10 0,0 -17.4,-10" fill="#ececec"/>
      <polygon points="-17.4,10 0,20 0,0 -17.4,-10" fill="#d4d4d4"/>
      <polygon points="17.4,10 0,20 0,0 17.4,-10" fill="#bcbcbc"/>
    </g>
  </defs>

  <rect width="760" height="430" rx="24" fill="#ffffff"/>
  <text x="380" y="47" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="25" font-weight="800" fill="#1a1a2e">상자를 가득 채워 보세요</text>
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#3f4b59">
    <rect x="204" y="64" width="104" height="34" rx="17" fill="#f2f2f2" stroke="#d6d6d6"/>
    <text x="256" y="86" text-anchor="middle">가로 3칸</text>
    <rect x="328" y="64" width="104" height="34" rx="17" fill="#f2f2f2" stroke="#d6d6d6"/>
    <text x="380" y="86" text-anchor="middle">세로 3칸</text>
    <rect x="452" y="64" width="104" height="34" rx="17" fill="#f2f2f2" stroke="#d6d6d6"/>
    <text x="504" y="86" text-anchor="middle">높이 3칸</text>
  </g>

  <rect x="88" y="116" width="584" height="238" rx="18" fill="#fafafa" stroke="#e1e1e1" stroke-width="2"/>
  <g transform="translate(380 232) scale(2.35)">
    <g id="q02-filled-cubes">
      <use href="#cube" transform="translate(0 0)"/>
      <use href="#cube" transform="translate(0 -20)"/>
      <use href="#cube" transform="translate(0 -40)"/>
      <use href="#cube" transform="translate(17.4 10)"/>
      <use href="#cube" transform="translate(17.4 -10)"/>
      <use href="#cube" transform="translate(34.8 20)"/>
      <use href="#cube" transform="translate(-17.4 10)"/>
      <use href="#cube" transform="translate(-17.4 -10)"/>
      <use href="#cube" transform="translate(-34.8 20)"/>
    </g>
    <g id="q02-container" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round">
      <path d="M0 0 52.2 30 0 60 -52.2 30Z"/>
      <path d="M0-60 52.2-30 0 0 -52.2-30Z"/>
      <path d="M0 0V-60M52.2 30V-30M-52.2 30V-30M0 60V0"/>
    </g>
  </g>

  <g transform="translate(488 132)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <line x1="0" y1="9" x2="40" y2="9" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="50" y="14" font-size="14" font-weight="700" fill="#666666">상자 테두리</text>
  </g>
  <rect x="172" y="374" width="416" height="42" rx="21" fill="#f0f4f8"/>
  <text x="380" y="401" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="800" fill="#26384a">몇 개를 더 넣어야 가득 찰까요?</text>
</svg>
