<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">줄선 사람 수의 최솟값과 최댓값 유사문제 2</title>
  <desc id="desc">지민은 앞에서 14번째, 지수는 뒤에서 9번째, 두 사람 사이에는 4명이 있다는 세 조건입니다.</desc>
  <rect width="760" height="390" rx="24" fill="#fff"/>
  <text x="380" y="44" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">줄선 사람 수의 최솟값과 최댓값을 구하세요</text>
  <text x="380" y="75" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">두 사람이 설 수 있는 두 가지 경우를 따로 생각합니다.</text>
  <g transform="translate(65 116)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" text-anchor="middle">
    <rect width="190" height="150" rx="18" fill="#f4f8fc" stroke="#9aa8b8" stroke-width="2"/>
    <text x="95" y="42" font-size="18" font-weight="800" fill="#173657">지민</text><text x="95" y="82" font-size="29" font-weight="900" fill="#263238">앞에서 14번째</text><text x="95" y="119" font-size="14" font-weight="700" fill="#59636a">앞쪽부터 셉니다</text>
    <rect x="220" width="190" height="150" rx="18" fill="#fff8e8" stroke="#d7b95f" stroke-width="2"/>
    <text x="315" y="42" font-size="18" font-weight="800" fill="#725718">두 사람 사이</text><text x="315" y="86" font-size="31" font-weight="900" fill="#263238">4명</text><text x="315" y="119" font-size="14" font-weight="700" fill="#725718">자리는 5칸 차이</text>
    <rect x="440" width="190" height="150" rx="18" fill="#f4f8fc" stroke="#9aa8b8" stroke-width="2"/>
    <text x="535" y="42" font-size="18" font-weight="800" fill="#173657">지수</text><text x="535" y="82" font-size="29" font-weight="900" fill="#263238">뒤에서 9번째</text><text x="535" y="119" font-size="14" font-weight="700" fill="#59636a">뒤쪽부터 셉니다</text>
  </g>
  <g transform="translate(120 313)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="800" fill="#263238">
    <text x="0" y="20">최솟값</text><rect x="70" width="110" height="34" fill="#fff" stroke="#68747d" stroke-width="2"/><text x="205" y="20">명</text>
    <text x="310" y="20">최댓값</text><rect x="380" width="110" height="34" fill="#fff" stroke="#68747d" stroke-width="2"/><text x="515" y="20">명</text>
  </g>
  <text x="380" y="374" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#725718">지수가 지민보다 앞인 경우와 뒤인 경우를 모두 그려 보세요.</text>
</svg>
