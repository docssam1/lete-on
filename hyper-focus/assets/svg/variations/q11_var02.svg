<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">숫자 종이를 두 번 접어 가장 윗면 수의 합 구하기 유사문제 2</title>
  <desc id="desc">4행 4열 숫자 종이의 위쪽 절반을 아래로 접고, 오른쪽 절반을 왼쪽으로 접는 과정을 나타냅니다.</desc>
  <defs>
    <marker id="fold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#a54b46"/>
    </marker>
    <marker id="step-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#8a9491"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#333333" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="760" height="430" rx="24" fill="#ffffff"/>
  <text x="380" y="41" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">그림과 같은 방법으로 종이를 두 번 접어 보세요</text>
  <text x="380" y="70" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">가장 윗면에 오는 네 수의 합을 구하세요.</text>

  <g id="q11-number-grid" transform="translate(52 112)" filter="url(#shadow)">
    <rect width="200" height="200" rx="3" fill="#fff9f7" stroke="#8a6d69" stroke-width="2.2"/>
    <g stroke="#b79b96" stroke-width="1.4">
      <path d="M50 0V200M100 0V200M150 0V200M0 50H200M0 100H200M0 150H200"/>
    </g>
    <path d="M0 100H200" stroke="#a54b46" stroke-width="2" stroke-dasharray="7 5"/>
    <g text-anchor="middle" dominant-baseline="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="800" fill="#293137">
      <text data-row="1" data-col="1" x="25" y="25">9</text><text data-row="1" data-col="2" x="75" y="25">7</text><text data-row="1" data-col="3" x="125" y="25">5</text><text data-row="1" data-col="4" x="175" y="25">3</text>
      <text data-row="2" data-col="1" x="25" y="75">10</text><text data-row="2" data-col="2" x="75" y="75">8</text><text data-row="2" data-col="3" x="125" y="75">6</text><text data-row="2" data-col="4" x="175" y="75">4</text>
      <text data-row="3" data-col="1" x="25" y="125">1</text><text data-row="3" data-col="2" x="75" y="125">11</text><text data-row="3" data-col="3" x="125" y="125">13</text><text data-row="3" data-col="4" x="175" y="125">15</text>
      <text data-row="4" data-col="1" x="25" y="175">2</text><text data-row="4" data-col="2" x="75" y="175">12</text><text data-row="4" data-col="3" x="125" y="175">14</text><text data-row="4" data-col="4" x="175" y="175">16</text>
    </g>
  </g>
  <path data-step="1" data-moving-side="top_to_bottom" d="M38 137C7 164 7 231 38 258" fill="none" stroke="#a54b46" stroke-width="4" stroke-linecap="round" marker-end="url(#fold-arrow)"/>
  <text x="151" y="335" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#78524e">① 위쪽을 아래로</text>

  <path d="M271 212H315" fill="none" stroke="#8a9491" stroke-width="4" stroke-linecap="round" marker-end="url(#step-arrow)"/>

  <g id="q11-first-fold" transform="translate(338 163)" filter="url(#shadow)">
    <rect x="5" y="6" width="200" height="100" rx="3" fill="#f3e6e2" stroke="#c9aaa4" stroke-width="1.6"/>
    <rect width="200" height="100" rx="3" fill="#fff9f7" stroke="#8a6d69" stroke-width="2.2"/>
    <path d="M100 0V100" stroke="#a54b46" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M0 50H200" stroke="#c7afa9" stroke-width="1.3"/>
  </g>
  <path data-step="2" data-moving-side="right_to_left" d="M493 150C467 113 412 113 385 150" fill="none" stroke="#a54b46" stroke-width="4" stroke-linecap="round" marker-end="url(#fold-arrow)"/>
  <text x="438" y="290" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#78524e">② 오른쪽을 왼쪽으로</text>

  <path d="M555 212H599" fill="none" stroke="#8a9491" stroke-width="4" stroke-linecap="round" marker-end="url(#step-arrow)"/>

  <g id="q11-final-fold" transform="translate(622 163)" filter="url(#shadow)">
    <rect x="6" y="8" width="100" height="100" rx="3" fill="#ead8d4" stroke="#c6a39c" stroke-width="1.5"/>
    <rect x="3" y="4" width="100" height="100" rx="3" fill="#f4e8e5" stroke="#c9aaa4" stroke-width="1.5"/>
    <rect width="100" height="100" rx="3" fill="#fff9f7" stroke="#8a6d69" stroke-width="2.2"/>
    <path d="M50 0V100M0 50H100" stroke="#b79b96" stroke-width="1.5"/>
    <g text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" font-weight="900" fill="#9b8a86">
      <text x="25" y="32">?</text><text x="75" y="32">?</text><text x="25" y="82">?</text><text x="75" y="82">?</text>
    </g>
  </g>
  <text x="672" y="290" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#59636a">가장 윗면</text>

  <rect x="191" y="383" width="378" height="29" rx="15" fill="#f0eeeb"/>
  <text x="380" y="403" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#4d555a">숫자 모양이 아니라 숫자가 든 네모 칸의 움직임을 따라가세요.</text>
</svg>
