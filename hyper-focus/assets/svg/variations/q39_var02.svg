<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">조건에 맞는 두 과일 찾기 유사문제 2</title>
  <desc id="desc">네 사람이 좋아하는 과일에 관한 다섯 조건과 비어 있는 사과, 배, 귤, 딸기 논리표입니다.</desc>
  <rect width="760" height="510" rx="24" fill="#fff"/>
  <text x="380" y="38" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="800" fill="#20272b">조건을 보고 B가 좋아하는 두 과일을 찾으세요</text>
  <g transform="translate(38 66)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" fill="#283640">
    <rect width="684" height="205" rx="16" fill="#f8fafc" stroke="#9aa8b8" stroke-width="2"/>
    <circle cx="24" cy="34" r="5" fill="#173657"/><text x="41" y="40" font-size="17" font-weight="750">사과를 좋아하는 사람은 2명입니다.</text>
    <circle cx="24" cy="72" r="5" fill="#173657"/><text x="41" y="78" font-size="17" font-weight="750">배를 좋아하는 사람은 3명, 귤은 2명입니다.</text>
    <circle cx="24" cy="110" r="5" fill="#173657"/><text x="41" y="116" font-size="17" font-weight="750">딸기는 C만 좋아합니다.</text>
    <circle cx="24" cy="148" r="5" fill="#173657"/><text x="41" y="154" font-size="17" font-weight="750">A는 사과와 귤, B는 사과를 좋아합니다.</text>
    <circle cx="24" cy="186" r="5" fill="#173657"/><text x="41" y="192" font-size="17" font-weight="750">D는 배와 귤을 좋아합니다.</text>
  </g>
  <g transform="translate(170 301)" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" text-anchor="middle">
    <rect width="420" height="170" fill="#fff" stroke="#65727c" stroke-width="2"/>
    <g stroke="#aeb6bd"><path d="M84 0 V170M168 0 V170M252 0 V170M336 0 V170"/><path d="M0 34 H420M0 68 H420M0 102 H420M0 136 H420"/></g>
    <g font-size="16" font-weight="850" fill="#263238"><text x="126" y="23">사과</text><text x="210" y="23">배</text><text x="294" y="23">귤</text><text x="378" y="23">딸기</text><text x="42" y="57">A</text><text x="42" y="91">B</text><text x="42" y="125">C</text><text x="42" y="159">D</text></g>
    <g fill="#fff" stroke="#b3bbc2"><circle cx="126" cy="51" r="8"/><circle cx="210" cy="51" r="8"/><circle cx="294" cy="51" r="8"/><circle cx="378" cy="51" r="8"/><circle cx="126" cy="85" r="8"/><circle cx="210" cy="85" r="8"/><circle cx="294" cy="85" r="8"/><circle cx="378" cy="85" r="8"/><circle cx="126" cy="119" r="8"/><circle cx="210" cy="119" r="8"/><circle cx="294" cy="119" r="8"/><circle cx="378" cy="119" r="8"/><circle cx="126" cy="153" r="8"/><circle cx="210" cy="153" r="8"/><circle cx="294" cy="153" r="8"/><circle cx="378" cy="153" r="8"/></g>
  </g>
  <text x="380" y="496" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="800" fill="#725718">좋아하면 ○, 좋아하지 않으면 ×를 표시해 보세요.</text>
</svg>
