<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">쌓기나무 네 개로 만드는 두 층 이상 입체 세기</title><desc id="desc">쌓기나무 네 개를 모두 사용하되 두 층 이상이 되게 붙이는 문제입니다.</desc>
  <rect width="760" height="430" rx="24" fill="#fff"/><text x="380" y="43" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="800" fill="#20272b">쌓기나무 4개로 두 층 이상인 모양을 만드세요</text><text x="380" y="73" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#59636a">네 개를 모두 면끼리 붙이고, 돌려서 겹치면 같은 모양입니다.</text>
  <g stroke="#526a58" stroke-width="2"><g transform="translate(126 167) scale(.86)"><path d="M0 38L58 5 116 38 58 71Z" fill="#b9d4ad"/><path d="M0 38L58 71V132L0 99Z" fill="#78aa75"/><path d="M116 38L58 71V132L116 99Z" fill="#598c5c"/></g><g transform="translate(260 167) scale(.86)"><path d="M0 38L58 5 116 38 58 71Z" fill="#b9d4ad"/><path d="M0 38L58 71V132L0 99Z" fill="#78aa75"/><path d="M116 38L58 71V132L116 99Z" fill="#598c5c"/></g><g transform="translate(394 167) scale(.86)"><path d="M0 38L58 5 116 38 58 71Z" fill="#b9d4ad"/><path d="M0 38L58 71V132L0 99Z" fill="#78aa75"/><path d="M116 38L58 71V132L116 99Z" fill="#598c5c"/></g><g transform="translate(528 167) scale(.86)"><path d="M0 38L58 5 116 38 58 71Z" fill="#b9d4ad"/><path d="M0 38L58 71V132L0 99Z" fill="#78aa75"/><path d="M116 38L58 71V132L116 99Z" fill="#598c5c"/></g></g>
  <g transform="translate(303 310)"><path d="M0 30H154" stroke="#7b8b82" stroke-width="3" stroke-dasharray="7 5"/><path d="M77 0V60" stroke="#7b8b82" stroke-width="3"/><text x="77" y="85" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="800" fill="#4e6155">반드시 두 층 이상</text></g>
