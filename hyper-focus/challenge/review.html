<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2026년 9월 챌린지 대비 · 생성기 검수</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <header class="review-toolbar">
    <div>
      <span>LE​TE-ON · HYPER FOCUS</span>
      <strong>2026년 9월 챌린지 대비 · 생성기 검수</strong>
      <small>검수 전용 · 공개 시험 아님</small>
    </div>
    <nav aria-label="검수 도구">
      <button type="button" id="regenerate">다시 생성</button>
      <button type="button" id="toggleAnswers">정답 보기</button>
      <button type="button" id="printQuestions">문제 3개씩 인쇄</button>
      <button type="button" id="printConcepts">개념 교재 인쇄</button>
    </nav>
  </header>

  <main>
    <section class="intro" aria-labelledby="reviewTitle">
      <p>REVIEW BUILD</p>
      <h1 id="reviewTitle">그림과 조건을 읽고<br>한 단계 더 생각하는 문제</h1>
      <div class="status-row">
        <span>2026년 9월 챌린지 대비</span>
        <span>독립 풀이 검산</span>
        <span>정답 1개만 통과</span>
      </div>
    </section>

    <section id="questionSheets" class="sheet-stack" aria-label="유사문제 검수지"></section>

    <section class="concept-intro">
      <p>CONCEPT BOOK</p>
      <h2>워밍업 · 예제 · 유제 · 리뷰</h2>
    </section>
    <section id="conceptSheets" class="sheet-stack concept-stack" aria-label="개념 교재 검수지"></section>
  </main>

  <script src="balance-diagram.js"></script>
  <script src="exam-replacements.js"></script>
  <script src="exam-editions.js"></script>
  <script src="concept-replacement-specials.js"></script>
  <script src="exam-priority.js"></script>
  <script src="exam-more.js"></script>
  <script src="challenge-bank.js"></script>
  <script src="exam-supplement.js"></script>
  <script src="concept-specials.js"></script>
  <script src="concept-catalog.js"></script>
  <script src="review.js"></script>
</body>
</html>
