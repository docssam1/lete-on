<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>2026년 9월 챌린지 대비 | LETE-ON</title>
  <link rel="stylesheet" href="review.css">
  <link rel="stylesheet" href="exam.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body class="studio gfield-ui">
  <a class="skip-link" href="#workspace">본문으로</a>
  <header class="studio-header">
    <a class="studio-brand" href="studio.html" aria-label="챌린지 학습 설계 처음으로"><img src="assets/gfield-logo.png" alt="지필드"><span>LETE-ON</span></a>
    <div class="studio-heading"><h1>2026년 9월 챌린지 대비</h1><p>모의고사 채점과 유형별 학습</p></div>
    <a class="quiet-link" href="../index.html">하이퍼 포커스</a><a class="quiet-link" id="studioExamLink" href="exam.html">시험지 보기</a>
  </header>
  <main id="workspace" class="studio-shell">
    <div class="access-line"><p class="local-notice" id="accessNotice">이용 승인을 확인하고 있습니다.</p><button id="refreshAccess" type="button">이용 승인 다시 확인</button></div>
    <nav class="studio-tabs" role="tablist" aria-label="학습 설계">
      <button type="button" id="tab-grade" role="tab" aria-controls="grade-panel" aria-selected="true" data-tab="grade">모의고사 채점·진단</button>
      <button type="button" id="tab-wrong" role="tab" aria-controls="bank-panel" aria-selected="false" tabindex="-1" data-tab="wrong">오답 유사문제</button>
      <button type="button" id="tab-bank" role="tab" aria-controls="bank-panel" aria-selected="false" tabindex="-1" data-tab="bank">회차별 문제은행</button>
    </nav>
    <section class="context-bar" aria-label="학생과 회차">
      <label>회차<select id="studioRound"><option value="1">모의고사 1회</option><option value="2">모의고사 2회</option><option value="3">모의고사 3회</option><option value="4">모의고사 4회</option></select></label>
      <label>이름<input id="studioStudent" maxlength="20" autocomplete="off" placeholder="선택 입력"></label>
      <label>유치원<input id="studioSchool" maxlength="30" autocomplete="off" placeholder="선택 입력"></label>
      <span class="cutoff-note">본시험 20문항 · 문항당 5점<br>기준 점수 <b>60점</b></span>
    </section>
    <div id="studioMessage" role="status" aria-live="polite"></div>
    <section id="grade-panel" role="tabpanel" aria-labelledby="tab-grade">
      <div class="section-title"><div><h2>문항별 채점</h2><p>확인하지 않은 문제는 미입력으로 남겨 두세요. 추가 연습은 점수에 포함하지 않습니다.</p></div><button id="makeDiagnosis" class="primary" type="button">진단지 확인</button></div>
      <div class="grading-layout"><div id="gradeRows" class="grade-rows"></div><aside id="scoreSummary" class="score-summary" aria-live="polite"></aside></div>
      <section id="diagnosisPanel" class="diagnosis-panel" hidden aria-label="진단 결과"></section>
    </section>
    <section id="bank-panel" role="tabpanel" aria-labelledby="tab-bank" hidden>
      <div class="section-title"><div><h2 id="bankTitle">회차별 문제은행</h2><p id="bankScope"></p></div></div>
      <div class="bank-layout">
        <div class="bank-browser">
          <div class="bank-filters"><label class="search-field">낱말·영역·유형 검색<input id="studioSearch" type="search" autocomplete="off" placeholder="예: 색종이, 화살표, 길이"></label><label>영역<select id="areaFilter"><option value="">전체 영역</option></select></label><label>범위<select id="sectionFilter"><option value="all">본시험과 추가 연습</option><option value="main">본시험</option><option value="extra">추가 연습</option></select></label></div>
          <div class="selection-tools"><span id="resultCount" role="status"></span><button type="button" id="selectVisible">현재 결과 선택</button><button type="button" id="clearVisible">현재 결과 해제</button></div>
          <div id="bankRows" class="bank-rows"></div>
        </div>
        <aside class="assembly" id="assemblyPanel" tabindex="-1" aria-label="학습지 구성">
          <h3>선택한 유형</h3><p id="selectionCount"></p><ul id="selectedList"></ul><button type="button" id="clearSelection" class="text-button">선택 모두 비우기</button>
          <fieldset class="difficulty-control"><legend>원문과 비교한 난이도</legend><label><input type="radio" name="difficulty" value="easy">더 쉽게</label><label><input type="radio" name="difficulty" value="same" checked>같은 난이도</label><label><input type="radio" name="difficulty" value="hard">더 어렵게</label></fieldset>
          <label class="count-field">선택한 원문당 유사문제 수<input id="variantCount" type="number" min="1" max="20" step="1" inputmode="numeric" placeholder="문항 수 입력"><small>원문당 최대 20문항, 한 구성 최대 100문항</small></label>
          <p id="assemblySummary" role="status"></p><button id="buildPractice" class="primary" type="button" disabled>학습지 구성</button>
        </aside>
      </div>
      <button type="button" id="jumpAssembly" class="mobile-assembly-jump">선택 0개 · 구성으로 이동</button>
    </section>
    <section id="worksheetPanel" class="worksheet-panel" hidden aria-label="확정한 학습지">
      <div class="section-title"><div><h2 id="worksheetTitle" tabindex="-1">유사문제 학습지</h2><p id="worksheetMeta"></p></div><button id="closeWorksheet" type="button">학습지 접기</button></div>
      <div class="print-tools"><label>보기·인쇄 범위<select id="printMode"><option value="questions">문제만</option><option value="answers">답안·풀이만</option><option value="both">문제와 답안·풀이</option><option value="quick">빠른 정답만</option></select></label><button id="printWorksheet" type="button" class="primary">선택 범위 인쇄</button></div>
      <div id="worksheetPages" class="studio-pages"></div>
    </section>
  </main>
  <dialog id="questionPreview" aria-labelledby="previewTitle"><header><div><p id="previewLocation"></p><h2 id="previewTitle">원문 미리보기</h2></div><button type="button" id="closePreview" aria-label="미리보기 닫기">닫기</button></header><button type="button" id="togglePreviewZoom" aria-pressed="false">그림 크게 보기</button><p class="zoom-hint">그림을 좌우로 밀어 볼 수 있습니다.</p><div id="previewQuestion"></div><button type="button" id="revealPreview">정답·풀이 보기</button><div id="previewAnswer" hidden></div></dialog>
  <script src="access-catalog.js"></script><script src="../supabase-config.js"></script><script src="../supabase-client.js"></script><script src="access-service.js"></script><script src="studio-loader.js"></script>
</body>
</html>
