<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>하이퍼포커스 승인번호 관리</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Pretendard,"Malgun Gothic",sans-serif}.wrap{max-width:1380px;margin:auto;padding:28px 18px 70px}h1{margin:0 0 6px}.sub{color:#667085;margin-bottom:22px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(16,24,40,.05)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #d0d5dd}input{min-width:210px;flex:1}button{background:#173b6c;color:#fff;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.danger{background:#b42318}.ghost{background:#eef2f7;color:#344054}.save{background:#0f766e}.status{font-size:12px;color:#667085;margin-left:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #eef0f3;padding:10px;text-align:left;white-space:nowrap;vertical-align:middle}th{background:#f8fafc}.table-wrap input[type="checkbox"]{width:18px;height:18px;min-width:auto;flex:none;padding:0}.code{font-family:Consolas,monospace;font-weight:900;color:#16417c}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#edf4ff;color:#175cd3;font-size:11px}.tag.online{background:#ecfdf3;color:#067647}.tag.suspended,.tag.archived{background:#fef3f2;color:#b42318}.note{font-size:12px;line-height:1.7;color:#475467;background:#fffaeb;border:1px solid #fedf89;border-radius:10px;padding:12px;margin-top:12px}.row-actions{display:flex;gap:5px}.row-actions button{padding:7px 9px;font-size:11px}.bundle-list{display:grid;gap:6px;min-width:178px}.bundle-toggle{display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:center;font-size:11px}.bundle-toggle small{color:#667085}.bundle-toggle.partial{color:#9a6700;font-weight:800}.bundle-toggle.catalog-error{color:#b42318}.legacy-mock{display:flex;align-items:center;gap:7px;font-size:11px;color:#667085}@media(max-width:900px){.table-wrap{overflow:auto}table{min-width:1260px}}
  </style>
</head>
<body><div class="wrap">
  <h1>프리미어 하이퍼포커스 승인번호 관리</h1>
  <div class="sub">학생별 승인번호와 상품 권한을 관리합니다.</div>

  <div class="card" id="legacySyncCard">
    <div class="row">
      <input id="ghKey" type="password" placeholder="GitHub 토큰">
      <button class="ghost" type="button" data-save-key>토큰 저장</button>
      <button class="save" type="button" data-save-github>💾 GitHub에 저장</button>
      <span class="status" id="saveStatus">변경 없음</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <input id="newName" placeholder="학생 이름">
      <input id="newCode" inputmode="numeric" maxlength="7" placeholder="승인번호 4자리 (선택)">
      <select id="newType"><option value="internal">재원</option><option value="online">온라인</option></select>
      <button type="button" data-add-student>학생 등록·승인번호 발급</button>
    </div>
    <div class="note" id="adminNote">기존 이름+전화번호 기록과 자동 저장 전화번호는 삭제하지 않습니다. 승인번호는 비워 두면 사용 중이지 않은 4자리 숫자를 자동 발급하며, 직접 지정할 수도 있습니다. 모든 상품 배너는 학생 서재에 보이며, 아래에서 승인한 상품만 열립니다. 원격 전환 뒤 모의고사는 활용 8회·파이널 3회·최종 4회 묶음으로 승인합니다.</div>
  </div>

  <div class="card table-wrap"><table><thead><tr><th>승인번호</th><th>학생</th><th>구분·상태</th><th>문항 진단</th><th>추가 문제</th><th>모의고사 상품</th><th>VIP 라운지</th><th>문제 은행</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script src="./data.js"></script>
<script src="./supabase-config.js?v=hf-supabase-live-20260828a"></script>
<script src="./supabase-client.js"></script>
<script src="./portal-auth.js?v=hf-supabase-live-20260828a"></script>
<script src="./admin-app.js"></script>
</body>
</html>
