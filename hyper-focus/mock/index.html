<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyper Focus 진단·맞춤 시험지 | 지필드 영재교육</title>
<style>
:root{--navy:#102440;--navy2:#1c3f68;--gold:#c9a54c;--cream:#f7f4ed;--ink:#202833;--muted:#687386;--line:#dce2e9;--green:#16805c;--red:#c33b43;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;word-break:keep-all}button,input{font:inherit}
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 18%,rgba(201,165,76,.24),transparent 30%),linear-gradient(145deg,#071524,#173657)}.gate-card{width:min(520px,100%);padding:32px;background:#fff;border-radius:18px;box-shadow:0 26px 80px rgba(0,0,0,.25)}.eyebrow{color:#9b7728;font-size:11px;font-weight:950;letter-spacing:.15em}.gate h1{margin:10px 0 8px;color:var(--navy);font-size:29px;letter-spacing:-.05em}.gate p{color:var(--muted);font-size:14px;line-height:1.7}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.form input{height:48px;border:1px solid #cbd5df;border-radius:9px;padding:0 13px}.form button{grid-column:1/-1;height:49px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-weight:900;cursor:pointer}.error{min-height:19px;margin-top:8px;color:var(--red);font-size:12px;font-weight:800}.hint{margin-top:10px;color:#8a94a3;font-size:11px;line-height:1.55}
.app{display:none}.top{background:var(--navy);color:#fff}.top-inner{width:min(1080px,calc(100% - 32px));margin:auto;padding:26px 0}.top-row{display:flex;align-items:end;justify-content:space-between;gap:20px}.top h1{margin:5px 0 0;font-size:27px;letter-spacing:-.04em}.student{font-size:12px;color:#d7dfeb;text-align:right}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.nav a,.nav button{border:1px solid rgba(255,255,255,.24);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;padding:9px 12px;text-decoration:none;font-size:12px;font-weight:850;cursor:pointer}.nav .gold{background:var(--gold);border-color:var(--gold);color:#18283c}
.shell{width:min(1080px,calc(100% - 32px));margin:22px auto 70px}.intro{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:22px;background:#fff;border:1px solid var(--line);border-radius:14px}.intro h2{margin:0 0 8px;color:var(--navy);font-size:21px}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.seed{padding:12px 15px;border-radius:9px;background:#f1f5f9;color:#53647a;font-size:11px;font-weight:800}
.progress{display:flex;align-items:center;gap:12px;margin:18px 0 11px}.track{flex:1;height:9px;border-radius:999px;background:#dfe5ec;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#e6c978);transition:.2s}.prog-text{font-size:12px;font-weight:900;color:var(--navy)}
.list{display:grid;gap:10px}.qcard{display:grid;grid-template-columns:48px 1fr auto;gap:13px;align-items:center;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:11px;transition:.18s}.qcard.o{border-color:#8ad0b7;background:#f5fcf9}.qcard.x{border-color:#e2a4a8;background:#fff8f8}.number{font-size:23px;font-weight:950;color:var(--navy)}.qmeta b{display:block;color:var(--navy);font-size:13px}.qmeta span{display:block;margin-top:5px;color:var(--muted);font-size:11px}.ox{display:flex;gap:6px}.ox button{width:44px;height:38px;border:1px solid #cdd6df;border-radius:8px;background:#fff;color:#667386;font-weight:950;cursor:pointer}.ox .on-o{background:var(--green);border-color:var(--green);color:#fff}.ox .on-x{background:var(--red);border-color:var(--red);color:#fff}
.submit{display:block;width:min(420px,100%);height:50px;margin:20px auto;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:950;cursor:pointer}.result{display:none;margin-top:24px}.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:25px;border-radius:15px;background:linear-gradient(135deg,#102440,#234b78);color:#fff}.score{font-size:58px;font-weight:950;line-height:1;color:#f1d788}.hero h2{margin:0 0 7px;font-size:22px}.hero p{margin:0;color:#d8e2ee;font-size:13px;line-height:1.65}.panel{margin-top:12px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:13px}.panel h3{margin:0 0 14px;color:var(--navy);font-size:16px}.bars{display:grid;gap:11px}.bar{display:grid;grid-template-columns:minmax(130px,1.4fr) 2fr 55px;gap:10px;align-items:center;font-size:12px}.bar-track{height:10px;background:#e7ecf1;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:var(--navy2);border-radius:999px}.bar strong{text-align:right}.wrong{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0f4;font-size:12px}.wrong:last-child{border-bottom:0}.wrong b{color:var(--red)}.practice-maker{flex:1 1 100%;padding:14px;border:1px solid #d8c17c;border-radius:10px;background:#fff9e9}.practice-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:#684f16;font-size:12px;font-weight:900}.practice-types{display:grid;gap:7px}.practice-type{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:10px;align-items:center;padding:9px;background:#fff;border:1px solid #eadcac;border-radius:8px;font-size:11px}.difficulty-picks{display:flex;gap:5px}.difficulty-picks button{min-width:54px!important;min-height:32px!important;padding:5px 8px!important;border:1px solid #cbd5df!important;background:#fff!important;color:#53647a!important}.difficulty-picks button.active{background:var(--navy)!important;border-color:var(--navy)!important;color:#fff!important}.difficulty-picks button:disabled{opacity:.35;cursor:not-allowed}.practice-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.practice-footer input{width:70px;height:37px;border:1px solid #c9b36f;border-radius:7px;padding:0 8px}.practice-footer .make{min-width:190px!important;min-height:39px!important;background:var(--gold)!important;border-color:var(--gold)!important}.practice-note{color:#795b17;font-size:11px;font-weight:800}.practice-error{color:var(--red);font-size:11px;font-weight:800}.actions-result{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions-result a,.actions-result>button{flex:1;min-width:190px;display:flex;align-items:center;justify-content:center;min-height:47px;border:1px solid var(--navy);border-radius:9px;background:#fff;color:var(--navy);font-weight:900;text-decoration:none;cursor:pointer}.actions-result .primary{background:var(--gold);border-color:var(--gold)}.locked{padding:13px;border-radius:8px;background:#fff7e4;color:#795b17;font-size:12px;font-weight:800;line-height:1.6}
@media(max-width:680px){.form{grid-template-columns:1fr}.top-inner,.shell{width:min(100% - 20px,1080px)}.top-row,.intro{display:block}.student{text-align:left;margin-top:9px}.intro .seed{display:inline-block;margin-top:12px}.qcard{grid-template-columns:38px 1fr}.ox{grid-column:2}.hero{grid-template-columns:1fr}.score{font-size:48px}.bar{grid-template-columns:1fr 1.2fr 42px}.gate-card{padding:25px 19px}.practice-type{grid-template-columns:1fr}.difficulty-picks{width:100%}.difficulty-picks button{flex:1}}
@media print{.gate,.top,.intro,.progress,.list,.submit,.actions-result{display:none!important}.app,.result{display:block!important}.shell{width:100%;margin:0}.panel,.hero{break-inside:avoid;box-shadow:none}@page{size:A4 portrait;margin:12mm}}
</style>
</head>
<body>
<section class="gate" id="gate"><div class="gate-card"><div class="eyebrow">G-FIELD HYPER FOCUS</div><h1 id="gateTitle">Hyper Focus 진단</h1><p id="gateDescription">시험 결과에서 약점 유형을 찾고, 선택한 난이도로 맞춤 시험지를 자동 생성합니다.</p><div class="form"><input id="studentName" autocomplete="name" placeholder="학생 이름"><input id="accessCode" type="password" placeholder="추가 문제 승인번호 (선택)"><button type="button" id="enterBtn">진단 시작하기</button></div><div id="gateError" class="error"></div><div class="hint">유형마다 쉽게·같게·어렵게를 고를 수 있으며 난이도별 2문항까지 포함됩니다. 3번째 문제부터는 유료 추가 문제입니다.</div></div></section>
<div class="app" id="app"><header class="top"><div class="top-inner"><div class="top-row"><div><div class="eyebrow">HYPER FOCUS DIAGNOSIS</div><h1 id="mockTitle">Hyper Focus 진단</h1></div><div class="student" id="studentDisplay"></div></div><nav class="nav"><a id="viewerLink" class="gold" target="_blank" rel="noopener">시험지 뷰어·인쇄</a><button type="button" id="newExamBtn">새 문제로 다시 보기</button><a href="../">Hyper Focus 전체 진단</a></nav></div></header><main class="shell"><section class="intro"><div><h2>문제지에서 채점한 결과를 표시하세요</h2><p id="mockDescription">시험 구성표에 등록된 순서로 문제를 불러옵니다.</p></div><div class="seed" id="seedDisplay"></div></section><div class="progress"><div class="track"><div class="fill" id="progressFill"></div></div><span class="prog-text" id="progressText">0</span></div><section class="list" id="questionList"></section><button type="button" class="submit" id="submitBtn">채점하고 진단 받기</button><section class="result" id="result"></section></main></div>
<script src="../../config.js"></script>
<script src="./access-policy.js"></script>
<script src="../generator/q01.js"></script>
<script src="../generator/stacking.js"></script>
<script src="../generator/spatial.js"></script>
<script src="../generator/reasoning.js"></script>
<script src="./exam-blueprints.js"></script>
<script src="./variation-bank.js"></script>
<script src="./mock-core.js"></script>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const examId=params.get('exam')||HFMockBlueprints.reviewExamId;
  let student='';let accessTier='free';let exam=null;let marks={};let weakTypeIds=[];let practiceDifficultyByType={};
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function historyKey(){return `hf-mock-history:${exam.id}:${student}`;}
  function marksKey(){return `hf-mock-marks:${exam.id}:${student}:${exam.seed}`;}
  const requestedBlueprint=HFMockBlueprints.getExam(examId);
  if(requestedBlueprint){$('gateTitle').textContent=requestedBlueprint.title;$('gateDescription').textContent=requestedBlueprint.description;}
  async function enter(){
    const name=$('studentName').value.trim();const code=$('accessCode').value.trim();
    if(!name){$('gateError').textContent='학생 이름을 입력해 주세요.';return}
    if(code){
      $('gateError').textContent='승인번호를 확인하는 중입니다.';
      try{const verified=await HFAccessPolicy.verifyCode(code,window.GFIELD_CONFIG);if(!verified.valid){$('gateError').textContent='승인번호가 올바르지 않습니다. 비워 두면 난이도별 2문항 시험지를 이용할 수 있습니다.';return}accessTier=verified.paid?'paid':'free';HFAccessPolicy.saveVerifiedHash(verified.paid?verified.hash:'');}catch(error){$('gateError').textContent=String(error.message||error);return}
    }else accessTier=HFAccessPolicy.storedAccess(window.GFIELD_CONFIG).paid?'paid':'free';
    student=HFMock.safeStudent(name);
    const seed=HFMock.normalizeSeed(params.get('seed')||HFMock.makeSeed());
    $('gateError').textContent='문제은행을 불러오는 중입니다.';$('enterBtn').disabled=true;
    try{await HFMock.prepareExam(examId);exam=HFMock.createExam(examId,seed)}catch(error){$('gateError').textContent=String(error.message||error);$('enterBtn').disabled=false;return}
    $('gateError').textContent='';$('enterBtn').disabled=false;
    try{marks=JSON.parse(localStorage.getItem(marksKey())||'{}')}catch(e){marks={}}
    $('gate').style.display='none';$('app').style.display='block';
    $('mockTitle').textContent=exam.title;$('mockDescription').textContent=exam.description;
    $('studentDisplay').textContent=`${student} 학생 · ${accessTier==='paid'?'추가 문제 이용 가능':'난이도별 2문항 포함'}`;
    $('seedDisplay').textContent=`${exam.subtitle} · 문제지 번호 ${exam.seed}`;
    if(exam.questions.every(q=>q.sourceMode==='variation-bank'))$('newExamBtn').style.display='none';
    const url=new URL('./viewer.html',location.href);url.searchParams.set('exam',exam.id);url.searchParams.set('student',student);url.searchParams.set('seed',exam.seed);$('viewerLink').href=url;
    renderQuestions();
    history.replaceState(null,'',`${location.pathname}?exam=${encodeURIComponent(exam.id)}&student=${encodeURIComponent(student)}&seed=${exam.seed}`);
  }
  function renderQuestions(){$('questionList').innerHTML=exam.questions.map(q=>`<article class="qcard ${marks[q.number]||''}" id="qcard${q.number}"><div class="number">${String(q.number).padStart(2,'0')}</div><div class="qmeta"><b>${esc(q.typeTitle)}</b><span>${esc(q.typeCode)} · ${esc(q.difficultyLabel)} · 시험지 ${q.number}번</span></div><div class="ox"><button type="button" class="${marks[q.number]==='o'?'on-o':''}" onclick="setMark(${q.number},'o')">O</button><button type="button" class="${marks[q.number]==='x'?'on-x':''}" onclick="setMark(${q.number},'x')">X</button></div></article>`).join('');updateProgress();}
  function setMark(number,value){marks[number]=value;try{localStorage.setItem(marksKey(),JSON.stringify(marks))}catch(e){}renderQuestions();}
  function updateProgress(){const done=exam.questions.filter(q=>marks[q.number]).length;$('progressText').textContent=`${done}/${exam.questions.length}`;$('progressFill').style.width=`${done/exam.questions.length*100}%`;}
  function saveHistory(summary){try{const old=JSON.parse(localStorage.getItem(historyKey())||'[]').filter(row=>row.seed!==exam.seed);old.unshift({examId:exam.id,seed:exam.seed,date:new Date().toISOString(),score:summary.score,wrongTypeIds:summary.wrongTypeIds});localStorage.setItem(historyKey(),JSON.stringify(old.slice(0,10)))}catch(e){}}
  function setPracticeDifficulty(typeId,difficulty){
    const available=HFMock.getPracticeAvailability(typeId,accessTier);
    if(!available[difficulty])return;
    practiceDifficultyByType[typeId]=difficulty;
    document.querySelectorAll(`[data-practice-type="${typeId}"] button`).forEach(button=>button.classList.toggle('active',button.dataset.difficulty===difficulty));
  }
  function renderPracticeMaker(){
    weakTypeIds=weakTypeIds.slice(0,HFAccessPolicy.MAX_SELECTED_TYPES);
    const rows=weakTypeIds.map(typeId=>{
      const availability=HFMock.getPracticeAvailability(typeId,accessTier);
      const current=practiceDifficultyByType[typeId]&&availability[practiceDifficultyByType[typeId]]?practiceDifficultyByType[typeId]:(availability.same?'same':availability.easy?'easy':'hard');
      practiceDifficultyByType[typeId]=current;
      const buttons=HFAccessPolicy.DIFFICULTIES.map(difficulty=>`<button type="button" data-difficulty="${difficulty}" class="${current===difficulty?'active':''}" ${availability[difficulty]?'':'disabled'} onclick="setPracticeDifficulty(${typeId},'${difficulty}')">${HFMock.DIFFICULTY_LABEL[difficulty]}</button>`).join('');
      return `<div class="practice-type" data-practice-type="${typeId}"><b>${esc(`q${String(typeId).padStart(2,'0')} · ${HFMock.getTypeMeta(typeId).title}`)}</b><div class="difficulty-picks">${buttons}</div></div>`;
    }).join('');
    const paidCount=accessTier==='paid'?`<label for="practiceCount">유형당 문항</label><input id="practiceCount" type="number" min="2" max="${HFAccessPolicy.PAID_PER_DIFFICULTY}" value="2" inputmode="numeric">`:'<input id="practiceCount" type="hidden" value="2">';
    return `<div class="practice-maker"><div class="practice-head"><span>맞춤 시험지 · 최대 ${HFAccessPolicy.MAX_SELECTED_TYPES}유형</span><span>${accessTier==='paid'?'추가 문제 권한 확인':'난이도별 2문항 포함'}</span></div><div class="practice-types">${rows}</div><div class="practice-footer">${paidCount}<button type="button" class="make" onclick="openPracticeBank()">선택 난이도로 시험지 만들기</button><span class="practice-note">${accessTier==='paid'?'3문항 이상도 선택할 수 있습니다.':'3번째 문제부터 유료입니다.'}</span><span class="practice-error" id="practiceError"></span></div></div>`;
  }
  function openPracticeBank(){
    const count=Number($('practiceCount')?.value);const error=$('practiceError');
    try{HFAccessPolicy.validatePracticeRequest({countPerType:count,difficulty:'same',accessTier});}catch(reason){if(error)error.textContent=String(reason.message||reason);return}
    for(const typeId of weakTypeIds){const difficulty=practiceDifficultyByType[typeId]||'same';const available=HFMock.getPracticeAvailability(typeId,accessTier)[difficulty]||0;if(available<count){if(error)error.textContent=`q${String(typeId).padStart(2,'0')} ${HFMock.DIFFICULTY_LABEL[difficulty]} 문제는 현재 ${available}문항만 준비되었습니다.`;return}}
    const levels=weakTypeIds.map(typeId=>`${typeId}:${practiceDifficultyByType[typeId]||'same'}`).join(',');
    const purl=new URL('./viewer.html',location.href);purl.searchParams.set('mode','practice');purl.searchParams.set('exam',exam.id);purl.searchParams.set('student',student);purl.searchParams.set('types',weakTypeIds.join(','));purl.searchParams.set('count',String(count));purl.searchParams.set('levels',levels);purl.searchParams.set('seed',HFMock.makeSeed());window.open(purl,'_blank','noopener');
  }
  function submit(){
    const missing=exam.questions.filter(q=>!marks[q.number]);if(missing.length){alert(`아직 ${missing.length}문항을 표시하지 않았습니다.`);return}
    const summary=HFMock.resultFromMarks(exam,marks);weakTypeIds=summary.wrongTypeIds.slice(0,HFAccessPolicy.MAX_SELECTED_TYPES);practiceDifficultyByType={};saveHistory(summary);
    const verdict=summary.score>=90?'검수한 핵심 유형이 매우 안정적입니다.':summary.score>=70?'기본 구조는 이해했습니다. 틀린 유형을 다른 문제로 한 번 더 확인하세요.':'틀린 유형의 문제 조건과 풀이 순서를 다시 확인하는 연습이 필요합니다.';
    const wrongHtml=summary.wrongRows.length?summary.wrongRows.map(row=>`<div class="wrong"><span><b>${row.question.number}번 X</b> · ${esc(row.question.typeTitle)} · ${esc(row.question.difficultyLabel)}</span><span>${esc(row.question.typeCode)}</span></div>`).join(''):'<div class="locked">모든 문제를 맞혔습니다. 새 문제지로 한 번 더 확인해 보세요.</div>';
    let practice='';
    if(summary.wrongTypeIds.length){practice=renderPracticeMaker()}
    const reportUrl=new URL('./viewer.html',location.href);reportUrl.searchParams.set('exam',exam.id);reportUrl.searchParams.set('student',student);reportUrl.searchParams.set('seed',exam.seed);
    $('result').innerHTML=`<section class="hero"><div class="score">${summary.score}</div><div><h2>${esc(student)} 학생의 Hyper Focus 진단</h2><p>${esc(verdict)}<br>정답 ${summary.correctCount}문항 · 오답 ${summary.wrongCount}문항</p></div></section><section class="panel"><h3>유형별 수행률</h3><div class="bars">${summary.byType.map(row=>`<div class="bar"><span>${esc(row.title)}</span><div class="bar-track"><div class="bar-fill" style="width:${row.rate}%"></div></div><strong>${row.correct}/${row.total}</strong></div>`).join('')}</div></section><section class="panel"><h3>틀린 문항과 약점 유형</h3>${wrongHtml}</section><div class="actions-result">${practice}<a href="${esc(reportUrl)}" target="_blank" rel="noopener">시험지·정답 다시 보기</a><button type="button" onclick="window.print()">진단지 인쇄</button></div>`;
    $('result').style.display='block';$('result').scrollIntoView({behavior:'smooth',block:'start'});
  }
  window.setMark=setMark;window.setPracticeDifficulty=setPracticeDifficulty;window.openPracticeBank=openPracticeBank;
  $('enterBtn').onclick=enter;$('submitBtn').onclick=submit;
  $('newExamBtn').onclick=()=>{location.search=`exam=${encodeURIComponent(exam.id)}&student=${encodeURIComponent(student)}&seed=${HFMock.makeSeed()}`};
  $('studentName').value=params.get('student')||'';
  $('studentName').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});$('accessCode').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
})();
</script>
</body>
</html>
