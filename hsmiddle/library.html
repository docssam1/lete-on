<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFIELD | 생각하는 황소 중등 서재</title>
<meta name="description" content="생각하는 황소 중등 성취도 진단 + 클리닉 서재">
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
:root{
  --navy:#173a6b; --navy-d:#0f2747; --gold:#b58b1f;
  --bg:#eef3f9; --card:#fff;
  --line:#dde5f0; --line-2:#e8eef6;
  --text:#15253c; --muted:#63768e;
  --green:#0f7a4d; --green-bg:#e8f6ef;
  --coral:#c53d4a; --coral-bg:#fdecef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Pretendard,system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(900px 460px at 50% -12%,#dfeaf7,transparent 60%),var(--bg);
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}

/* 상단바 */
.top{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 22px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--navy),var(--navy-d));color:#fff;font-weight:950;font-size:16px;
}
.brand b{display:block;font-size:15.5px;font-weight:950;letter-spacing:-.03em;line-height:1.25}
.brand span{display:block;margin-top:2px;color:var(--muted);font-size:11.5px;font-weight:700}
.links{display:flex;gap:7px;flex-wrap:wrap}
.links a,.links button{
  height:36px;display:inline-flex;align-items:center;padding:0 13px;border-radius:9px;
  border:1px solid var(--line);background:#fff;color:var(--navy);font-size:12.5px;font-weight:850;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.links a:hover,.links button:hover{border-color:#b9c9dd;background:#f7fafd}
.links a.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.links a.primary:hover{background:var(--navy-d)}
.links button.out{color:var(--coral);border-color:#f0cdd2}

.shell{width:min(1120px,calc(100% - 32px));margin:0 auto}

/* 인사 영역 */
.head{padding:34px 0 6px}
.head h1{margin:0;font-size:clamp(22px,3.2vw,29px);font-weight:950;letter-spacing:-.045em;text-wrap:balance}
.head p{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.75;font-weight:600}
.progress{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.pbar{position:relative;flex:1;min-width:180px;height:8px;border-radius:99px;background:#dfe7f1;overflow:hidden}
.pbar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--navy),#3d7ab8)}
.pnum{font-size:12.5px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:22px 0 30px}
.card{
  position:relative;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:20px;
  box-shadow:0 8px 22px rgba(19,37,60,.05);transition:border-color .18s,box-shadow .18s,transform .18s;
}
.card.open:hover{border-color:#bcd0e6;box-shadow:0 14px 30px rgba(19,37,60,.09);transform:translateY(-2px)}
.card.locked{background:#fafbfd}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tile{
  width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-size:14px;font-weight:950;letter-spacing:-.03em;color:#fff;background:var(--accent,#4a7fb5);
}
.card.locked .tile{background:#c3ccd8}
.state{
  height:24px;display:inline-flex;align-items:center;padding:0 10px;border-radius:99px;
  font-size:11px;font-weight:900;letter-spacing:.02em;
}
.state.on{background:var(--green-bg);color:var(--green)}
.state.off{background:var(--coral-bg);color:var(--coral)}
.card h2{margin:14px 0 0;font-size:17px;font-weight:950;letter-spacing:-.035em}
.card p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.7;font-weight:600;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.chips span{
  height:25px;display:inline-flex;align-items:center;padding:0 9px;border-radius:99px;
  background:#f2f6fb;border:1px solid var(--line-2);color:#3f5a7a;font-size:11px;font-weight:850;
}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.acts a,.acts button{
  height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0 13px;
  border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:#fff;
  font-size:12.5px;font-weight:900;cursor:pointer;transition:background .15s;
}
.acts a:hover{background:var(--navy-d)}
.acts a.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.acts a.ghost:hover{background:#f5f9fd}
.acts button.off{background:#eef2f7;border-color:#dde5f0;color:#95a4b7;cursor:not-allowed}
.acts a.ask{background:#fff;color:var(--gold);border-color:#ecdcb2}

/* 하단 */
.foot{
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:18px 0 40px;color:var(--muted);font-size:12px;line-height:1.7;font-weight:650;
  border-top:1px solid var(--line);
}
.foot a{color:var(--navy);font-weight:850}

@media (max-width:640px){
  .top{padding:12px 16px}
  .links a:not(.primary):not(.keep),.links button:not(.out){display:none}
  .head{padding:26px 0 4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">G</div>
    <div>
      <b>GFIELD 서재</b>
      <span>생각하는 황소 중등 진단 + 클리닉</span>
    </div>
  </div>
  <div class="links" id="links">
    <a href="./archive.html" class="keep">자료실</a>
    <a href="./index.html">과정 안내</a>
    <a class="primary keep" href="https://open.kakao.com/me/gfield" target="_blank" rel="noopener">문의</a>
    <button class="out" type="button" onclick="logout()">나가기</button>
  </div>
</header>

<div class="shell">
  <section class="head">
    <h1 id="greeting">서재를 불러오는 중입니다.</h1>
    <p>승인된 과정만 열립니다. 시험지 응시부터 채점, 분석지 확인까지 한 곳에서 이어집니다.</p>
    <div class="progress">
      <div class="pbar"><span id="pfill" style="width:0%"></span></div>
      <div class="pnum" id="pnum">0 / 5</div>
      <span id="usagePeriod" style="font-size:11px;color:var(--muted);font-weight:800"></span>
    </div>
  </section>

  <main class="grid" id="catalog"></main>

  <div class="foot">
    <span>승인번호는 구매 후 카카오톡으로 전달됩니다. 이름은 인쇄 워터마크에만 사용됩니다.</span>
    <span><a href="https://open.kakao.com/me/gfield" target="_blank" rel="noopener">카카오톡 문의</a> · <a href="./index.html">과정 안내</a></span>
  </div>
</div>

<script src="./data.js"></script>
<script src="./shared-auth.js"></script>
<script src="./hsm-cloud.js"></script>
<script>
const session = HSMIDDLE_AUTH.readSession();
if (!session.valid || !session.access.length) {
  location.replace("./login.html");
}

const access = new Set(session.access);
const isOpen = key => access.has(key);
const name = session.name;

function logout(){ HSMIDDLE_AUTH.clearSession(); location.replace("./login.html"); }

/* 이용 기간(6개월) 만료 시 본문을 안내로 교체하고 진행을 중단한다.
   서버가 없으므로 기기·브라우저 단위로만 관리된다. */
function showExpired(){
  document.querySelector(".shell").innerHTML = `
    <section class="head">
      <h1>이용 기간이 종료되었습니다</h1>
      <p>첫 로그인일로부터 6개월간 이용하실 수 있습니다. 연장이 필요하시면 카카오톡으로 문의해 주세요.</p>
    </section>
    <main class="grid">
      <article class="card open">
        <div class="acts">
          <a class="ask" href="https://open.kakao.com/me/gfield" target="_blank" rel="noopener">카카오톡 문의</a>
          <button type="button" onclick="logout()">나가기</button>
        </div>
      </article>
    </main>`;
}

if (HSMIDDLE_AUTH.isAdmin(name)) {
  const a = document.createElement("a");
  a.href = "./admin.html"; a.textContent = "승인 관리"; a.className = "primary keep";
  document.getElementById("links").prepend(a);
}

function attemptCountLocal(key){
  const historyKey = key === "diagnostic" ? `hsm-history-diagnostic-${name}` : `hsm-history-${key}-${name}`;
  try { return (JSON.parse(localStorage.getItem(historyKey) || "[]")).length; } catch (e) { return 0; }
}

/* 서버 개수를 우선 사용하고, 실패 시(null 반환) 로컬 개수로 폴백한다 */
async function attemptCount(key){
  if (window.HSMIDDLE_CLOUD) {
    const list = await HSMIDDLE_CLOUD.listAttempts(name, key);
    if (Array.isArray(list)) return list.length;
  }
  return attemptCountLocal(key);
}

const catalog = [
  {
    key:"diagnostic", tile:"진단", accent:"#1d679f",
    title:"중등 성취도 진단",
    copy:"40문항을 풀고 O/X 또는 답안으로 채점하면 학기·영역·난이도·단원 분석과 처방이 바로 나옵니다.",
    chips:["40문항","문항별 유사문제","풀이 영상"],
    take:"./diagnostic.html", report:"./report.html"
  },
  {
    key:"mock-1", tile:"1회", accent:"#3f6ea8",
    title:"실전 모의고사 1회",
    copy:"진단 이후 첫 실전 훈련입니다. 채점 후 문항별 처방과 풀이 영상으로 바로 복습합니다.",
    chips:["40문항","문항별 처방","풀이 영상"],
    take:"./exam.html?exam=mock-1", report:"./report.html?exam=mock-1"
  },
  {
    key:"mock-2", tile:"2회", accent:"#3f6ea8",
    title:"실전 모의고사 2회",
    copy:"1회에서 드러난 약점이 실제로 메워졌는지 확인하며 실전 감각을 다집니다.",
    chips:["40문항","회차 비교","풀이 영상"],
    take:"./exam.html?exam=mock-2", report:"./report.html?exam=mock-2"
  },
  {
    key:"mock-3", tile:"3회", accent:"#3f6ea8",
    title:"실전 모의고사 3회",
    copy:"최종 점검 전 마지막으로 남은 공백을 확인하는 회차입니다.",
    chips:["40문항","약점 분석","풀이 영상"],
    take:"./exam.html?exam=mock-3", report:"./report.html?exam=mock-3"
  },
  {
    key:"final", tile:"최종", accent:"#b58b1f",
    title:"최종 모의고사 · 파이널",
    copy:"진단부터 이어온 흐름을 마무리하는 종합 점검 회차입니다.",
    chips:["40문항","종합 점검","풀이 영상"],
    take:"./exam.html?exam=final", report:"./report.html?exam=final"
  }
];

async function init(){
  /* 이용 기간 보정: 서버에 기록된 첫 로그인 시각이 있으면(더 이르면) 로컬 값을 덮어쓴다 */
  if (window.HSMIDDLE_CLOUD && !HSMIDDLE_AUTH.isAdmin(name)) {
    try {
      const serverStart = await HSMIDDLE_CLOUD.getStart(name);
      if (serverStart) HSMIDDLE_AUTH.syncStart(name, serverStart);
    } catch (e) {}
  }

  if (HSMIDDLE_AUTH.isExpired(name)) {
    showExpired();
    return;
  }

  if (!HSMIDDLE_AUTH.isAdmin(name)) {
    document.getElementById("usagePeriod").textContent = `이용 기간 D-${HSMIDDLE_AUTH.daysLeft(name)}`;
  }

  const openCount = catalog.filter(c => isOpen(c.key)).length;
  document.getElementById("greeting").textContent = `${name} 학생, 어서 오세요.`;
  document.getElementById("pnum").textContent = `${openCount} / ${catalog.length}`;
  document.getElementById("pfill").style.width = Math.round(openCount / catalog.length * 100) + "%";

  const counts = {};
  await Promise.all(catalog.filter(item => isOpen(item.key)).map(async item => {
    counts[item.key] = await attemptCount(item.key);
  }));

  document.getElementById("catalog").innerHTML = catalog.map(item => {
    const open = isOpen(item.key);
    return `
      <article class="card ${open ? "open" : "locked"}">
        <div class="card-top">
          <div class="tile" style="--accent:${item.accent}">${item.tile}</div>
          <span class="state ${open ? "on" : "off"}">${open ? "열림" : "잠김"}</span>
        </div>
        <h2>${item.title}</h2>
        <p>${item.copy}</p>
        <div class="chips">${item.chips.map(c => `<span>${c}</span>`).join("")}${open ? `<span>응시 ${counts[item.key]}/3</span>` : ""}</div>
        <div class="acts">
          ${open
            ? `<a href="${item.take}">응시 · 채점</a><a class="ghost" href="${item.report}">분석지</a>`
            : `<button class="off" type="button" disabled>잠김</button><a class="ask" href="https://open.kakao.com/me/gfield" target="_blank" rel="noopener">신청 문의</a>`}
        </div>
      </article>
    `;
  }).join("");
}

init();
</script>
</body>
</html>
