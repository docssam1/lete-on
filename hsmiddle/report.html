<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생각하는 황소 중등 성취도 진단분석지</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#14243b;font-family:Pretendard,sans-serif;font-weight:650}
.shell{width:min(1180px,calc(100% - 32px));margin:36px auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.topbar a,.topbar button{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:6px;font:850 13px Pretendard,sans-serif;text-decoration:none;border:0;cursor:pointer}
.topbar a{background:#e8f0f9;color:#173a6b}
.topbar button{background:#173a6b;color:#fff}
.mast{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #173a6b;padding-bottom:18px}
.eyebrow{margin:0 0 8px;color:#b07b00;font-size:12px;font-weight:950;letter-spacing:1px}
.mast h1{margin:0;font-size:30px;font-weight:950}
.mast .who{text-align:right}
.mast .who b{font-size:16px;color:#173a6b}
.mast .who span{display:block;font-size:12px;color:#61728a;margin-top:4px}
.panel{margin-top:20px;padding:24px;background:#fff;border:1px solid #d9e3ef;border-radius:8px;box-shadow:0 8px 24px rgba(22,45,78,.07)}
.login{width:min(520px,100%);margin:56px auto}
.login h2{font-size:24px;margin:0}
.login p{line-height:1.75;color:#52647d}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:18px}
input{width:100%;height:44px;padding:0 12px;border:1px solid #b8c8da;border-radius:6px;font:700 14px Pretendard,sans-serif}
button{height:42px;padding:0 14px;border:0;border-radius:6px;background:#173a6b;color:#fff;font:900 13px Pretendard,sans-serif;cursor:pointer}
button.secondary{background:#e8f0f9;color:#173a6b}
button:disabled{background:#c7d2e0;color:#5f7291;cursor:not-allowed}
.hidden{display:none!important}
.error{color:#bb2630;font-size:13px;font-weight:850}
.hint,.meta{font-size:12px;color:#667991}

.summary{display:grid;grid-template-columns:220px 1fr;gap:18px}
.score{padding:22px;border-radius:7px;background:#173a6b;color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}
.score b{display:block;font-size:46px;line-height:1.1}
.score span{font-size:12px;opacity:.85}
.badge{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:20px;background:#e3b314;color:#152238;font-size:13px;font-weight:950}
.comment{padding:16px 18px;border-left:4px solid #e3b314;background:#fff9ea;line-height:1.75}
.comment b{color:#173a6b;font-size:16px}
.gapline{margin-top:8px;font-size:12.5px;color:#7a5b00}

.roadmap{margin-top:22px}
.roadmap h3{margin:0 0 14px;font-size:15px}
.rm-track{position:relative;height:14px;border-radius:10px;background:linear-gradient(90deg,#c8d3e0 0%,#c8d3e0 37.5%,#a9c3de 37.5%,#a9c3de 50%,#8fb6dd 50%,#8fb6dd 62.5%,#6fa0d6 62.5%,#6fa0d6 72.5%,#e3b314 72.5%,#e3b314 100%)}
.rm-dot{position:absolute;top:-8px;width:18px;height:18px;border-radius:50%;background:#bb2630;border:3px solid #fff;box-shadow:0 0 0 2px #bb2630;transform:translateX(-50%)}
.rm-labels{position:relative;height:16px;margin-top:8px;font-size:11px;color:#61728a;font-weight:800}
.rm-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rm-labels span:first-child{transform:none}
.rm-labels span:last-child{transform:translateX(-100%)}
.rm-target{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:#e3b314;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(20,36,59,.2)}
.rm-target-row{position:relative;height:14px;margin-top:4px;font-size:10.5px;font-weight:950;color:#b07b00}
.rm-target-row span{position:absolute;transform:translateX(-50%);white-space:nowrap}

.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:0}
.chart-grid.chart-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.chart-grid.chart-grid-3{grid-template-columns:1fr}}
.chart{border:1px solid #dce5ef;border-radius:7px;padding:15px}
.chart h3{margin:0 0 12px;font-size:15px}
.bar-row{display:grid;grid-template-columns:minmax(96px,1fr) 2fr 45px;gap:8px;align-items:center;margin:9px 0;font-size:12px}
.track{position:relative;height:11px;overflow:hidden;border-radius:10px;background:#e7eef6}
.fill{height:100%;border-radius:10px;background:#1d679f}
.bar-row b{text-align:right;font-size:12px}
.track .goalmark{position:absolute;top:0;bottom:0;width:2px;background:#e3b314}

.history-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.history-actions button.ghost{background:#fff;color:#bb2630;border:1px solid #e2c3c6;height:32px;padding:0 10px;font-size:11.5px}
.group-summary{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#425a76;font-weight:850;margin:6px 0 4px}
.group-summary b{font-size:14px}
.qgroup{margin-top:14px;padding:13px 15px;border-radius:7px;border:1px solid #e5e0c8}
.qgroup h4{margin:0 0 4px;font-size:13.5px}
.qgroup.shaky{background:#fff3f2;border-color:#f2c9c9}
.qgroup.unresolved{background:#f4f5f7;border-color:#dfe2e6}
.qgroup.resolved{background:#f2fbf6;border-color:#c9e9d6}

.gradegrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.gridcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:6px;background:#eef3f9;font-size:10.5px;font-weight:850;color:#425a76}
.gridcell b{font-size:13px}
.gridcell.good{background:#e5f6ec;color:#147a4d}
.gridcell.bad{background:#fde9ea;color:#bd3038}
.gridcell.manual{background:#fff4d6;color:#9a6c00}
.gridcell.blank{background:#eef1f5;color:#8a99ab}
@media(max-width:720px){.gradegrid{grid-template-columns:repeat(5,1fr)}}

.detail{margin-top:16px;border:1px solid #dce5ef;border-radius:7px;padding:15px}
.detail h3{margin:0 0 9px;font-size:15px}
.comments{margin:0;padding-left:19px;line-height:1.8;color:#425a76;font-size:13px}
.comments li+li{margin-top:5px}
.weak{display:flex;flex-wrap:wrap;gap:8px}
.weak-card{padding:9px 11px;border-radius:6px;background:#f0f5fa;color:#30567f;font-size:12px;font-weight:800;display:flex;flex-direction:column;gap:6px}
.weak-card a{align-self:flex-start;background:#173a6b;color:#fff;padding:4px 9px;border-radius:4px;font-size:11px;font-weight:900;text-decoration:none}

table.errtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
table.errtable th,table.errtable td{border:1px solid #dce5ef;padding:8px 9px;text-align:left;vertical-align:top}
table.errtable th{background:#eef3f9;color:#30567f;font-size:12px}
table.errtable td.num{font-weight:950;color:#173a6b;text-align:center}
table.errtable a{color:#1d679f;font-weight:850}
.tag{display:inline-block;margin:0 4px 4px 0;padding:3px 6px;border-radius:4px;background:#eaf1f8;color:#345b84;font-size:11px;font-weight:850}

.clinic-note{margin-top:16px;padding:16px 18px;background:#173a6b;color:#eef3fb;border-radius:7px;line-height:1.75;font-size:13px}
.clinic-note b{color:#e3b314}
.watermark{margin-top:14px;text-align:right;color:#7c91ac;font-size:12px;font-weight:850}

.empty{padding:36px;text-align:center;color:#52647d;line-height:1.9}
.empty a{color:#173a6b;font-weight:900}

@media(max-width:720px){
  .shell{width:min(100% - 20px,1180px);margin:20px auto}
  .mast{flex-direction:column;align-items:start;gap:8px}
  .mast .who{text-align:left}
  .summary,.chart-grid,.form{grid-template-columns:1fr}
  .bar-row{grid-template-columns:90px 1fr 40px}
  table.errtable{font-size:11.5px}
}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,.no-print,.history-actions button{display:none!important}
  .shell{width:100%;max-width:none;margin:0;padding:0}
  .panel{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .chart-grid,.chart,.qgroup,.gradegrid,.detail{break-inside:avoid}
  .mast{break-after:avoid}
  table.errtable{break-inside:auto}
  table.errtable tr{break-inside:avoid;break-after:auto}
  table.errtable thead{display:table-header-group}
  table.errtable tfoot{display:table-footer-group}
  a{color:#173a6b!important;text-decoration:none}
}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar no-print">
    <a href="./diagnostic.html">← 진단으로 돌아가기</a>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="hint" id="recordHint"></span>
      <button id="recordBtn" onclick="recordSession()">이번 회차 기록 저장</button>
      <button onclick="window.print()">인쇄 / PDF 저장</button>
    </div>
  </div>

  <section class="panel login" id="login">

  <section class="hidden" id="app">
    <header class="mast">

</main>

<script>
const D=window.HSMIDDLE_DATA,byId=id=>document.getElementById(id);

/* ---- diagnostic.html에서 그대로 재사용하는 데이터/로직 ---- */
const units={1:'1단원 큰수',2:'6단원 규칙찾기',3:'3단원 곱셈과 나눗셈',4:'3단원 곱셈과 나눗셈',5:'2단원 각도',6:'2단원 각도',7:'2단원 분수의 곱셈',8:'3단원 소수의 덧셈과 뺄셈',9:'4단원 소수의 곱셈',10:'4단원 사각형',11:'4단원 사각형',12:'2단원 약수와 배수',13:'2단원 약수와 배수',14:'3단원 규칙과 대응',15:'3단원 규칙과 대응',16:'3단원 곱셈과 나눗셈',17:'2단원 약수와 배수',18:'2단원 약수와 배수',19:'5단원 직육면체',20:'4단원 약분과 통분',21:'4단원 약분과 통분',22:'5단원 분수의 덧셈과 뺄셈',23:'5단원 분수의 덧셈과 뺄셈',24:'2단원 분수의 곱셈',25:'6단원 다각형의 둘레와 넓이',26:'6단원 다각형의 둘레와 넓이',27:'2단원 분수의 곱셈',28:'2단원 분수의 곱셈',29:'2단원 소수의 나눗셈',30:'3단원 합동과 대칭',31:'4단원 비와 비율',32:'2단원 소수의 나눗셈',33:'2단원 소수의 나눗셈',34:'4단원 비와 비율',35:'5단원 원의 넓이',36:'6단원 직육면체의 겉넓이와 부피',37:'2단원 각기둥과 각뿔',38:'4단원 비례식과 비례배분',39:'4단원 소수의 곱셈',40:'3단원 합동과 대칭'};
const solutionNotes=[
  '16자리라는 조건부터 자리 수를 고정합니다. 2527조보다 작으면서 가장 큰 수이므로 앞자리부터 2527보다 작게 만들고, 남은 자리는 모두 9로 채우는 방법으로 비교하세요.',
  '일의 자리만 필요하므로 식 전체를 계산하지 않습니다. 밑을 일의 자리로 바꾼 뒤 3의 거듭제곱 일의 자리 3-9-7-1의 4개 주기를 사용하고, 지수를 4로 나눈 나머지를 확인하세요.',
  '4학년과 5학년은 목적지가 달라 버스를 따로 계산해야 합니다. 각 인원을 45로 나눈 뒤 남는 학생이 있으면 올림하고, 마지막에 두 대수를 더하세요.',
  '나머지를 r로 두면 수는 36×24+r입니다. r의 범위를 1부터 35까지로 제한한 뒤, 숫자카드 조건을 만족하는 세 자리 수만 세면 됩니다.',
  '그림에서 외각과 이웃한 내각의 합을 먼저 이용해 한 각을 구합니다. 이어서 삼각형의 세 내각의 합 180도를 사용해 미지의 각을 정리하세요.',
  '한 점에서 만나는 직선이 n개이면 맞꼭지각의 쌍은 n×(n-1)개입니다. 직선 수를 먼저 세고 공식에 넣어 중복 없이 셉니다.',
  '느려지는 시간은 실제 시간과 같은 단위로 바꿔 계산합니다. 10시부터 지난 시간 동안 느려진 초를 구한 뒤 실제 시각에서 빼고, 오전·오후 표기를 끝까지 확인하세요.',
  '수직선을 그려 기준이 되는 사람의 위치를 먼저 놓습니다. 뒤에 있는 거리와 앞에 있는 거리를 차례로 빼면서 목표 사람의 위치를 구하세요.',
  '같은 방향으로 가면 두 사람 사이의 거리는 속력의 차만큼 변합니다. 각자가 20분 동안 간 거리를 구한 뒤, 두 거리의 차를 구하면 됩니다.',
  '평행선의 성질을 쓰기 위해 필요한 보조선을 먼저 긋습니다. 동위각·엇각으로 옮길 수 있는 각을 표시하고, 이어진 각의 합으로 마지막 각을 구하세요.',
  '각을 따로따로 더하지 말고 하나의 삼각형을 찾으세요. 평행선에서 옮긴 각들을 삼각형의 내각으로 모아 180도에서 남는 값을 계산합니다.',
  '4명씩 앉을 때와 6명씩 앉을 때의 인원 범위를 각각 부등식으로 씁니다. 두 범위의 공통 부분만 남기면 가능한 학생 수가 정리됩니다.',
  '5의 배수 조건으로 끝자리를 먼저 정하고 큰 수부터 배열합니다. 만들어지는 수를 큰 순서로 세어 10번째 수를 찾은 다음, 백의 자리에서 반올림합니다.',
  '성냥개비 수가 늘어나는 규칙을 한 단계씩 표로 적습니다. 107개가 몇 번째 모양인지 찾고, 양끝에 따로 붙는 개수가 있는지도 확인하세요.',
  '대응 규칙은 한 쌍으로 확정하지 말고 두 쌍 이상으로 검산합니다. 먼저 두 수를 더해 2배한 값을 만들고, 그 결과들을 곱한 뒤 3을 빼는 순서를 지킵니다.',
  '나눗셈 복면산은 일의 자리부터 봅니다. 곱해서 6으로 끝나는 수를 먼저 정하고, 몫·나머지·각 자리의 서로 다른 조건을 차례로 대입하세요.',
  '15의 배수는 3과 5의 배수 조건을 동시에 만족해야 합니다. 끝자리 조건으로 후보를 줄인 뒤, 각 자리 수의 합이 3의 배수인지 확인합니다.',
  '톱니바퀴는 같은 위치에서 다시 만나는 횟수를 최소공배수로 맞춥니다. 맞물린 횟수는 톱니 수와 반비례하므로 하나의 기준 횟수로 세 톱니바퀴를 연결하세요.',
  '주사위의 마주 보는 두 면의 합은 7입니다. 맞닿아 사라지는 면과 바깥에 드러나는 면을 분리해서 세고, 한 면을 두 번 세지 않게 확인하세요.',
  '분수의 크기 비교는 공통분모를 만들거나 기준 분수와 비교합니다. 분자·분모를 동시에 같은 수로 곱한 분수인지 먼저 확인하고 순서를 정하세요.',
  '주어진 분모에 맞춰 같은 크기의 분수를 만듭니다. 기준 분수의 분자와 분모에 어떤 수를 곱해야 하는지 각각 적어 조건을 만족하는 경우만 고르세요.',
  '규칙적인 분수의 합은 한 항씩 계산하지 않습니다. 같은 모양의 묶음을 먼저 만들고, 각 묶음을 공통분모로 더한 뒤 전체 묶음 수를 곱하세요.',

/* 리포트 전용: 답안 입력/O·X 두 모드를 모두 읽어 O/X를 우선한다 */
function state(q){
  const oxVal=localStorage.getItem(`hsm-ox-${q[0]}`);
  if(oxVal==='o')return true;
  if(oxVal==='x')return false;
  const ansVal=localStorage.getItem(`hsm-answer-${q[0]}`);
  if(ansVal===null||ansVal==='')return null;
  return HSMIDDLE_GRADING.isCorrect(q,ansVal);
}

function grade(score){if(score>=82.5)return ['챌린지','고난도 문제에서 풀이 과정을 정리하며 완성도를 높여 주세요.'];if(score>=72.5)return ['에센스','에센스 이상 과정이 가능합니다. 약한 유형은 오답 유사문제로 보완해 주세요.'];if(score>=62.5)return ['어드밴스',`에센스까지 ${72.5-score}점 더 득점이 필요합니다.`];if(score>=50)return ['프라임',`어드밴스까지 ${62.5-score}점 더 득점이 필요합니다.`];if(score>=37.5)return ['프라임 컷',`프라임까지 ${50-score}점 더 득점이 필요합니다.`];return ['노력 요함',`프라임 컷까지 ${37.5-score}점 더 득점이 필요합니다.`]}

function aggregate(label,values){const map={};D.questions.forEach(q=>{const k=values(q),s=state(q);if(!map[k])map[k]={label:k,total:0,done:0,correct:0};map[k].total++;if(s!==null){map[k].done++;if(s)map[k].correct++}});return {label,rows:Object.values(map)}}
function rate(row){return row.done?Math.round(row.correct/row.done*100):null}
const DIFF_ORDER={'하':1,'중':2,'상':3,'최상':4};
function chartOrder(rows){
  if(rows.length&&rows.every(r=>DIFF_ORDER[r.label]))return [...rows].sort((a,b)=>DIFF_ORDER[a.label]-DIFF_ORDER[b.label]);
  const semOf=l=>{const m=String(l).match(/([456])-([12])/);return m?(+m[1])*10+(+m[2]):99};
  const unitOf=l=>{const m=String(l).match(/(\d+)단원/);return m?+m[1]:0};
  return [...rows].sort((a,b)=>semOf(a.label)-semOf(b.label)||unitOf(a.label)-unitOf(b.label));
}
function chart(data){return `<section class="chart"><h3>${data.label}</h3>${chartOrder(data.rows).map(r=>{const rt=r.done?Math.round(r.correct/r.done*100):0;return `<div class="bar-row"><span>${r.label}</span><div class="track"><div class="fill" style="width:${rt}%"></div></div><b>${r.correct}/${r.total}</b></div>`}).join('')}</section>`}
function analysisComments(score,sem,area,unit){const sampled=[...sem.rows,...area.rows,...unit.rows].filter(r=>r.done);if(!sampled.length)return ['답안 입력 또는 O/X 체크를 시작하면 학기·영역·단원별 코멘트가 자동으로 작성됩니다.','40문항은 문항당 2.5점이며, 현재 입력한 문항만 수행률 계산에 반영합니다.'];const weak=[...sampled].sort((a,b)=>rate(a)-rate(b))[0],strong=[...sampled].sort((a,b)=>rate(b)-rate(a))[0],c=[];c.push(`${weak.label} 수행률은 ${rate(weak)}%입니다. ${rate(weak)<60?'개념을 다시 확인한 뒤 해당 유형의 유사문제를 순서대로 풀어 보세요.':rate(weak)<80?'핵심 개념은 이해했지만 조건을 빠뜨리는지 풀이 과정을 점검해 보세요.':'현재 입력 기준으로 안정적입니다. 고난도 유형으로 확장해도 좋습니다.'}`);if(strong.label!==weak.label)c.push(`${strong.label}은 ${rate(strong)}%로 가장 안정적입니다. 이 영역은 풀이 속도와 검산 습관을 유지하면 됩니다.`);c.push(score>=70?'70점 이상입니다. 4·5·6학년 과정의 약점 단원만 보완한 뒤 심화 유형 드릴로 넘어갈 수 있습니다.':'70점 미만입니다. 부분분수·번분수처럼 낯선 개념이거나 4학년 유형의 공백이 있는지 먼저 확인하고, 한 단계 위 교재의 개념 탐구와 미션을 병행해 주세요.');return c}

async function enter(name){
  student=name;

  byId('login').classList.add('hidden');
  byId('app').classList.remove('hidden');

    if(back)back.href=`./exam.html?exam=${examKey}`;

/* ---- 서버 응시 기록 캐시 ----
   cloudAttempts: 서버 조회 성공 시 배열(빈 배열 포함), 실패 시 null(→ 로컬로 폴백)
   cloudOffline: 서버 연결 실패 안내 문구 표시 여부 */
let cloudAttempts=null;
let cloudOffline=false;

async function refreshCloudAttempts(){
  if(!window.HSMIDDLE_CLOUD){cloudAttempts=null;cloudOffline=true;return}
  const round=examKey||'diagnostic';
  const list=await HSMIDDLE_CLOUD.listAttempts(student,round);
  if(list===null){cloudAttempts=null;cloudOffline=true}
  else{cloudAttempts=list;cloudOffline=false}
}

function formatCloudDate(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime()))return String(iso||'');
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function cloudNoticeHtml(){
  if(!cloudOffline)return '';
  return `<p class="hint no-print" style="margin:8px 0 0;color:#95a4b7">기록을 서버에 저장하지 못했습니다. 이 브라우저에만 저장됩니다.</p>`;
}

function render(){
  if(examKey)renderExam();
  else renderDiagnostic();
  updateRecordButton();
}

/* 회차당 최대 응시(기록 저장) 3회 제한에 맞춰 상단 저장 버튼 상태를 갱신한다.
   "응시 1회" = 분석지에서 "이번 회차 기록 저장"을 누른 것으로 정의한다.
   서버 기록이 있으면(서버 조회 성공) 서버를 우선 사용하고, 실패 시에만 로컬로 폴백한다. */
function currentHistoryList(){
  if(cloudAttempts!==null){
    return cloudAttempts.map(a=>({
      date:formatCloudDate(a.created_at),
      score:a.score,
      correct:a.correct,
      answered:a.answered,
      states:a.states||{}
    }));
  }
  return examKey ? loadHistoryExam() : loadHistory();
}
function updateRecordButton(){
  const btn=byId('recordBtn'),hint=byId('recordHint');
  if(!btn)return;
  const count=currentHistoryList().length;
  if(count>=3){
    btn.disabled=true;
    btn.textContent='응시 기록 3회 완료';
    if(hint)hint.textContent='한 회차는 3회까지 기록할 수 있습니다.';
  }else{
    btn.disabled=false;
    btn.textContent=`이번 회차 기록 저장 (${count}/3)`;
    if(hint)hint.textContent='';
  }
}

function recordSession(){
  if(examKey)recordSessionExam();
  else recordSessionDiagnostic();
}

/* 서버 저장을 우선 시도하고, 결과에 따라 로컬 캐시와 화면을 갱신한다.
   ok:true → 로컬에도 저장 + 화면 갱신
   reason:'full' → 서버가 이미 3회로 판단(다른 기기 포함) → 저장하지 않고 버튼 상태만 갱신
   reason:'offline' → 로컬에만 저장 + 안내 문구 노출 */
async function submitAttempt(rec){
  const round=examKey||'diagnostic';
  let result={ok:false,reason:'offline'};
  if(window.HSMIDDLE_CLOUD){
    result=await HSMIDDLE_CLOUD.addAttempt(student,round,rec);
  }
  if(result.ok||result.reason==='offline'){
    saveLocalAttempt(rec);
  }
  await refreshCloudAttempts();
  render();
}

function saveLocalAttempt(rec){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const date=`${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const entry={date,score:rec.score,correct:rec.correct,answered:rec.answered,states:rec.states};
  if(examKey){
    const list=loadHistoryExam();
    list.push(entry);
    while(list.length>3)list.shift();
    saveHistoryExam(list);
  }else{
    const list=loadHistory();
    list.push(entry);
    while(list.length>3)list.shift();
    saveHistoryList(list);
  }
}

function clearHistory(){
  if(examKey)clearHistoryExam();
  else clearHistoryDiagnostic();
}

/* 등급별 처방 · 목표 대비 · 공통 조언 (2c) */
const LEVEL_ADVICE={
  '챌린지':'고난도(최상) 유형 완성도와 시간 관리 훈련에 집중하세요. 챌린지 과정은 13개월 최단기 이수 과정이므로 학습량 소화력이 관건입니다.',
  '에센스':'에센스 이상 과정이 가능합니다. 에센스는 어드밴스보다 약 10~15% 심화된 과정이므로 약한 유형을 유사문제로 보완한 뒤 진입해야 안정적입니다.'
};
function levelAdvice(level,score){
  if(LEVEL_ADVICE[level])return LEVEL_ADVICE[level];
  if(level==='어드밴스')return `에센스까지 ${72.5-score}점 남았습니다. 틀린 상·최상 난이도 유형부터 보완하세요.`;
  if(level==='프라임')return `어드밴스까지 ${62.5-score}점 남았습니다. 4·5학년 핵심 유형의 공백을 먼저 점검하세요.`;
  if(level==='프라임 컷')return `프라임까지 ${50-score}점 남았습니다. 하·중 난이도 오답부터 보완하세요.`;
  return '하·중 난이도 문항부터 다시 잡고, 한 단계 아래 교재의 개념 정리를 병행하세요.';
}
function targetComment(score){
  return score>=65?'목표 65점을 달성했습니다.':`목표 65점까지 ${65-score}점 남았습니다.`;
}
const COMMON_ADVICE="중등 진입 후 첫 고비는 '정수와 유리수 → 문자와 식' 단원입니다. 답만 쓰고 풀이 과정을 쓰지 않는 습관이 있다면, 지금부터 풀이를 손으로 정리하는 훈련을 병행하세요.";

/* 도형 영역이 약할 때 — 황소 기하는 중2·3 수준 난이도까지 출제된다 */
function geometryAdvice(area){
  if(!area||!area.rows)return '';
  const geo=area.rows.find(r=>r.label==='도형');
  if(!geo||!geo.done)return '';
  const r=rate(geo);
  if(r>=80)return '';
  return `도형 수행률이 ${r}%입니다. 생각하는 황소의 기하 문항은 초등 교육과정 범위 안에서 출제되더라도 중2·3 수준의 난이도까지 다루기 때문에, 단원 복습만으로는 부족할 수 있습니다. 보조선 긋기·등적변형·닮음비 감각을 별도 훈련으로 잡아 주세요.`;
}

/* 실전 모의고사에는 유사문제가 없으므로 처방 문구를 풀이 영상 기준으로 치환 */
function noSimilar(s){
  return String(s)
    .replaceAll('약한 유형은 오답 유사문제로 보완해 주세요','약한 유형은 풀이 영상으로 보완해 주세요')
    .replaceAll('약한 유형을 유사문제로 보완한 뒤','약한 유형을 풀이 영상으로 보완한 뒤')
    .replaceAll('해당 유형의 유사문제를 순서대로 풀어 보세요','풀이 영상으로 개념을 다시 확인해 보세요')
    .replaceAll('유사문제','풀이 영상');
}

function errorTable(errors){
  if(!errors.length)return '<p class="hint">오답 문항이 없습니다. 현재 입력 기준으로 채점된 문항은 모두 정답입니다.</p>';
  const rates=window.HSMIDDLE_STATS&&window.HSMIDDLE_STATS.rates;
  const rateTh=rates?'<th>정답률</th>':'';
  return `<table class="errtable"><thead><tr><th>번호</th><th>단원</th><th>유형</th><th>난이도</th>${rateTh}<th>처방</th><th>풀이 영상</th></tr></thead><tbody>
    ${errors.map(q=>{
      const start=videoStarts[q[0]-1];
      let rateTd='';
      if(rates){
        const r=rates[q[0]];
        if(r==null){rateTd='<td>-</td>';}
        else{
          const pct=Math.round(r*100);
          const badge=pct>=60?' <span class="tag" style="background:#e3b314;color:#152238;font-weight:950">최우선</span>':'';
          rateTd=`<td>정답률 ${pct}%${badge}</td>`;

}

function weakTypeCards(errors){
  const rates=window.HSMIDDLE_STATS&&window.HSMIDDLE_STATS.rates;
  const groups=Object.values(errors.reduce((m,q)=>{(m[q[5]]??=[]).push(q);return m},{}));
  if(!groups.length)return '<p class="hint">오답을 체크하면 보완이 필요한 유형이 여기에 표시됩니다.</p>';
  if(rates){
    groups.sort((a,b)=>{
      const ra=Math.max(...a.map(q=>rates[q[0]]??-1));
      const rb=Math.max(...b.map(q=>rates[q[0]]??-1));
      return rb-ra;
    });
  }
  return `<div class="weak">${groups.map(g=>`<div class="weak-card"><span>${g[0][5]} · ${g.map(q=>q[0]+'번').join(', ')}</span><a href="javascript:void(0)" onclick="openPractice([${g.map(q=>q[0]).join(',')}])">유사문제 풀기</a></div>`).join('')}</div>`;
}

/* ================= 모의고사 분석지 모드 (exam=mock-1|mock-2|mock-3|final) ================= */

function examNorm(v){return String(v||'').replace(/\s/g,'').replaceAll('㎡','m²').replaceAll('제곱센티미터','cm²').toLowerCase()}
function examMatches(given,expected){
  if(!expected||expected==='수동'||expected==='복수·수동')return null;
  const g=examNorm(given),e=examNorm(expected);
  if(g===e)return true;
  if(e.includes('또는'))return e.split('또는').map(examNorm).includes(g);
  return false;
}

/* 문항별 상태 산출: states[n] = 'o' | 'x' | 'manual' | null(미입력) */
function examAnalyze(){
  const exam=HSMIDDLE_EXAMS[examKey];
  let checked=0,correct=0,manual=0;
  const states={};
  for(let n=1;n<=exam.questions;n++){
    const isOx=exam.oxQuestions&&exam.oxQuestions.includes(n);
    const fields=exam.answerFields&&exam.answerFields[n];
    if(isOx){
      const v=localStorage.getItem(`hs-${examKey}-${n}`);
      if(v==null||v===''){states[n]=null;continue}
      checked++;
      const ok=v==='o';
      states[n]=ok?'o':'x';
      if(ok)correct++;
      continue;
    }
    if(fields){
      const values=fields.map((f,i)=>localStorage.getItem(`hs-${examKey}-${n}-${i}`));
      if(values.some(v=>v==null||String(v).trim()==='')){states[n]=null;continue}
      checked++;
      const ok=fields.every((f,i)=>examMatches(values[i],f.answer)===true);
      states[n]=ok?'o':'x';
      if(ok)correct++;
      continue;
    }
    const v=localStorage.getItem(`hs-${examKey}-${n}`);
    if(v==null||String(v).trim()===''){states[n]=null;continue}
    checked++;
    const m=examMatches(v,exam.answers[n-1]);
    if(m===true){states[n]='o';correct++}
    else if(m===false){states[n]='x'}
    else{states[n]='manual';manual++}
  }
  return {checked,correct,manual,states,questions:exam.questions};
}

function examAggregate(meta,label,valueFn,states,total){
  const map={};
  for(let n=1;n<=total;n++){
    if(!meta[n])continue;
    const k=valueFn(meta[n]);
    if(!map[k])map[k]={label:k,total:0,done:0,correct:0};
    map[k].total++;
    const s=states[n];
    if(s==='o'||s==='x'){map[k].done++;if(s==='o')map[k].correct++}
  }
  return {label,rows:Object.values(map)};
}

function examGradeGrid(analysis){
  let cells='';
  for(let n=1;n<=analysis.questions;n++){
    const s=analysis.states[n];
    let cls='blank',label='-';
    if(s==='o'){cls='good';label='O'}
    else if(s==='x'){cls='bad';label='X'}
    else if(s==='manual'){cls='manual';label='확인'}
    cells+=`<div class="gridcell ${cls}"><span>${n}</span><b>${label}</b></div>`;
  }
  return `<div class="gradegrid">${cells}</div>`;
}

function examErrorTable(analysis){
  const exam=HSMIDDLE_EXAMS[examKey];
  const wrongNums=Object.keys(analysis.states).map(Number).filter(n=>analysis.states[n]==='x');
  const manualNums=Object.keys(analysis.states).map(Number).filter(n=>analysis.states[n]==='manual');
  let manualNote='';
  if(manualNums.length){
    manualNote=`<p class="hint" style="margin:0 0 8px">수동 확인 문항(${manualNums.join(', ')}번)은 점수에 포함되지 않았습니다. 풀이와 함께 확인 후 O/X로 확정하세요.</p>`;
  }
  if(!wrongNums.length)return manualNote+'<p class="hint">자동 채점 기준으로 오답 문항이 없습니다.</p>';
  const tipMeta=(window.HSMIDDLE_EXAM_META&&HSMIDDLE_EXAM_META[examKey])||null;
  const hasTips=!!(tipMeta&&wrongNums.some(n=>tipMeta[n]&&tipMeta[n].tip));
  const videoBase=(D.videos&&D.videos[examKey])||'';
  const vid=(videoBase.match(/[?&]v=([\w-]{6,})/)||videoBase.match(/youtu\.be\/([\w-]{6,})/)||[])[1];
  const jump=n=>{
    const t=tipMeta&&tipMeta[n]&&tipMeta[n].t;
    if(!vid||typeof t!=='number')return '';
    return `<div><a href="https://youtu.be/${vid}?t=${t}" target="_blank" rel="noopener">▶ ${n}번 풀이 영상</a></div>`;
  };
  const rows=wrongNums.map(n=>{
    const fields=exam.answerFields&&exam.answerFields[n];
    const mine=fields?fields.map((f,i)=>localStorage.getItem(`hs-${examKey}-${n}-${i}`)||'').join(' / '):(localStorage.getItem(`hs-${examKey}-${n}`)||'');
    const note=exam.answerNotes&&exam.answerNotes[n];
    const img=exam.answerImages&&exam.answerImages[n];
    const noteHtml=note?`<details><summary>풀이 보기</summary><pre style="white-space:pre-wrap;margin:6px 0 0;font:700 12px/1.6 Pretendard,sans-serif">${note}</pre></details>`:'';
    const imgHtml=img?`<div><a href="${img}" target="_blank" rel="noopener">답안 이미지 보기</a></div>`:'';
    const tipTd=hasTips?`<td>${tipMeta[n]&&tipMeta[n].tip?tipMeta[n].tip:'-'}</td>`:'';
    const jumpHtml=jump(n);
    return `<tr><td class="num">${n}</td><td>${mine}</td><td>${exam.answers[n-1]}</td>${tipTd}<td>${jumpHtml}${noteHtml}${imgHtml}${!note&&!img&&!jumpHtml?'-':''}</td></tr>`;
  }).join('');
  const tipTh=hasTips?'<th>처방</th>':'';
  return `${manualNote}<table class="errtable"><thead><tr><th>번호</th><th>내 답안</th><th>정답</th>${tipTh}<th>비고</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function clearHistoryExam(){
  if(!confirm('이 브라우저에 저장된 기록만 지웁니다. 서버에 저장된 응시 횟수는 그대로 유지됩니다.'))return;
  localStorage.removeItem(historyKeyExam());
  render();
}

function examQuestionGroupCard(cls,icon,title,desc,nums,meta){
  if(!nums.length)return '';
  return `<div class="qgroup ${cls}">
    <h4>${icon} ${title} <span class="hint">(${nums.length}문항)</span></h4>
    <p class="hint" style="margin:0 0 8px">${desc}</p>
    <div class="weak">${nums.map(n=>`<div class="weak-card"><span>${n}번${meta&&meta[n]?' · '+meta[n].unit:''}</span></div>`).join('')}</div>
  </div>`;
}

function examRoundComparePanel(list,total,meta){
  if(list.length<2)return '';
  const latest=list[list.length-1],prev=list[list.length-2];
  const shaky=[],unresolved=[],resolved=[];
  for(let n=1;n<=total;n++){
    const p=prev.states[n],l=latest.states[n];
    const pX=p==='x'||p==null,lX=l==='x'||l==null,pO=p==='o',lO=l==='o';
    if(pO&&lX)shaky.push(n);
    else if(pX&&lX)unresolved.push(n);
    else if(pX&&lO)resolved.push(n);
  }
  return `<section class="detail">
    <h3>문항 회차 비교 (직전 회차 → 최근 회차)</h3>
    <div class="group-summary"><span>🔴 흔들림 <b>${shaky.length}</b></span><span>⚫ 미해결 <b>${unresolved.length}</b></span><span>🟢 해결 <b>${resolved.length}</b></span></div>
    ${examQuestionGroupCard('shaky','🔴','흔들린 문항','다시 틀렸습니다 — 우연히 맞았거나 개념이 불안정한 유형입니다. 최우선 복습하세요.',shaky,meta)}
    ${examQuestionGroupCard('unresolved','⚫','미해결 문항','아직 해결되지 않은 문항입니다. 풀이와 함께 다시 확인하세요.',unresolved,meta)}
    ${examQuestionGroupCard('resolved','🟢','해결된 문항','해결됐습니다 — 유사한 유형으로 한 번 더 확인하세요.',resolved,meta)}
  </section>`;
}

function examHistoryPanel(analysis){
  const list=currentHistoryList();
  if(!list.length)return cloudNoticeHtml();
  const meta=(window.HSMIDDLE_EXAM_META&&HSMIDDLE_EXAM_META[examKey])||null;
  return `<section class="panel">
    <h3 style="margin:0 0 4px;font-size:16px">응시 기록 · 회차 비교</h3>
    ${scoreTrendPanel(list)}
    ${examRoundComparePanel(list,analysis.questions,meta)}
    <div class="history-actions">
      <button class="ghost no-print" onclick="clearHistory()">화면 기록 지우기</button>
      <span class="hint">응시 기록은 이 브라우저에 저장됩니다. 같은 기기·브라우저에서 확인하세요.</span>
    </div>
    ${cloudNoticeHtml()}
  </section>`;
}

function renderExam(){
  const exam=HSMIDDLE_EXAMS[examKey];
  const meta=(window.HSMIDDLE_EXAM_META&&HSMIDDLE_EXAM_META[examKey])||null;
  const analysis=examAnalyze();
  const body=byId('reportBody');
  if(analysis.checked===0){
    body.innerHTML=`<section class="panel empty">
      <p><b>아직 채점된 문항이 없습니다.</b><br>exam.html에서 답안을 입력한 뒤 다시 확인해 주세요.</p>
      <p><a href="./exam.html?exam=${examKey}">→ exam.html에서 채점하러 가기</a></p>
    </section>`;
    return;
  }

  const score=Math.round(analysis.correct*2.5*100)/100;
  const [level,gapTextRaw]=grade(score);
  const gapText=noSimilar(gapTextRaw);

  let metaSection='';
  if(meta){
    const sem=examAggregate(meta,'학기별 수행률',m=>m.sem,analysis.states,analysis.questions);
    const area=examAggregate(meta,'영역별 수행률',m=>m.area,analysis.states,analysis.questions);
    const hard=examAggregate(meta,'난이도별 수행률',m=>m.diff,analysis.states,analysis.questions);
    const unit=examAggregate(meta,'단원별 수행률',m=>`${m.sem} ${m.unit}`,analysis.states,analysis.questions);
    const comments=[...analysisComments(score,sem,area,unit),geometryAdvice(area),levelAdvice(level,score),targetComment(score),COMMON_ADVICE].filter(Boolean).map(noSimilar);
    metaSection=`<section class="panel">
      <div class="chart-grid">${chart(sem)}${chart(area)}${chart(hard)}${chart(unit)}</div>
      <section class="detail">
        <h3>학습 코멘트</h3>
        <ul class="comments">${comments.map(c=>`<li>${c}</li>`).join('')}</ul>
      </section>
    </section>`;
  }

  const videoUrl=D.videos&&D.videos[examKey];

  body.innerHTML=`
    <section class="panel">
      ${videoUrl?`<p class="hint" style="margin:0 0 12px"><a href="${videoUrl}" target="_blank" rel="noopener">→ ${exam.title} 전체 수업 영상</a></p>`:''}
      <div class="summary">
        <div class="score">
          <span>종합 점수</span>
          <b>${score}</b>
          <span>/ 100점</span>
          <span class="badge">${level}</span>
        </div>
        <div class="comment">
          <b>${level}</b><br>${gapText}
          <div class="gapline">입력 ${analysis.checked}/${analysis.questions}문항 · 자동 정답 ${analysis.correct}문항 · 수동 확인 ${analysis.manual}문항</div>
          ${analysis.manual?`<div class="gapline">수동 확인 문항은 점수에 포함되지 않았습니다. 풀이와 함께 확인 후 O/X로 확정하세요.</div>`:''}
        </div>
      </div>
      ${roadmap(score)}
    </section>

    ${metaSection}

    <section class="panel">
      <h3 style="margin:0 0 4px;font-size:16px">정오표</h3>
      <p class="hint" style="margin:0 0 8px">O(정답) · X(오답) · 확인(수동 확인 필요) · -(미입력)</p>
      ${examGradeGrid(analysis)}
    </section>

    <section class="panel">
      <h3 style="margin:0 0 4px;font-size:16px">오답 문항 상세</h3>
      ${examErrorTable(analysis)}
    </section>

    <section class="panel">
      <div class="watermark">${student} 학생 · GFIELD</div>
    </section>

    ${examHistoryPanel(analysis)}
  `;
}
</script>
</body>
</html>
