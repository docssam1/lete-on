<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중등 진단 인쇄</title><style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}body{margin:0;background:#e8edf4;font-family:Pretendard,sans-serif;color:#17263b}.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:9px 18px;background:#fff;border-bottom:1px solid #cbd6e3}.bar b{font-size:15px}.bar span{display:block;margin-top:3px;color:#63748b;font-size:11px;font-weight:700}.bar-actions{display:flex;gap:7px;flex-wrap:wrap}button{height:38px;padding:0 13px;border:1px solid #193a6a;border-radius:4px;background:#193a6a;color:#fff;font:850 12px Pretendard,sans-serif;cursor:pointer}button.secondary{background:#fff;color:#193a6a}.pages{width:min(900px,100%);margin:0 auto;padding:22px 10px 44px;display:grid;gap:18px}.page{position:relative;background:#fff;box-shadow:0 8px 24px rgba(24,42,66,.18)}.page>img{display:block;width:100%;height:auto}.mark{position:absolute;inset:0;overflow:hidden;pointer-events:none}.mark span{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-32deg);white-space:nowrap;color:rgba(25,58,106,.10);font-size:30px;font-weight:950}.mark span:nth-child(1){top:25%}.mark span:nth-child(2){top:50%}.mark span:nth-child(3){top:75%}
.review-page{min-height:1120px;padding:42px 46px 36px}.review-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:2px solid #193a6a}.review-head span{color:#b07b00;font-size:11px;font-weight:950}.review-head h1{margin:5px 0 0;font-size:24px}.review-meta{text-align:right;color:#63748b;font-size:12px;line-height:1.6}.question-label{display:flex;align-items:center;gap:10px;margin:26px 0 12px}.question-label b{display:grid;place-items:center;width:34px;height:34px;background:#193a6a;color:#fff;font-size:16px}.question-label span{font-size:13px;font-weight:850}.crop{position:relative;width:100%;min-height:610px;border:1px solid #ccd7e3;background:#fff;overflow:hidden;display:grid;place-items:center}.crop canvas{display:block;width:100%;height:auto}.answer-lines{margin-top:22px;color:#63748b;font-size:12px}.answer-lines i{display:block;height:28px;border-bottom:1px solid #b8c8da}.answer-sheet{min-height:1120px;padding:48px}.answer-sheet h1{margin:0;padding-bottom:15px;border-bottom:3px solid #193a6a;font-size:26px}.answer-sheet p{color:#63748b;font-size:13px}.answer-table{width:100%;margin-top:25px;border-collapse:collapse}.answer-table th,.answer-table td{border:1px solid #cbd6e3;padding:12px;text-align:left}.answer-table th{width:70px;background:#eef3f9;text-align:center}.answer-table td{font-weight:800}.empty{padding:60px;text-align:center;color:#63748b}
@media(max-width:620px){.bar{align-items:flex-start;flex-direction:column}.pages{padding:10px}.review-page,.answer-sheet{min-height:0;padding:24px 18px}.crop{min-height:0}.review-head h1{font-size:19px}.review-meta{font-size:10px}}
@page{size:A4;margin:0}@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bar{display:none}.pages{width:auto;margin:0;padding:0;display:block}.page{width:210mm;height:297mm;box-shadow:none;break-after:page;overflow:hidden}.page:last-child{break-after:auto}.review-page{padding:13mm 14mm 10mm}.review-page .crop{height:174mm;min-height:0}.review-page .crop canvas{max-height:100%;object-fit:contain}.answer-sheet{padding:15mm}.answer-lines i{height:9mm}}
.print-sheet{position:relative;width:100%;min-height:1120px;padding:36px 40px 32px;background:#fff;box-shadow:0 8px 24px rgba(24,42,66,.18)}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;padding-bottom:11px;border-bottom:2px solid #193a6a}.sheet-head span{color:#b07b00;font-size:11px;font-weight:950}.sheet-head h1{margin:5px 0 0;font-size:23px}.sheet-meta{text-align:right;color:#63748b;font-size:11px;line-height:1.6}.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;height:950px}.review-card{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;border:1px solid #cbd6e3;background:#fff;overflow:hidden}.review-card header{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid #dbe4ee;background:#f6f9fc}.review-card header b{display:grid;place-items:center;flex:0 0 25px;height:25px;background:#193a6a;color:#fff;font-size:12px}.review-card header span{min-width:0;font-size:10px;font-weight:850;line-height:1.35}.review-card .crop{min-height:0;padding:5px;border:0}.review-card .crop canvas{max-width:100%;max-height:100%;width:auto;height:auto}.review-card .answer-lines{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:end;margin:0 9px 9px;color:#63748b;font-size:10px}.review-card .answer-lines i{display:block;height:18px;border-bottom:1px solid #9fb0c4}.linked-page{position:relative;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(24,42,66,.18)}.linked-page header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #cbd6e3;background:#f6f9fc}.linked-page header b{font-size:13px}.linked-page header span{color:#63748b;font-size:11px;font-weight:800}.linked-page img{display:block;width:100%;height:auto}.linked-correction{margin:0;padding:9px 14px;border-bottom:1px solid #edd08d;background:#fff9e9;color:#684b00;font-size:11px;line-height:1.55}.linked-correction b{display:block;margin-bottom:2px}.linked-section-title{margin:0;padding:13px 14px 10px;border-bottom:2px solid #193a6a;background:#fff;color:#193a6a;font-size:15px}.linked-section-title span{float:right;color:#63748b;font-size:11px;font-weight:700}.denied{padding:60px 32px;background:#fff;text-align:center;color:#63748b;line-height:1.8}.denied h1{margin:0 0 8px;color:#193a6a;font-size:22px}@media(max-width:620px){.print-sheet{min-height:0;padding:22px 14px}.sheet-head h1{font-size:19px}.sheet-meta{font-size:10px}.review-grid{grid-template-columns:1fr;grid-template-rows:none;height:auto}.review-card{min-height:300px}.linked-page header{align-items:flex-start;flex-direction:column;gap:3px}}@media print{.print-sheet,.linked-page{width:210mm;height:297mm;min-height:0;box-shadow:none;break-after:page;overflow:hidden}.print-sheet:last-child,.linked-page:last-child{break-after:auto}.print-sheet{padding:10mm 12mm 8mm}.sheet-head{margin-bottom:4mm;padding-bottom:3mm}.sheet-head h1{font-size:17pt}.review-grid{height:252mm;gap:3mm}.review-card header{padding:2.2mm 2.5mm}.review-card header b{flex-basis:6mm;height:6mm;font-size:8pt}.review-card header span{font-size:7.5pt}.review-card .crop{padding:1.5mm}.review-card .answer-lines{margin:0 2.5mm 2.5mm;font-size:7.5pt}.review-card .answer-lines i{height:6mm}.linked-page header{padding:4mm 5mm}.linked-page header b{font-size:10pt}.linked-page header span{font-size:8pt}.linked-page img{max-height:273mm;object-fit:contain;object-position:top}.linked-section-title{display:none}.linked-correction{padding:3mm 5mm;font-size:8pt}}</style></head><body><header class="bar"><div><b id="title">문제</b><span id="meta"></span></div><div class="bar-actions"><button class="secondary" onclick="history.back()">돌아가기</button><button class="secondary" onclick="openReport()">진단분석지</button><button onclick="print()">인쇄</button></div></header><main class="pages" id="pages"></main><script src="./data.js"></script><script src="./shared-auth.js"></script><script src="./hsm-cloud.js"></script><script src="./question-bank/data/schema.js"></script><script src="./question-bank/data/type-registry.js"></script><script src="./question-bank/data/source-page-index.js"></script><script src="./question-bank/data/item-index.js"></script><script>
const TICKET_PREFIX='hsm-linked-print-v1:',p=new URLSearchParams(location.search),doc=p.get('doc')||'',mode=['problem','answer','solution','combined'].includes(p.get('mode'))?p.get('mode'):'problem',pages=document.getElementById('pages');
let student=(p.get('student')||'학생').slice(0,30);const rawNumbers=[...new Set((p.get('qs')||'').split(',').map(Number).filter(n=>n>=1&&n<=40))].sort((a,b)=>a-b);
function openReport(){open('./report.html','_blank','noopener')}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function header(title,detail){document.getElementById('title').textContent=title;document.getElementById('meta').textContent=detail}
function mark(){const box=document.createElement('div');box.className='mark';for(let i=0;i<3;i++){const span=document.createElement('span');span.textContent=`${student} 학생 · GFIELD`;box.append(span)}return box}
function add(src,alt){const section=document.createElement('section'),img=document.createElement('img');section.className='page';img.src=src;img.alt=alt;section.append(img,mark());pages.append(section)}
function questionMeta(number){return (window.HSMIDDLE_DATA.questions||[]).find(item=>item[0]===number)||[number,'','','','','']}
function message(title,detail){header(title,detail);pages.innerHTML=`<section class="denied"><h1>${esc(title)}</h1><p>${esc(detail)}</p></section>`}
function reviewCrop(number){const page=Math.ceil(number/4),slot=(number-1)%4,left=slot<2,top=slot%2===0;return {page,sx:left?.048:.5,sy:page===1?(top?.18:.54):(top?.045:.49),sw:.452,sh:page===1?(top?.36:.38):.43}}
function drawCrop(canvas,number){const crop=reviewCrop(number),img=new Image();img.onload=()=>{const sx=Math.round(img.naturalWidth*crop.sx),sy=Math.round(img.naturalHeight*crop.sy),sw=Math.round(img.naturalWidth*crop.sw),sh=Math.round(img.naturalHeight*crop.sh),ctx=canvas.getContext('2d');canvas.width=sw;canvas.height=sh;ctx.fillStyle='#fff';ctx.fillRect(0,0,sw,sh);ctx.drawImage(img,sx,sy,sw,sh,0,0,sw,sh)};img.src=`./assets/print/diagnostic/page-${String(crop.page).padStart(2,'0')}.png`}
function addReviewSheet(numbers){const sheet=document.createElement('section');sheet.className='print-sheet';sheet.innerHTML=`<header class="sheet-head"><div><span>GFIELD MIDDLE DIAGNOSTIC</span><h1>진단 오답 다시 풀기</h1></div><div class="sheet-meta">${esc(student)} 학생<br>${numbers.length}문항 · 문제만</div></header><div class="review-grid"></div>`;const grid=sheet.querySelector('.review-grid');numbers.forEach(number=>{const q=questionMeta(number),card=document.createElement('article');card.className='review-card';card.innerHTML=`<header><b>${number}</b><span>${esc(q[5])}</span></header><div class="crop"><canvas aria-label="진단 ${number}번 문제"></canvas></div><div class="answer-lines">답<i></i></div>`;grid.append(card);drawCrop(card.querySelector('canvas'),number)});sheet.append(mark());pages.append(sheet)}
function addAnswerSheet(numbers){const section=document.createElement('section');section.className='print-sheet answer-sheet';section.innerHTML=`<header class="sheet-head"><div><span>GFIELD MIDDLE DIAGNOSTIC</span><h1>선택 문항 정답</h1></div><div class="sheet-meta">${esc(student)} 학생<br>${numbers.length}문항</div></header><table class="answer-table"><tbody>${numbers.map(number=>`<tr><th>${number}번</th><td>${esc(questionMeta(number)[1])}</td></tr>`).join('')}</tbody></table>`;section.append(mark());pages.append(section)}
function addDiagnosticReview(numbers){if(!numbers.length){message('진단 오답 다시 풀기','인쇄할 오답 번호가 없습니다.');return}for(let i=0;i<numbers.length;i+=4)addReviewSheet(numbers.slice(i,i+4));if(mode==='answer')addAnswerSheet(numbers)}
function bundleFor(number){const type=(window.HSMIDDLE_QUESTION_TYPE_REGISTRY?.types||[]).find(entry=>entry.diagnosticNumber===number),sourcePages=(window.HSMIDDLE_SOURCE_PAGE_INDEX?.pages||[]).filter(entry=>entry.diagnosticNumber===number).sort((a,b)=>a.pageNumber-b.pageNumber),items=(window.HSMIDDLE_QUESTION_ITEM_INDEX?.items||[]).filter(entry=>entry.diagnosticNumber===number);const verified=Boolean(type&&type.sourceReviewStatus==='verified'&&type.releaseStatus!=='locked'&&items.length&&sourcePages.length&&sourcePages.every(entry=>entry.evidenceStatus==='verified'&&entry.role!=='unreviewed'));if(!verified)return null;const role=roles=>sourcePages.filter(entry=>roles.includes(entry.role));return {number,title:type.title,items,correction:type.sourceCorrectionNote||'',problem:role(['problem']),answer:role(['quick-answer','answer-solution']),solution:role(['solution','answer-solution'])}}
function pageLabel(role){return role==='problem'?'문제':role==='quick-answer'?'빠른정답':'정답·풀이'}
function addLinkedPage(bundle,entry){const article=document.createElement('section');article.className='linked-page';const src='./'+String(entry.assetPath||'').replace(/^hsmiddle\//,'');article.innerHTML=`<header><b>${bundle.number}번 연계 · ${esc(bundle.title)}</b><span>${pageLabel(entry.role)} · ${bundle.items.length}문항</span></header>${bundle.correction&&entry.role!=='problem'?`<aside class="linked-correction"><b>원본 풀이 정정</b>${esc(bundle.correction)}</aside>`:''}<img src="${src}" alt="${bundle.number}번 연계 유사문제 ${pageLabel(entry.role)} ${entry.pageNumber}쪽">`;article.append(mark());pages.append(article)}
function addLinkedPart(bundles,kind){const list=bundles.flatMap(bundle=>bundle[kind].map(entry=>({bundle,entry})));if(!list.length)return;const labels={problem:'문제',answer:'정답',solution:'정답·풀이'},heading=document.createElement('h1');heading.className='linked-section-title';heading.innerHTML=`${labels[kind]}<span>${bundles.length}개 연결 유형</span>`;pages.append(heading);list.forEach(({bundle,entry})=>addLinkedPage(bundle,entry))}
function addLinkedSimilar(numbers){const bundles=numbers.map(bundleFor).filter(Boolean),excluded=numbers.filter(number=>!bundleFor(number));if(!bundles.length){message('연계 유사문제 인쇄','원본 문제·정답·풀이 연결이 확인된 문항이 없습니다.');return}const label={problem:'문제만',answer:'정답만',solution:'정답·풀이',combined:'문제 + 정답·풀이'}[mode];header('진단 연계 유사문제',`${student} 학생 전용 · ${label} · 원본 연결 확인`);if(mode==='problem')addLinkedPart(bundles,'problem');else if(mode==='answer')addLinkedPart(bundles,'answer');else if(mode==='solution'){addLinkedPart(bundles,'answer');addLinkedPart(bundles,'solution')}else{addLinkedPart(bundles,'problem');addLinkedPart(bundles,'answer');addLinkedPart(bundles,'solution')}if(excluded.length){const note=document.createElement('section');note.className='empty';note.textContent=`${excluded.join(', ')}번은 원본 문제·정답·풀이 연결을 확인할 수 없어 제외했습니다.`;pages.append(note)}}
async function linkedNumbers(){const token=p.get('ticket')||'';let ticket=null;try{ticket=JSON.parse(localStorage.getItem(TICKET_PREFIX+token)||'null')}catch(e){}if(!token||!ticket||ticket.access!=='diagnostic'||!Array.isArray(ticket.numbers)||Date.now()>Number(ticket.expiresAt))return null;const saved=window.HSMIDDLE_AUTH.readSession();if(!saved.valid)return null;const session=await window.HSMIDDLE_AUTH.refreshSession();if(!session||!session.valid||!(session.admin||(session.name===ticket.student&&session.access.includes('diagnostic'))))return null;localStorage.removeItem(TICKET_PREFIX+token);student=String(ticket.student||session.name).slice(0,30);return [...new Set(ticket.numbers.map(Number).filter(n=>n>=1&&n<=40))].sort((a,b)=>a-b)}
async function start(){if(doc==='diagnostic'){header('중등 선발 사전 점검 모의고사',`${student} 학생 전용 · 시험지 · 인쇄 워터마크 적용`);for(let n=1;n<=10;n++)add(`./assets/print/diagnostic/page-${String(n).padStart(2,'0')}.png`,`진단 시험지 ${n}쪽`);return}if(doc==='diagnostic-review'){header('진단 오답 다시 풀기',`${student} 학생 전용 · ${mode==='answer'?'문제 + 정답':'문제만'} · 인쇄 워터마크 적용`);addDiagnosticReview(rawNumbers);return}if(doc==='linked-similar'){const numbers=await linkedNumbers();if(!numbers){message('연계 유사문제 인쇄','현재 진단평가 승인 세션으로 진단분석지에서 다시 열어 주세요.');return}addLinkedSimilar(numbers);return}message('인쇄할 자료를 찾을 수 없습니다.','진단분석지에서 다시 선택해 주세요.')}
window.openReport=openReport;start();
</script></body></html>
