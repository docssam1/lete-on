<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중등 진단 인쇄</title><style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}body{margin:0;background:#e8edf4;font-family:Pretendard,sans-serif;color:#17263b}.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:9px 18px;background:#fff;border-bottom:1px solid #cbd6e3}.bar b{font-size:15px}.bar span{display:block;margin-top:3px;color:#63748b;font-size:11px;font-weight:700}.bar-actions{display:flex;gap:7px;flex-wrap:wrap}button{height:38px;padding:0 13px;border:1px solid #193a6a;border-radius:4px;background:#193a6a;color:#fff;font:850 12px Pretendard,sans-serif;cursor:pointer}button.secondary{background:#fff;color:#193a6a}.pages{width:min(900px,100%);margin:0 auto;padding:22px 10px 44px;display:grid;gap:18px}.page{position:relative;background:#fff;box-shadow:0 8px 24px rgba(24,42,66,.18)}.page>img{display:block;width:100%;height:auto}.mark{position:absolute;inset:0;overflow:hidden;pointer-events:none}.mark span{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-32deg);white-space:nowrap;color:rgba(25,58,106,.10);font-size:30px;font-weight:950}.mark span:nth-child(1){top:25%}.mark span:nth-child(2){top:50%}.mark span:nth-child(3){top:75%}
.review-page{min-height:1120px;padding:42px 46px 36px}.review-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:2px solid #193a6a}.review-head span{color:#b07b00;font-size:11px;font-weight:950}.review-head h1{margin:5px 0 0;font-size:24px}.review-meta{text-align:right;color:#63748b;font-size:12px;line-height:1.6}.question-label{display:flex;align-items:center;gap:10px;margin:26px 0 12px}.question-label b{display:grid;place-items:center;width:34px;height:34px;background:#193a6a;color:#fff;font-size:16px}.question-label span{font-size:13px;font-weight:850}.crop{position:relative;width:100%;min-height:610px;border:1px solid #ccd7e3;background:#fff;overflow:hidden;display:grid;place-items:center}.crop canvas{display:block;width:100%;height:auto}.answer-lines{margin-top:22px;color:#63748b;font-size:12px}.answer-lines i{display:block;height:28px;border-bottom:1px solid #b8c8da}.answer-sheet{min-height:1120px;padding:48px}.answer-sheet h1{margin:0;padding-bottom:15px;border-bottom:3px solid #193a6a;font-size:26px}.answer-sheet p{color:#63748b;font-size:13px}.answer-table{width:100%;margin-top:25px;border-collapse:collapse}.answer-table th,.answer-table td{border:1px solid #cbd6e3;padding:12px;text-align:left}.answer-table th{width:70px;background:#eef3f9;text-align:center}.answer-table td{font-weight:800}.empty{padding:60px;text-align:center;color:#63748b}
@media(max-width:620px){.bar{align-items:flex-start;flex-direction:column}.pages{padding:10px}.review-page,.answer-sheet{min-height:0;padding:24px 18px}.crop{min-height:0}.review-head h1{font-size:19px}.review-meta{font-size:10px}}
@page{size:A4;margin:0}@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bar{display:none}.pages{width:auto;margin:0;padding:0;display:block}.page{width:210mm;height:297mm;box-shadow:none;break-after:page;overflow:hidden}.page:last-child{break-after:auto}.review-page{padding:13mm 14mm 10mm}.review-page .crop{height:174mm;min-height:0}.review-page .crop canvas{max-height:100%;object-fit:contain}.answer-sheet{padding:15mm}.answer-lines i{height:9mm}}
</style></head><body><header class="bar"><div><b id="title">문제</b><span id="meta"></span></div><div class="bar-actions"><button class="secondary" onclick="history.back()">돌아가기</button><button class="secondary" onclick="openReport()">진단분석지</button><button onclick="print()">인쇄</button></div></header><main class="pages" id="pages"></main><script src="./data.js"></script><script>
function openReport(){open('./report.html','_blank','noopener')}
const p=new URLSearchParams(location.search),student=(p.get('student')||'학생').slice(0,30),doc=p.get('doc'),mode=p.get('mode')==='answer'?'answer':'problem',numbers=[...new Set((p.get('qs')||'').split(',').map(Number).filter(n=>n>=1&&n<=40))].sort((a,b)=>a-b),pages=document.getElementById('pages');
const title=doc==='diagnostic'?'중등 선발 사전 점검 모의고사':doc==='diagnostic-review'?'진단 오답 다시 풀기':'오답 유사유형 문제';document.getElementById('title').textContent=title;document.getElementById('meta').textContent=`${student} 학생 전용 · ${mode==='answer'?'문제 + 정답':'문제만'} · 인쇄 워터마크 적용`;
function mark(){const x=document.createElement('div');x.className='mark';for(let i=0;i<3;i++){const s=document.createElement('span');s.textContent=`${student} 학생 · GFIELD`;x.append(s)}return x}
function add(src,alt){const section=document.createElement('section'),img=document.createElement('img');section.className='page';img.src=src;img.alt=alt;section.append(img,mark());pages.append(section)}
function questionMeta(number){const q=(window.HSMIDDLE_DATA.questions||[]).find(item=>item[0]===number);return q||[number,'','','','','']}
function addReviewQuestion(number){
  const q=questionMeta(number),pageNumber=Math.ceil(number/4),slot=(number-1)%4,section=document.createElement('section');section.className='page review-page';
  section.innerHTML=`<header class="review-head"><div><span>GFIELD MIDDLE DIAGNOSTIC</span><h1>진단 오답 다시 풀기</h1></div><div class="review-meta">${student} 학생<br>${q[3]} · ${q[2]} 난이도</div></header><div class="question-label"><b>${number}</b><span>${q[5]}</span></div><div class="crop"><canvas aria-label="진단 ${number}번 문제"></canvas></div><div class="answer-lines">답<i></i><i></i></div>`;
  section.append(mark());pages.append(section);
  const img=new Image();img.onload=()=>{const left=slot<2,top=slot%2===0,sx=img.naturalWidth*(left ? .048 : .5),sy=img.naturalHeight*(pageNumber===1?(top?.18:.54):(top?.045:.49)),sw=img.naturalWidth*.452,sh=img.naturalHeight*(pageNumber===1?(top?.36:.38):.43),canvas=section.querySelector('canvas'),ctx=canvas.getContext('2d');canvas.width=Math.round(sw);canvas.height=Math.round(sh);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height)};img.src=`./assets/print/diagnostic/page-${String(pageNumber).padStart(2,'0')}.png`;
}
function addAnswerSheet(){const section=document.createElement('section');section.className='page answer-sheet';section.innerHTML=`<h1>선택 문항 정답</h1><p>${student} 학생 · 진단 오답 다시 풀기 · ${numbers.length}문항</p><table class="answer-table"><tbody>${numbers.map(number=>{const q=questionMeta(number);return `<tr><th>${number}번</th><td>${q[1]}</td></tr>`}).join('')}</tbody></table>`;section.append(mark());pages.append(section)}
if(doc==='diagnostic'){for(let n=1;n<=10;n++)add(`./assets/print/diagnostic/page-${String(n).padStart(2,'0')}.png`,`진단 시험지 ${n}쪽`)}else if(doc==='diagnostic-review'){if(numbers.length){numbers.forEach(addReviewQuestion);if(mode==='answer')addAnswerSheet()}else pages.innerHTML='<section class="page empty">인쇄할 오답 번호가 없습니다.</section>'}else{numbers.forEach(q=>{const total=HSMIDDLE_DATA.similarPages[q-1]||0;for(let n=1;n<=total;n++)add(`./assets/similar/q${String(q).padStart(2,'0')}/page-${n}.png`,`${q}번 유사문제 ${n}쪽`)})}
</script></body></html>
