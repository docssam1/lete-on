<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중등 진단 문제</title><style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");*{box-sizing:border-box}body{margin:0;background:#e8edf4;font-family:Pretendard,sans-serif;color:#17263b}.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:9px 18px;background:#fff;border-bottom:1px solid #cbd6e3}.bar b{font-size:15px}.bar span{display:block;margin-top:3px;color:#63748b;font-size:11px;font-weight:700}button{height:38px;padding:0 13px;border:0;border-radius:6px;background:#193a6a;color:#fff;font:850 12px Pretendard,sans-serif;cursor:pointer}.pages{width:min(900px,100%);margin:0 auto;padding:22px 10px 44px;display:grid;gap:18px}.page{position:relative;background:#fff;box-shadow:0 8px 24px rgba(24,42,66,.18)}.page img{display:block;width:100%;height:auto}.mark{position:absolute;inset:0;overflow:hidden;pointer-events:none}.mark span{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-32deg);white-space:nowrap;color:rgba(25,58,106,.14);font-size:34px;font-weight:950}.mark span:nth-child(1){top:25%}.mark span:nth-child(2){top:50%}.mark span:nth-child(3){top:75%}@page{size:A4;margin:0}@media print{.bar{display:none}.pages{width:auto;margin:0;padding:0;display:block}.page{width:210mm;box-shadow:none;break-after:page}.page:last-child{break-after:auto}}
</style></head><body><header class="bar"><div><b id="title">문제</b><span id="meta"></span></div><div><button onclick="history.back()">돌아가기</button> <button onclick="print()">인쇄</button></div></header><main class="pages" id="pages"></main><script src="./data.js"></script><script>
const p=new URLSearchParams(location.search),student=(p.get('student')||'학생').slice(0,30),doc=p.get('doc'),numbers=(p.get('qs')||'').split(',').map(Number).filter(n=>n>=1&&n<=40),pages=document.getElementById('pages');
const title=doc==='diagnostic'?'중등 선발 사전 점검 모의고사':'오답 유사유형 문제';document.getElementById('title').textContent=title;document.getElementById('meta').textContent=`${student} 학생 전용 · 인쇄 워터마크 적용`;
function mark(){const x=document.createElement('div');x.className='mark';for(let i=0;i<3;i++){const s=document.createElement('span');s.textContent=`${student} 학생 · GFIELD`;x.append(s)}return x}function add(src,alt){const section=document.createElement('section'),img=document.createElement('img');section.className='page';img.src=src;img.alt=alt;section.append(img,mark());pages.append(section)}
if(doc==='diagnostic'){for(let n=1;n<=10;n++)add(`./assets/print/diagnostic/page-${String(n).padStart(2,'0')}.png`,`진단 시험지 ${n}쪽`)}else{numbers.forEach(q=>{const total=HSMIDDLE_DATA.similarPages[q-1]||0;for(let n=1;n<=total;n++)add(`./assets/similar/q${String(q).padStart(2,'0')}/page-${String(n).padStart(2,'0')}.png`,`${q}번 유사문제 ${n}쪽`)})}
</script></body></html>
