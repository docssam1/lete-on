<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중등 시험지 승인 관리</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#15253c;font-family:Pretendard,sans-serif}.wrap{width:min(980px,calc(100% - 32px));margin:38px auto}h1{margin:0;font-size:28px;font-weight:950}.sub{margin:9px 0 22px;color:#60738e}.panel{padding:22px;background:#fff;border:1px solid #d5e0ed;border-radius:8px;box-shadow:0 8px 22px rgba(20,43,73,.07)}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}input{height:44px;padding:0 12px;border:1px solid #bbcadb;border-radius:6px;font:700 14px Pretendard,sans-serif}button{height:42px;padding:0 14px;border:0;border-radius:6px;background:#173a6b;color:#fff;font:900 13px Pretendard,sans-serif;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.alt{background:#e5eef8;color:#173a6b}.danger{background:#fff0f1;color:#b4232b}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.choices label{padding:8px 10px;border:1px solid #cbd8e7;border-radius:5px;background:#f7faff;font-size:12px;font-weight:800}.choices input{width:auto;height:auto;margin:0 5px 0 0}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:12px 8px;border-bottom:1px solid #e2eaf3;text-align:left;font-size:13px;vertical-align:top}th{color:#62748c;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.status{min-height:20px;margin-top:10px;color:#355b84;font-size:13px;font-weight:800}.note{color:#697c93;font-size:12px;line-height:1.65}.muted{color:#7c8da2}.hidden{display:none!important}@media(max-width:650px){.wrap{width:min(100% - 20px,980px);margin:20px auto}.form{grid-template-columns:1fr}.actions{display:grid}.actions button{width:100%}table{display:block;overflow:auto}}
</style>
</head>
<body>
<main class="wrap">
  <h1>중등 시험지 승인 관리</h1>
  <p class="sub">승인정보는 서버에 암호화된 해시로 저장되며 공개 파일에 노출되지 않습니다.</p>
  <section class="panel" id="loginPanel">
    <div class="form"><input id="adminName" autocomplete="username" placeholder="관리자 이름"><input id="adminCode" type="password" autocomplete="current-password" placeholder="관리자 승인번호"><button id="adminLogin" type="button">입장</button></div>
    <p class="status" id="loginStatus"></p>
  </section>
  <section class="panel hidden" id="adminPanel">
    <div class="form"><input id="name" placeholder="학생 이름"><input id="code" placeholder="새 승인번호"><button id="saveButton" type="button">승인 저장</button></div>
    <div class="choices" id="choices"></div>
    <p class="note">기존 학생의 승인번호를 유지하려면 승인번호 칸을 비워 두세요. 권한은 선택한 시험지로 교체됩니다.</p>
    <table><thead><tr><th>학생</th><th>상태</th><th>승인 시험지</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <div class="actions"><button class="alt" id="makeCode" type="button">승인번호 만들기</button><button class="alt" onclick="location.href='./review.html'">문항 데이터 검수</button><button class="alt" onclick="location.href='./library.html'">서재 보기</button></div>
    <div class="status" id="status"></div>
  </section>
</main>
<script src="./data.js"></script>
<script src="./shared-auth.js"></script>
<script src="./hsm-cloud.js"></script>
<script>
const D=window.HSMIDDLE_DATA;
const loginPanel=document.getElementById('loginPanel'),adminPanel=document.getElementById('adminPanel'),choices=document.getElementById('choices'),rows=document.getElementById('rows'),status=document.getElementById('status');
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

function renderChoices(){choices.innerHTML=Object.entries(D.exams).filter(([key])=>key!=='question-bank').map(([key,label])=>`<label><input type="checkbox" data-exam="${key}" ${key==='diagnostic'?'checked':''}>${esc(label)}</label>`).join('')}
function examLabels(permissions){return (permissions||[]).map(key=>esc(D.exams[key]||key)).join('<br>')||'<span class="muted">권한 없음</span>'}
function render(accounts){rows.innerHTML=accounts.map(account=>`<tr><td>${esc(account.student_name)}${account.is_admin?' <b>관리자</b>':''}</td><td>${account.active?'사용 중':'중지'}</td><td>${examLabels(account.permissions)}</td><td>${account.is_admin?'':`<button class="danger" onclick="deactivate(${JSON.stringify(account.student_name)})">사용 중지</button>`}</td></tr>`).join('')}

async function loadAccounts(){status.textContent='승인 목록을 불러오는 중입니다.';const accounts=await HSMIDDLE_CLOUD.adminList();if(!accounts){status.textContent='목록을 불러오지 못했습니다. 다시 로그인해 주세요.';return}render(accounts);status.textContent=`${accounts.length}명의 승인 정보를 확인했습니다.`}

async function openAdmin(session){if(!session||!session.admin)return false;loginPanel.classList.add('hidden');adminPanel.classList.remove('hidden');renderChoices();await loadAccounts();return true}

document.getElementById('adminLogin').addEventListener('click',async()=>{const button=document.getElementById('adminLogin');button.disabled=true;const session=await HSMIDDLE_AUTH.login(document.getElementById('adminName').value,document.getElementById('adminCode').value);button.disabled=false;if(!await openAdmin(session))document.getElementById('loginStatus').textContent='관리자 이름 또는 승인번호를 확인해 주세요.'});
document.getElementById('makeCode').addEventListener('click',()=>{document.getElementById('code').value='HS-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36).slice(0,6).toUpperCase()});
document.getElementById('saveButton').addEventListener('click',async()=>{const name=document.getElementById('name').value.trim(),code=document.getElementById('code').value.trim().toUpperCase(),permissions=[...document.querySelectorAll('[data-exam]:checked')].map(item=>item.dataset.exam);if(!name||!permissions.length){status.textContent='이름과 승인 시험지를 확인해 주세요.';return}const button=document.getElementById('saveButton');button.disabled=true;status.textContent='서버에 저장 중입니다.';const account=await HSMIDDLE_CLOUD.adminUpsert(name,code,permissions);button.disabled=false;if(!account){status.textContent='저장하지 못했습니다. 새 학생은 승인번호를 입력해 주세요.';return}document.getElementById('name').value='';document.getElementById('code').value='';status.textContent=`${account.student_name} 학생의 권한을 저장했습니다.`;await loadAccounts()});
async function deactivate(name){if(!confirm(`${name} 학생의 접속을 중지할까요?`))return;status.textContent='접속을 중지하는 중입니다.';const ok=await HSMIDDLE_CLOUD.adminDeactivate(name);status.textContent=ok?`${name} 학생의 접속을 중지했습니다.`:'접속 중지에 실패했습니다.';if(ok)await loadAccounts()}

openAdmin(HSMIDDLE_AUTH.readSession());
</script>
</body>
</html>
