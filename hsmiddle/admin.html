<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>중등 시험지 승인 관리</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#15253c;font-family:Pretendard,sans-serif}.wrap{width:min(1040px,calc(100% - 32px));margin:38px auto}h1{margin:0;font-size:28px;font-weight:950}.sub{margin:9px 0 22px;color:#60738e}.panel{padding:22px;background:#fff;border:1px solid #d5e0ed;border-radius:8px;box-shadow:0 8px 22px rgba(20,43,73,.07)}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}input,select{height:44px;padding:0 12px;border:1px solid #bbcadb;border-radius:6px;background:#fff;color:#15253c;font:700 14px Pretendard,sans-serif}button{height:42px;padding:0 14px;border:0;border-radius:6px;background:#173a6b;color:#fff;font:900 13px Pretendard,sans-serif;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.alt{background:#e5eef8;color:#173a6b}.danger{background:#fff0f1;color:#b4232b}.view-tabs{display:flex;gap:0;margin:-22px -22px 22px;border-bottom:1px solid #d5e0ed}.view-tabs button{flex:1;border-radius:0;background:#fff;color:#60738e;border-right:1px solid #d5e0ed}.view-tabs button:last-child{border-right:0}.view-tabs button.active{background:#173a6b;color:#fff}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.choices label{padding:8px 10px;border:1px solid #cbd8e7;border-radius:5px;background:#f7faff;font-size:12px;font-weight:800}.choices input{width:auto;height:auto;margin:0 5px 0 0}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:12px 8px;border-bottom:1px solid #e2eaf3;text-align:left;font-size:13px;vertical-align:top}th{color:#62748c;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.status{min-height:20px;margin-top:10px;color:#355b84;font-size:13px;font-weight:800}.note{color:#697c93;font-size:12px;line-height:1.65}.muted{color:#7c8da2}.hidden{display:none!important}.result-head{display:flex;align-items:end;justify-content:space-between;gap:16px}.result-head h2{margin:0;font-size:19px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.metric{padding:14px;border:1px solid #d8e3ef;border-radius:6px;background:#f7faff}.metric span{display:block;color:#697c93;font-size:11px;font-weight:800}.metric b{display:block;margin-top:3px;font-size:21px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.result-list{display:grid;gap:8px;margin-top:12px}.result-card{border:1px solid #d5e0ed;border-radius:6px;background:#fff;overflow:hidden}.result-summary{display:grid;grid-template-columns:minmax(110px,1.2fr) minmax(130px,1.5fr) 64px 76px 90px auto;align-items:center;gap:10px;padding:12px}.result-summary b{font-size:14px}.result-summary span{font-size:12px;color:#60738e}.score{color:#12634b!important;font-size:17px!important;font-weight:950}.detail-button{height:34px;background:#e5eef8;color:#173a6b}.result-detail{padding:12px;border-top:1px solid #e2eaf3;background:#f8fafc}.ox-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}.ox-cell{min-width:0;padding:7px 2px;border:1px solid #d5e0ed;border-radius:4px;background:#fff;text-align:center}.ox-cell small,.ox-cell b{display:block}.ox-cell small{color:#7c8da2;font-size:9px}.ox-cell b{margin-top:2px;font-size:12px}.ox-cell.o b{color:#087443}.ox-cell.x b{color:#c53a3a}.empty{padding:28px 12px;border:1px dashed #c6d3e2;text-align:center;color:#718096;font-size:13px}@media(max-width:650px){.wrap{width:min(100% - 20px,1040px);margin:20px auto}.panel{padding:16px}.view-tabs{margin:-16px -16px 16px}.form,.filters,.metrics{grid-template-columns:1fr}.actions{display:grid}.actions button{width:100%}table{display:block;overflow:auto}.result-head{align-items:start;flex-direction:column}.result-summary{grid-template-columns:1fr auto;gap:5px 10px}.result-summary .student{grid-column:1}.result-summary .exam{grid-column:1}.result-summary .attempt{grid-column:1}.result-summary .score{grid-column:2;grid-row:1}.result-summary .date{grid-column:1}.result-summary .detail-button{grid-column:2;grid-row:2/5}.ox-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="wrap">
  <h1>중등 시험지 승인 관리</h1>
  <p class="sub">승인정보는 서버에 암호화된 해시로 저장되며 공개 파일에 노출되지 않습니다.</p>
  <section class="panel" id="loginPanel">
    <div class="form"><input id="adminName" autocomplete="username" placeholder="관리자 이름"><input id="adminCode" type="password" autocomplete="current-password" placeholder="관리자 승인번호"><button id="adminLogin" type="button">입장</button></div>
    <p class="status" id="loginStatus"></p>
  </section>
  <section class="panel hidden" id="adminPanel">
    <div class="view-tabs" role="tablist"><button class="active" id="accountsTab" role="tab" aria-selected="true" onclick="showView('accounts')">학생 승인</button><button id="resultsTab" role="tab" aria-selected="false" onclick="showView('results')">성적 기록</button></div>
    <div id="accountsView">
      <div class="form"><input id="name" placeholder="학생 이름"><input id="code" placeholder="새 승인번호"><button id="saveButton" type="button">승인 저장</button></div>
      <div class="choices" id="choices"></div>
      <p class="note">기존 학생의 승인번호를 유지하려면 승인번호 칸을 비워 두세요. 권한은 선택한 시험지로 교체됩니다.</p>
      <table><thead><tr><th>학생</th><th>상태</th><th>승인 시험지</th><th></th></tr></thead><tbody id="rows"></tbody></table>
      <div class="actions"><button class="alt" id="makeCode" type="button">승인번호 만들기</button><button class="alt" onclick="location.href='./review.html'">문항 데이터 검수</button><button class="alt" onclick="location.href='./library.html'">서재 보기</button></div>
      <div class="status" id="status"></div>
    </div>
    <div class="hidden" id="resultsView">
      <div class="result-head"><div><h2>저장된 성적 기록</h2><p class="note" style="margin:4px 0 0">학생이 저장한 회차와 문항별 O/X를 확인합니다.</p></div><button class="alt" type="button" onclick="loadResults(true)">새로고침</button></div>
      <div class="metrics"><div class="metric"><span>저장 기록</span><b id="resultCount">-</b></div><div class="metric"><span>응시 학생</span><b id="studentCount">-</b></div><div class="metric"><span>최근 응시</span><b id="latestDate">-</b></div></div>
      <div class="filters"><select id="studentFilter" aria-label="학생 선택" onchange="renderResults()"><option value="">전체 학생</option></select><select id="examFilter" aria-label="시험 선택" onchange="renderResults()"><option value="">전체 시험</option></select></div>
      <div class="result-list" id="resultRows"></div>
      <div class="status" id="resultStatus"></div>
    </div>
  </section>
</main>
<script src="./data.js"></script>
<script src="./shared-auth.js"></script>
<script src="./hsm-cloud.js"></script>
<script>
const D=window.HSMIDDLE_DATA;
const loginPanel=document.getElementById('loginPanel'),adminPanel=document.getElementById('adminPanel'),choices=document.getElementById('choices'),rows=document.getElementById('rows'),status=document.getElementById('status');
let resultRecords=[],resultsLoaded=false;
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

function renderChoices(){choices.innerHTML=Object.entries(D.exams).filter(([key])=>key!=='question-bank').map(([key,label])=>`<label><input type="checkbox" data-exam="${key}" ${key==='diagnostic'?'checked':''}>${esc(label)}</label>`).join('')}
function examLabels(permissions){return (permissions||[]).map(key=>esc(D.exams[key]||key)).join('<br>')||'<span class="muted">권한 없음</span>'}
function render(accounts){rows.innerHTML=accounts.map((account,index)=>`<tr><td>${esc(account.student_name)}${account.is_admin?' <b>관리자</b>':''}</td><td>${account.active?'사용 중':'중지'}</td><td>${examLabels(account.permissions)}</td><td>${account.is_admin?'':`<button class="danger" type="button" data-deactivate-index="${index}">사용 중지</button>`}</td></tr>`).join('');rows.querySelectorAll('[data-deactivate-index]').forEach(button=>button.addEventListener('click',()=>{const account=accounts[Number(button.dataset.deactivateIndex)];if(account)deactivate(account.student_name)}))}

function examName(round){return D.exams[round]||round}
function shortDate(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return '-';return `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}`}
function detailKey(record,index){return `result-${index}-${String(record.student).replace(/[^a-z0-9가-힣]/gi,'')}`}
function oxGrid(states){return Array.from({length:40},(_,index)=>{const number=index+1,value=states&&states[number];return `<div class="ox-cell ${value==='o'?'o':value==='x'?'x':''}"><small>${number}</small><b>${value==='o'?'O':value==='x'?'X':'-'}</b></div>`}).join('')}
function toggleResult(id,button){const detail=document.getElementById(id),open=detail.classList.toggle('hidden');button.textContent=open?'상세':'닫기';button.setAttribute('aria-expanded',String(!open))}
function renderResults(){const student=document.getElementById('studentFilter').value,exam=document.getElementById('examFilter').value,filtered=resultRecords.filter(record=>(!student||record.student===student)&&(!exam||record.round===exam));document.getElementById('resultRows').innerHTML=filtered.length?filtered.map((record,index)=>{const id=detailKey(record,index);return `<article class="result-card"><div class="result-summary"><b class="student">${esc(record.student)}</b><span class="exam">${esc(examName(record.round))}</span><span class="attempt">${Number(record.attempt)||1}회차</span><span class="score">${Number(record.score)||0}점</span><span class="date">${shortDate(record.created_at)}</span><button class="detail-button" type="button" aria-expanded="false" aria-controls="${id}" onclick="toggleResult('${id}',this)">상세</button></div><div class="result-detail hidden" id="${id}"><p class="note" style="margin:0 0 8px">정답 ${Number(record.correct)||0}문항 · 입력 ${Number(record.answered)||0}문항</p><div class="ox-grid">${oxGrid(record.states)}</div></div></article>`}).join(''):'<div class="empty">조건에 맞는 성적 기록이 없습니다.</div>';document.getElementById('resultStatus').textContent=`${filtered.length}건을 표시하고 있습니다.`}
function fillResultFilters(){const students=[...new Set(resultRecords.map(record=>record.student))].sort((a,b)=>a.localeCompare(b,'ko')),rounds=[...new Set(resultRecords.map(record=>record.round))];document.getElementById('studentFilter').innerHTML='<option value="">전체 학생</option>'+students.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('');document.getElementById('examFilter').innerHTML='<option value="">전체 시험</option>'+rounds.map(round=>`<option value="${esc(round)}">${esc(examName(round))}</option>`).join('')}
async function loadResults(force=false){if(resultsLoaded&&!force){renderResults();return}const resultStatus=document.getElementById('resultStatus');resultStatus.textContent='성적 기록을 불러오는 중입니다.';const attempts=await HSMIDDLE_CLOUD.allAttempts();if(!Array.isArray(attempts)){resultStatus.textContent='성적 기록을 불러오지 못했습니다. 다시 로그인한 뒤 시도해 주세요.';return}resultRecords=attempts;resultsLoaded=true;fillResultFilters();document.getElementById('resultCount').textContent=`${resultRecords.length}건`;document.getElementById('studentCount').textContent=`${new Set(resultRecords.map(record=>record.student)).size}명`;document.getElementById('latestDate').textContent=resultRecords.length?shortDate(resultRecords[0].created_at):'-';renderResults()}
function showView(view){const results=view==='results';document.getElementById('accountsView').classList.toggle('hidden',results);document.getElementById('resultsView').classList.toggle('hidden',!results);document.getElementById('accountsTab').classList.toggle('active',!results);document.getElementById('resultsTab').classList.toggle('active',results);document.getElementById('accountsTab').setAttribute('aria-selected',String(!results));document.getElementById('resultsTab').setAttribute('aria-selected',String(results));if(results)loadResults()}

async function loadAccounts(){status.textContent='승인 목록을 불러오는 중입니다.';const accounts=await HSMIDDLE_CLOUD.adminList();if(!accounts){status.textContent='목록을 불러오지 못했습니다. 다시 로그인해 주세요.';return}render(accounts);status.textContent=`${accounts.length}명의 승인 정보를 확인했습니다.`}

async function openAdmin(session){if(!session||!session.admin)return false;loginPanel.classList.add('hidden');adminPanel.classList.remove('hidden');renderChoices();await loadAccounts();return true}

document.getElementById('adminLogin').addEventListener('click',async()=>{const button=document.getElementById('adminLogin');button.disabled=true;const session=await HSMIDDLE_AUTH.login(document.getElementById('adminName').value,document.getElementById('adminCode').value);button.disabled=false;if(!await openAdmin(session))document.getElementById('loginStatus').textContent='관리자 이름 또는 승인번호를 확인해 주세요.'});
document.getElementById('makeCode').addEventListener('click',()=>{document.getElementById('code').value='HS-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36).slice(0,6).toUpperCase()});
document.getElementById('saveButton').addEventListener('click',async()=>{const name=document.getElementById('name').value.trim(),code=document.getElementById('code').value.trim().toUpperCase(),permissions=[...document.querySelectorAll('[data-exam]:checked')].map(item=>item.dataset.exam);if(!name||!permissions.length){status.textContent='이름과 승인 시험지를 확인해 주세요.';return}const button=document.getElementById('saveButton');button.disabled=true;status.textContent='서버에 저장 중입니다.';const account=await HSMIDDLE_CLOUD.adminUpsert(name,code,permissions);button.disabled=false;if(!account){status.textContent='저장하지 못했습니다. 새 학생은 승인번호를 입력해 주세요.';return}document.getElementById('name').value='';document.getElementById('code').value='';status.textContent=`${account.student_name} 학생의 권한을 저장했습니다.`;await loadAccounts()});
async function deactivate(name){if(!confirm(`${name} 학생의 접속을 중지할까요?`))return;status.textContent='접속을 중지하는 중입니다.';const ok=await HSMIDDLE_CLOUD.adminDeactivate(name);status.textContent=ok?`${name} 학생의 접속을 중지했습니다.`:'접속 중지에 실패했습니다.';if(ok)await loadAccounts()}

openAdmin(HSMIDDLE_AUTH.readSession());
</script>
</body>
</html>
