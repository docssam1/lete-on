<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중등 진단 승인 관리</title><style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#16243a;font-family:Pretendard,sans-serif;font-weight:650}.wrap{width:min(940px,calc(100% - 32px));margin:36px auto}h1{font-size:28px;margin:0}.sub{margin:8px 0 22px;color:#61728a}.panel{background:#fff;border:1px solid #d5dfeb;border-radius:8px;padding:22px;box-shadow:0 8px 24px rgba(24,42,66,.07)}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}input{height:44px;padding:0 12px;border:1px solid #bac8d8;border-radius:6px;font:700 14px Pretendard,sans-serif}button{height:44px;padding:0 15px;border:0;border-radius:6px;background:#193a6a;color:#fff;font:850 13px Pretendard,sans-serif;cursor:pointer}button.alt{background:#e7eef7;color:#193a6a}button.danger{background:#fff1f2;color:#b4232c}table{width:100%;margin-top:18px;border-collapse:collapse;text-align:left}th,td{padding:13px 8px;border-bottom:1px solid #e3eaf2;font-size:14px}th{color:#65758b;font-size:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.note{margin-top:12px;color:#65758b;font-size:12px;line-height:1.6}.status{min-height:20px;margin-top:10px;font-size:13px;font-weight:800}@media(max-width:620px){.wrap{width:min(100% - 20px,940px);margin:20px auto}.form{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}}
</style></head><body><main class="wrap"><h1>중등 진단 승인 관리</h1><p class="sub">이름과 승인번호로 입장 권한을 부여합니다. 이메일은 저장하지 않습니다.</p><section class="panel"><div class="form"><input id="name" placeholder="학생 이름"><input id="code" placeholder="승인번호 예: HS-1234"><button onclick="addStudent()">승인 추가</button></div><table><thead><tr><th>학생 이름</th><th>승인번호</th><th>권한</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="actions"><button class="alt" onclick="makeCode()">승인번호 만들기</button><button onclick="saveGithub()">GitHub에 저장</button></div><p class="note">GitHub 저장 시 이 브라우저에만 저장된 PAT를 사용합니다. 학생은 `중등 진단` 권한이 있을 때만 입장할 수 있습니다.</p><div class="status" id="status"></div></section></main><script src="./data.js"></script><script>
const D=window.HSMIDDLE_DATA,rows=document.getElementById('rows'),status=document.getElementById('status');function render(){rows.innerHTML=D.students.map(name=>`<tr><td>${name}</td><td>${D.studentCode[name]}</td><td>중등 진단</td><td><button class="danger" onclick="removeStudent('${name.replaceAll("'","\\'")}')">삭제</button></td></tr>`).join('')}function makeCode(){document.getElementById('code').value='HS-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36).slice(0,6).toUpperCase()}function addStudent(){const name=document.getElementById('name').value.trim(),code=document.getElementById('code').value.trim().toUpperCase();if(!name||!code){status.textContent='이름과 승인번호를 모두 입력해 주세요.';return}if(!D.students.includes(name))D.students.push(name);D.studentCode[name]=code;D.access[name]=['diagnostic'];document.getElementById('name').value='';document.getElementById('code').value='';status.textContent=`${name} 학생을 승인했습니다. GitHub에 저장해 주세요.`;render()}function removeStudent(name){if(name==='DEMO'||!confirm(`${name} 학생의 권한을 삭제할까요?`))return;D.students=D.students.filter(x=>x!==name);delete D.studentCode[name];delete D.access[name];render()}function source(){return `window.HSMIDDLE_DATA = ${JSON.stringify(D,null,2)};\n`}function utf8(v){return btoa(unescape(encodeURIComponent(v)))}async function saveGithub(){let token=localStorage.getItem('hsmiddle_pat')||prompt('GitHub PAT를 입력해 주세요. (Contents: Read and write)')||'';if(!token)return;localStorage.setItem('hsmiddle_pat',token);status.textContent='GitHub에 저장 중입니다.';const url='https://api.github.com/repos/docssam1/lete-on/contents/hsmiddle/data.js';try{const current=await fetch(url,{headers:{Authorization:`Bearer ${token}`}}).then(r=>{if(!r.ok)throw Error('현재 파일을 읽지 못했습니다.');return r.json()});const r=await fetch(url,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Update HS middle student access',branch:'main',sha:current.sha,content:utf8(source())})});if(!r.ok)throw Error('저장에 실패했습니다. PAT 권한을 확인해 주세요.');status.textContent='저장했습니다. GitHub Pages 반영 후 학생이 입장할 수 있습니다.'}catch(e){status.textContent=e.message}}
render();
</script></body></html>
