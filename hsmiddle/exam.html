<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#16263d;font-family:Pretendard,sans-serif}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:#0c1d34;color:#fff}.top b{font-size:15px}.top span{display:block;color:#adc0d6;font-size:11px;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{height:38px;padding:0 13px;border:0;border-radius:6px;background:#e6b930;color:#12233a;font-weight:900;cursor:pointer}.btn.dark{background:#203a5c;color:#fff}.shell{width:min(1280px,calc(100% - 28px));margin:18px auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}.viewer{display:grid;gap:14px}.page{position:relative;background:#fff;box-shadow:0 6px 18px rgba(26,48,76,.15)}.page img{display:block;width:100%;height:auto}.watermark{position:absolute;inset:0;pointer-events:none;overflow:hidden}.watermark span{position:absolute;left:50%;width:120%;transform:translate(-50%,-50%) rotate(-32deg);text-align:center;color:rgba(27,65,107,.14);font-size:28px;font-weight:900}.watermark span:nth-child(1){top:25%}.watermark span:nth-child(2){top:50%}.watermark span:nth-child(3){top:75%}.panel{background:#fff;border:1px solid #d5dfeb;border-radius:8px;padding:16px;box-shadow:0 5px 18px rgba(26,48,76,.06);position:sticky;top:64px;max-height:calc(100vh - 80px);overflow-y:auto;scrollbar-gutter:stable}.panel .actions{position:sticky;top:0;background:#fff;padding:6px 0;z-index:1}.panel h2{margin:0 0 8px;font-size:18px}.hint{font-size:12px;color:#60758d;line-height:1.6}.answer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.answer-grid label{font-size:11px;color:#60758d}.answer-grid input{width:100%;height:34px;margin-top:3px;padding:0 6px;border:1px solid #bdcddd;border-radius:4px;font:700 12px Pretendard}.result{margin-top:14px;padding:12px;border-radius:6px;background:#f4f7fb;font-size:13px;line-height:1.6}.locked{padding:12px;background:#fff7dd;border-left:4px solid #e2af23;line-height:1.6;font-size:13px}.video{width:100%;aspect-ratio:16/9;border:0;margin-top:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static;order:-1;max-height:none}.answer-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:560px){.shell{width:calc(100% - 16px);margin:10px auto}.answer-grid{grid-template-columns:repeat(4,1fr)}.top{align-items:flex-start}.top .actions{justify-content:flex-end;gap:6px}.btn{font-size:11px;padding:0 9px}}
@media(max-width:900px){.top{position:static}}
@media print{.top,.panel{display:none}.shell{width:auto;margin:0}.layout{display:block}.page{box-shadow:none;break-after:page}.page:last-child{break-after:auto}}
#answerPrint{display:none}
#answerPrint h1{font-size:19px;margin:0 0 4px}
#answerPrint .apmeta{color:#5b6f88;font-size:12px;font-weight:700;margin-bottom:14px}
#answerPrint ol{margin:0;padding-left:22px;font-size:13px;line-height:1.8}

#answerPrint pre{white-space:pre-wrap;margin:5px 0;padding:8px;background:#f4f7fb;border-radius:5px;font:700 11.5px/1.6 Pretendard,sans-serif}

  body.print-answers .shell{display:none!important}
  body.print-answers #answerPrint{display:block}
  body.print-answers .page{break-after:auto}
}
.hidden{display:none!important}
.grade-mark{display:block;min-height:16px;margin-top:2px;font-size:12px;font-weight:950;text-align:center}.grade-mark.good{color:#147a4d}.grade-mark.bad{color:#bd3038}.grade-mark.manual{color:#9a6c00}.ox-control{display:flex;gap:4px;margin-top:3px}.ox-control button{height:28px;min-width:30px;padding:0;border:1px solid #b9c8d8;border-radius:4px;background:#f5f8fb;color:#294563;font-weight:900;cursor:pointer}.ox-control button.active-o{background:#d9f3e7;color:#147a4d;border-color:#62b58e}.ox-control button.active-x{background:#fde4e6;color:#bd3038;border-color:#d6858b}
.answer-parts{display:grid;gap:3px;margin-top:3px}.answer-parts span{display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:3px;font-size:9px;font-weight:800;color:#48637c}.answer-parts input{margin-top:0!important;text-align:center}
.answer-grid label.with-answer-image{grid-column:span 2}.answer-key-image{display:block;width:100%;max-height:120px;object-fit:contain;margin-top:5px;border:1px solid #d5dfeb;background:#fff}
.fb{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:3px}
.fb .ans{font-size:11px;font-weight:900;color:#12233a}
.fb button{height:22px;padding:0 7px;font-size:10px;font-weight:900;border-radius:4px;
           background:#e8eef6;color:#1d3a5f;border:1px solid #cfdbe9;cursor:pointer}
.fb button:hover{background:#dbe6f2}
.result-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result-actions .btn{height:34px}
@media print{.fb{display:none}}

/* 맞은 문제 체크 */
.live-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}
.live{font-size:13px;font-weight:800;color:#294563}
.live b{font-size:17px;color:#173a6b;font-variant-numeric:tabular-nums}
.live small{color:#60758d;font-weight:700}
.mark-tools{display:flex;gap:6px}
.mini{height:28px;padding:0 10px;border:1px solid #b9c8d8;border-radius:6px;background:#f5f8fb;color:#294563;font:900 11px Pretendard,sans-serif;cursor:pointer}
.mini:hover{background:#e8eef6}
.answer-grid{grid-template-columns:repeat(5,1fr)}
.ck{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:46px;padding:4px 0;border:1.5px solid #bdcddd;border-radius:8px;background:#fff;color:#294563;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s}
.ck-n{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.ck-s{height:14px;font-size:13px;font-weight:950;line-height:14px}
.ck:hover{border-color:#7da1c4}
.ck[aria-pressed="true"]{background:#d9f3e7;border-color:#62b58e;color:#147a4d}
.ck.is-wrong{background:#fde4e6;border-color:#d6858b;color:#bd3038}
.ck:focus-visible,.ans-ck:focus-visible,.mini:focus-visible{outline:2px solid #173a6b;outline-offset:2px}
.ans-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e3eaf2}
.ans-main{min-width:0;flex:1}
.ans-ck{flex:none;height:30px;min-width:54px;padding:0 10px;border:1.5px solid #bdcddd;border-radius:6px;background:#fff;color:#294563;font:900 12px Pretendard,sans-serif;cursor:pointer}
.ans-ck[aria-pressed="true"]{background:#d9f3e7;border-color:#62b58e;color:#147a4d}
.wrong-list{margin-top:12px;border-top:1px solid #d5dfeb}
.wrong-list .fb{margin:0;padding:8px 0;border-bottom:1px solid #e3eaf2;gap:7px}
.wrong-list .fb .wn{min-width:34px;color:#bd3038;font-size:12px;font-weight:950}
.wrong-list .fb .ans{font-size:12px}
.wrong-list .fb button{height:26px;font-size:11px;padding:0 9px}
@media(prefers-reduced-motion:reduce){.ck{transition:none}}
@media print{.live-row,.ans-ck{display:none}}
</style>
</head>
<body>
<header class="top"><div><b id="title">중등 모의고사</b><span id="student"></span></div><div class="actions"><button class="btn dark" onclick="goToPanel()">맞은 문제 체크</button><button class="btn dark" onclick="location.href='./library.html'">목록</button><button class="btn dark" onclick="openReport()">분석지 보기</button><button class="btn dark" onclick="printPaper()">시험지 인쇄</button><button class="btn dark" onclick="printAnswers()">답안 인쇄</button></div></header>
<main class="shell"><div class="layout"><section class="viewer" id="viewer"></section><aside class="panel"><h2>맞은 문제 체크</h2><p class="hint" id="notice">시험지를 푼 뒤 답안을 확인하고, 맞은 문제의 번호를 눌러 체크하세요. 체크하지 않은 문제는 틀린 것으로 채점됩니다.</p><div class="actions"><button class="btn" onclick="grade()">채점하기</button><button class="btn dark" onclick="showAnswers()">답안 보기</button><button class="btn dark" onclick="watch()">전체 수업 영상</button></div><div class="live-row"><div class="live" id="live" aria-live="polite"></div><div class="mark-tools"><button type="button" class="mini" onclick="markAll(true)">전체 체크</button><button type="button" class="mini" onclick="markAll(false)">전체 해제</button></div></div><div class="answer-grid" id="answers" role="group" aria-label="맞은 문제 체크"></div><div class="result" id="result">아직 채점하지 않았습니다.</div><div id="video"></div></aside></div></main>
<script src="./data.js"></script><script src="./exam-data.js"></script><script src="./shared-auth.js"></script><script src="./hsm-cloud.js"></script>
<script src="./exam-meta.js"></script>
<script src="./hsm-player.js"></script>
<script>
(()=>{
const p=new URLSearchParams(location.search),key=p.get('exam')||'mock-1',exam=HSMIDDLE_EXAMS[key]||HSMIDDLE_EXAMS['mock-1'];let student=(p.get('student')||localStorage.getItem('hs-student')||'학생').slice(0,30),verifiedAccess=false;const viewer=document.getElementById('viewer'),answers=document.getElementById('answers');
document.getElementById('title').textContent=exam.title;document.getElementById('student').textContent=`${student} · 시험지와 답안 검수 화면`;
const panel=document.querySelector('.panel'),panelChildren=[...panel.children],gate=document.createElement('div');
gate.id='gate';gate.innerHTML='<h2>승인 확인</h2><p class="hint">이 시험지의 승인번호를 입력하세요.</p><div class="actions"><input id="gate-name" placeholder="학생 이름"><input id="gate-code" placeholder="승인번호"><button class="btn" id="gate-submit" onclick="signIn()">입장</button></div><p class="hint hidden" id="gate-error">이름 또는 승인번호를 확인해 주세요.</p>';
panel.prepend(gate);panelChildren.forEach(node=>node.classList.add('hidden'));viewer.classList.add('hidden');
/* 이용 기간(6개월) 만료 시 본문을 안내로 교체하고 진행을 중단한다. */
function showExpired(){
  panelChildren.forEach(node=>node.classList.add('hidden'));
  viewer.classList.add('hidden');
  gate.classList.add('hidden');
  let el=document.getElementById('expired');
  if(!el){el=document.createElement('div');el.id='expired';document.querySelector('.panel').appendChild(el)}
  el.innerHTML=`<h2>이용 기간이 종료되었습니다</h2><p class="hint">첫 로그인일로부터 6개월간 이용하실 수 있습니다. 연장이 필요하시면 카카오톡으로 문의해 주세요.</p><div class="actions"><button class="btn dark" onclick="window.open('https://open.kakao.com/me/gfield','_blank','noopener')">카카오톡 문의</button><button class="btn dark" onclick="HSMIDDLE_AUTH.clearSession();location.href='./login.html'">나가기</button></div>`;
}
function enterExam(session){
  if(!session||!session.access.includes(key))return false;
  student=session.name;
  if(HSMIDDLE_AUTH.isExpired(student)){showExpired();return true}
  verifiedAccess=true;
  document.getElementById('student').textContent=`${student} · 시험지와 답안 검수 화면`;
  document.querySelectorAll('.watermark span').forEach(span=>span.textContent=`${student} · GFIELD`);
  panelChildren.forEach(node=>node.classList.remove('hidden'));
  viewer.classList.remove('hidden');
  gate.classList.add('hidden');
  restoreMarks();
  return true;
}
async function signIn(){
  const name=document.getElementById('gate-name').value.trim(),code=document.getElementById('gate-code').value.trim().toUpperCase(),button=document.getElementById('gate-submit'),error=document.getElementById('gate-error');
  error.classList.add('hidden');button.disabled=true;button.textContent='확인 중';
  const session=await HSMIDDLE_AUTH.login(name,code);
  button.disabled=false;button.textContent='입장';
  if(!enterExam(session))error.classList.remove('hidden');
}
async function autoSignIn(){
  const saved=HSMIDDLE_AUTH.readSession();
  if(!saved.valid||!saved.access.includes(key))return;
  const session=await HSMIDDLE_AUTH.refreshSession();
  if(!enterExam(session))document.getElementById('gate-error').classList.remove('hidden');
}
function watermark(){const w=document.createElement('div');w.className='watermark';for(let i=0;i<3;i++){const s=document.createElement('span');s.textContent=`${student} · GFIELD`;w.append(s)}return w}
for(let n=1;n<=exam.pages;n++){const sec=document.createElement('section');sec.className='page';const img=document.createElement('img');img.src=`./assets/print/${exam.folder}/page-${String(n).padStart(2,'0')}.png`;img.alt=`${exam.title} ${n}쪽`;sec.append(img,watermark());viewer.append(sec)}
autoSignIn();
/* ── 맞은 문제 체크 방식 ─────────────────────────────────────────
   저장값 hs-{시험}-{번호} = 'o'(맞음) | 'x'(틀림, 채점 후) | 없음(아직 체크 안 함)
   채점하기를 누르면 체크하지 않은 문제가 'x'로 확정된다. 분석지(report.html)도 같은 값을 읽는다. */
const MARK_KEY=n=>`hs-${key}-${n}`,GRADED_KEY=`hs-${key}-graded`;
let graded=localStorage.getItem(GRADED_KEY)==='1',resultView='idle';
const live=document.getElementById('live'),resultBox=document.getElementById('result');
function isManualAnswer(expected){return ['수동','복수·수동'].includes(String(expected||'').trim())}
function getMark(n){const v=localStorage.getItem(MARK_KEY(n));return v==='o'||v==='x'?v:null}
function putMark(n,value){if(value)localStorage.setItem(MARK_KEY(n),value);else localStorage.removeItem(MARK_KEY(n))}
for(let i=1;i<=exam.questions;i++){
  const cell=document.createElement('button');
  cell.type='button';cell.className='ck';cell.id=`ck-${i}`;
  cell.setAttribute('aria-pressed','false');cell.setAttribute('aria-label',`${i}번 문제, 맞았으면 체크`);
  cell.innerHTML=`<span class="ck-n">${i}</span><span class="ck-s" aria-hidden="true"></span>`;
  cell.addEventListener('click',()=>toggleMark(i));
  answers.append(cell);
}
if(exam.locked){document.getElementById('notice').textContent='답안 검수 전입니다. 문제지와 영상만 열람할 수 있습니다.';document.querySelectorAll('.answer-grid,.live-row').forEach(el=>el.classList.add('hidden'));document.querySelector('.result').innerHTML='<div class="locked">답안 검수가 끝나면 채점과 약점 분석을 활성화합니다.</div>'}
function norm(v){return String(v||'').replace(/\s/g,'').replaceAll('㎡','m²').replaceAll('제곱센티미터','cm²').toLowerCase()}
function matches(given,expected){if(!expected||expected==='수동'||expected==='복수·수동')return null;const g=norm(given),e=norm(expected);if(g===e)return true;if(e.includes('또는'))return e.split('또는').map(norm).includes(g);return false}
/* 예전 방식(답을 직접 입력)으로 저장된 값은, 정답과 일치하는 문제만 '맞음'으로 옮겨 온다.
   일치하지 않거나 수동 채점 문항은 체크하지 않은 상태로 두어, 채점하기를 눌러도 기존 기록이 뒤집히지 않게 한다. */
function migrateLegacy(){
  for(let n=1;n<=exam.questions;n++){
    const raw=localStorage.getItem(MARK_KEY(n));
    if(raw==='o'||raw==='x')continue;
    const fields=exam.answerFields&&exam.answerFields[n];
    let ok=false;
    if(fields){
      const parts=fields.map((_,i)=>localStorage.getItem(`${MARK_KEY(n)}-${i}`));
      ok=parts.every(v=>v!=null&&String(v).trim()!=='')&&fields.every((f,i)=>matches(parts[i],f.answer)===true);
    }else if(raw!=null&&String(raw).trim()!==''){
      ok=matches(raw,exam.answers[n-1])===true;
    }
    if(ok)putMark(n,'o');
  }
}
function showOne(n){if(!verifiedAccess)return;resultView='one';const a=exam.answers[n-1],img=exam.answerImages&&exam.answerImages[n],note=exam.answerNotes&&exam.answerNotes[n];document.getElementById('result').innerHTML=`<b>${n}번 풀이</b><br><div>${n}. ${a}${note?`<pre style="white-space:pre-wrap;margin:8px 0;padding:10px;background:#f4f7fb;border-radius:5px;font:700 12px/1.7 Pretendard">${note}</pre>`:''}${img?`<br><img src="${img}" alt="${n}번 답안 풀이 이미지" style="display:block;width:100%;max-width:720px;margin:8px 0;border:1px solid #d5dfeb">`:''}</div>`;document.querySelector('.result').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
function buildFeedback(n,expected){
  const fb=document.createElement('div');fb.id=`fb-${n}`;fb.className='fb';
  const num=document.createElement('b');num.className='wn';num.textContent=`${n}번`;
  const ans=document.createElement('span');ans.className='ans';ans.textContent=isManualAnswer(expected)?'직접 채점 문항':`정답 ${expected}`;
  fb.append(num,ans);
  const meta=window.HSMIDDLE_EXAM_META&&HSMIDDLE_EXAM_META[key]&&HSMIDDLE_EXAM_META[key][n];
  if(meta&&meta.t!=null&&window.HSMIDDLE_PLAYER){
    const videoUrl=(window.HSMIDDLE_DATA&&HSMIDDLE_DATA.videos&&HSMIDDLE_DATA.videos[key])||'';
    const vm=videoUrl.match(/[?&]v=([\w-]{6,})/)||videoUrl.match(/youtu\.be\/([\w-]{6,})/);
    if(vm){
      const videoId=vm[1],start=meta.t;
      const videoBtn=document.createElement('button');videoBtn.type='button';videoBtn.textContent='▶ 영상';
      videoBtn.onclick=()=>HSMIDDLE_PLAYER.open({videoId,start,title:`${n}번 풀이 영상`,subtitle:meta.unit||''});
      fb.append(videoBtn);
    }
  }
  if((exam.answerNotes&&exam.answerNotes[n])||(exam.answerImages&&exam.answerImages[n])){
    const noteBtn=document.createElement('button');noteBtn.type='button';noteBtn.textContent='풀이';noteBtn.onclick=()=>showOne(n);fb.append(noteBtn);
  }
  return fb;
}
function scoreOf(right){return Number((right*2.5).toFixed(1))}
function syncAnswerButtons(){resultBox.querySelectorAll('.ans-ck').forEach(button=>button.setAttribute('aria-pressed',getMark(+button.dataset.n)==='o'?'true':'false'))}
function renderGrade(){
  resultView='grade';
  let right=0;const wrongNums=[];
  exam.answers.forEach((expected,i)=>{const n=i+1;if(getMark(n)==='o')right++;else wrongNums.push(n)});
  resultBox.innerHTML=`맞은 문제 <b>${right}</b>/${exam.questions}문항 · <b>${scoreOf(right)}</b>점`+
    (wrongNums.length?`<br><span class="hint">틀린 ${wrongNums.length}문항의 정답과 풀이 영상은 아래에서 바로 볼 수 있습니다.</span>`:'<br><span class="hint">모두 맞혔습니다.</span>')+
    '<div class="result-actions"><button class="btn dark" type="button" onclick="openReport()">분석지에서 확인·저장</button></div>';
  if(wrongNums.length){
    const list=document.createElement('div');list.className='wrong-list';
    wrongNums.forEach(n=>list.append(buildFeedback(n,exam.answers[n-1])));
    resultBox.append(list);
  }
}
function refresh(){
  let right=0;
  for(let n=1;n<=exam.questions;n++){
    const v=getMark(n),cell=document.getElementById(`ck-${n}`),wrong=graded&&v!=='o';
    if(v==='o')right++;
    cell.setAttribute('aria-pressed',v==='o'?'true':'false');
    cell.classList.toggle('is-wrong',wrong);
    cell.querySelector('.ck-s').textContent=v==='o'?'✓':wrong?'✗':'';
  }
  live.innerHTML=`맞은 문제 <b>${right}</b>개 · <b>${scoreOf(right)}</b>점 <small>/ 100점</small>`;
  syncAnswerButtons();
  if(graded&&resultView==='grade')renderGrade();
}
function restoreMarks(){migrateLegacy();refresh();if(graded)renderGrade()}
function toggleMark(n){
  if(!verifiedAccess||exam.locked)return;
  putMark(n,getMark(n)==='o'?(graded?'x':null):'o');
  refresh();
}
function markAll(correct){
  if(!verifiedAccess||exam.locked)return;
  for(let n=1;n<=exam.questions;n++)putMark(n,correct?'o':(graded?'x':null));
  refresh();
}
function grade(){
  if(exam.locked||!verifiedAccess)return;
  let right=0;
  for(let n=1;n<=exam.questions;n++)if(getMark(n)==='o')right++;
  if(!right&&!graded&&!confirm('맞은 문제가 하나도 체크되지 않았습니다. 모두 틀린 것으로 채점할까요?')){
    resultView='idle';
    resultBox.innerHTML='먼저 맞은 문제의 번호를 눌러 체크해 주세요.<br><span class="hint">체크하지 않은 문제는 틀린 것으로 채점됩니다.</span>';
    return;
  }
  for(let n=1;n<=exam.questions;n++)if(getMark(n)!=='o')putMark(n,'x');
  graded=true;localStorage.setItem(GRADED_KEY,'1');
  refresh();renderGrade();
}
function showAnswers(){
  if(exam.locked||!verifiedAccess)return;
  resultView='answers';
  resultBox.innerHTML='<b>검수 답안</b><span class="hint"> · 맞았으면 오른쪽 버튼을 눌러 체크하세요.</span>'+exam.answers.map((a,i)=>{
    const n=i+1,img=exam.answerImages&&exam.answerImages[n],note=exam.answerNotes&&exam.answerNotes[n];
    return `<div class="ans-row"><div class="ans-main">${n}. ${a}${note?`<pre style="white-space:pre-wrap;margin:8px 0;padding:10px;background:#f4f7fb;border-radius:5px;font:700 12px/1.7 Pretendard">${note}</pre>`:''}${img?`<br><img src="${img}" alt="${n}번 답안 풀이 이미지" style="display:block;width:100%;max-width:720px;margin:8px 0;border:1px solid #d5dfeb">`:''}</div><button type="button" class="ans-ck" data-n="${n}" aria-pressed="false" aria-label="${n}번 맞음 체크">맞음</button></div>`;
  }).join('');
  syncAnswerButtons();
}
resultBox.addEventListener('click',event=>{const button=event.target.closest('.ans-ck');if(button)toggleMark(+button.dataset.n)});
function printPaper(){if(!verifiedAccess)return;document.body.classList.remove('print-answers');print()}
function printAnswers(){
  if(!verifiedAccess)return;
  if(exam.locked){alert('답안 검수 전에는 답안을 인쇄할 수 없습니다.');return}
  let box=document.getElementById('answerPrint');
  if(!box){box=document.createElement('section');box.id='answerPrint';document.body.append(box)}
  const items=exam.answers.map((a,i)=>{
    const n=i+1,img=exam.answerImages&&exam.answerImages[n],note=exam.answerNotes&&exam.answerNotes[n];
    return `<li value="${n}"><b>${a}</b>${note?`<pre>${note}</pre>`:''}${img?`<img src="${img}" alt="${n}번 답안 풀이">`:''}</li>`;
  }).join('');
  box.innerHTML=`<h1>${exam.title} · 검수 답안</h1><div class="apmeta">${student} 학생 · GFIELD</div><ol>${items}</ol>`;
  document.body.classList.add('print-answers');
  const clear=()=>document.body.classList.remove('print-answers');
  window.addEventListener('afterprint',clear,{once:true});
  setTimeout(clear,3000);
  print();
}
function goToPanel(){const behavior=window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';document.querySelector('.panel').scrollIntoView({behavior,block:'start'})}
function watch(){if(!verifiedAccess)return;const url=HSMIDDLE_DATA.videos[key];if(url)window.open(url,'_blank','noopener')}
function openReport(){if(verifiedAccess)window.open(`./report.html?exam=${key}`,'_blank','noopener')}
Object.assign(window,{signIn,grade,markAll,showAnswers,printPaper,printAnswers,goToPanel,watch,openReport});
})();
</script>
</body></html>
