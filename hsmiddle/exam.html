<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>중등 모의고사</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#16263d;font-family:Pretendard,sans-serif}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:#0c1d34;color:#fff}.top b{font-size:15px}.top span{display:block;color:#adc0d6;font-size:11px;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{height:38px;padding:0 13px;border:0;border-radius:6px;background:#e6b930;color:#12233a;font-weight:900;cursor:pointer}.btn.dark{background:#203a5c;color:#fff}.shell{width:min(1280px,calc(100% - 28px));margin:18px auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}.viewer{display:grid;gap:14px}.page{position:relative;background:#fff;box-shadow:0 6px 18px rgba(26,48,76,.15)}.page img{display:block;width:100%;height:auto}.watermark{position:absolute;inset:0;pointer-events:none;overflow:hidden}.watermark span{position:absolute;left:50%;width:120%;transform:translate(-50%,-50%) rotate(-32deg);text-align:center;color:rgba(27,65,107,.14);font-size:28px;font-weight:900}.watermark span:nth-child(1){top:25%}.watermark span:nth-child(2){top:50%}.watermark span:nth-child(3){top:75%}.panel{background:#fff;border:1px solid #d5dfeb;border-radius:8px;padding:16px;box-shadow:0 5px 18px rgba(26,48,76,.06);position:sticky;top:64px;max-height:calc(100vh - 80px);overflow-y:auto;scrollbar-gutter:stable}.panel .actions{position:sticky;top:0;background:#fff;padding:6px 0;z-index:1}.panel h2{margin:0 0 8px;font-size:18px}.hint{font-size:12px;color:#60758d;line-height:1.6}.answer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.answer-grid label{font-size:11px;color:#60758d}.answer-grid input{width:100%;height:34px;margin-top:3px;padding:0 6px;border:1px solid #bdcddd;border-radius:4px;font:700 12px Pretendard}.result{margin-top:14px;padding:12px;border-radius:6px;background:#f4f7fb;font-size:13px;line-height:1.6}.locked{padding:12px;background:#fff7dd;border-left:4px solid #e2af23;line-height:1.6;font-size:13px}.video{width:100%;aspect-ratio:16/9;border:0;margin-top:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static;order:-1;max-height:none}.answer-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:560px){.shell{width:calc(100% - 16px);margin:10px auto}.answer-grid{grid-template-columns:repeat(4,1fr)}.top{align-items:flex-start}.top .actions{justify-content:flex-end;gap:6px}.btn{font-size:11px;padding:0 9px}}
@media print{.top,.panel{display:none}.shell{width:auto;margin:0}.layout{display:block}.page{box-shadow:none;break-after:page}.page:last-child{break-after:auto}}
#answerPrint{display:none}
#answerPrint h1{font-size:19px;margin:0 0 4px}
#answerPrint .apmeta{color:#5b6f88;font-size:12px;font-weight:700;margin-bottom:14px}
#answerPrint ol{margin:0;padding-left:22px;font-size:13px;line-height:1.8}
#answerPrint li{margin-bottom:4px;break-inside:avoid}
#answerPrint li b{color:#0c1d34}
#answerPrint pre{white-space:pre-wrap;margin:5px 0;padding:8px;background:#f4f7fb;border-radius:5px;font:700 11.5px/1.6 Pretendard,sans-serif}
#answerPrint img{max-width:460px;margin:6px 0;border:1px solid #d5dfeb}
@media print{
  body.print-answers .shell{display:none!important}
  body.print-answers #answerPrint{display:block}
  body.print-answers .page{break-after:auto}
}
.hidden{display:none!important}
.grade-mark{display:block;min-height:16px;margin-top:2px;font-size:12px;font-weight:950;text-align:center}.grade-mark.good{color:#147a4d}.grade-mark.bad{color:#bd3038}.grade-mark.manual{color:#9a6c00}.ox-control{display:flex;gap:4px;margin-top:3px}.ox-control button{height:28px;min-width:30px;padding:0;border:1px solid #b9c8d8;border-radius:4px;background:#f5f8fb;color:#294563;font-weight:900;cursor:pointer}.ox-control button.active-o{background:#d9f3e7;color:#147a4d;border-color:#62b58e}.ox-control button.active-x{background:#fde4e6;color:#bd3038;border-color:#d6858b}
.answer-parts{display:grid;gap:3px;margin-top:3px}.answer-parts span{display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:3px;font-size:9px;font-weight:800;color:#48637c}.answer-parts input{margin-top:0!important;text-align:center}
.answer-grid label.with-answer-image{grid-column:span 2}.answer-key-image{display:block;width:100%;max-height:120px;object-fit:contain;margin-top:5px;border:1px solid #d5dfeb;background:#fff}
</style>
</head>
<body>
<header class="top"><div><b id="title">중등 모의고사</b><span id="student"></span></div><div class="actions"><button class="btn dark" onclick="goToPanel()">답안 입력</button><button class="btn dark" onclick="location.href='./library.html'">목록</button><button class="btn dark" onclick="openReport()">분석지 보기</button><button class="btn dark" onclick="printPaper()">시험지 인쇄</button><button class="btn dark" onclick="printAnswers()">답안 인쇄</button></div></header>
<main class="shell"><div class="layout"><section class="viewer" id="viewer"></section><aside class="panel"><h2>답안 입력</h2><p class="hint" id="notice">40문항을 입력하면 검수된 문항만 채점합니다.</p><div class="actions"><button class="btn" onclick="grade()">채점하기</button><button class="btn dark" onclick="showAnswers()">답안 보기</button><button class="btn dark" onclick="watch()">전체 수업 영상</button></div><div class="answer-grid" id="answers"></div><div class="result" id="result">아직 채점하지 않았습니다.</div><div id="video"></div></aside></div></main>
<script src="./data.js"></script><script src="./exam-data.js"></script><script src="./shared-auth.js"></script><script src="./hsm-cloud.js"></script>
<script>
const p=new URLSearchParams(location.search),key=p.get('exam')||'mock-1',exam=HSMIDDLE_EXAMS[key]||HSMIDDLE_EXAMS['mock-1'];let student=(p.get('student')||localStorage.getItem('hs-student')||'학생').slice(0,30);const viewer=document.getElementById('viewer'),answers=document.getElementById('answers');
document.getElementById('title').textContent=exam.title;document.getElementById('student').textContent=`${student} · 시험지와 답안 검수 화면`;
const panel=document.querySelector('.panel'),panelChildren=[...panel.children],gate=document.createElement('div');
gate.id='gate';gate.innerHTML='<h2>승인 확인</h2><p class="hint">이 시험지의 승인번호를 입력하세요.</p><div class="actions"><input id="gate-name" placeholder="학생 이름"><input id="gate-code" placeholder="승인번호"><button class="btn" onclick="signIn()">입장</button></div><p class="hint hidden" id="gate-error">이름 또는 승인번호를 확인해 주세요.</p>';
panel.prepend(gate);panelChildren.forEach(node=>node.classList.add('hidden'));viewer.classList.add('hidden');
/* 이용 기간(6개월) 만료 시 본문을 안내로 교체하고 진행을 중단한다.
   서버가 없으므로 기기·브라우저 단위로만 관리된다. */
function showExpired(){
  panelChildren.forEach(node=>node.classList.add('hidden'));
  viewer.classList.add('hidden');
  gate.classList.add('hidden');
  let el=document.getElementById('expired');
  if(!el){el=document.createElement('div');el.id='expired';document.querySelector('.panel').appendChild(el)}
  el.innerHTML=`<h2>이용 기간이 종료되었습니다</h2><p class="hint">첫 로그인일로부터 6개월간 이용하실 수 있습니다. 연장이 필요하시면 카카오톡으로 문의해 주세요.</p><div class="actions"><button class="btn dark" onclick="window.open('https://open.kakao.com/me/gfield','_blank','noopener')">카카오톡 문의</button><button class="btn dark" onclick="HSMIDDLE_AUTH.clearSession();location.href='./login.html'">나가기</button></div>`;
}
function signIn(){const name=document.getElementById('gate-name').value.trim(),code=document.getElementById('gate-code').value.trim().toUpperCase();if(!HSMIDDLE_AUTH.isValidStudent(name,code)||!HSMIDDLE_AUTH.canAccess(name,key)){document.getElementById('gate-error').classList.remove('hidden');return}HSMIDDLE_AUTH.writeSession(name,code);student=name;if(HSMIDDLE_AUTH.isExpired(student)){showExpired();return}document.getElementById('student').textContent=`${student} · 시험지와 답안 검수 화면`;panelChildren.forEach(node=>node.classList.remove('hidden'));viewer.classList.remove('hidden');gate.classList.add('hidden')}
function autoSignIn(){const session=HSMIDDLE_AUTH.readSession();if(session.valid&&session.access.includes(key)){student=session.name;if(HSMIDDLE_AUTH.isExpired(student)){showExpired();return}document.getElementById('student').textContent=`${student} · 시험지와 답안 검수 화면`;panelChildren.forEach(node=>node.classList.remove('hidden'));viewer.classList.remove('hidden');gate.classList.add('hidden')}}
autoSignIn();
function watermark(){const w=document.createElement('div');w.className='watermark';for(let i=0;i<3;i++){const s=document.createElement('span');s.textContent=`${student} · GFIELD`;w.append(s)}return w}
for(let n=1;n<=exam.pages;n++){const sec=document.createElement('section');sec.className='page';const img=document.createElement('img');img.src=`./assets/print/${exam.folder}/page-${String(n).padStart(2,'0')}.png`;img.alt=`${exam.title} ${n}쪽`;sec.append(img,watermark());viewer.append(sec)}
function setOx(n,value){localStorage.setItem(`hs-${key}-${n}`,value);const box=document.getElementById(`ox-${n}`);if(!box)return;box.querySelectorAll('button').forEach(button=>button.className='');box.querySelector(`[data-value="${value}"]`).classList.add(value==='o'?'active-o':'active-x')}
function inputKey(n,part){return `hs-${key}-${n}${part===undefined?'':`-${part}`}`}
function answerInput(n,part){const input=document.createElement('input');input.id=part===undefined?`a-${n}`:`a-${n}-${part}`;input.autocomplete='off';input.value=localStorage.getItem(inputKey(n,part))||'';input.addEventListener('input',()=>saveInput(input,n,part));return input}
for(let i=1;i<=exam.questions;i++){const label=document.createElement('label');label.textContent=i;const mark=document.createElement('b');mark.id=`m-${i}`;mark.className='grade-mark';if(exam.oxQuestions&&exam.oxQuestions.includes(i)){const box=document.createElement('div');box.id=`ox-${i}`;box.className='ox-control';for(const value of ['o','x']){const button=document.createElement('button');button.type='button';button.dataset.value=value;button.textContent=value.toUpperCase();button.onclick=()=>setOx(i,value);box.append(button)}const saved=localStorage.getItem(`hs-${key}-${i}`);if(saved)setOx(i,saved);const answerImage=exam.answerImages&&exam.answerImages[i];if(answerImage){label.classList.add('with-answer-image');const image=document.createElement('img');image.className='answer-key-image';image.src=answerImage;image.alt=`${i}번 답안 그림`;label.append(box,image,mark)}else label.append(box,mark)}else{const fields=exam.answerFields&&exam.answerFields[i];if(fields){const box=document.createElement('div');box.className='answer-parts';fields.forEach((field,index)=>{const part=document.createElement('span');part.textContent=field.label;part.append(answerInput(i,index));box.append(part)});label.append(box,mark)}else label.append(answerInput(i),mark)}answers.append(label)}
if(exam.locked){document.getElementById('notice').textContent='답안 검수 전입니다. 문제지와 영상만 열람할 수 있습니다.';document.querySelector('.answer-grid').classList.add('hidden');document.querySelector('.result').innerHTML='<div class="locked">답안 검수가 끝나면 채점과 약점 분석을 활성화합니다.</div>'}
function norm(v){return String(v||'').replace(/\s/g,'').replaceAll('㎡','m²').replaceAll('제곱센티미터','cm²').toLowerCase()}
function matches(given,expected){if(!expected||expected==='수동'||expected==='복수·수동')return null;const g=norm(given),e=norm(expected);if(g===e)return true;if(e.includes('또는'))return e.split('또는').map(norm).includes(g);return false}
function formatAutoComma(value,expected){const parts=String(expected||'').split(',').map(part=>part.trim());if(parts.length<2||parts.some(part=>!/^\d+$/.test(part)))return value;const digits=String(value).replace(/\D/g,''),groups=[];let offset=0;for(const part of parts){const group=digits.slice(offset,offset+part.length);if(!group)break;groups.push(group);offset+=part.length}return groups.join(', ')}
function saveInput(input,n,part){if(part===undefined&&exam.autoCommaQuestions&&exam.autoCommaQuestions.includes(n))input.value=formatAutoComma(input.value,exam.answers[n-1]);localStorage.setItem(inputKey(n,part),input.value)}
function answerCheck(n,expected){const fields=exam.answerFields&&exam.answerFields[n];if(fields){const values=fields.map((_,index)=>document.getElementById(`a-${n}-${index}`).value.trim());if(values.some(value=>!value))return 'blank';return fields.every((field,index)=>matches(values[index],field.answer)===true)}const field=document.getElementById(`a-${n}`);if(!field||!field.value.trim())return 'blank';return matches(field.value,expected)}
function grade(){if(exam.locked)return;let correct=0,checked=0,manual=0;exam.answers.forEach((expected,i)=>{const given=document.getElementById(`a-${i+1}`).value;if(!given)return;checked++;const state=matches(given,expected);if(state===true)correct++;if(state===null)manual++});document.getElementById('result').innerHTML=`입력 ${checked}/${exam.questions}문항 · 자동 정답 ${correct}문항 · 수동 확인 ${manual}문항<br><span class="hint">검수 보류 문항은 풀이와 함께 확인해야 최종 점수가 확정됩니다.</span>`}
function grade(){if(exam.locked)return;let correct=0,checked=0,manual=0;exam.answers.forEach((expected,i)=>{const field=document.getElementById(`a-${i+1}`),mark=document.getElementById(`m-${i+1}`);mark.textContent='';mark.className='grade-mark';if(!field.value.trim())return;checked++;const state=matches(field.value,expected);if(state===true){correct++;mark.textContent='1';mark.classList.add('good')}else if(state===false){mark.textContent='0';mark.classList.add('bad')}else{manual++;mark.textContent='확인';mark.classList.add('manual')}});document.getElementById('result').innerHTML=`입력 ${checked}/${exam.questions}문항 · 정답 ${correct}문항 · 수동 확인 ${manual}문항<br><span class="hint">맞은 문항은 답안 번호 아래에 1로 표시했습니다.</span>`}
function grade(){if(exam.locked)return;let correct=0,checked=0,manual=0;exam.answers.forEach((expected,i)=>{const n=i+1,mark=document.getElementById(`m-${n}`);mark.textContent='';mark.className='grade-mark';const state=exam.oxQuestions&&exam.oxQuestions.includes(n)?(localStorage.getItem(`hs-${key}-${n}`)||'blank') : answerCheck(n,expected);if(state==='blank')return;checked++;if(state===true){correct++;mark.textContent='O';mark.classList.add('good')}else if(state===false){mark.textContent='X';mark.classList.add('bad')}else{manual++;mark.textContent='확인';mark.classList.add('manual')}});document.getElementById('result').textContent=`입력 ${checked}/${exam.questions}문항 · 정답 ${correct}문항 · 수동 확인 ${manual}문항`}
function showAnswers(){if(exam.locked)return;document.getElementById('result').innerHTML='<b>검수 답안</b><br>'+exam.answers.map((a,i)=>{const n=i+1,img=exam.answerImages&&exam.answerImages[n];return `<div>${n}. ${a}${img?`<br><img src="${img}" alt="${n}번 답안 풀이 이미지" style="display:block;width:100%;max-width:720px;margin:8px 0;border:1px solid #d5dfeb">`:''}</div>`}).join('')}
function showAnswers(){if(exam.locked)return;document.getElementById('result').innerHTML='<b>검수 답안</b><br>'+exam.answers.map((a,i)=>{const n=i+1,img=exam.answerImages&&exam.answerImages[n],note=exam.answerNotes&&exam.answerNotes[n];return `<div>${n}. ${a}${note?`<pre style="white-space:pre-wrap;margin:8px 0;padding:10px;background:#f4f7fb;border-radius:5px;font:700 12px/1.7 Pretendard">${note}</pre>`:''}${img?`<br><img src="${img}" alt="${n}번 답안 풀이 이미지" style="display:block;width:100%;max-width:720px;margin:8px 0;border:1px solid #d5dfeb">`:''}</div>`}).join('')}
function printPaper(){document.body.classList.remove('print-answers');print()}
function printAnswers(){
  if(exam.locked){alert('답안 검수 전에는 답안을 인쇄할 수 없습니다.');return}
  let box=document.getElementById('answerPrint');
  if(!box){box=document.createElement('section');box.id='answerPrint';document.body.append(box)}
  const items=exam.answers.map((a,i)=>{
    const n=i+1,img=exam.answerImages&&exam.answerImages[n],note=exam.answerNotes&&exam.answerNotes[n];
    return `<li value="${n}"><b>${a}</b>${note?`<pre>${note}</pre>`:''}${img?`<img src="${img}" alt="${n}번 답안 풀이">`:''}</li>`;
  }).join('');
  box.innerHTML=`<h1>${exam.title} · 검수 답안</h1><div class="apmeta">${student} 학생 · GFIELD</div><ol>${items}</ol>`;
  document.body.classList.add('print-answers');
  const clear=()=>document.body.classList.remove('print-answers');
  window.addEventListener('afterprint',clear,{once:true});
  setTimeout(clear,3000);
  print();
}
function goToPanel(){const behavior=window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';document.querySelector('.panel').scrollIntoView({behavior,block:'start'})}
function watch(){const url=HSMIDDLE_DATA.videos[key];if(url)window.open(url,'_blank','noopener')}
function openReport(){window.open(`./report.html?exam=${key}`,'_blank','noopener')}
</script>
</body></html>
