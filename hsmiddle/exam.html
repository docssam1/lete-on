<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>중등 모의고사</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#16263d;font-family:Pretendard,sans-serif}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:#0c1d34;color:#fff}.top b{font-size:15px}.top span{display:block;color:#adc0d6;font-size:11px;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{height:38px;padding:0 13px;border:0;border-radius:6px;background:#e6b930;color:#12233a;font-weight:900;cursor:pointer}.btn.dark{background:#203a5c;color:#fff}.shell{width:min(1280px,calc(100% - 28px));margin:18px auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}.viewer{display:grid;gap:14px}.page{position:relative;background:#fff;box-shadow:0 6px 18px rgba(26,48,76,.15)}.page img{display:block;width:100%;height:auto}.watermark{position:absolute;inset:0;pointer-events:none;overflow:hidden}.watermark span{position:absolute;left:50%;width:120%;transform:translate(-50%,-50%) rotate(-32deg);text-align:center;color:rgba(27,65,107,.14);font-size:28px;font-weight:900}.watermark span:nth-child(1){top:25%}.watermark span:nth-child(2){top:50%}.watermark span:nth-child(3){top:75%}.panel{background:#fff;border:1px solid #d5dfeb;border-radius:8px;padding:16px;box-shadow:0 5px 18px rgba(26,48,76,.06)}.panel h2{margin:0 0 8px;font-size:18px}.hint{font-size:12px;color:#60758d;line-height:1.6}.answer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.answer-grid label{font-size:11px;color:#60758d}.answer-grid input{width:100%;height:34px;margin-top:3px;padding:0 6px;border:1px solid #bdcddd;border-radius:4px;font:700 12px Pretendard}.result{margin-top:14px;padding:12px;border-radius:6px;background:#f4f7fb;font-size:13px;line-height:1.6}.locked{padding:12px;background:#fff7dd;border-left:4px solid #e2af23;line-height:1.6;font-size:13px}.video{width:100%;aspect-ratio:16/9;border:0;margin-top:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static}.answer-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:560px){.shell{width:calc(100% - 16px);margin:10px auto}.answer-grid{grid-template-columns:repeat(4,1fr)}.top{align-items:flex-start}.top .actions{justify-content:flex-end}.btn{font-size:11px;padding:0 9px}}
@media print{.top,.panel{display:none}.shell{width:auto;margin:0}.layout{display:block}.page{box-shadow:none;break-after:page}.page:last-child{break-after:auto}}
.hidden{display:none!important}
.grade-mark{display:block;min-height:16px;margin-top:2px;font-size:12px;font-weight:950;text-align:center}.grade-mark.good{color:#147a4d}.grade-mark.bad{color:#bd3038}.grade-mark.manual{color:#9a6c00}
</style>
</head>
<body>
<header class="top"><div><b id="title">중등 모의고사</b><span id="student"></span></div><div class="actions"><button class="btn dark" onclick="location.href='./index.html#exams'">목록</button><button class="btn dark" onclick="print()">답안·시험지 인쇄</button></div></header>
<main class="shell"><div class="layout"><section class="viewer" id="viewer"></section><aside class="panel"><h2>답안 입력</h2><p class="hint" id="notice">40문항을 입력하면 검수된 문항만 채점합니다.</p><div class="actions"><button class="btn" onclick="grade()">채점하기</button><button class="btn dark" onclick="showAnswers()">답안 보기</button><button class="btn dark" onclick="watch()">전체 수업 영상</button></div><div class="answer-grid" id="answers"></div><div class="result" id="result">아직 채점하지 않았습니다.</div><div id="video"></div></aside></div></main>
<script src="./data.js"></script><script src="./exam-data.js"></script>
<script>
const p=new URLSearchParams(location.search),key=p.get('exam')||'mock-1',exam=HSMIDDLE_EXAMS[key]||HSMIDDLE_EXAMS['mock-1'],student=(p.get('student')||sessionStorage.getItem('hs-student')||'학생').slice(0,30),viewer=document.getElementById('viewer'),answers=document.getElementById('answers');
document.getElementById('title').textContent=exam.title;document.getElementById('student').textContent=`${student} · 시험지와 답안 검수 화면`;
const panel=document.querySelector('.panel'),panelChildren=[...panel.children],gate=document.createElement('div');
gate.id='gate';gate.innerHTML='<h2>승인 확인</h2><p class="hint">이 시험지의 승인번호를 입력하세요.</p><div class="actions"><input id="gate-name" placeholder="학생 이름"><input id="gate-code" placeholder="승인번호"><button class="btn" onclick="signIn()">입장</button></div><p class="hint hidden" id="gate-error">이름 또는 승인번호를 확인해 주세요.</p>';
panel.prepend(gate);panelChildren.forEach(node=>node.classList.add('hidden'));viewer.classList.add('hidden');
function signIn(){const name=document.getElementById('gate-name').value.trim(),code=document.getElementById('gate-code').value.trim().toUpperCase();if(!HSMIDDLE_DATA.studentCode[name]||HSMIDDLE_DATA.studentCode[name]!==code||!(HSMIDDLE_DATA.access[name]||[]).includes(key)){document.getElementById('gate-error').classList.remove('hidden');return}sessionStorage.setItem('hs-student',name);sessionStorage.setItem('hs-code',code);student=name;document.getElementById('student').textContent=`${student} · 시험지와 답안 검수 화면`;panelChildren.forEach(node=>node.classList.remove('hidden'));viewer.classList.remove('hidden');gate.classList.add('hidden')}
function watermark(){const w=document.createElement('div');w.className='watermark';for(let i=0;i<3;i++){const s=document.createElement('span');s.textContent=`${student} · GFIELD`;w.append(s)}return w}
for(let n=1;n<=exam.pages;n++){const sec=document.createElement('section');sec.className='page';const img=document.createElement('img');img.src=`./assets/print/${exam.folder}/page-${String(n).padStart(2,'0')}.png`;img.alt=`${exam.title} ${n}쪽`;sec.append(img,watermark());viewer.append(sec)}
for(let i=1;i<=exam.questions;i++){const label=document.createElement('label');label.textContent=i;const input=document.createElement('input');input.id=`a-${i}`;input.autocomplete='off';input.value=sessionStorage.getItem(`hs-${key}-${i}`)||'';input.addEventListener('input',()=>sessionStorage.setItem(`hs-${key}-${i}`,input.value));const mark=document.createElement('b');mark.id=`m-${i}`;mark.className='grade-mark';label.append(input,mark);answers.append(label)}
if(exam.locked){document.getElementById('notice').textContent='답안 PDF 검수 전입니다. 문제지·영상만 열람할 수 있습니다.';document.querySelector('.answer-grid').classList.add('hidden');document.querySelector('.result').innerHTML='<div class="locked">마지막 정리는 답안 검수가 끝나면 채점과 약점 분석을 활성화합니다.</div>'}
function norm(v){return String(v||'').replace(/\s/g,'').replaceAll('㎡','m²').replaceAll('제곱센티미터','cm²').toLowerCase()}
function matches(given,expected){if(!expected||expected==='수동'||expected==='복수·수동')return null;const g=norm(given),e=norm(expected);if(g===e)return true;if(e.includes(','))return e.split(',').map(norm).includes(g);if(e.includes('또는'))return e.split('또는').map(norm).includes(g);return false}
function grade(){if(exam.locked)return;let correct=0,checked=0,manual=0;exam.answers.forEach((expected,i)=>{const given=document.getElementById(`a-${i+1}`).value;if(!given)return;checked++;const state=matches(given,expected);if(state===true)correct++;if(state===null)manual++});document.getElementById('result').innerHTML=`입력 ${checked}/${exam.questions}문항 · 자동 정답 ${correct}문항 · 수동 확인 ${manual}문항<br><span class="hint">검수 보류 문항은 풀이와 함께 확인해야 최종 점수가 확정됩니다.</span>`}
function grade(){if(exam.locked)return;let correct=0,checked=0,manual=0;exam.answers.forEach((expected,i)=>{const field=document.getElementById(`a-${i+1}`),mark=document.getElementById(`m-${i+1}`);mark.textContent='';mark.className='grade-mark';if(!field.value.trim())return;checked++;const state=matches(field.value,expected);if(state===true){correct++;mark.textContent='1';mark.classList.add('good')}else if(state===false){mark.textContent='0';mark.classList.add('bad')}else{manual++;mark.textContent='확인';mark.classList.add('manual')}});document.getElementById('result').innerHTML=`입력 ${checked}/${exam.questions}문항 · 정답 ${correct}문항 · 수동 확인 ${manual}문항<br><span class="hint">맞은 문항은 답안 번호 아래에 1로 표시했습니다.</span>`}
function showAnswers(){if(exam.locked)return;document.getElementById('result').innerHTML='<b>검수 답안</b><br>'+exam.answers.map((a,i)=>{const n=i+1,img=exam.answerImages&&exam.answerImages[n];return `<div>${n}. ${a}${img?`<br><img src="${img}" alt="${n}번 답안 풀이 이미지" style="display:block;width:100%;max-width:720px;margin:8px 0;border:1px solid #d5dfeb">`:''}</div>`}).join('')}
function showAnswers(){if(exam.locked)return;document.getElementById('result').innerHTML='<b>검수 답안</b><br>'+exam.answers.map((a,i)=>{const n=i+1,img=exam.answerImages&&exam.answerImages[n],note=exam.answerNotes&&exam.answerNotes[n];return `<div>${n}. ${a}${note?`<pre style="white-space:pre-wrap;margin:8px 0;padding:10px;background:#f4f7fb;border-radius:5px;font:700 12px/1.7 Pretendard">${note}</pre>`:''}${img?`<br><img src="${img}" alt="${n}번 답안 풀이 이미지" style="display:block;width:100%;max-width:720px;margin:8px 0;border:1px solid #d5dfeb">`:''}</div>`}).join('')}
function watch(){const url=HSMIDDLE_DATA.videos[key==='final-review'?'final-review':key];if(url)window.open(url,'_blank','noopener')}
</script>
</body></html>
