<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>프리미어 모의고사 서재 | G-FIELD</title>
  <meta name="description" content="프리미어 모의고사 원본 이미지 시험지와 인쇄">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="library">
  <header class="library-head"><div>
    <small>G-FIELD PREMIER</small>
    <h1>프리미어 모의고사 서재</h1>
    <p>원본 PDF의 문제 쪽을 그대로 분할한 프리미어 이미지 시험지입니다.</p>
  </div></header>
  <main class="library-main">
    <section class="library-grid" id="examGrid" aria-live="polite"></section>
  </main>
  <script src="../fields-classic/print-viewer/documents.js"></script>
  <script>
  (function () {
    const exams = Object.entries(window.GFIELD_PRINT_DOCUMENTS || {})
      .filter(([key]) => key.startsWith('premier-'))
      .map(([key, document]) => ({ key, ...document }));
    const grid = document.getElementById('examGrid');
    grid.innerHTML = exams.map((exam) => `
      <article class="exam-card">
        <div class="exam-card-top"><span class="round-tile">${exam.title.replace('프리미어 ', '')}</span><span class="state">원본 이미지</span></div>
        <h2>${exam.title}</h2>
        <p>PDF 문제 쪽 ${exam.pageCount}면을 원본 레이아웃 그대로 제공합니다.</p>
        <div class="card-meta"><span>20문항</span><span>60분</span><span>해설 쪽 제외</span><span>이미지 인쇄</span></div>
        <a class="open-viewer" href="../fields-classic/print-viewer/?doc=${encodeURIComponent(exam.key)}">시험지 열기</a>
      </article>`).join('');
  })();
  </script>
</body>
</html>
