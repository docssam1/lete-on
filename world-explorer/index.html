<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18394b" />
  <title>GFIELD World Explorer</title>
  <link rel="stylesheet" href="./styles.css?v=atlas-1" />
</head>
<body>
  <div class="orientation-gate" role="status" aria-live="polite">
    <div class="orientation-card"><span class="phone">↻</span><strong>가로 화면으로 돌려 주세요</strong><p>세계지도를 넓게 보며 탐험해요.</p></div>
  </div>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">G</span><div><p class="eyebrow">GFIELD SOCIAL WORLD</p><h1>World Explorer</h1></div></div>
      <div class="status-row" aria-label="탐험 현황">
        <span><i>⭐</i><b id="points">0</b><small>포인트</small></span>
        <span><i>🔥</i><b id="streak">0</b><small>연속</small></span>
        <span><i>🏳️</i><b id="solved">0</b>/<b id="totalCountries">195</b><small>탐험</small></span>
      </div>
    </header>

    <section class="mission-bar">
      <div class="mission-copy"><span class="mission-badge">TODAY</span><div><strong id="missionTitle">오늘의 세계 탐험</strong><p id="missionText">지도를 살펴보고 나라 퀴즈에 도전해 보세요.</p></div></div>
      <nav class="mode-tabs" aria-label="게임 모드">
        <button class="active" data-mode="flag"><span>🏳️</span>국기</button>
        <button data-mode="clue"><span>📖</span>정보</button>
        <button data-mode="location"><span>📍</span>위치</button>
      </nav>
    </section>

    <section class="game-grid">
      <article class="map-console">
        <div class="panel-head">
          <div><p>EXPLORE THE WORLD</p><h2>세계 탐험 지도</h2></div>
          <select id="continentFilter" aria-label="대륙 선택">
            <option value="all">전 세계</option><option value="asia">아시아</option><option value="europe">유럽</option><option value="africa">아프리카</option><option value="north-america">북아메리카</option><option value="south-america">남아메리카</option><option value="oceania">오세아니아</option>
          </select>
        </div>
        <div id="worldMap" class="world-map" aria-label="국가 경계가 표시된 세계 지도">
          <svg id="atlasSvg" viewBox="0 0 1000 520" role="img" aria-labelledby="mapTitle mapDesc">
            <title id="mapTitle">세계 국가 지도</title><desc id="mapDesc">대륙을 선택하거나 확대하여 탐험한 국가를 확인할 수 있습니다.</desc>
            <defs>
              <filter id="countryShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17394a" flood-opacity=".28"/></filter>
              <radialGradient id="oceanGlow" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#bce8ef"/><stop offset=".65" stop-color="#70bfd0"/><stop offset="1" stop-color="#397f9b"/></radialGradient>
            </defs>
            <rect width="1000" height="520" fill="url(#oceanGlow)" />
            <g id="graticuleLayer"></g><g id="countryLayer"></g><g id="markerLayer"></g>
          </svg>
          <div id="mapLoading" class="map-loading"><span></span><b>정확한 세계지도를 펼치는 중...</b></div>
          <div class="map-toolbar" aria-label="지도 조작">
            <button id="zoomIn" type="button" aria-label="확대">＋</button><button id="zoomOut" type="button" aria-label="축소">−</button><button id="resetMap" type="button" aria-label="전체 지도">⌂</button>
          </div>
          <div class="map-legend"><span><i class="not-visited"></i>미탐험</span><span><i class="visited"></i>탐험 완료</span><span><i class="target"></i>이번 문제</span></div>
          <div id="mapTooltip" class="map-tooltip" hidden></div>
        </div>
        <div id="continentProgress" class="continent-progress"></div>
      </article>

      <article class="quiz-console">
        <div class="panel-head quiz-head"><div><p>WORLD MISSION</p><h2 id="quizHeading">국기를 보고 나라를 맞혀요</h2></div><button id="speakToggle" class="sound-button" type="button" aria-pressed="false">🔈 음성 켜기</button></div>
        <div id="quizVisual" class="quiz-visual"></div>
        <p id="quizPrompt" class="quiz-prompt"></p>
        <div id="answers" class="answers"></div>
        <div class="quiz-actions"><button id="hintButton" type="button">💡 힌트</button><button id="nextButton" class="next" type="button" disabled>다음 나라 →</button></div>
      </article>
    </section>

    <section class="bottom-dock">
      <article class="collection-card"><div class="dock-title"><span>🎒</span><div><small>COLLECTION</small><h2>큐비의 여행 가방</h2></div></div><div id="inventory" class="inventory"></div></article>
      <article class="collection-card"><div class="dock-title"><span>🏘️</span><div><small>MY WORLD</small><h2>세계 마을</h2></div></div><div id="buildings" class="buildings"></div></article>
      <aside class="guide" aria-live="polite"><div class="speech"><strong>큐비</strong><p id="guideMessage">어느 나라부터 탐험할까?</p></div><div class="cubi" aria-label="쌓기나무 캐릭터 큐비"><span></span><span></span><span></span></div></aside>
    </section>

    <dialog id="countryDialog" class="country-dialog"><article><button id="closeDialog" class="close" aria-label="닫기">×</button><div id="countryCard"></div></article></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="./app.js?v=atlas-1"></script>
</body>
</html>
