<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>팝콘 실험실 소개 영상</title>
<meta name="description" content="실험을 돕고, 탐구를 이끄는 교재 — 팝콘 실험실 소개 숏릴(45초·15초)">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff6e5;color:#3b2412;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
  main{width:min(980px,calc(100% - 32px));margin:34px auto 64px;display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:36px;align-items:start}
  .eyebrow{color:#e89b2d;font-size:13px;font-weight:900;letter-spacing:.08em}
  h1{margin:10px 0 16px;font-size:clamp(28px,4.4vw,48px);line-height:1.16;letter-spacing:-.04em}
  p{margin:0 0 14px;line-height:1.7;color:#6b5240}
  .player{position:relative;overflow:hidden;border-radius:28px;background:#14244a;box-shadow:0 20px 52px rgba(59,36,18,.22);border:6px solid #fff}
  video{display:block;width:100%;aspect-ratio:9/16;background:#14244a}
  .play-cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,36,74,.12);border:0;cursor:pointer}
  .play-cover span{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border-radius:18px;background:#3b2412;color:#ffd54a;font-size:19px;font-weight:900;box-shadow:0 12px 28px rgba(0,0,0,.3)}
  .play-cover[hidden]{display:none}
  .tabs{display:flex;gap:10px;margin:0 0 18px}
  .tab{flex:1;min-height:52px;border:3px solid #3b2412;border-radius:16px;background:#fff;color:#3b2412;font:900 16px inherit;font-family:inherit;cursor:pointer}
  .tab[aria-pressed="true"]{background:#ffd54a}
  .button{display:flex;min-height:58px;align-items:center;justify-content:center;border-radius:17px;padding:0 18px;text-decoration:none;font-weight:900;font-size:17px;background:#3b2412;color:#ffd54a;margin-top:10px}
  .button.light{background:#fff;color:#3b2412;border:3px solid #3b2412}
  ul{margin:6px 0 18px;padding-left:20px;line-height:1.8;color:#6b5240}
  @media(max-width:760px){main{grid-template-columns:1fr;margin-top:18px;gap:22px}}
</style>
<main>
  <div class="player">
    <video id="reel" controls playsinline preload="metadata" poster="popcorn-lab-reel-45s-poster.jpg">
      <source src="popcorn-lab-reel-45s.mp4" type="video/mp4">
    </video>
    <button class="play-cover" id="playCover" type="button" aria-label="영상 재생"><span>▶ 영상으로 보기</span></button>
  </div>
  <section>
    <div class="eyebrow">팝콘 실험실 · 소개 영상</div>
    <h1>실험을 돕고,<br>탐구를 이끄는 교재</h1>
    <p>함께 만들고, 스스로 알아내는 과학. 랩코니·스타리·버터비와 교구를 조립하고, 예상부터 나의 설명까지 이어 가요.</p>
    <div class="tabs" role="group" aria-label="영상 길이">
      <button class="tab" type="button" data-len="45s" aria-pressed="true">본편 45초</button>
      <button class="tab" type="button" data-len="15s" aria-pressed="false">축약 15초</button>
    </div>
    <ul>
      <li>벨 · 샤를 · 파브르 · 갈릴레이 · 라부아지에 5단계</li>
      <li>매달 새 교구 · 1년 12가지 실험 · 주 1회 수업</li>
      <li>교과서 단원과 연결된 3D 실험과 탐구 교재</li>
    </ul>
    <a class="button" href="../../science-lab/popcorn/fabre-09/current/index.html">팝콘 실험실 둘러보기</a>
    <a class="button light" id="download" href="popcorn-lab-reel-45s.mp4" download>영상 파일 받기</a>
  </section>
</main>
<script>
  const video = document.getElementById('reel'), cover = document.getElementById('playCover');
  const dl = document.getElementById('download');
  const play = () => { cover.hidden = true; video.play(); };
  cover.addEventListener('click', play);
  video.addEventListener('play', () => cover.hidden = true);
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    const len = b.dataset.len;
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    video.pause();
    video.poster = `popcorn-lab-reel-${len}-poster.jpg`;
    video.querySelector('source').src = `popcorn-lab-reel-${len}.mp4`;
    dl.href = `popcorn-lab-reel-${len}.mp4`;
    video.load(); cover.hidden = false;
  }));
</script>
</html>
