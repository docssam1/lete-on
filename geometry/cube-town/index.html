<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GFIELD Cube Town</title>
    <link rel="stylesheet" href="./styles.css?v=foldy-20260815a" />
    <link rel="stylesheet" href="../shared/pwa.css?v=2" />
    <script src="../shared/viewport-fit.js?v=1"></script>
    <link rel="manifest" href="/geometry/manifest.webmanifest" />
    <meta name="theme-color" content="#2b1a0e" />
    <link rel="apple-touch-icon" href="/geometry/assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Geometry World" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <header class="topbar">
      <a class="map-back" href="../world-map/?enter=1" data-i18n="back">← 지도</a>
      <div class="town-brand">
        <p>GFIELD Geometry World</p>
        <strong>GFIELD Cube Town</strong>
      </div>
      <div class="top-actions">
        <div class="points">
          <svg class="point-icon" aria-hidden="true" focusable="false"><use href="../world-map/assets/point-mall-icons.svg#cat-gem"></use></svg>
          <strong id="points">120</strong>
        </div>
        <span id="avatar" class="avatar character-sprite sprite-0"></span>
        <strong id="playerName" class="player-name"></strong>
        <div class="languages">
          <button type="button" data-lang="ko" class="active">한</button>
          <button type="button" data-lang="zh">中</button>
          <button type="button" data-lang="ja">日</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main class="catalog-shell">
      <section class="catalog-heading">
        <div>
          <span data-i18n="eyebrow">CUBE LEARNING PATH</span>
          <h1 data-i18n="title">쌓기나무로 여는 공간 사고의 세계</h1>
          <p data-i18n="subtitle">기초 조작부터 세 방향 추론까지, 단계별로 도전해요.</p>
        </div>
        <a href="./print.html" class="study-banner">
          <span class="study-icon" aria-hidden="true">▤</span>
          <span><strong data-i18n="worksheet">문제은행 학습지</strong><small data-i18n="worksheetDesc">레벨과 문제 수를 골라 인쇄해요</small></span>
          <b aria-hidden="true">›</b>
        </a>
      </section>
      <div id="levelGroups" class="level-groups"></div>
    </main>

    <div id="copyLevelDialog" class="copy-level-dialog" hidden>
      <section class="copy-level-panel" role="dialog" aria-modal="true" aria-labelledby="copyLevelTitle">
        <header class="copy-level-head">
          <div>
            <h2 id="copyLevelTitle">똑같이 쌓기</h2>
            <p id="copyLevelSubtitle">도전할 레벨을 골라 바로 시작해요.</p>
          </div>
          <button id="closeCopyLevelDialog" type="button" aria-label="닫기">&times;</button>
        </header>
        <div id="copyLevelOptions" class="copy-level-options"></div>
      </section>
    </div>

    <script type="module" src="./app.js?v=foldy-20260815a"></script>
    <script src="../shared/pwa.js?v=3" defer></script>
  </body>
</html>
