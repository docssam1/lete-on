<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GFIELD Geoboard Studio</title>
  <link rel="stylesheet" href="./styles.css?v=geoboard-7" />
  <link rel="stylesheet" href="../../shared/pwa.css?v=2" />
  <script src="../../shared/viewport-fit.js?v=1"></script>
  <link rel="manifest" href="/geometry/manifest.webmanifest" />
  <meta name="theme-color" content="#2f4f74" />
  <link rel="apple-touch-icon" href="/geometry/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <!--
    Shell copied from games/mirror-manor (itself copied from games/paper-fold) so
    that exit, brand, LEVEL n + k / 5 progress, mute and the level picker sit in
    exactly the same places a child already knows from the other mobile games.
    Only the play area differs: an inline SVG peg board instead of a cell grid,
    because this game stretches rubber bands between points, and the project's
    2D convention is inline SVG (never canvas, never three.js).
  -->
  <main class="yard-shell">
    <header class="topbar">
      <a class="icon-button exit" href="../../world-map/" aria-label="Back to the Geometry World map">&larr;</a>
      <div class="brand"><strong>GFIELD</strong><small>Geoboard Studio</small></div>
      <div class="progress"><strong id="levelLabel">LEVEL 1</strong><span id="problemLabel">1 / 5</span></div>
      <button id="soundButton" class="icon-button" type="button" aria-label="Toggle sound">&#128266;</button>
      <button id="levelButton" class="level-button" type="button">Levels</button>
    </header>

    <section class="mission" aria-live="polite">
      <div><span id="stars" aria-hidden="true">*----</span><h1 id="missionTitle">Geoboard Studio</h1></div>
      <p id="prompt"></p>
    </section>

    <section class="play-area">
      <article class="board-panel model-panel">
        <header class="board-heading"><span id="modelLabel">만들 모양</span><b id="modelShape"></b></header>
        <div class="board-stage">
          <svg id="modelBoard" class="board model-board" viewBox="0 0 100 100" role="img" aria-label="Model"></svg>
        </div>
      </article>
      <article class="board-panel build-panel">
        <header class="board-heading"><span id="buildLabel">내가 만드는 모양</span></header>
        <div class="board-stage">
          <!-- One square viewBox for every level. The engine positions pegs from the
               lattice size, so a future 6x6 board needs no markup change. -->
          <svg id="board" class="board" viewBox="0 0 100 100" role="application" aria-label="Peg board">
            <rect class="board-face" x="0" y="0" width="100" height="100" rx="3" />
            <g id="bandLayer" class="band-layer"></g>
            <g id="pegLayer" class="peg-layer"></g>
            <!-- Invisible finger targets sit ABOVE everything so a tap never lands
                 on a rubber band instead of the peg it was aimed at. -->
            <g id="hitLayer" class="hit-layer"></g>
          </svg>
        </div>
      </article>
      <aside id="toolPanel" class="tool-panel" aria-label="게임 도구">
        <button id="hintButton" type="button">Hint</button>
        <button id="retryButton" type="button">Clear</button>
      </aside>
    </section>

    <section class="answer-dock">
      <p id="answerPrompt"></p>
      <div id="shapeStats" class="shape-stats" aria-live="polite"></div>
      <button id="nextButton" class="next-button" type="button" hidden>Next</button>
    </section>

    <aside id="cubiGuide" class="cubi-guide" aria-live="polite">
      <div id="guideBubble" class="guide-bubble"></div>
      <span class="cubi-sprite" aria-hidden="true"></span>
    </aside>

    <div id="tutorial" class="dialog" hidden>
      <section class="tutorial-card" role="dialog" aria-modal="true" aria-labelledby="tutorialText">
        <span class="cubi-sprite" aria-hidden="true"></span>
        <div class="tutorial-demo" aria-hidden="true">
          <svg id="tutorialBoard" viewBox="0 0 100 100">
            <rect class="tutorial-board-face" x="2" y="2" width="96" height="96" rx="5" />
            <g id="tutorialDemoLayer"></g>
            <g id="tutorialPegLayer"></g>
          </svg>
        </div>
        <div class="tutorial-copy"><p id="tutorialText"></p><div id="tutorialDots" class="tutorial-dots"></div><button id="tutorialNext" type="button">Next</button></div>
      </section>
    </div>

    <div id="levelDialog" class="dialog" hidden>
      <section role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <header><h2 id="dialogTitle">Choose a level</h2><button id="closeLevels" type="button" aria-label="Close">X</button></header>
        <div id="levelList" class="level-list"></div>
      </section>
    </div>

    <div id="completeDialog" class="dialog" hidden>
      <section class="complete-card" role="dialog" aria-modal="true">
        <span class="cubi-sprite" aria-hidden="true"></span>
        <h2 id="completeTitle">Level complete!</h2><p id="completeText"></p>
        <div class="complete-actions"><button id="nextLevelButton" type="button">Next level</button><button id="practiceButton" type="button">Practice again</button><a id="mapLink" href="../../world-map/">Back to the map</a></div>
      </section>
    </div>

    <div id="success" class="success" aria-hidden="true"><span></span><strong>GREAT JOB!</strong></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./app.js?v=geoboard-7"></script>
  <script src="../../shared/pwa.js?v=3" defer></script>
</body>
</html>
