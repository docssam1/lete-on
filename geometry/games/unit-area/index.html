<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GFIELD 단위넓이 탐구</title>
<link rel="stylesheet" href="./styles.css?v=area-1"><link rel="manifest" href="/geometry/manifest.webmanifest"><meta name="theme-color" content="#24616c"></head>
<body><main class="studio area-studio">
  <header class="topbar"><a id="back" class="icon-button" href="../../shape-garden/"></a><div class="brand"><strong>GFIELD</strong><span id="studioTitle"></span></div><a id="worksheet" class="button" href="../../worksheet/unit-area/"></a><select id="language" aria-label="언어"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option></select></header>
  <nav id="domainTabs" class="domain-tabs" aria-label="학습 영역"></nav>
  <header class="mission"><div><p class="eyebrow">UNIT AREA</p><h1 id="title"></h1></div><div class="progress"><span id="progress"></span><progress id="progressBar" max="5" value="0"></progress></div></header>
  <section class="question" aria-labelledby="prompt"><h2 id="prompt" tabindex="-1"></h2>
    <div class="workbench"><div class="drawing-surface"><div id="board" class="board"></div><div class="board-tools"><button id="undo" class="icon-button" type="button"></button><label id="alignLabel" class="align-control" hidden><input id="aligned" type="checkbox"><span id="alignText"></span></label><p id="manipulationStatus" role="status" aria-live="polite"></p></div></div><div class="response">
      <form id="answerForm"><div id="numberResponse"><label id="answerLabel" for="answer"></label><div class="number-field"><input id="answer" type="number" inputmode="numeric" min="0" max="36" step="1" autocomplete="off"><span id="unit"></span></div></div>
        <fieldset id="compareResponse" hidden><legend id="compareLabel"></legend><div class="comparison-choices"><label><input type="radio" name="comparison" value="less"><span aria-hidden="true">A &lt; B</span></label><label><input type="radio" name="comparison" value="equal"><span aria-hidden="true">A = B</span></label><label><input type="radio" name="comparison" value="greater"><span aria-hidden="true">A &gt; B</span></label></div></fieldset>
        <p id="buildReadout" hidden></p><button id="check" class="primary-button" type="submit"></button>
      </form><p id="feedback" role="status" aria-live="polite"></p><details id="hint"><summary id="hintTitle"></summary><p id="hintText"></p></details><section id="review" class="review" hidden><h3 id="reviewTitle"></h3><p id="solution"></p></section>
    </div></div>
  </section><footer class="actions"><button id="retry" class="icon-button" type="button"></button><button id="next" class="primary-button" type="button" hidden></button></footer>
  <aside class="principle"><p id="principle"></p></aside><p class="watermark">GFIELD</p><p id="storageWarning" role="status"></p>
  <dialog id="completion"><h2 id="completeTitle"></h2><p id="completeText"></p><div class="dialog-actions"><a id="practice" class="primary-button"></a><a id="garden" class="button" href="../../shape-garden/"></a><button id="close" class="icon-button" type="button"></button></div></dialog>
</main><script type="module" src="./app.js?v=area-1"></script><script src="../../shared/pwa.js?v=3" defer></script></body></html>
