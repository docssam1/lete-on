<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GFIELD Paper Turn</title>
  <link rel="stylesheet" href="./styles.css?v=paper-turn-1" />
  <link rel="stylesheet" href="../../shared/pwa.css?v=2" />
  <link rel="manifest" href="/geometry/manifest.webmanifest" />
  <meta name="theme-color" content="#145f63" />
  <script src="../../shared/viewport-fit.js?v=1"></script>
</head>
<body>
  <main class="turn-shell">
    <header class="topbar">
      <a class="icon-button exit" href="../../origami-studio/" aria-label="오리가미 스튜디오로 나가기">&larr;</a>
      <div class="brand"><strong>GFIELD</strong><small>Paper Turn</small></div>
      <div class="progress"><strong id="levelLabel">LEVEL 1</strong><span id="problemLabel">1 / 5</span></div>
      <button id="soundButton" class="icon-button" type="button" aria-label="소리 끄기">&#9835;</button>
      <button id="levelButton" class="level-button" type="button">레벨</button>
    </header>

    <section class="mission" aria-live="polite">
      <div><span id="courseTag">COURSE 2</span><h1 id="missionTitle">접힌 종이 뒤집기</h1></div>
      <p id="prompt">화살표 방향으로 뒤집은 모양을 찾아보세요.</p>
    </section>

    <section class="transform-stage" aria-label="색종이 돌리기와 뒤집기 문제">
      <article class="source-panel">
        <h2 id="sourceTitle">시작 모양</h2>
        <div id="sourceBoard" class="matrix-board source-board"></div>
      </article>

      <div class="operation-panel">
        <p id="operationTitle">순서대로 움직여요</p>
        <div id="operationSteps" class="operation-steps"></div>
        <button id="playButton" type="button"><span aria-hidden="true">&#9654;</span><b>움직임 보기</b></button>
      </div>

      <article class="choice-panel">
        <h2 id="choiceTitle">알맞은 결과</h2>
        <div id="choiceGrid" class="choice-grid"></div>
      </article>
    </section>

    <nav class="action-bar" aria-label="게임 도구">
      <button id="hintButton" type="button">힌트</button>
      <button id="retryButton" type="button">다시</button>
      <a href="../../worksheet/paper-fold/">학습지</a>
      <button id="nextButton" class="next-button" type="button" hidden>다음 문제</button>
    </nav>

    <aside id="foldyGuide" class="foldy-guide" aria-live="polite">
      <div id="guideBubble" class="guide-bubble"></div>
      <img src="../../world-map/assets/foldy-character.webp" alt="폴디" />
    </aside>

    <div id="tutorial" class="dialog" hidden>
      <section class="tutorial-card" role="dialog" aria-modal="true">
        <img src="../../world-map/assets/foldy-character.webp" alt="폴디" />
        <div><p id="tutorialText"></p><div id="tutorialDots" class="tutorial-dots"></div><button id="tutorialNext" type="button">다음</button></div>
      </section>
    </div>

    <div id="levelDialog" class="dialog" hidden>
      <section role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <header><h2 id="dialogTitle">레벨 선택</h2><button id="closeLevels" type="button" aria-label="닫기">X</button></header>
        <div id="levelList" class="level-list"></div>
      </section>
    </div>

    <div id="completeDialog" class="dialog" hidden>
      <section class="complete-card" role="dialog" aria-modal="true">
        <img src="../../world-map/assets/foldy-character.webp" alt="폴디" />
        <h2 id="completeTitle">레벨 완료!</h2><p id="completeText">방향을 끝까지 정확하게 따라갔어요.</p>
        <div class="complete-actions"><button id="nextLevelButton" type="button">다음 레벨</button><button id="practiceButton" type="button">같은 레벨 더 풀기</button><a href="../../origami-studio/">오리가미 스튜디오</a></div>
      </section>
    </div>

    <div id="success" class="success" aria-hidden="true"><div class="burst"></div><strong>SUCCESS!</strong></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./app.js?v=paper-turn-1"></script>
  <script src="../../shared/pwa.js?v=3" defer></script>
</body>
</html>
