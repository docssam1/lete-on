<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GFIELD Cube Town - Shape Build</title>
    <link rel="stylesheet" href="../../styles.css?v=menu-cleanup-20260719a" />
    <link rel="stylesheet" href="../../shared/portrait-lock.css?v=1" />
    <link rel="stylesheet" href="./shape-build.css?v=shape-build-20260728a" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
        }
      }
    </script>
    <script src="../../shared/viewport-fit.js?v=1"></script>
    <link rel="manifest" href="/geometry/manifest.webmanifest" />
    <meta name="theme-color" content="#2b1a0e" />
    <link rel="apple-touch-icon" href="/geometry/assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="shape-build-page">
    <section class="portrait-guard" aria-label="화면 회전 안내">
      <div class="portrait-brand">GFIELD <span>Cube Town</span></div>
      <div class="rotate-phone" aria-hidden="true">
        <span class="rotate-phone-device"></span>
        <span class="rotate-phone-arrow">↻</span>
      </div>
      <div class="portrait-guide">
        <span class="portrait-character character-sprite sprite-0 color-original" aria-hidden="true"></span>
        <div>
          <strong>가로로 돌려 주세요</strong>
          <p>여러 입체를 넓은 판에서 움직여 볼까요?</p>
        </div>
      </div>
    </section>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GFIELD Geometry World</p>
          <h1>GFIELD Cube Town</h1>
        </div>
        <div class="language-switch" aria-label="Language">
          <button data-lang="ko" class="active">한국어</button>
          <button data-lang="zh">中文</button>
          <button data-lang="ja">日本語</button>
          <button data-lang="en">English</button>
        </div>
        <button id="topLevelPickerButton" class="top-level-button" type="button" aria-haspopup="dialog">레벨 선택</button>
      </header>

      <section class="play-area">
        <article class="viewer target-view">
          <div class="viewer-heading"><h2 id="targetTitle">문제 모양</h2></div>
          <div id="targetCanvas" class="canvas-wrap"></div>
        </article>
        <article class="viewer build-view">
          <div class="viewer-heading"><h2 id="buildTitle">내가 만든 모양</h2></div>
          <nav class="build-utilities" aria-label="Game settings">
            <button id="audioToggle" class="utility-button" type="button" aria-pressed="false" aria-label="Mute"><span aria-hidden="true">🔊</span></button>
            <a class="utility-button menu-exit" href="../../cube-town/" aria-label="나가기" data-i18n-aria="exit"><span class="exit-icon" aria-hidden="true">⌂</span><small data-i18n="exit">나가기</small></a>
          </nav>
          <div id="buildCanvas" class="canvas-wrap interactive"></div>
        </article>
      </section>

      <section class="builder-controls" aria-label="입체 조각 보관함">
        <div id="shapePile" class="pile-button shape-pile">
          <div id="shapeTray" class="shape-tray"></div>
          <span class="shape-tray-copy">
            <strong id="trayTitle">입체 조각</strong>
            <small id="trayHint">조각을 끌어다 놓아요</small>
          </span>
        </div>
      </section>

      <section class="control-strip shape-controls">
        <button id="viewFront" class="rail-button" type="button"><b aria-hidden="true">↑</b><span data-i18n="front">앞</span></button>
        <button id="viewRight" class="rail-button" type="button"><b aria-hidden="true">→</b><span data-i18n="right">오른쪽</span></button>
        <button id="viewTop" class="rail-button" type="button"><b aria-hidden="true">◆</b><span data-i18n="top">위</span></button>
        <button id="resetBuild" class="rail-button" type="button"><b aria-hidden="true">⌫</b><span data-i18n="reset">처음부터</span></button>
        <button id="rotatePiece" class="rail-button" type="button"><b aria-hidden="true">↻</b><span data-i18n="rotate">방향</span></button>
        <button id="checkAnswer" class="rail-button primary" type="button"><b aria-hidden="true">✓</b><span data-i18n="check">확인</span></button>
        <button id="nextStep" class="rail-button" type="button"><b aria-hidden="true">➜</b><span data-i18n="next">다음 문제</span></button>
      </section>

      <div id="levelDialog" class="level-dialog" hidden>
        <section class="level-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="levelDialogTitle">
          <header class="level-dialog-head">
            <h2 id="levelDialogTitle">레벨 선택</h2>
            <button id="closeLevelDialog" class="icon-button" type="button" aria-label="닫기">&times;</button>
          </header>
          <div id="levelOptions" class="level-options"></div>
        </section>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <aside id="shapeGuide" class="floating-guide" aria-live="polite">
        <div class="guide-bubble">
          <div class="guide-head">
            <strong class="guide-title">큐비</strong>
          </div>
          <p id="guideMessage">조각의 모양과 방향을 잘 살펴보자!</p>
        </div>
        <span class="guide-character character-sprite sprite-0 color-original" aria-hidden="true"></span>
      </aside>
      <div id="successBurst" class="success-burst" aria-hidden="true">
        <strong>SUCCESS!</strong>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div id="shapeDragGhost" class="drag-ghost shape-drag-ghost" aria-hidden="true"></div>
      <div id="piecePopup" class="piece-popup" hidden role="dialog" aria-label="조각 방향 조정">
        <div class="piece-popup-inner"></div>
      </div>
    </main>

    <script type="module" src="./shape-build.js?v=rail-fix-colors-20260728a"></script>
    <script>
      window.GF_TUTORIAL = {
        key: "gfield-shape-build-tutorial-v1",
        steps: {
          ko: [
            "왼쪽은 문제 모양이야. 오른쪽에 똑같은 모양을 만들면 돼!",
            "아래 보관함에서 조각을 끌어다 놓아 보자. 정육면체도 있고 길쭉한 직육면체도 있어.",
            "직육면체는 눕힌 방향과 세운 방향이 달라. 놓은 조각을 톡 누르면 방향을 바꿀 수 있어!",
            "색깔이 다른 조각도 있어. 색깔까지 문제 모양과 똑같이 맞춰 보자.",
            "앞·오른쪽·위 버튼을 누르면 여러 방향에서 살펴볼 수 있어. 이제 시작해 볼까?"
          ],
          zh: [
            "左边是目标形状，在右边做出一模一样的形状就可以了！",
            "从下面的托盘把积木拖过来吧。有正方体，也有长长的长方体。",
            "长方体躺着和立着方向不同。轻点放好的积木就能改变方向！",
            "还有颜色不同的积木。颜色也要和目标形状一样哦。",
            "按前面·右侧·上面按钮，可以从各个方向观察。现在开始吧！"
          ],
          ja: [
            "左が問題の形だよ。右に同じ形を作ればいいんだ！",
            "下のトレイからブロックをドラッグしてみよう。立方体も、細長い直方体もあるよ。",
            "直方体はねかせた向きとたてた向きがちがうよ。置いたブロックをトンと押すと向きを変えられる！",
            "色のちがうブロックもあるよ。色まで問題の形と同じにそろえてみよう。",
            "前・右側・上のボタンでいろいろな向きから見られるよ。さあ、始めよう！"
          ],
          en: [
            "The target shape is on the left. Build the same shape on the right!",
            "Drag pieces from the tray below. There are cubes and long cuboids.",
            "A cuboid lying down faces a different way than one standing up. Tap a placed piece to turn it!",
            "Some pieces have different colours. Match the colours to the target shape too.",
            "Use the Front, Right and Top buttons to look from every side. Ready to start?"
          ]
        }
      };
    </script>
    <script src="../../shared/concept-tutorial.js?v=1" defer></script>
  </body>
</html>
