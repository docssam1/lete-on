<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>GFIELD 주사위 굴리기</title>
  <link rel="stylesheet" href="./styles.css?v=dice-roll-3" />
  <link rel="stylesheet" href="../../shared/worksheet-links.css?v=1" />
  <link rel="stylesheet" href="../../shared/pwa.css?v=2" />
  <link rel="manifest" href="/geometry/manifest.webmanifest" />
  <meta name="theme-color" content="#164b5b" />
  <script src="../../shared/viewport-fit.js?v=1"></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="icon-button" href="../../solid-vista/" aria-label="공간·입체 지구로 나가기">&larr;</a>
      <div class="brand"><strong>GFIELD</strong><small id="brandName">주사위 굴리기</small></div>
      <div class="progress"><strong id="levelLabel">입문 · 1단계</strong><span id="problemLabel">1 / 5</span></div>
      <button id="soundButton" class="icon-button" type="button" aria-label="소리 끄기">&#9835;</button>
      <button id="levelButton" class="level-button" type="button">단계</button>
    </header>

    <section class="mission">
      <div><span id="difficultyLabel">입문</span><h1 id="missionTitle">한 칸 굴리기</h1></div>
      <p id="prompt">주사위를 화살표 방향으로 굴린 뒤 윗면의 눈을 찾아요.</p>
    </section>

    <section class="play-layout">
      <article class="route-panel">
        <header><div><small>ROLLING ROUTE</small><h2 id="boardTitle">칸 번호와 화살표를 따라가요</h2></div><div class="route-tools"><div id="methodSwitch" class="method-switch" role="group" aria-label="격자 주사위 모양"><button type="button" data-method="flat">납작 주사위</button><button type="button" data-method="solid">입체 주사위</button></div><b id="stepLabel">출발</b></div></header>
        <div class="route-stage">
          <div id="routeBoard" class="route-board"></div>
          <section class="die-observer" aria-live="polite">
            <span id="viewLabel">출발 주사위</span>
            <div id="dieView" class="die-host"></div>
            <dl><div><dt>윗면</dt><dd id="topValue">-</dd></div><div><dt>앞면</dt><dd id="frontValue">-</dd></div><div><dt>오른쪽 면</dt><dd id="rightValue">-</dd></div></dl>
            <div id="directionPad" class="direction-pad" aria-label="주사위 굴리기 방향">
              <button class="north" type="button" data-direction="N" aria-label="위쪽으로 굴리기">↑</button>
              <button class="west" type="button" data-direction="W" aria-label="왼쪽으로 굴리기">←</button>
              <i aria-hidden="true"></i>
              <button class="east" type="button" data-direction="E" aria-label="오른쪽으로 굴리기">→</button>
              <button class="south" type="button" data-direction="S" aria-label="아래쪽으로 굴리기">↓</button>
            </div>
          </section>
        </div>
      </article>

      <aside class="answer-panel">
        <header><small>YOUR ANSWER</small><h2 id="answerTitle">도착한 윗면은?</h2></header>
        <div id="targetDie" class="target-die" hidden></div>
        <div id="choiceTray" class="choice-tray"></div>
        <section id="solution" class="solution" hidden><strong>면의 변화를 확인해요</strong><p id="solutionText"></p></section>
      </aside>
    </section>

    <nav class="action-bar" aria-label="게임 도구">
      <button id="hintButton" type="button">힌트</button>
      <button id="resetButton" type="button">처음부터</button>
      <a class="worksheet-link" href="../../worksheet/dice-roll/">학습지</a>
      <button id="nextButton" class="next-button" type="button" hidden>다음 문제</button>
    </nav>

    <div id="levelDialog" class="dialog" hidden><section role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><header><h2 id="dialogTitle">단계 선택</h2><button id="closeLevels" type="button" aria-label="닫기">X</button></header><div id="levelList" class="level-list"></div></section></div>
    <div id="completeDialog" class="dialog" hidden><section class="complete-card" role="dialog" aria-modal="true"><div class="complete-die" aria-hidden="true">&#9860;</div><h2>단계 완료!</h2><p>주사위를 굴릴 때 바뀌는 세 면을 정확히 추적했어요.</p><div class="complete-actions"><button id="nextLevelButton" type="button">다음 단계</button><button id="practiceButton" type="button">같은 단계 더 풀기</button><a href="../../solid-vista/">공간·입체 지구</a></div></section></div>
    <div id="success" class="success" aria-hidden="true"><strong>ROLL CLEAR!</strong></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./app.js?v=dice-roll-5"></script>
  <script src="../../shared/pwa.js?v=3" defer></script>
</body>
</html>
