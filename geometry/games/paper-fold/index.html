<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GFIELD Paper Fold</title>
  <link rel="stylesheet" href="./styles.css?v=paper-fold-5" />
  <link rel="stylesheet" href="../../shared/pwa.css?v=2" />
  <script src="../../shared/viewport-fit.js?v=1"></script>
  <link rel="manifest" href="/geometry/manifest.webmanifest" />
  <meta name="theme-color" content="#155d62" />
</head>
<body>
  <main class="fold-shell">
    <header class="topbar">
      <a class="icon-button exit" href="../../origami-studio/" aria-label="Back to Origami Studio">&larr;</a>
      <div class="brand"><strong>GFIELD</strong><small>Paper Fold</small></div>
      <div class="progress"><strong id="levelLabel">LEVEL 1</strong><span id="problemLabel">1 / 5</span></div>
      <button id="soundButton" class="icon-button" type="button" aria-label="Toggle sound">S</button>
      <button id="levelButton" class="level-button" type="button">Levels</button>
    </header>

    <section class="mission" aria-live="polite">
      <div><span id="stars" aria-hidden="true">*****</span><h1 id="missionTitle">Fold in Half</h1></div>
      <p id="prompt">Tap the glowing crease to fold the paper.</p>
    </section>

    <section class="play-area">
      <article class="paper-panel">
        <div id="stage" class="paper-stage" aria-live="polite">
          <div id="paper" class="paper" role="application" aria-label="Paper folding board"></div>
          <div id="foldStatus" class="fold-status"></div>
        </div>
      </article>
      <aside class="tool-panel" aria-label="Tools">
        <button id="rotateButton" type="button" aria-label="Rotate selected shape" hidden>Rotate</button>
        <button id="flipButton" type="button" aria-label="Flip selected shape" hidden>Flip</button>
        <button id="hintButton" type="button">Hint</button>
        <button id="retryButton" type="button">Restart</button>
        <a href="../../worksheet/paper-fold/">Worksheet</a>
      </aside>
    </section>

    <section class="answer-dock">
      <p id="answerPrompt">Fold the paper first.</p>
      <div id="interaction" class="interaction"></div>
      <button id="nextButton" class="next-button" type="button" hidden>Next</button>
    </section>

    <aside id="foldyGuide" class="foldy-guide" aria-live="polite">
      <div id="guideBubble" class="guide-bubble">Follow the crease.</div>
      <img src="../../world-map/assets/foldy-character.webp" alt="Foldy" />
    </aside>

    <div id="tutorial" class="dialog" hidden>
      <section class="tutorial-card" role="dialog" aria-modal="true">
        <img src="../../world-map/assets/foldy-character.webp" alt="Foldy" />
        <div><p id="tutorialText"></p><div id="tutorialDots" class="tutorial-dots"></div><button id="tutorialNext" type="button">Next</button></div>
      </section>
    </div>

    <div id="levelDialog" class="dialog" hidden>
      <section role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <header><h2 id="dialogTitle">Choose a level</h2><button id="closeLevels" type="button" aria-label="Close">X</button></header>
        <div id="levelList" class="level-list"></div>
      </section>
    </div>

    <div id="completeDialog" class="dialog" hidden>
      <section class="complete-card" role="dialog" aria-modal="true">
        <img src="../../world-map/assets/foldy-character.webp" alt="Foldy" />
        <h2 id="completeTitle">레벨 완료!</h2><p id="completeText">차근차근 접고 펼치며 정확하게 해결했어요.</p>
        <div class="complete-actions"><button id="nextLevelButton" type="button">Next level</button><button id="practiceButton" type="button">Practice again</button><a href="../../origami-studio/">Origami Studio</a></div>
      </section>
    </div>

    <div id="success" class="success" aria-hidden="true"><span></span><strong>GREAT JOB!</strong></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./app.js?v=paper-fold-5"></script>
  <script src="../../shared/pwa.js?v=3" defer></script>
</body>
</html>
