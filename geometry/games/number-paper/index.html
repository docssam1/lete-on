<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GFIELD 숫자 색종이 공방</title><link rel="stylesheet" href="./activity.css?v=9"><link rel="stylesheet" href="../../shared/pwa.css?v=2"><link rel="manifest" href="../../manifest.webmanifest"><meta name="theme-color" content="#287591"></head>
<body><main class="paper-play">
<header class="topbar"><a id="back" class="round" href="../../origami-studio/" aria-label="놀이터로">←</a><div class="brand"><small>GFIELD · PAPER PLAY</small><strong id="gameTitle"></strong></div><select id="activity"></select><select id="difficulty" aria-label="난이도"></select><select id="language" aria-label="언어"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option></select></header>
<section class="guide"><img src="../../world-map/assets/foldy-character.webp" alt="" class="foldy"><div class="bubble"><h1 id="prompt" tabindex="-1"></h1><p id="gestureHint"></p></div><ol id="steps" aria-label="활동 순서"></ol></section>
<section class="workshop"><div class="playmat"><span class="mat-label" aria-hidden="true">FOLD · SNIP · SURPRISE</span><div class="paper-stage"><div id="paper" class="paper-frame" role="group"></div><aside id="foldDirections" class="fold-directions" hidden></aside></div><section id="calculationHelp" class="calculation-help" aria-labelledby="helpTitle" hidden><button id="helpClose" class="help-close" type="button" aria-label="계산 도움 닫기">×</button><h2 id="helpTitle"></h2><p id="helpProgress"></p><div id="helpEquation" class="help-equation" role="status" aria-live="polite"></div><button id="helpNext" class="help-next" type="button" aria-describedby="helpTitle helpEquation"></button></section><div id="sparkles" aria-hidden="true"></div><p id="status" role="status" aria-live="polite"></p></div>
<aside class="shelf"><div id="basket" class="basket" role="region"><div class="basket-rim"></div><h2 id="trayTitle"></h2><div id="tokens" class="tokens"></div><p id="basketHelp"></p><form id="calculation" novalidate hidden><label id="answerLabel" for="answer"></label><div class="answer-row"><input id="answer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-describedby="calculationFeedback"><button id="checkSum" type="submit"></button></div><p id="calculationFeedback" role="status" aria-live="polite"></p></form><div class="total"><span id="sumLabel"></span><output id="sum">0</output></div></div><div class="creations"><span id="collectionTitle"></span><div id="collection"></div></div></aside></section>
<footer class="actions"><button id="retry" class="secondary"></button><span id="progress"></span><button id="helpCalculation" class="secondary help-launch" type="button" aria-controls="calculationHelp" aria-expanded="false" hidden></button><button id="next" class="primary" hidden></button><a id="practice" class="primary" hidden></a></footer><p id="storageWarning" role="status"></p>
</main><script type="module" src="./app.js?v=10"></script><script src="../../shared/pwa.js?v=3" defer></script></body></html>
