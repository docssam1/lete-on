<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>GFIELD 길 잇기 산책로</title>
  <link rel="stylesheet" href="./styles.css?v=path-walk-2" />
  <link rel="stylesheet" href="../../shared/pwa.css?v=2" />
  <link rel="manifest" href="/geometry/manifest.webmanifest" />
  <meta name="theme-color" content="#28634f" />
  <script src="../../shared/viewport-fit.js?v=1"></script>
</head>
<body>
  <main class="walk-shell">
    <header class="topbar">
      <a class="icon-button" href="../../world-map/?enter=1" aria-label="도형월드로 나가기">&larr;</a>
      <div class="brand"><strong>GFIELD</strong><small>Path Walk</small></div>
      <div class="progress"><strong id="levelLabel">LEVEL 1</strong><span id="problemLabel">1 / 5</span></div>
      <button id="soundButton" class="icon-button" type="button" aria-label="소리 끄기">&#9835;</button>
      <button id="levelButton" class="level-button" type="button">레벨</button>
    </header>

    <section class="mission">
      <div><span id="difficultyLabel">입문</span><h1 id="missionTitle">한 길 잇기</h1></div>
      <p id="prompt">길 타일을 눌러 출발점과 목적지를 이어 보세요.</p>
    </section>

    <section class="play-stage">
      <aside class="trail-panel">
        <div class="trail-character" role="img" aria-label="길 안내 캐릭터"></div>
        <div class="guide-copy"><small>PATH GUIDE</small><strong id="guideTitle">길을 살펴봐요</strong><p id="guideText">타일을 누르면 오른쪽으로 90도 돌아가요.</p></div>
        <dl><div><dt id="turnsTitle">돌린 횟수</dt><dd id="turnCount">0</dd></div><div><dt id="goalTitle">목표</dt><dd id="goalCount">1곳</dd></div></dl>
      </aside>

      <article class="board-panel">
        <div class="board-heading"><div><small id="boardTag">길 타일</small><h2 id="boardTitle">끊기지 않게 연결해요</h2></div><b id="routeStatus" aria-live="polite">연결 전</b></div>
        <div id="gameBoard" class="game-board" aria-label="길 잇기 문제판"></div>
        <div id="choiceTray" class="choice-tray" hidden></div>
      </article>
    </section>

    <nav class="action-bar" aria-label="게임 도구">
      <button id="hintButton" type="button">힌트</button>
      <button id="retryButton" type="button">다시</button>
      <a href="../../worksheet/path-walk/">학습지</a>
      <button id="nextButton" class="next-button" type="button" hidden>다음 문제</button>
    </nav>

    <div id="levelDialog" class="dialog" hidden>
      <section role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <header><h2 id="dialogTitle">레벨 선택</h2><button id="closeLevels" type="button" aria-label="닫기">X</button></header>
        <div id="levelList" class="level-list"></div>
      </section>
    </div>

    <div id="completeDialog" class="dialog" hidden>
      <section class="complete-card" role="dialog" aria-modal="true">
        <div class="trail-character"></div><h2 id="completeTitle">레벨 완료!</h2><p id="completeText">길의 방향을 끝까지 정확하게 이어 냈어요.</p>
        <div class="complete-actions"><button id="nextLevelButton" type="button">다음 레벨</button><button id="practiceButton" type="button">같은 레벨 더 풀기</button><a href="../../world-map/?enter=1">도형월드</a></div>
      </section>
    </div>

    <div id="success" class="success" aria-hidden="true"><div></div><strong>SUCCESS!</strong></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./app.js?v=path-walk-2"></script>
  <script src="../../shared/pwa.js?v=3" defer></script>
</body>
</html>
