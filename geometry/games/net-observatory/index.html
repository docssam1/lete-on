<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GFIELD Net Observatory</title>
  <link rel="stylesheet" href="./styles.css?v=net-4" />
  <link rel="stylesheet" href="../../shared/worksheet-links.css?v=1" />
  <link rel="stylesheet" href="../../shared/pwa.css?v=2" />
  <script src="../../shared/viewport-fit.js?v=1"></script>
  <link rel="manifest" href="/geometry/manifest.webmanifest" />
  <meta name="theme-color" content="#183b52" />
  <script type="importmap">
    {"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}
  </script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="icon-button exit" href="../../solid-vista/" aria-label="나가기">&larr;</a>
      <div class="brand"><strong>GFIELD</strong><small id="brandName">Net Observatory</small></div>
      <div class="progress"><strong id="levelLabel">LEVEL 1</strong><span id="problemLabel">1 / 5</span></div>
      <button id="soundButton" class="icon-button" type="button" aria-label="소리">♪</button>
      <button id="levelButton" class="level-button" type="button">단계</button>
      <a id="worksheetLink" class="worksheet-link" href="../../worksheet/net-observatory/">학습지</a>
    </header>

    <section class="mission" aria-live="polite">
      <div><span id="stars" aria-hidden="true">●○○○○</span><h1 id="missionTitle"></h1></div>
      <p id="prompt"></p>
    </section>

    <section class="play-area">
      <article class="stage-panel">
        <div id="stage" class="stage" aria-live="polite"></div>
      </article>
      <aside class="tool-panel" aria-label="게임 도구">
        <button id="foldButton" type="button" hidden>접어 보기</button>
        <button id="hintButton" type="button">힌트</button>
      </aside>
    </section>

    <footer class="answer-dock">
      <p id="answerPrompt"></p>
      <div id="choices" class="choices"></div>
      <button id="nextButton" class="next-button" type="button" hidden>다음 문제</button>
    </footer>

    <aside id="cubiGuide" class="cubi-guide" aria-live="polite">
      <div id="guideBubble" class="guide-bubble"></div><span class="cubi-sprite" aria-hidden="true"></span>
    </aside>

    <div id="tutorial" class="dialog" hidden>
      <section class="tutorial-card" role="dialog" aria-modal="true" aria-labelledby="tutorialText">
        <div class="tutorial-demo" aria-hidden="true"><span class="paper-face one"></span><span class="paper-face two"></span><span class="paper-face three"></span><span class="cubi-sprite tutorial-cubi"></span></div>
        <div><p id="tutorialText"></p><div id="tutorialDots" class="tutorial-dots"></div><div class="tutorial-actions"><button id="tutorialSkip" type="button"></button><button id="tutorialNext" type="button"></button></div></div>
      </section>
    </div>

    <div id="levelDialog" class="dialog" hidden>
      <section class="level-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <header><h2 id="dialogTitle"></h2><button id="closeLevels" type="button" aria-label="닫기">×</button></header>
        <div id="levelList" class="level-list"></div>
      </section>
    </div>

    <div id="completeDialog" class="dialog" hidden>
      <section class="complete-card" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
        <span class="cubi-sprite" aria-hidden="true"></span><h2 id="completeTitle"></h2><p id="completeText"></p>
        <div class="complete-actions"><button id="nextLevelButton" type="button"></button><button id="practiceButton" type="button"></button><a id="mapLink" href="../../solid-vista/"></a></div>
      </section>
    </div>

    <div id="success" class="success" aria-hidden="true"><i></i><strong>SUCCESS!</strong></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <div class="portrait-guard"><div class="rotate-device" aria-hidden="true"></div><strong id="rotateMessage">가로로 돌려 주세요</strong><a id="rotateExit" href="../../solid-vista/">마을로 나가기</a></div>
  <script type="module" src="./app.js?v=net-4"></script>
  <script src="../../shared/pwa.js?v=3" defer></script>
</body>
</html>
