<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GFIELD Spatial Solids District</title>
  <link rel="stylesheet" href="./styles.css?v=solid-studio-3" />
  <link rel="stylesheet" href="./soma.css?v=solid-2" />
  <link rel="stylesheet" href="../shared/worksheet-links.css?v=1" />
  <link rel="manifest" href="/geometry/manifest.webmanifest" />
  <meta name="theme-color" content="#17394d" />
</head>
<body>
  <header class="topbar">
    <a href="../world-map/" class="back" aria-label="지도로 돌아가기">&larr;</a>
    <div><strong>GFIELD</strong><span id="districtName"></span></div>
    <p id="playerName"></p>
  </header>
  <main>
    <section class="district-heading">
      <div><span>SPATIAL SOLIDS</span><h1 id="title"></h1><p id="subtitle"></p></div>
      <div class="tower-mark" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>
    <section class="course-section">
      <header><div><h2 id="netTitle"></h2><p id="netDescription"></p></div><strong id="sessionLabel"></strong><a id="netWorksheetLink" class="course-sheet-link" href="../worksheet/net-observatory/">학습지</a></header>
      <div id="netLevelGrid" class="level-grid"></div>
    </section>
    <section class="course-section dice-section">
      <header><div><h2 id="diceTitle"></h2><p id="diceDescription"></p></div><strong id="diceSessionLabel"></strong><a id="diceWorksheetLink" class="course-sheet-link" href="../worksheet/dice-roll/">학습지</a></header>
      <div id="diceLevelGrid" class="level-grid"></div>
    </section>
    <section class="course-section soma-section">
      <header><div><h2 id="somaTitle"></h2><p id="somaDescription"></p></div><strong id="somaSessionLabel"></strong></header>
      <div id="somaLevelGrid" class="level-grid"></div>
    </section>
  </main>
  <script src="../shared/pwa.js?v=3" defer></script>
  <script type="module" src="./app.js?v=solid-studio-3"></script>
</body>
</html>
