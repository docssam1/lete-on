<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GFIELD Cube Town</title>
    <link rel="stylesheet" href="./styles.css?v=gap-placement2" />
    <link rel="stylesheet" href="./mobile-landscape.css?v=1" />
    <link rel="stylesheet" href="./quiet-cubi.css?v=1" />
    <link rel="stylesheet" href="./copy-build-ui.css?v=2" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="orientation-gate" role="status" aria-live="polite">
      <div class="orientation-gate__card">
        <div class="orientation-gate__phone" aria-hidden="true"></div>
        <strong>휴대폰을 가로로 돌려 주세요</strong>
        <p>문제 모양과 쌓기판을 함께 보면서 더 편하게 게임할 수 있어요.</p>
      </div>
    </div>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GFIELD Geometry World</p>
          <h1>GFIELD Cube Town</h1>
        </div>
        <div class="language-switch" aria-label="Language">
          <button data-lang="ko" class="active">한국어</button>
          <button data-lang="zh">中文</button>
          <button data-lang="ja">日本語</button>
          <button data-lang="en">English</button>
        </div>
      </header>

      <section class="lesson-panel">
        <div class="status-card">
          <div class="stars" id="stars" aria-label="difficulty">★★☆☆☆</div>
          <h2 id="modeTitle">똑같이 쌓기</h2>
          <p id="instruction">왼쪽 모양을 보고 오른쪽 판에 똑같이 쌓아 보세요.</p>
        </div>
        <div class="counter-card">
          <span>문제·블록</span>
          <strong id="countValue">0</strong>
          <button id="levelPickerButton" class="level-picker-button" type="button" aria-haspopup="dialog">레벨 선택</button>
        </div>
      </section>

      <section class="play-area">
        <article class="viewer target-view">
          <div class="viewer-heading">
            <h2>문제 모양</h2>
            <button id="resetView" class="icon-button" type="button" aria-label="보기 초기화">↻</button>
          </div>
          <div id="targetCanvas" class="canvas-wrap"></div>
        </article>

        <article class="viewer build-view">
          <div class="viewer-heading"><h2>내가 만든 모양</h2></div>
          <div id="buildCanvas" class="canvas-wrap interactive"></div>
        </article>
      </section>

      <section class="builder-controls" aria-label="블록 재료함">
        <button id="cubePile" class="pile-button" type="button">
          <span class="pile-cubes" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
          <span><strong>블록 재료함</strong><small id="handStatus">블록을 선택해요</small></span>
        </button>
      </section>

      <section class="control-strip">
        <button id="checkAnswer" class="primary" type="button">확인</button>
        <button id="nextStep" type="button">다음 문제</button>
        <button id="resetBuild" type="button">처음부터</button>
        <button id="captureBuild" type="button" hidden>사진 찍기</button>
        <button id="viewFront" type="button">앞</button>
        <button id="viewTop" type="button">위</button>
        <button id="viewFree" type="button">돌려보기</button>
      </section>

      <div id="levelDialog" class="level-dialog" hidden>
        <section class="level-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="levelDialogTitle">
          <header class="level-dialog-head">
            <h2 id="levelDialogTitle">레벨 선택</h2>
            <button id="closeLevelDialog" class="icon-button" type="button" aria-label="닫기">&times;</button>
          </header>
          <div id="levelOptions" class="level-options"></div>
        </section>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <aside class="floating-guide" aria-live="polite" aria-label="큐비 안내">
        <div class="guide-bubble">
          <div class="guide-head"><strong class="guide-title">큐비</strong></div>
          <p id="guideMessage">문제 모양을 보고 블록을 하나씩 놓아 보자!</p>
        </div>
        <span class="guide-character" role="img" aria-label="큐비"></span>
      </aside>
      <div id="successBurst" class="success-burst" aria-hidden="true">
        <strong>SUCCESS!</strong>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </main>

    <script type="module" src="./copy-build-engine.js?v=1"></script>
  </body>
</html>
