<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFIELD Cube Town</title>
    <link rel="stylesheet" href="./styles.css?v=cube-town-premium-20260716e" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="sectionLabel">GFIELD Geometry World</p>
          <h1 data-i18n="title">GFIELD Cube Town</h1>
        </div>
        <div class="language-switch" aria-label="Language">
          <button data-lang="ko" class="active">한국어</button>
          <button data-lang="zh">中文</button>
          <button data-lang="ja">日本語</button>
          <button data-lang="en">English</button>
        </div>
        <button id="topLevelPickerButton" class="top-level-button" type="button" aria-haspopup="dialog" data-i18n="levelSelect">레벨 선택</button>
      </header>

      <section class="lesson-panel">
        <div class="status-card">
          <div class="stars" id="stars" aria-label="difficulty">★★☆☆</div>
          <h2 id="modeTitle" data-i18n="copyMode">똑같이 쌓기</h2>
          <p id="instruction" data-i18n="copyInstruction">
            왼쪽 모양을 보고 오른쪽 판에 똑같이 쌓아 보세요.
          </p>
        </div>
        <div class="counter-card">
          <span data-i18n="countLabel">센 개수</span>
          <strong id="countValue">0</strong>
          <button id="levelPickerButton" class="level-picker-button" type="button" aria-haspopup="dialog" data-i18n="levelSelect">레벨 선택</button>
        </div>
      </section>

      <section class="play-area">
        <article class="viewer target-view">
          <div class="viewer-heading">
            <h2 data-i18n="target">문제 모양</h2>
            <button id="resetView" class="icon-button" type="button" aria-label="reset view">↻</button>
          </div>
          <div id="targetCanvas" class="canvas-wrap"></div>
        </article>

        <article class="viewer build-view">
          <div class="viewer-heading">
            <h2 data-i18n="myBuild">내가 만든 모양</h2>
          </div>
          <div id="buildCanvas" class="canvas-wrap interactive"></div>
        </article>
      </section>

      <section class="builder-controls" aria-label="cube tray">
        <button id="cubePile" class="pile-button" type="button">
          <span class="pile-cubes" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </span>
          <span>
            <strong data-i18n="pileLabel">쌓기나무 더미</strong>
            <small id="handStatus" data-i18n="emptyHand">하나씩 가져와요</small>
          </span>
        </button>
      </section>

      <section class="control-strip">
        <button id="checkAnswer" class="primary" type="button" data-i18n="check">확인</button>
        <button id="nextStep" type="button" data-i18n="next">다음 문제</button>
        <button id="resetBuild" type="button" data-i18n="reset">처음부터</button>
        <button id="viewFront" type="button" data-i18n="front">앞</button>
        <button id="viewTop" type="button" data-i18n="top">위</button>
        <button id="viewFree" type="button" data-i18n="free">돌려보기</button>
      </section>

      <div id="levelDialog" class="level-dialog" hidden>
        <section class="level-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="levelDialogTitle">
          <header class="level-dialog-head">
            <h2 id="levelDialogTitle" data-i18n="levelSelect">레벨 선택</h2>
            <button id="closeLevelDialog" class="icon-button" type="button" aria-label="닫기">&times;</button>
          </header>
          <div id="levelOptions" class="level-options"></div>
        </section>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <aside class="floating-guide" aria-live="polite">
        <div class="guide-bubble">
          <div class="guide-head">
            <strong class="guide-title" data-i18n="guideTitle">큐비</strong>
            <button id="audioToggle" class="guide-audio" type="button" aria-pressed="false" data-i18n="audioOff">
              음성 켜기
            </button>
          </div>
          <p id="guideMessage" data-i18n="guideStart">문제 모양을 보고 더미에서 하나씩 가져와 보자!</p>
        </div>
        <span class="guide-character character-sprite sprite-0 color-original" aria-hidden="true"></span>
      </aside>
      <div id="successBurst" class="success-burst" aria-hidden="true">
        <strong data-i18n="successPop">성공!</strong>
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div id="dragGhost" class="drag-ghost" aria-hidden="true"></div>
    </main>

    <script type="module" src="./app.js?v=cube-town-premium-20260716f"></script>
  </body>
</html>
