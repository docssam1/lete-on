<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GFIELD Origami Studio</title>
  <link rel="stylesheet" href="./styles.css?v=origami-1" />
  <link rel="stylesheet" href="../shared/pwa.css?v=2" />
  <link rel="manifest" href="/geometry/manifest.webmanifest" />
  <meta name="theme-color" content="#155d62" />
  <script src="../shared/viewport-fit.js?v=1"></script>
</head>
<body>
  <main class="studio-shell">
    <header class="studio-bar">
      <a class="back-button" href="../world-map/?enter=1&focus=origami" aria-label="지도로 나가기">‹</a>
      <div class="brand"><span class="brand-mark" aria-hidden="true">◇</span><strong>GFIELD</strong><small>Origami Studio</small></div>
      <div class="player"><span id="playerName"></span><b id="playerPoints">0 P</b></div>
      <a class="worksheet-button" href="../worksheet/paper-fold/" data-i18n="worksheet">학습지</a>
    </header>

    <section class="studio-intro">
      <div>
        <p class="eyebrow">ORIGAMI STUDIO</p>
        <h1 data-i18n="title">색종이 접기</h1>
        <p data-i18n="subtitle">반으로 접기부터 겹친 순서 찾기까지, 한 단계씩 익혀요.</p>
      </div>
      <img src="../world-map/assets/foldy-character.webp" alt="색종이 접기 안내 캐릭터 폴디" />
    </section>

    <section class="level-section" aria-labelledby="levelTitle">
      <header><div><p class="eyebrow" data-i18n="course">5단계 코스</p><h2 id="levelTitle" data-i18n="choose">시작할 레벨을 골라요</h2></div><span data-i18n="fiveEach">레벨마다 5문제</span></header>
      <div id="levelGrid" class="level-grid"></div>
    </section>

    <aside class="worksheet-strip">
      <div class="worksheet-art" aria-hidden="true"><i></i><i></i><i></i></div>
      <div><strong data-i18n="worksheetTitle">색종이 접기 학습지</strong><p data-i18n="worksheetDesc">게임과 같은 유형을 섞어 인쇄하고 풀이도 확인해요.</p></div>
      <a href="../worksheet/paper-fold/" data-i18n="openWorksheet">학습지 만들기</a>
    </aside>
  </main>
  <script type="module" src="./app.js?v=origami-1"></script>
  <script src="../shared/pwa.js?v=3" defer></script>
</body>
</html>
