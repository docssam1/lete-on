<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제은행 · Numbers of Magic</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="app/print-editor.css">
<script defer src="vendor/katex/katex.min.js"></script>
<style>
/* ============================================================
   토큰 — about.html·앱 본체와 통일. 리디자인-설계.md §2/§4.
   ============================================================ */
:root{
  --paper:#FFFFFF; --paper-warm:#F7F8FA; --mist:#EEF1F5; --line:#DCE1E8;
  --ink:#1A2233; --sub:#4a5468;
  --blue:#16417C; --blue-deep:#0E2C57;
  --gold:#C9A063; --gold-soft:#EAC996; --gold-bright:#F5D98B;
  --ok:#2E9E6B; --no:#D9534F;
  --shadow-1:0 1px 2px rgba(26,34,51,.05), 0 4px 14px rgba(26,34,51,.06);
  --shadow-2:0 2px 4px rgba(26,34,51,.06), 0 10px 30px rgba(26,34,51,.09);
  --serif:'Gowun Batang','Noto Serif SC',ui-serif,Georgia,serif;
  --mono:ui-monospace,'SF Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Pretendard',sans-serif;color:var(--ink);background:var(--paper-warm)}
body{background:#F7F8FA}
.katex{font-size:1em}

/* ── 판면 ── */
#drill-root{min-height:100vh;display:flex;flex-direction:column;max-width:1160px;margin:0 auto;position:relative}
#drill-root::before,#drill-root::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
#drill-root::before{left:0}#drill-root::after{right:0}

.dr-header{background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:16px 40px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.dr-wordmark{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink)}
.dr-wordmark b{color:var(--gold);font-weight:700}
.dr-header-sub{font-size:12px;color:var(--sub);margin-left:2px}
.dr-home-link{margin-left:auto;font-size:13px;color:var(--sub);text-decoration:none;font-weight:700;
  transition:.15s;border-bottom:1px solid transparent}
.dr-home-link:hover{color:var(--ink);border-color:var(--line)}
.dr-body{flex:1;padding:40px 40px 64px;width:100%}
@media(max-width:700px){.dr-header{padding:14px 20px}.dr-body{padding:28px 20px 48px}}

/* ── 공용 버튼 ── */
.nm-btn{border:none;border-radius:9px;font-family:'Pretendard',sans-serif;
  font-weight:700;cursor:pointer;transition:.15s;padding:12px 22px;font-size:14.5px}
.nm-btn:disabled{opacity:.4;cursor:not-allowed}
.nm-btn:active:not(:disabled){transform:scale(.97)}
.nm-btn-primary{background:var(--blue-deep);color:#fff}
.nm-btn-primary:hover:not(:disabled){background:var(--blue)}
.nm-btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.nm-btn-secondary:hover:not(:disabled){background:var(--mist)}
.nm-btn-small{font-size:12.5px;padding:8px 14px;border-radius:7px}

/* 금박 버튼(리디자인-설계.md §3-5/§4-3) */
.gold-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 26px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--gold-bright);
  background-image:linear-gradient(var(--ink),var(--ink)),linear-gradient(135deg,var(--gold-soft),var(--gold),var(--gold-bright));
  background-origin:border-box;background-clip:padding-box,border-box;border:1.5px solid transparent;
  overflow:hidden;cursor:pointer;font-family:'Pretendard',sans-serif;transition:transform .15s ease,box-shadow .2s ease}
.gold-btn::before{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
.gold-btn:hover:not(:disabled){box-shadow:var(--shadow-2)}
.gold-btn:hover:not(:disabled)::before{animation:sheen .9s ease forwards}
@keyframes sheen{from{left:-60%}to{left:130%}}
.gold-btn:active:not(:disabled){transform:translateY(1px)}
.gold-btn:disabled{opacity:.35;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.gold-btn:hover::before{animation:none}}

/* ── 홈 — 헤더 ── */
.dr-hero{margin-bottom:28px}
.dr-folio{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.dr-folio-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--gold)}
.dr-folio-label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.dr-home-title{font-family:var(--serif);font-size:clamp(26px,4.6vw,36px);font-weight:700;color:var(--blue-deep);margin-bottom:8px}
.dr-home-desc{font-size:14px;color:var(--sub)}

/* ── 섹션 탭 ── */
.dr-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:28px 0 0}
.dr-tab{border:none;background:transparent;font-family:'Pretendard',sans-serif;
  font-weight:800;font-size:14.5px;padding:14px 4px;margin-right:28px;cursor:pointer;
  transition:.18s;color:var(--sub);text-align:left;line-height:1.3;border-bottom:2px solid transparent}
.dr-tab .dr-tab-sub{font-size:11px;font-weight:600;display:block;margin-top:2px;opacity:.75}
.dr-tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.dr-tab.on.school{color:var(--blue)}
.dr-tab.on.magic{color:var(--blue-deep)}

/* ── 작업대(공방) — 서랍장 + 벤치 ── */
.workshop{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;margin-top:22px;background:var(--paper)}
@media(max-width:860px){.workshop{grid-template-columns:1fr}}

.drawer{border-right:1px solid var(--line);display:flex;flex-direction:column;max-height:620px}
@media(max-width:860px){.drawer{border-right:none;border-bottom:1px solid var(--line);max-height:320px}}
.drawer-search{border:none;border-bottom:1px solid var(--line);padding:14px 16px;font-size:13.5px;
  font-family:'Pretendard',sans-serif;outline:none;background:transparent;color:var(--ink);width:100%}
.drawer-search::placeholder{color:var(--sub)}
.drawer-list{overflow-y:auto;flex:1}
.drawer-group-h{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--sub);position:sticky;top:0;background:var(--paper);z-index:1}
.dg-count{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--gold);font-size:11px}
.drawer-item{display:block;width:100%;text-align:left;border:none;background:transparent;
  padding:10px 16px 10px 16px;cursor:pointer;font-family:'Pretendard',sans-serif;border-bottom:1px solid var(--mist)}
.drawer-item:hover{background:var(--mist)}
.drawer-item.sel{background:var(--blue-deep)}
.drawer-item b{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.drawer-item.sel b{color:#fff}
.drawer-item small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.drawer-item.sel small{color:rgba(255,255,255,.68)}
.drawer-empty{padding:32px 20px;text-align:center;color:var(--sub);font-size:13px}

.bench{padding:30px;background:var(--paper-warm);min-height:400px}
@media(max-width:700px){.bench{padding:22px 18px}}
.bench-empty{color:var(--sub);font-size:14px;padding:60px 10px;text-align:center}
.bench-head{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--blue-deep)}
.bench-desc{font-size:12.5px;color:var(--sub);margin-top:5px;letter-spacing:.02em;text-transform:uppercase;font-weight:700}

.bench-row{margin-top:22px}
.bench-label{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:8px;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--paper);padding:9px 15px;font-size:13px;font-weight:700;
  font-family:'Pretendard',sans-serif;cursor:pointer;color:var(--sub);border-right:1px solid var(--line);
  font-variant-numeric:tabular-nums}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--blue-deep);color:#fff}

.dr-printopts{display:flex;gap:16px;flex-wrap:wrap}
.dr-check{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  color:var(--ink);cursor:pointer;user-select:none}
.dr-check input{width:16px;height:16px;accent-color:var(--blue-deep);cursor:pointer}

.bench-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.dr-seed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.dr-seed-label{font-size:11px;color:var(--sub)}
.dr-seed-code{font-size:12px;font-family:var(--mono);color:var(--sub);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;background:var(--paper);cursor:pointer;transition:.15s}
.dr-seed-code:hover{background:var(--mist)}

.preview-hd{display:flex;align-items:center;gap:10px;margin-top:28px;margin-bottom:12px}
.preview-hd span{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.02em}
.preview-dice{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 11px;
  font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s;font-family:'Pretendard',sans-serif}
.preview-dice:hover{background:var(--mist);color:var(--ink)}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.preview-cell{border:1px solid var(--line);border-radius:8px;padding:16px 10px;background:var(--paper);
  text-align:center;font-size:16px;min-height:60px;display:flex;align-items:center;justify-content:center}
.preview-cell.preview-word{grid-column:1/-1;text-align:left;font-size:13.5px;line-height:1.6;
  justify-content:flex-start;word-break:keep-all}

/* 검색→선택→실행: 작은 화면·키보드에서도 같은 순서로 이동한다. */
.dr-search-label{padding:14px 16px 0;font-size:12px;font-weight:700;color:var(--sub)}
.drawer-search,.dr-code-input{font-size:16px;min-height:44px}
.dr-search-tools{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
#dr-search-status{width:100%;font-size:12px;color:var(--sub)}
.dr-search-tools button,.dr-back-list{min-height:44px;padding:8px 10px;background:white;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;color:var(--blue-deep);cursor:pointer}
.dr-search-tools button:disabled{opacity:.45;cursor:default}
.dr-back-list{margin-bottom:14px}
.drawer-item{min-height:52px}.drawer-item b{font-size:14px}.drawer-item small{font-size:12px}
.drawer-item.sel small{color:#E1E9F4}.dg-count{color:var(--sub)}
.bench{min-width:0;background:white}.bench-head{scroll-margin-top:140px}
.seg{max-width:100%;flex-wrap:wrap}.seg button,.preview-dice,.dr-check{min-height:44px}
.seg button{padding:9px 12px}.dr-check input{width:20px;height:20px}
.gold-btn{background:var(--blue-deep);color:white;border:1px solid var(--blue-deep)}
.gold-btn::before{display:none}.dr-tab.on{border-bottom-color:var(--blue)}
.dr-seed-wrap{max-width:100%;flex-wrap:wrap}.dr-seed-code{cursor:text;overflow-wrap:anywhere}
.preview-cell{min-width:0;overflow-x:auto}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #2463B3;outline-offset:3px}
.drawer-item:focus-visible,.seg button:focus-visible{outline-offset:-3px}
@media(max-width:860px){.drawer{max-height:420px}.bench-head{scroll-margin-top:140px}}

/* ── 코드로 다시 풀기 — 학습지 티켓 ── */
.dr-ticket{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:18px 24px;margin-top:26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;overflow:hidden}
.dr-ticket::before,.dr-ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;
  background:var(--paper-warm);border-radius:50%;transform:translateY(-50%)}
.dr-ticket::before{left:-9px}.dr-ticket::after{right:-9px}
.dr-ticket-title{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em;flex:none;width:100%}
.dr-code-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;
  border-left:1px dashed var(--line);padding-left:16px;margin-left:2px}
@media(max-width:520px){.dr-code-row{border-left:none;padding-left:0;margin-left:0}}
.dr-code-input{border:1.5px solid var(--line);border-radius:8px;padding:10px 13px;font-size:16px;
  font-family:var(--mono);width:180px;outline:none;transition:.15s;color:var(--ink);background:var(--paper)}
.dr-code-input:focus{border-color:var(--blue)}
.dr-code-label{font-size:11.5px;color:var(--sub)}

/* ── 실행 화면 상단 바(뒤로가기+주제명) — 카드와 같은 폭으로 정렬 ── */
.dr-run-bar{max-width:560px;margin:0 auto 16px;display:flex;align-items:center;gap:10px}
.dr-run-topic{font-size:13px;color:var(--sub);font-weight:700}

/* ── 연습 화면(exam.js가 생성하는 .nm-exam-*) — 흩어진 3개 박스 → 하나의 카드로 재구성 ── */
.nm-exam-run{max-width:560px;margin:0 auto;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow-1)}
.nm-exam-header{background:var(--paper-warm);border-bottom:1px solid var(--line);padding:16px 22px}
.nm-exam-progress{height:4px;background:var(--mist);border-radius:99px;overflow:hidden;margin-bottom:12px}
.nm-progress-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));border-radius:99px;transition:width .35s ease}
.nm-exam-info{display:flex;justify-content:space-between;align-items:baseline}
.nm-q-counter{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:700;color:var(--ink)}
.nm-timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:800;color:var(--no);
  background:rgba(213,83,79,.1);padding:4px 10px;border-radius:99px}

.nm-exam-question{padding:46px 26px 34px;text-align:center;position:relative}
.nm-exam-question::before{content:"문제";position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.nm-q-tex{font-size:clamp(26px,7vw,40px);font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.3}
.nm-q-tex .katex{font-size:1em}
.nm-q-hint{font-size:12.5px;color:var(--sub);margin:14px auto 0;max-width:38ch}
/* ── 문장제(WP 스레드) — 화면 풀이 ──
   수식 한 줄을 전제로 잡힌 .nm-q-tex(최대 40px)로 문장을 그리면 카드가 무너진다.
   문장은 왼쪽 정렬·읽기 크기로 따로 그린다. 보기 번호가 곧 답이다. */
.nm-ex-word{font-size:clamp(15px,4.2vw,18px);line-height:1.7;font-weight:600;color:var(--ink);
  text-align:left;word-break:keep-all}
.nm-ex-wordask{font-size:clamp(14px,4vw,17px);line-height:1.6;font-weight:800;color:var(--ink);
  text-align:left;word-break:keep-all;margin-top:12px}
.nm-ex-choices{counter-reset:nmwp;list-style:none;margin:10px 0 0;padding:0;text-align:left}
.nm-ex-choices li{counter-increment:nmwp;font-size:clamp(13.5px,3.8vw,16px);line-height:1.55;
  margin:5px 0 0;padding-left:1.7em;text-indent:-1.7em;word-break:keep-all;color:var(--ink)}
.nm-ex-choices li::before{content:counter(nmwp) ") ";font-weight:800;color:var(--gold)}
/* 식 틀 — 답이 '식'인 문장제(WP4). 화면에서는 빈칸에 직접 쓰지 못하고 아래 입력칸에
   세 수를 쉼표로 치므로, 어떤 자리에 무엇이 들어가는지 크게 보여 주는 역할이다. */
.nm-ex-word-eq{font-size:clamp(22px,6vw,30px);font-weight:800;letter-spacing:.16em;color:var(--ink);
  text-align:center;margin:14px 0 2px;font-family:'SFMono-Regular',Consolas,monospace}


.nm-exam-input{display:flex;justify-content:center;padding:0 26px 26px}
#nm-ex-ans,#nm-ex-ans2{font-size:clamp(19px,5.5vw,25px);text-align:center;padding:12px 8px;
  border:1.5px solid var(--line);border-right:none;border-radius:10px 0 0 10px;width:100%;max-width:170px;
  font-family:'Pretendard',sans-serif;font-weight:800;outline:none;transition:.15s;background:var(--paper);
  color:var(--ink);-moz-appearance:textfield}
#nm-ex-ans::-webkit-outer-spin-button,#nm-ex-ans::-webkit-inner-spin-button,
#nm-ex-ans2::-webkit-outer-spin-button,#nm-ex-ans2::-webkit-inner-spin-button{-webkit-appearance:none}
#nm-ex-ans:focus,#nm-ex-ans2:focus{border-color:var(--blue)}
#nm-ex-submit,#nm-ex-sub2{background:var(--blue-deep);color:#fff;font-size:14px;font-weight:800;
  border:1.5px solid var(--blue-deep);border-radius:0 10px 10px 0;padding:0 20px;cursor:pointer;
  transition:.15s;font-family:'Pretendard',sans-serif;flex:none}
#nm-ex-submit:hover,#nm-ex-sub2:hover{background:var(--blue)}
#nm-ex-submit:active,#nm-ex-sub2:active{transform:scale(.98)}

.nm-exam-nav{display:flex;border-top:1px solid var(--line)}
#nm-ex-prev,#nm-ex-skip{flex:1;background:transparent;color:var(--sub);border:none;
  padding:13px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;transition:.15s}
#nm-ex-prev{border-right:1px solid var(--line)}
#nm-ex-prev:hover:not(:disabled),#nm-ex-skip:hover{background:var(--mist);color:var(--ink)}
#nm-ex-prev:disabled{opacity:.35;cursor:not-allowed}

/* ── 숫자 키패드 — 독립 카드로, 연습 카드와 같은 폭·정렬 ── */
.dr-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:380px;
  margin:16px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-1);padding:14px}
.dr-numpad-btn{background:var(--paper-warm);border:1px solid var(--line);border-radius:9px;font-size:20px;
  font-weight:700;padding:14px 10px;cursor:pointer;transition:.1s;color:var(--ink);
  font-family:'Pretendard',sans-serif;font-variant-numeric:tabular-nums}
.dr-numpad-btn:active{background:var(--mist);transform:scale(.95)}
.dr-numpad-btn.dr-np-del{background:rgba(213,83,79,.08);color:var(--no);font-size:16px;border-color:rgba(213,83,79,.25)}
.dr-numpad-btn.dr-np-ok{background:var(--blue-deep);color:#fff;font-size:14px;grid-column:span 2;border-color:var(--blue-deep)}
.dr-numpad-btn.dr-np-ok:active{background:var(--blue)}

/* ── 결과 화면 — 점수·오답·액션을 하나의 세로 리듬으로 ── */
.nm-exam-result{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.nm-result-score{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:34px 24px;text-align:center;box-shadow:var(--shadow-1);overflow:hidden}
.nm-result-score::before{content:"";position:absolute;top:0;left:0;right:0;height:4px}
.nm-result-score.nm-pass::before{background:linear-gradient(90deg,var(--ok),var(--gold))}
.nm-result-score.nm-fail::before{background:linear-gradient(90deg,var(--gold),var(--no))}
.nm-score-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(38px,10vw,58px);
  font-weight:700;color:var(--ink);line-height:1}

.nm-result-actions{display:flex;gap:10px;flex-wrap:wrap}

<script>
(function(){
'use strict';

/* ── 토픽 정의 ── */
var TOPICS = window.NM_DRILL_TOPICS;
var TOTAL_TOPICS = TOPICS.reduce(function(n,c){ return n + c.subs.length; }, 0);

/* ── 언어 — 앱(nm_state_v1)의 S.lang을 따른다. exam.js examLang()과 같은 관례:
   main.js의 S는 IIFE 안이라 직접 못 읽고, save()가 남기는 localStorage를 읽는다.
   앱을 거치지 않고 바로 연 drill은 문서 lang → 한국어로 떨어진다. ── */
function drLang(){
  try{ var st=JSON.parse(localStorage.getItem('nm_state_v1')||'{}');
       if(st.lang==='en'||st.lang==='zh'||st.lang==='ko') return st.lang; }catch(e){}
  var dl=(document.documentElement.lang||'').slice(0,2);
  return (dl==='en'||dl==='zh')?dl:'ko';
}
var LANG = drLang();
function dt(ko,en,zh){ return LANG==='en'?en:(LANG==='zh'?zh:ko); }
/* 정적 헤더는 HTML에 박혀 있어 로드 후 언어에 맞춘다(ko면 그대로) */
if(LANG!=='ko'){
  var _hs=document.getElementById('dr-hd-sub'); if(_hs)_hs.textContent=dt('문제은행','Problem Bank','题库');
  var _hh=document.getElementById('dr-hd-home'); if(_hh)_hh.textContent=dt('마을로','To the Town','回小镇');
  document.title=dt('문제은행 · Numbers of Magic','Problem Bank · Numbers of Magic','题库 · Numbers of Magic');
}
function dL(o){ return typeof o==='string'?o:((o&&(o[LANG]||o.ko||o.en))||''); }
/* 유형 이름 — ko는 이 목록의 손으로 쓴 라벨을 그대로, en/zh는 threads.js에 이미
   3언어로 있는 스레드 이름·레벨 라벨을 끌어온다. 1,030개 라벨을 다시 쓰는 대신
   있는 번역을 재사용한다 — 새 스레드를 등록하면 자동으로 따라온다. */
function subLabel(sub){
  if(LANG==='ko') return sub.label;
  var th=window.NM_THREADS&&NM_THREADS[sub.thread];
  return th?dL(th.name):sub.label;
}
function subDesc(sub){
  if(LANG==='ko') return sub.desc||'';
  var th=window.NM_THREADS&&NM_THREADS[sub.thread];
  var lv=th&&(th.levels||[]).find(function(l){ return l.id===sub.level; });
  return lv?dL(lv.label):(sub.desc||'');
}
function catLabel(cat){ return dt(cat.label, cat.en||cat.label, cat.zh||cat.en||cat.label); }

/* ── 상태 ── */
var state = {
  view: 'home',
  section: 'school',
  topicKey: null,   // 'catId:subIdx' 형식
  search: '',
  replayCode: '',
  count: 10,
  timer: 0,
  wordType: 'none', // 'none'|'mix'|'all' — 문장제 유형 (exam.js applyWordProblems 규약 그대로)
  seed: NM_RNG.newCode(),
  lastResult: null
};

var body = document.getElementById('dr-body');

/* ── 헬퍼 ── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* 다칸 답(배열) 채점 — app/exam.js의 matchesAnswer와 동일 로직(이 파일은 별도 스코프라 자체 보유) */
function matchesAnswer(raw, answer){
  if(Array.isArray(answer)){
    var parts = String(raw==null?'':raw).split(',').map(function(s){return parseFloat(s.trim());});
    if(parts.length !== answer.length) return false;
    for(var i=0;i<answer.length;i++){ if(parts[i] !== answer[i]) return false; }
    return true;
  }
  return parseFloat(raw) === answer;
}

/* topicKey → {cat, sub} */
function parseTopic(key){
  if(!key) return null;
  var parts = key.split(':');
  var cat = TOPICS.find(function(t){return t.id===parts[0];});
  if(!cat) return null;
  var sub = cat.subs[parseInt(parts[1])];
  return sub ? {cat:cat, sub:sub} : null;
}

/* 학습지 인쇄 옵션(표지·개념 페이지) — exam.js의 getCoverOn/getConceptPageOn과
   같은 localStorage 키를 직접 읽고 쓴다. drill.html은 자체 완결 페이지라
   exam.js 내부 함수를 그대로 부르는 대신 값만 공유한다(키 이름 반드시 일치). */
function getCoverPref(){ try{ var v = localStorage.getItem('nm_ws_cover'); return v===null ? true : v==='1'; }catch(e){ return true; } }
function setCoverPref(v){ try{ localStorage.setItem('nm_ws_cover', v?'1':'0'); }catch(e){} }
function getConceptPref(){ try{ return localStorage.getItem('nm_ws_concept_page')==='1'; }catch(e){ return false; } }
function setConceptPref(v){ try{ localStorage.setItem('nm_ws_concept_page', v?'1':'0'); }catch(e){} }

function getConfig(){
  var t = parseTopic(state.topicKey);
  if(!t) return null;
  return {
    thread: t.sub.thread,
    level: t.sub.level,
    count: state.count,
    timer: state.timer,
    wordType: state.wordType,
    seed: state.seed,
    /* 표지 색·아이콘용 — exam.js의 coverPageHtml이 이 값을 우선으로 쓴다
       (없으면 스레드ID 접두어로 자체 추정). TOPICS의 갈래 색을 그대로 표지에 낸다. */
    topicName: subLabel(t.sub),
    topicIcon: t.cat.icon,
    topicColor: t.cat.color,
    topicLabel: catLabel(t.cat),
    topicSection: t.cat.section
  };
}

/* ── 홈 화면 ── */
function showHome(){
  state.view = 'home';
  var sec = state.section || 'school';

  /* 탐색 탭이 바뀌어도 선택한 유형·문항 코드는 보존한다. */

  var html = '';
  html += '<div class="dr-hero">';
  html += '<div class="dr-folio"><span class="dr-folio-num">' + TOTAL_TOPICS + '</span><span class="dr-folio-label">' + dt('문제 유형 · '+TOPICS.length+'개 갈래','problem types · '+TOPICS.length+' groups','题型 · '+TOPICS.length+'类') + '</span></div>';
  html += '<h1 class="dr-home-title">' + dt('문제은행','Problem Bank','题库') + '</h1>';
  html += '<p class="dr-home-desc">' + dt('유형을 찾아 문제를 풀거나 학습지로 인쇄하세요.','Find a topic, solve problems or print a worksheet.','查找题型，做题或打印学习单。') + '</p>';
  html += '</div>';

  html += '<div class="dr-tabs">';
  html += '<button class="dr-tab school' + (sec==='school'?' on':'') + '" data-sec="school">' + dt('교과 연산','School Arithmetic','学校运算') + '<span class="dr-tab-sub">' + dt('덧셈·뺄셈·곱셈·나눗셈','add · subtract · multiply · divide','加·减·乘·除') + '</span></button>';
  html += '<button class="dr-tab magic' + (sec==='magic'?' on':'') + '" data-sec="magic">Numbers of Magic<span class="dr-tab-sub">' + dt('창의수연·수 감각','strategy math · number sense','思维数学·数感') + '</span></button>';
  html += '</div>';

  html += '<div class="workshop">';
  html += '<div class="drawer"><label class="dr-search-label" for="dr-search">' + dt('전체 유형 검색','Search all topics','搜索全部题型') + '</label><input class="drawer-search" id="dr-search" type="search" placeholder="' + dt('예: 제곱근, 소수, 연립방정식','e.g. roots, decimals, equations','例：平方根、小数、方程') + '" value="' + esc(state.search) + '"><div class="dr-search-tools"><span id="dr-search-status" role="status" aria-live="polite"></span><button id="dr-search-clear" type="button">' + dt('지우기','Clear','清除') + '</button><button id="dr-to-bench" type="button">' + dt('선택한 유형 보기','View selected topic','查看已选题型') + '</button></div><div class="drawer-list" id="dr-list"></div></div>';
  html += '<section class="bench" id="dr-bench" aria-label="' + dt('선택한 유형','Selected topic','已选题型') + '"></section>';
  html += '</div>';

  html += '<div class="dr-ticket">';
  html += '<div class="dr-ticket-title">' + dt('학습지 코드로 다시 풀기','Reopen a worksheet by its code','用学习单代码重新做题') + '</div>';
  html += '<div class="dr-code-row">';
  html += '<input class="dr-code-input" id="dr-code-in" aria-label="' + dt('학습지 코드','Worksheet code','学习单代码') + '" placeholder="#AD2-L1x20-k3f9z" value="' + esc(state.replayCode) + '" maxlength="2048">';
  html += '<button class="nm-btn nm-btn-primary nm-btn-small" id="dr-code-start">' + dt('시작','Start','开始') + '</button>';
  html += '<span class="dr-code-label">' + dt('같은 문제를 선생님·친구와 공유해요','Share the exact same problems with a teacher or friend','和老师·朋友共享同一份题目') + '</span>';
  html += '</div></div>';

  body.innerHTML = html;
  renderDrawer();
  renderBench();
  bindHome();
}

/* 서랍장(왼쪽 목록) — 섹션+검색에 따라 다시 그린다 */
function renderDrawer(){
  var sec = state.section || 'school';
  var norm = function(s){return String(s||'').toLowerCase().replace(/\s+/g,'');};
  var q = norm(state.search);
  var list = document.getElementById('dr-list');
  var cats = TOPICS.filter(function(c){ return q || c.section === sec; });
  var html = '';
  var shown = 0;

  cats.forEach(function(cat){
    var rows = '';
    var matched = 0;
    cat.subs.forEach(function(sub, i){
      var _lab = subLabel(sub), _dsc = subDesc(sub);
      var th=NM_THREADS[sub.thread];
      if(q && norm([_lab,_dsc,sub.label,catLabel(cat),th&&dL(th.name)].join(' ')).indexOf(q)===-1) return;
      var key = cat.id + ':' + i;
      var sel = state.topicKey === key ? ' sel' : '';
      rows += '<button class="drawer-item' + sel + '" aria-pressed="' + (state.topicKey===key) + '" data-key="' + esc(key) + '"><b>' + esc(_lab) + '</b><small>' + esc(_dsc) + '</small></button>';
      shown++;
      matched++;
    });
    if(rows){
      html += '<div class="drawer-group"><div class="drawer-group-h">' + esc(cat.icon + ' ' + catLabel(cat)) + '<span class="dg-count">' + matched + '</span></div>' + rows + '</div>';
    }
  });

  if(!shown) html = '<div class="drawer-empty">' + dt('검색 결과가 없어요.<br>다른 낱말로 찾아보세요.','No results.<br>Try a different word.','没有搜索结果。<br>换个词试试吧。') + '</div>';
  list.innerHTML = html;
  document.getElementById('dr-search-status').textContent=(q?dt('전체 검색','All topics','全部搜索'):dt(sec==='school'?'교과 연산':'Numbers of Magic',sec==='school'?'School Arithmetic':'Numbers of Magic',sec==='school'?'学校运算':'Numbers of Magic'))+' · '+shown+dt('개 유형',' topics','个题型');
  document.getElementById('dr-search-clear').disabled=!state.search;
  document.getElementById('dr-to-bench').disabled=!state.topicKey;

  list.querySelectorAll('.drawer-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(state.topicKey!==this.dataset.key)state.seed = NM_RNG.newCode();
      state.topicKey = this.dataset.key;
      list.querySelectorAll('.drawer-item').forEach(function(b){ b.classList.toggle('sel', b===btn);b.setAttribute('aria-pressed',String(b===btn)); });
      renderBench();
      document.getElementById('dr-to-bench').disabled=false;
      focusBench();
    });
  });
}
function focusBench(){
  var head=document.getElementById('dr-bench-title');
  if(head){head.focus({preventScroll:true});head.scrollIntoView({block:'start'});}
}

var COUNT_OPTS = [10,20,30];
var TIMER_OPTS = [{v:0,l:function(){return dt('없음','None','无');}},{v:180,l:function(){return dt('3분','3 min','3分钟');}},{v:300,l:function(){return dt('5분','5 min','5分钟');}}];
var WORD_OPTS = [{v:'none',l:function(){return dt('숫자 연산','Numbers','数字运算');}},{v:'mix',l:function(){return dt('문장제 섞기','Mix word problems','混合应用题');}},{v:'all',l:function(){return dt('문장제만','All word problems','全部应用题');}}];

/* 작업대(오른쪽 상세) — 선택 주제·문항수·타이머가 바뀔 때만 다시 그린다(서랍장은 그대로) */
function renderBench(){
  var bench = document.getElementById('dr-bench');
  var t = parseTopic(state.topicKey);

  if(!t){
    bench.innerHTML = '<div class="bench-empty">' + dt('유형 목록에서 주제를 골라 보세요.<br>실제 문제와 학습지 설정을 확인할 수 있어요.','Pick a topic from the list.<br>Preview problems and worksheet settings here.','从题型列表选择主题。<br>在这里预览题目和学习单设置。') + '</div>';
    return;
  }

  var html = '';
  html += '<button class="dr-back-list" id="dr-back-list" type="button">' + dt('← 유형 목록','← Topic list','← 题型列表') + '</button>';
  html += '<h2 class="bench-head" id="dr-bench-title" tabindex="-1">' + esc(subLabel(t.sub)) + '</h2>';
  html += '<div class="bench-desc">' + esc(t.cat.icon + ' ' + catLabel(t.cat) + ' · ' + subDesc(t.sub)) + '</div>';

  html += '<div class="bench-row"><div class="bench-label">' + dt('문항 수','Problems','题量') + '</div><div class="seg" id="dr-seg-count">';
  COUNT_OPTS.forEach(function(n){ html += '<button data-n="' + n + '" class="' + (state.count===n?'on':'') + '">' + n + '</button>'; });
  html += '</div></div>';

  html += '<div class="bench-row"><div class="bench-label">' + dt('타이머','Timer','计时') + '</div><div class="seg" id="dr-seg-timer">';
  TIMER_OPTS.forEach(function(o){ html += '<button data-v="' + o.v + '" class="' + (state.timer===o.v?'on':'') + '">' + esc(typeof o.l==='function'?o.l():o.l) + '</button>'; });
  html += '</div></div>';

  /* 문장제 유형 — 어떤 연산 주제든 그 자리에서 문장제로 바꿔 뽑을 수 있다(별도 문제은행 아님).
     생성 문장은 exam.js wordifyProblem이 만드는 한국어 문장이라, 단순 두-수 연산이 아닌
     주제(분수 약분 등)는 자동으로 숫자식 그대로 남는다 — exam.js와 동일한 동작. */
  html += '<div class="bench-row"><div class="bench-label">' + dt('유형','Style','题型') + '</div><div class="seg" id="dr-seg-word">';
  WORD_OPTS.forEach(function(o){ html += '<button data-w="' + o.v + '" class="' + (state.wordType===o.v?'on':'') + '">' + esc(o.l()) + '</button>'; });
  html += '</div></div>';

  html += '<div class="preview-hd"><span>' + dt('대표 문제 3개','3 sample problems','3道示例题') + '</span><button class="preview-dice" id="dr-dice">' + dt('🎲 다른 문제','🎲 New problems','🎲 换一批') + '</button></div>';
  html += '<div class="preview-grid" id="dr-preview"></div>';

  html += '<div class="bench-row"><div class="bench-label">' + dt('학습지 구성','Worksheet parts','学习单构成') + '</div><div class="dr-printopts">';
  html += '<label class="dr-check"><input type="checkbox" id="dr-opt-cover"' + (getCoverPref()?' checked':'') + '> ' + dt('표지','Cover','封面') + '</label>';
  html += '<label class="dr-check"><input type="checkbox" id="dr-opt-concept"' + (getConceptPref()?' checked':'') + '> ' + dt('개념 페이지','Concept page','概念页') + '</label>';
  html += '</div></div>';

  html += '<div class="bench-actions">';
  html += '<button class="gold-btn" id="dr-print-btn">' + dt('🖨 학습지 인쇄','🖨 Print worksheet','🖨 打印学习单') + '</button>';
  html += '<button class="nm-btn nm-btn-secondary" id="dr-start-btn">' + dt('▶ 화면으로 풀기','▶ Solve on screen','▶ 在屏幕上做') + '</button>';
  html += '<div class="dr-seed-wrap"><span class="dr-seed-label">' + dt('다시 풀기 코드','Replay code','重做代码') + '</span><code class="dr-seed-code" id="dr-seed-disp">' + esc(NM_EXAM.worksheetCode(getConfig())) + '</code></div>';
  html += '</div>';

  bench.innerHTML = html;
  renderPreview();
  bindBench();
}

function renderPreview(){
  var t = parseTopic(state.topicKey);
  var host = document.getElementById('dr-preview');
  if(!t || !host) return;
  var nSeed = NM_RNG.hashSeed(state.seed);
  var probs = NM_EXAM.buildProblems(t.sub.thread, t.sub.level, 3, nSeed);
  if(state.wordType!=='none' && NM_EXAM.applyWordProblems) NM_EXAM.applyWordProblems(probs, state.wordType==='mix'?'all':state.wordType, nSeed);
  /* 미리보기 3문항에 '섞기'를 그대로 걸면 1문항만 바뀌어 차이가 안 보인다 — 미리보기에서만 all로 보여준다 */
  host.innerHTML = probs.map(function(p){
    if(p.word) return '<div class="preview-cell preview-word">' + esc(dL(p.word)) + '</div>';
    return '<div class="preview-cell"><span data-tex="' + esc(p.tex||'') + '"></span></div>';
  }).join('');
  host.querySelectorAll('[data-tex]').forEach(function(el){
    if(window.katex){
      try{ katex.render(el.getAttribute('data-tex'), el, {throwOnError:false}); }catch(e){ el.textContent = el.getAttribute('data-tex'); }
    } else {
      el.textContent = el.getAttribute('data-tex');
    }
  });
}

function bindBench(){
  document.getElementById('dr-back-list').onclick=function(){
    var target=document.querySelector('.drawer-item.sel')||document.getElementById('dr-search');
    target.focus({preventScroll:true});target.scrollIntoView({block:'center'});
  };
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.classList.contains('on')));});
  var seg1 = document.getElementById('dr-seg-count');
  if(seg1) seg1.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ state.count = parseInt(this.dataset.n); renderBench(); document.querySelector('#dr-seg-count .on').focus({preventScroll:true}); });
  });
  var seg2 = document.getElementById('dr-seg-timer');
  if(seg2) seg2.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ state.timer = parseInt(this.dataset.v); renderBench(); document.querySelector('#dr-seg-timer .on').focus({preventScroll:true}); });
  });
  var seg3 = document.getElementById('dr-seg-word');
  if(seg3) seg3.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ state.wordType = this.dataset.w; renderBench(); document.querySelector('#dr-seg-word .on').focus({preventScroll:true}); });
  });
  var dice = document.getElementById('dr-dice');
  if(dice) dice.addEventListener('click', function(){ state.seed = NM_RNG.newCode(); renderPreview(); document.getElementById('dr-seed-disp').textContent=NM_EXAM.worksheetCode(getConfig()); });

  var startBtn = document.getElementById('dr-start-btn');
  if(startBtn) startBtn.addEventListener('click', function(){ var cfg = getConfig(); if(!cfg) return; showDrill(cfg); });

  var printBtn = document.getElementById('dr-print-btn');
  if(printBtn) printBtn.addEventListener('click', function(){ var cfg = getConfig(); if(!cfg) return; NM_EXAM.renderPrint(cfg); });

  var coverChk = document.getElementById('dr-opt-cover');
  if(coverChk) coverChk.addEventListener('change', function(){ setCoverPref(this.checked); });
  var conceptChk = document.getElementById('dr-opt-concept');
  if(conceptChk) conceptChk.addEventListener('change', function(){ setConceptPref(this.checked); });
}

function bindHome(){
  /* 섹션 탭 */
  document.querySelectorAll('.dr-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.section = this.dataset.sec;
      showHome();
      document.querySelector('.dr-tab.on').focus({preventScroll:true});
    });
  });

  /* 검색 */
  var search = document.getElementById('dr-search');
  search.addEventListener('input', function(e){ state.search = this.value; if(!e.isComposing)renderDrawer(); });
  search.addEventListener('compositionend', function(){ state.search=this.value;renderDrawer(); });
  document.getElementById('dr-search-clear').onclick=function(){state.search='';search.value='';renderDrawer();search.focus();};
  document.getElementById('dr-to-bench').onclick=focusBench;
  document.querySelectorAll('.dr-tab').forEach(function(btn){btn.setAttribute('aria-pressed',String(btn.dataset.sec===state.section));});

  /* 코드로 시작 — NM_EXAM.parseWorksheetCode를 그대로 쓴다(직접 정규식을 다시
     짜지 않음). 인쇄 미리보기 편집기(openPrintEditor)가 문항을 바꾼 코드는
     기본형 뒤에 `~3.k9f2`(슬롯 덮어쓰기)·`~g.zz12`(따라 풀기 재시드) 구간이
     붙는다 — parseWorksheetCode가 이를 overrides/guideSeed로 풀어 주므로
     여기서는 그대로 넘기기만 하면 편집기에서 바꾼 그 문항 그대로 재현된다. */
  document.getElementById('dr-code-start').addEventListener('click', function(){
    var code = document.getElementById('dr-code-in').value.trim();
    var cfg = NM_EXAM.parseWorksheetCode(code);
    if(!cfg){ alert(dt('코드 형식이 맞지 않아요.\n예) #AD2-L1x20-k3f9z','That code does not look right.\ne.g. #AD2-L1x20-k3f9z','代码格式不对。\n例：#AD2-L1x20-k3f9z')); return; }
    showDrill({thread:cfg.thread, level:cfg.level, count:cfg.count, timer:0, seed:cfg.seed,
      overrides:cfg.overrides, guideSeed:cfg.guideSeed});
  });

  document.getElementById('dr-code-in').addEventListener('keydown', function(e){
    if(e.key==='Enter'&&!e.isComposing) document.getElementById('dr-code-start').click();
  });
  document.getElementById('dr-code-in').addEventListener('input', function(){state.replayCode=this.value;});
}

/* ── 연습 화면 ── */
function showDrill(cfg){
  state.view = 'drill';
  body.innerHTML = '';

  var wrapper = document.createElement('div');
  wrapper.id = 'dr-drill-wrap';
  body.appendChild(wrapper);

  /* 뒤로가기 버튼 + 현재 주제 — 아래 시험 카드와 같은 폭으로 정렬 */
  var backRow = document.createElement('div');
  backRow.className = 'dr-run-bar';
  var backBtn = document.createElement('button');
  backBtn.className = 'nm-btn nm-btn-secondary nm-btn-small';
  backBtn.textContent = dt('← 처음으로','← Back to topics','← 回到主题');
  backBtn.addEventListener('click', function(){showHome();focusBench();});
  backRow.appendChild(backBtn);

  var topicInfo = document.createElement('span');
  topicInfo.className = 'dr-run-topic';
  var th = (window.NM_THREADS||{})[cfg.thread]||{};
  topicInfo.textContent = dL(th.name)||cfg.thread;
  backRow.appendChild(topicInfo);
  body.insertBefore(backRow, wrapper);

  /* 숫자패드 (모바일 지원) — drill wrapper 아래에 추가 */
  var numpadHtml = '<div class="dr-numpad" id="dr-numpad" style="display:none">';
  [7,8,9, 4,5,6, 1,2,3].forEach(function(n){
    numpadHtml += '<button class="dr-numpad-btn" data-n="' + n + '">' + n + '</button>';
  });
  numpadHtml += '<button class="dr-numpad-btn dr-np-del" data-n="del">⌫</button>';
  numpadHtml += '<button class="dr-numpad-btn" data-n="0">0</button>';
  /* 쉼표 — 답이 여러 칸인 유형(분수 [분자,분모] 등)은 "8, 9"처럼 받는다.
     이 키가 없으면 모바일에서 그런 문항을 아예 입력할 수 없다(2026-08-28). */
  numpadHtml += '<button class="dr-numpad-btn" data-n="comma">,</button>';
  numpadHtml += '<button class="dr-numpad-btn" data-n="dot">.</button>';
  numpadHtml += '<button class="dr-numpad-btn dr-np-ok" data-n="ok">' + dt('확인 ✓','OK ✓','确定 ✓') + '</button>';
  numpadHtml += '</div>';

  NM_EXAM.runExam(cfg, wrapper, function(result){
    /* 숫자패드 숨기기 */
    var np = document.getElementById('dr-numpad');
    if(np) np.remove();
    state.lastResult = result;
    showResult(result, cfg);
  });

  /* 숫자패드 삽입 + 활성화 */
  body.insertAdjacentHTML('beforeend', numpadHtml);
  activateNumpad();
}

function activateNumpad(){
  var numpad = document.getElementById('dr-numpad');
  if(!numpad) return;

  /* 모바일이면 보여주기, 데스크탑은 숨김 */
  if('ontouchstart' in window || navigator.maxTouchPoints > 0){
    numpad.style.display = 'grid';
  } else {
    numpad.style.display = 'none';
  }

  numpad.addEventListener('click', function(e){
    var btn = e.target.closest('.dr-numpad-btn');
    if(!btn) return;
    var n = btn.dataset.n;
    var inp = document.getElementById('nm-ex-ans') || document.getElementById('nm-ex-ans2');
    if(!inp) return;
    if(n === 'del'){
      inp.value = inp.value.slice(0, -1) || '';
    } else if(n === 'comma'){
      inp.value = (inp.value||'') + ', ';
    } else if(n === 'dot'){
      inp.value = (inp.value||'') + '.';
    } else if(n === 'ok'){
      var submitBtn = document.getElementById('nm-ex-submit') || document.getElementById('nm-ex-sub2');
      if(submitBtn) submitBtn.click();
    } else {
      inp.value = (inp.value||'') + n;
    }
    inp.dispatchEvent(new Event('input'));
  });
}

/* ── 결과 화면 ── */
function showResult(result, origCfg){
  state.view = 'result';
  body.innerHTML = '';

  var backRow = document.createElement('div');
  backRow.className = 'dr-run-bar';
  var backBtn = document.createElement('button');
  backBtn.className = 'nm-btn nm-btn-secondary nm-btn-small';
  backBtn.textContent = dt('← 처음으로','← Back to topics','← 回到主题');
  backBtn.addEventListener('click', showHome);
  backRow.appendChild(backBtn);
  body.appendChild(backRow);

  var resultWrap = document.createElement('div');
  body.appendChild(resultWrap);

  NM_EXAM.renderResult(result, resultWrap, function(opts){
    if(opts.mode === 'new'){
      var newCfg = {
        thread: opts.thread||origCfg.thread,
        level: opts.level||origCfg.level,
        count: opts.count||origCfg.count,
        timer: origCfg.timer,
        seed: NM_RNG.newCode()
      };
      showDrill(newCfg);
    } else if(opts.mode === 'wrongs'){
      showWrongsRetry(opts.wrongs, origCfg);
    }
  });
  /* 결과 화면엔 답 입력칸이 없으므로 숫자패드를 안 붙인다(예전엔 여기 붙여도 쓸 곳이 없어
     모바일에서 아무 기능 없는 키패드만 떠 있었다 — 오답 재시험은 showWrongsRetry가 따로 붙인다) */
}

function buildNumpadHTML(){
  var h = '';
  [7,8,9,4,5,6,1,2,3].forEach(function(n){ h += '<button class="dr-numpad-btn" data-n="'+n+'">'+n+'</button>'; });
  h += '<button class="dr-numpad-btn dr-np-del" data-n="del">⌫</button>';
  h += '<button class="dr-numpad-btn" data-n="0">0</button>';
  h += '<button class="dr-numpad-btn" data-n="comma">,</button>';
  h += '<button class="dr-numpad-btn" data-n="dot">.</button>';
  h += '<button class="dr-numpad-btn dr-np-ok" data-n="ok">' + dt('확인 ✓','OK ✓','确定 ✓') + '</button>';
  return h;
}

/* ── 오답 재시험 ── */
function showWrongsRetry(wrongs, origCfg){
  body.innerHTML = '';
  var wrongProblems = wrongs.map(function(w){return w.p;});
  var answers = new Array(wrongProblems.length).fill(null);
  var current = 0;
  var startTime = Date.now();

  var backRow = document.createElement('div');
  backRow.className = 'dr-run-bar';
  var backBtn = document.createElement('button');
  backBtn.className = 'nm-btn nm-btn-secondary nm-btn-small';
  backBtn.textContent = dt('← 처음으로','← Back to topics','← 回到主题');
  backBtn.addEventListener('click', showHome);
  backRow.appendChild(backBtn);
  body.appendChild(backRow);

  var wrap = document.createElement('div');
  body.appendChild(wrap);

  function renderWrong(){
    var p = wrongProblems[current];
    var pct = Math.round((current/wrongProblems.length)*100);
    wrap.innerHTML =
      '<div class="nm-exam-run">' +
        '<div class="nm-exam-header">' +
          '<div class="nm-exam-progress"><div class="nm-progress-bar" style="width:' + pct + '%"></div></div>' +
          '<div class="nm-exam-info"><span class="nm-q-counter">' + dt('오답 재시험','Retry missed','错题重做') + ' ' + (current+1) + ' / ' + wrongProblems.length + '</span></div>' +
        '</div>' +
        '<div class="nm-exam-question"><div class="nm-q-tex" id="nm-ex-qtex2"></div></div>' +
        '<div class="nm-exam-input">' +
          '<input id="nm-ex-ans2" type="text" inputmode="decimal" ' +
            'placeholder="' + (Array.isArray(p.answer)?dt('예: 3, 5','e.g. 3, 5','如：3, 5'):dt('답','Answer','答案')) + '" autocomplete="off">' +
          '<button id="nm-ex-sub2" class="nm-btn nm-btn-primary">' + dt('확인 ✓','OK ✓','确定 ✓') + '</button>' +
        '</div>' +
      '</div>';

    if(window.katex){
      try{ katex.render(p.tex||'', document.getElementById('nm-ex-qtex2'), {throwOnError:false}); }catch(_){}
    } else {
      document.getElementById('nm-ex-qtex2').textContent = NM_EXAM.texToPlain ? NM_EXAM.texToPlain(p.tex||'') : (p.tex||'').replace(/\\square/g,'□').replace(/\\/g,'');
    }

    var inp = document.getElementById('nm-ex-ans2');
    if(answers[current]!==null) inp.value = answers[current];
    inp.focus();

    function submit(){
      /* 여러 칸 답("8, 9")은 문자열 그대로 — parseInt를 태우면 8이 되어 늘 오답 */
      if(Array.isArray(p.answer)){
        if(String(inp.value).trim() !== '') answers[current] = inp.value;
      } else {
        var v = parseFloat(inp.value);   /* 소수 답이 잘리지 않도록 */
        if(!isNaN(v)) answers[current] = v;
      }
      current++;
      if(current >= wrongProblems.length){
        var score = wrongProblems.filter(function(p,i){return matchesAnswer(answers[i],p.answer);}).length;
        var elapsed = Math.round((Date.now()-startTime)/1000);
        wrap.innerHTML =
          '<div class="nm-exam-result">' +
            '<div class="nm-result-score ' + (score===wrongProblems.length?'nm-pass':'nm-fail') + '">' +
              '<div class="nm-score-num">' + score + ' / ' + wrongProblems.length + '</div>' +
              '<div class="nm-score-label">' + (score===wrongProblems.length?dt('🎉 완벽해요!','🎉 Perfect!','🎉 全对了！'):dt('💪 계속 연습해요','💪 Keep practicing!','💪 继续练习吧')) + '</div>' +
            '</div>' +
            '<div class="nm-result-actions" style="margin-top:16px">' +
              '<button id="dr-wr-again" class="nm-btn nm-btn-primary">' + dt('🎲 새 문제','🎲 New set','🎲 新题目') + '</button>' +
              '<button id="dr-wr-home" class="nm-btn nm-btn-secondary">' + dt('← 주제 선택','← Choose a topic','← 选择主题') + '</button>' +
            '</div>' +
          '</div>';
        document.getElementById('dr-wr-home').addEventListener('click', showHome);
        document.getElementById('dr-wr-again').addEventListener('click', function(){
          showDrill({thread:origCfg.thread,level:origCfg.level,count:origCfg.count,timer:origCfg.timer,seed:NM_RNG.newCode()});
        });
      } else {
        renderWrong();
      }
    }
    document.getElementById('nm-ex-sub2').addEventListener('click', submit);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  }

  body.insertAdjacentHTML('beforeend', '<div class="dr-numpad" id="dr-numpad" style="display:none">' + buildNumpadHTML() + '</div>');
  activateNumpad();
  renderWrong();
}

/* ── 시작 ── */
/* parseWorksheetCode를 NM_EXAM에서 가져오거나 직접 구현 */
if(!NM_EXAM.parseWorksheetCode){
  NM_EXAM.parseWorksheetCode = function(code){
    var m = (code||'').match(/^#?([A-Z0-9]+)-L(\d+)x(\d+)-([a-z0-9]+)$/i);
    if(!m) return null;
    return {thread:m[1],level:parseInt(m[2]),count:parseInt(m[3]),seed:m[4]};
  };
}

showHome();

})();
</script>
</body>
</html>
