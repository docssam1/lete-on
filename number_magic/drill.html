<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제은행 · Numbers of Magic</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<style>
/* ============================================================
   토큰 — about.html·앱 본체와 통일. 리디자인-설계.md §2/§4.
   ============================================================ */
:root{
  --paper:#FBFAF7; --paper-warm:#F7F5F0; --mist:#F1F0EC; --line:#E4E2DC;
  --ink:#1A2233; --sub:#4a5468;
  --blue:#16417C; --blue-deep:#0E2C57;
  --gold:#C9A063; --gold-soft:#EAC996; --gold-bright:#F5D98B;
  --ok:#2E9E6B; --no:#D9534F;
  --shadow-1:0 1px 2px rgba(26,34,51,.05), 0 4px 14px rgba(26,34,51,.06);
  --shadow-2:0 2px 4px rgba(26,34,51,.06), 0 10px 30px rgba(26,34,51,.09);
  --serif:'Gowun Batang','Noto Serif SC',ui-serif,Georgia,serif;
  --mono:ui-monospace,'SF Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Pretendard',sans-serif;color:var(--ink);background:var(--paper-warm)}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:36px 36px;background-attachment:fixed}
.katex{font-size:1em}

/* ── 판면 ── */
#drill-root{min-height:100vh;display:flex;flex-direction:column;max-width:1160px;margin:0 auto;position:relative}
#drill-root::before,#drill-root::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
#drill-root::before{left:0}#drill-root::after{right:0}

.dr-header{background:rgba(251,250,247,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:16px 40px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.dr-wordmark{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink)}
.dr-wordmark b{color:var(--gold);font-weight:700}
.dr-header-sub{font-size:12px;color:var(--sub);margin-left:2px}
.dr-home-link{margin-left:auto;font-size:13px;color:var(--sub);text-decoration:none;font-weight:700;
  transition:.15s;border-bottom:1px solid transparent}
.dr-home-link:hover{color:var(--ink);border-color:var(--line)}
.dr-body{flex:1;padding:40px 40px 64px;width:100%}
@media(max-width:700px){.dr-header{padding:14px 20px}.dr-body{padding:28px 20px 48px}}

/* ── 공용 버튼 ── */
.nm-btn{border:none;border-radius:9px;font-family:'Pretendard',sans-serif;
  font-weight:700;cursor:pointer;transition:.15s;padding:12px 22px;font-size:14.5px}
.nm-btn:disabled{opacity:.4;cursor:not-allowed}
.nm-btn:active:not(:disabled){transform:scale(.97)}
.nm-btn-primary{background:var(--blue-deep);color:#fff}
.nm-btn-primary:hover:not(:disabled){background:var(--blue)}
.nm-btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.nm-btn-secondary:hover:not(:disabled){background:var(--mist)}
.nm-btn-small{font-size:12.5px;padding:8px 14px;border-radius:7px}

/* 금박 버튼(리디자인-설계.md §3-5/§4-3) */
.gold-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 26px;border-radius:9px;font-weight:700;font-size:14.5px;color:var(--gold-bright);
  background-image:linear-gradient(var(--ink),var(--ink)),linear-gradient(135deg,var(--gold-soft),var(--gold),var(--gold-bright));
  background-origin:border-box;background-clip:padding-box,border-box;border:1.5px solid transparent;
  overflow:hidden;cursor:pointer;font-family:'Pretendard',sans-serif;transition:transform .15s ease,box-shadow .2s ease}
.gold-btn::before{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
.gold-btn:hover:not(:disabled){box-shadow:var(--shadow-2)}
.gold-btn:hover:not(:disabled)::before{animation:sheen .9s ease forwards}
@keyframes sheen{from{left:-60%}to{left:130%}}
.gold-btn:active:not(:disabled){transform:translateY(1px)}
.gold-btn:disabled{opacity:.35;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.gold-btn:hover::before{animation:none}}

/* ── 홈 — 헤더 ── */
.dr-hero{margin-bottom:28px}
.dr-folio{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.dr-folio-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--gold)}
.dr-folio-label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.dr-home-title{font-family:var(--serif);font-size:clamp(26px,4.6vw,36px);font-weight:700;color:var(--blue-deep);margin-bottom:8px}
.dr-home-desc{font-size:14px;color:var(--sub)}

/* ── 섹션 탭 ── */
.dr-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:28px 0 0}
.dr-tab{border:none;background:transparent;font-family:'Pretendard',sans-serif;
  font-weight:800;font-size:14.5px;padding:14px 4px;margin-right:28px;cursor:pointer;
  transition:.18s;color:var(--sub);text-align:left;line-height:1.3;border-bottom:2px solid transparent}
.dr-tab .dr-tab-sub{font-size:11px;font-weight:600;display:block;margin-top:2px;opacity:.75}
.dr-tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.dr-tab.on.school{color:var(--blue)}
.dr-tab.on.magic{color:var(--blue-deep)}

/* ── 작업대(공방) — 서랍장 + 벤치 ── */
.workshop{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;margin-top:22px;background:var(--paper)}
@media(max-width:860px){.workshop{grid-template-columns:1fr}}

.drawer{border-right:1px solid var(--line);display:flex;flex-direction:column;max-height:620px}
@media(max-width:860px){.drawer{border-right:none;border-bottom:1px solid var(--line);max-height:320px}}
.drawer-search{border:none;border-bottom:1px solid var(--line);padding:14px 16px;font-size:13.5px;
  font-family:'Pretendard',sans-serif;outline:none;background:transparent;color:var(--ink);width:100%}
.drawer-search::placeholder{color:var(--sub)}
.drawer-list{overflow-y:auto;flex:1}
.drawer-group-h{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--sub);position:sticky;top:0;background:var(--paper);z-index:1}
.dg-count{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--gold);font-size:11px}
.drawer-item{display:block;width:100%;text-align:left;border:none;background:transparent;
  padding:10px 16px 10px 16px;cursor:pointer;font-family:'Pretendard',sans-serif;border-bottom:1px solid var(--mist)}
.drawer-item:hover{background:var(--mist)}
.drawer-item.sel{background:var(--blue-deep)}
.drawer-item b{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.drawer-item.sel b{color:#fff}
.drawer-item small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.drawer-item.sel small{color:rgba(255,255,255,.68)}
.drawer-empty{padding:32px 20px;text-align:center;color:var(--sub);font-size:13px}

.bench{padding:30px;background:var(--paper-warm);min-height:400px}
@media(max-width:700px){.bench{padding:22px 18px}}
.bench-empty{color:var(--sub);font-size:14px;padding:60px 10px;text-align:center}
.bench-head{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--blue-deep)}
.bench-desc{font-size:12.5px;color:var(--sub);margin-top:5px;letter-spacing:.02em;text-transform:uppercase;font-weight:700}

.bench-row{margin-top:22px}
.bench-label{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:8px;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--paper);padding:9px 15px;font-size:13px;font-weight:700;
  font-family:'Pretendard',sans-serif;cursor:pointer;color:var(--sub);border-right:1px solid var(--line);
  font-variant-numeric:tabular-nums}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--blue-deep);color:#fff}

.bench-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.dr-seed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.dr-seed-label{font-size:11px;color:var(--sub)}
.dr-seed-code{font-size:12px;font-family:var(--mono);color:var(--sub);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;background:var(--paper);cursor:pointer;transition:.15s}
.dr-seed-code:hover{background:var(--mist)}

.preview-hd{display:flex;align-items:center;gap:10px;margin-top:28px;margin-bottom:12px}
.preview-hd span{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.02em}
.preview-dice{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 11px;
  font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s;font-family:'Pretendard',sans-serif}
.preview-dice:hover{background:var(--mist);color:var(--ink)}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.preview-cell{border:1px solid var(--line);border-radius:8px;padding:16px 10px;background:var(--paper);
  text-align:center;font-size:16px;min-height:60px;display:flex;align-items:center;justify-content:center}

/* ── 코드로 다시 풀기 — 학습지 티켓 ── */
.dr-ticket{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:18px 24px;margin-top:26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;overflow:hidden}
.dr-ticket::before,.dr-ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;
  background:var(--paper-warm);border-radius:50%;transform:translateY(-50%)}
.dr-ticket::before{left:-9px}.dr-ticket::after{right:-9px}
.dr-ticket-title{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em;flex:none;width:100%}
.dr-code-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;
  border-left:1px dashed var(--line);padding-left:16px;margin-left:2px}
@media(max-width:520px){.dr-code-row{border-left:none;padding-left:0;margin-left:0}}
.dr-code-input{border:1.5px solid var(--line);border-radius:8px;padding:10px 13px;font-size:12.5px;
  font-family:var(--mono);width:180px;outline:none;transition:.15s;color:var(--ink);background:var(--paper)}
.dr-code-input:focus{border-color:var(--blue)}
.dr-code-label{font-size:11.5px;color:var(--sub)}

/* ── 실행 화면 상단 바(뒤로가기+주제명) — 카드와 같은 폭으로 정렬 ── */
.dr-run-bar{max-width:560px;margin:0 auto 16px;display:flex;align-items:center;gap:10px}
.dr-run-topic{font-size:13px;color:var(--sub);font-weight:700}

/* ── 연습 화면(exam.js가 생성하는 .nm-exam-*) — 흩어진 3개 박스 → 하나의 카드로 재구성 ── */
.nm-exam-run{max-width:560px;margin:0 auto;background:var(--paper);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow-1)}
.nm-exam-header{background:var(--paper-warm);border-bottom:1px solid var(--line);padding:16px 22px}
.nm-exam-progress{height:4px;background:var(--mist);border-radius:99px;overflow:hidden;margin-bottom:12px}
.nm-progress-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));border-radius:99px;transition:width .35s ease}
.nm-exam-info{display:flex;justify-content:space-between;align-items:baseline}
.nm-q-counter{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:700;color:var(--ink)}
.nm-timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:800;color:var(--no);
  background:rgba(213,83,79,.1);padding:4px 10px;border-radius:99px}

.nm-exam-question{padding:46px 26px 34px;text-align:center;position:relative}
.nm-exam-question::before{content:"문제";position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.nm-q-tex{font-size:clamp(26px,7vw,40px);font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.3}
.nm-q-tex .katex{font-size:1em}
.nm-q-hint{font-size:12.5px;color:var(--sub);margin:14px auto 0;max-width:38ch}

.nm-exam-input{display:flex;justify-content:center;padding:0 26px 26px}
#nm-ex-ans,#nm-ex-ans2{font-size:clamp(19px,5.5vw,25px);text-align:center;padding:12px 8px;
  border:1.5px solid var(--line);border-right:none;border-radius:10px 0 0 10px;width:100%;max-width:170px;
  font-family:'Pretendard',sans-serif;font-weight:800;outline:none;transition:.15s;background:var(--paper);
  color:var(--ink);-moz-appearance:textfield}
#nm-ex-ans::-webkit-outer-spin-button,#nm-ex-ans::-webkit-inner-spin-button,
#nm-ex-ans2::-webkit-outer-spin-button,#nm-ex-ans2::-webkit-inner-spin-button{-webkit-appearance:none}
#nm-ex-ans:focus,#nm-ex-ans2:focus{border-color:var(--blue)}
#nm-ex-submit,#nm-ex-sub2{background:var(--blue-deep);color:#fff;font-size:14px;font-weight:800;
  border:1.5px solid var(--blue-deep);border-radius:0 10px 10px 0;padding:0 20px;cursor:pointer;
  transition:.15s;font-family:'Pretendard',sans-serif;flex:none}
#nm-ex-submit:hover,#nm-ex-sub2:hover{background:var(--blue)}
#nm-ex-submit:active,#nm-ex-sub2:active{transform:scale(.98)}

.nm-exam-nav{display:flex;border-top:1px solid var(--line)}
#nm-ex-prev,#nm-ex-skip{flex:1;background:transparent;color:var(--sub);border:none;
  padding:13px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Pretendard',sans-serif;transition:.15s}
#nm-ex-prev{border-right:1px solid var(--line)}
#nm-ex-prev:hover:not(:disabled),#nm-ex-skip:hover{background:var(--mist);color:var(--ink)}
#nm-ex-prev:disabled{opacity:.35;cursor:not-allowed}

/* ── 숫자 키패드 — 독립 카드로, 연습 카드와 같은 폭·정렬 ── */
.dr-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:380px;
  margin:16px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-1);padding:14px}
.dr-numpad-btn{background:var(--paper-warm);border:1px solid var(--line);border-radius:9px;font-size:20px;
  font-weight:700;padding:14px 10px;cursor:pointer;transition:.1s;color:var(--ink);
  font-family:'Pretendard',sans-serif;font-variant-numeric:tabular-nums}
.dr-numpad-btn:active{background:var(--mist);transform:scale(.95)}
.dr-numpad-btn.dr-np-del{background:rgba(213,83,79,.08);color:var(--no);font-size:16px;border-color:rgba(213,83,79,.25)}
.dr-numpad-btn.dr-np-ok{background:var(--blue-deep);color:#fff;font-size:14px;grid-column:span 2;border-color:var(--blue-deep)}
.dr-numpad-btn.dr-np-ok:active{background:var(--blue)}

/* ── 결과 화면 — 점수·오답·액션을 하나의 세로 리듬으로 ── */
.nm-exam-result{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.nm-result-score{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:34px 24px;text-align:center;box-shadow:var(--shadow-1);overflow:hidden}
.nm-result-score::before{content:"";position:absolute;top:0;left:0;right:0;height:4px}
.nm-result-score.nm-pass::before{background:linear-gradient(90deg,var(--ok),var(--gold))}
.nm-result-score.nm-fail::before{background:linear-gradient(90deg,var(--gold),var(--no))}
.nm-score-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(38px,10vw,58px);
  font-weight:700;color:var(--ink);line-height:1}
.nm-score-pct{font-size:14.5px;font-weight:800;color:var(--sub);margin-top:6px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.nm-score-label{display:inline-block;font-size:13.5px;font-weight:800;margin-top:14px;
  padding:6px 18px;border-radius:99px}
.nm-result-score.nm-pass .nm-score-label{color:var(--ok);background:rgba(46,158,107,.1)}
.nm-result-score.nm-fail .nm-score-label{color:#9c7a3f;background:rgba(201,160,99,.14)}
.nm-score-time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--sub);margin-top:12px}

.nm-result-perfect{font-size:15px;font-weight:700;text-align:center;padding:22px;color:var(--ok);
  background:rgba(46,158,107,.06);border:1px solid rgba(46,158,107,.2);border-radius:14px}

.nm-result-wrongs{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:22px;box-shadow:var(--shadow-1)}
.nm-result-wrongs h3{font-size:11px;font-weight:800;margin-bottom:14px;color:var(--sub);
  text-transform:uppercase;letter-spacing:.08em}
.nm-result-table{width:100%;border-collapse:collapse;font-size:13.5px}
.nm-result-table th{text-align:left;padding:8px 10px;font-size:10.5px;color:var(--sub);
  border-bottom:1px solid var(--line);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.nm-result-table td{padding:11px 10px;border-bottom:1px solid var(--mist);vertical-align:middle;
  font-variant-numeric:tabular-nums}
.nm-result-table tr:last-child td{border-bottom:none}
.nm-rtex{min-width:110px}
.nm-wrong-ans{color:var(--no);font-weight:700;font-size:13.5px;text-decoration:line-through;
  text-decoration-color:rgba(213,83,79,.4)}
.nm-correct-ans{color:var(--ok);font-weight:700;font-size:13.5px}

/* 좁은 화면: 표 → 카드 리스트 (열마다 라벨을 CSS content로 붙임, 마크업 불변) */
@media(max-width:520px){
  .nm-result-table thead{display:none}
  .nm-result-table,.nm-result-table tbody,.nm-result-table tr,.nm-result-table td{display:block;width:100%}
  .nm-result-table tr{border:1px solid var(--mist);border-radius:10px;padding:14px;margin-bottom:10px}
  .nm-result-table tr:last-child{margin-bottom:0}
  .nm-result-table td{border:none;padding:3px 0}
  .nm-result-table td:first-child{font-family:var(--mono);font-weight:800;color:var(--gold);font-size:11px}
  .nm-result-table td.nm-rtex{padding:6px 0 10px;font-size:16px}
  .nm-result-table td.nm-rtex::before{content:"문제";display:block;font-size:10px;color:var(--sub);
    font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .nm-result-table td.nm-wrong-ans,.nm-result-table td.nm-correct-ans{display:flex;
    justify-content:space-between;align-items:center}
  .nm-result-table td.nm-wrong-ans::before{content:"내 답";font-size:10.5px;color:var(--sub);font-weight:700}
  .nm-result-table td.nm-correct-ans::before{content:"정답";font-size:10.5px;color:var(--sub);font-weight:700}
}

.nm-result-actions{display:flex;gap:10px;flex-wrap:wrap}
.nm-result-actions .nm-btn{flex:1;min-width:120px;text-align:center}
.nm-result-code{font-size:11.5px;color:var(--sub);text-align:center;padding-top:2px}
.nm-result-code code{font-family:var(--mono);background:var(--mist);padding:3px 9px;border-radius:5px;color:var(--ink)}

/* ── 인쇄(exam.js print CSS 보완) ── */
@media print{
  body>*:not(.nm-print-sheet){display:none!important}
  .nm-print-sheet{display:block!important}
}
</style>
</head>
<body>
<div id="drill-root">
  <header class="dr-header">
    <span class="dr-wordmark">Numbers <b>of</b> Magic</span>
    <span class="dr-header-sub">문제은행</span>

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 다칸 답(배열) 채점 — app/exam.js의 matchesAnswer와 동일 로직(이 파일은 별도 스코프라 자체 보유) */
function matchesAnswer(raw, answer){
  if(Array.isArray(answer)){
    var parts = String(raw==null?'':raw).split(',').map(function(s){return parseFloat(s.trim());});
    if(parts.length !== answer.length) return false;
    for(var i=0;i<answer.length;i++){ if(parts[i] !== answer[i]) return false; }
    return true;
  }
  return parseFloat(raw) === answer;
}

/* topicKey → {cat, sub} */
function parseTopic(key){
  if(!key) return null;
  var parts = key.split(':');
  var cat = TOPICS.find(function(t){return t.id===parts[0];});
  if(!cat) return null;
  var sub = cat.subs[parseInt(parts[1])];
  return sub ? {cat:cat, sub:sub} : null;
}

function getConfig(){
  var t = parseTopic(state.topicKey);
  if(!t) return null;
  return {
    thread: t.sub.thread,
    level: t.sub.level,
    count: state.count,
    timer: state.timer,
    seed: state.seed
  };
}

/* 서랍장(왼쪽 목록) — 섹션+검색에 따라 다시 그린다 */
function renderDrawer(){
  var sec = state.section || 'school';
  var q = (state.search||'').trim().toLowerCase();
  var list = document.getElementById('dr-list');
  var cats = TOPICS.filter(function(c){ return c.section === sec; });
  var html = '';
  var shown = 0;

  cats.forEach(function(cat){
    var rows = '';
    cat.subs.forEach(function(sub, i){
      if(q && sub.label.toLowerCase().indexOf(q)===-1 && (sub.desc||'').toLowerCase().indexOf(q)===-1) return;
      var key = cat.id + ':' + i;
      var sel = state.topicKey === key ? ' sel' : '';
      rows += '<button class="drawer-item' + sel + '" data-key="' + esc(key) + '"><b>' + esc(sub.label) + '</b><small>' + esc(sub.desc) + '</small></button>';
      shown++;
    });
    if(rows){
      html += '<div class="drawer-group"><div class="drawer-group-h">' + esc(cat.icon + ' ' + cat.label) + '<span class="dg-count">' + cat.subs.length + '</span></div>' + rows + '</div>';
    }
  });

  if(!shown) html = '<div class="drawer-empty">검색 결과가 없어요.<br>다른 낱말로 찾아보세요.</div>';
  list.innerHTML = html;

  list.querySelectorAll('.drawer-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.topicKey = this.dataset.key;
      state.seed = NM_RNG.newCode();
      state.previewSeed = NM_RNG.newCode();
      list.querySelectorAll('.drawer-item').forEach(function(b){ b.classList.toggle('sel', b===btn); });
      renderBench();
    });
  });
}

function renderPreview(){
  var t = parseTopic(state.topicKey);
  var host = document.getElementById('dr-preview');
  if(!t || !host) return;
  var nSeed = NM_RNG.hashSeed(state.previewSeed);
  var probs = NM_EXAM.buildProblems(t.sub.thread, t.sub.level, 3, nSeed);
  host.innerHTML = probs.map(function(p){ return '<div class="preview-cell"><span data-tex="' + esc(p.tex||'') + '"></span></div>'; }).join('');
  host.querySelectorAll('[data-tex]').forEach(function(el){
    if(window.katex){
      try{ katex.render(el.getAttribute('data-tex'), el, {throwOnError:false}); }catch(e){ el.textContent = el.getAttribute('data-tex'); }
    } else {
      el.textContent = el.getAttribute('data-tex');
    }
  });
}

function bindBench(){
  var seg1 = document.getElementById('dr-seg-count');
  if(seg1) seg1.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ state.count = parseInt(this.dataset.n); renderBench(); });
  });
  var seg2 = document.getElementById('dr-seg-timer');
  if(seg2) seg2.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ state.timer = parseInt(this.dataset.v); renderBench(); });
  });
  var dice = document.getElementById('dr-dice');
  if(dice) dice.addEventListener('click', function(){ state.previewSeed = NM_RNG.newCode(); renderPreview(); });

  var seedDisp = document.getElementById('dr-seed-disp');
  if(seedDisp) seedDisp.addEventListener('click', function(){ state.seed = NM_RNG.newCode(); renderBench(); });

  var startBtn = document.getElementById('dr-start-btn');
  if(startBtn) startBtn.addEventListener('click', function(){ var cfg = getConfig(); if(!cfg) return; showDrill(cfg); });

  var printBtn = document.getElementById('dr-print-btn');
  if(printBtn) printBtn.addEventListener('click', function(){ var cfg = getConfig(); if(!cfg) return; NM_EXAM.renderPrint(cfg); });
}

function bindHome(){
  /* 섹션 탭 */
  document.querySelectorAll('.dr-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.section = this.dataset.sec;
      state.topicKey = null;
      state.search = '';
      state.seed = NM_RNG.newCode();
      showHome();
    });
  });

  /* 검색 */
  var search = document.getElementById('dr-search');
  search.addEventListener('input', function(){ state.search = this.value; renderDrawer(); });

  /* 코드로 시작 */
  document.getElementById('dr-code-start').addEventListener('click', function(){
    var code = document.getElementById('dr-code-in').value.trim();
    var m = code.match(/^#?([A-Z0-9]+)-L(\d+)x(\d+)-([a-z0-9]+)$/i);
    if(!m){ alert('코드 형식이 맞지 않아요.\n예) #AD2-L1x20-k3f9z'); return; }
    showDrill({thread:m[1],level:parseInt(m[2]),count:parseInt(m[3]),timer:0,seed:m[4]});
  });

  document.getElementById('dr-code-in').addEventListener('keydown', function(e){
    if(e.key==='Enter') document.getElementById('dr-code-start').click();
  });
}

  wrapper.id = 'dr-drill-wrap';
  body.appendChild(wrapper);

  /* 뒤로가기 버튼 + 현재 주제 — 아래 시험 카드와 같은 폭으로 정렬 */
  var backRow = document.createElement('div');
  backRow.className = 'dr-run-bar';
  var backBtn = document.createElement('button');
  backBtn.className = 'nm-btn nm-btn-secondary nm-btn-small';
  backBtn.textContent = '← 처음으로';
  backBtn.addEventListener('click', showHome);
  backRow.appendChild(backBtn);

  var topicInfo = document.createElement('span');
  topicInfo.className = 'dr-run-topic';
  var th = (window.NM_THREADS||{})[cfg.thread]||{};
  topicInfo.textContent = (th.name&&th.name.ko)||cfg.thread;
  backRow.appendChild(topicInfo);
  body.insertBefore(backRow, wrapper);

  /* 숫자패드 (모바일 지원) — drill wrapper 아래에 추가 */
  var numpadHtml = '<div class="dr-numpad" id="dr-numpad" style="display:none">';
  [7,8,9, 4,5,6, 1,2,3].forEach(function(n){
    numpadHtml += '<button class="dr-numpad-btn" data-n="' + n + '">' + n + '</button>';
  });
  numpadHtml += '<button class="dr-numpad-btn dr-np-del" data-n="del">⌫</button>';
  numpadHtml += '<button class="dr-numpad-btn" data-n="0">0</button>';
  numpadHtml += '<button class="dr-numpad-btn dr-np-ok" data-n="ok">확인 ✓</button>';
  numpadHtml += '</div>';

  NM_EXAM.runExam(cfg, wrapper, function(result){
    /* 숫자패드 숨기기 */
    var np = document.getElementById('dr-numpad');
    if(np) np.remove();
    state.lastResult = result;
    showResult(result, cfg);
  });

  /* 숫자패드 삽입 + 활성화 */
  body.insertAdjacentHTML('beforeend', numpadHtml);
  activateNumpad();
}

function activateNumpad(){
  var numpad = document.getElementById('dr-numpad');
  if(!numpad) return;

  /* 모바일이면 보여주기, 데스크탑은 숨김 */
  if('ontouchstart' in window || navigator.maxTouchPoints > 0){
    numpad.style.display = 'grid';
  } else {
    numpad.style.display = 'none';
  }

  numpad.addEventListener('click', function(e){
    var btn = e.target.closest('.dr-numpad-btn');
    if(!btn) return;
    var n = btn.dataset.n;
    var inp = document.getElementById('nm-ex-ans') || document.getElementById('nm-ex-ans2');
    if(!inp) return;
    if(n === 'del'){
      inp.value = inp.value.slice(0, -1) || '';
    } else if(n === 'ok'){
      var submitBtn = document.getElementById('nm-ex-submit') || document.getElementById('nm-ex-sub2');
      if(submitBtn) submitBtn.click();
    } else {
      inp.value = (inp.value||'') + n;
    }
    inp.dispatchEvent(new Event('input'));
  });
}

/* ── 결과 화면 ── */
function showResult(result, origCfg){
  state.view = 'result';
  body.innerHTML = '';

  var backRow = document.createElement('div');
  backRow.className = 'dr-run-bar';
  var backBtn = document.createElement('button');
  backBtn.className = 'nm-btn nm-btn-secondary nm-btn-small';
  backBtn.textContent = '← 처음으로';
  backBtn.addEventListener('click', showHome);
  backRow.appendChild(backBtn);
  body.appendChild(backRow);

  var resultWrap = document.createElement('div');
  body.appendChild(resultWrap);

  NM_EXAM.renderResult(result, resultWrap, function(opts){
    if(opts.mode === 'new'){
      var newCfg = {
        thread: opts.thread||origCfg.thread,
        level: opts.level||origCfg.level,
        count: opts.count||origCfg.count,
        timer: origCfg.timer,
        seed: NM_RNG.newCode()
      };
      showDrill(newCfg);
    } else if(opts.mode === 'wrongs'){
      showWrongsRetry(opts.wrongs, origCfg);
    }
  });
  /* 결과 화면엔 답 입력칸이 없으므로 숫자패드를 안 붙인다(예전엔 여기 붙여도 쓸 곳이 없어
     모바일에서 아무 기능 없는 키패드만 떠 있었다 — 오답 재시험은 showWrongsRetry가 따로 붙인다) */
}

function buildNumpadHTML(){
  var h = '';
  [7,8,9,4,5,6,1,2,3].forEach(function(n){ h += '<button class="dr-numpad-btn" data-n="'+n+'">'+n+'</button>'; });
  h += '<button class="dr-numpad-btn dr-np-del" data-n="del">⌫</button>';
  h += '<button class="dr-numpad-btn" data-n="0">0</button>';
  h += '<button class="dr-numpad-btn dr-np-ok" data-n="ok">확인 ✓</button>';
  return h;
}

/* ── 오답 재시험 ── */
function showWrongsRetry(wrongs, origCfg){
  body.innerHTML = '';
  var wrongProblems = wrongs.map(function(w){return w.p;});
  var answers = new Array(wrongProblems.length).fill(null);
  var current = 0;
  var startTime = Date.now();

  var backRow = document.createElement('div');
  backRow.className = 'dr-run-bar';
  var backBtn = document.createElement('button');
  backBtn.className = 'nm-btn nm-btn-secondary nm-btn-small';
  backBtn.textContent = '← 처음으로';
  backBtn.addEventListener('click', showHome);
  backRow.appendChild(backBtn);
  body.appendChild(backRow);

  var wrap = document.createElement('div');
  body.appendChild(wrap);

  function renderWrong(){
    var p = wrongProblems[current];
    var pct = Math.round((current/wrongProblems.length)*100);
    wrap.innerHTML =
      '<div class="nm-exam-run">' +
        '<div class="nm-exam-header">' +
          '<div class="nm-exam-progress"><div class="nm-progress-bar" style="width:' + pct + '%"></div></div>' +
          '<div class="nm-exam-info"><span class="nm-q-counter">오답 재시험 ' + (current+1) + ' / ' + wrongProblems.length + '</span></div>' +
        '</div>' +
        '<div class="nm-exam-question"><div class="nm-q-tex" id="nm-ex-qtex2"></div></div>' +
        '<div class="nm-exam-input">' +
          '<input id="nm-ex-ans2" type="number" placeholder="답" autocomplete="off">' +
          '<button id="nm-ex-sub2" class="nm-btn nm-btn-primary">확인 ✓</button>' +
        '</div>' +
      '</div>';

    if(window.katex){
      try{ katex.render(p.tex||'', document.getElementById('nm-ex-qtex2'), {throwOnError:false}); }catch(_){}
    } else {
      document.getElementById('nm-ex-qtex2').textContent = NM_EXAM.texToPlain ? NM_EXAM.texToPlain(p.tex||'') : (p.tex||'').replace(/\\square/g,'□').replace(/\\/g,'');
    }

    var inp = document.getElementById('nm-ex-ans2');
    if(answers[current]!==null) inp.value = answers[current];
    inp.focus();

    function submit(){
      var v = parseInt(inp.value);
      if(!isNaN(v)) answers[current] = v;
      current++;
      if(current >= wrongProblems.length){
        var score = wrongProblems.filter(function(p,i){return matchesAnswer(answers[i],p.answer);}).length;
        var elapsed = Math.round((Date.now()-startTime)/1000);
        wrap.innerHTML =
          '<div class="nm-exam-result">' +
            '<div class="nm-result-score ' + (score===wrongProblems.length?'nm-pass':'nm-fail') + '">' +
              '<div class="nm-score-num">' + score + ' / ' + wrongProblems.length + '</div>' +
              '<div class="nm-score-label">' + (score===wrongProblems.length?'🎉 완벽해요!':'💪 계속 연습해요') + '</div>' +
            '</div>' +
            '<div class="nm-result-actions" style="margin-top:16px">' +
              '<button id="dr-wr-again" class="nm-btn nm-btn-primary">🎲 새 문제</button>' +
              '<button id="dr-wr-home" class="nm-btn nm-btn-secondary">← 주제 선택</button>' +
            '</div>' +
          '</div>';
        document.getElementById('dr-wr-home').addEventListener('click', showHome);
        document.getElementById('dr-wr-again').addEventListener('click', function(){
          showDrill({thread:origCfg.thread,level:origCfg.level,count:origCfg.count,timer:origCfg.timer,seed:NM_RNG.newCode()});
        });
      } else {
        renderWrong();
      }
    }
    document.getElementById('nm-ex-sub2').addEventListener('click', submit);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  }

  body.insertAdjacentHTML('beforeend', '<div class="dr-numpad" id="dr-numpad" style="display:none">' + buildNumpadHTML() + '</div>');
  activateNumpad();
  renderWrong();
}

/* ── 시작 ── */
/* parseWorksheetCode를 NM_EXAM에서 가져오거나 직접 구현 */
if(!NM_EXAM.parseWorksheetCode){
  NM_EXAM.parseWorksheetCode = function(code){
    var m = (code||'').match(/^#?([A-Z0-9]+)-L(\d+)x(\d+)-([a-z0-9]+)$/i);
    if(!m) return null;
    return {thread:m[1],level:parseInt(m[2]),count:parseInt(m[3]),seed:m[4]};
  };
}

showHome();

})();
</script>
</body>
</html>
