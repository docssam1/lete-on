<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>수의 마법 · 승인·로그인</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="app/access.css?v=20261021-login4">
</head>
<body class="nm-access">
<main class="access-wrap" id="main">
  <header class="access-head">
    <p class="brand-mark">Numbers of Magic</p>
    <div class="access-langs" role="group" aria-label="Language">
      <button type="button" class="access-lang" data-lang="ko" aria-pressed="true">한국어</button>
      <button type="button" class="access-lang" data-lang="en" aria-pressed="false">English</button>
      <button type="button" class="access-lang" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </header>
  <h1 data-i18n="title">수의 마법 · 승인·로그인</h1>
  <p class="lead" data-i18n="lead">이메일 또는 아이디로 로그인해 주세요.</p>
  <section class="card primary-card" aria-labelledby="login-title">
    <h2 id="login-title" data-i18n="loginTitle">로그인</h2>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-user" data-i18n="user">이메일 또는 아이디</label>
        <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254">
      </div>
      <div class="field">
        <label for="login-password" data-i18n="password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128">
      </div>
      <button id="login-submit" class="btn primary" type="submit" data-i18n="login">로그인</button>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
    </form>
    <a id="guardian-link" href="index.html?enter=1&amp;auth=1" data-i18n="signup">처음이거나 비밀번호를 잊었어요</a>
  </section>

  <nav class="links" aria-label="Other">
    <a id="preview-link" href="index.html?enter=1" data-i18n="preview">가입 전 둘러보기</a>
    <a href="about.html" data-i18n="back">소개로 돌아가기</a>
  </nav>
</main>
<script src="app/review-session.js?v=20261021-review1"></script>
<script src="app/profile-auth.js?v=20261021-login4"></script>
<script src="app/access.js?v=20261021-login4"></script>
</body>
</html>
