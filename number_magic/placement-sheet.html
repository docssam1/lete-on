document.getElementById('wsSub').textContent = T('불러오는 중…', 'Loading…', '正在加载…');
document.getElementById('wsPrint').textContent = T('🖨 인쇄 · PDF로 저장', '🖨 Print · Save as PDF', '🖨 打印 · 另存为PDF');
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var L = function(o){ return o ? (o[LANG] || o.ko || '') : ''; };
var CIRC = ['①','②','③','④','⑤','⑥'];

function fail(msg){ document.getElementById('wsBody').innerHTML = '<div class="ws-err">' + esc(msg) + '</div>'; document.getElementById('wsPrint').disabled = true; window.NM_WS_READY = 'error'; }
if(!PLAN) return fail(T('진단 자료를 불러오지 못했어요.', 'Could not load the diagnostic data.', '无法加载测评数据。'));
var STAGES = PLAN.stages();
var BASE = Q.get('b') || 'f-split9';
if(!STAGES.some(function(s){ return s.id === BASE; })) BASE = STAGES[0].id;
/* 두뇌로 완료 과정(dunoro=1~25): 과정표의 연산으로 이전 6 · 과정 N 10 · 다음 4를 낸다. b보다 우선한다. */
var DUNORO = /^(?:[1-9]|1\d|2[0-5])$/.test(Q.get('dunoro') || '') ? Number(Q.get('dunoro')) : 0;
var SOMA_P = !DUNORO && /^[1-8]$/.test(Q.get('somaP') || '') ? Number(Q.get('somaP')) : 0;
var BOOK_COUNTS = {'soma-k':8,'soma-a':8,'soma-b':8,'soma-c':8,'soma-d':6,'miracle-pre-2023':5,'miracle-elem-2021':12};
var BOOK_SERIES = !DUNORO && !SOMA_P && Object.prototype.hasOwnProperty.call(BOOK_COUNTS,Q.get('bookSeries')) ? Q.get('bookSeries') : '';
var BOOK_VOLUME = BOOK_SERIES && /^(?:[1-9]|1[0-2])$/.test(Q.get('bookVolume') || '') && Number(Q.get('bookVolume')) <= BOOK_COUNTS[BOOK_SERIES] ? Number(Q.get('bookVolume')) : 0;
if(!BOOK_VOLUME) BOOK_SERIES = '';
/* URL의 교재 정보는 등록된 선택지만 사용한다. 교재 번호는 앱 진단 기준 b와 별개다. */
function validatedBook(raw, legacy){
  var books = window.NM_PLACEMENT_BOOKS;
  if(!books || !raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
  if(!legacy && raw.bookStatus !== 'completed') return null;
  var seriesId = raw.series, stepId = raw.step;
  if(typeof seriesId !== 'string' || typeof stepId !== 'string') return null;
  var series = books.series.find(function(row){ return row.id === seriesId; });
  if(!series) return null;
  var editionId = legacy ? '' : raw.editionId;
  if(editionId == null) editionId = '';
  if(typeof editionId !== 'string' || !['','2019','2013','other'].includes(editionId)) return null;
  var editions = typeof books.getEditions === 'function' ? books.getEditions(seriesId) : [];
  var edition = editionId && Array.isArray(editions) ? editions.find(function(row){ return row.id === editionId; }) : null;
  if(editionId && !edition) return null;
  var steps = books.getSteps(seriesId, editionId);
  var step = Array.isArray(steps) && steps.find(function(row){ return row.id === stepId; });
  if(!step) return null;
  var courses = books.getBookCourses(seriesId, stepId);
  if(!Array.isArray(courses)) return null;
  var course = legacy && raw.bookCourseNumber != null && /^\d+$/.test(String(raw.bookCourseNumber)) ? Number(raw.bookCourseNumber) : raw.bookCourseNumber;
  if(courses.length){
    if(!Number.isInteger(course) || !courses.includes(course)) return null;
  } else if(!legacy && course != null) return null;
  var label = L(series.label) + ' · ' + (edition ? L(edition.label) + ' · ' : '') + L(step.label);
  if(courses.length) label += ' · ' + T('교재 과정 ', 'book course ', '教材课程 ') + course;
  return label;
}
function selectedBookLabels(){
  var route = Q.get('route');
  if(route && route !== 'book') return [];
  var packed = Q.get('books');
  if(packed !== null){
    if(packed.length > 5000) return [];
    var entries;
    try{ entries = JSON.parse(packed); }catch(e){ return []; }
    if(!Array.isArray(entries) || entries.length > 8) return [];
    return entries.map(function(entry){ return validatedBook(entry, false); }).filter(Boolean);
  }
  var old = { series:Q.get('series'), step:Q.get('step'), bookCourseNumber:Q.get('bookCourseNumber') };
  var label = validatedBook(old, true);
  return label ? [label] : [];
}
function schoolScopeLabel(){
  if(Q.get('route') !== 'school') return '';
  var grade = Q.get('grade'), semester = Q.get('semester');
  var match = /^(e([1-6])|m([1-3])|h([1-3]))$/.exec(grade || '');
  if(!match || !['1','2'].includes(semester)) return '';
  var group = match[2] ? T('초등','Elementary grade ','小学') : match[3] ? T('중등','Middle school grade ','初中') : T('고등','High school grade ','高中');
  var year = match[2] || match[3] || match[4];
  return LANG === 'ko' ? group + ' ' + year + '학년 · ' + semester + '학기' :
    LANG === 'zh' ? group + year + '年级 · 第' + semester + '学期' : group + year + ' · semester ' + semester;
}
var COMPLETED_BOOKS = selectedBookLabels(), SCHOOL_SCOPE = schoolScopeLabel();
function mixedBookSources(){
  if(Q.get('route') !== 'book') return [];
  var packed=Q.get('books'), entries;
  if(!packed || packed.length>5000) return [];
  try{entries=JSON.parse(packed);}catch(e){return [];}
  if(!Array.isArray(entries)||entries.length<2||entries.length>8) return [];
  var catalog=window.NM_PLACEMENT_BOOKS, sources=[], seen=new Set();
  for(var entry of entries){
    if(!validatedBook(entry,false)) return [];
    var source=catalog.diagnosticSource(entry);
    if(!source) return [];
    var key=source.series+':'+source.course;
    if(seen.has(key)) return [];
    seen.add(key);sources.push(source);
  }
  return sources;
}
var AVAILABLE_MIX_SOURCES=mixedBookSources();
var MIX_SOURCES=Q.get('mixBooks')==='1'&&!DUNORO&&!SOMA_P&&!BOOK_SERIES?AVAILABLE_MIX_SOURCES:[];
function sourceHtml(stage){
  var bookPart = COMPLETED_BOOKS.length ? '<div class="pl-books"><b>' + esc(T('완료한 교재', 'Completed books', '已完成的教材')) + ' (' + COMPLETED_BOOKS.length + '):</b><ol class="pl-book-list">' +
    COMPLETED_BOOKS.map(function(label){ return '<li>' + esc(label) + '</li>'; }).join('') + '</ol></div>' : '';
  var schoolPart = SCHOOL_SCOPE ? '<div class="pl-school"><b>' + esc(T('선택한 교과 진도', 'Selected school progress', '所选学校进度')) + ':</b> ' + esc(SCHOOL_SCOPE) + '</div>' : '';
  var book = PLAN_NOW && PLAN_NOW.book;
  var otherBooksNote = book && book.series!=='mixed' && COMPLETED_BOOKS.length > 1 ? '<br>' + esc(T('함께 기록한 다른 교재는 이 문항의 출제 기준에 포함되지 않았어요.', 'Other recorded books did not determine these questions.', '同时记录的其他教材未用于本次出题。')) : '';
  var scope = book ? '<div class="pl-app-scope"><b>' + esc(L(book.title)) + ':</b> ' +
    esc(book.mix ? L(book.mix) : T('이전 6 · 과정 ' + book.course + ' 10 · 다음 4', 'Earlier 6 · Course ' + book.course + ' 10 · Next 4', '之前6 · 课程' + book.course + ' 10 · 之后4')) +
    '<br>' + esc(L(book.notice)) + otherBooksNote + '</div>' :
    '<div class="pl-app-scope"><b>' + esc(T('앱 진단 기준 주제', 'App diagnostic topic', '应用测评基准主题')) + ':</b> ' + esc(L(stage.label)) +
    ' · ' + esc(T('이전 6 · 현재 10 · 다음 4', 'Earlier 6 · Current 10 · Next 4', '之前6 · 当前10 · 之后4')) + '</div>';
  return '<div class="pl-source">' + bookPart + schoolPart + scope + '</div>';
}

/* ── 급 — 학습지와 같은 세 갈래(유아·저학년 / 초등 중고학년 / 중등 이상). 시작 범위의 과정 tier 로 정한다 ── */
function bandOf(stage){
  if(stage.kind === 'foundation') return 'young';
  var id = +String(stage.course).slice(1), spec = SPEC.find(function(c){ return c.id === id; });
  var tier = spec && spec.tier || '';
  if(/^level[01]$/.test(tier)) return 'young';
  if(/^level[23]$/.test(tier)) return 'mid';
  return 'senior';
}
/* 쪽 용량 — 유아 기초는 그림이 커서 5, 저학년 7, 그 위 10. 문항마다 무게가 달라(큰 그림 문항·식 문항) 쪽을 무게로 채운다 */
function layoutOf(stage){
  var b = bandOf(stage);
  if(stage.kind === 'foundation') return { band:b, cap:5, cls:'pl-found' };
  if(b === 'young') return { band:b, cap:7, cls:'pl-young' };
  return { band:b, cap:10, cls:'pl-' + b };
}
function weight(it, layout){
  var picture = it.responseMode !== 'number';
  if(layout.cls === 'pl-found') return picture ? 1 : 1.35;      /* 식 문항은 식 + 풀이 줄이 더 큼 */
  if(layout.cls === 'pl-young') return picture ? 1.45 : 1;      /* 이전 구간이 유아 기초 그림인 경우 */
  return 1;
}
function paginate(items, layout){
  var pages = [], cur = [], w = 0;
  items.forEach(function(it){
    var x = weight(it, layout);
    if(cur.length && w + x > layout.cap + 0.001){ pages.push(cur); cur = []; w = 0; }
    cur.push(it); w += x;
  });
  if(cur.length) pages.push(cur);
  return pages;
}

/* ── 그림 조각 ── */
function art(symbol){
  if(typeof symbol === 'string' && symbol.indexOf('animal:') === 0 && window.NM_ANIMALS && NM_ANIMALS.kinds.indexOf(symbol.slice(7)) >= 0)
    return '<span class="pl-art">' + NM_ANIMALS.svg(symbol.slice(7)) + '</span>';
  return esc(symbol);
}
function tokens(n, symbol){
  symbol = symbol || '●'; var h = '';
  for(var i = 0; i < n; i++) h += symbol === '●' ? '<span class="pl-dot"></span>' : '<span class="pl-obj">' + art(symbol) + '</span>';
  return '<span class="pl-tokens">' + h + '</span>';
}
function ansBoxes(n){ var h = ''; for(var i = 0; i < n; i++) h += '<span class="pl-ansbox"></span>'; return h; }
function tex(t){ return '<span class="pl-tex" data-tex="' + esc(t) + '"></span>'; }

/* ── 문항 하나 — 온라인 진단(app/placement-ui.js)과 같은 문항·같은 표상, 종이에 맞게 쓰기·○ 로 답한다 ── */
function itemBody(it){
  var d = it.renderData, m = it.responseMode, p = esc(L(it.prompt)), scene = '', ans = '';
  if(m === 'count-tap'){
    scene = '<div class="pl-row"><span class="pl-target">' + art(d.targetSymbol) + '</span><span class="pl-board">' + d.items.map(function(x){ return '<span class="pl-obj pl-tapme">' + art(x.symbol) + '</span>'; }).join('') + '</span></div>';
    p = esc(T('목표 그림과 같은 그림을 모두 ○ 해요.', 'Circle every object that matches the target picture.', '把与目标图形相同的物体全部圈出来。'));
    ans = '<div class="pl-ansline">' + esc(T('○ 한 개수', 'How many circled', '圈出的个数')) + ' ' + ansBoxes(1) + '</div>';
  } else if(m === 'make'){
    scene = '<div class="pl-row"><span class="pl-bignum">' + esc(d.target) + '</span><span class="pl-drawbox"></span></div>';
    p = esc(T('말한 수만큼 그려요.', 'Draw the requested quantity.', '画出指定的数量。'));
  } else if(m === 'match-number'){
    scene = '<div class="pl-row"><span class="pl-bignum">' + esc(d.target) + '</span><span class="pl-choices">' + d.dots.map(function(n,i){ return '<span class="pl-choice"><i>' + CIRC[i] + '</i>' + tokens(n) + '</span>'; }).join('') + '</span></div>';
    p = esc(T('숫자와 같은 개수의 점 그림 하나에 ○ 해요.', 'Circle the dot picture matching the numeral.', '圈出与数字数量相同的点图。'));
  } else if(m === 'compare'){
    scene = '<div class="pl-row pl-compare"><span class="pl-choice"><i>' + esc(T('왼쪽','Left','左')) + '</i>' + tokens(d.left, d.symbol) + '</span><span class="pl-choice"><i>' + esc(T('오른쪽','Right','右')) + '</i>' + tokens(d.right, d.symbol) + '</span></div>';
    p = esc(d.ask === 'more' ? T('더 많은 쪽에 ○ 해요.', 'Circle the side with more.', '圈出数量更多的一边。') : T('더 적은 쪽에 ○ 해요.', 'Circle the side with fewer.', '圈出数量更少的一边。'));
  } else if(m === 'sequence'){
    scene = '<div class="pl-seq">' + d.seq.map(function(n,i){ return i === d.blank ? '<span class="pl-ansbox"></span>' : '<b>' + esc(n) + '</b>'; }).join('') + '</div>';
  } else if(m === 'split'){
    scene = '<div class="pl-bond"><div class="pl-whole"><b>' + esc(d.whole) + '</b>' + tokens(d.whole, d.symbol) + '</div><div class="pl-parts"><div><b>' + esc(d.known) + '</b>' + tokens(d.known, d.symbol) + '</div><div><span class="pl-ansbox"></span></div></div></div>';
  } else if(m === 'join'){
    scene = '<div class="pl-join">' + tokens(d.left, d.symbol) + '<em>+</em>' + tokens(d.right, d.symbol) + '<em>=</em><span class="pl-ansbox"></span></div>';
  } else if(m === 'ten-bond'){
    var f = ''; for(var i = 0; i < 10; i++) f += '<span class="pl-cell">' + (i < d.filled ? '<i></i>' : '') + '</span>';
    scene = '<div class="pl-row"><div class="pl-tenframe">' + f + '</div><div class="pl-ansline">' + esc(T('빈 칸', 'Empty', '空格')) + ' ' + ansBoxes(1) + '</div></div>';
  } else if(m === 'number'){
    scene = '<div class="pl-formula">' + tex(d.tex) + '</div>' + (d.steps && d.steps.length ? '<div class="pl-steps">' + d.steps.map(function(x){ return '<div>' + tex(x.tex) + '</div>'; }).join('') + '</div>' : '');
  } else {
    scene = '<div class="pl-unsupported">?</div>';
  }
  return '<p class="pl-prompt">' + p + '</p>' + scene + ans;
}
function itemHtml(it, n){
  return '<li class="pl-q"><span class="pl-no">' + n + '</span><div class="pl-qbody">' + itemBody(it) + '</div></li>';
}

/* ── 쪽 틀 — 학습지(주간 매거진형)와 같은 띠·금 줄·명조 제목·푸터 ── */
var CODE = '';
function page(inner, pageNo, pageTotal, stage, cls){
  return '<div class="nm-w2-page pl-page ' + cls + '">' +
    '<div class="nm-mzs-band"><b>' + esc(T('넘버스 오브 매직 · 학습 시작점 확인', 'Numbers of Magic · Starting-point check', '数之魔法 · 学习起点测评')) + '</b><span>' + esc(L(stage.label)) + '</span></div>' +
    '<div class="nm-mzs-dash"></div>' + inner +
    '<div class="nm-w2-foot"><span class="nm-w2-foot-code">' + esc(CODE) + '</span><span class="pl-pg">' + pageNo + ' / ' + pageTotal + '</span></div></div>';
}
function firstHeader(stage, layout){
  var t1 = T('지금 어디서 시작하면 좋을까요?', 'Where should we start?', '从哪里开始最合适？');
  var sub = T('선택한 진단 범위와 그 앞뒤를 20문항으로 확인해요. 아직 배우지 않은 문제는 건너뛰어도 좋아요.',
              'These 20 questions check the selected diagnostic scope and its adjacent topics. Skip topics not yet learned.',
              '用20道题检查所选测评范围及相邻内容。尚未学过的题目可以跳过。');
  return '<h1 class="nm-mzs-title">' + esc(t1) + '</h1><p class="pl-sub">' + esc(sub) + '</p>' +
    sourceHtml(stage) +
    '<div class="pl-fields"><span>' + esc(T('이름','Name','姓名')) + ' <u>' + esc(NAME) + '</u></span><span>' + esc(T('날짜','Date','日期')) + ' <u></u></span><span>' + esc(T('맞힌 수','Score','得分')) + ' <u></u> / 20</span></div>';
}

/* ── 보호자·교사용 쪽 — 정답과 ○×, 영역별 칸 ── */
function ansText(it){
  var a = it.answer;
  if(it.responseMode === 'match-number') return CIRC[a] || String(a + 1);
  if(it.responseMode === 'compare') return a === 1 ? T('왼쪽','Left','左') : T('오른쪽','Right','右');
  if(it.responseMode === 'count-tap') return a + T('개 (목표 그림만 ○)', ' (circle target only)', '个（只圈目标图形）');
  if(Array.isArray(a)) return a.join(', ');
  return String(a);
}
function keyPage(plan, stage){
  var BL = { previous: T('이전','Earlier','之前'), current: T('현재','Current','现在'), next: T('다음','Next','之后') };
  var rows = plan.items.map(function(it, i){
    return '<tr class="pl-b-' + it.band + '"><td>' + (i + 1) + '</td><td>' + esc(BL[it.band]) + '</td><td>' + esc(L(it.label)) + '</td><td class="pl-ak">' + esc(ansText(it)) + '</td><td class="pl-mark">○ × ' + esc(T('모름','?','不会')) + '</td></tr>';
  }).join('');
  return '<h1 class="nm-mzs-title">' + esc(T('보호자용 정답과 채점', 'Answers and marking for parents', '家长用答案与评分')) + '</h1>' +
    '<p class="pl-sub">' + esc(T('아이에게 먼저 보여 주지 마세요. 모르는 문제는 틀린 문제와 다르게 ‘모름’에 표시해요. 결과는 20문항에 근거한 연습 제안이며, 숙달이나 입학을 판정하지 않아요.',
      'Do not show this to the child first. Mark “?” for skipped items — it is different from wrong. The result is a practice suggestion from 20 questions, not a mastery or admission judgement.',
      '请先不要给孩子看。不会的题标“不会”，与做错不同。结果只是基于20题的练习建议，不代表掌握程度或入学判断。')) + '</p>' + sourceHtml(stage) +
    '<table class="pl-key"><thead><tr><th>#</th><th>' + esc(T('구간','Band','区间')) + '</th><th>' + esc(T('영역','Topic','内容')) + '</th><th>' + esc(T('정답','Answer','答案')) + '</th><th>' + esc(T('채점','Mark','评分')) + '</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="pl-tally"><span>' + esc(T('이전','Earlier','之前')) + ' <u></u>/6</span><span>' + esc(T('현재','Current','现在')) + ' <u></u>/10</span><span>' + esc(T('다음','Next','之后')) + ' <u></u>/4</span><span>' + esc(T('모름','Skipped','跳过')) + ' <u></u></span></div>' +
    '<p class="pl-sub">' + esc(T('다음 4문항은 아직 배우지 않았을 수 있는 범위예요. 다음 구간의 오답을 지금 약점으로 보지 않아요. 화면 맨 아래 ‘채점 입력’에 ○×를 넣으면 추천 시작 회차를 바로 볼 수 있어요(인쇄에는 나오지 않아요).',
      'The last 4 questions may cover content not yet taught; do not treat misses there as current weaknesses. On screen, the “Enter marks” panel at the bottom shows the suggested starting session (it is not printed).',
      '最后4题可能是尚未学到的内容，这里做错不算当前弱点。在屏幕最下方“输入评分”处填入○×即可看到建议的起始课次（不会打印）。')) + '</p>';
}

/* ── 조립 ── */
var PLAN_NOW = null;
function build(){
  PLAN_NOW = DUNORO ? PLAN.buildBook('dunoro', DUNORO, SEED) : SOMA_P ? PLAN.buildBook('soma-p', SOMA_P, SEED) : BOOK_SERIES ? PLAN.buildBook(BOOK_SERIES, BOOK_VOLUME, SEED) : MIX_SOURCES.length ? PLAN.buildBooks(MIX_SOURCES, SEED) : PLAN.build(BASE, SEED);
  var stage = DUNORO || SOMA_P || BOOK_SERIES || MIX_SOURCES.length ? PLAN_NOW.baseline : STAGES.find(function(s){ return s.id === BASE; });
  var layout = layoutOf(stage);
  CODE = 'PL-' + (DUNORO ? 'dunoro' + DUNORO : SOMA_P ? 'somaP' + SOMA_P : BOOK_SERIES ? BOOK_SERIES + BOOK_VOLUME : MIX_SOURCES.length ? 'mixed' + MIX_SOURCES.length : BASE) + '-' + SEED + '-' + LANG;
  var old = document.querySelector('.nm-print-sheet'); if(old) old.remove();
  var sheet = document.createElement('div');
  sheet.className = 'nm-print-sheet nm-print-age-' + layout.band + ' ' + layout.cls;
  sheet.setAttribute('lang', LANG);
  var groups = paginate(PLAN_NOW.items, layout), total = groups.length + 1, at = 0, html = '';
  groups.forEach(function(slice, pi){
    var inner = (pi === 0 ? firstHeader(stage, layout) : '') +
      '<ol class="pl-list pl-n' + slice.length + '">' + slice.map(function(it, i){ return itemHtml(it, at + i + 1); }).join('') + '</ol>';
    at += slice.length; html += page(inner, pi + 1, total, stage, layout.cls);
  });
  html += page(keyPage(PLAN_NOW, stage), total, total, stage, layout.cls + ' pl-keypage');
  sheet.innerHTML = html;
  document.body.appendChild(sheet);
  sheet.querySelectorAll('[data-tex]').forEach(function(el){
    try{ window.katex.render(el.getAttribute('data-tex'), el, { throwOnError:false, displayMode:false }); }catch(e){ el.textContent = el.getAttribute('data-tex'); }
  });
  document.title = 'Numbers of Magic — ' + CODE;
  document.getElementById('wsSub').textContent = (PLAN_NOW.book ? L(PLAN_NOW.book.title) : L(stage.label)) + ' · ' + SEED;
  renderScorer(stage);
}

/* ── 화면 전용: ○×를 눌러 추천 보기(인쇄에는 안 나온다). 온라인 진단과 같은 summarize 를 쓴다 ── */
function renderScorer(stage){
  var box = document.getElementById('plScore'); if(!box){ box = document.createElement('div'); box.id = 'plScore'; document.body.appendChild(box); }
  var items = PLAN_NOW.items;
  var marks = items.map(function(){return '';});
  var key = document.querySelector('.pl-keypage'); if(key)key.id = 'plAnswerKey';
  box.innerHTML = '<h2>' + esc(T('맞으면 ○, 틀리면 X', 'Correct ○, wrong X', '答对○，答错X')) + '</h2><p>' + esc(T('모르면 아무것도 체크하지 마세요. 체크한 버튼을 다시 누르면 지워져요.', 'Leave unknown answers unmarked. Tap again to clear a mark.', '不会的题不勾选，再次点击可清除标记。')) + '</p><a href="#plAnswerKey">' + esc(T('답지 보기', 'View answer key', '查看答案')) + '</a><div class="pl-sc-grid">' + items.map(function(it, i){
    return '<div class="pl-sc-item" role="group" aria-label="' + (i+1) + '"><b>' + (i + 1) + '</b>' + ['o','x'].map(function(k){ return '<button type="button" data-mark-index="' + i + '" data-mark="' + k + '" aria-pressed="false" aria-label="' + (i+1) + ' ' + esc(k === 'o' ? T('맞음','Correct','正确') : T('틀림','Wrong','错误')) + '">' + (k === 'o' ? '○' : 'X') + '</button>'; }).join('') + '</div>';
  }).join('') + '</div><button type="button" id="plGo">' + esc(T('추천 보기', 'Show suggestion', '查看建议')) + '</button><div id="plOut"></div><div id="plPlanner"></div>';
  box.querySelector('#plGo').onclick = function(){
    if(box.querySelector('#plPlanner').__studyRoutePanel)box.querySelector('#plPlanner').__studyRoutePanel.dispose();
    box.querySelector('#plPlanner').replaceChildren();
    var out = box.querySelector('#plOut');
    out.setAttribute('role','status');out.setAttribute('aria-live','polite');
    try{
      var params = new URL(location.href).searchParams;
      var analysis=window.NM_PLACEMENT_PATHS.paperAnalysis(PLAN_NOW,marks,{goal:params.get('goal'),goalTarget:params.get('target'),cadence:params.get('cadence')});
      var r=analysis.result, rec=analysis.path.main;
      var b = r.bands;
      out.innerHTML = '<p><b>' + esc(T('이전','Earlier','之前')) + '</b> ' + b.previous.correct + '/' + b.previous.asked + ' · <b>' + esc(T('현재','Current','现在')) + '</b> ' + b.current.correct + '/' + b.current.asked + ' · <b>' + esc(T('다음','Next','之后')) + '</b> ' + b.next.correct + '/' + b.next.asked + ' · ' + esc(T('모름','Unknown','不会')) + ' ' + (b.previous.skipped + b.current.skipped + b.next.skipped) + '</p>' +
        '<p><b>' + esc(T('본진도 후보','Main-study candidate','主要进度候选')) + '</b> ' + esc((rec.course || '') + ' · ' + T('회차','session','课次') + ' ' + (rec.session || '')) + (rec.label ? ' · ' + esc(L(rec.label)) : '') + '</p><p class="pl-reason">' + esc(L(analysis.comment)) + '</p><p>'+esc(L(analysis.limitation))+'</p><h3>'+esc(T('지금은 유지 · 관찰','Maintain · observe for now','先保持并观察'))+'</h3><p>'+esc(L(analysis.workload.reasons[0]))+'</p><p>'+esc(L(analysis.workload.note))+'</p><ul>'+analysis.path.support.map(function(row){return '<li>'+esc(L(row.label))+' · X '+row.wrong+' · '+esc(T('모름','Unknown','不会'))+' '+row.skipped+'</li>';}).join('')+'</ul>';
      window.NM_STUDY_ROUTE.mount(box.querySelector('#plPlanner'),{lang:LANG,course:rec.course,session:rec.session});
    }catch(e){ out.textContent = String(e && e.message || e); }
  };
  const invalidate=function(){box.querySelector('#plOut').textContent='';if(box.querySelector('#plPlanner').__studyRoutePanel)box.querySelector('#plPlanner').__studyRoutePanel.dispose();box.querySelector('#plPlanner').replaceChildren();};
  box.querySelectorAll('[data-mark]').forEach(function(el){el.onclick=function(){var i=Number(el.dataset.markIndex),mark=el.dataset.mark;marks[i]=marks[i]===mark?'':mark;box.querySelectorAll('[data-mark-index="'+i+'"]').forEach(function(b){b.setAttribute('aria-pressed',String(marks[i]===b.dataset.mark));});invalidate();};});
}

/* ── 상단 도구(화면 전용) ── */
function toolbar(){
  var bar = document.getElementById('wsBar');
  var sel = '<select id="plStage" aria-label="start">' + STAGES.map(function(s){ return '<option value="' + s.id + '"' + (s.id === BASE ? ' selected' : '') + '>' + esc((s.kind === 'foundation' ? T('유아 · ','Early · ','幼儿 · ') : s.course + ' · ') + L(s.label)) + '</option>'; }).join('') + '</select>';
  var dn = '<select id="plDunoro" aria-label="' + esc(T('두뇌로 완료 과정', 'Completed Dunoro course', '已完成的Dunoro课程')) + '"><option value="">' + esc(T('두뇌로 과정 —', 'Dunoro course —', 'Dunoro课程 —')) + '</option>' +
    Array.from({length:25}, function(_, i){ return '<option value="' + (i + 1) + '"' + (i + 1 === DUNORO ? ' selected' : '') + '>' + esc(T('두뇌로 과정 ' + (i + 1) + ' 완료', 'Dunoro course ' + (i + 1), 'Dunoro课程' + (i + 1))) + '</option>'; }).join('') + '</select>';
  var sp = '<select id="plSomaP" aria-label="' + esc(T('소마셈 2019 P 완료 권', 'Completed 2019 SomaSem P volume', '已完成的2019 SomaSem P册')) + '"><option value="">' + esc(T('소마셈 P권 —', 'SomaSem P volume —', 'SomaSem P册 —')) + '</option>' +
    Array.from({length:8}, function(_, i){ return '<option value="' + (i + 1) + '"' + (i + 1 === SOMA_P ? ' selected' : '') + '>' + esc(T('소마셈 P' + (i + 1) + '권 완료', 'SomaSem P volume ' + (i + 1), 'SomaSem P 第' + (i + 1) + '册')) + '</option>'; }).join('') + '</select>';
  var other = '<select id="plOtherBook" aria-label="' + esc(T('다른 완료 교재 권', 'Other completed book volume', '其他已完成教材册次')) + '"><option value="">' + esc(T('다른 교재 권 —', 'Other book volume —', '其他教材册 —')) + '</option>' +
    (AVAILABLE_MIX_SOURCES.length>1?'<option value="mixed"'+(MIX_SOURCES.length?' selected':'')+'>'+esc(T('완료한 교재 함께 확인', 'Check completed books together', '合并确认已完成教材'))+'</option>':'')+
    Object.keys(BOOK_COUNTS).map(function(series){ var label=series.indexOf('soma-')===0?'소마셈 '+series.slice(-1).toUpperCase()+' · 2019':series==='miracle-pre-2023'?'기적의 계산법 예비초등 · 2023':'기적의 계산법 초등 · 2021';
      return '<optgroup label="' + esc(label) + '">' + Array.from({length:BOOK_COUNTS[series]},function(_,i){ var n=i+1; return '<option value="'+series+':'+n+'"'+(series===BOOK_SERIES&&n===BOOK_VOLUME?' selected':'')+'>'+esc(label+' '+n+'권')+'</option>'; }).join('') + '</optgroup>'; }).join('') + '</select>';
  var lg = '<select id="plLang">' + [['ko','한국어'],['en','English'],['zh','中文']].map(function(x){ return '<option value="' + x[0] + '"' + (x[0] === LANG ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>';
  var seedIn = '<input id="plSeed" value="' + esc(SEED) + '" size="10" aria-label="seed">';
  var tools = document.createElement('div'); tools.className = 'pl-tools'; tools.innerHTML = sel + dn + sp + other + lg + seedIn;
  bar.insertBefore(tools, document.getElementById('wsPrint'));
  var go = function(e){ var u = new URL(location.href); u.searchParams.set('b', document.getElementById('plStage').value);
    var changed=e&&e.target&&e.target.id, d=changed==='plStage'||changed==='plSomaP'||changed==='plOtherBook'?'':document.getElementById('plDunoro').value;
    var p=changed==='plStage'||changed==='plDunoro'||changed==='plOtherBook'?'':document.getElementById('plSomaP').value;
    var otherValue=changed==='plStage'||changed==='plDunoro'||changed==='plSomaP'?'':document.getElementById('plOtherBook').value;
    if(d) u.searchParams.set('dunoro', d); else u.searchParams.delete('dunoro');
    if(p) u.searchParams.set('somaP', p); else u.searchParams.delete('somaP');
    if(otherValue==='mixed'){u.searchParams.set('mixBooks','1');u.searchParams.delete('bookSeries');u.searchParams.delete('bookVolume');}
    else if(otherValue){ var parts=otherValue.split(':');u.searchParams.delete('mixBooks');u.searchParams.set('bookSeries',parts[0]);u.searchParams.set('bookVolume',parts[1]); }
    else {u.searchParams.delete('mixBooks');u.searchParams.delete('bookSeries');u.searchParams.delete('bookVolume');}
    u.searchParams.set('l', document.getElementById('plLang').value); u.searchParams.set('seed', document.getElementById('plSeed').value.trim() || 'sheet1'); location.href = u.toString(); };
  ['plStage','plDunoro','plSomaP','plOtherBook','plLang'].forEach(function(id){ document.getElementById(id).onchange = go; });
  document.getElementById('plSeed').onchange = go;
  document.getElementById('wsTitle').textContent = 'Numbers of Magic · ' + T('시작점 확인 시험지', 'Starting-point check sheet', '起点测评卷');
}
toolbar();
try{ build(); }catch(e){ return fail(T('시험지를 만드는 중 문제가 생겼어요: ', 'Could not create the check sheet: ', '生成测评卷时出现问题：') + (e && e.message || e)); }
document.getElementById('wsPrint').onclick = function(){ window.print(); };
function fitWidth(){ var z = Math.min(1, (document.documentElement.clientWidth - 16) / 794); document.documentElement.style.setProperty('--ws-zoom', z > 0 ? z.toFixed(3) : 1); }
fitWidth(); window.addEventListener('resize', fitWidth);
var fr = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
Promise.race([fr, new Promise(function(r){ setTimeout(r, 8000); })]).then(function(){ setTimeout(function(){ window.NM_WS_READY = true; }, 300); });
})();
</script>
</body>
