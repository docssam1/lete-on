<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>마을 프로토 · Numbers of Magic</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--blue:#16417C;--blue-deep:#0E2C57;--gold:#EAC996;--gold-deep:#C9A063;--gold-bright:#F5D98B;--ink:#1A2233;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard',sans-serif;background:#0E2C57;color:var(--ink);overflow:hidden}
#town{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#0E2C57}
.wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:100%;aspect-ratio:1024/687}
#townImg{width:100%;height:100%;object-fit:cover;display:block}
.spot{position:absolute;border:none;background:transparent;cursor:pointer}
.spot .halo{width:100%;height:100%;border-radius:16px;border:3px solid var(--gold-bright);
  box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 26px 6px rgba(234,201,150,.7);
  animation:pulse 1.8s ease-in-out infinite;background:rgba(234,201,150,.12)}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,255,255,.5),0 0 40px 12px rgba(234,201,150,.9)}}
.spot.locked .halo{border-color:#9aa2b1;box-shadow:0 0 0 3px rgba(0,0,0,.25);background:rgba(30,40,60,.35);animation:none}
.spot .tag{position:absolute;top:-32px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--blue-deep);color:#fff;font-weight:900;font-size:13px;padding:5px 12px;border-radius:99px;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.spot .tag small{font-weight:600;opacity:.8;font-size:11px;margin-left:4px}
.spot.locked .tag{background:#5a6577}
.lockico{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px}
.title{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:15px;letter-spacing:.05em;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:5;pointer-events:none}
.hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:12px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.6);z-index:5;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(14,44,87,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.modal.on{display:flex}
.mcard{background:#fff;border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.mcard h3{font-size:20px;color:var(--blue-deep);margin-bottom:4px}
.mcard p{font-size:14px;color:#4a5468;margin-bottom:18px}
.mcard .go{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.mcard .close{margin-top:10px;background:none;border:none;color:#9aa2b1;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div id="town">
  <div class="wrap">
    <img id="townImg" src="assets/map.jpg" alt="마을">
    <button class="spot" style="left:8%;top:13%;width:24%;height:28%" data-b="BASIC">
      <div class="halo"></div><div class="tag">📖 BASIC<small>수의 나라</small></div>
    </button>
    <button class="spot" style="left:36%;top:19%;width:16%;height:22%" data-b="PRIME">
      <div class="halo"></div><div class="tag">🏛️ PRIME<small>초급</small></div>
    </button>
    <button class="spot locked" style="left:29%;top:14%;width:9%;height:16%" data-b="ADVANCE">
      <div class="halo"></div><div class="lockico">🔒</div><div class="tag">🕰️ ADVANCE<small>중급</small></div>
    </button>
    <button class="spot locked" style="left:73%;top:24%;width:11%;height:14%" data-b="CHALLENGE">
      <div class="halo"></div><div class="lockico">🔒</div><div class="tag">⛰️ CHALLENGE<small>고급</small></div>
    </button>
    <button class="spot locked" style="left:53%;top:19%;width:13%;height:22%" data-b="THEATER">
      <div class="halo"></div><div class="lockico">🎬</div><div class="tag">🎬 극장<small>영상</small></div>
    </button>
  </div>
</div>
<div class="title">🪄 NUMBERS OF MAGIC — 마을 (프로토)</div>
<div class="hint">건물을 눌러보세요 · 위치는 확인 후 미세조정합니다</div>

<div class="modal" id="modal">
  <div class="mcard">
    <h3 id="mTitle"></h3>
    <p id="mDesc"></p>
    <button class="go" id="mGo">유닛 보러가기 →</button>
    <button class="close" id="mClose">닫기</button>
  </div>
</div>

<script>
const INFO={
  BASIC:{t:'📖 BASIC · 수의 나라',d:'9까지의 수 — 수 세기·크기·짝홀·논리 (5~6세)',open:false},
  PRIME:{t:'🏛️ PRIME · 초급',d:'창의수연 A~I — 더하기의 여러 전략 (만5세+)',open:true},
  ADVANCE:{t:'🕰️ ADVANCE · 중급',d:'분배법칙·곱셈 공식 (7세+) — 준비 중',open:false},
  CHALLENGE:{t:'⛰️ CHALLENGE · 고급',d:'상관관계·등차수열·경시 (초1말+) — 준비 중',open:false},
  THEATER:{t:'🎬 매직 극장',d:'유튜브 영상 학습 — 준비 중',open:false}
};
const modal=document.getElementById('modal');
document.querySelectorAll('.spot').forEach(b=>{
  b.onclick=()=>{
    const info=INFO[b.dataset.b];
    document.getElementById('mTitle').textContent=info.t;
    document.getElementById('mDesc').textContent=info.d;
    const go=document.getElementById('mGo');
    go.style.display=info.open?'block':'none';
    go.onclick=()=>{ location.href='app.html'; };
    modal.classList.add('on');
  };
});
document.getElementById('mClose').onclick=()=>modal.classList.remove('on');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on');};
</script>
</body>
</html>
