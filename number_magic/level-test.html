<!-- 표준 연산 진단지(2026-09-28, 원장 "화면에서 할 수도 있지만 인쇄해서 할 수 있도록 표준 시험지").
     문제는 app/level-test-core.js 가 고정 시드로 만든다 — 누가 언제 뽑아도 같은 형·판은 같은 문제.
     검사: scripts/check-level-test.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
:root{
  --teal:#245b60; --teal-d:#1d4a4e; --gold:#C9A063; --ink:#1f2a2e; --sub:#5c6b70; --line:#d9dfdf;
  --paper:#fff; --desk:#eef1ef; --x:#b8402f; --o:#2f7d5b;
  --sans:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;
  --serif:'Gowun Batang','Hahmlet','Noto Serif KR',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── 화면 도구(인쇄 안 됨) ── */
.bar{max-width:210mm;margin:0 auto;padding:16px 16px 4px;display:flex;flex-direction:column;gap:12px}
.bar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-top a{color:var(--teal);font-weight:700;text-decoration:none;font-size:14px}
.bar-top h1{margin:0 auto 0 0;font-family:var(--serif);font-size:22px;color:var(--teal-d)}
.langs{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px}
.langs button{border:0;background:none;padding:5px 11px;border-radius:99px;font-size:13px;color:var(--sub)}
.langs button[aria-pressed="true"]{background:var(--teal);color:#fff}
.lead{margin:0;font-size:14px;line-height:1.6;color:var(--sub);word-break:keep-all}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.form{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.form b{font-size:14px;color:var(--ink)}
.form span{font-size:12px;color:var(--sub)}
.form small{font-size:11.5px;color:var(--teal);font-weight:700;font-variant-numeric:tabular-nums}
.form[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);background:#f3f8f7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13.5px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.btn{border:0;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;background:var(--teal);color:#fff}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.hint{margin:0;font-size:13px;color:var(--sub);word-break:keep-all}
.result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.result[hidden]{display:none}
.result .k{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.04em}
.result h2{margin:0;font-family:var(--serif);font-size:24px;color:var(--teal-d);text-wrap:balance}
.result p{margin:0;font-size:14px;line-height:1.6;word-break:keep-all}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.strip i{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;padding:3px 6px;border-radius:6px;background:#eef3f2;color:var(--sub)}
.strip i.ok{background:#e3f1ea;color:var(--o)}
.strip i.no{background:#f7e4df;color:var(--x);font-weight:700}
.strip i.rec{outline:2px solid var(--gold)}

/* ── 종이 ── */
.sheet{padding:12px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
.page{width:100%;max-width:210mm;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(20,40,40,.08);
  padding:12mm 13mm 10mm;display:flex;flex-direction:column}
.band{display:flex;align-items:center;gap:10px;background:var(--teal);color:#fff;border-radius:2.5mm 2.5mm 0 0;padding:2.2mm 4.5mm;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.band b{font-size:11.5px;font-weight:700;letter-spacing:.02em}
.band span{margin-left:auto;font-size:10px;color:#d9e7e6}
.goldline{height:.9mm;background:var(--gold);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.head{display:flex;align-items:flex-end;gap:6mm;margin:5mm 0 3mm}
.head h2{margin:0;font-family:var(--serif);font-size:27px;line-height:1.2;color:var(--teal-d);font-weight:700}
.head p{margin:1mm 0 0;font-size:12px;color:var(--sub);word-break:keep-all}
.head .who{margin-left:auto;display:grid;grid-template-columns:auto 34mm;gap:2mm 2.5mm;font-size:11.5px;color:var(--sub);align-items:end}
.head .who i{border-bottom:1px solid #9aa7a8;height:5mm}
.head .who .score{grid-column:1/-1;display:flex;justify-content:flex-end;gap:2mm;align-items:baseline}
.head .who .score i{width:12mm;display:inline-block}
.how{margin:0 0 4mm;padding:2.5mm 4mm;border-left:2px solid var(--gold);background:#fbf6ea;font-size:11.5px;line-height:1.6;color:#5d4a26;
  word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm;flex:1}
.q{position:relative;display:grid;grid-template-columns:7mm 1fr;gap:2mm;align-items:start;padding:3.2mm 0 3.6mm;border-top:1px solid var(--line);min-height:21mm}
.q > div{display:flex;flex-direction:column;min-height:100%;min-width:0}
.q .no{font-size:12px;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;padding-top:1mm}
.q .ex{font-size:15px;line-height:1.5;overflow-x:auto;overflow-y:hidden}
.q .ex .katex{font-size:1.02em}
.q .ans{display:flex;align-items:center;gap:2mm;margin-top:3mm;font-size:11px;color:var(--sub)}
.q .ans .box{min-width:24mm;height:8mm;border:1.2px solid #9aa7a8;border-radius:1.5mm;display:flex;align-items:center;padding:0 2mm;font-size:14px;color:var(--ink)}
.q .ans input{width:26mm;height:8mm;border:1.2px solid var(--teal);border-radius:1.5mm;padding:0 2mm;font:inherit;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.q .mark{position:absolute;right:0;top:2.4mm;font-size:22px;font-weight:800;line-height:1}
.q.is-x .mark::after{content:'✗';color:var(--x)}
.q.is-o .mark::after{content:'○';color:var(--o)}
.q .right{display:none;font-size:11.5px;color:var(--x);font-weight:700;margin-left:2mm}
.q.is-x .right{display:inline}
body.solving .keypage{display:none}
body.grading .q{cursor:pointer}
body.grading .q:hover{background:#faf7ef}
.foot{display:flex;justify-content:space-between;margin-top:3mm;font-size:9.5px;color:#8a9496;font-family:monospace}

/* 정답·채점 안내 */
.key{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm}
.key table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.key th{font-size:10.5px;color:var(--sub);text-align:left;font-weight:700;padding:1.2mm 1.5mm;border-bottom:1.3px solid var(--teal)}
.key td{padding:1.6mm 1.5mm;border-bottom:1px solid var(--line)}
.key td.a{font-weight:800;color:var(--ink)}
.key td.c{color:var(--sub)}
.guide{margin-top:6mm;display:flex;flex-direction:column;gap:3mm;font-size:12px;line-height:1.65;word-break:keep-all}
.guide h3{margin:0;font-family:var(--serif);font-size:16px;color:var(--teal-d)}
.guide ol{margin:0;padding-left:5mm}
.cmap{display:flex;flex-wrap:wrap;gap:1.6mm}
.cmap span{border:1px solid var(--line);border-radius:1.5mm;padding:1mm 2mm;font-size:10.5px;font-variant-numeric:tabular-nums}
.cmap span b{color:var(--teal)}

@media (max-width:620px){
  .page{padding:18px 14px}
  .grid,.key{grid-template-columns:1fr}
  .head{flex-direction:column;align-items:flex-start}
  .head .who{margin-left:0}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .bar,.result{display:none!important}
  .sheet{padding:0;gap:0}
  .page{box-shadow:none;max-width:none;width:210mm;height:297mm;overflow:hidden;page-break-after:always;break-after:page}
  .q .ans input{border-color:#9aa7a8}
  .q .mark,.q .right{display:none!important}
  .grid{grid-auto-rows:1fr}
  .q .ans{margin-top:auto;justify-content:flex-end}
  body.print-test .page.keypage{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

};
const qs = new URLSearchParams(location.search);
const st = { lang: T[qs.get('lang')] ? qs.get('lang') : 'ko', form: +qs.get('f') || 2, v: qs.get('v') === '2' ? 2 : 1, mode: 'view', wrong: new Set(), answers: {} };
const $ = s => document.querySelector(s);
const L = o => o == null ? '' : typeof o === 'string' ? o : (o[st.lang] || o.ko || '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const t = () => T[st.lang];
const courseTitle = n => { const s = (window.NM_COURSE_SPEC || []).find(x => x.id === n); return s ? L(s.title) : ''; };
let test = null;

function tex(el, s){
  try{ katex.render(s, el, { throwOnError:false, strict:false, trust:true }); }catch(e){ el.textContent = s; }
}
function renderBar(){
  document.documentElement.lang = st.lang === 'zh' ? 'zh-Hans' : st.lang;
  document.title = t().title + ' · Numbers of Magic';
  document.querySelectorAll('[data-t]').forEach(el => { const v = t()[el.dataset.t]; if(typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === st.lang));
  $('#forms').innerHTML = LT.forms().map(f => {
    const n = LT.build(f.id, 1).items.length;
    return `<button class="form" data-f="${f.id}" aria-pressed="${f.id === st.form}">
      <b>${esc(t().form(f.id))} · ${esc(L(f.stage.name))}</b>
      <span>${esc(L(f.stage.band))}</span>
      <small>${esc(t().range(f.from, f.to))} · ${esc(t().qn(n))}</small></button>`;
  }).join('');
  document.querySelectorAll('#vers button').forEach(b => { b.textContent = t().v(+b.dataset.v); b.setAttribute('aria-pressed', +b.dataset.v === st.v); });
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === st.mode));
  $('#check').hidden = st.mode !== 'solve';
  $('#hint').textContent = st.mode === 'solve' ? t().hintSolve : st.mode === 'grade' ? t().hintGrade : t().hintView;
  document.body.classList.toggle('grading', st.mode === 'grade');
  document.body.classList.toggle('solving', st.mode === 'solve');
}
function testPages(){
  const f = test.form, code = `LT-${f.id}-${test.v}`;
  const per = 10, pages = [];   /* 한 장 10문제 — 풀이 칸(세로셈 등)이 들어갈 자리를 남긴다 */
  for(let i = 0; i < test.items.length; i += per) pages.push(test.items.slice(i, i + per));
  return pages.map((items, pi) => `<section class="page testpage">
    <div class="band"><b>${esc(t().band)} · ${esc(t().form(f.id))} ${esc(t().v(test.v))}</b><span>Numbers of Magic</span></div>
    <div class="goldline"></div>
    <div class="head">
      <div><h2>${esc(t().title)}</h2><p>${esc(L(f.stage.name))}${f.next ? ' → ' + esc(L(f.next.name)) : ''} · ${esc(t().range(f.from, f.to))}</p></div>
      <div class="who"><span>${esc(t().name)}</span><i></i><span>${esc(t().date)}</span><i></i>
        <div class="score"><span>${esc(t().score)}</span><i class="line" style="border-bottom:1px solid #9aa7a8;height:5mm"></i><span>/ ${test.items.length}</span></div></div>
    </div>
    ${pi === 0 ? `<p class="how">${esc(t().how)}</p>` : ''}
    <div class="grid">${items.map(it => `<div class="q" data-no="${it.no}">
      <span class="no">${it.no}</span>
      <div><div class="ex" data-tex="${esc(it.tex)}"></div>
        <div class="ans">${esc(t().answer)} ${st.mode === 'solve' ? `<input inputmode="numeric" autocomplete="off" aria-label="${it.no}" data-no="${it.no}" value="${esc(st.answers[it.no] || '')}">` : `<span class="box"></span>`}<span class="right">${it.answer}</span></div></div>
      <span class="mark" aria-hidden="true"></span></div>`).join('')}</div>
    <div class="foot"><span>${code}</span><span>${pi + 1} / ${pages.length}</span></div>
  </section>`).join('');
}
function keyPage(){
  const f = test.form, half = Math.ceil(test.items.length / 2);
  const tbl = rows => `<table><thead><tr><th>${esc(t().thNo)}</th><th>${esc(t().thAns)}</th><th>${esc(t().thCourse)}</th></tr></thead><tbody>${
    rows.map(it => `<tr><td>${it.no}</td><td class="a">${it.answer}</td><td class="c">${it.course}</td></tr>`).join('')}</tbody></table>`;
  const cmap = test.courses.map(c => `<span><b>${c}</b> · ${test.items.filter(i => i.course === c).map(i => i.no).join(', ')}</span>`).join('');
  return `<section class="page keypage">
    <div class="band"><b>${esc(t().keyTitle)} · ${esc(t().form(f.id))} ${esc(t().v(test.v))}</b><span>Numbers of Magic</span></div>
    <div class="goldline"></div>
    <div class="head"><div><h2>${esc(t().keyTitle)}</h2><p>${esc(t().keySub)}</p></div></div>
    <div class="key">${tbl(test.items.slice(0, half))}${tbl(test.items.slice(half))}</div>
    <div class="guide"><h3>${esc(t().gH)}</h3>
      <ol><li>${esc(t().g1)}</li><li>${esc(t().g2)}</li><li>${esc(t().g3)}</li><li>${esc(t().g4)}</li></ol>
      <div class="cmap">${cmap}</div></div>
    <div class="foot"><span>LT-${f.id}-${test.v} · KEY</span><span></span></div>
  </section>`;
}
function renderSheet(){
  test = LT.build(st.form, st.v);
  $('#sheet').innerHTML = testPages() + keyPage();
  document.querySelectorAll('.ex').forEach(el => tex(el, el.dataset.tex));
  paintMarks();
}
function paintMarks(){
  document.querySelectorAll('.testpage .q').forEach(q => {
    const no = +q.dataset.no, show = st.mode !== 'view' && st.checked;
    q.classList.toggle('is-x', show && st.wrong.has(no));
    q.classList.toggle('is-o', show && st.mode === 'solve' && !st.wrong.has(no));
  });
}
function showResult(){
  const r = LT.score(test, st.wrong), f = test.form, box = $('#result');
  if(!st.checked){ box.hidden = true; return; }
  const nx = LT.forms().find(x => x.id === f.id + 1);
  const slip = r.perCourse.some(p => p.miss && (r.firstFail == null || p.c < r.firstFail));
  const why = r.firstFail == null ? t().rAll(f.to, nx && nx.id) : t().rWhy(r.passedTo, r.firstFail);
  box.innerHTML = `<div class="k">${esc(t().rK)} · ${esc(t().rScore(test.items.length - st.wrong.size, test.items.length))}</div>
    <h2>${esc(t().rCourse(r.rec, courseTitle(r.rec)))}</h2>
    <p>${esc(why)}${slip ? ' ' + esc(t().rSlip) : ''}</p>
    <div class="strip">${r.perCourse.map(p => `<i class="${p.miss ? 'no' : 'ok'}${p.c === r.rec ? ' rec' : ''}">${p.c}${p.miss ? ' ✗' : ''}</i>`).join('')}</div>
    <p class="hint">${esc(t().rFree)} · <a href="index.html">${esc(t().open)}</a></p>`;
  box.hidden = false;
}
function all(){ renderBar(); renderSheet(); showResult(); }
function reset(){ st.wrong = new Set(); st.answers = {}; st.checked = st.mode === 'grade'; }

document.querySelector('.langs').onclick = e => { const b = e.target.closest('button'); if(!b) return; st.lang = b.dataset.lang; all(); };
$('#forms').onclick = e => { const b = e.target.closest('.form'); if(!b) return; st.form = +b.dataset.f; reset(); all(); };
$('#vers').onclick = e => { const b = e.target.closest('button'); if(!b) return; st.v = +b.dataset.v; reset(); all(); };
$('#modes').onclick = e => { const b = e.target.closest('button'); if(!b) return; st.mode = b.dataset.m; reset(); all(); };
$('#sheet').addEventListener('click', e => {
  if(st.mode !== 'grade') return;
  const q = e.target.closest('.testpage .q'); if(!q) return;
  const no = +q.dataset.no; st.wrong.has(no) ? st.wrong.delete(no) : st.wrong.add(no);
  paintMarks(); showResult();
});
$('#sheet').addEventListener('input', e => { if(e.target.matches('input[data-no]')) st.answers[e.target.dataset.no] = e.target.value; });
$('#check').onclick = () => {
  st.wrong = new Set(test.items.filter(it => String(st.answers[it.no] || '').replace(/[\s,]/g, '').replace('−', '-') !== String(it.answer)).map(it => it.no));
  st.checked = true; paintMarks(); showResult();
  $('#result').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
};
function printWith(cls){ document.body.classList.add(cls); window.print(); setTimeout(() => document.body.classList.remove(cls), 500); }
$('#printTest').onclick = () => printWith('print-test');
$('#printKey').onclick = () => {
  document.body.classList.add('print-key');
  document.querySelectorAll('.testpage').forEach(p => p.style.display = 'none');
  window.print();
  setTimeout(() => { document.body.classList.remove('print-key'); document.querySelectorAll('.testpage').forEach(p => p.style.display = ''); }, 500);
};
reset(); all();
})();
</script>
</body>
</html>
