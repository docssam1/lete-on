<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>책장 — Numbers of Magic</title>\n  <style>\n    body { font-family: Pretendard, sans-serif; background: white; padding: 20px; }\n    .bookshelf { max-width: 800px; margin: 0 auto; }\n    .book-card { display: inline-block; width: 180px; padding: 20px; margin: 10px; text-align: center; border-radius: 8px; background: #f0f4ff; cursor: pointer; }\n    .book-card:hover { background: #e0e8ff; }\n    .stamp-count { color: #666; font-size: 12px; }\n  </style>\n</head>\n<body>\n  <h1>📚 내 책장</h1>\n  <div class=\"bookshelf\">\n    <div class=\"book-card\" onclick=\"openBook('A')\">\n      <h3>A권</h3>\n      <p>더해서 10이 되는 수</p>\n      <div class=\"stamp-count\">도장: <span id=\"stamps-A\">0</span>/5</div>\n    </div>\n    <div class=\"book-card\" onclick=\"openBook('B')\">\n      <h3>B권</h3>\n      <p>수를 이사시켜요</p>\n      <div class=\"stamp-count\">도장: <span id=\"stamps-B\">0</span>/5</div>\n    </div>\n  </div>\n  <button onclick=\"history.back()\">돌아가기</button>\n  <script>\n    function openBook(book) { window.location.href = 'chapter.html?b=' + book; }\n  </script>\n</body>\n</html>"
