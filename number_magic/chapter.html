<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Numbers of Magic — 학습</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --blue:#16417C; --blue-deep:#0E2C57; --gold:#EAC996; --gold-deep:#C9A063;
  --ink:#1A2233; --paper:#FBFAF7; --mist:#F1F0EC; --line:#E4E2DC;
  --ok:#2E9E6B; --no:#D9534F;
  --shadow:0 30px 80px -30px rgba(22,65,124,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Pretendard',sans-serif;color:var(--ink);
  background:
    radial-gradient(1200px 600px at 20% -10%, #eef3fb 0%, transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, #fbf4e6 0%, transparent 55%),
    var(--paper);
  overflow-x:hidden;
}
.topbar{
  position:fixed;top:0;left:0;right:0;height:64px;z-index:50;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(251,250,247,.82);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.crumb{font-weight:800;color:var(--blue);font-size:15px;letter-spacing:-.02em}
.steps{display:flex;gap:7px;margin-left:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.4s}
.dot.done{background:var(--gold-deep)}
.dot.now{background:var(--blue);transform:scale(1.35);box-shadow:0 0 0 4px rgba(22,65,124,.12)}
.coin-chip{
  margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  color:#4a370f;padding:8px 14px;border-radius:999px;font-size:14px;
  box-shadow:0 8px 20px -8px rgba(201,160,99,.7)
}
.coin-chip .c{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6df,#e7b24e);display:grid;place-items:center;font-size:11px;color:#7a5a12}
.stage{
  display:none;min-height:100vh;padding:96px 22px 60px;
  max-width:760px;margin:0 auto;
  animation:rise .55s cubic-bezier(.2,.8,.2,1);
}
.stage.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--gold-deep);text-transform:uppercase;margin-bottom:10px}
.title{font-size:clamp(30px,7vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.08;color:var(--blue-deep);margin-bottom:14px}
.lede{font-size:17px;line-height:1.7;color:#4a5468;max-width:52ch}
.card{
  background:#fff;border:1px solid var(--line);border-radius:26px;
  padding:30px;box-shadow:var(--shadow);margin-top:26px;
}
.btn{
  appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:16px;padding:16px 30px;border-radius:16px;letter-spacing:-.01em;
  transition:transform .15s,box-shadow .25s,background .2s;
}
.btn:active{transform:translateY(2px) scale(.99)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 16px 34px -14px rgba(22,65,124,.65)}
.btn-primary:hover{background:var(--blue-deep)}
.btn-ghost{background:transparent;color:var(--blue);border:1.5px solid var(--line)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#4a370f;box-shadow:0 16px 34px -14px rgba(201,160,99,.7)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.numi{
  width:74px;height:74px;border-radius:24px;flex:none;
  background:linear-gradient(145deg,#2b5aa0,#16417C);
  display:grid;place-items:center;box-shadow:0 14px 30px -12px rgba(22,65,124,.7);
  position:relative
}
.numi::before{content:"";position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;top:24px;left:20px;box-shadow:24px 0 0 #fff}
.numi::after{content:"";position:absolute;width:6px;height:6px;background:var(--blue-deep);border-radius:50%;top:29px;left:25px;box-shadow:24px 0 0 var(--blue-deep)}
.numi .hat{position:absolute;top:-10px;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:30px solid var(--gold-deep)}
.speak{display:flex;gap:16px;align-items:flex-start}
.bubble{
  background:var(--mist);border-radius:20px 20px 20px 6px;padding:18px 22px;
  font-size:18px;line-height:1.6;font-weight:600;flex:1;
}
.flash{
  text-align:center;font-size:clamp(44px,13vw,84px);font-weight:900;color:var(--blue-deep);
  letter-spacing:.02em;padding:34px 0;user-select:none
}
.flash .q{color:var(--gold-deep)}
.inp{
  width:130px;font-size:34px;text-align:center;font-weight:900;color:var(--blue);
  border:none;border-bottom:3px solid var(--line);background:transparent;outline:none;
  font-family:inherit;padding:6px 0
}
.inp:focus{border-color:var(--gold-deep)}
.choices{display:grid;gap:12px;margin-top:20px}
.choice{
  text-align:left;padding:18px 22px;border-radius:16px;border:1.5px solid var(--line);
  background:#fff;font-size:19px;font-weight:700;cursor:pointer;transition:.18s;color:var(--ink)
}
.choice:hover{border-color:var(--blue);background:#f7faff}
.choice.sel{border-color:var(--blue);background:#eef4ff;box-shadow:inset 0 0 0 1px var(--blue)}
.choice.ok{border-color:var(--ok);background:#eafaf1;color:var(--ok)}
.choice.no{border-color:var(--no);background:#fdeeed;color:var(--no)}
.qtext{font-size:22px;font-weight:800;color:var(--blue-deep);margin-bottom:4px}
.qmeta{font-size:13px;color:#9aa2b1;font-weight:700;letter-spacing:.05em}
.pips{display:flex;gap:8px;margin-bottom:18px}
.pip{flex:1;height:6px;border-radius:99px;background:var(--line)}
.pip.done{background:var(--gold-deep)}
.pip.now{background:var(--blue)}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin-top:8px}
.tile{
  aspect-ratio:1;border-radius:20px;display:grid;place-items:center;
  font-size:34px;font-weight:900;color:#fff;cursor:pointer;user-select:none;
  background:linear-gradient(145deg,#3768ad,#16417C);
  box-shadow:0 12px 24px -12px rgba(22,65,124,.6);transition:.16s;position:relative
}
.tile:active{transform:scale(.94)}
.tile.picked{background:linear-gradient(145deg,var(--gold),var(--gold-deep));color:#4a370f;transform:translateY(-4px)}
.tile.gone{opacity:0;transform:scale(.3);pointer-events:none}
.lab-hint{margin-top:16px;font-size:15px;font-weight:700;color:#6a7488;text-align:center}
.coinpop{position:fixed;font-weight:900;color:var(--gold-deep);font-size:22px;pointer-events:none;z-index:80;animation:coinfly 1s ease-out forwards}
@keyframes coinfly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.4)}}
.arena-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.timer{font-size:30px;font-weight:900;color:var(--blue-deep);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--no);animation:pulse .6s infinite}
@keyframes pulse{50%{opacity:.55}}
.abadge{font-size:13px;font-weight:800;color:var(--gold-deep);letter-spacing:.1em}
.aq{font-size:clamp(30px,8vw,50px);font-weight:900;text-align:center;color:var(--blue-deep);padding:26px 0;letter-spacing:.02em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:10px auto 0}
.key{
  padding:20px 0;font-size:26px;font-weight:900;border-radius:16px;border:1.5px solid var(--line);
  background:#fff;color:var(--blue-deep);cursor:pointer;transition:.12s
}
.key:active{background:var(--mist);transform:scale(.95)}
.ascreen{font-size:40px;font-weight:900;text-align:center;color:var(--blue);min-height:54px;letter-spacing:.05em}
#s-stamp{text-align:center}
.passport{
  width:min(340px,86vw);margin:20px auto;background:#fff;border-radius:22px;
  border:1px solid var(--line);box-shadow:var(--shadow);padding:26px;position:relative;overflow:hidden
}
.pass-title{font-size:14px;font-weight:800;letter-spacing:.15em;color:var(--gold-deep);text-transform:uppercase}
.pass-book{font-size:26px;font-weight:900;color:var(--blue-deep);margin:6px 0 20px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.slot{aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;position:relative}
.slot.filled{border-style:solid;border-color:var(--gold-deep)}
#stampCanvas{position:fixed;inset:0;pointer-events:none;z-index:70}
.thestamp{
  position:absolute;width:120px;height:120px;left:50%;top:38%;transform:translate(-50%,-50%);
  border-radius:50%;border:6px solid var(--no);display:grid;place-items:center;
  color:var(--no);font-weight:900;font-size:20px;text-align:center;line-height:1.1;
  font-family:'Pretendard';opacity:0
}
.confetti{position:fixed;width:10px;height:14px;z-index:65;pointer-events:none}
.muted{font-size:14px;color:#9aa2b1;font-weight:700;margin-top:8px}
</style>
</head>
<body>

<div class="topbar">
  <span class="crumb" id="crumb">A권 · 1장</span>
  <div class="steps" id="stepDots"></div>
  <div class="coin-chip"><span class="c">◈</span><span id="coinNum">0</span></div>
</div>

<section class="stage" id="s-practice">
  <div class="eyebrow">Warm-up</div>
  <h1 class="title">짝꿍 찾기</h1>
  <p class="lede">10이 되는 짝꿍을 빠르게 떠올려 볼까? 세 개를 맞히면 다음으로 넘어가자.</p>
  <div class="card">
    <div class="flash" id="flashCard"></div>
    <div style="text-align:center">
      <input class="inp" id="flashInp" type="number" inputmode="numeric" placeholder="?">
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" id="flashChk">확인</button>
      <button class="btn btn-ghost" id="flashSkip">이미 잘해요 ↦</button>
    </div>
    <p class="muted" id="flashProg" style="text-align:center">맞힌 개수 0 / 3</p>
  </div>
</section>

<section class="stage" id="s-discover">
  <div class="eyebrow">누미의 마법노트</div>
  <h1 class="title">먼저 10을 묶어요</h1>
  <div class="card">
    <div class="speak">
      <div class="numi"><div class="hat"></div></div>
      <div class="bubble" id="numiBubble">…</div>
    </div>
    <div class="flash" id="discoverViz" style="min-height:120px"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="replayBtn">🔊 다시 듣기</button>
      <button class="btn btn-primary" id="discoverNext" disabled>이해했어요!</button>
    </div>
  </div>
</section>

<section class="stage" id="s-check">
  <div class="eyebrow">핵심체크</div>
  <h1 class="title">개념 확인</h1>
  <div class="card">
    <div class="pips" id="checkPips"></div>
    <div class="qmeta" id="checkMeta">문제 1</div>
    <div class="qtext" id="checkQ"></div>
    <div class="choices" id="checkChoices"></div>
    <p class="lab-hint" id="checkHint" style="display:none"></p>
    <div class="btn-row">
      <button class="btn btn-primary" id="checkNext" disabled>다음</button>
    </div>
  </div>
</section>

<section class="stage" id="s-lab">
  <div class="eyebrow">매직 랩</div>
  <h1 class="title">짝꿍을 터치!</h1>
  <p class="lede">더해서 <b>10</b>이 되는 두 수를 찾아 톡톡 눌러줘. 맞히면 누미 코인 +5!</p>
  <div class="card">
    <div class="lab-grid" id="labGrid"></div>
    <p class="lab-hint" id="labHint">남은 짝꿍: <span id="labLeft">5</span></p>
    <div class="btn-row"><button class="btn btn-primary" id="labNext" disabled>아레나로 →</button></div>
  </div>
</section>

<section class="stage" id="s-arena">
  <div class="arena-top">
    <span class="abadge">⚔ TIME BATTLE</span>
    <span class="timer" id="timer">05:00</span>
  </div>
  <div class="card">
    <div class="qmeta" id="arenaMeta">1 / 10</div>
    <div class="aq" id="arenaQ"></div>
    <div class="ascreen" id="arenaScreen">&nbsp;</div>
    <div class="pad" id="arenaPad"></div>
  </div>
</section>

<section class="stage" id="s-stamp">
  <div class="eyebrow" id="stampEyebrow">CHAPTER CLEAR</div>
  <h1 class="title" id="stampTitle">도장 쾅!</h1>
  <p class="lede" id="stampLede">아레나를 통과했어! 1장 도장을 여권에 찍자.</p>
  <div class="passport">
    <div class="pass-title">Numbers of Magic</div>
    <div class="pass-book">A권 여권</div>
    <div class="slots" id="passSlots"></div>
  </div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-gold" id="stampGo">도장 찍기 ◈</button>
    <button class="btn btn-ghost" id="stampHome" style="display:none">마을로 돌아가기</button>
  </div>
</section>

<canvas id="stampCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
const CH = {
  id:"A-01", book:"A", ch:1, title:"더해서 10이 되는 수를 찾아라 1",
  practice:{pairs:[[3,7],[6,4],[2,8],[5,5],[1,9],[4,6]], need:3},
  discover:{
    bubble:[
      "자, 3하고 7을 볼까? 둘을 더하면… 몇이 될까?",
      "그렇지, 10! 이렇게 10이 되는 짝을 먼저 묶는 거야.",
      "긴 덧셈도 짝꿍부터 묶으면 아주 쉬워진단다. 준비됐지?"
    ],
    viz:["3 + 7","3 + 7 = 10 ✨","10 이 마법의 열쇠 🔑"]
  },
  check:[
    {q:"3 + 6 + 7 + 4 는?",choices:[20,18,22],a:0,hint:"3과 7, 6과 4가 짝꿍이야."},
    {q:"8 + 5 + 2 + 5 는?",choices:[22,20,18],a:1,hint:"8과 2, 5와 5를 먼저 묶어봐."},
    {q:"6 + 5 + 1 + 3 + 5 는?",choices:[19,21,20],a:2,hint:"5+5, 그리고 남는 수를 더해."}
  ],
  lab:{numbers:[3,7,6,4,2,8,5,5,1,9]},
  arena:{time:300, pass:80, pool:[
    "5 + 9 + 1 + 5","8 + 5 + 2 + 5","7 + 8 + 3 + 2","4 + 3 + 6 + 7","9 + 1 + 4 + 6",
    "2 + 8 + 5 + 5","6 + 4 + 7 + 3","3 + 7 + 8 + 2","9 + 1 + 5 + 5","4 + 6 + 9 + 1"
  ]}
};
const sumOf = s => s.split("+").reduce((a,b)=>a+ +b.trim(),0);

const KEY = "nm_progress";
let store = JSON.parse(localStorage.getItem(KEY) || '{"coins":0,"A":{"stamps":0}}');
let coins = store.coins||0;
const stages = ["practice","discover","check","lab","arena","stamp"];
let si = 0, passed = true;

const $ = s => document.querySelector(s);
const coinNum = $("#coinNum");
function renderCoins(){ coinNum.textContent = coins; }
function saveCoins(n, x, y){
  coins += n;
  if(x!=null){ const p=document.createElement("div");p.className="coinpop";p.textContent=(n>0?"+":"")+n;p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),1000);}
  store.coins = coins; localStorage.setItem(KEY, JSON.stringify(store));
  renderCoins();
}
function buildDots(){
  const d=$("#stepDots"); d.innerHTML="";
  stages.slice(0,5).forEach((_,i)=>{const el=document.createElement("span");el.className="dot";el.dataset.i=i;d.appendChild(el);});
}
function refreshDots(){
  document.querySelectorAll(".dot").forEach((el,i)=>{
    el.classList.toggle("done", i<si);
    el.classList.toggle("now", i===si);
  });
}
function go(i){
  document.querySelector(".stage.active") && document.querySelector(".stage.active").classList.remove("active");
  si=i; $("#s-"+stages[i]).classList.add("active"); refreshDots();
  window.scrollTo({top:0,behavior:"smooth"});
  if(stages[i]==="discover") startDiscover();
  if(stages[i]==="check") startCheck();
  if(stages[i]==="lab") startLab();
  if(stages[i]==="arena") startArena();
  if(stages[i]==="stamp") startStamp();
}
function say(text){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=.95; u.pitch=1.15; speechSynthesis.speak(u); }catch(e){}
}

let pIdx=0, pGot=0;
function nextFlash(){
  const pr=CH.practice.pairs[pIdx%CH.practice.pairs.length];
  $("#flashCard").innerHTML = "<span>"+pr[0]+"</span> 의 짝꿍은 <span class='q'>?</span>";
  $("#flashInp").value=""; $("#flashInp").dataset.ans=pr[1]; $("#flashInp").focus();
}
$("#flashChk").onclick=()=>{
  const inp=$("#flashInp"); const ok = +inp.value === +inp.dataset.ans;
  if(ok){ pGot++; $("#flashProg").textContent="맞힌 개수 "+pGot+" / "+CH.practice.need;
    inp.style.borderColor="var(--ok)"; say("정답!");
    if(pGot>=CH.practice.need){ setTimeout(()=>go(1),500); return; }
  } else { inp.style.borderColor="var(--no)"; say("다시 해볼까?"); }
  pIdx++; setTimeout(()=>{inp.style.borderColor="";nextFlash();},600);
};
$("#flashSkip").onclick=()=>go(1);
$("#flashInp").addEventListener("keydown",e=>{if(e.key==="Enter")$("#flashChk").click();});

let dTimer=null;
function startDiscover(){ $("#discoverNext").disabled=true; runDiscover(); }
function runDiscover(){
  clearTimeout(dTimer);
  const seq=CH.discover.bubble, viz=CH.discover.viz;
  function play(i){
    if(i>=seq.length){ $("#discoverNext").disabled=false; return; }
    $("#numiBubble").textContent=seq[i];
    $("#discoverViz").textContent=viz[i]||"";
    $("#discoverViz").animate([{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"scale(1)"}],{duration:400});
    say(seq[i]);
    dTimer=setTimeout(()=>play(i+1), Math.max(2600, seq[i].length*130));
  }
  play(0);
}
$("#replayBtn").onclick=runDiscover;
$("#discoverNext").onclick=()=>go(2);

let cIdx=0, cSel=null;
function startCheck(){ cIdx=0; renderCheck(); }
function renderCheck(){
  const q=CH.check[cIdx];
  const pips=$("#checkPips"); pips.innerHTML="";
  CH.check.forEach((_,i)=>{const p=document.createElement("span");p.className="pip"+(i<cIdx?" done":i===cIdx?" now":"");pips.appendChild(p);});
  $("#checkMeta").textContent="문제 "+(cIdx+1);
  $("#checkQ").textContent=q.q;
  $("#checkHint").style.display="none"; $("#checkNext").disabled=true; cSel=null;
  const box=$("#checkChoices"); box.innerHTML="";
  q.choices.forEach((c,i)=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=c;
    b.onclick=()=>pickCheck(i,b); box.appendChild(b);
  });
}
function pickCheck(i,el){
  if(cSel!==null) return;
  cSel=i; const q=CH.check[cIdx];
  document.querySelectorAll("#checkChoices .choice").forEach((b,j)=>{
    if(j===q.a)b.classList.add("ok");
    if(j===i&&i!==q.a)b.classList.add("no");
    b.style.pointerEvents="none";
  });
  if(i===q.a){ say("맞았어!"); }
  else { $("#checkHint").textContent="💡 "+q.hint; $("#checkHint").style.display="block"; say(q.hint); }
  $("#checkNext").disabled=false;
}
$("#checkNext").onclick=()=>{ cIdx++; if(cIdx>=CH.check.length){ go(3); } else renderCheck(); };

let labPicked=null, labLeft=0;
function startLab(){
  const grid=$("#labGrid"); grid.innerHTML=""; labPicked=null;
  const nums=[...CH.lab.numbers]; labLeft=nums.length/2;
  $("#labLeft").textContent=labLeft; $("#labNext").disabled=true;
  for(let i=nums.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const t=nums[i];nums[i]=nums[j];nums[j]=t;}
  nums.forEach((n)=>{
    const t=document.createElement("div"); t.className="tile"; t.textContent=n; t.dataset.val=n;
    t.onclick=()=>pickTile(t); grid.appendChild(t);
  });
}
function pickTile(t){
  if(t.classList.contains("gone")) return;
  if(!labPicked){ labPicked=t; t.classList.add("picked"); return; }
  if(labPicked===t){ t.classList.remove("picked"); labPicked=null; return; }
  const sum = +labPicked.dataset.val + +t.dataset.val;
  if(sum===10){
    const r=t.getBoundingClientRect();
    saveCoins(5, r.left+r.width/2, r.top);
    [labPicked,t].forEach(x=>{x.classList.remove("picked");x.classList.add("gone");});
    labPicked=null; labLeft--; $("#labLeft").textContent=labLeft;
    say("좋아, 10!");
    if(labLeft<=0){ $("#labNext").disabled=false; $("#labHint").textContent="완벽해! 아레나로 가자 🎉"; }
  } else {
    t.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:260});
    labPicked.classList.remove("picked"); labPicked=null;
  }
}
$("#labNext").onclick=()=>go(4);

let aIdx=0, aScore=0, aInput="", aTimeLeft=0, aTimer=null, aPool=[];
function startArena(){
  aIdx=0; aScore=0; aInput=""; aTimeLeft=CH.arena.time;
  aPool=[...CH.arena.pool].sort(()=>Math.random()-.5);
  buildPad(); renderArena(); $("#timer").textContent=fmt(aTimeLeft);
  clearInterval(aTimer); aTimer=setInterval(tickArena,1000);
}
function fmt(t){return String(t/60|0).padStart(2,"0")+":"+String(t%60).padStart(2,"0");}
function tickArena(){
  aTimeLeft--;
  $("#timer").textContent=fmt(aTimeLeft);
  $("#timer").classList.toggle("warn", aTimeLeft<=30);
  if(aTimeLeft<=0){ clearInterval(aTimer); finishArena(); }
}
function renderArena(){
  $("#arenaMeta").textContent=(aIdx+1)+" / "+aPool.length;
  $("#arenaQ").textContent=aPool[aIdx]+" = ?";
  aInput=""; $("#arenaScreen").textContent="\u00a0";
}
function buildPad(){
  const pad=$("#arenaPad"); pad.innerHTML="";
  ["1","2","3","4","5","6","7","8","9","←","0","✓"].forEach(k=>{
    const b=document.createElement("button"); b.className="key"; b.textContent=k;
    b.onclick=()=>press(k); pad.appendChild(b);
  });
}
function press(k){
  if(k==="←"){ aInput=aInput.slice(0,-1); }
  else if(k==="✓"){ submitArena(); return; }
  else if(aInput.length<3){ aInput+=k; }
  $("#arenaScreen").textContent=aInput||"\u00a0";
}
function submitArena(){
  if(aInput==="") return;
  const correct = sumOf(aPool[aIdx]);
  if(+aInput===correct){ aScore+=10; $("#arenaScreen").style.color="var(--ok)"; }
  else { $("#arenaScreen").style.color="var(--no)"; }
  setTimeout(()=>{
    $("#arenaScreen").style.color="var(--blue)";
    aIdx++;
    if(aIdx>=aPool.length){ finishArena(); } else renderArena();
  },350);
}
function finishArena(){
  clearInterval(aTimer);
  saveCoins(Math.round(aScore/100*50));
  store.A = store.A || {stamps:0};
  passed = aScore>=CH.arena.pass;
  go(5);
}

function startStamp(){
  const filled = store.A.stamps||0;
  const slots=$("#passSlots"); slots.innerHTML="";
  for(let i=0;i<5;i++){
    const s=document.createElement("div"); s.className="slot"+(i<filled?" filled":"");
    if(i<filled){s.textContent="◈"; s.style.color="var(--gold-deep)";s.style.fontSize="26px";}
    slots.appendChild(s);
  }
  if(!passed){
    $("#stampEyebrow").textContent="ALMOST!";
    $("#stampTitle").textContent="조금만 더!";
    $("#stampLede").textContent="아레나 통과 점수에 아쉽게 못 미쳤어. 매직 랩에서 짝꿍을 더 연습하고 다시 도전하자.";
    $("#stampGo").style.display="none"; $("#stampHome").style.display="";
    $("#stampHome").textContent="다시 도전"; $("#stampHome").onclick=()=>go(3);
  }
}
$("#stampGo").onclick=()=>{
  $("#stampGo").disabled=true;
  const target = document.querySelectorAll("#passSlots .slot")[store.A.stamps||0];
  dropStamp(target, ()=>{
    store.A.stamps=(store.A.stamps||0)+1;
    localStorage.setItem(KEY, JSON.stringify(store));
    target.classList.add("filled"); target.textContent="◈";
    target.style.color="var(--gold-deep)"; target.style.fontSize="26px";
    confetti();
    $("#stampGo").style.display="none"; $("#stampHome").style.display="";
    $("#stampHome").textContent="마을로 돌아가기";
    $("#stampHome").onclick=()=>location.href="index.html";
    say(store.A.stamps>=5 ? "A권을 모두 마쳤어! 정말 대단해!" : "도장 획득! 다음 장으로 가볼까?");
  });
};
function dropStamp(slotEl, done){
  const canvas=$("#stampCanvas"); canvas.width=innerWidth; canvas.height=innerHeight;
  const stamp=document.createElement("div"); stamp.className="thestamp";
  stamp.innerHTML="CH.1<br>CLEAR"; document.body.appendChild(stamp);
  const rect=slotEl.getBoundingClientRect();
  const tx=rect.left+rect.width/2, ty=rect.top+rect.height/2;
  stamp.style.left="50%"; stamp.style.top="30%"; stamp.style.opacity="1";
  const anim = stamp.animate([
    {left:"50%",top:"28%",transform:"translate(-50%,-50%) rotate(-18deg) scale(1.25)",opacity:1,offset:0},
    {left:tx+"px",top:ty+"px",transform:"translate(-50%,-50%) rotate(-6deg) scale(.62)",opacity:1,offset:.72},
    {left:tx+"px",top:ty+"px",transform:"translate(-50%,-50%) rotate(-9deg) scale(.5)",opacity:1,offset:.82},
    {left:tx+"px",top:ty+"px",transform:"translate(-50%,-50%) rotate(-9deg) scale(.54)",opacity:.9,offset:1}
  ],{duration:750,easing:"cubic-bezier(.5,-0.2,.3,1.4)",fill:"forwards"});
  setTimeout(()=>{
    if(navigator.vibrate)navigator.vibrate([40,30,60]);
    inkSplat(tx,ty);
    slotEl.animate([{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}],{duration:280});
  },560);
  anim.onfinish=()=>{ stamp.style.transition="opacity .4s"; stamp.style.opacity="0"; setTimeout(()=>{stamp.remove();done();},380); };
}
function inkSplat(x,y){
  const c=$("#stampCanvas").getContext("2d");
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*46+8;
    c.beginPath(); c.fillStyle="rgba(199,68,64,"+(Math.random()*.25+.08)+")";
    c.arc(x+Math.cos(a)*r, y+Math.sin(a)*r, Math.random()*5+1.5, 0, 7); c.fill();
  }
  setTimeout(()=>c.clearRect(0,0,innerWidth,innerHeight),1400);
}
function confetti(){
  const cols=["#16417C","#EAC996","#C9A063","#2E9E6B","#3768ad"];
  for(let i=0;i<80;i++){
    const el=document.createElement("div"); el.className="confetti";
    el.style.left=Math.random()*100+"vw"; el.style.top="-20px";
    el.style.background=cols[i%cols.length]; el.style.transform="rotate("+(Math.random()*360)+"deg)";
    document.body.appendChild(el);
    el.animate([
      {transform:"translateY(0) rotate(0)",opacity:1},
      {transform:"translateY("+(innerHeight+40)+"px) rotate("+(Math.random()*720)+"deg)",opacity:.9}
    ],{duration:1800+Math.random()*1200,easing:"cubic-bezier(.3,.6,.4,1)"}).onfinish=()=>el.remove();
  }
}

buildDots(); renderCoins(); nextFlash(); go(0);
</script>
