<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="A six-point star with twelve empty spots, four spots on each of six straight lines">
  <rect width="640" height="280" rx="18" fill="#F7F5F0"/>
  <!-- Exact 2x scale of the comic topology. Blank spots are not a proposed solution. -->
  <g transform="translate(120,0) scale(2)" data-star="twelve-spots">
    <g fill="none" stroke="#16417C" stroke-width="1.5" stroke-linecap="round">
      <line data-star-line="0" x1="40" y1="41" x2="160" y2="41"/>
      <line data-star-line="1" x1="40" y1="99" x2="160" y2="99"/>
      <line data-star-line="2" x1="100" y1="12" x2="40" y2="99"/>
      <line data-star-line="3" x1="100" y1="12" x2="160" y2="99"/>
      <line data-star-line="4" x1="40" y1="41" x2="100" y2="128"/>
      <line data-star-line="5" x1="160" y1="41" x2="100" y2="128"/>
    </g>
    <g fill="#fffdf6" stroke="#C9A063" stroke-width="1.25">
      <circle data-star-node="0" cx="100" cy="12" r="7"/>
      <circle data-star-node="1" cx="40" cy="41" r="7"/>
      <circle data-star-node="2" cx="160" cy="41" r="7"/>
      <circle data-star-node="3" cx="40" cy="99" r="7"/>
      <circle data-star-node="4" cx="160" cy="99" r="7"/>
      <circle data-star-node="5" cx="100" cy="128" r="7"/>
      <circle data-star-node="6" cx="80" cy="41" r="7"/>
      <circle data-star-node="7" cx="120" cy="41" r="7"/>
      <circle data-star-node="8" cx="60" cy="70" r="7"/>
      <circle data-star-node="9" cx="140" cy="70" r="7"/>
      <circle data-star-node="10" cx="80" cy="99" r="7"/>
      <circle data-star-node="11" cx="120" cy="99" r="7"/>
    </g>
  </g>
  <g font-family="sans-serif" font-weight="700" fill="#16417C" text-anchor="middle">
    <text x="77" y="149" font-size="22">1…12</text>
    <text x="550" y="149" font-size="25">= 26</text>
  </g>
</svg>
