<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>수의 마법 · 종이 교구</title>
<style>
@font-face{font-family:Tools;src:url('assets/fonts/pretendard-var.woff2') format('woff2');font-weight:100 700;font-display:swap}
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#f1ece1;color:#191511;font-family:Tools,Pretendard,sans-serif}header{flex:none;background:#fdfbf5;border-bottom:1px solid #c9bda2;padding:12px 20px}h1{font-size:21px;font-weight:700;letter-spacing:-.03em;margin:0}header>div{display:flex;align-items:center;justify-content:space-between;gap:12px}.controls{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,a{font:inherit;color:inherit;min-height:44px}button,select{border:1px solid #c9bda2;border-radius:5px;padding:8px 12px;background:#fff;cursor:pointer}button:disabled{opacity:.4;cursor:default}#next{background:#2f6b4a;color:white;border-color:#2f6b4a}#pick{flex:1;max-width:520px;min-width:0;font-size:16px}#progress{font-variant-numeric:tabular-nums;color:#5b513e;white-space:nowrap;font-size:14px}a{display:inline-flex;align-items:center;padding:8px;color:#2f6b4a;text-underline-offset:4px}#print{margin-left:auto}.mobile-label{display:none}iframe{border:0;flex:1;min-height:0;width:min(100%,1060px);margin:auto;background:#f1ece1}label span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}:focus-visible{outline:3px solid #a87c22;outline-offset:3px}
@media(max-width:600px){header{padding:8px 12px}h1{font-size:18px}.controls{gap:6px}#pick{order:-1;flex-basis:calc(100% - 60px);max-width:none}#progress{order:-1}button{font-size:13px;padding-inline:8px}#open,#all{font-size:13px;padding-inline:4px}.desktop-label{display:none}.mobile-label{display:inline}#print{margin-left:auto}#lang{max-width:92px}}
</style></head><body><header><div><h1 id="heading">종이 교구를 하나씩 살펴봐요</h1><label><span id="language-label">언어</span><select id="lang" aria-labelledby="language-label"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option></select></label></div><nav class="controls" aria-label="교구 선택"><select id="pick" aria-label="교구"></select><span id="progress" role="status" aria-live="polite"></span><button id="prev" type="button">이전 교구</button><button id="next" type="button">다음 교구</button><a id="all" target="_blank" rel="noopener">전체 교구</a><a id="open" target="_blank" rel="noopener">크게 보기</a><button id="print" type="button">인쇄 · PDF 저장</button></nav></header><iframe id="sheet" title="선택한 교구"></iframe>
<script src="data/paper-tools.js?v=20261110-tools15"></script><script>
(function(){'use strict';
 const tools=window.NM_PAPER_TOOLS,q=new URLSearchParams(location.search),pick=document.getElementById('pick'),frame=document.getElementById('sheet'),language=document.getElementById('lang');
 let lang=['ko','en','zh'].includes(q.get('l'))?q.get('l'):'ko',index=Math.max(0,tools.findIndex(t=>t.key===q.get('tool')));
 const copy={ko:['종이 교구를 하나씩 살펴봐요','이전 교구','다음 교구','크게 보기','인쇄 · PDF 저장','교구','언어'],en:['Explore the paper tools','Previous tool','Next tool','Open larger','Print · Save PDF','Tool','Language'],zh:['逐个查看纸教具','上一个教具','下一个教具','放大查看','打印 · 保存PDF','教具','语言']};
 function render(){const c=copy[lang],tool=tools[index];document.documentElement.lang=lang;language.value=lang;document.getElementById('heading').textContent=c[0];document.getElementById('prev').textContent=c[1];document.getElementById('next').textContent=c[2];document.getElementById('open').textContent=c[3];const print=document.getElementById('print');print.setAttribute('aria-label',c[4]);print.replaceChildren();for(const [cls,text]of [['desktop-label',c[4]],['mobile-label',lang==='ko'?'인쇄':lang==='en'?'Print':'打印']]){const span=document.createElement('span');span.className=cls;span.textContent=text;print.appendChild(span);}pick.setAttribute('aria-label',c[5]);document.querySelector('nav').setAttribute('aria-label',c[5]);document.getElementById('language-label').textContent=c[6];pick.replaceChildren(...tools.map((t,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=(i+1)+'. '+t.name[lang];return o}));pick.value=String(index);document.getElementById('progress').textContent=(index+1)+' / '+tools.length;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===tools.length-1;const url=new URL('ws.html',location.href);url.search=new URLSearchParams({tool:tool.key,l:lang,auto:'0'}).toString();const embed=new URL(url);embed.searchParams.set('embed','1');frame.src=embed.href;frame.title=tool.name[lang];document.getElementById('open').href=url.href;const all=new URL('ws.html',location.href);all.search=new URLSearchParams({tool:'all',l:lang,auto:'0'});document.getElementById('all').href=all.href;document.getElementById('all').textContent=lang==='ko'?'전체 교구':lang==='en'?'All tools':'全部教具';history.replaceState(null,'','?'+new URLSearchParams({tool:tool.key,l:lang}));}
 pick.addEventListener('change',()=>{index=Number(pick.value);render()});document.getElementById('prev').addEventListener('click',()=>{if(index){index--;render()}});document.getElementById('next').addEventListener('click',()=>{if(index<tools.length-1){index++;render()}});language.addEventListener('change',()=>{lang=language.value;render()});document.getElementById('print').addEventListener('click',()=>{const w=frame.contentWindow;if(w&&w.NM_WS_READY===true)w.print()});render();
})();
</script></body></html>
