<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 쇼릴용 무대: ws.html 의 실제 인쇄 쪽(capture.js 가 찍어 둔 PNG)을 책상 위에 펼쳐 두고, render(t) 로 카메라를 움직인다. -->
<title>showreel sheets</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e1d2}
  #vp{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(255,252,244,.0),rgba(90,60,30,.18) 100%),
      repeating-linear-gradient(90deg,rgba(150,110,60,.05) 0 2px,transparent 2px 9px),
      linear-gradient(180deg,#efe6d5,#e4d8c2)}
  #desk{position:absolute;left:0;top:0;width:3100px;height:1400px;transform-origin:0 0}
  .sh{position:absolute;width:520px;background:#fff;border-radius:3px;
    box-shadow:0 2px 3px rgba(60,40,20,.14),0 18px 40px rgba(60,40,20,.20),0 0 0 1px rgba(60,40,20,.06)}
  .sh img{display:block;width:100%;height:auto;border-radius:3px}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 85% at 50% 50%,rgba(0,0,0,0) 60%,rgba(60,40,15,.16) 100%)}
</style></head><body>
<div id="vp"><div id="desk"></div></div><div id="vig"></div>
<script>
const SRC = new URLSearchParams(location.search).get('src') || '/__sheets/';
const SHEETS = [
  { k:'cover',    x:60,   y:210, r:-4,  z:1 },
  { k:'concept',  x:660,  y:110, r:1.5, z:2 },
  { k:'training', x:1260, y:170, r:-1.2,z:4 },
  { k:'story',    x:1860, y:100, r:2,   z:3 },
  { k:'key',      x:2460, y:200, r:-3,  z:2 },
];
const desk = document.getElementById('desk');
const imgs = SHEETS.map(s => { const d = document.createElement('div'); d.className = 'sh';
  d.style.cssText += `left:${s.x}px;top:${s.y}px;transform:rotate(${s.r}deg);z-index:${s.z}`;
  const i = new Image(); i.src = SRC + s.k + '.png'; d.appendChild(i); desk.appendChild(d); return i; });
/* 카메라 키: [시각, 중심x, 중심y, 배율] — 사이는 부드럽게 */
const KEYS = [
  [0.0,  1520, 345, 2.0],
  [3.8,  1520, 560, 1.9],
  [5.8,   920, 370, 1.45],
  [8.0,   920, 450, 1.42],
  [9.9,  2120, 370, 1.45],
  [11.6, 2120, 450, 1.42],
  [14.6, 1560, 570, 0.43],
  [15.6, 1560, 570, 0.425],
];
const ease = t => { t = Math.max(0, Math.min(1, t)); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
window.render = t => {
  let i = 0; while(i < KEYS.length - 2 && KEYS[i + 1][0] <= t) i++;
  const a = KEYS[i], b = KEYS[i + 1], u = ease((t - a[0]) / (b[0] - a[0]));
  const cx = a[1] + (b[1] - a[1]) * u, cy = a[2] + (b[2] - a[2]) * u;
  const s = Math.exp(Math.log(a[3]) + (Math.log(b[3]) - Math.log(a[3])) * u);
  desk.style.transform = `translate(${innerWidth / 2}px,${innerHeight / 2}px) scale(${s}) translate(${-cx}px,${-cy}px)`;
};
Promise.all(imgs.map(i => i.decode().catch(() => {}))).then(() => { window.render(0); window.__ready = true; });
</script></body></html>
