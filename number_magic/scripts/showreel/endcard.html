<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 쇼릴 끝 카드 — 타이틀 로고와 같은 글꼴·색(Fraunces 워드마크 + 먹빛 남색 광택, 금실 장식, Gowun Batang). render(t) 로 한 장씩. -->
<title>showreel end card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@500;600&display=swap">
<style>
  :root{--ink:#26304a;--ink2:#5a6380;--gold:#c9a44c}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:linear-gradient(135deg,#ffffff 0%,#f6f2ff 35%,#eefaf6 70%,#fffaf0 100%);color:var(--ink)}
  .orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55}
  .o1{width:520px;height:520px;left:-120px;top:-160px;background:#d9cffd}
  .o2{width:560px;height:560px;right:-160px;top:120px;background:#c8f0e6}
  .o3{width:600px;height:420px;left:320px;bottom:-260px;background:#fde9bf}
  #dust{position:fixed;inset:0}
  #dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(201,164,76,.8)}
  .card{position:fixed;left:0;right:0;top:92px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .word{font-family:"Fraunces",Georgia,serif;font-size:112px;line-height:1.02;font-weight:400;letter-spacing:-.015em;font-optical-sizing:auto;font-variation-settings:"SOFT" 0,"WONK" 0;
    background:linear-gradient(100deg,#26304a 0%,#26304a 36%,#6b5fc4 44%,#3d9a93 50%,#4f7fc9 55%,#26304a 63%,#26304a 100%);background-size:260% 100%;background-position:100% 0;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding:0 .1em}
  .word .of{font-style:italic;font-size:.8em;margin:0 .1em 0 .12em}
  .orn{display:flex;align-items:center;justify-content:center;gap:14px;width:560px;margin:14px 0 6px;color:var(--gold)}
  .orn i{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,164,76,0),rgba(201,164,76,.9))}
  .orn i:last-child{background:linear-gradient(90deg,rgba(201,164,76,.9),rgba(201,164,76,0))}
  .orn b{width:20px;height:20px}
  .sub{font-family:"Gowun Batang",serif;font-size:26px;letter-spacing:.42em;margin-right:-.42em;color:var(--ink2)}
  .tag{margin-top:34px;font-family:"Hahmlet","Gowun Batang",serif;font-weight:600;font-size:30px;letter-spacing:-.01em}
  .tag-en{margin-top:8px;font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:19px;color:var(--ink2)}
  .row{position:fixed;left:0;right:0;bottom:104px;display:flex;justify-content:center;align-items:flex-end;gap:30px;height:156px}
  .row img{height:150px;width:auto;transform-origin:50% 100%;filter:drop-shadow(0 10px 12px rgba(38,48,74,.18))}
  .row img.sm{height:124px}
  .foot{position:fixed;left:0;right:0;bottom:34px;display:flex;justify-content:center;align-items:center;gap:16px;color:var(--ink2);font:500 14px/1 "Fraunces",Georgia,serif;letter-spacing:.24em}
  .foot img{height:44px}
  .foot span{display:inline-block;width:1px;height:26px;background:rgba(201,164,76,.7)}
</style></head><body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div id="dust"></div>
<div class="card">
  <div class="word" id="word" lang="en">Numbers<span class="of">of</span>Magic</div>
  <div class="orn" id="orn"><i></i><b><svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 2.5c.6 5.2 4.3 8.9 9.5 9.5-5.2.6-8.9 4.3-9.5 9.5-.6-5.2-4.3-8.9-9.5-9.5 5.2-.6 8.9-4.3 9.5-9.5z" fill="currentColor"/></svg></b><i></i></div>
  <div class="sub" id="sub">수의 마법</div>
  <div class="tag" id="tag">숫자가 마법이 되는 곳, 유아부터 미적분까지</div>
  <div class="tag-en" id="tagen" lang="en">Where numbers become magic, from preschool to calculus</div>
</div>
<div class="row" id="row">
  <img src="../../assets/characters/poco-3.png" class="sm"><img src="../../assets/characters/sym-plus.png" class="sm"><img src="../../assets/characters/kid-boy.png"><img src="../../assets/characters/numi-wizard.png"><img src="../../assets/characters/sym-pi.png" class="sm"><img src="../../assets/characters/momo-8.png" class="sm">
</div>
<div class="foot" id="foot"><img src="../../assets/gfield-logo.svg" alt="GFIELD"></div>
<script>
const $ = id => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = cl(t); return 1 - Math.pow(1 - t, 3); };
const back = t => { t = cl(t); const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
/* 금가루 — 고정 씨앗 */
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const dust = Array.from({ length:46 }, () => { const i = document.createElement('i'); $('dust').appendChild(i);
  return { el:i, x:rnd() * 1280, y:rnd() * 720, v:6 + rnd() * 14, ph:rnd() * 6.28, sz:.5 + rnd() * .9 }; });
const rise = (el, t0, d = .9, dy = 18) => { const u = ease((T - t0) / d); el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * dy}px)`; };
let T = 0;
window.render = t => {
  T = t;
  dust.forEach(d => { const y = (d.y - d.v * t + 720) % 720; d.el.style.transform = `translate(${d.x + Math.sin(t * .8 + d.ph) * 8}px,${y}px) scale(${d.sz})`;
    d.el.style.opacity = cl(t / 1.2) * (.35 + .45 * (.5 + .5 * Math.sin(t * 2.2 + d.ph))); });
  rise($('word'), .3, 1.1, 26);
  $('word').style.backgroundPosition = `${100 - 100 * ease((t - 1.3) / 2.2)}% 0`;
  const o = ease((t - 1.0) / 1.0); $('orn').style.opacity = o; $('orn').style.width = (140 + 420 * o) + 'px';
  rise($('sub'), 1.35, .9, 10);
  rise($('tag'), 2.0, .9, 14); rise($('tagen'), 2.25, .9, 12);
  [...$('row').children].forEach((im, i) => { const t0 = 2.9 + [2, 1, 0, 0.5, 1.5, 2.5][i] * .16; const u = back((t - t0) / .7);
    im.style.opacity = cl((t - t0) / .25); im.style.transform = `translateY(${(1 - u) * 60 + Math.sin(t * 2.1 + i) * 3 * cl(t - t0 - .7)}px) scale(${.6 + .4 * u})`; });
  rise($('foot'), 4.3, 1.0, 8);
};
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => { window.render(0); window.__ready = true; });
</script></body></html>
