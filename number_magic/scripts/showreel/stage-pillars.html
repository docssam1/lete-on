<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 쇼릴 S3(n03) — "독쌤의 철학은 한쪽으로 치우치지 않는 것": 언어 · 사고력 · 연산 세 구슬이 저울대에 내려앉아 균형을 잡고,
     "수를 정복하고, 수학을 정복한다"가 아래에 자리 잡는다. ?d=<내레이션 길이 초> 에 맞춰 박자를 잡는다. render(t) 로 한 장씩. -->
<title>showreel pillars</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,300..500&family=Hahmlet:wght@500;600;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
  :root{--ink:#26304a;--ink2:#5a6380;--gold:#c9a44c}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:linear-gradient(135deg,#ffffff 0%,#f6f2ff 35%,#eefaf6 70%,#fffaf0 100%);color:var(--ink);font-family:'Hahmlet','Gowun Batang',serif}
  .orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5}
  .o1{width:520px;height:520px;left:-140px;top:-180px;background:#d9cffd}.o2{width:560px;height:560px;right:-160px;bottom:-200px;background:#c8f0e6}
  #dust{position:fixed;inset:0}#dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(201,164,76,.8)}
  .eye{position:absolute;left:0;right:0;top:84px;text-align:center;font:500 15px/1 'Fraunces',Georgia,serif;letter-spacing:.32em;color:#8a6a1f;opacity:0}
  .head{position:absolute;left:0;right:0;top:112px;text-align:center;font-weight:600;font-size:40px;letter-spacing:-.01em;opacity:0}
  .head b{font-weight:700;color:#8a6a1f}
  .stage{position:absolute;left:50%;top:400px;width:760px;margin-left:-380px;height:260px}
  .beam{position:absolute;left:30px;top:150px;width:700px;height:10px;border-radius:6px;background:linear-gradient(90deg,#d9c27e,#f3e2b1,#d9c27e);box-shadow:0 8px 24px rgba(120,90,20,.25);transform-origin:50% 50%}
  .ful{position:absolute;left:50%;top:158px;width:0;height:0;margin-left:-34px;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:64px solid #c9a44c;filter:drop-shadow(0 10px 16px rgba(120,90,20,.25))}
  .ful::after{content:"";position:absolute;left:-30px;top:6px;width:60px;height:54px;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:54px solid #f0ddb0;width:0;height:0}
  .ball{position:absolute;top:0;width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(246,242,255,.94) 40%,rgba(238,250,246,.94) 75%,rgba(255,250,238,.96));
    box-shadow:0 22px 50px rgba(30,36,64,.2),0 0 0 2px rgba(201,164,76,.7),0 2px 0 #fff inset;opacity:0;transform-origin:50% 100%}
  .ball b{font-size:31px;font-weight:700}
  .ball small{font:italic 400 14px 'Fraunces',Georgia,serif;color:var(--ink2)}
  .ball.on{box-shadow:0 22px 50px rgba(30,36,64,.2),0 0 0 2.5px rgba(201,164,76,.95),0 0 34px rgba(245,217,139,.9),0 2px 0 #fff inset}
  .tag{position:absolute;left:0;right:0;top:640px;text-align:center;font-weight:600;font-size:34px;opacity:0}
  .tag span{color:#8a6a1f}
  .tag-en{position:absolute;left:0;right:0;top:686px;text-align:center;font:italic 400 18px 'Fraunces',Georgia,serif;color:var(--ink2);opacity:0}
</style></head><body>
<div class="orb o1"></div><div class="orb o2"></div><div id="dust"></div>
<div class="eye" id="eye">DOCSSAM · PHILOSOPHY</div>
<div class="head" id="head">독쌤의 철학은 <b>한쪽으로 치우치지 않는 것</b></div>
<div class="stage">
  <div class="ball" id="b0" style="left:50px"><b>언어</b><small>Language</small></div>
  <div class="ball" id="b2" style="left:560px"><b>연산</b><small>Arithmetic</small></div>
  <div class="ball" id="b1" style="left:305px"><b>사고력</b><small>Thinking</small></div>
  <div class="beam" id="beam"></div><div class="ful"></div>
</div>
<div class="tag" id="tag">수를 정복하고, <span>수학을 정복한다</span></div>
<div class="tag-en" id="tagen">Master numbers, and you master mathematics</div>
<script>
const $ = id => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => { t = cl(t); return 1 - Math.pow(1 - t, 3); };
const back = t => { t = cl(t); const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const bounce = t => { t = cl(t); const n1 = 7.5625, d1 = 2.75; if(t < 1 / d1) return n1 * t * t; if(t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + .75; if(t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + .9375; return n1 * (t -= 2.625 / d1) * t + .984375; };
const D = +(new URLSearchParams(location.search).get('d') || 10);
const at = f => 0.5 + f * D;
let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const dust = Array.from({ length:42 }, () => { const i = document.createElement('i'); $('dust').appendChild(i); return { el:i, x:rnd() * 1280, y:rnd() * 720, v:5 + rnd() * 12, ph:rnd() * 6.28, sz:.5 + rnd() * .9 }; });
const rise = (el, t, t0, d = .8, dy = 16) => { const u = ease((t - t0) / d); el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * dy}px)`; };
/* 내레이션: 한쪽으로 치우치지 않는 것(0–.4) · 언어와 사고력과 연산을 골고루(.4–.7) · 수를 정복하고 수학을 정복(.7–1) */
const DROP = [['b0', at(.42), -1], ['b1', at(.56), 0], ['b2', at(.49), 1]];
window.render = t => {
  dust.forEach(d => { const y = (d.y - d.v * t + 720) % 720; d.el.style.transform = `translate(${d.x + Math.sin(t * .8 + d.ph) * 8}px,${y}px) scale(${d.sz})`; d.el.style.opacity = cl(t / 1.2) * (.35 + .45 * (.5 + .5 * Math.sin(t * 2.2 + d.ph))); });
  rise($('eye'), t, at(.02), .7, 8); rise($('head'), t, at(.06), .9, 18);
  /* 저울대: 처음엔 한쪽으로 기울어 있다(치우침) → 구슬이 하나씩 앉으며 → 셋이 모이면 수평 */
  let tilt = -7 * cl(1 - (t - at(.36)) / 0.6);
  let load = 0;
  DROP.forEach(([id, t0, side]) => { const u = (t - t0) / 0.75; const e = $(id);
    if(u <= 0){ e.style.opacity = 0; return; }
    const b = bounce(cl(u)); e.style.opacity = cl(u * 4); e.style.transform = `translateY(${-260 * (1 - b)}px) scale(${.85 + .15 * cl(u * 2)})`;
    if(u >= 1) load += side; e.classList.toggle('on', t > at(.66)); });
  if(t > at(.42)){ const settle = cl((t - at(.42)) / 0.4); tilt = tilt * (1 - settle) + load * 5 * settle; }
  if(t > at(.56)){ const s2 = ease((t - at(.56)) / 0.9); const wob = Math.sin((t - at(.56)) * 9) * 3 * (1 - s2); tilt = tilt * (1 - s2) + wob; }
  $('beam').style.transform = `rotate(${tilt}deg)`;
  const bx = [-300, 0, 300];
  ['b0', 'b1', 'b2'].forEach((id, i) => { const e = $(id); if(e.style.opacity === '0') return; const rad = tilt * Math.PI / 180; const dy = Math.sin(rad) * bx[i];
    e.style.marginTop = (dy - 150 + 4) + 'px'; e.style.marginLeft = (bx[i] * (Math.cos(rad) - 1)) + 'px'; });
  rise($('tag'), t, at(.74), .9, 18); rise($('tagen'), t, at(.82), .9, 12);
};
document.fonts.ready.then(() => { window.render(0); window.__ready = true; });
</script></body></html>
