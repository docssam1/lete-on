<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 쇼릴용 무대: 창의 연산 Training Course 쪽(ws.html 에서 capture.js 가 찍은 training.png)에
     풀이 칸(□)을 손글씨로 한 칸씩 채운다. 칸 위치는 training-boxes.json(쪽 기준 비율), 값은 정답지(1/3, 1/6)와 맞춘 풀이 과정. -->
<title>showreel creative</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e1d2}
  #vp{position:fixed;inset:0;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(150,110,60,.05) 0 2px,transparent 2px 9px),linear-gradient(180deg,#efe6d5,#e4d8c2)}
  #pg{position:absolute;left:0;top:0;width:900px;transform-origin:0 0;background:#fff;border-radius:3px;
    box-shadow:0 2px 3px rgba(60,40,20,.14),0 24px 50px rgba(60,40,20,.22)}
  #pg img{display:block;width:100%}
  .ink{position:absolute;display:flex;align-items:center;justify-content:center;padding-left:14%;box-sizing:border-box;font-family:'Nanum Pen Script',cursive;color:#2c4f9e;
    font-size:40px;line-height:1;white-space:nowrap;clip-path:inset(0 100% 0 0)}
  .ok{position:absolute;font:italic 500 58px/1 'Fraunces',serif;color:#c9a44c;opacity:0;text-shadow:0 0 14px rgba(245,217,139,.9)}
  #pen{position:absolute;left:0;top:0;width:46px;height:46px;opacity:0;filter:drop-shadow(0 6px 6px rgba(20,30,60,.3));transform-origin:4px 42px}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 85% at 50% 50%,rgba(0,0,0,0) 60%,rgba(60,40,15,.16) 100%)}
</style></head><body>
<div id="vp"><div id="pg"><img id="im"><svg id="pen" viewBox="0 0 48 48"><path d="M6 42 L10 30 L34 6 L42 14 L18 38 Z" fill="#f2c14e" stroke="#26304a" stroke-width="2" stroke-linejoin="round"/><path d="M6 42 L10 30 L18 38 Z" fill="#f4e2c0" stroke="#26304a" stroke-width="2" stroke-linejoin="round"/><path d="M6 42 L8 36 L12 40 Z" fill="#26304a"/><path d="M34 6 L42 14 L38 18 L30 10 Z" fill="#e58a9a" stroke="#26304a" stroke-width="2" stroke-linejoin="round"/></svg></div></div>
<div id="vig"></div>
<script>
const SRC = new URLSearchParams(location.search).get('src') || '/__sheets/';
const PW = 900;
/* 풀이: (1) 1/2×2/3 = (1×2)/(2×3) = 1/3   (2) 1/3×1/2 = (1×1)/(3×2) = 1/6 — 칸 순서는 문서 순서(①②, ①②, …) */
const VAL = ['1×2', '2×3', '1', '3', '1×1', '3×2', '1', '6'];
const WHEN = [2.5, 3.0, 3.8, 4.25, 6.6, 7.05, 7.8, 8.25];
const OK = [[4.8, 3], [8.9, 7]];   /* ✓ 를 찍을 시각, 그 옆 칸 */
const ease = t => { t = Math.max(0, Math.min(1, t)); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const pg = document.getElementById('pg'), im = document.getElementById('im'), pen = document.getElementById('pen');
let inks = [], oks = [], PH = 0, boxes = [];
function camAt(t){
  /* 문제 (1) 가까이 → 천천히 → (2) 로 내려가서 */
  const b0 = boxes[0], b4 = boxes[4];
  const y1 = (b0.y + 0.05) * PH, y2 = (b4.y + 0.05) * PH, x = 0.3 * PW;
  const K = [[0, 0.42 * PW, y1 - 90, 1.2], [2.2, x, y1, 1.8], [5.0, x, y1 + 8, 1.86], [6.2, x, y2, 1.86], [9.2, x, y2 + 8, 1.92], [11.2, x + 20, y2, 1.85]];
  let i = 0; while(i < K.length - 2 && K[i + 1][0] <= t) i++;
  const a = K[i], c = K[i + 1], u = ease((t - a[0]) / (c[0] - a[0]));
  return [a[1] + (c[1] - a[1]) * u, a[2] + (c[2] - a[2]) * u, a[3] + (c[3] - a[3]) * u];
}
window.render = t => {
  const [cx, cy, s] = camAt(t);
  pg.style.transform = `translate(${innerWidth / 2 - cx * s}px,${innerHeight / 2 - cy * s}px) scale(${s})`;
  let penAt = null;
  inks.forEach((e, i) => { const u = Math.max(0, Math.min(1, (t - WHEN[i]) / 0.38)); e.style.clipPath = `inset(0 ${((1 - u) * 100).toFixed(1)}% 0 0)`;
    if(t >= WHEN[i] - 0.25 && t < WHEN[i] + 0.45) penAt = [e.offsetLeft + e.offsetWidth * (0.15 + 0.75 * u), e.offsetTop + e.offsetHeight * 0.62 + Math.sin(t * 40) * 2]; });
  if(penAt){ pen.style.opacity = 1; pen.style.transform = `translate(${penAt[0] - 4}px,${penAt[1] - 42}px)`; }
  else pen.style.opacity = 0;
  oks.forEach((e, i) => { const u = Math.max(0, Math.min(1, (t - OK[i][0]) / 0.35)); e.style.opacity = u; e.style.transform = `scale(${1.6 - 0.6 * u}) rotate(-8deg)`; });
};
fetch(SRC + 'training-boxes.json').then(r => r.json()).then(async bx => {
  bx.sort((a, b) => (a.y - b.y) || (a.x - b.x)); boxes = bx; im.src = SRC + 'training.png'; await im.decode(); await document.fonts.ready;
  PH = PW * im.naturalHeight / im.naturalWidth;
  bx.forEach((b, i) => { const d = document.createElement('div'); d.className = 'ink'; d.textContent = VAL[i] || '';
    Object.assign(d.style, { left:b.x * PW + 'px', top:b.y * PH + 'px', width:b.w * PW + 'px', height:b.h * PH + 'px', fontSize:Math.round(b.h * PH * (VAL[i].length > 1 ? 0.7 : 0.95)) + 'px' });
    pg.appendChild(d); inks.push(d); });
  OK.forEach(([, k]) => { const b = bx[k]; const d = document.createElement('div'); d.className = 'ok'; d.textContent = '✓';
    Object.assign(d.style, { left:(b.x + b.w) * PW + 40 + 'px', top:(b.y - b.h * 0.6) * PH + 'px' }); pg.appendChild(d); oks.push(d); });
  pg.appendChild(pen);
  window.render(0); window.__ready = true;
});
</script></body></html>
