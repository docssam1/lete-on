<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>수의 마법 · 수학 이야기</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css"><script src="../vendor/katex/katex.min.js"></script><style>
@font-face{font-family:Pretendard;src:url('../assets/fonts/pretendard-var.woff2');font-weight:100 700;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f1ece1;color:#2a241c;font-family:Pretendard,sans-serif}header{position:sticky;top:0;z-index:3;padding:6px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#fdfbf5;border-bottom:1px solid #c9bda2}h1{font-size:16px;font-weight:600;margin:0 12px 0 0}label{font-size:12px;display:flex;align-items:center;gap:6px}select,button{font:inherit;font-size:14px;min-height:44px;border:1px solid #c9bda2;border-radius:4px;background:#fff;color:#2a241c;padding:8px;max-width:100%}button{cursor:pointer}select{max-width:min(340px,80vw)}:focus-visible{outline:3px solid #2f6b4a;outline-offset:2px}.nm-print-sheet{display:block!important;width:210mm!important;max-width:210mm!important;margin:12px auto!important;padding:0 10mm;background:#fff;zoom:var(--preview-zoom,1);box-shadow:0 2px 12px #0001}.nm-mz-page{overflow:visible}#status{padding:6px 12px;margin:0;font-size:12px;line-height:1.5}a{color:#245b60}.nm-mz-page .nm-w2-wm{display:block;position:absolute;inset:44% 0 auto;text-align:center;transform:rotate(-27deg);font-size:36px;color:#1a2233;opacity:.06;pointer-events:none;z-index:0}.nm-mz-page>*:not(.nm-w2-wm){position:relative;z-index:1}@media print{header,#status{display:none!important}.nm-print-sheet{margin:0!important;padding:0!important;zoom:1;box-shadow:none;width:auto!important;max-width:none!important}body{background:#fff}}
</style></head><body><header><h1>수학 이야기</h1><label>기사<select id="article" aria-label="읽을 이야기"></select></label><label>언어<select id="language" aria-label="이야기 언어"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option></select></label><button id="previous" type="button">이전 이야기</button><button id="next" type="button">다음 이야기</button><button id="print" type="button">인쇄 · PDF 저장</button></header><p id="status" role="status">학습지와 같은 내용·그림입니다. 학생 기록을 저장하지 않습니다.</p><main class="nm-print-sheet" id="sheet"></main><aside id="feedback" aria-label="활동 해설"></aside>
<script src="../data/magazine.js?v=20261025-character2"></script><script src="../app/exam.js?v=20261026-review1"></script><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),all=NM_MAGAZINE.articles,lang=['ko','en','zh'].includes(params.get('l'))?params.get('l'):'ko';
// Isolate preview language from the signed-in learner's settings.
window.NM_STATE_KEY='nm_math_story_preview_language';
$('language').value=lang;
function fit(){document.documentElement.style.setProperty('--preview-zoom',Math.min(1,(innerWidth-16)/(210*96/25.4)));}
function render(){const l=$('language').value,id=$('article').value;document.documentElement.lang=l;try{localStorage.setItem(window.NM_STATE_KEY,JSON.stringify({lang:l}));}catch{}$('sheet').innerHTML=NM_EXAM.magazineArticle(id);$('feedback').innerHTML=NM_EXAM.magazineFeedback(id);for(const option of $('article').options)option.textContent=all.find(a=>a.id===option.value).title[l];history.replaceState(null,'','?'+new URLSearchParams({article:id,l}));fit();window.scrollTo(0,0);}
$('article').replaceChildren(...all.map(a=>new Option(a.title[lang],a.id)));$('article').value=all.some(a=>a.id===params.get('article'))?params.get('article'):'mz-zeno';$('article').addEventListener('change',render);$('language').addEventListener('change',render);$('previous').onclick=()=>{$('article').selectedIndex=($('article').selectedIndex+all.length-1)%all.length;render();};$('next').onclick=()=>{$('article').selectedIndex=($('article').selectedIndex+1)%all.length;render();};$('print').onclick=async()=>{await document.fonts.ready;window.print();};addEventListener('resize',fit);render();
</script></body></html>
