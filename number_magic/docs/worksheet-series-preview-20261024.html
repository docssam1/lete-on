<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>수의 마법 · 과정별 시리즈</title><style>
@font-face{font-family:Series;src:url('../assets/fonts/pretendard-var.woff2');font-weight:100 700}*{box-sizing:border-box}body{margin:0;background:#f1ece1;color:#2a241c;font-family:Series,sans-serif}header{padding:24px 28px;border-bottom:1px solid #c9bda2;background:#fdfbf5}h1{font-size:25px;font-weight:600;margin:0 0 10px;letter-spacing:-.03em}p{margin:0;font-size:14px;line-height:1.7;color:#7a6f5c}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-top:18px}label{font-size:12px;display:flex;flex-direction:column;gap:6px}select,input,a{font:inherit}select,input{padding:10px;border:1px solid #c9bda2;border-radius:3px;min-height:44px;background:white;color:inherit}a{color:#2f6b4a;padding:12px 0;font-size:14px}iframe{display:block;border:0;width:min(100%,1000px);height:calc(100vh - 212px);min-height:600px;margin:auto;background:#fff}small{display:block;margin-top:12px;color:#8c452c;font-size:12px}@media(max-width:600px){header{padding:18px}h1{font-size:22px}.controls{gap:10px}label:first-child{width:100%}iframe{height:75vh}input{max-width:150px}}
</style></head><body><header><h1>수의 마법 · 과정별 학습지 시리즈</h1><p>유아·초등은 캐릭터와 함께, 중·고등은 차분한 수학 노트로.<br>표지와 목차부터 실제 개념·연습·정답까지 확인할 수 있습니다.</p><div class="controls"><label>레벨·과정<select id="course"><option value="C0" selected>수의 나라 · 수와 친해지기</option><option value="C4">계산의 새싹 · 곱셈구구</option><option value="C13">연산의 도약 · 나눗셈</option><option value="C35">중3 · 제곱근</option><option value="M3E">중3 · 선택 심화</option><option value="C38">공통수학1 · 다항식</option><option value="C54">공통수학2 · 명제와 부등식</option><option value="C70">미적분 · 극한과 연속</option></select></label><label>표지 이름<input id="name" maxlength="24" value="예시 학습자"></label><a id="open" target="_blank" rel="noopener">학습지 크게 보기</a></div><small>디자인 확인용 예시입니다. 실제 학생 기록을 저장하거나 문자를 발송하지 않습니다.</small></header><iframe id="book" title="실제 주간 학습지"></iframe><script src="../app/delivery-plan.js?v=20261024-personal1"></script><script>
const $=id=>document.getElementById(id);function show(){const course=$('course').value,week='2026-W43',start=week==='2026-W43'?'2026-10-19':'2026-11-02',url=new URL('../ws.html',location.href);url.search=new URLSearchParams({c:course==='M3E'?'C37':course,w:week,n:$('name').value,auto:'0'});if(course==='M3E'){const p={courseKey:'C37',sessionIndex:13,startDate:start,speed:1,amount:1,cadence:'w2',pace:'p2',middleExtensions:{3:'20261024-middle-extension1'},extensionAnchor:{grade:3,index:0}};for(const [k,v]of Object.entries({dv:NM_DELIVERY_PLAN.VERSION,dp:NM_DELIVERY_PLAN.encode(p),k:1,cad:'w2',amt:1}))url.searchParams.set(k,v);}else if(+course.slice(1)>=29)for(const [k,v]of Object.entries({hp:1,p:1,s:1,cad:'w2',hs:start,hv:1}))url.searchParams.set(k,v);$('book').src=url.href;$('open').href=url.href;}document.querySelector('.controls').addEventListener('change',show);show();
</script></body></html>
