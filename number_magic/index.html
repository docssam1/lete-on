<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Numbers of Magic — 마법의 마을</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --blue:#16417C; --blue-deep:#0E2C57; --gold:#EAC996; --gold-deep:#C9A063;
  --sky1:#bfe0f2; --sky2:#e8f4ec; --grass:#a8cf8e; --grass2:#8fbf74;
  --water:#7fc4e0; --ink:#1A2233;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Pretendard',sans-serif}
body{background:var(--sky1)}

#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#viewport.drag{cursor:grabbing}
#world{
  position:absolute;left:0;top:0;width:1400px;height:1000px;transform-origin:0 0;
  background:linear-gradient(180deg,#bfe0f2 0%,#d7ecf3 30%,#e8f4ec 46%,var(--grass) 46%,var(--grass2) 100%);
}
.sun{position:absolute;left:1120px;top:70px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fff6d8,#ffe08a 60%,#ffd25e);
  box-shadow:0 0 80px 30px rgba(255,224,138,.5);animation:sunpulse 6s ease-in-out infinite}
@keyframes sunpulse{50%{box-shadow:0 0 100px 44px rgba(255,224,138,.65)}}
.cloud{position:absolute;background:#fff;border-radius:100px;opacity:.9;filter:blur(.3px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:150px;height:46px;top:110px;left:-200px;animation:drift1 60s linear infinite}
.cloud.c1::before{width:70px;height:70px;top:-30px;left:26px}
.cloud.c1::after{width:56px;height:56px;top:-20px;left:80px}
.cloud.c2{width:120px;height:38px;top:220px;left:-300px;animation:drift2 90s linear infinite;opacity:.75}
.cloud.c2::before{width:56px;height:56px;top:-24px;left:20px}
.cloud.c2::after{width:44px;height:44px;top:-16px;left:64px}
.cloud.c3{width:180px;height:52px;top:60px;left:-400px;animation:drift3 120s linear infinite;opacity:.65}
.cloud.c3::before{width:80px;height:80px;top:-34px;left:30px}
.cloud.c3::after{width:60px;height:60px;top:-22px;left:96px}
@keyframes drift1{to{transform:translateX(1750px)}}
@keyframes drift2{to{transform:translateX(1850px)}}
@keyframes drift3{to{transform:translateX(1950px)}}
.path{position:absolute;background:#e6d8b8;border-radius:40px}
.path.main{left:120px;top:640px;width:1160px;height:70px;box-shadow:inset 0 4px 12px rgba(0,0,0,.06)}
.path.v1{left:340px;top:500px;width:56px;height:180px}
.path.v2{left:720px;top:500px;width:56px;height:180px}
.path.v3{left:1020px;top:500px;width:56px;height:180px}
.pond{position:absolute;left:120px;top:770px;width:340px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#a9dcef,var(--water));overflow:hidden}
.ripple{position:absolute;border:2px solid rgba(255,255,255,.6);border-radius:50%;
  left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);animation:ripple 4s ease-out infinite}
.ripple.r2{animation-delay:1.3s}.ripple.r3{animation-delay:2.6s}
@keyframes ripple{0%{width:10px;height:6px;opacity:.8}100%{width:220px;height:120px;opacity:0}}
.lily{position:absolute;width:26px;height:26px;background:#6fbf7a;border-radius:50% 50% 50% 0;
  transform:rotate(45deg);animation:bob 3s ease-in-out infinite}
.lily.l2{animation-delay:1s}
.fountain{position:absolute;left:640px;top:560px;width:120px;height:120px}
.f-basin{position:absolute;bottom:0;width:120px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,#bfe8f5,#88c9e2);box-shadow:0 6px 14px rgba(0,0,0,.15)}
.f-jet{position:absolute;left:50%;bottom:28px;width:6px;height:60px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(160,220,240,.2));border-radius:6px;
  animation:jet 1.4s ease-in-out infinite}
@keyframes jet{0%,100%{height:44px;opacity:.7}50%{height:66px;opacity:1}}
.drop{position:absolute;left:50%;bottom:70px;width:5px;height:5px;background:#cfeefb;border-radius:50%}
.d1{animation:fall 1.4s ease-in infinite}.d2{animation:fall 1.4s .3s ease-in infinite}
.d3{animation:fall 1.4s .6s ease-in infinite}
@keyframes fall{0%{transform:translate(-50%,-10px);opacity:1}100%{transform:translate(-50%,40px) translateX(var(--dx,-14px));opacity:0}}
.zone{position:absolute;cursor:pointer;transition:transform .2s;text-align:center}
.zone:hover{transform:translateY(-6px)}
.zone:active{transform:translateY(-2px) scale(.98)}
.bldg{position:relative;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18))}
.roof{width:0;height:0;margin:0 auto}
.wall{border-radius:8px 8px 4px 4px;position:relative;overflow:hidden}
.win{position:absolute;background:#ffe9a8;border-radius:3px;animation:winglow 4s ease-in-out infinite}
@keyframes winglow{0%,100%{background:#ffe9a8}50%{background:#fff4cf;box-shadow:0 0 10px #ffe9a8}}
.door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:#7a5230;border-radius:6px 6px 0 0}
.zlabel{margin-top:8px;font-weight:800;font-size:15px;color:var(--blue-deep);
  background:rgba(255,255,255,.85);border-radius:10px;padding:4px 10px;display:inline-block;
  box-shadow:0 3px 8px rgba(0,0,0,.1);white-space:nowrap}
.zlabel .ic{margin-right:4px}
.smoke{position:absolute;width:12px;height:12px;background:rgba(255,255,255,.7);border-radius:50%;
  animation:smoke 4s ease-out infinite}
@keyframes smoke{0%{transform:translateY(0) scale(.5);opacity:.7}100%{transform:translateY(-60px) scale(2);opacity:0}}
.clock{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:30px;height:30px;
  border-radius:50%;background:#fff;border:3px solid var(--gold-deep)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;background:var(--blue-deep);border-radius:2px}
.hh{width:3px;height:9px;transform:translateX(-50%) rotate(30deg)}
.mh{width:2px;height:12px;transform:translateX(-50%) rotate(200deg);animation:tick 8s linear infinite}
@keyframes tick{to{transform:translateX(-50%) rotate(560deg)}}
.bridge{position:absolute;left:400px;top:800px;width:120px;height:36px}
.bridge .plank{position:absolute;width:100%;height:14px;background:#b98a54;border-radius:8px;top:14px}
.bridge .rail{position:absolute;width:100%;height:4px;background:#9a6f3e;border-radius:4px}
.char{position:absolute;width:56px;cursor:pointer;z-index:20;transition:transform .1s}
.char:active{transform:scale(.9)}
.char .body{width:46px;height:46px;margin:0 auto;border-radius:16px;position:relative;
  box-shadow:0 8px 16px -6px rgba(0,0,0,.35);animation:walkbob .5s ease-in-out infinite}
.char .body::before{content:"";position:absolute;width:9px;height:9px;background:#fff;border-radius:50%;top:15px;left:11px;box-shadow:16px 0 0 #fff}
.char .body::after{content:"";position:absolute;width:4px;height:4px;background:var(--ink);border-radius:50%;top:18px;left:14px;box-shadow:16px 0 0 var(--ink)}
.char .nm{text-align:center;font-size:11px;font-weight:800;color:#fff;margin-top:3px;
  background:rgba(0,0,0,.35);border-radius:8px;padding:1px 5px}
@keyframes walkbob{50%{transform:translateY(-4px)}}
#numi .body{background:linear-gradient(145deg,#3768ad,#16417C)}
#numi .hat{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:20px solid var(--gold-deep);z-index:2}
#poco .body{background:linear-gradient(145deg,#e8a94e,#cf8a2e);border-radius:50% 50% 46% 46%}
#momo .body{background:linear-gradient(145deg,#5fae86,#3d8a63);border-radius:12px}
.shadow{width:40px;height:10px;background:rgba(0,0,0,.15);border-radius:50%;margin:2px auto 0;filter:blur(2px)}
.speech{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-6px);
  background:#fff;border-radius:14px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);
  white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.speech.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
.speech::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:#fff}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff6d8;
  box-shadow:0 0 8px 2px rgba(255,240,180,.9);pointer-events:none;animation:float 7s ease-in-out infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(45deg)}}
.hud{position:fixed;z-index:100}
.brand{top:16px;left:18px;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3);letter-spacing:-.02em}
.brand small{display:block;font-size:11px;font-weight:700;opacity:.85;letter-spacing:.15em;margin-top:2px}
.coin-hud{top:18px;right:18px;display:flex;align-items:center;gap:8px;font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#4a370f;
  padding:9px 16px;border-radius:999px;box-shadow:0 8px 20px -6px rgba(201,160,99,.7)}
.coin-hud .c{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6df,#e7b24e);display:grid;place-items:center;font-size:11px;color:#7a5a12}
.ctrls{bottom:22px;right:18px;display:flex;flex-direction:column;gap:10px}
.iconbtn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:22px;
  background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(0,0,0,.18);display:grid;place-items:center;transition:.15s}
.iconbtn:active{transform:scale(.9)}
.hint-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;
  background:rgba(14,44,87,.9);color:#fff;font-weight:700;font-size:14px;padding:12px 22px;border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toastin .5s ease}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%)}}
</style>
</head>
<body>

<div class="hud ctrls">
  <button class="iconbtn" id="muteBtn" title="음소거">🔊</button>
  <button class="iconbtn" id="zoomIn" title="확대">＋</button>
  <button class="iconbtn" id="zoomOut" title="축소">－</button>
</div>

  <source src="assets/audio/bgm.mp3" type="audio/mpeg">

<script>
try{
  const st=JSON.parse(localStorage.getItem("nm_progress")||"{}");
  document.getElementById("coinNum").textContent = st.coins||0;
}catch(e){}

const vp=document.getElementById("viewport"), world=document.getElementById("world");
const WORLD_W=1400, WORLD_H=1000;
let cam={x:0,y:0,scale:1}, minScale=1, maxScale=2.2;
function fit(){ minScale=Math.max(innerWidth/WORLD_W, innerHeight/WORLD_H); cam.scale=Math.max(cam.scale,minScale); }
function apply(){ world.style.transform="translate("+cam.x+"px,"+cam.y+"px) scale("+cam.scale+")"; }
function bound(){
  const minX=innerWidth-WORLD_W*cam.scale, minY=innerHeight-WORLD_H*cam.scale;
  cam.x=Math.min(0,Math.max(minX,cam.x)); cam.y=Math.min(0,Math.max(minY,cam.y));
}
function center(){
  cam.scale=Math.max(minScale,1);
  cam.x=-(WORLD_W*cam.scale-innerWidth)/2; cam.y=-(WORLD_H*cam.scale-innerHeight)/2;
  bound(); apply();
}
let dragging=false, moved=false, sx=0, sy=0, cx=0, cy=0;
vp.addEventListener("pointerdown",e=>{ dragging=true;moved=false;vp.classList.add("drag");
  sx=e.clientX;sy=e.clientY;cx=cam.x;cy=cam.y; });
vp.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
  cam.x=cx+dx;cam.y=cy+dy;bound();apply();
});
vp.addEventListener("pointerup",()=>{dragging=false;vp.classList.remove("drag");});
vp.addEventListener("pointercancel",()=>{dragging=false;vp.classList.remove("drag");});

let pts=new Map(), pinchDist=0;
vp.addEventListener("pointerdown",e=>pts.set(e.pointerId,e));
vp.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return; pts.set(e.pointerId,e);
  if(pts.size===2){
    const a=[...pts.values()][0], b=[...pts.values()][1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pinchDist){ zoomTo(cam.scale*(d/pinchDist),(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2); }
    pinchDist=d; dragging=false;
  }
});
["pointerup","pointercancel"].forEach(ev=>vp.addEventListener(ev,e=>{pts.delete(e.pointerId);if(pts.size<2)pinchDist=0;}));

function zoomTo(ns,ox,oy){
  ns=Math.min(maxScale,Math.max(minScale,ns));
  const wx=(ox-cam.x)/cam.scale, wy=(oy-cam.y)/cam.scale;
  cam.scale=ns; cam.x=ox-wx*ns; cam.y=oy-wy*ns; bound(); apply();
}
document.getElementById("zoomIn").onclick=()=>zoomTo(cam.scale*1.25,innerWidth/2,innerHeight/2);
document.getElementById("zoomOut").onclick=()=>zoomTo(cam.scale/1.25,innerWidth/2,innerHeight/2);
vp.addEventListener("wheel",e=>{e.preventDefault();zoomTo(cam.scale*(e.deltaY<0?1.1:0.9),e.clientX,e.clientY);},{passive:false});

fit(); center();
addEventListener("resize",()=>{fit();bound();apply();});

document.querySelectorAll(".zone").forEach(z=>{
  z.addEventListener("pointerup",()=>{
    if(moved)return;
    const go=z.dataset.go, msg=z.dataset.say;
    if(go && go!=="#"){ setTimeout(()=>location.href=go,120); }
    else if(msg){ toast(msg); }
  });
});

const chars=[
  {el:document.getElementById("numi"), sp:"sp-numi", x:400,y:600, tx:400,ty:600, spd:.5,
   lines:["안녕! 난 누미야 ✨","10의 짝꿍, 같이 찾을래?","마법노트 보여줄게!"]},
  {el:document.getElementById("poco"), sp:"sp-poco", x:720,y:610, tx:720,ty:610, spd:.7,
   lines:["오늘은 뭐 하지? 🎈","게임하러 가자!","코인 모으는 중이야~"]},
  {el:document.getElementById("momo"), sp:"sp-momo", x:1000,y:600, tx:1000,ty:600, spd:.4,
   lines:["차근차근 해보자 📐","실수는 괜찮아!","다시 확인해볼까?"]}
];
function pickTarget(c){
  const zones=[[180,640],[470,650],[760,640],[1020,650],[620,655],[340,760]];
  const t=zones[Math.random()*zones.length|0];
  c.tx=t[0]+Math.random()*60; c.ty=t[1]+Math.random()*30;
}
chars.forEach(pickTarget);
function walk(){
  chars.forEach(c=>{
    const dx=c.tx-c.x, dy=c.ty-c.y, d=Math.hypot(dx,dy);
    if(d<2){ if(Math.random()<0.012) pickTarget(c); return; }
    c.x+=dx/d*c.spd; c.y+=dy/d*c.spd;
    c.el.style.left=c.x+"px"; c.el.style.top=c.y+"px";
    c.el.style.transform = dx<0 ? "scaleX(-1)" : "scaleX(1)";
  });
  requestAnimationFrame(walk);
}
walk();

chars.forEach(c=>{
  c.el.addEventListener("pointerup",e=>{
    if(moved)return; e.stopPropagation();
    const sp=document.getElementById(c.sp);
    sp.textContent=c.lines[Math.random()*c.lines.length|0];
    sp.classList.add("show"); say(sp.textContent);
    clearTimeout(c._t); c._t=setTimeout(()=>sp.classList.remove("show"),2600);
  });
});

const worldEl=document.getElementById("world");
function spawnSpark(){
  const s=document.createElement("div"); s.className="spark";
  s.style.left=(540+Math.random()*260)+"px"; s.style.top=(660+Math.random()*80)+"px";
  s.style.animationDuration=(5+Math.random()*4)+"s";
  worldEl.appendChild(s); setTimeout(()=>s.remove(),9000);
}
setInterval(spawnSpark,700);

const bgm=document.getElementById("bgm"), muteBtn=document.getElementById("muteBtn");
let muted=true;
function tryPlay(){ if(!muted){ bgm.volume=.4; bgm.play().catch(()=>{}); } }
muteBtn.onclick=()=>{ muted=!muted; muteBtn.textContent=muted?"🔊":"🔈"; if(muted){bgm.pause();}else{tryPlay();} };
addEventListener("pointerdown",()=>{ if(!muted) tryPlay(); },{once:true});

function say(t){ try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=1;u.pitch=1.2;speechSynthesis.speak(u);}catch(e){} }

let toastEl=null;
function toast(msg){
  toastEl&&toastEl.remove();
  toastEl=document.createElement("div"); toastEl.className="hint-toast"; toastEl.textContent=msg;
  document.body.appendChild(toastEl); say(msg);
  setTimeout(()=>toastEl&&toastEl.remove(),2400);
}
</script>
</body>
