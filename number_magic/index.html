<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Numbers of Magic — 마법의 숫자 마을</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --blue:#16417C; --blue-deep:#0E2C57; --gold:#EAC996; --gold-deep:#C9A063; --ink:#1A2233;
  --n1:#e23b3b;--n2:#ff8c1a;--n3:#ffd21a;--n4:#4bb84b;--n5:#2fa3e0;
  --n6:#7b5cff;--n7:#e05fb0;--n8:#8a5a2b;--n9:#8a8f99;--n10:#1a9c8a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Pretendard',sans-serif}
body{background:#cfe8c0}

#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#bfe0f2}
#viewport.drag{cursor:grabbing}
#world{
  position:absolute;left:0;top:0;width:1024px;height:687px;transform-origin:0 0;
  background:linear-gradient(180deg,#bfe0f2 0%,#dbeee4 42%,#a8cf8e 42%,#8fbf74 100%);
  background-image:url(assets/map.jpg);
  background-size:100% 100%;background-repeat:no-repeat;
}

.ncloud{position:absolute;display:flex;align-items:center;justify-content:center;
  font-weight:900;color:#5b7fb0;pointer-events:none;opacity:.9;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.08))}
.ncloud .puff{position:absolute;background:#fff;border-radius:50%}
.ncloud .num{position:relative;z-index:2;font-size:26px;color:#3a67a8;text-shadow:0 1px 0 #fff}
.ncloud.a{top:70px;left:-160px;animation:cdrift 70s linear infinite}
@keyframes cdrift{to{transform:translateX(1380px)}}
.ncloud.c{top:110px;left:-560px;animation:cdriftC 130s linear infinite;opacity:.75}
@keyframes cdriftC{from{transform:translateX(0) scale(1.1)}to{transform:translateX(1580px) scale(1.1)}}
.ncloud.b{top:40px;left:-360px;animation:cdriftB 100s linear infinite}
@keyframes cdriftB{from{transform:translateX(0) scale(.8)}to{transform:translateX(1480px) scale(.8)}}

#fountain0{position:absolute;left:300px;top:290px;width:90px;height:90px;pointer-events:none}
.zero{position:absolute;left:50%;bottom:20px;font-weight:900;color:#8fd3ec;
  font-size:20px;text-shadow:0 1px 2px rgba(255,255,255,.9);opacity:0}
@keyframes zrise{
  0%{transform:translate(-50%,0) scale(.6);opacity:0}
  20%{opacity:1}60%{opacity:1}
  100%{transform:translate(calc(-50% + var(--zx,0px)),-70px) scale(1.1);opacity:0}
}

.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6d8;
  box-shadow:0 0 8px 2px rgba(255,240,180,.9);pointer-events:none;animation:sfloat 6s ease-in-out infinite}
@keyframes sfloat{0%{transform:translateY(0);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateY(-90px);opacity:0}}

.nb{position:absolute;cursor:pointer;z-index:25;transition:transform .1s;width:44px}
.nb:active{transform:scale(.92)}
.nb .stack{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;animation:hop .5s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-4px)}}
.nb .blk{width:34px;height:34px;border-radius:8px;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.35);display:grid;place-items:center}
.nb .blk .eye{position:absolute;top:9px;width:7px;height:7px;background:#fff;border-radius:50%}
.nb .blk .eye::after{content:"";position:absolute;top:2px;left:2px;width:3px;height:3px;background:#1a2233;border-radius:50%}
.nb .blk .eye.l{left:6px}.nb .blk .eye.r{right:6px}
.nb .blk .mo{position:absolute;bottom:7px;width:9px;height:5px;border-bottom:2px solid #1a2233;border-radius:0 0 8px 8px}
.nb .cap{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);z-index:3}
.nb .shadow{width:32px;height:8px;background:rgba(0,0,0,.18);border-radius:50%;margin:3px auto 0;filter:blur(2px)}
.nb .speech{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-4px);
  background:#fff;border-radius:12px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink);
  white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.nb .speech.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
.nb .speech::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}

.zone{position:absolute;cursor:pointer;border-radius:16px;transition:.2s;z-index:15}
.zone::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:0 0 0 0 rgba(234,201,150,0);transition:.25s}
.zone:hover{background:rgba(255,255,255,.14)}
.zone:hover::after{box-shadow:0 0 0 3px rgba(234,201,150,.9),0 0 22px rgba(234,201,150,.6)}
.zlabel{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(6px);
  font-weight:800;font-size:13px;color:var(--blue-deep);background:rgba(255,255,255,.9);
  border-radius:10px;padding:4px 10px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.15);
  opacity:0;transition:.2s;pointer-events:none}
.zone:hover .zlabel{opacity:1;transform:translateX(-50%) translateY(10px)}

.hud{position:fixed;z-index:100}
.brand{top:14px;left:16px;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4);letter-spacing:-.02em}
.brand small{display:block;font-size:10px;font-weight:700;opacity:.9;letter-spacing:.15em;margin-top:2px}
.coin-hud{top:16px;right:16px;display:flex;align-items:center;gap:7px;font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#4a370f;
  padding:8px 15px;border-radius:999px;box-shadow:0 8px 20px -6px rgba(201,160,99,.7)}
.coin-hud .c{width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6df,#e7b24e);display:grid;place-items:center;font-size:11px;color:#7a5a12}
.ctrls{bottom:20px;right:16px;display:flex;flex-direction:column;gap:9px}
.iconbtn{width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;font-size:21px;
  background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(0,0,0,.18);display:grid;place-items:center;transition:.15s}
.iconbtn:active{transform:scale(.9)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;
  background:rgba(14,44,87,.92);color:#fff;font-weight:700;font-size:14px;padding:12px 22px;border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .4s ease}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}
</style>
</head>
<body>

<div id="viewport">
  <div id="world">

    <div class="ncloud a"><span class="puff" style="width:64px;height:64px;left:0;top:-8px"></span><span class="puff" style="width:48px;height:48px;left:44px;top:0"></span><span class="puff" style="width:40px;height:40px;left:78px;top:6px"></span><span class="num">7</span></div>
    <div class="ncloud b"><span class="puff" style="width:70px;height:70px;left:0;top:-10px"></span><span class="puff" style="width:50px;height:50px;left:50px;top:2px"></span><span class="num">10</span></div>
    <div class="ncloud c"><span class="puff" style="width:56px;height:56px;left:0;top:-6px"></span><span class="puff" style="width:44px;height:44px;left:40px;top:2px"></span><span class="num">5</span></div>

    <div id="fountain0"></div>

    <div class="zone" style="left:7%;top:9%;width:26%;height:33%" data-go="book.html" data-say="📖 마법 도서관 — 마법책을 펼쳐볼까?"><span class="zlabel">📖 마법 도서관</span></div>
    <div class="zone" style="left:40%;top:15%;width:16%;height:28%" data-go="chapter.html" data-say="🏛️ 연습 마을 — 함께 연습하자!"><span class="zlabel">🏛️ 연습 마을</span></div>
    <div class="zone" style="left:56%;top:19%;width:16%;height:27%" data-go="chapter.html?mode=arena" data-say="🎬 아레나 극장 — 실력을 겨뤄보자!"><span class="zlabel">🎬 아레나 극장</span></div>
    <div class="zone" style="left:82%;top:22%;width:14%;height:20%" data-go="#" data-say="🔔 도장의 전당 — 네 도장을 자랑해봐!"><span class="zlabel">🔔 도장의 전당</span></div>
    <div class="zone" style="left:78%;top:54%;width:18%;height:22%" data-go="#" data-say="🎁 매직 스토어 — 코인으로 뭘 바꿀까?"><span class="zlabel">🎁 매직 스토어</span></div>
    <div class="zone" style="left:6%;top:52%;width:28%;height:34%" data-go="chapter.html" data-say="🏘️ 연습 마을 집들 — 매직 랩으로!"><span class="zlabel">🏘️ 매직 랩</span></div>

    <div class="nb" id="nbNumi" style="left:40%;top:62%">
      <div class="speech">안녕! 난 3이야 ✨</div>
      <span class="cap">3</span>
      <div class="stack">
        <div class="blk" style="background:var(--n3)"><span class="eye l"></span><span class="eye r"></span><span class="mo"></span></div>
        <div class="blk" style="background:var(--n3)"></div>
        <div class="blk" style="background:var(--n3)"></div>
      </div>
      <div class="shadow"></div>
    </div>

    <div class="nb" id="nbPoco" style="left:55%;top:66%">
      <div class="speech">숫자는 재밌어! 🎈</div>
      <span class="cap">5</span>
      <div class="stack">
        <div class="blk" style="background:var(--n5)"><span class="eye l"></span><span class="eye r"></span><span class="mo"></span></div>
        <div class="blk" style="background:var(--n5)"></div>
        <div class="blk" style="background:var(--n5)"></div>
        <div class="blk" style="background:var(--n5)"></div>
        <div class="blk" style="background:var(--n5)"></div>
      </div>
      <div class="shadow"></div>
    </div>

    <div class="nb" id="nbMomo" style="left:30%;top:70%">
      <div class="speech">10을 만들어볼까? 📐</div>
      <span class="cap">2</span>
      <div class="stack">
        <div class="blk" style="background:var(--n2)"><span class="eye l"></span><span class="eye r"></span><span class="mo"></span></div>
        <div class="blk" style="background:var(--n2)"></div>
      </div>
      <div class="shadow"></div>
    </div>

  </div>
</div>

<div class="hud brand">Numbers of Magic<small>마법의 숫자 마을</small></div>
<div class="hud coin-hud"><span class="c">◈</span><span id="coinNum">0</span></div>
<div class="hud ctrls">
  <button class="iconbtn" id="muteBtn">🔊</button>
  <button class="iconbtn" id="zoomIn">＋</button>
  <button class="iconbtn" id="zoomOut">－</button>
</div>

<audio id="bgm" loop><source src="assets/audio/bgm.mp3" type="audio/mpeg"></audio>

<script>
try{const st=JSON.parse(localStorage.getItem("nm_progress")||"{}");document.getElementById("coinNum").textContent=st.coins||0;}catch(e){}

const vp=document.getElementById("viewport"), world=document.getElementById("world");
const W=1024,H=687;
let cam={x:0,y:0,scale:1},minS=1,maxS=2.4;
function fit(){minS=Math.max(innerWidth/W,innerHeight/H);cam.scale=Math.max(cam.scale,minS);}
function apply(){world.style.transform="translate("+cam.x+"px,"+cam.y+"px) scale("+cam.scale+")";}
function bound(){const mx=innerWidth-W*cam.scale,my=innerHeight-H*cam.scale;cam.x=Math.min(0,Math.max(mx,cam.x));cam.y=Math.min(0,Math.max(my,cam.y));}
function center(){cam.scale=Math.max(minS,1);cam.x=-(W*cam.scale-innerWidth)/2;cam.y=-(H*cam.scale-innerHeight)/2;bound();apply();}
let drag=false,moved=false,sx,sy,cx,cy;
vp.addEventListener("pointerdown",e=>{drag=true;moved=false;vp.classList.add("drag");sx=e.clientX;sy=e.clientY;cx=cam.x;cy=cam.y;});
vp.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;cam.x=cx+dx;cam.y=cy+dy;bound();apply();});
vp.addEventListener("pointerup",()=>{drag=false;vp.classList.remove("drag");});
vp.addEventListener("pointercancel",()=>{drag=false;vp.classList.remove("drag");});
let pts=new Map(),pd=0;
vp.addEventListener("pointerdown",e=>pts.set(e.pointerId,e));
vp.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);if(pts.size===2){const v=[...pts.values()];const d=Math.hypot(v[0].clientX-v[1].clientX,v[0].clientY-v[1].clientY);if(pd)zoomTo(cam.scale*(d/pd),(v[0].clientX+v[1].clientX)/2,(v[0].clientY+v[1].clientY)/2);pd=d;drag=false;}});
["pointerup","pointercancel"].forEach(ev=>vp.addEventListener(ev,e=>{pts.delete(e.pointerId);if(pts.size<2)pd=0;}));
function zoomTo(ns,ox,oy){ns=Math.min(maxS,Math.max(minS,ns));const wx=(ox-cam.x)/cam.scale,wy=(oy-cam.y)/cam.scale;cam.scale=ns;cam.x=ox-wx*ns;cam.y=oy-wy*ns;bound();apply();}
document.getElementById("zoomIn").onclick=()=>zoomTo(cam.scale*1.25,innerWidth/2,innerHeight/2);
document.getElementById("zoomOut").onclick=()=>zoomTo(cam.scale/1.25,innerWidth/2,innerHeight/2);
vp.addEventListener("wheel",e=>{e.preventDefault();zoomTo(cam.scale*(e.deltaY<0?1.1:.9),e.clientX,e.clientY);},{passive:false});
fit();center();addEventListener("resize",()=>{fit();bound();apply();});

document.querySelectorAll(".zone").forEach(z=>{
  z.addEventListener("pointerup",()=>{if(moved)return;const g=z.dataset.go,m=z.dataset.say;if(g&&g!=="#"){setTimeout(()=>location.href=g,120);}else toast(m);});
});

const f0=document.getElementById("fountain0");
setInterval(()=>{
  const z=document.createElement("div");z.className="zero";z.textContent="0";
  z.style.setProperty("--zx",(Math.random()*30-15)+"px");
  z.style.fontSize=(16+Math.random()*10)+"px";
  z.style.animation="zrise "+(1.6+Math.random()*.8)+"s ease-out forwards";
  f0.appendChild(z);setTimeout(()=>z.remove(),2600);
},260);

setInterval(()=>{
  const s=document.createElement("div");s.className="spark";
  s.style.left=(28+Math.random()*20)+"%";s.style.top=(42+Math.random()*10)+"%";
  s.style.animationDuration=(4+Math.random()*3)+"s";
  world.appendChild(s);setTimeout(()=>s.remove(),8000);
},600);

const nbs=[
  {el:document.getElementById("nbNumi"),x:40,y:62,tx:40,ty:62,spd:.10,lines:["안녕! 난 3이야 ✨","7이랑 만나면 10! 🔟","마법노트 보여줄게!"]},
  {el:document.getElementById("nbPoco"),x:55,y:66,tx:55,ty:66,spd:.14,lines:["숫자는 재밌어! 🎈","게임하러 가자!","코인 모으는 중~"]},
  {el:document.getElementById("nbMomo"),x:30,y:70,tx:30,ty:70,spd:.08,lines:["10을 만들어볼까? 📐","실수는 괜찮아!","다시 확인해보자"]}
];
function pick(n){const sp=[[38,60],[52,64],[30,72],[46,74],[60,68],[24,66]];const t=sp[Math.random()*sp.length|0];n.tx=t[0]+Math.random()*6;n.ty=t[1]+Math.random()*4;}
nbs.forEach(pick);
function walk(){
  nbs.forEach(n=>{
    const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);
    if(d<.3){if(Math.random()<.012)pick(n);return;}
    n.x+=dx/d*n.spd;n.y+=dy/d*n.spd;
    n.el.style.left=n.x+"%";n.el.style.top=n.y+"%";
    n.el.querySelector(".stack").style.transform=dx<0?"scaleX(-1)":"scaleX(1)";
  });
  requestAnimationFrame(walk);
}
walk();
nbs.forEach(n=>{
  n.el.addEventListener("pointerup",e=>{
    if(moved)return;e.stopPropagation();
    const sp=n.el.querySelector(".speech");
    sp.textContent=n.lines[Math.random()*n.lines.length|0];
    sp.classList.add("show");say(sp.textContent);
    clearTimeout(n._t);n._t=setTimeout(()=>sp.classList.remove("show"),2400);
  });
});

const bgm=document.getElementById("bgm"),mb=document.getElementById("muteBtn");
let muted=true;
mb.onclick=()=>{muted=!muted;mb.textContent=muted?"🔊":"🔈";if(muted)bgm.pause();else{bgm.volume=.4;bgm.play().catch(()=>{});}};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=1;u.pitch=1.25;speechSynthesis.speak(u);}catch(e){}}

let te=null;
function toast(m){te&&te.remove();te=document.createElement("div");te.className="toast";te.textContent=m;document.body.appendChild(te);say(m);setTimeout(()=>te&&te.remove(),2300);}
</script>
</body>
</html>
