<style>
#nm-intro{position:fixed;inset:0;z-index:9999;background:#0E2C57;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease}
#nm-intro.hide{opacity:0;pointer-events:none}
#nm-intro video{width:100%;height:100%;object-fit:cover}
#nm-intro .skip{position:absolute;bottom:26px;right:20px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:10px 20px;font-family:'Pretendard',sans-serif;font-size:15px;font-weight:800;cursor:pointer;backdrop-filter:blur(4px)}
#nm-intro .sound{position:absolute;bottom:26px;left:20px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;width:46px;height:46px;font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}
html.skip-intro #nm-intro{display:none}
</style>
<script>if(/[?&]enter=1\b/.test(location.search))document.documentElement.classList.add('skip-intro');</script>
<script>
/* 카카오톡 인앱브라우저 → 외부 브라우저로 열기 */
(function(){
  var ua = navigator.userAgent;
  if(!/KAKAOTALK/i.test(ua)) return;
  var url = location.href;
  if(/Android/i.test(ua)){
    /* Android: Chrome intent 로 이동 */
    location.replace('intent://'+url.replace(/https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end;');
    return;
  }
  /* iOS: 프로그램적으로 Safari 강제 불가 → 안내 오버레이 표시 */
  document.addEventListener('DOMContentLoaded',function(){
    var ov=document.createElement('div');
    ov.id='nm-kakao-ov';
    ov.innerHTML='<div class="nm-kakao-box"><div class="nm-kakao-ico">🌐</div>'
      +'<div class="nm-kakao-title">Safari에서 열어주세요</div>'
      +'<div class="nm-kakao-desc">카카오톡 브라우저에서는 일부 기능이 제한돼요.<br>아래 방법으로 Safari에서 열어 주세요.</div>'
      +'<div class="nm-kakao-step"><span class="nm-kakao-num">1</span>화면 하단 <b>⋯</b> 버튼 탭</div>'
      +'<div class="nm-kakao-step"><span class="nm-kakao-num">2</span><b>Safari로 열기</b> 선택</div>'
      +'<button class="nm-kakao-close" onclick="document.getElementById(\'nm-kakao-ov\').remove()">이 창에서 계속하기</button>'
      +'</div>';
    document.body.appendChild(ov);
  });
})();
</script>
<style>
#nm-kakao-ov{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Pretendard',sans-serif}
.nm-kakao-box{background:#fff;border-radius:22px;padding:30px 24px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.nm-kakao-ico{font-size:44px;margin-bottom:12px}
.nm-kakao-title{font-size:18px;font-weight:900;color:#111;margin-bottom:8px}
.nm-kakao-desc{font-size:13.5px;color:#555;line-height:1.6;margin-bottom:20px}
.nm-kakao-step{display:flex;align-items:center;gap:10px;text-align:left;background:#f4f6fa;border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:14px;color:#222}
.nm-kakao-num{background:#16417C;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.nm-kakao-close{margin-top:16px;background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;font-family:'Pretendard',sans-serif}
</style>

<script>
(function(){
  if(document.documentElement.classList.contains('skip-intro')){
    var introSkip=document.getElementById('nm-intro');
    if(introSkip&&introSkip.parentNode) introSkip.parentNode.removeChild(introSkip);
    return;
  }
  var intro=document.getElementById('nm-intro');
  var vid=document.getElementById('nm-introVid');
  var skip=document.getElementById('nm-skip');
  var snd=document.getElementById('nm-sound');
  function toAbout(){
    location.href='about.html';
  }
  // 소리 켜기(탭 시 음소거 해제)
  snd.onclick=function(){ vid.muted=!vid.muted; snd.textContent=vid.muted?'🔇':'🔊'; if(!vid.muted){vid.play().catch(function(){});} };
  skip.onclick=toAbout;
  vid.addEventListener('ended',toAbout);
  // 영상 로드 실패 시(파일 아직 없거나 오류) 바로 철학 소개로
  vid.addEventListener('error',toAbout);
  // 안전장치: 12초 지나면 자동 이동
  setTimeout(toAbout,12000);
})();
</script>
