<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Numbers of Magic — 마법의 마을</title>\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    body { font-family: Pretendard, sans-serif; background: #f5f5f5; }\n    #living-map {\n      width: 100vw;\n      height: 100vh;\n      position: relative;\n      overflow: hidden;\n      background: url('data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 600\"><rect fill=\"%23b8d4a3\" width=\"800\" height=\"600\"/></svg>');\n      background-size: cover;\n    }\n    .character { position: absolute; width: 60px; height: 60px; cursor: pointer; }\n    .zone { position: absolute; width: 120px; height: 120px; cursor: pointer; border-radius: 8px; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-weight: bold; }\n    .controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; }\n    button { padding: 8px 16px; border: none; border-radius: 4px; background: #4a86e8; color: white; cursor: pointer; }\n    button:hover { background: #3a76d8; }\n  </style>\n</head>\n<body>\n  <div id=\"living-map\">\n    <!-- 리빙맵 배경 + 캐릭터 + 건물 클릭 존 -->\n    <div class=\"character\" id=\"numi\" style=\"left:150px;top:200px;\">누미</div>\n    <div class=\"character\" id=\"poco\" style=\"left:400px;top:300px;\">포코</div>\n    <div class=\"character\" id=\"momo\" style=\"left:600px;top:250px;\">모모</div>\n    \n    <div class=\"zone\" id=\"zone-library\" style=\"left:50px;top:50px;\">📖<br>도서관</div>\n    <div class=\"zone\" id=\"zone-practice\" style=\"left:250px;top:50px;\">🏘️<br>연습마을</div>\n    <div class=\"zone\" id=\"zone-arena\" style=\"left:450px;top:50px;\">🎬<br>극장</div>\n    <div class=\"zone\" id=\"zone-hall\" style=\"left:650px;top:50px;\">🔔<br>전당</div>\n    <div class=\"zone\" id=\"zone-plaza\" style=\"left:150px;top:350px;\">⛲<br>광장</div>\n    <div class=\"zone\" id=\"zone-store\" style=\"left:550px;top:400px;\">🌉<br>스토어</div>\n  </div>\n  \n  <div class=\"controls\">\n    <button id=\"menu-btn\">메뉴</button>\n    <button id=\"mute-btn\">🔊</button>\n  </div>\n\n  <audio id=\"bgm\" loop>\n    <source src=\"assets/audio/bgm.mp3\" type=\"audio/mpeg\">\n  </audio>\n\n  <script>\n    // 뼈대: 캐릭터 클릭, 존 클릭 이벤트\n    document.getElementById('zone-library').onclick = () => { window.location.href = 'book.html'; };\n    document.getElementById('zone-practice').onclick = () => { window.location.href = 'chapter.html'; };\n    document.getElementById('zone-arena').onclick = () => { window.location.href = 'chapter.html?mode=arena'; };\n    document.querySelectorAll('.character').forEach(ch => {\n      ch.onclick = (e) => { alert(e.target.textContent + '와 인사했어!'); };\n    });\n  </script>\n</body>\n</html>"
