<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1001의 비밀 — 수의 마법 개념실험실</title>
<!-- Numbers of Magic 개념실험실 2호: 1001 = 7×11×13, abcabc 마술 (계보 3 · 9는 10의 옆집)
     콘텐츠 전부 창작 — 외부 교재/영상 미사용. 내레이션: Web Speech(ko) 폴백 -->
<style>
:root{
  --blue:#16417C;--blue-deep:#0E2C57;--gold:#EAC996;--gold-deep:#C9A063;
  --ink:#1A2233;--sub:#4a5468;--paper:#FBFAF7;--mist:#F1F0EC;--line:#E4E2DC;
  --ok:#2E9E6B;--no:#D9534F;--night:#3d1a5c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 30% -10%,#f0ecfa,transparent 60%),var(--paper);
  min-height:100dvh;padding:18px 14px 60px}
.wrap{max-width:640px;margin:0 auto}
.hero{text-align:center;padding:10px 0 18px}
.hero h1{font-size:clamp(24px,6.5vw,32px);font-weight:900;letter-spacing:-.03em;color:var(--night)}
.hero p{font-size:14px;color:var(--sub);margin-top:6px}
.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0 18px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;
  font-size:14px;font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
.tab.on{background:var(--night);border-color:var(--night);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;
  box-shadow:0 12px 30px -22px rgba(61,26,92,.3);display:none}
.card.on{display:block}
.card h2{font-size:17px;color:var(--night);margin-bottom:12px}
.story p{font-size:15px;line-height:1.75;margin-bottom:12px}
.story .legend{font-size:12.5px;color:var(--sub);background:var(--mist);border-radius:11px;padding:9px 12px}
.speak{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;
  font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;margin-bottom:12px}
.btn{border:none;background:var(--night);color:#fff;border-radius:13px;padding:12px 20px;
  font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.gold{background:var(--gold-deep)}
.btn.ghost{background:#fff;color:var(--night);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;justify-content:center}
.bignum{display:flex;gap:6px;justify-content:center;margin:14px 0}
.digit{min-width:44px;height:56px;border:2.5px solid var(--line);border-radius:13px;background:#fff;
  display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--blue-deep);
  box-shadow:0 4px 0 #eceae4;transition:.25s}
.digit.copy{border-color:var(--gold-deep);background:#fffaf0;color:#b8860b}
.digit.pop{transform:translateY(-6px)}
.factor-line{display:flex;gap:8px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap;
  font-size:clamp(17px,5vw,22px);font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.factor{border:2.5px solid var(--night);color:var(--night);border-radius:13px;padding:8px 14px;background:#f7f3fc}
.caption{text-align:center;font-size:15px;font-weight:800;color:var(--night);min-height:26px;margin-top:10px}
.stepline{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
  font-size:clamp(16px,4.6vw,20px);font-weight:900;margin-top:12px;font-variant-numeric:tabular-nums}
.stepline .res{color:var(--night)}
.qline{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
  font-size:16px;font-weight:800;margin-top:14px}
.qline input{width:100px;padding:10px;border:2px solid var(--line);border-radius:11px;
  font-size:18px;font-weight:800;text-align:center;font-family:inherit;color:var(--ink)}
.qline input:focus{outline:none;border-color:var(--night)}
.qline input.good{border-color:var(--ok);background:#effaf4}
.qline input.bad{border-color:var(--no);background:#fdf1f0}
.fb{text-align:center;font-size:14.5px;font-weight:800;min-height:24px;margin-top:10px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.digit{transition:none}}
</style>
<script src="lab-lang.js"></script>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>🧞 <span data-t="title"></span></h1>
    <p data-t="tag"></p>
  </header>

  <nav class="tabs" aria-label="stages">
    <button class="tab on" data-p="p1">① <span data-t="tab1"></span></button>
    <button class="tab" data-p="p2">② <span data-t="tab2"></span></button>
    <button class="tab" data-p="p3">③ <span data-t="tab3"></span></button>
  </nav>

  <!-- ① 이야기 -->
  <section class="card on story" id="p1">
    <h2 data-t="s1h"></h2>
    <button class="speak" data-say="story">🔊 <span data-t="listen"></span></button>
    <div data-th="story"></div>
    <div class="legend" data-th="legend"></div>
    <div class="row"><button class="btn" data-go="p2" data-t="toP2"></button></div>
  </section>

  <!-- ② 마법 보기 -->
  <section class="card" id="p2">
    <h2 data-t="s2h"></h2>
    <div class="bignum" id="demoNum"></div>
    <div class="caption" id="demoCap" data-t="demoInit"></div>
    <div class="factor-line" id="demoFac"></div>
    <div class="row">
      <button class="btn" id="playBtn" data-t="playBtn"></button>
      <button class="speak" data-say="demo" style="margin:0">🔊 <span data-t="listenDemo"></span></button>
    </div>
  </section>

  <!-- ③ 직접 하기 -->
  <section class="card" id="p3">
    <h2 data-t="s3h"></h2>
    <div class="qline">
      <span data-t="lblAbc"></span> <input id="inAbc" inputmode="numeric" maxlength="3" placeholder="234">
      <button class="btn ghost" id="diceBtn" data-t="diceBtn"></button>
      <button class="btn" id="goBtn" data-t="goBtn"></button>
    </div>
    <div id="playArea" class="hidden">
      <div class="bignum" id="userNum"></div>
      <div class="caption" data-t="capDivide"></div>
      <div class="qline">
        <span data-t="lblGuess"></span> <input id="inGuess" inputmode="numeric" maxlength="3">
        <button class="btn gold" id="revealBtn" data-t="revealBtn"></button>
      </div>
      <div id="steps"></div>
      <div class="fb" id="userFb"></div>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
var T=LabLang.T;

var STR={
  title:{ko:'1001의 비밀',en:'The Secret of 1001',zh:'1001的秘密'},
  tag:{ko:'아무 세 자리 수나 두 번 이어 쓰면, 마법의 문이 열려요.',
       en:'Write any 3-digit number twice and a magic door swings open.',
       zh:'把任意三位数连写两遍，魔法之门就打开了。'},
  tab1:{ko:'이야기',en:'Story',zh:'故事'},
  tab2:{ko:'마법 보기',en:'See the magic',zh:'看魔术'},
  tab3:{ko:'직접 하기',en:'Try it',zh:'动手试试'},
  listen:{ko:'읽어 주기',en:'Read aloud',zh:'朗读'},
  listenDemo:{ko:'설명 듣기',en:'Hear the explanation',zh:'听讲解'},
  s1h:{ko:'천일밤의 수',en:'The Number of a Thousand Nights',zh:'一千零一夜之数'},
  toP2:{ko:'마법 보러 가기 →',en:'Go see the magic →',zh:'去看魔术 →'},
  s2h:{ko:'234가 문을 여는 모습',en:'Watch 234 open the door',zh:'看234怎样打开门'},
  demoInit:{ko:'▶ 를 누르면 마법이 시작돼요',en:'Press ▶ and the magic begins',zh:'按▶魔术就开始'},
  playBtn:{ko:'▶ 마법 보기',en:'▶ Show the magic',zh:'▶ 看魔术'},
  s3h:{ko:'네 수로 해 보자!',en:'Now try your own number!',zh:'用你的数试一试！'},
  lblAbc:{ko:'세 자리 수',en:'3-digit number',zh:'三位数'},
  diceBtn:{ko:'🎲 아무 수나',en:'🎲 Random',zh:'🎲 随便一个'},
  goBtn:{ko:'이어 쓰기!',en:'Write it twice!',zh:'连写两遍！'},
  capDivide:{ko:'이 수를 7 → 11 → 13으로 차례로 나누면, 마지막에 어떤 수가 나올까?',
             en:'Divide this number by 7, then 11, then 13 — what comes out at the end?',
             zh:'把这个数依次除以7、11、13——最后会出现什么数？'},
  lblGuess:{ko:'내 예언:',en:'My prediction:',zh:'我的预言：'},
  revealBtn:{ko:'확인!',en:'Reveal!',zh:'揭晓！'},
  story:{
    ko:'<p>마법사가 말해요. <b>"좋아하는 세 자리 수를 하나 생각해 봐. 아무한테도 말하지 말고!"</b> '
      +'네가 234를 생각했다면, 마법사가 이어서 말해요. <b>"그 수를 두 번 이어 써 봐."</b> → 234234.</p>'
      +'<p><b>"이제 그 여섯 자리 수를 7로 나눠 봐."</b> …어라, 딱 나누어떨어져요! '
      +'<b>"11로도 나눠 봐."</b> 또 떨어져요! <b>"마지막으로 13으로!"</b> — '
      +'그러자 <b>네가 처음 생각한 234</b>가 돌아왔어요. 마법사는 네 수를 어떻게 알았을까요?</p>'
      +'<p>비밀은 <b>1001</b>이에요. 세 자리 수를 두 번 이어 쓰는 건 사실 <b>×1001</b>을 한 것과 같고, '
      +'1001은 <b>7×11×13</b>이거든요. 그래서 7, 11, 13으로 차례로 나누면 처음 수로 돌아와요!</p>',
    en:'<p>The magician says: <b>"Think of a 3-digit number you like. Do not tell anyone!"</b> '
      +'Say you thought of 234. Then: <b>"Write that number down twice in a row."</b> → 234234.</p>'
      +'<p><b>"Now divide that six-digit number by 7."</b> … it divides exactly! '
      +'<b>"Now divide by 11."</b> Exact again! <b>"And finally by 13!"</b> — '
      +'and back comes <b>the 234 you started with</b>. How did the magician know your number?</p>'
      +'<p>The secret is <b>1001</b>. Writing a 3-digit number twice is really <b>×1001</b>, '
      +'and 1001 is <b>7×11×13</b>. So dividing by 7, 11 and 13 in turn brings your number straight back!</p>',
    zh:'<p>魔术师说：<b>"想一个你喜欢的三位数。别告诉任何人！"</b>'
      +'假如你想的是234，魔术师接着说：<b>"把这个数连写两遍。"</b>→ 234234。</p>'
      +'<p><b>"现在把这个六位数除以7。"</b>……咦，正好整除！'
      +'<b>"再除以11。"</b>又整除了！<b>"最后除以13！"</b>——'
      +'结果<b>你最初想的234</b>回来了。魔术师是怎么知道你的数的呢？</p>'
      +'<p>秘密就是<b>1001</b>。把三位数连写两遍其实就是<b>×1001</b>，'
      +'而1001正好是<b>7×11×13</b>。所以依次除以7、11、13，你的数就原样回来了！</p>'},
  legend:{
    ko:'※ 1001은 『천일야화』에 나오는 1001밤의 그 수예요. 셰에라자드가 1001일 밤 동안 이야기를 '
      +'들려줬다는 옛이야기 때문에, 수학자들도 이 마술을 "천일밤의 마술"이라고 불러요.',
    en:'※ 1001 is the very number from the Thousand and One Nights. Because Scheherazade told her '
      +'stories for 1001 nights, mathematicians nicknamed this trick "the thousand-nights trick."',
    zh:'※ 1001就是《一千零一夜》里的那个数。因为山鲁佐德讲了1001夜的故事，'
      +'数学家也把这个魔术叫作"一千零一夜魔术"。'}
};
LabLang.fill(STR); LabLang.fillHtml(STR); LabLang.title(STR.title);

/* ── 탭 전환 ── */
function show(id){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.p===id)});
  document.querySelectorAll('.card').forEach(function(c){c.classList.toggle('on',c.id===id)});
  window.speechSynthesis&&speechSynthesis.cancel();
}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){show(t.dataset.p)}});
document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){show(b.dataset.go)}});

/* ── 읽어 주기 (Web Speech 폴백) ── */
LabLang.speak({
  story:{ko:'좋아하는 세 자리 수를 생각해 봐. 그 수를 두 번 이어 써 봐. 이제 7로 나눠 봐. 딱 나누어떨어져. 11로도, 13으로도. 그러면 처음 생각한 수가 돌아와. 비밀은 1001이야. 두 번 이어 쓰는 건 1001을 곱한 것과 같고, 1001은 7 곱하기 11 곱하기 13이거든.',
         en:'Think of a three-digit number you like. Write it twice in a row. Now divide by seven. It divides exactly. By eleven too, and by thirteen. And your first number comes back. The secret is one thousand and one. Writing it twice is the same as multiplying by one thousand and one, and that is seven times eleven times thirteen.',
         zh:'想一个你喜欢的三位数。把它连写两遍。现在除以七，正好整除。除以十一，除以十三，也都整除。然后你最初想的数就回来了。秘密就是一千零一。连写两遍等于乘一千零一，而一千零一就是七乘十一乘十三。'},
  demo:{ko:'234를 두 번 이어 쓰면 234234. 이건 234 곱하기 1001과 같아요. 그리고 1001은 7 곱하기 11 곱하기 13. 그래서 셋으로 차례로 나누면 234가 돌아와요.',
        en:'Write 234 twice and you get 234234. That is the same as 234 times one thousand and one. And one thousand and one is seven times eleven times thirteen. So dividing by all three brings 234 back.',
        zh:'把234连写两遍就是234234。这等于234乘一千零一。而一千零一就是七乘十一乘十三。所以依次除以这三个数，234就回来了。'}
});

function digits(el,str,copyFrom){
  el.innerHTML='';
  return str.split('').map(function(ch,i){
    var d=document.createElement('div');
    d.className='digit'+(copyFrom!==undefined&&i>=copyFrom?' copy':'');
    d.textContent=ch;el.appendChild(d);return d;
  });
}

/* ── ② 데모 애니메이션: 234 → 234234 → ×1001 → 7×11×13 ── */
var demoNum=document.getElementById('demoNum');
digits(demoNum,'234');
var demoBusy=false;
document.getElementById('playBtn').onclick=function(){
  if(demoBusy)return;demoBusy=true;
  var cap=document.getElementById('demoCap'),fac=document.getElementById('demoFac');
  fac.innerHTML='';
  digits(demoNum,'234');
  cap.textContent=T({ko:'세 자리 수 234를…',en:'Take the 3-digit number 234 …',zh:'拿三位数234……'});
  setTimeout(function(){
    var ds=digits(demoNum,'234234',3);
    ds.slice(3).forEach(function(d,i){setTimeout(function(){d.classList.add('pop');setTimeout(function(){d.classList.remove('pop')},250)},i*150)});
    cap.textContent=T({ko:'두 번 이어 쓰면 234234!',en:'Written twice: 234234!',zh:'连写两遍就是234234！'});
  },900);
  setTimeout(function(){
    cap.textContent=T({ko:'사실 이건 곱하기 1001과 같아요',en:'That is really just ×1001',zh:'其实这就等于×1001'});
    document.getElementById('demoFac').innerHTML='234234 = 234 × <span class="factor">1001</span>';
  },2200);
  setTimeout(function(){
    cap.textContent=T({ko:'그리고 1001의 정체는…',en:'And what is 1001, really? …',zh:'那么1001的真面目是……'});
    document.getElementById('demoFac').innerHTML=
      '234 × <span class="factor">7</span> × <span class="factor">11</span> × <span class="factor">13</span>';
  },3600);
  setTimeout(function(){
    cap.textContent=T({ko:'그래서 7, 11, 13으로 나누면 234로 돌아와요! 🧞',
                       en:'So dividing by 7, 11 and 13 brings 234 right back! 🧞',
                       zh:'所以依次除以7、11、13，234就回来了！🧞'});
    demoBusy=false;
  },4800);
};

/* ── ③ 직접 하기 ── */
var abc=0;
document.getElementById('diceBtn').onclick=function(){
  document.getElementById('inAbc').value=100+Math.floor(Math.random()*900);
};
document.getElementById('goBtn').onclick=function(){
  var v=+document.getElementById('inAbc').value;
  if(!(v>=100&&v<=999)){
    document.getElementById('inAbc').className='bad';return;
  }
  document.getElementById('inAbc').className='good';
  abc=v;
  document.getElementById('playArea').classList.remove('hidden');
  var s=String(v);
  digits(document.getElementById('userNum'),s+s,3);
  document.getElementById('steps').innerHTML='';
  document.getElementById('userFb').textContent='';document.getElementById('userFb').className='fb';
  var g=document.getElementById('inGuess');g.value='';g.className='';
};
document.getElementById('revealBtn').onclick=function(){
  if(!abc)return;
  var g=document.getElementById('inGuess'),guess=+g.value;
  var six=abc*1001, a=six/7, b=a/11;
  var st=document.getElementById('steps');
  st.innerHTML='';
  var lines=[
    six+' ÷ 7 = <span class="res">'+a+'</span>',
    a+' ÷ 11 = <span class="res">'+b+'</span>',
    b+' ÷ 13 = <span class="res">'+abc+'</span> ✨'
  ];
  lines.forEach(function(html,i){
    setTimeout(function(){
      var d=document.createElement('div');d.className='stepline';d.innerHTML=html;st.appendChild(d);
    },i*800);
  });
  setTimeout(function(){
    var fb=document.getElementById('userFb');
    if(guess===abc){
      g.className='good';fb.className='fb ok';
      fb.textContent=T({ko:'🧞 예언 적중! 처음 수 '+abc+'로 돌아왔어요 — 1001의 비밀을 알았으니까!',
                        en:'🧞 Prediction correct! Back to your first number '+abc+' — because you know the secret of 1001!',
                        zh:'🧞 预言命中！回到了最初的'+abc+'——因为你知道1001的秘密！'});
    }else{
      g.className='bad';fb.className='fb no';
      fb.textContent=T({ko:'마지막에 나온 수를 봐요 — 처음 생각한 수 그대로죠? 두 번 이어 쓰기 = ×1001 = ×7×11×13!',
                        en:'Look at the last line — it is exactly the number you started with! Writing twice = ×1001 = ×7×11×13.',
                        zh:'看最后一行——正是你最初想的数吧？连写两遍 = ×1001 = ×7×11×13！'});
    }
  },lines.length*800+200);
};
})();
</script>
</body>
</html>
