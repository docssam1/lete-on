<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미적분은 왜 태어났나 — 수의 마법 개념실험실</title>
<!-- Numbers of Magic 개념실험실 4호: 미적분의 존재 이유(§7 스토리텔링·§13 기호 전환)
     콘텐츠 전부 자체 서술 — 외부 교재 미사용. 캔버스 애니메이션, 외부 의존 0 -->
<style>
:root{
  --ink:#1A2233;--sub:#4a5468;--paper:#FBFAF7;--mist:#F1F0EC;--line:#E4E2DC;
  --indigo:#2B3A67;--indigo-deep:#1B2545;--amber:#E08A2E;--amber-soft:#F6C97A;
  --ok:#2E9E6B;--no:#D9534F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);
  background:radial-gradient(900px 520px at 25% -10%,#e9ecf7,transparent 60%),var(--paper);
  min-height:100dvh;padding:18px 14px 60px}
.wrap{max-width:660px;margin:0 auto}
.hero{text-align:center;padding:10px 0 16px}
.hero h1{font-size:clamp(23px,6.2vw,31px);font-weight:900;letter-spacing:-.03em;color:var(--indigo-deep)}
.hero p{font-size:14px;color:var(--sub);margin-top:6px}
.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0 18px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 15px;
  font-size:14px;font-weight:800;color:var(--sub);cursor:pointer;font-family:inherit}
.tab.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;
  box-shadow:0 12px 30px -22px rgba(43,58,103,.35);display:none}
.card.on{display:block}
.card h2{font-size:17px;color:var(--indigo-deep);margin-bottom:12px}
.story p{font-size:15px;line-height:1.75;margin-bottom:13px}
.story b{color:var(--indigo-deep)}
.legend{font-size:12.5px;color:var(--sub);background:var(--mist);border-radius:11px;padding:10px 12px;line-height:1.65}
.big{background:linear-gradient(160deg,#f4f6fd,#fff);border:2px solid #cfd6ea;border-radius:16px;
  padding:15px;text-align:center;font-size:15.5px;font-weight:800;color:var(--indigo-deep);line-height:1.7;margin:4px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.mini{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fdfdfb}
.mini b{display:block;font-size:14.5px;color:var(--amber);margin-bottom:5px}
.mini span{font-size:13.5px;color:var(--sub);line-height:1.6}
.btn{border:none;background:var(--indigo);color:#fff;border-radius:13px;padding:12px 20px;
  font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.amber{background:var(--amber)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:14px}
canvas{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;border-radius:14px;background:#fcfcfa;border:1px solid var(--line)}
.cap{text-align:center;font-size:14.5px;font-weight:800;color:var(--indigo-deep);min-height:24px;margin-top:9px}
.val{text-align:center;font-size:clamp(17px,5vw,22px);font-weight:900;color:var(--ink);
  margin-top:6px;font-variant-numeric:tabular-nums;min-height:30px}
.val b{color:var(--amber)}
.slider{width:100%;max-width:420px;margin:10px auto 0;display:block;accent-color:var(--indigo)}
.slabel{text-align:center;font-size:13px;font-weight:800;color:var(--sub);margin-top:8px}
.qline{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;font-size:15.5px;font-weight:800;margin-top:16px}
.qline input{width:92px;padding:10px;border:2px solid var(--line);border-radius:11px;
  font-size:17px;font-weight:800;text-align:center;font-family:inherit;color:var(--ink)}
.qline input:focus{outline:none;border-color:var(--indigo)}
.qline input.good{border-color:var(--ok);background:#effaf4}
.qline input.bad{border-color:var(--no);background:#fdf1f0}
.fb{text-align:center;font-size:14.5px;font-weight:800;min-height:24px;margin-top:10px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.speak{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;
  font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;margin-bottom:12px}
.uses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.uses{grid-template-columns:1fr}}
.use{border:1.5px solid var(--line);border-radius:14px;padding:13px;background:#fdfdfb;cursor:pointer;
  transition:.18s;font-family:inherit;text-align:left;width:100%}
.use:hover{border-color:var(--amber);transform:translateY(-2px)}
.use.open{border-color:var(--amber);background:#fffaf2}
.use-q{font-size:14.5px;font-weight:800;color:var(--indigo-deep);line-height:1.55}
.use-a{font-size:13.5px;color:var(--sub);line-height:1.65;margin-top:8px;display:none}
.use.open .use-a{display:block}
.use-tag{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;background:var(--amber);
  border-radius:99px;padding:3px 9px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="lab-lang.js"></script>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>🍎 <span data-t="title"></span></h1>
    <p data-t="tag"></p>
  </header>

  <nav class="tabs" aria-label="stages">
    <button class="tab on" data-p="p1">① <span data-t="tab1"></span></button>
    <button class="tab" data-p="p4">② <span data-t="tab2"></span></button>
    <button class="tab" data-p="p2">③ <span data-t="tab3"></span></button>
    <button class="tab" data-p="p3">④ <span data-t="tab4"></span></button>
  </nav>

  <!-- ① 이야기 -->
  <section class="card on story" id="p1">
    <h2 data-t="s1h"></h2>
    <button class="speak" data-say="story">🔊 <span data-t="listen"></span></button>
    <div data-th="p1body"></div>
    <div class="big" data-th="p1big"></div>
    <div class="two">
      <div class="mini" data-th="mini1"></div>
      <div class="mini" data-th="mini2"></div>
    </div>
    <div data-th="p1ftc"></div>
    <div class="legend" data-th="p1legend"></div>
    <div class="row"><button class="btn" data-go="p4" data-t="toP4"></button></div>
  </section>

  <!-- ② 어디에 쓰이나 (실감) -->
  <section class="card" id="p4">
    <h2>🎢 <span data-t="s2h"></span></h2>
    <p style="font-size:14.5px;line-height:1.7;margin-bottom:10px" data-th="s2intro"></p>
    <canvas id="cvR" width="420" height="300"></canvas>
    <div class="slabel" id="labR"></div>
    <input class="slider" id="slR" type="range" min="0" max="240" value="20">
    <div class="val" id="valR"></div>
    <div class="fb" id="fbR"></div>

    <h2 style="margin-top:26px">📱 <span data-t="s2h2"></span></h2>
    <p style="font-size:13.5px;color:var(--sub);margin-bottom:10px" data-t="s2tap"></p>
    <div class="uses" id="useList"></div>
    <div class="row"><button class="btn" data-go="p2" data-t="toP2"></button></div>
  </section>

  <!-- ③ 보기 -->
  <section class="card" id="p2">
    <h2 data-t="s3hA"></h2>
    <canvas id="cvA" width="420" height="300"></canvas>
    <div class="cap" id="capA" data-t="capAinit"></div>
    <div class="val" id="valA"></div>
    <div class="row"><button class="btn" id="playA" data-t="playA"></button></div>

    <h2 style="margin-top:26px" data-t="s3hB"></h2>
    <canvas id="cvB" width="420" height="300"></canvas>
    <div class="cap" id="capB" data-t="capBinit"></div>
    <div class="val" id="valB"></div>
    <div class="row">
      <button class="btn" id="playB" data-t="playB"></button>
      <button class="speak" data-say="demo" style="margin:0">🔊 <span data-t="listenDemo"></span></button>
    </div>
  </section>

  <!-- ④ 직접 하기 -->
  <section class="card" id="p3">
    <h2 data-t="s4hA"></h2>
    <canvas id="cvC" width="420" height="300"></canvas>
    <div class="slabel" id="labC"></div>
    <input class="slider" id="slC" type="range" min="0" max="40" value="34">
    <div class="val" id="valC"></div>

    <h2 style="margin-top:22px" data-t="s4hB"></h2>
    <canvas id="cvD" width="420" height="300"></canvas>
    <div class="slabel" id="labD"></div>
    <input class="slider" id="slD" type="range" min="1" max="120" value="4">
    <div class="val" id="valD"></div>

    <div class="qline">
      <span data-t="qSlope"></span> <input id="q1" inputmode="decimal" maxlength="5">,
      <span data-t="qArea"></span> <input id="q2" inputmode="decimal" maxlength="5">
      <button class="btn amber" id="checkBtn" data-t="checkBtn"></button>
    </div>
    <div class="fb" id="fb"></div>
  </section>
</div>

  p1body:{
    ko:'<p>1600년대 사람들에게는 <b>답을 구할 방법이 없는 문제들</b>이 있었어요. '

/* ── 좌표계: x 0~2.4, y 0~5 를 캔버스에 매핑 ── */
function mk(cv){
  var c=cv.getContext('2d'),W=cv.width,H=cv.height,P=34;
  var X=function(x){return P+(x/2.4)*(W-P-14);};
  var Y=function(y){return H-P-(y/5)*(H-P-14);};
  return {c:c,W:W,H:H,X:X,Y:Y,P:P};
}
function axes(g,label){
  var c=g.c;c.clearRect(0,0,g.W,g.H);
  c.strokeStyle='#dcdad4';c.lineWidth=1;
  for(var i=0;i<=5;i++){var y=g.Y(i);c.beginPath();c.moveTo(g.P,y);c.lineTo(g.W-14,y);c.stroke();}
  c.strokeStyle='#9aa2b1';c.lineWidth=1.5;
  c.beginPath();c.moveTo(g.P,g.Y(0));c.lineTo(g.W-14,g.Y(0));c.stroke();
  c.beginPath();c.moveTo(g.X(0),g.H-g.P);c.lineTo(g.X(0),14);c.stroke();
  c.fillStyle='#9aa2b1';c.font='11px sans-serif';c.textAlign='center';
  [0,1,2].forEach(function(v){c.fillText(v,g.X(v),g.H-g.P+15);});
  if(label){c.textAlign='left';c.fillText(label,g.P+4,20);}
}
function curve(g,color){
  var c=g.c;c.strokeStyle=color||'#2B3A67';c.lineWidth=2.5;c.beginPath();
  for(var i=0;i<=240;i++){var x=i/100;if(f(x)>5.1)break;var px=g.X(x),py=g.Y(f(x));i?c.lineTo(px,py):c.moveTo(px,py);}
  c.stroke();
}
function dot(g,x,y,color){var c=g.c;c.fillStyle=color;c.beginPath();c.arc(g.X(x),g.Y(y),5,0,7);c.fill();}

/* 할선/접선 그리기 — h=0이면 접선 */
function drawSecant(g,h,label){
  axes(g,'f(x) = x²');curve(g);
  var x0=1,y0=f(x0),x1=x0+h,y1=f(x1);
  var m=h===0?TRUE_SLOPE:(y1-y0)/h;
  var c=g.c;
  c.strokeStyle=h===0?'#E08A2E':'#5B8DD9';c.lineWidth=2.5;
  c.setLineDash(h===0?[]:[6,4]);
  var xa=0,xb=2.35;
  c.beginPath();c.moveTo(g.X(xa),g.Y(y0+m*(xa-x0)));c.lineTo(g.X(xb),g.Y(y0+m*(xb-x0)));c.stroke();
  c.setLineDash([]);
  dot(g,x0,y0,'#E08A2E');
  if(h>0)dot(g,x1,y1,'#5B8DD9');
  return m;
}
/* 리만합(왼쪽 합) */
function drawRiemann(g,n){
  axes(g,'f(x) = x²  ·  0 ≤ x ≤ 2');
  var c=g.c,a=0,b=2,w=(b-a)/n,sum=0;
  for(var i=0;i<n;i++){
    var xl=a+i*w,hgt=f(xl);sum+=hgt*w;
    var px=g.X(xl),py=g.Y(hgt),pw=g.X(xl+w)-px,ph=g.Y(0)-py;
    c.fillStyle='rgba(224,138,46,.32)';c.fillRect(px,py,pw,ph);
    if(n<=40){c.strokeStyle='#E08A2E';c.lineWidth=1;c.strokeRect(px,py,pw,ph);}
  }
  curve(g);
  return sum;
}

/* ── ② 어디에 쓰이나 — 롤러코스터(실감) ── */
/* 트랙: 큰 언덕 + 작은 언덕. 기울기는 수치미분으로 구한다(미분이 하는 일 그대로) */
function track(x){
  return 0.55 + 3.15*Math.exp(-Math.pow((x-0.62)*2.1,2)) + 1.15*Math.exp(-Math.pow((x-1.95)*2.7,2));
}
function slopeAt(x){var h=1e-4;return (track(x+h)-track(x-h))/(2*h);}
/* 가장 가파른 내리막 위치를 미리 계산 */
var STEEP_X=0, STEEP_M=0;
for(var sx=0;sx<=2.4;sx+=0.002){var m=slopeAt(sx);if(m<STEEP_M){STEEP_M=m;STEEP_X=sx;}}

var gR=mk(document.getElementById('cvR'));
var TRACK_LABEL=T({ko:'롤러코스터 트랙',en:'roller-coaster track',zh:'过山车轨道'});
function faceFor(m){
  if(m<STEEP_M*0.82) return ['😱',T({ko:'가장 무서운 구간! 급강하',en:'The scariest stretch! Steep drop',zh:'最吓人的一段！急速下降'})];
  if(m<-1.2) return ['😲',T({ko:'쌩— 내려가는 중',en:'Whoosh — going down',zh:'咻——正在下降'})];
  if(m<-0.25) return ['🙂',T({ko:'살살 내려가요',en:'A gentle descent',zh:'缓缓下降'})];
  if(m<0.25) return ['😐',T({ko:'여기는 거의 수평 — 기울기 0',en:'Almost flat here — slope 0',zh:'这里几乎水平——斜率0'})];
  if(m<1.2) return ['😀',T({ko:'천천히 올라가요',en:'Climbing slowly',zh:'慢慢往上爬'})];
  return ['😤',T({ko:'영차! 가파른 오르막',en:'Heave-ho! A steep climb',zh:'加油！陡坡上行'})];
}
var foundSteep=false;
function paintR(){
  var x=(+document.getElementById('slR').value)/100;
  var c=gR.c;
  axes(gR,TRACK_LABEL);
  /* 트랙 */
  c.strokeStyle='#2B3A67';c.lineWidth=3;c.beginPath();
  for(var i=0;i<=240;i++){var t=i/100,px=gR.X(t),py=gR.Y(track(t));i?c.lineTo(px,py):c.moveTo(px,py);}
  c.stroke();
  /* 접선(기울기 시각화) */
  var y=track(x),m=slopeAt(x);
  c.strokeStyle='#E08A2E';c.lineWidth=2.5;
  var d=0.42;
  c.beginPath();c.moveTo(gR.X(x-d),gR.Y(y-m*d));c.lineTo(gR.X(x+d),gR.Y(y+m*d));c.stroke();
  /* 카트 */
  c.font='22px sans-serif';c.textAlign='center';
  c.fillText('🚃',gR.X(x),gR.Y(y)-6);
  var fc=faceFor(m);
  c.font='26px sans-serif';c.fillText(fc[0],gR.X(x),gR.Y(y)-30);
  document.getElementById('labR').textContent=fc[1];
  document.getElementById('valR').innerHTML=
    T({ko:'이 지점의 기울기 = ',en:'slope at this point = ',zh:'这一点的斜率 = '})+'<b>'+m.toFixed(2)+'</b>';
  var fb=document.getElementById('fbR');
  if(Math.abs(x-STEEP_X)<0.07){
    fb.className='fb ok';
    fb.textContent=T({ko:'🎯 찾았어요! 여기가 가장 가파른 곳(기울기 '+STEEP_M.toFixed(2)+') — 롤러코스터가 가장 무서운 순간이에요.',
                      en:'🎯 Found it! This is the steepest point (slope '+STEEP_M.toFixed(2)+') — the scariest moment of the ride.',
                      zh:'🎯 找到了！这里最陡（斜率'+STEEP_M.toFixed(2)+'）——过山车最吓人的一刻。'});
    foundSteep=true;
  }else if(Math.abs(m)<0.08){
    fb.className='fb';fb.style.color='var(--indigo)';
    fb.textContent=T({ko:'⛰ 꼭대기예요 — 기울기가 0! 이 지점을 찾는 것이 "극값" 구하기예요.',
                      en:'⛰ You are at the summit — slope 0! Finding this point is what "finding extrema" means.',
                      zh:'⛰ 到顶了——斜率是0！找这个点就是求"极值"。'});
  }else{
    fb.className='fb';fb.style.color='var(--sub)';
    fb.textContent=foundSteep?'':T({ko:'가장 가파르게 떨어지는 지점을 찾아보세요.',
                                    en:'Try to find the steepest drop.',
                                    zh:'找一找下降最陡的地方。'});
  }
}
