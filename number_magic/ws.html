<!-- 주간 학습지 링크 페이지 (2026-09-05, 원장: "문자에는 학습지 PDF 링크를").
     앱의 편지함 봉투(main.js envelopeForWeek)와 같은 규칙으로 학습지를 다시 그린다:
       주차(w) + 과정(c) → primarySessionOf(course).drills, 항목 시드 = envItemSeed(w, c, i)
     그래서 링크만으로 학생이 앱에서 보는 것과 같은 문항이 나온다(Math.random 없음).
     쿼리: ?w=2026-W36&c=C4&n=이름[&k=1|2][&cad=w2][&auto=0][&l=ko|en|zh]
       k=2     — 주 2회반의 그 주 두 번째 학습지: 기본 세션의 다음 세션 드릴 + 시드 접미사 '-2' (k=1 은 앱 봉투와 동일).
       auto=0  — 인쇄 대화상자를 자동으로 띄우지 않는다(PDF 생성기 scripts/nm-weekly-worksheets.cjs 가 쓴다).
     앱 상태(main.js)는 싣지 않는다. 라이선스 원문 없음 — 전부 생성기 산출물. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
  /* 글꼴: Pretendard(CDN) → Noto Sans KR/CJK(Actions 러너에 apt로 설치) → 시스템 한글 순. 표지 이름은 Gowun Batang. */
  /* app/styles.css 는 앱 셸용이라 html,body{height:100%} + body{overflow:hidden} 을 건다.
     그 시트를 여기서도 불러오기 때문에 학습지 페이지가 통째로 스크롤되지 않았다
     (2026-09-07, 원장 "학습지 html까지는 나오는데 스크롤이 안 된다"). 여기서 되돌린다. */
  html,body{height:auto;min-height:100%;overflow:visible}
  body,.nm-print-sheet{margin:0;background:#f4efe6;font-family:Pretendard,'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
  .ws-bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:10px 14px;background:#fffaf0;border-bottom:1px solid #e6dcc8}
  .ws-bar b{font-size:15px}
  .ws-bar .ws-sub{color:#6b6257;font-size:13px}
  .ws-bar button{margin-left:auto;padding:10px 16px;border:0;border-radius:10px;background:#2f6f4e;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .ws-err{margin:40px auto;max-width:520px;padding:20px;background:#fff;border-radius:12px;color:#7a2e2e;line-height:1.6}
  .ws-bar .ws-ghost{margin-left:0;background:#fffaf0;color:#2f6f4e;border:1px solid #cfe0d5}
  /* 화면에서도 학습지를 그대로 보여 준다(2026-09-07, 원장 "먼저 html이 나오고 저장 또는 인쇄가
     되어야 하는데 인쇄 페이지가 먼저 뜨고 html은 스크롤이 안 돼"). 예전엔 인쇄 대화상자가 뜬 뒤
     A4 폭(210mm=794px) 시트가 폰 화면(390px) 밖으로 넘쳐 내용을 확인할 수 없었다.
     zoom 은 레이아웃에 반영되는 축소라 아래로 스크롤이 정상 동작한다(transform:scale 은 빈 공간이 남는다). */
  body>.nm-print-sheet{display:block!important;margin:12px auto;width:210mm;max-width:210mm;background:#fff;
    box-shadow:0 2px 12px rgba(0,0,0,.08);zoom:var(--ws-zoom,1)}
  /* 쪽 경계 — 화면에서 몇 쪽짜리인지 보이게 */
  body>.nm-print-sheet .nm-w2-page,
  body>.nm-print-sheet .nm-print-cover,
  body>.nm-print-sheet .nm-print-answer-key{border-bottom:1px dashed #d8cdb5}
  @media print{ .ws-bar,.ws-err,#wsBody{display:none!important} body{background:#fff}
    body>.nm-print-sheet{margin:0;box-shadow:none;max-width:none;width:auto;zoom:1}
    body>.nm-print-sheet .nm-w2-page,body>.nm-print-sheet .nm-print-cover,
    body>.nm-print-sheet .nm-print-answer-key{border-bottom:0} }
</style>

<!-- 분수·소수 문장제 프레임(2026-09-08) — exam.js 의 wordifyExtended 가 window.NM_WORD_FRAMES 를 본다. exam.js보다 먼저. -->
<script src="app/word-frames-fraction.js"></script>
<script src="app/word-frames-decimal.js"></script>
<script src="app/word-frames-ratio.js"></script>
<script src="app/exam.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  function isoWeekKey(date){
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    var dayNum = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - dayNum + 3);
    var ft = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); var fd = (ft.getUTCDay() + 6) % 7; ft.setUTCDate(ft.getUTCDate() - fd + 3);
    var wk = 1 + Math.round((d - ft) / (7*86400000));
    return d.getUTCFullYear() + '-W' + String(wk).padStart(2,'0');
  }
  /* main.js primarySessionOf / envItemSeed 와 같은 규칙 — 바꾸면 양쪽을 같이 바꿀 것 */
  function primarySessionOf(course){
    if(!course || !course.sessions) return null;
    var withMagic = course.sessions.find(function(s){ return !s.test && s.magic && s.magic.length; });
    return withMagic || course.sessions.find(function(s){ return !s.test; }) || null;
  }
  function envItemSeed(weekKey, courseKey, i){
    return (weekKey + courseKey + 'i' + i).toLowerCase().replace(/[^a-z0-9]/g,'');
  }
  var lang = q.get('l'); if(lang==='en'||lang==='zh'||lang==='ko') document.documentElement.lang = lang;
  var w = (q.get('w') || isoWeekKey(new Date(Date.now() + 9*3600000))).trim();
  var c = (q.get('c') || '').trim();
  var name = (q.get('n') || '').trim();
  /* 인쇄 대화상자는 이제 기본으로 뜨지 않는다(2026-09-07). 학부모가 문자로 받은 링크를 열면
     먼저 학습지를 화면으로 읽고, 인쇄·저장은 버튼으로 고른다. auto=1 을 붙이면 예전처럼 자동으로 뜬다. */
  var auto = q.get('auto') === '1';
  window.NM_PRINT_NAME = name;
  if(!auto) window.NM_NO_AUTOPRINT = true;

  var sub = document.getElementById('wsSub');
  function fail(msg){
    sub.textContent = '';
    document.getElementById('wsBody').innerHTML = '<div class="ws-err">' + msg + '</div>';
    window.NM_WS_READY = 'error';
  }
  var course = window.NM_COURSES && NM_COURSES[c];
  if(!c || !course) return fail('학습지 주소가 올바르지 않아요. (과정 ' + (c||'없음') + ')');
  var k = Math.max(1, Math.min(2, parseInt(q.get('k') || '1', 10) || 1));
  var cad = (q.get('cad') === 'w2' || k === 2) ? 'w2' : 'w1';
  /* 봉투 구성은 exam.js weeklyEnvelope 하나(2026-09-08) — 앱 편지함 인쇄와 같은 학습지가 나온다.
     세션 선택(주 2회 두 번째 회차)·필산 회차·창의 연산 회차·문장제(대안 포함)·표지·마법 유닛 전부 그쪽. */
  var wk = NM_EXAM.weeklyEnvelope(course, c, w, { k: k, name: name, cad: cad });
  if(!wk) return fail('이 과정에는 아직 학습지가 없어요.');
  var items = wk.items, wsId = wk.wsId, cover = wk.cover, units = wk.units, title = wk.title;
  document.title = 'Numbers of Magic' + (name ? ' · ' + name : '') + ' — ' + wsId;
  sub.textContent = (name ? name + ' · ' : '') + w + ' · ' + c + '. ' + title;

  try{
    NM_EXAM.renderPrintMulti(items, wsId, { mixed: 20, cover: cover, units: units });
  }catch(e){ return fail('학습지를 만드는 중 문제가 생겼어요: ' + (e && e.message || e)); }
  /* renderPrintMulti 는 시트를 body 직속으로 붙인다. 인쇄 CSS가 body>*:not(.nm-print-sheet)를 숨기므로
     다른 요소 안으로 옮기면 인쇄(PDF)가 백지가 된다 — 그대로 둔다(2026-09-05 확인). */
  document.getElementById('wsPrint').onclick = function(){ window.print(); };
  /* A4 폭을 화면 폭에 맞춘다(여백 16px). 넓은 화면에서는 1(원본 크기). */
  function fitWidth(){
    var sheetPx = 794; // 210mm @96dpi
    var z = Math.min(1, (document.documentElement.clientWidth - 16) / sheetPx);
    document.documentElement.style.setProperty('--ws-zoom', z > 0 ? z.toFixed(3) : 1);
  }
  fitWidth();
  window.addEventListener('resize', fitWidth);
  /* 글꼴(Pretendard·Gowun Batang·KaTeX)이 다 내려온 뒤에 준비 표시 — PDF 생성기가 이 플래그를 기다린다 */
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var timeout = new Promise(function(r){ setTimeout(r, 8000); });
  Promise.race([fontsReady, timeout]).then(function(){ setTimeout(function(){ window.NM_WS_READY = true; }, 300); });
})();
</script>
