<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>누미와 함께 — 더해서 10</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --blue:#16417C;--blue-deep:#0E2C57;--gold:#EAC996;--gold-deep:#C9A063;
  --ink:#1A2233;--paper:#FBFAF7;--mist:#F1F0EC;--line:#E4E2DC;
  --ok:#2E9E6B;--no:#D9534F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard',sans-serif;color:var(--ink);
  background:radial-gradient(1000px 500px at 30% -10%,#eef3fb,transparent 60%),var(--paper);
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}

.top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.badge{font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--gold-deep);text-transform:uppercase}
.prog{margin-left:auto;display:flex;gap:6px}
.pd{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pd.on{background:var(--gold-deep)}.pd.now{background:var(--blue);transform:scale(1.3)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:22px;text-align:center}
.numi{width:96px;height:96px;border-radius:30px;position:relative;flex:none;
  background:linear-gradient(145deg,#2b5aa0,#16417C);box-shadow:0 18px 36px -14px rgba(22,65,124,.7);
  animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.numi::before{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:34px;left:26px;box-shadow:30px 0 0 #fff}
.numi::after{content:"";position:absolute;width:8px;height:8px;background:var(--blue-deep);border-radius:50%;top:40px;left:32px;box-shadow:30px 0 0 var(--blue-deep)}
.numi .hat{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:40px solid var(--gold-deep)}
.numi.happy{animation:jump .5s ease}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}}

.bubble{background:#fff;border:1px solid var(--line);border-radius:22px 22px 22px 6px;
  padding:20px 26px;font-size:22px;line-height:1.5;font-weight:700;max-width:520px;
  box-shadow:0 16px 40px -20px rgba(22,65,124,.3);min-height:70px;display:flex;align-items:center;justify-content:center}
.bubble .big{font-size:40px;font-weight:900;color:var(--blue);margin:0 4px}

.expr{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:30px;font-weight:900;color:var(--blue-deep)}
.numtile{min-width:70px;height:70px;padding:0 14px;border-radius:18px;border:2.5px solid var(--line);
  background:#fff;font-size:32px;font-weight:900;color:var(--blue-deep);cursor:pointer;
  display:grid;place-items:center;transition:.15s;box-shadow:0 6px 0 #eceae4}
.numtile:active{transform:translateY(3px);box-shadow:0 3px 0 #eceae4}
.numtile.sel{border-color:var(--gold-deep);background:linear-gradient(145deg,#fff6e6,#fbeccd);color:#7a5a12;transform:translateY(-4px);box-shadow:0 10px 0 #e2c893}
.numtile.paired{border-color:var(--ok);background:#eafaf1;color:var(--ok);box-shadow:0 6px 0 #bfe6cf}
.plus{font-size:28px;color:#9aa2b1;font-weight:900}

.answer{padding:18px 16px 30px;border-top:1px solid var(--line);background:rgba(255,255,255,.6);backdrop-filter:blur(8px)}
.hint{text-align:center;font-size:14px;font-weight:700;color:#9aa2b1;margin-bottom:12px;min-height:20px}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:0 auto}
.key{padding:22px 0;font-size:30px;font-weight:900;border-radius:18px;border:2px solid var(--line);
  background:#fff;color:var(--blue-deep);cursor:pointer;transition:.12s;box-shadow:0 5px 0 #eceae4}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #eceae4}

.confirm{display:block;margin:4px auto 0;padding:16px 40px;font-size:18px;font-weight:800;
  border:none;border-radius:16px;background:var(--blue);color:#fff;cursor:pointer;
  box-shadow:0 12px 26px -12px rgba(22,65,124,.7);transition:.15s}
.confirm:active{transform:translateY(2px)}
.confirm:disabled{opacity:.35;cursor:not-allowed}

.screen{text-align:center;font-size:44px;font-weight:900;color:var(--blue);min-height:52px;margin-bottom:6px}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:50;
  padding:14px 28px;border-radius:999px;font-weight:800;font-size:18px;color:#fff;
  box-shadow:0 12px 30px rgba(0,0,0,.25);animation:tin .35s ease}
.toast.ok{background:var(--ok)}.toast.no{background:var(--no)}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%)}}

.confetti{position:fixed;width:10px;height:14px;z-index:40;pointer-events:none}
</style>
</head>
<body>

<div class="top">
  <span class="badge" id="phase">프랙티스 · 10의 짝꿍</span>
  <div class="prog" id="prog"></div>
</div>

<div class="stage">
  <div class="numi" id="numi"><div class="hat"></div></div>
  <div class="bubble" id="bubble">준비됐지?</div>
  <div class="expr" id="expr"></div>
</div>

<div class="answer">
  <div class="hint" id="hint"></div>
  <div class="screen" id="screen" style="display:none">&nbsp;</div>
  <div class="pad" id="pad" style="display:none"></div>
  <button class="confirm" id="confirm" style="display:none" disabled>골랐어요!</button>
</div>

<script>
const $=s=>document.querySelector(s);
const numi=$("#numi"),bubble=$("#bubble"),expr=$("#expr"),hint=$("#hint");
const screen=$("#screen"),pad=$("#pad"),confirm=$("#confirm"),prog=$("#prog");

function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=1;u.pitch=1.25;speechSynthesis.speak(u);}catch(e){}}
function toast(msg,ok){const t=document.createElement("div");t.className="toast "+(ok?"ok":"no");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1100);}
function happy(){numi.classList.remove("happy");void numi.offsetWidth;numi.classList.add("happy");}
function bub(html,voice){bubble.innerHTML=html;if(voice!==false)say((voice||bubble.textContent));}

const PAIRS=[[3,7],[6,4],[8,2],[5,5],[9,1]];
const CONCEPT=[
  {nums:[5,9,1,5], pair:[9,1], after:"9랑 1로 10을 만들었어! 남은 5+5도 10이 되지? 그래서 답은 20!"},
  {nums:[8,5,2,5], pair:[8,2], after:"8이랑 2로 10! 5+5로 또 10! 모두 20이야."}
];

let mode="practice", pIdx=0, pGot=0, need=5;
let cIdx=0, picked=[];

function buildProg(total,cur){prog.innerHTML="";for(let i=0;i<total;i++){const d=document.createElement("span");d.className="pd"+(i<cur?" on":i===cur?" now":"");prog.appendChild(d);}}

function startPractice(){
  mode="practice";$("#phase").textContent="프랙티스 · 10의 짝꿍";
  expr.style.display="none";confirm.style.display="none";
  screen.style.display="";pad.style.display="grid";
  buildPad(); nextPractice(true);
}
function buildPad(){
  pad.innerHTML="";
  ["1","2","3","4","5","6","7","8","9","←","0","✓"].forEach(k=>{
    const b=document.createElement("button");b.className="key";b.textContent=k;b.onclick=()=>press(k);pad.appendChild(b);
  });
}
let cur=null,inp="";
function nextPractice(first){
  buildProg(need,pGot);
  cur=PAIRS[pIdx%PAIRS.length];inp="";screen.textContent="\u00a0";
  const intro = first? "자, 더해서 10이 되는 수를 말할 거야. 내가 <span class='big'>"+cur[0]+"</span> 하면, 짝꿍을 눌러줘!"
                     : "이번엔… <span class='big'>"+cur[0]+"</span>!";
  bub(intro, first? "자, 더해서 10이 되는 수를 말할 거야. 내가 "+cur[0]+" 하면 짝꿍을 눌러줘!" : cur[0]+"!");
  hint.textContent="🔢 계산기처럼 숫자를 눌러 답해요";
}
function press(k){
  if(k==="←"){inp=inp.slice(0,-1);}
  else if(k==="✓"){checkPractice();return;}
  else if(inp.length<2){inp+=k;}
  screen.textContent=inp||"\u00a0";
}
function checkPractice(){
  if(inp==="")return;
  if(+inp===cur[1]){
    happy();toast("정답! 🎉",true);pGot++;
    bub("<span class='big'>"+cur[0]+"</span> 의 짝꿍은 <span class='big'>"+cur[1]+"</span>! 맞았어 ✨","정답! "+cur[0]+"의 짝꿍은 "+cur[1]+"!");
    buildProg(need,pGot);
    if(pGot>=need){setTimeout(bridgeToConcept,1300);return;}
    pIdx++;setTimeout(()=>nextPractice(false),1300);
  }else{
    toast("다시 해볼까?",false);
    bub("음~ <span class='big'>"+cur[0]+"</span> 하고 더해서 10이 되려면? 다시 눌러봐!","음, "+cur[0]+"하고 더해서 10이 되는 수는?");
    inp="";screen.textContent="\u00a0";
  }
}

function bridgeToConcept(){
  happy();buildProg(need,need);
  bub("이제 <span class='big'>10의 짝꿍</span>은 척척이구나! 그럼 진짜 마법을 배워볼까? 🪄","이제 10의 짝꿍은 척척이구나! 그럼 진짜 마법을 배워보자!");
  screen.style.display="none";pad.style.display="none";hint.textContent="";
  setTimeout(startConcept,2200);
}

function startConcept(){
  mode="concept";$("#phase").textContent="개념 · 짝꿍을 찾아라";
  screen.style.display="none";pad.style.display="none";
  expr.style.display="flex";confirm.style.display="block";
  renderConcept();
}
function renderConcept(){
  buildProg(CONCEPT.length,cIdx);
  const c=CONCEPT[cIdx];picked=[];confirm.disabled=true;
  bub("<span class='big'>"+c.nums.join(" + ")+"</span><br>짝꿍이 되는 두 수를 골라볼까?","" + c.nums.join(" 더하기 ") + ". 짝꿍이 되는 두 수를 골라볼까?");
  hint.textContent="👆 더해서 10이 되는 두 수를 톡톡 골라요";
  expr.innerHTML="";
  c.nums.forEach((n,i)=>{
    if(i>0){const p=document.createElement("span");p.className="plus";p.textContent="+";expr.appendChild(p);}
    const t=document.createElement("div");t.className="numtile";t.textContent=n;t.dataset.i=i;
    t.onclick=()=>pickNum(t,i,n);expr.appendChild(t);
  });
}
function pickNum(el,i,n){
  const at=picked.findIndex(p=>p.i===i);
  if(at>=0){picked.splice(at,1);el.classList.remove("sel");}
  else{
    if(picked.length>=2){const first=picked.shift();document.querySelector('.numtile[data-i="'+first.i+'"]').classList.remove("sel");}
    picked.push({i,n});el.classList.add("sel");
  }
  confirm.disabled=picked.length!==2;
}
confirm.onclick=()=>{
  const c=CONCEPT[cIdx];
  const sum=picked[0].n+picked[1].n;
  if(sum===10){
    happy();toast("짝꿍 발견! 🎉",true);
    picked.forEach(p=>{const el=document.querySelector('.numtile[data-i="'+p.i+'"]');el.classList.remove("sel");el.classList.add("paired");});
    bub(c.after,c.after);confirm.disabled=true;hint.textContent="";
    cIdx++;
    setTimeout(()=>{
      if(cIdx>=CONCEPT.length){finish();}else renderConcept();
    },2600);
  }else{
    toast("합이 10이 아니야",false);
    bub("음~ 그 두 수를 더하면 <span class='big'>"+sum+"</span>이야. 10이 되는 짝을 다시 찾아볼까?","음, 그 두 수를 더하면 "+sum+"이야. 10이 되는 짝을 다시 찾아보자.");
    picked.forEach(p=>document.querySelector('.numtile[data-i="'+p.i+'"]').classList.remove("sel"));
    picked=[];confirm.disabled=true;
  }
};

function finish(){
  happy();
  expr.style.display="none";confirm.style.display="none";hint.textContent="";
  bub("완벽해! 이제 넌 <span class='big'>10 묶기 마법사</span>야 🪄✨","완벽해! 이제 넌 10 묶기 마법사야!");
  confettiBurst();
}
function confettiBurst(){
  const cols=["#16417C","#EAC996","#C9A063","#2E9E6B","#3768ad"];
  for(let i=0;i<70;i++){
    const el=document.createElement("div");el.className="confetti";
    el.style.left=Math.random()*100+"vw";el.style.top="-20px";el.style.background=cols[i%cols.length];
    document.body.appendChild(el);
    el.animate([{transform:"translateY(0) rotate(0)",opacity:1},{transform:"translateY("+(innerHeight+40)+"px) rotate("+(Math.random()*720)+"deg)",opacity:.9}],
      {duration:1800+Math.random()*1200,easing:"cubic-bezier(.3,.6,.4,1)"}).onfinish=()=>el.remove();
  }
}

startPractice();
</script>
</body>
</html>
