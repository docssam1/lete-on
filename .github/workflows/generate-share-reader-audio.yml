name: Generate Sophie Read-Along Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-share-reader-audio.yml'
      - 'reading-world/share/sophie-stories/**'
      - 'scripts/generate-share-reader-audio.js'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Neural2 MP3s and exact sentence timings
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-share-reader-audio.js

      - name: R2에도 맞춰 두기(R2 열쇠가 없으면 건너뜀)
        uses: ./.github/actions/mirror-to-r2
        with:
          bucket: audio
          supabase-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
