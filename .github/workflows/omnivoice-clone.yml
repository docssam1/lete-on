# OmniVoice 목소리 복제 — 러너에서 만들어 "누르면 들리는 주소"로 준다 (2026-09-21)
#
# 왜 러너인가
#   원장: "2번을 네가 여기 올려줘."
#   Claude 세션은 huggingface(모델 가중치)와 우리 supabase(원본 MP3)가 게이트웨이에서
#   403 으로 막혀 있고 GPU 도 없다 — **거기선 복제 음성을 만들 수가 없다.**
#   GitHub Actions 러너는 둘 다 막히지 않는다. 그래서 러너가 만들고, 결과를 공개 버킷의
#   임시 자리(`_audition/<시각>/`)에 올려 **휴대폰에서 주소만 누르면** 되게 한다.
#   원격 데스크톱의 소리 설정도, 파일 옮기기도 필요 없어진다.
#
# GPU 가 없어 CPU 로 돈다 — 대사 5줄뿐이라 느려도 끝난다(원장 PC 로 돌리면 훨씬 빠르다).
# 앱이 쓰는 경로는 건드리지 않는다. 다 듣고 `_audition/` 을 지워도 앱에 영향이 없다.
name: OmniVoice 목소리 복제

on:
  workflow_dispatch:
    inputs:
      upload:
        description: '결과를 들을 수 있는 주소로 올릴까요(끄면 artifact 로만 받습니다)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CPU 전용 torch — 기본 wheel 은 CUDA 까지 받아 2 GB 가 넘는다.
      - name: torch(CPU) · OmniVoice 설치
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice soundfile librosa

      - name: 참조 뽑고 복제
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.upload && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          ARGS="--out clone --ref-dir clone-ref --device cpu"
          if [ "$UPLOAD" = "true" ]; then ARGS="$ARGS --upload --tag run-${{ github.run_id }}"; fi
          python scripts/omnivoice-clone.py $ARGS

      # 주소를 못 쓰는 경우(업로드를 껐거나 실패)를 위해 파일도 남긴다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnivoice-clone
          path: |
            clone/
            clone-ref/
          retention-days: 14
