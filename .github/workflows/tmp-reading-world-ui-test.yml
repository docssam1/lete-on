name: Temporary Reading World UI Test

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-reading-world-ui-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - name: Verify all 15 CARS D lessons in live browser
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core'),cp=require('child_process');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function chrome(){for(const c of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){try{return cp.execFileSync('which',[c],{encoding:'utf8'}).trim()}catch(e){}}throw Error('Chrome not found')}
          (async()=>{
            const browser=await puppeteer.launch({executablePath:chrome(),headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            const r=await page.goto('https://lete-on.gfieldacademy.net/reading-world/cars-d-check.html?uiTest='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
            console.log('HTTP_STATUS='+(r&&r.status()));
            await page.waitForFunction(()=>document.querySelector('#readyCount')?.textContent.includes('/15'),{timeout:30000});
            await sleep(2000);
            const result=await page.evaluate(()=>({
              source:document.querySelector('#srcCount')?.textContent,
              questions:document.querySelector('#qCount')?.textContent,
              images:document.querySelector('#imgCount')?.textContent,
              ready:document.querySelector('#readyCount')?.textContent,
              rows:[...document.querySelectorAll('#rows tr')].map(tr=>tr.innerText.replace(/\n/g,' | '))
            }));
            console.log('CHECK='+JSON.stringify(result,null,2));
            await page.screenshot({path:'cars-d-check-mobile.png',fullPage:true});
            if(result.source!=='15/15'||result.questions!=='15/15'||result.images!=='15/15'||result.ready!=='15/15') throw Error('CARS D full check is not 15/15');
            console.log('CARS_D_ALL_15_READY=true');
            await browser.close();
          })().catch(e=>{console.error('TEST_ERROR='+e.stack);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cars-d-check-mobile
          path: cars-d-check-mobile.png
          if-no-files-found: ignore
# branch trigger full-check
