name: Temporary Reading World UI Test

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-reading-world-ui-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24
      - name: Test live CARS D flow
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const cp = require('child_process');
          function findChrome(){
            for (const c of ['google-chrome','google-chrome-stable','chromium','chromium-browser']) {
              try { return cp.execFileSync('which',[c],{encoding:'utf8'}).trim(); } catch(e) {}
            }
            throw new Error('Chrome not found');
          }
          async function clickText(page, re){
            return await page.evaluate((src,flags)=>{
              const re=new RegExp(src,flags);
              const els=[...document.querySelectorAll('button,a,[role="button"],.btn,.card,.lesson-card')];
              const el=els.find(x=>re.test((x.innerText||x.textContent||'').trim()) && x.offsetParent!==null);
              if(el){el.click();return (el.innerText||el.textContent||'').trim().slice(0,120)}
              return null;
            },re.source,re.flags);
          }
          async function bodyText(page){return await page.evaluate(()=>document.body.innerText)}
          (async()=>{
            const browser=await puppeteer.launch({executablePath:findChrome(),headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            const resp=await page.goto('https://lete-on.gfieldacademy.net/reading-world/?uiTest='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
            console.log('HTTP_STATUS='+(resp&&resp.status()));
            await new Promise(r=>setTimeout(r,2500));
            let body=await bodyText(page);
            console.log('INITIAL_TEXT='+body.slice(0,1500).replace(/\n/g,' | '));

            if(/학생|이름|Student|Reader/i.test(body) && !/Level D/i.test(body)){
              const input=await page.$('input[type="text"],input:not([type])');
              if(input) await input.type('UITest');
              const p=await clickText(page,/시작|등록|확인|계속|Start|Enter/i); if(p) console.log('PROFILE_CLICK='+p);
              await new Promise(r=>setTimeout(r,1500));
              body=await bodyText(page);
            }

            let c=await clickText(page,/Level\s*D|CARS Plus.*D/i); console.log('LEVEL_D_CLICK='+(c||'NONE'));
            await new Promise(r=>setTimeout(r,1600));
            body=await bodyText(page); console.log('AFTER_LEVEL_D='+body.slice(0,1800).replace(/\n/g,' | '));

            c=await clickText(page,/Pretest\s*1|Lesson\s*1|cd1|bat/i); console.log('LESSON_CLICK='+(c||'NONE'));
            await new Promise(r=>setTimeout(r,1500));

            c=await clickText(page,/STEP\s*2|교재\s*풀기|Read the Book/i); console.log('STEP2_CLICK='+(c||'NONE'));
            await new Promise(r=>setTimeout(r,3000));
            const s2=await page.evaluate(()=>({
              passage:!!document.querySelector('#original-passage'),
              paragraphs:document.querySelectorAll('#original-passage .sentence-paragraph').length,
              carsOriginal:!!document.querySelector('#original-passage.cars-d-original'),
              media:[...document.querySelectorAll('#original-passage img, #original-passage figure')].map(x=>x.getAttribute('src')||x.className),
              missing:/아직 연결되지|원문을 아직 불러오지|not connected/i.test(document.body.innerText),
              excerpt:document.body.innerText.slice(0,2500)
            }));
            console.log('STEP2='+JSON.stringify(s2));

            c=await clickText(page,/STEP\s*3|교재\s*학습|Book Study/i); console.log('STEP3_CLICK='+(c||'NONE'));
            await new Promise(r=>setTimeout(r,2200));
            const s3=await page.evaluate(()=>({
              qcard:!!document.querySelector('.qcard,.question-study'),
              prompt:document.querySelector('.qcard .prompt,.question-study .prompt')?.innerText||'',
              missing:/아직 연결되지|원문을 아직 불러오지|not connected/i.test(document.body.innerText),
              excerpt:document.body.innerText.slice(0,2500)
            }));
            console.log('STEP3='+JSON.stringify(s3));
            await page.screenshot({path:'reading-world-cars-d-mobile.png',fullPage:true});

            if(!s2.passage || s2.paragraphs<1 || s2.missing) throw new Error('STEP 2 original passage did not render');
            if(!s3.qcard || s3.missing) throw new Error('STEP 3 book study did not render');
            console.log('LIVE_UI_READY=true');
            await browser.close();
          })().catch(e=>{console.error('TEST_ERROR='+e.stack);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-world-cars-d-mobile
          path: reading-world-cars-d-mobile.png
          if-no-files-found: ignore
# branch trigger
