name: Temporary Reading World UI Test

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-reading-world-ui-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24
      - name: Test live CARS D flow
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const cp = require('child_process');
          function findChrome(){
            for (const c of ['google-chrome','google-chrome-stable','chromium','chromium-browser']) {
              try { return cp.execFileSync('which',[c],{encoding:'utf8'}).trim(); } catch(e) {}
            }
            throw new Error('Chrome not found');
          }
          async function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
          async function clickText(page, re){
            return await page.evaluate((src,flags)=>{
              const re=new RegExp(src,flags);
              const visible=x=>x.offsetParent!==null;
              const text=x=>(x.innerText||x.textContent||x.value||'').trim();
              const primary=[...document.querySelectorAll('button,a,[role="button"],input[type="submit"],input[type="button"]')].filter(visible);
              let el=primary.find(x=>re.test(text(x)));
              if(!el){
                const secondary=[...document.querySelectorAll('.btn,.book-card,.lesson-card,.step-card,.book-pill')].filter(visible);
                el=secondary.find(x=>re.test(text(x)));
              }
              if(el){const t=text(el).slice(0,160);el.click();return t;}
              return null;
            },re.source,re.flags);
          }
          async function bodyText(page){return await page.evaluate(()=>document.body.innerText)}
          async function logBody(page,label){const b=await bodyText(page);console.log(label+'='+b.slice(0,2400).replace(/\n/g,' | '));return b;}
          (async()=>{
            const browser=await puppeteer.launch({executablePath:findChrome(),headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            const resp=await page.goto('https://lete-on.gfieldacademy.net/reading-world/?uiTest='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
            console.log('HTTP_STATUS='+(resp&&resp.status()));
            await sleep(1600);
            let body=await logBody(page,'INITIAL_TEXT');

            if(/화면을 탭하면 소리|건너뛰기/i.test(body)){
              const c=await clickText(page,/건너뛰기|Skip/i); console.log('INTRO_SKIP='+(c||'NONE'));
              await sleep(1000); body=await logBody(page,'AFTER_INTRO');
            }

            const input=await page.$('input[type="text"],input:not([type])');
            if(input){
              await input.click({clickCount:3}); await input.type('UITest');
              const c=await clickText(page,/^시작하기|^Start/i); console.log('PROFILE_CLICK='+(c||'NONE'));
              await sleep(1800); body=await logBody(page,'AFTER_PROFILE');
            }

            // Dismiss only explicit tutorial controls if one appears.
            if(/사용법|튜토리얼|도움말/i.test(body)){
              const c=await clickText(page,/닫기|건너뛰기|나중에|Close|Skip/i); if(c){console.log('HELP_DISMISS='+c);await sleep(700);}
            }
            body=await logBody(page,'HOME');

            let c=await clickText(page,/Level\s*B(?:\s*[·\/&]\s*C)?/i); console.log('BOOK_SELECTOR_CLICK='+(c||'NONE'));
            await sleep(900); body=await logBody(page,'BOOK_SELECTOR');

            c=await clickText(page,/Level\s*D|CARS Plus.*D|CARS.*Level D/i); console.log('LEVEL_D_CLICK='+(c||'NONE'));
            await sleep(1800); body=await logBody(page,'AFTER_LEVEL_D');

            c=await clickText(page,/Pretest\s*1|Lesson\s*1|cd1|African|folktale|bat/i); console.log('LESSON_CLICK='+(c||'NONE'));
            await sleep(1500); body=await logBody(page,'LESSON_HOME');

            c=await clickText(page,/STEP\s*2|교재\s*풀기|Read the Book/i); console.log('STEP2_CLICK='+(c||'NONE'));
            await sleep(3200);
            const s2=await page.evaluate(()=>({
              passage:!!document.querySelector('#original-passage'),
              paragraphs:document.querySelectorAll('#original-passage .sentence-paragraph').length,
              carsOriginal:!!document.querySelector('#original-passage.cars-d-original'),
              sourceHead:document.querySelector('.cars-source-head')?.innerText||'',
              media:[...document.querySelectorAll('#original-passage img, #original-passage figure')].map(x=>x.getAttribute('src')||x.className),
              missing:/아직 연결되지|원문을 아직 불러오지|not connected/i.test(document.body.innerText),
              excerpt:document.body.innerText.slice(0,2800)
            }));
            console.log('STEP2='+JSON.stringify(s2));

            c=await clickText(page,/STEP\s*3|교재\s*학습|Book Study/i); console.log('STEP3_CLICK='+(c||'NONE'));
            if(!c){const c2=await clickText(page,/교재\s*학습\s*시작|Start Book Study/i);console.log('STEP3_START='+(c2||'NONE'));}
            await sleep(2400);
            const s3=await page.evaluate(()=>({
              qcard:!!document.querySelector('.qcard,.question-study'),
              prompt:document.querySelector('.qcard .prompt,.question-study .prompt')?.innerText||'',
              badge:document.querySelector('.qcard .badge,.question-study .badge')?.innerText||'',
              missing:/아직 연결되지|원문을 아직 불러오지|not connected/i.test(document.body.innerText),
              excerpt:document.body.innerText.slice(0,2800)
            }));
            console.log('STEP3='+JSON.stringify(s3));
            await page.screenshot({path:'reading-world-cars-d-mobile.png',fullPage:true});

            if(!s2.passage || s2.paragraphs<1 || s2.missing) throw new Error('STEP 2 original passage did not render');
            if(!s3.qcard || s3.missing) throw new Error('STEP 3 book study did not render');
            console.log('LIVE_UI_READY=true');
            await browser.close();
          })().catch(e=>{console.error('TEST_ERROR='+e.stack);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-world-cars-d-mobile
          path: reading-world-cars-d-mobile.png
          if-no-files-found: ignore
# branch trigger v3
