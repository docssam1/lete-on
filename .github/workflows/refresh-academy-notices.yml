name: Refresh academy test and seminar notices

on:
  schedule:
    # KST 08:17, 14:17, 20:17. Public sources only; no AI API calls.
    - cron: '17 23,5,11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-academy-notices.yml'
      - 'highschool-selection/scripts/notice-monitor/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: academy-notice-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify branch rules and outage behavior
        run: python3 -m unittest discover -s highschool-selection/scripts/notice-monitor -p 'test_*.py'
      - name: Collect approved public notices
        run: python3 highschool-selection/scripts/notice-monitor/refresh.py
      - name: Publish only the generated notice feed
        id: publish
        run: |
          if git diff --quiet -- highschool-selection/data/academy-notices.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- highschool-selection/data/academy-notices.js
          git commit -m "chore(highselect): refresh academy test and seminar notices"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Bot pushes do not trigger push workflows. Explicit dispatch triggers the existing Pages release.
      - name: Deploy updated notice feed
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
