name: Verify CARS D Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-cars-d-data.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify CARS D lesson_content counts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('reading-world/app/store.js','utf8');
          const url = (src.match(/url:\s*'([^']+)'/)||[])[1];
          const key = (src.match(/key:\s*'([^']+)'/)||[])[1];
          if(!url || !key) throw new Error('Supabase public config not found');
          const endpoint = `${url}/rest/v1/lesson_content?book_id=eq.cars-level-d&select=lesson_id,original_passage,original_questions`;
          const r = await fetch(endpoint,{headers:{apikey:key,Authorization:`Bearer ${key}`}});
          if(!r.ok) throw new Error(`Supabase read failed: ${r.status}`);
          const rows = await r.json();
          const result = rows.map(row => {
            const p = Array.isArray(row.original_passage) ? row.original_passage.length : 0;
            const qraw = row.original_questions;
            const items = Array.isArray(qraw) ? qraw : (qraw && Array.isArray(qraw.items) ? qraw.items : []);
            const visual = qraw && qraw.meta && qraw.meta.visualQuestions ? Object.keys(qraw.meta.visualQuestions).length : 0;
            return {lesson_id:row.lesson_id,passage_parts:p,questions:items.length,visual};
          });
          console.log(JSON.stringify(result,null,2));
          if(rows.length !== 15) throw new Error(`Expected 15 lessons, found ${rows.length}`);
          const bad = result.filter(x => x.passage_parts < 1 || x.questions !== 12);
          if(bad.length) throw new Error(`Invalid lessons: ${bad.map(x=>x.lesson_id).join(', ')}`);
          const total = result.reduce((n,x)=>n+x.questions,0);
          console.log(`VERIFIED_LESSONS=${rows.length}`);
          console.log(`VERIFIED_QUESTIONS=${total}`);
          console.log('CARS_D_SOURCE_READY=true');
          NODE
