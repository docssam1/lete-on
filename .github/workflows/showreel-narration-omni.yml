name: Showreel Narration — OmniVoice (Numbers of Magic)

# 원장: "음성은 이제 omni보이스 사용해" (2026-09-26). 앱의 누미 목소리를 복제해 쇼릴 대본을 읽힌다.
# 비밀키를 쓰지 않는다(참조 음성은 공개 URL, 모델은 Hugging Face 공개 가중치). 결과 mp3 를 같은 브랜치에 커밋.
on:
  workflow_dispatch:
  push:
    paths:
      - 'number_magic/scripts/showreel/narration.json'
      - 'number_magic/scripts/showreel/narrate-omni.py'
      - '.github/workflows/showreel-narration-omni.yml'

concurrency:
  group: showreel-narration-omni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: torch(CPU) · OmniVoice 설치
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice soundfile librosa
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 내레이션 생성(누미 목소리 복제)
        run: python number_magic/scripts/showreel/narrate-omni.py
      - name: mp3 로 줄여 커밋
        run: |
          for f in number_magic/scripts/showreel/narration/*/n*.wav; do
            [ -e "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 128k "${f%.wav}.mp3" && rm "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add number_magic/scripts/showreel/narration
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "수의 마법 쇼릴 내레이션 — OmniVoice MP3 (자동 생성)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
