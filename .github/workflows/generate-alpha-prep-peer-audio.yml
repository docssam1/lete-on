name: Generate Alpha Prep peer audio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate only missing or changed peer audio
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-alpha-prep-peer-audio.js

      - name: R2에도 맞춰 두기(R2 열쇠가 없으면 건너뜀)
        uses: ./.github/actions/mirror-to-r2
        with:
          bucket: audio
          supabase-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
