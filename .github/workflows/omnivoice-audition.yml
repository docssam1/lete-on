# OmniVoice 음성 시청 — 귀로 듣고 정하기 위한 것 (2026-09-21)
#
# 원장 질문 "OmniVoice 쓰면 음성 비용 저렴해지나"에서 시작했다. 답은 "비용은 글자당
# 요금에서 계산 시간으로 바뀔 뿐 공짜가 아니다"였고, 대신 **Google 이 못 하는 일**
# (캐릭터마다 다른 목소리·선생님 목소리 복제)이 남았다. 그건 들어 봐야 정할 수 있다.
#
# 이 워크플로는 **운영을 건드리지 않는다**:
#   · 비밀키를 하나도 쓰지 않는다(Google·Supabase 둘 다)
#   · Supabase 에 올리지 않는다 — 결과는 artifact 로만 받는다
#   · 손으로 돌릴 때만 실행된다(workflow_dispatch)
#
# GPU 가 없는 러너라 CPU 로 돈다. 로그에 RTF(실시간 대비 배속)가 찍히므로, 운영에
# 쓸 만한지(=GPU 가 필요한지)를 그 숫자로 판단한다.
name: OmniVoice 음성 시청

on:
  workflow_dispatch:
    inputs:
      ref_audio:
        description: '목소리 복제용 참조 음성 경로(저장소 안, 3~10초 wav). 비우면 목소리 설계로 시청'
        required: false
        default: ''
      ref_text:
        description: '참조 음성의 대사(비우면 모델이 자동 전사)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CPU 전용 torch — 기본 wheel 은 CUDA 까지 받아 2 GB 가 넘는다.
      - name: torch(CPU) · OmniVoice 설치
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice soundfile

      # 입력을 ${{ }} 로 명령줄에 바로 박으면 셸 주입이 된다 — env 로 건네 셸이
      # 해석할 거리를 주지 않는다.
      - name: 시청용 음성 생성
        env:
          REF_AUDIO: ${{ inputs.ref_audio }}
          REF_TEXT: ${{ inputs.ref_text }}
        run: |
          python scripts/omnivoice-audition.py \
            --out audition \
            --device cpu \
            --ref "$REF_AUDIO" \
            --ref-text "$REF_TEXT"

      # wav 그대로 두면 한 파일이 수 MB 다 — 듣기만 할 것이니 mp3 로 줄여 함께 담는다.
      - name: mp3 로도 담기
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for f in audition/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 96k "${f%.wav}.mp3"
          done
          ls -la audition

      - uses: actions/upload-artifact@v4
        with:
          name: omnivoice-audition
          path: audition/
          retention-days: 14
