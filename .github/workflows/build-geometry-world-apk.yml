name: Build Geometry World APK

on:
  push:
    branches: [main, agent/geometry-world-apk]
    paths:
      - 'android/geometry-world/**'
      - '.github/workflows/build-geometry-world-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/geometry-world/**'
      - '.github/workflows/build-geometry-world-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle -p android/geometry-world :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp android/geometry-world/app/build/outputs/apk/debug/app-debug.apk \
            apk-output/GFIELD-Geometry-World-v1.0.0.apk
          sha256sum apk-output/GFIELD-Geometry-World-v1.0.0.apk \
            > apk-output/GFIELD-Geometry-World-v1.0.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFIELD-Geometry-World-APK
          path: apk-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to branch
        if: github.event_name == 'push'
        run: |
          mkdir -p android/geometry-world/releases
          cp apk-output/GFIELD-Geometry-World-v1.0.0.apk \
            android/geometry-world/releases/GFIELD-Geometry-World-v1.0.0.apk
          cp apk-output/GFIELD-Geometry-World-v1.0.0.sha256 \
            android/geometry-world/releases/GFIELD-Geometry-World-v1.0.0.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/geometry-world/releases
          if ! git diff --cached --quiet; then
            git commit -m 'build(android): publish Geometry World APK [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
