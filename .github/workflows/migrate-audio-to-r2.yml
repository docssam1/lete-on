name: Migrate audio to R2

# Supabase Storage `audio` → Cloudflare R2 복사. 손으로만 실행한다(푸시로는 돌지 않음).
# Supabase 쪽 파일은 지우지 않는다. 다시 돌려도 이미 옮긴 파일은 건너뛴다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "목록과 크기만 세기(올리지 않음)"
        type: boolean
        default: true
      bucket:
        description: "R2 버킷 이름"
        default: gfield-audio
      public_base:
        description: "공개 주소(예: https://audio.gfieldacademy.net). 비우면 확인 생략"
        default: ""

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @aws-sdk/client-s3@3
      - run: node scripts/migrate-audio-to-r2.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ inputs.bucket }}
          R2_PUBLIC_BASE: ${{ inputs.public_base }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
