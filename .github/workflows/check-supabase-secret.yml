name: Check Supabase Access

on:
  pull_request:
    paths:
      - '.github/workflows/check-supabase-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY_SECRET: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$SERVICE_ROLE" ]; then echo "SUPABASE_SERVICE_ROLE_KEY_PRESENT=true"; else echo "SUPABASE_SERVICE_ROLE_KEY_PRESENT=false"; fi
          if [ -n "$SUPABASE_KEY_SECRET" ]; then echo "SUPABASE_KEY_PRESENT=true"; else echo "SUPABASE_KEY_PRESENT=false"; fi
          if [ -n "$SUPABASE_URL_SECRET" ]; then echo "SUPABASE_URL_PRESENT=true"; else echo "SUPABASE_URL_PRESENT=false"; fi

      - name: Probe anonymous lesson_content write
        env:
          URL: https://fgahqumaldheqettmvqg.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImZnYWhxdW1hbGRoZXFldHRtdnFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NjAzNDcsImV4cCI6MjA5NzIzNjM0N30.iUXLFteDc_xIp_Xj506BKTxnZRYMObmTYQ2Dgh9RAqs
        run: |
          set +e
          PROBE="assistant-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BODY=$(printf '{"book_id":"__assistant_probe__","lesson_id":"%s","original_passage":["probe"],"original_questions":[]}' "$PROBE")
          CODE=$(curl -sS -o /tmp/probe.out -w '%{http_code}' \
            -X POST "$URL/rest/v1/lesson_content" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            -H 'Prefer: return=minimal' \
            --data "$BODY")
          echo "ANON_INSERT_HTTP=$CODE"
          if [ "$CODE" = "201" ] || [ "$CODE" = "204" ]; then
            echo "ANON_LESSON_CONTENT_WRITE=true"
            DEL=$(curl -sS -o /tmp/delete.out -w '%{http_code}' \
              -X DELETE "$URL/rest/v1/lesson_content?book_id=eq.__assistant_probe__&lesson_id=eq.$PROBE" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "ANON_CLEANUP_HTTP=$DEL"
          else
            echo "ANON_LESSON_CONTENT_WRITE=false"
            head -c 500 /tmp/probe.out || true
            echo
          fi
          exit 0
