name: Check Supabase Secret

on:
  pull_request:
    paths:
      - '.github/workflows/check-supabase-secret.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$SERVICE_ROLE" ]; then echo "SUPABASE_SERVICE_ROLE_KEY_PRESENT=true"; else echo "SUPABASE_SERVICE_ROLE_KEY_PRESENT=false"; fi
          if [ -n "$SUPABASE_KEY" ]; then echo "SUPABASE_KEY_PRESENT=true"; else echo "SUPABASE_KEY_PRESENT=false"; fi
          if [ -n "$SUPABASE_URL" ]; then echo "SUPABASE_URL_PRESENT=true"; else echo "SUPABASE_URL_PRESENT=false"; fi
