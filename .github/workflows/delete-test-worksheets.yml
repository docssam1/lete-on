name: Delete W36 test worksheets

# 일회용(2026-10-28, 원장 「지워」): nm-worksheets 버킷의 2026-W36 시험 PDF 5개만 Supabase Storage API 로 지운다.
# 표준 학습지(링크 화면)로 바뀌어 학생별 PDF 를 더 만들지 않는다. 지울 경로는 아래에 못 박았다 — 다른 파일은 건드리지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: 지우기
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -f -X DELETE "https://fgahqumaldheqettmvqg.supabase.co/storage/v1/object/nm-worksheets" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"prefixes":["2026-W36/15ac8e82.pdf","2026-W36/c140f242.pdf","2026-W36/e07b75a2.pdf","2026-W36/e07b75a2129ca510188e6b00.pdf","2026-W36/e0bd95a5.pdf"]}'
          echo
          echo "남은 파일:"
          curl -sS -f -X POST "https://fgahqumaldheqettmvqg.supabase.co/storage/v1/object/list/nm-worksheets" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"prefix":"2026-W36","limit":100}'
