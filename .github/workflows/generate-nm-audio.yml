name: Generate Numbers of Magic Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-nm-audio.yml'
      - 'number_magic/scripts/generate-nm-audio.js'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and upload Numbers of Magic MP3s
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: node number_magic/scripts/generate-nm-audio.js

      - name: Commit updated tts-map.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add number_magic/data/tts-map.js
          if git diff --cached --quiet; then
            echo "tts-map unchanged"
          else
            git commit -m "수의 마법 TTS 맵 갱신 (자동 생성)"
            git pull --rebase origin main
            git push origin main
          fi
