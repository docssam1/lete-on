name: Generate Numbers of Magic Audio

# 2026-09-29 — 원장: "복제음성으로 해. omni". 앱 음성은 이제 OmniVoice 복제(omnivoice-nm.yml ·
# scripts/local/omnivoice-nm.cmd)로 만든다. 푸시 때 구글로 자동 합성하던 것을 끄고 수동 실행만 남긴다
# (구글 map 은 복제의 참조이자, 복제가 아직 없는 줄의 대체 음성으로 그대로 쓰인다).
on:
  workflow_dispatch:

concurrency:
  group: numbers-of-magic-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and upload Numbers of Magic MP3s
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node number_magic/scripts/generate-nm-audio.js

      - name: Commit updated tts-map.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add number_magic/data/tts-map.js
          if git diff --cached --quiet; then
            echo "tts-map unchanged"
          else
            git commit -m "수의 마법 TTS 맵 갱신 (자동 생성)"
            git pull --rebase origin main
            git push origin main
          fi
