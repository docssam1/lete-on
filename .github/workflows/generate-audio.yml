name: Generate Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-audio.yml'
      - 'reading-world/data/lc*.js'
      - 'reading-world/data/lesson*.js'
      - 'reading-world/data/rp*.js'
      - 'reading-world/data/ws*.js'
      - 'reading-world/data/sl*.js'
      - 'reading-world/data/cd*.js'
      - 'reading-world/data/cars-d-engine.js'
      - 'scripts/generate-audio.js'
      - 'scripts/generate-cars-d-audio.js'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and upload CARS Plus Level D MP3s
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: node scripts/generate-cars-d-audio.js

      - name: Generate and upload existing Reading World MP3s
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: node scripts/generate-audio.js
