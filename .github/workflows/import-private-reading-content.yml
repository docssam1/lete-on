name: Import private reading content

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore encrypted import payloads
        env:
          BRICKS_1: ${{ secrets.BRICKS_250_IMPORT_1 }}
          BRICKS_2: ${{ secrets.BRICKS_250_IMPORT_2 }}
          BRICKS_3: ${{ secrets.BRICKS_250_IMPORT_3 }}
          BRICKS_4: ${{ secrets.BRICKS_250_IMPORT_4 }}
          BRICKS_5: ${{ secrets.BRICKS_250_IMPORT_5 }}
          BRICKS_6: ${{ secrets.BRICKS_250_IMPORT_6 }}
          VOCAB: ${{ secrets.VOCAB_WORKSHOP_IMPORT }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');

          function restore(name, chunks) {
            const encoded = chunks.join('');
            if (!encoded) throw new Error(`${name}: encrypted payload is missing`);
            const output = path.join(process.env.RUNNER_TEMP, name);
            fs.writeFileSync(output, zlib.gunzipSync(Buffer.from(encoded, 'base64')));
            console.log(`${name}: restored for this runner`);
          }

          restore('bricks-250.json', [
            process.env.BRICKS_1,
            process.env.BRICKS_2,
            process.env.BRICKS_3,
            process.env.BRICKS_4,
            process.env.BRICKS_5,
            process.env.BRICKS_6,
          ]);
          restore('vocabulary-workshop.json', [process.env.VOCAB]);
          NODE

      - name: Validate and import private rows
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/import-bricks-250-originals.js "$RUNNER_TEMP/bricks-250.json" --apply
          node scripts/import-vocabulary-workshop.js "$RUNNER_TEMP/vocabulary-workshop.json" --apply

      - name: Verify imported row counts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const expected = {
            'bricks-reading-250-2': 20,
            'bricks-reading-250-3': 20,
            'vocabulary-workshop-purple': 14,
            'vocabulary-workshop-red': 12,
          };
          const url = new URL('https://fgahqumaldheqettmvqg.supabase.co/rest/v1/lesson_content');
          url.searchParams.set('select', 'book_id,lesson_id');
          url.searchParams.set('book_id', `in.(${Object.keys(expected).join(',')})`);

          fetch(url, {
            headers: {
              apikey: process.env.SUPABASE_SERVICE_ROLE_KEY,
              Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}`,
            },
          }).then(async response => {
            if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
            const rows = await response.json();
            for (const [bookId, count] of Object.entries(expected)) {
              const actual = rows.filter(row => row.book_id === bookId).length;
              if (actual !== count) throw new Error(`${bookId}: expected ${count}, found ${actual}`);
              console.log(`${bookId}: ${actual} rows verified`);
            }
          }).catch(error => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE
