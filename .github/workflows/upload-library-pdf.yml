name: Upload Library PDF to Supabase Storage

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload PDF to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-library-pdf.js

      - name: R2에도 맞춰 두기(R2 열쇠가 없으면 건너뜀)
        uses: ./.github/actions/mirror-to-r2
        with:
          bucket: library-pdfs
          supabase-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
