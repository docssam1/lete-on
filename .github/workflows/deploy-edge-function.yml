name: Deploy edge function

# Supabase 서버 함수를 저장소의 코드 그대로 배포한다. 손으로만 실행한다(푸시로는 돌지 않음).
# 2026-10-28: weekly-notify 는 개인 계획용 번들(delivery-runtime.mjs, 444KB)과 함께 올라가야 해서
# 대화창의 배포 도구로는 보낼 수 없다 — 그래서 여기서 Supabase CLI 로 올린다(맥에서 하던 것과 같은 명령).
# 필요한 GitHub 비밀값: SUPABASE_ACCESS_TOKEN 또는 SUBBASE(원장이 2026-10-28 이 이름으로 넣음) — Supabase 계정 → Access Tokens 의 sbp_ 토큰. 없으면 아무것도 하지 않고 멈춘다.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "배포할 함수"
        type: choice
        options: [weekly-notify]
        default: weekly-notify

permissions:
  contents: read

concurrency:
  group: deploy-edge-${{ inputs.function }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 키 확인
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUBBASE }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "GitHub 비밀값 SUPABASE_ACCESS_TOKEN 이 없어 배포하지 않습니다."
            exit 1
          fi
      - name: 배포 전 검사(번들이 원본과 같은지 · 발송 모의 테스트)
        if: inputs.function == 'weekly-notify'
        run: |
          node scripts/build-nm-delivery-runtime.cjs --check
          node number_magic/scripts/check-notify-delivery.js
          node --test supabase/functions/weekly-notify/delivery.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: 배포
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUBBASE }}
        run: supabase functions deploy "${{ inputs.function }}" --project-ref fgahqumaldheqettmvqg --use-api
