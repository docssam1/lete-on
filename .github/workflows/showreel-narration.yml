name: Showreel Narration (Numbers of Magic)

# 쇼릴 내레이션 MP3 — 대본(narration.json)이나 생성기가 바뀌어 푸시되면 그 브랜치에서 돈다.
# 결과 MP3 를 같은 브랜치에 커밋해 돌려준다(작은 파일 몇십 개).
# 2026-09-26: 내레이션은 OmniVoice 로 바뀌었다(showreel-narration-omni.yml). 이 구글 판은 손으로만 돌린다 —
# 대본이 바뀔 때마다 두 엔진이 같이 돌며 과금되지 않게.
on:
  workflow_dispatch:
  # 2026-09-26: 원장 목소리 복제 참조가 수업 중간 녹음이라 말끝(~나타냈다)을 따라 해 반복됨 →
  # 깨끗한 참조를 받는 동안 쓸 예비 내레이션(Leda)을 v6 대본으로. 이 파일이 바뀔 때만 돈다.
  push:
    paths:
      - '.github/workflows/showreel-narration.yml'

concurrency:
  group: showreel-narration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate narration MP3s
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: node number_magic/scripts/showreel/narrate.js
      - name: Commit MP3s back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add number_magic/scripts/showreel/narration
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "수의 마법 쇼릴 내레이션 MP3 (자동 생성)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
