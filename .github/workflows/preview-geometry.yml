name: Preview Geometry on GitHub Pages

on:
  pull_request:
    paths:
      - 'geometry/**'
      - '.github/workflows/preview-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: geometry-pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}geometry/
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Stage preview site
        run: |
          mkdir -p _site/geometry
          cp -R geometry/. _site/geometry/

          if [ -d reading-world ]; then
            mkdir -p _site/reading-world
            cp -R reading-world/. _site/reading-world/
          fi

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>GFIELD Preview</title>
              <style>
                body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f0e5; color: #33281d; }
                main { width: min(92vw, 520px); padding: 28px; border-radius: 24px; background: white; box-shadow: 0 18px 50px rgba(70, 48, 27, .14); }
                h1 { margin-top: 0; }
                a { display: block; margin-top: 14px; padding: 16px 18px; border-radius: 16px; background: #8f673c; color: white; text-decoration: none; font-weight: 700; text-align: center; }
              </style>
            </head>
            <body>
              <main>
                <h1>GFIELD 미리보기</h1>
                <p>병합 전 휴대폰에서 기능을 확인하는 페이지입니다.</p>
                <a href="./geometry/">똑같이 쌓기 열기</a>
              </main>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
