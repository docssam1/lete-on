<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>학습지</title>
<!-- 단문(SMS 90바이트) 문자용 짧은 링크 (2026-09-06, 원장: "단문 문자로 간단히, 비용 아끼자").
     저장소 루트 /w/ 에 두는 이유: 단문 90바이트 안에 링크를 넣으려면 한 글자가 아쉽다(number_magic/ 경로면 13바이트 초과).
     형식: /w/?YYWW.과정.회차[L] → 표준 학습지(2026-10-28~, 문자가 보내는 기본 형식). L = 1.25배. 예 ?2644.C4.3
           /w/?YYWW.TOKEN   → Storage 의 주간 학습지 PDF 로 이동(2026-W36 시험분만 남음, 더 만들지 않음)
           /w/?YYWW.COURSE  → number_magic/ws.html 웹 학습지(PDF 가 없을 때 폴백). COURSE-2 = 주 2회반 두 번째 회차
     예)  ?2636.e07b75a2129c  →  https://fgahqumaldheqettmvqg.supabase.co/storage/v1/object/public/nm-worksheets/2026-W36/e07b75a2129c.pdf
          ?2636.C4            →  ../ws.html?w=2026-W36&c=C4
     토큰은 HMAC 앞 8자(scripts/nm-weekly-worksheets.cjs). 라이선스 원문 없음. -->
<style>body{font-family:system-ui,sans-serif;padding:24px;color:#444}a{color:#2f6f4e}</style>
</head><body>
<p id="m">학습지를 여는 중…</p>
<script src="../number_magic/app/delivery-plan.js?v=20261026-personal2"></script>
<script>
(async function(){
  var q = (location.search || '').replace(/^\?/, '').trim();
  var shared = new URLSearchParams(location.search).get('m');
  if(shared !== null){
    var message=document.getElementById('m');
    if(!/^[0-9a-f]{32}$/.test(shared)){message.textContent='학습지 주소를 확인해 주세요.';return;}
    try{
      var response=await fetch('https://fgahqumaldheqettmvqg.supabase.co/functions/v1/nm-membership',{
        method:'POST',headers:{'Content-Type':'application/json',apikey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnYWhxdW1hbGRoZXFldHRtdnFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NjAzNDcsImV4cCI6MjA5NzIzNjM0N30.iUXLFteDc_xIp_Xj506BKTxnZRYMObmTYQ2Dgh9RAqs'},body:JSON.stringify({action:'resolve_worksheet',token:shared})
      });
      var result=await response.json(),cfg=result.config;
      if(!response.ok||!cfg||!/^C(?:[0-6]?\d|7[0-3])$/.test(cfg.courseKey)||!/^\d{4}-W(?:0[1-9]|[1-4]\d|5[0-3])$/.test(cfg.week)||![1,2].includes(cfg.k)||![0.7,0.85,1,1.25,1.5].includes(cfg.amount)||!['w1','w2'].includes(cfg.cadence)||!Number.isInteger(cfg.sessionIndex)||cfg.sessionIndex<1||cfg.sessionIndex>1000)throw new Error('invalid_link');
      var destination=new URL('../number_magic/ws.html',location.href);
      destination.search=new URLSearchParams({c:cfg.courseKey,w:cfg.week,k:String(cfg.k),cad:cfg.cadence,amt:String(cfg.amount),s:String(cfg.sessionIndex),p:'1',auto:'0'}).toString();
      if(Object.prototype.hasOwnProperty.call(cfg,'deliveryPlanVersion')||Object.prototype.hasOwnProperty.call(cfg,'learningPlan')){
        var plan=window.NM_DELIVERY_PLAN&&NM_DELIVERY_PLAN.fromConfig(cfg);
        if(!plan)throw new Error('invalid_personal_link');
        destination.searchParams.set('dp',NM_DELIVERY_PLAN.encode(plan));
        destination.searchParams.set('dv',cfg.deliveryPlanVersion);
      }else if(cfg.highPlanVersion!=null){
        if(!NM_DELIVERY_PLAN.managedVersion(cfg.courseKey,cfg.highPlanVersion))throw new Error('invalid_managed_version');
        destination.searchParams.set('hp','1');
        destination.searchParams.set('highPlanVersion',cfg.highPlanVersion);
        if(typeof cfg.highStartDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(cfg.highStartDate)&&Number.isFinite(Date.parse(cfg.highStartDate+'T00:00:00Z'))&&new Date(cfg.highStartDate+'T00:00:00Z').toISOString().slice(0,10)===cfg.highStartDate){
          destination.searchParams.set('hs',cfg.highStartDate);
          if([0.7,0.85,1,1.25,1.5].includes(cfg.highSpeed))destination.searchParams.set('hv',String(cfg.highSpeed));
        }
      }
      message.textContent='맞춤 학습지를 여는 중…';location.replace(destination.href);
    }catch(e){message.textContent='학습지 링크가 만료되었거나 연결하지 못했어요. 학원에 새 링크를 요청해 주세요.';}
    return;
  }
  var el = document.getElementById('m'), url;
  /* 표준 학습지(2026-10-28): YYWW.과정.회차[L] — 같은 과정·회차는 누구에게나 같은 문항, L = 양 늘린 판(1.25배).
     주차는 표지의 「몇월 몇주차」 글자에만 쓰인다. 예: 2644.C4.3 · 2644.C38.2L */
  var sr = /^(\d{2})(\d{2})\.([A-Za-z0-9]+)\.(\d{1,3})(L?)$/.exec(q);
  if(sr){
    url = '../number_magic/ws.html?w=20' + sr[1] + '-W' + sr[2] + '&c=' + encodeURIComponent(sr[3]) + '&r=' + sr[4] + (sr[5] ? '&amt=1.25' : '');
    el.innerHTML = '열리지 않으면 <a href="' + url + '">여기</a>를 눌러 주세요.';
    location.replace(url);
    return;
  }
  var m = /^(\d{2})(\d{2})\.([A-Za-z0-9_-]+)$/.exec(q);
  if(!m){ el.textContent = '주소가 올바르지 않아요.'; return; }
  var week = '20' + m[1] + '-W' + m[2], part = m[3];
  if(/^[0-9a-f]{8,}$/.test(part)){
    url = 'https://fgahqumaldheqettmvqg.supabase.co/storage/v1/object/public/nm-worksheets/' + week + '/' + part + '.pdf';
  }else{
    var ck = /^(.+)-(\d)$/.exec(part); // 'C4-2' = 주 2회반 두 번째 회차
    url = '../number_magic/ws.html?w=' + week + '&c=' + encodeURIComponent(ck ? ck[1] : part) + (ck ? '&k=' + ck[2] : '');
  }
  el.innerHTML = '열리지 않으면 <a href="' + url + '">여기</a>를 눌러 주세요.';
  location.replace(url);
})();
</script>
</body></html>
