<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CARS D 연결 점검</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17231d;background:#f4f1e7}
*{box-sizing:border-box} body{margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.head h1{margin:0;font-size:28px}.head p{margin:7px 0 0;color:#657069}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:#2f9466;color:white;text-decoration:none}.btn.secondary{background:white;color:#34433b;border:1px solid #d5dbd6}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.stat{background:#fff;border:1px solid #dedfd9;border-radius:16px;padding:15px}.stat b{display:block;font-size:26px}.stat span{color:#68746d;font-size:13px}.tablewrap{overflow:auto;background:#fff;border-radius:18px;border:1px solid #dfe0db}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 10px;border-bottom:1px solid #ecece8;text-align:left;font-size:14px}th{background:#f8f8f5;position:sticky;top:0}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-weight:800;font-size:12px}.ok{background:#e6f6ed;color:#147348}.bad{background:#fde9e7;color:#a43830}.wait{background:#fff3d9;color:#8c6815}.muted{color:#7b847f}.note{margin-top:14px;color:#657069;font-size:13px;line-height:1.6}@media(max-width:700px){body{padding:14px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.head h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>CARS Plus D · 연결 점검</h1><p>cd1~cd15의 비공개 원문, 12문항, 개별 삽화, 특수 메타를 확인합니다.</p></div>
    <div class="actions"><button id="retry" class="btn">다시 검사</button><a class="btn secondary" href="./">Reading World</a></div>
  </div>
  <div class="summary">
    <div class="stat"><b id="srcCount">–</b><span>원문 연결</span></div>
    <div class="stat"><b id="qCount">–</b><span>12문항 정상</span></div>
    <div class="stat"><b id="imgCount">–</b><span>삽화 정상</span></div>
    <div class="stat"><b id="readyCount">–</b><span>완전 준비</span></div>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>Lesson</th><th>구분</th><th>원문</th><th>문항</th><th>삽화</th><th>특수 구조</th><th>상태</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="muted">검사 중…</td></tr></tbody>
  </table></div>
  <div class="note">이 페이지는 교재 원문을 화면에 표시하지 않습니다. 원문은 Supabase <code>lesson_content</code>에서 존재 여부와 개수만 확인하고, 공개 Git에는 저장하지 않습니다. cd12 포스터와 cd7 연대표는 이미지가 아닌 live HTML 구조를 정상 상태로 간주합니다.</div>
</div>
<script src="data/cars-d-layouts.js?v=51"></script>
<script src="app/store.js?v=51"></script>
<script>
(function(){
  const rows=document.getElementById('rows');
  const retry=document.getElementById('retry');
  const lessons=(window.CARS_D_LAYOUTS&&window.CARS_D_LAYOUTS.lessons)||{};
  const ids=Array.from({length:15},(_,i)=>'cd'+(i+1));
  const pill=(text,kind)=>`<span class="pill ${kind}">${kind==='ok'?'✓':kind==='bad'?'!':'…'} ${text}</span>`;
  const label=(id)=>{const n=Number(id.slice(2));return n<=5?`Pretest ${n}`:n<=10?`Benchmark ${n-5}`:`Post Test ${n-10}`};
  function questionItems(raw){if(Array.isArray(raw))return raw;if(raw&&typeof raw==='object'){if(Array.isArray(raw.items))return raw.items;if(Array.isArray(raw.questions))return raw.questions;}return []}
  function questionMeta(raw){if(raw&&typeof raw==='object'&&!Array.isArray(raw))return raw.meta||raw.layout||{};return {}}
  async function checkImage(src){if(!src)return true;try{const r=await fetch(src,{cache:'no-store'});return r.ok}catch(e){return false}}
  function mediaSources(cfg){const media=((cfg||{}).original||{}).media||[];return media.filter(m=>m&&m.src).map(m=>m.src)}
  function specialExpected(cfg){return Object.values((cfg||{}).questions||{}).some(q=>q&&q.type&&q.type!=='standard')}
  async function inspect(id){
    const cfg=lessons[id]||{};
    let source=null, sourceError=false;
    try{source=await Store.pullOriginal('cars-level-d',id)}catch(e){sourceError=true}
    const passage=source&&Array.isArray(source.passage)?source.passage:[];
    const rawQ=source&&source.questions;
    const items=questionItems(rawQ);
    const meta=questionMeta(rawQ);
    const sources=mediaSources(cfg);
    const imgs=await Promise.all(sources.map(checkImage));
    const imageOK=imgs.every(Boolean);
    const sourceOK=passage.length>0;
    const questionsOK=items.length===12;
    const needsSpecial=specialExpected(cfg);
    const visualCount=meta&&meta.visualQuestions?Object.keys(meta.visualQuestions).length:0;
    const specialOK=!needsSpecial||visualCount>0;
    const ready=sourceOK&&questionsOK&&imageOK&&specialOK;
    return {id,sourceOK,sourceError,passageCount:passage.length,questionsOK,qLen:items.length,imageOK,imgTotal:sources.length,imgOK:imgs.filter(Boolean).length,needsSpecial,visualCount,specialOK,ready};
  }
  async function run(){
    retry.disabled=true; retry.textContent='검사 중…'; rows.innerHTML='<tr><td colspan="7" class="muted">Supabase와 삽화 파일을 검사하고 있습니다…</td></tr>';
    const result=[];
    for(const id of ids){result.push(await inspect(id));}
    rows.innerHTML=result.map(r=>`<tr>
      <td><b>${r.id}</b></td><td>${label(r.id)}</td>
      <td>${r.sourceOK?pill(`${r.passageCount}문단`,'ok'):pill(r.sourceError?'접근 오류':'없음','bad')}</td>
      <td>${r.questionsOK?pill('12문항','ok'):pill(`${r.qLen}문항`,'bad')}</td>
      <td>${r.imageOK?pill(r.imgTotal?`${r.imgOK}/${r.imgTotal}`:'HTML','ok'):pill(`${r.imgOK}/${r.imgTotal}`,'bad')}</td>
      <td>${r.needsSpecial?(r.specialOK?pill(`${r.visualCount}개 메타`,'ok'):pill('메타 없음','bad')):pill('일반','ok')}</td>
      <td>${r.ready?pill('준비 완료','ok'):pill('확인 필요','bad')}</td>
    </tr>`).join('');
    document.getElementById('srcCount').textContent=`${result.filter(x=>x.sourceOK).length}/15`;
    document.getElementById('qCount').textContent=`${result.filter(x=>x.questionsOK).length}/15`;
    document.getElementById('imgCount').textContent=`${result.filter(x=>x.imageOK).length}/15`;
    document.getElementById('readyCount').textContent=`${result.filter(x=>x.ready).length}/15`;
    retry.disabled=false; retry.textContent='다시 검사';
  }
  retry.addEventListener('click',run); run();
})();
</script>
</body></html>
